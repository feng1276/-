body{

    padding:0;

    height:100%;
    overflow-x:hidden;

}
body::-webkit-scrollbar{
    display:none;
}

.hero{
    position:relative;
    min-height:100vh;
    overflow:visible;
}

.hero::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        radial-gradient(circle, rgba(255,255,255,.8) 1px, transparent 1px);
    background-size:40px 40px;
    opacity:.4;
}

.hero::after{
    display:none;
}

.hero-content{
    position:relative;
    z-index:2;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:white;
    text-align:center;
}

.logo{
    font-size:88px;
    font-weight:900;
    color:#9f88ff;
    letter-spacing:4px;
    text-shadow:
        0 0 10px rgba(155,125,255,.7),
        0 0 30px rgba(120,80,255,.6);
}

.logo img{
    max-width:100%;
    height:auto;
    max-height:150px;
    filter: none;
}

.version{
    margin-top:10px;
    font-size:42px;
    font-weight:800;
}

.sub{
    margin-top:10px;
    color:#d4d4d4;
    font-size:16px;
}

.top-buttons{
    margin-top:20px;
    display:flex;
    gap:8px;
}

.top-buttons button{
    background:transparent;
    border:none;
    color:white;
    padding:8px 16px;
    cursor:pointer;
    transition:.3s;
}

.top-buttons button:hover{
    background:rgba(255,255,255,.15);
    border-radius:8px;
}

.content-area{
    margin-top:20px;
    background:#fff;
    width:100%;
    min-height:19000px;
    border-radius:0;
    overflow:visible;
    position:relative;
}


@media(max-width:1200px){
    .logo{
        font-size:60px;
    }

    .logo img{
        max-height:100px;
    }
}

/* ========== 角色卡片样式 ========== */
.avatar-card-container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    padding:4px;
    width:100%;
}

.avatar-card{
    background-color:#27363E;
    border-radius:6px;
    min-height:490px;
    margin:4px;
    width:calc(20% - 8px);
    overflow:hidden;
    flex-shrink:0;
    flex-grow:0;
    color:#eee;
    text-align:center;
    cursor:pointer;
    transition:0.1s;
}
.avatar-card:hover{
    transform:translate(-5px,-5px);
    box-shadow:8px 8px 20px rgba(0,0,0,0.5);
}

.avatar-card .avatar-head{
    width:45%;
    height:auto;
    max-height:240px;
    object-fit:contain;
    display:block;
    margin:18px auto 14px;
}

.avatar-card .avatar-name{
    font-size:24px;
    font-weight:bold;
    margin:4px 0 10px;
}

.avatar-card .avatar-title{
    font-size:20px;
    color:#EEEEEE;
    margin-bottom:18px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.avatar-card .avatar-ver{
    color:#EEEEEE;
    font-size:24px;
    font-weight:bold;
    margin-top:15px;
    margin-bottom:2px;
}

.avatar-card .avatar-icons{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin:18px 0;
}

.avatar-card .avatar-icons img{
    width:54px;
    height:auto;
    object-fit:contain;
}

.avatar-card .avatar-stats{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    font-size:18px;
    color:#EEEEEE;
    flex-wrap:wrap;
}

.avatar-card .avatar-stats .stat-item{
    display:flex;
    align-items:center;
    gap:4px;
}

.avatar-card .avatar-stats .stat-item img{
    width:38px;
    height:auto;
    object-fit:contain;
}

/* 响应式 — 匹配星穹铁道 */
@media screen and (min-width:1001px){
    .avatar-card{ width:calc(20% - 8px); }
}
@media screen and (min-width:801px) and (max-width:1000px){
    .avatar-card{ width:calc(25% - 8px); }
}
@media screen and (min-width:501px) and (max-width:800px){
    .avatar-card{ width:calc(33.33% - 8px); }
}
@media screen and (max-width:500px){
    .avatar-card{
        width:calc(50% - 8px);
        min-height:auto;
    }
    .avatar-card .avatar-name{ font-size:16px; }
    .avatar-card .avatar-title{ font-size:13px; }
    .avatar-card .avatar-ver{ font-size:16px; }
    .avatar-card .avatar-icons img{ width:30px; }
    .avatar-card .avatar-stats{ font-size:13px; gap:6px; }
    .avatar-card .avatar-stats .stat-item img{ width:24px; }
}

/* ===== 分页卡片容器 ===== */
.card-section {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
}

/* ===== 武器/圣遗物卡片容器 ===== */
.weapon-card-container, .relic-card-container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    padding:4px;
    width:100%;
}

/* ===== 武器卡片样式 ===== */
.weapon-card{
    background-color:#27363E;
    border-radius:6px;
    min-height:360px;
    margin:4px;
    width:calc(20% - 8px);
    overflow:hidden;
    flex-shrink:0;
    flex-grow:0;
    color:#eee;
    text-align:center;
    cursor:pointer;
    transition:0.1s;
    padding:18px 12px;
    word-break:break-all;
}
.weapon-card:hover{
    transform:translate(-5px,-5px);
    box-shadow:8px 8px 20px rgba(0,0,0,0.5);
}
.weapon-card > img{width:58%;height:auto;max-height:200px;object-fit:contain;margin:0 auto 14px;display:block;}
.weapon-card .avatar-name{font-size:24px;font-weight:bold;margin:0 0 14px;}
.weapon-card .avatar-title2{font-size:20px;color:#EEEEEE;margin:0 0 10px;display:flex;align-items:center;justify-content:center;gap:4px;}
.weapon-card .weapon-atk{width:26px;height:auto;vertical-align:middle;}

/* ===== 圣遗物卡片样式 ===== */
.relic-card{
    background-color:#27363E;
    border-radius:6px;
    min-height:520px;
    margin:4px;
    width:calc(33.33% - 8px);
    overflow:hidden;
    flex-shrink:0;
    flex-grow:0;
    color:#eee;
    text-align:center;
    cursor:pointer;
    transition:0.1s;
    padding:18px 12px;
    word-break:break-all;
}
.relic-card:hover{
    transform:translate(-5px,-5px);
    box-shadow:8px 8px 20px rgba(0,0,0,0.5);
}
.relic-card > img{
    width:65%;
    height:auto;
    max-height:180px;
    object-fit:contain;
    display:block;
    margin:0 auto;
}
.relic-card .relic-id{
    font-size:17px;
    color:#EEEEEE;
    margin:8px 0 8px 0;
    font-weight:bold;
}
.relic-card h3{

}
.relic-card .relic-text{

}

// 按版本号降序排列
characterData.sort(function(a,b){
    function parseVer(v){
        var parts = v.split('v');
        var main = parts[0].split('.');
        var major = parseInt(main[0]) || 0;
        var minor = parseInt(main[1]) || 0;
        var patch = parseInt(parts[1]) || 0;
        return major * 10000 + minor * 100 + patch;
    }
    return parseVer(b.ver) - parseVer(a.ver);
});

    {id:15041,name:"穹境示现之夜",rarity:5,icon:"15041_4",set2:"元素精通提高80点。",set4:"队伍中附近的角色触发月曜反应时，若装备者在场上，将获得持续4秒的「月辉明光·蓄念」效果：队伍的月兆为初辉/满辉时，暴击率提升15%/30%。队伍中的角色每拥有一种不同的「月辉明光」效果，队伍中的所有角色触发的月曜反应造成的伤害提升10%。由「月辉明光」产生的效果无法叠加。"},
    {id:15040,name:"深廊终曲",rarity:5,icon:"15040_4",set2:"获得15%冰元素伤害加成。",set4:"装备者的元素能量为0时，普通攻击造成的伤害提升60%，元素爆发造成的伤害提升60%。装备者的普通攻击造成伤害后，上述元素爆发伤害提升效果将失效6秒；装备者的元素爆发造成伤害后，上述普通攻击伤害提升效果将失效6秒。角色处于队伍后台也能触发。"},
    {id:15039,name:"长夜之誓",rarity:5,icon:"15039_4",set2:"下落攻击造成的伤害提升25%。",set4:"装备者的下落攻击/重击/元素战技命中敌人后，获得1/2/2层「永照的流辉」，由下落攻击、重击或元素战技产生的该效果分别每1秒至多触发一次。永照的流辉：下落攻击造成的伤害提升15%，持续6秒，至多叠加5层，每层持续时间独立计算。"},
    {id:15038,name:"黑曜秘典",rarity:5,icon:"15038_4",set2:"装备者处于夜魂加持状态，并且在场上时，造成的伤害提高15%。",set4:"装备者在场上消耗1点夜魂值后，暴击率提高40%，持续6秒。该效果每1秒至多触发一次。"},
    {id:15037,name:"烬城勇者绘卷",rarity:5,icon:"15037_4",set2:"队伍中附近的角色触发「夜魂迸发」时，装备者恢复6点元素能量。",set4:"装备者触发其对应元素类型的相关反应后，队伍中附近的所有角色的该元素反应相关的元素伤害加成提升12%，持续15秒。若触发该效果时，装备者处于夜魂加持状态下，还将使队伍中附近的所有角色的与该元素反应相关的元素伤害加成提升28%，持续20秒。装备者处于后台时也能触发上述效果。同名圣遗物套装产生的伤害加成效果无法叠加。"},
    // ===== ID 15036-15027 =====
    {id:15036,name:"未竟的遐思",rarity:5,icon:"15036_4",set2:"攻击力提高18%。",set4:"脱离战斗状态3秒后，造成的伤害提升50%。在战斗状态下，附近不存在处于燃烧状态下的敌人超过6秒后，上述伤害提升效果每秒降低10%，直到降低至0%；存在处于燃烧状态下的敌人时，每秒提升10%，直到达到50%。装备此圣遗物套装的角色处于队伍后台时，依然会触发该效果。"},
    {id:15035,name:"谐律异想断章",rarity:5,icon:"15035_4",set2:"攻击力提高18%。",set4:"生命之契的数值提升或降低时，角色造成的伤害提升18%，该效果持续6秒，至多叠加3次。"},
    {id:15034,name:"回声之林夜话",rarity:5,icon:"15034_4",set2:"攻击力提高18%。",set4:"施放元素战技后的10秒内，岩元素伤害加成提升20%；若处于结晶反应产生的护盾庇护下，或附近存在月结晶反应产生的月笼，上述效果提高150%，进一步提高的效果将在不满足上述条件的1秒后移除。"},
    {id:15033,name:"昔时之歌",rarity:5,icon:"15033_4",set2:"治疗加成提高15%。",set4:"装备者对队伍中的角色进行治疗时，将产生持续6秒的渴盼效果，记录治疗的生命值回复量（包括溢出值）。持续时间结束时，渴盼效果将转变为「彼时的浪潮」效果：队伍中自己的当前场上角色的普通攻击、重击、下落攻击、元素战技与元素爆发命中敌人时，将基于渴盼效果所记录的回复量的8%提高造成的伤害，「彼时的浪潮」将在生效5次或10秒后移除。一次渴盼效果至多记录15000点回复量，同时至多存在一个，能够记录多个装备者的产生的回复量；装备者处于队伍后台时，依然能触发该效果。"},
    {id:15032,name:"黄金剧团",rarity:5,icon:"15032_4",set2:"元素战技造成的伤害提升20%。",set4:"元素战技造成的伤害提升25%；此外，处于队伍后台时，元素战技造成的伤害还将进一步提升25%，该效果将在登场后2秒移除。"},
    {id:15031,name:"逐影猎人",rarity:5,icon:"15031_4",set2:"普通攻击与重击造成的伤害提高15%。",set4:"当前生命值提升或降低时，暴击率提升12%，该效果持续5秒，至多叠加3次。"},
    {id:15030,name:"花海甘露之光",rarity:5,icon:"15030_4",set2:"生命值提升20%。",set4:"元素战技与元素爆发造成的伤害提升10%；装备者受到伤害后的5秒内，上述伤害提升效果提高80%，该提高效果至多叠加5层，每层持续时间独立计算，处于队伍后台时依然能触发该效果。"},
    {id:15029,name:"水仙之梦",rarity:5,icon:"15029_4",set2:"获得15%水元素伤害加成。",set4:"普通攻击、重击、下落攻击、元素战技或元素爆发命中敌人后，将产生1层持续8秒的「镜中水仙」效果。处于1/2/3层及以上「镜中水仙」效果下时，攻击力将提高7%/16%/25%，水元素伤害加成提升4%/9%/15%。由普通攻击、重击、下落攻击、元素战技或元素爆发产生的「镜中水仙」将分别独立存在。"},
    {id:15028,name:"乐园遗落之花",rarity:5,icon:"15028_4",set2:"元素精通提高80点。",set4:"装备者绽放、超绽放、烈绽放反应造成的伤害提升40%，造成的月绽放反应伤害提升10%。此外，装备者触发绽放、超绽放、烈绽放、月绽放后，上述效果带来的加成提升25%，该效果持续10秒，至多叠加4次，每1秒至多触发一次。装备者处于队伍后台时依然能触发该效果。"},
    {id:15027,name:"沙上楼阁史话",rarity:5,icon:"15027_4",set2:"获得15%风元素伤害加成。",set4:"重击命中敌人后，该角色的普通攻击速度提升10%，普通攻击、重击与下落攻击造成的伤害提升40%，持续15秒。"},
    // ===== ID 15026-15014 =====
    {id:15026,name:"饰金之梦",rarity:5,icon:"15026_4",set2:"元素精通提高80点。",set4:"触发元素反应后的8秒内，装备者会根据队伍内其他角色的元素类型，获得对应的强化：每有一名与装备者元素类型相同的角色，攻击力提升14%；每有一名与装备者元素类型不同的角色，元素精通提升50点。上述每类效果至多计算3名角色。该效果每8秒至多触发一次。装备者处于队伍后台时，依然能触发该效果。"},
    {id:15025,name:"深林的记忆",rarity:5,icon:"15025_4",set2:"获得15%草元素伤害加成。",set4:"元素战技或元素爆发命中敌人后，使命中目标的草元素抗性降低30%，持续8秒。装备者处于队伍后台时，依然能触发该效果。"},
    {id:15024,name:"来歆余响",rarity:5,icon:"15024_4",set2:"攻击力提高18%。",set4:"普通攻击命中敌人时，有36%概率触发「幽谷祝祀」：普通攻击造成的伤害提高，伤害提高值为攻击力的70%，该效果将在普通攻击造成伤害后的0.05秒后清除。普通攻击未触发「幽谷祝祀」时，会使下次触发概率提升20%；0.2秒内至多判定1次触发与否。"},
    {id:15023,name:"辰砂往生录",rarity:5,icon:"15023_4",set2:"攻击力提高18%。",set4:"施放元素爆发后，将产生持续16秒的「潜光」效果：攻击力提升8%；并在角色的生命值降低时，攻击力进一步提升10%，至多通过这种方式提升4次，每0.8秒至多触发一次。「潜光」效果将在角色退场时消失。"},
    {id:15022,name:"海染砗磲",rarity:5,icon:"15022_4",set2:"治疗加成提高15%。",set4:"装备此圣遗物套装的角色对队伍中的角色进行治疗时，将产生持续3秒的海染泡沫，记录治疗的生命值回复量（包括溢出值）。持续时间结束时，海染泡沫将会爆炸，对周围的敌人造成90%累计回复量的伤害。每3.5秒至多产生一个海染泡沫；海染泡沫至多记录30000点回复量。"},
    {id:15021,name:"华馆梦醒形骸记",rarity:5,icon:"15021_4",set2:"防御力提高30%。",set4:"装备此圣遗物套装的角色在以下情况下，将获得「问答」效果：在场上用岩元素攻击命中敌人后获得一层，每0.3秒至多触发一次；在队伍后台中，每3秒获得一层。问答至多叠加4层，每层能提供6%防御力与6%岩元素伤害加成。每6秒，若未获得问答效果，将损失一层。"},
    {id:15020,name:"绝缘之旗印",rarity:5,icon:"15020_4",set2:"元素充能效率提高20%。",set4:"基于元素充能效率的25%，提高元素爆发造成的伤害。至多通过这种方式获得75%提升。"},
    {id:15019,name:"追忆之注连",rarity:5,icon:"15019_4",set2:"攻击力提高18%。",set4:"施放元素战技时，如果角色的元素能量高于或等于15点，则会流失15点元素能量，使接下来的10秒内，普通攻击、重击、下落攻击造成的伤害提高50%，持续期间内该效果不会再次触发。"},
    {id:15018,name:"苍白之火",rarity:5,icon:"15018_4",set2:"造成的物理伤害提高25%。",set4:"元素战技命中敌人后，攻击力提升9%。该效果持续7秒，至多叠加2层，每0.3秒至多触发一次。叠满2层时，2件套的效果提升100%。"},
    {id:15017,name:"千岩牢固",rarity:5,icon:"15017_4",set2:"生命值提升20%。",set4:"元素战技命中敌人后，使队伍中附近的所有角色攻击力提升20%，护盾强效提升30%，持续3秒。该效果每0.5秒至多触发一次。装备此圣遗物套装的角色处于队伍后台时，依然能触发该效果。"},
    {id:15016,name:"沉沦之心",rarity:5,icon:"15016_4",set2:"获得15%水元素伤害加成。",set4:"施放元素战技后的15秒内，普通攻击与重击造成的伤害提高30%。"},
    {id:15015,name:"逆飞的流星",rarity:5,icon:"15015_4",set2:"护盾强效提高35%。",set4:"处于护盾庇护下时，额外获得40%普通攻击和重击伤害加成。"},
    {id:15014,name:"悠古的磐岩",rarity:5,icon:"15014_4",set2:"获得15%岩元素伤害加成。",set4:"获得结晶反应形成的晶片或触发月结晶反应时，队伍中所有角色获得35%对应元素伤害加成，持续10秒。同时只能通过该效果获得一种元素伤害加成。"},

    {id:15003,name:"流浪大地的乐团",rarity:5,icon:"15003_4",set2:"元素精通提高80点。",set4:"装备该圣遗物套装的角色为法器、弓箭角色时，角色重击造成的伤害提高35%。"},
    {id:15002,name:"翠绿之影",rarity:5,icon:"15002_4",set2:"获得15%风元素伤害加成。",set4:"扩散反应造成的伤害提升60%。根据扩散的元素类型，降低受到影响的敌人40%的对应元素抗性，持续10秒。"},
    {id:15001,name:"角斗士的终幕礼",rarity:5,icon:"15001_4",set2:"攻击力提高18%。",set4:"装备该圣遗物套装的角色为单手剑、双手剑、长柄武器角色时，角色普通攻击造成的伤害提高35%。"},

    {id:10012,name:"学士",rarity:5,icon:"10012_4",set2:"元素充能效率提高20%。",set4:"获得元素微粒或元素晶球时，队伍中所有弓箭和法器角色额外恢复3点元素能量。该效果每3秒只能触发一次。"},
    {id:10011,name:"幸运儿",rarity:4,icon:"10011_4",set2:"防御力提高100点。",set4:"拾取摩拉时，恢复300点生命值。"},

    {id:10008,name:"赌徒",rarity:5,icon:"10008_4",set2:"元素战技造成的伤害提升20%。",set4:"击败敌人时，有100%概率清除元素战技的冷却时间。该效果每15秒至多触发一次。"},

    {id:10004,name:"奇迹",rarity:5,icon:"10004_4",set2:"所有元素抗性提高20%。",set4:"受到某个元素类型的伤害后，相应的抗性提升30%，持续10秒。该效果每10秒只能触发一次。"},

// 渲染角色卡片（只执行一次，渲染全部角色到DOM）
function renderAllCharacterCards(){

    characterData.forEach(function(c){
        var color = elementColors[c.element] || '#eee';
        var imgSrc = c.icon ? 'https://cdn.jsdelivr.net/gh/feng1276/YuanShen@main/GenshinLihw/UI_AvatarIcon_' + c.icon + '.webp' : '';
        html += '<div class="avatar-card" data-id="'+c.id+'" data-rarity="'+c.rarity+'" data-elem="'+c.element+'" data-type="'+c.weapon+'">';
        html += '<div class="avatar-ver">'+c.ver+'</div>';
        html += '<img class="avatar-head" src="'+imgSrc+'" alt="'+c.name+'" onerror="this.style.display=\'none\'" loading="lazy">';

        html += '<img src="'+elementIcons[c.element]+'" alt="'+elementNames[c.element]+'" title="'+elementNames[c.element]+'">';
        html += '<img src="'+weaponIcons[c.weapon]+'" alt="'+weaponNames[c.weapon]+'" title="'+weaponNames[c.weapon]+'">';
        html += '</div>';

// 动态调整白色区域高度（参照星穹铁道：offsetTop+offsetHeight 精确测量）
function adjustWhiteHeight(){
    var contentArea = document.querySelector('.content-area');
    var cardContainer = document.getElementById('card-container');
    if(!contentArea || !cardContainer) return;

    var charSection = document.getElementById('char-section');
    var weaponSection = document.getElementById('weapon-section');
    var relicSection = document.getElementById('relic-section');

    var activeSection = charSection.style.display !== 'none' ? charSection :
                       weaponSection.style.display !== 'none' ? weaponSection :
                        relicSection.style.display !== 'none' ? relicSection : null;
    if(!activeSection) return;

    var maxBottom = 0;
    var cards = activeSection.querySelectorAll('.avatar-card, .weapon-card, .relic-card');
    cards.forEach(function(card){
        if(card.style.display !== 'none'){
            var bottom = card.offsetTop + card.offsetHeight;
            if(bottom > maxBottom) maxBottom = bottom;
        }
    });

    var containerTop = parseInt(cardContainer.style.top) || 592;
    var newHeight = containerTop + maxBottom + 80;
    contentArea.style.minHeight = newHeight + 'px';
}

// 重置筛选
function resetFilters(){
    selectedElements = {};
    selectedWeapons = {};
    selectedRarity = null;
    document.querySelectorAll('.element-box').forEach(function(b){ b.style.backgroundColor = '#27363E'; });
    document.querySelectorAll('.weapon-box').forEach(function(b){ b.style.backgroundColor = '#27363E'; });
}

// 统一筛选
function applyAllFilters(){
    var activeElemKeys = Object.keys(selectedElements).filter(function(k){return selectedElements[k];});
    var activeWeaponKeys = Object.keys(selectedWeapons).filter(function(k){return selectedWeapons[k];});

    document.querySelectorAll('.avatar-card, .weapon-card, .relic-card').forEach(function(card){
        var show = true;
        // 加强tab：仅显示指定角色
        if(activeTab === 1 && card.classList.contains('avatar-card')){
            var cardId = parseInt(card.getAttribute('data-id'));
            if(enhancedCharacterIds.indexOf(cardId) === -1) show = false;
        }
        if(show && selectedRarity && card.getAttribute('data-rarity') !== selectedRarity) show = false;
        if(show && activeElemKeys.length > 0){
            var elem = card.getAttribute('data-elem');
            if(elem && activeElemKeys.indexOf(elem) === -1) show = false;
        }
        if(show && activeWeaponKeys.length > 0){
            var wpn = card.getAttribute('data-type');
            if(wpn && activeWeaponKeys.indexOf(wpn) === -1) show = false;
        }
        card.style.display = show ? '' : 'none';
    });

    adjustWhiteHeight();
}

// ========== 标签页切换 (角色/加强/武器/圣遗物) ==========
window.changeColor = function(el){
    var wasActive = el.style.backgroundColor === 'rgb(37, 69, 186)' || el.style.backgroundColor === '#2545BA';

    // 加强/武器/圣遗物/角色按钮不可取消选择
    if(wasActive) return;

    var iconBoxes = document.querySelectorAll('.icon-box');
    iconBoxes.forEach(function(b){ b.style.backgroundColor = '#27363E'; });

    var cardContainer = document.getElementById('card-container');
    var starRow = document.getElementById('star-buttons-row');
    var elemRow = document.getElementById('element-icons');
    var wpnRow = document.getElementById('weapon-icons');
    var starButtons = document.querySelectorAll('.star-button');
    var charSection = document.getElementById('char-section');
    var weaponSection = document.getElementById('weapon-section');
    var relicSection = document.getElementById('relic-section');

    resetFilters();
    starButtons.forEach(function(b){ b.style.backgroundColor = ''; b.style.color = '#000'; });

    // Hide all sections first
    if(charSection) charSection.style.display = 'none';
    if(weaponSection) weaponSection.style.display = 'none';
    if(relicSection) relicSection.style.display = 'none';

    el.style.backgroundColor = '#2545BA';
    var idx = Array.prototype.indexOf.call(iconBoxes, el);

        if(idx === 0){
            // 角色 tab
            activeTab = 0;
            if(starRow) starRow.style.display = 'flex';
            if(elemRow){ elemRow.style.display = 'flex'; elemRow.style.top = '427px'; }
            if(wpnRow){ wpnRow.style.display = 'flex'; wpnRow.style.top = '504.5px'; }
            if(cardContainer) cardContainer.style.top = '592px';
            if(charSection) charSection.style.display = '';
            if(starButtons[0]){ starButtons[0].style.backgroundColor = '#2545BA'; starButtons[0].style.color = '#fff'; }
            if(starButtons[2]){ starButtons[2].style.display = 'none'; }
            var enhanceLabel = document.getElementById('enhance-label');
            if(enhanceLabel) enhanceLabel.style.display = 'none';
        } else if(idx === 1){
            // 加强 tab
            activeTab = 1;
            if(starRow) starRow.style.display = 'none';
            if(elemRow) elemRow.style.display = 'none';
            if(wpnRow) wpnRow.style.display = 'none';
            if(cardContainer) cardContainer.style.top = '400px';
            if(charSection) charSection.style.display = '';
            var enhanceLabel = document.getElementById('enhance-label');
            if(enhanceLabel){ enhanceLabel.style.display = 'block'; enhanceLabel.style.top = '355px'; }
        } else if(idx === 2){
            // 武器 tab
            activeTab = 2;
            var enhanceLabel2 = document.getElementById('enhance-label');
            if(enhanceLabel2) enhanceLabel2.style.display = 'none';
            if(starRow) starRow.style.display = 'flex';
            if(elemRow) elemRow.style.display = 'none';
            if(wpnRow){ wpnRow.style.display = 'flex'; wpnRow.style.top = '427px'; }
            if(cardContainer) cardContainer.style.top = '504.5px';
            if(weaponSection) weaponSection.style.display = '';
            if(starButtons[0]){ starButtons[0].style.backgroundColor = '#2545BA'; starButtons[0].style.color = '#fff'; }
            if(starButtons[2]) starButtons[2].style.display = ''; // 武器页面保留3星按钮
            // 默认选中五星和单手剑
            selectedRarity = '5';
            var weaponBoxes = document.querySelectorAll('.weapon-box');
            weaponBoxes.forEach(function(b){ b.style.backgroundColor = '#27363E'; });
            if(weaponBoxes[0]){ weaponBoxes[0].style.backgroundColor = '#2545BA'; }
            updateWeaponFilter();
        } else {
            // 圣遗物 tab
            activeTab = 3;
            var enhanceLabel3 = document.getElementById('enhance-label');
            if(enhanceLabel3) enhanceLabel3.style.display = 'none';
            if(starRow) starRow.style.display = 'none';
            if(elemRow) elemRow.style.display = 'none';
            if(wpnRow) wpnRow.style.display = 'none';
            if(cardContainer) cardContainer.style.top = '360px';
            if(relicSection) relicSection.style.display = '';
        }

    applyAllFilters();
};

// ========== 星级筛选（单选） ==========
window.changeStarColor = function(el){
    var starButtons = document.querySelectorAll('.star-button');

    starButtons.forEach(function(b){ b.style.backgroundColor = ''; b.style.color = '#000'; });

    el.style.backgroundColor = '#2545BA'; el.style.color = '#fff';
    selectedRarity = el.textContent.replace(/[^0-9]/g, '');
    applyAllFilters();
};

// ========== 元素筛选（多选） ==========
window.changeElementColor = function(el){
    if(el.style.backgroundColor === 'rgb(37, 69, 186)' || el.style.backgroundColor === '#2545BA'){
        el.style.backgroundColor = '#27363E';
    } else {
        el.style.backgroundColor = '#2545BA';
    }
    updateElementFilter();
};

// ========== 武器筛选（多选） ==========
window.changeWeaponColor = function(el){
    if(el.style.backgroundColor === 'rgb(37, 69, 186)' || el.style.backgroundColor === '#2545BA'){
        el.style.backgroundColor = '#27363E';
    } else {
        el.style.backgroundColor = '#2545BA';
    }
    updateWeaponFilter();
};

function updateElementFilter(){
    var elemBoxes = document.querySelectorAll('.element-box');
    var elemOrder = ["Fire","Water","Elec","Ice","Grass","Wind","Rock"];
    selectedElements = {};
    elemBoxes.forEach(function(box,idx){
        if(idx < elemOrder.length){
            var active = (box.style.backgroundColor === 'rgb(37, 69, 186)' || box.style.backgroundColor === '#2545BA');
            selectedElements[elemOrder[idx]] = active;
        }
    });
    applyAllFilters();
}

function updateWeaponFilter(){
    var weaponBoxes = document.querySelectorAll('.weapon-box');
    var weaponOrder = ["Sword","Claymore","Catalyst","Polearm","Bow"];
    selectedWeapons = {};
    weaponBoxes.forEach(function(box,idx){
        if(idx < weaponOrder.length){
            var active = (box.style.backgroundColor === 'rgb(37, 69, 186)' || box.style.backgroundColor === '#2545BA');
            selectedWeapons[weaponOrder[idx]] = active;
        }
    });
    applyAllFilters();
}

function updateKeqingDays(){
    const startDate = new Date('2020-09-15');
    const today = new Date();
    const diffTime = Math.abs(today - startDate);
    const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
    document.getElementById('keqing-days-count').textContent = diffDays;
}
updateKeqingDays();

// hash锚点跳转：支持 #角色 #加强 #武器 #圣遗物
(function(){
    var hash = decodeURIComponent(window.location.hash);
    if(!hash) return;
    var iconBoxes = document.querySelectorAll('.icon-box');
    var map = {'#角色':0, '#加强':1, '#武器':2, '#圣遗物':3};
    var idx = map[hash];
    if(idx !== undefined && iconBoxes[idx]){
        changeColor(iconBoxes[idx]);
    }
})();
