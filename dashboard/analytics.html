<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据分析 — WebDash</title>
<style>
  :root {
    --primary:#4f46e5; --primary-light:#eef2ff; --sidebar-bg:#1e293b;
    --sidebar-text:#cbd5e1; --bg:#f1f5f9; --card:#ffffff;
    --text:#1e293b; --text-muted:#64748b; --border:#e2e8f0;
    --success:#22c55e; --warning:#f59e0b; --danger:#ef4444;
    --radius:12px; --shadow:0 1px 3px rgba(0,0,0,.06);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--bg); display:flex; min-height:100vh; color:var(--text);
  }
  .sidebar {
    width:250px; background:var(--sidebar-bg); color:var(--sidebar-text);
    display:flex; flex-direction:column; position:fixed; top:0; left:0;
    bottom:0; z-index:100;
  }
  .sidebar-logo {
    padding:24px 20px; font-size:20px; font-weight:700; color:white;
    display:flex; align-items:center; gap:10px; border-bottom:1px solid #334155;
  }
  .sidebar-logo .icon {
    width:36px; height:36px; background:var(--primary); border-radius:10px;
    display:flex; align-items:center; justify-content:center; font-size:18px;
  }
  .sidebar-nav { flex:1; padding:12px 0; overflow-y:auto; }
  .sidebar-nav a {
    display:flex; align-items:center; gap:12px; padding:11px 20px;
    color:var(--sidebar-text); text-decoration:none; font-size:14px;
    font-weight:500; transition:.15s; border-left:3px solid transparent;
    margin:2px 0;
  }
  .sidebar-nav a:hover { background:rgba(255,255,255,.05); color:white; }
  .sidebar-nav a.active { background:rgba(79,70,229,.2); color:white; border-left-color:var(--primary); }
  .sidebar-nav a .badge {
    margin-left:auto; background:var(--danger); color:white; font-size:11px;
    padding:2px 8px; border-radius:10px; font-weight:600;
  }
  .sidebar-user {
    padding:16px 20px; border-top:1px solid #334155;
    display:flex; align-items:center; gap:10px;
  }
  .sidebar-user .avatar {
    width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg,#667eea,#764ba2);
    display:flex; align-items:center; justify-content:center; color:white; font-weight:700; font-size:15px;
  }
  .sidebar-user .info { flex:1; }
  .sidebar-user .name { font-size:13px; color:white; font-weight:600; }
  .sidebar-user .role { font-size:11px; color:#94a3b8; }

  .main { margin-left:250px; flex:1; padding:28px 32px; }
  .page-header {
    display:flex; align-items:center; justify-content:space-between; margin-bottom:28px;
  }
  .page-header h1 { font-size:26px; font-weight:700; }
  .filter-bar {
    display:flex; gap:10px; margin-bottom:24px; flex-wrap:wrap;
  }
  .filter-bar select, .filter-bar button {
    padding:9px 16px; border:1.5px solid var(--border); border-radius:8px;
    font-size:13px; background:white; cursor:pointer; outline:none;
  }
  .filter-bar button.primary {
    background:var(--primary); color:white; border-color:var(--primary);
  }
  .stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px; }
  .mini-stat {
    background:var(--card); border-radius:var(--radius); padding:18px;
    box-shadow:var(--shadow); text-align:center;
  }
  .mini-stat .value { font-size:28px; font-weight:700; }
  .mini-stat .label { font-size:12px; color:var(--text-muted); margin-top:4px; }
  .charts-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:24px; }
  .card {
    background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
  }
  .card-header {
    padding:16px 20px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
  }
  .card-header h2 { font-size:16px; font-weight:600; }
  .card-body { padding:20px; }
  canvas { width:100%; max-height:300px; }

  /* Table */
  .table-card { grid-column:1/-1; }
  .data-table { width:100%; border-collapse:collapse; font-size:13px; }
  .data-table th {
    text-align:left; padding:12px 16px; background:#f8fafc;
    font-weight:600; color:var(--text-muted); font-size:12px;
    text-transform:uppercase; letter-spacing:.05em;
  }
  .data-table td { padding:12px 16px; border-top:1px solid var(--border); }
  .data-table tbody tr:hover { background:#f8fafc; }
  .status-badge {
    padding:3px 10px; border-radius:12px; font-size:11px; font-weight:600;
  }
  .status-badge.success { background:#dcfce7; color:#16a34a; }
  .status-badge.warning { background:#ffedd5; color:#ea580c; }
  .status-badge.danger { background:#fee2e2; color:#dc2626; }
  .pagination {
    display:flex; gap:8px; justify-content:center; margin-top:16px;
  }
  .pagination button {
    width:34px; height:34px; border:1.5px solid var(--border); background:white;
    border-radius:6px; cursor:pointer; font-size:13px; transition:.2s;
  }
  .pagination button:hover { background:#f1f5f9; }
  .pagination button.active { background:var(--primary); color:white; border-color:var(--primary); }

  @media (max-width:1024px) {
    .stats-row { grid-template-columns:repeat(2,1fr); }
    .charts-grid { grid-template-columns:1fr; }
  }
</style>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo"><span class="icon">📊</span> WebDash</div>
  <nav class="sidebar-nav">
    <a href="webdash.html">🏠 仪表板</a>
    <a href="analytics.html" class="active">📈 数据分析</a>
    <a href="tasks.html">✅ 任务管理 <span class="badge">5</span></a>
    <a href="projects.html">📁 项目管理</a>
    <a href="calendar.html">📅 日历排程</a>
    <a href="inbox.html">💬 消息中心 <span class="badge">3</span></a>
    <a href="settings.html">⚙️ 设置</a>
  </nav>
  <div class="sidebar-user">
    <div class="avatar">李</div>
    <div class="info"><div class="name">李明远</div><div class="role">管理员</div></div>
  </div>
</aside>

<main class="main">
  <div class="page-header">
    <div>
      <h1>📈 数据分析</h1>
      <p style="color:var(--text-muted);font-size:14px;margin-top:4px;">深入了解业务指标与趋势</p>
    </div>
    <div class="filter-bar" style="margin-bottom:0;">
      <select><option>最近 7 天</option><option>最近 30 天</option><option>最近 90 天</option><option>今年</option></select>
      <button class="primary">📥 导出报告</button>
    </div>
  </div>

  <!-- KPI Row -->
  <div class="stats-row">
    <div class="mini-stat">
      <div class="value" style="color:var(--primary);">128.4K</div>
      <div class="label">页面浏览量 (PV)</div>
    </div>
    <div class="mini-stat">
      <div class="value" style="color:#16a34a;">42.8K</div>
      <div class="label">独立访客 (UV)</div>
    </div>
    <div class="mini-stat">
      <div class="value" style="color:#ea580c;">3.2%</div>
      <div class="label">跳出率</div>
    </div>
    <div class="mini-stat">
      <div class="value" style="color:#7c3aed;">4:32</div>
      <div class="label">平均会话时长</div>
    </div>
  </div>

  <!-- Charts -->
  <div class="charts-grid">
    <div class="card">
      <div class="card-header"><h2>📊 流量来源分布</h2></div>
      <div class="card-body"><canvas id="trafficChart"></canvas></div>
    </div>
    <div class="card">
      <div class="card-header"><h2>📈 用户增长趋势</h2></div>
      <div class="card-body"><canvas id="growthChart"></canvas></div>
    </div>
    <div class="card">
      <div class="card-header"><h2>🍩 设备分布</h2></div>
      <div class="card-body"><canvas id="deviceChart"></canvas></div>
    </div>
    <div class="card">
      <div class="card-header"><h2>🔥 热门页面 Top 5</h2></div>
      <div class="card-body">
        <div id="topPages"></div>
      </div>
    </div>
  </div>

  <!-- Data Table -->
  <div class="card table-card">
    <div class="card-header">
      <h2>📋 最近订单</h2>
      <select style="padding:6px 12px;border:1.5px solid var(--border);border-radius:6px;font-size:12px;">
        <option>全部状态</option><option>已完成</option><option>处理中</option><option>已取消</option>
      </select>
    </div>
    <div class="card-body" style="overflow-x:auto;">
      <table class="data-table">
        <thead>
          <tr>
            <th>订单编号</th><th>客户</th><th>产品</th><th>金额</th><th>日期</th><th>状态</th>
          </tr>
        </thead>
        <tbody id="orderTableBody"></tbody>
      </table>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
</main>

<script>
// ===== Traffic Source Chart (Pie) =====
(function() {
  const canvas = document.getElementById('trafficChart');
  const ctx = canvas.getContext('2d');
  const data = [
    { label:'搜索引擎', value:38, color:'#4f46e5' },
    { label:'直接访问', value:27, color:'#22c55e' },
    { label:'社交媒体', value:20, color:'#f59e0b' },
    { label:'邮件营销', value:10, color:'#ef4444' },
    { label:'其他', value:5, color:'#94a3b8' },
  ];
  const total = data.reduce((s,d)=>s+d.value,0);
  const cx=150, cy=130, r=100;
  let angle = -Math.PI/2;
  data.forEach(d => {
    const slice = (d.value/total)*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,angle,angle+slice);
    ctx.closePath();
    ctx.fillStyle = d.color;
    ctx.fill();
    // Label
    const mid = angle+slice/2;
    const lx = cx + Math.cos(mid)*(r+30);
    const ly = cy + Math.sin(mid)*(r+30);
    ctx.fillStyle = '#1e293b';
    ctx.font = '12px Inter,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(d.label, lx, ly);
    ctx.fillText(d.value+'%', lx, ly+14);
    angle += slice;
  });
})();

// ===== Growth Chart (Line) =====
(function() {
  const canvas = document.getElementById('growthChart');
  const ctx = canvas.getContext('2d');
  const w=canvas.parentElement.clientWidth-40, h=280;
  canvas.width=w; canvas.height=h;
  const data = [120,180,210,250,340,380,420,490,510,560,620,680];
  const max=Math.max(...data), min=Math.min(...data);
  const pad=40, cw=w-pad*2, ch=h-pad*2;
  ctx.strokeStyle='#e2e8f0';
  ctx.lineWidth=1;
  for(let i=0;i<=4;i++){
    const y=pad+(ch/4)*i;
    ctx.beginPath(); ctx.moveTo(pad,y); ctx.lineTo(w-pad,y); ctx.stroke();
  }
  ctx.beginPath();
  ctx.strokeStyle='#4f46e5'; ctx.lineWidth=3;
  data.forEach((v,i)=>{
    const x=pad+(cw/(data.length-1))*i;
    const y=pad+ch-((v-min)/(max-min))*ch;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();
  // Dots
  data.forEach((v,i)=>{
    const x=pad+(cw/(data.length-1))*i;
    const y=pad+ch-((v-min)/(max-min))*ch;
    ctx.beginPath(); ctx.arc(x,y,5,0,Math.PI*2);
    ctx.fillStyle='#4f46e5'; ctx.fill();
    ctx.strokeStyle='white'; ctx.lineWidth=2; ctx.stroke();
  });
  // Labels
  ctx.fillStyle='#64748b'; ctx.font='11px Inter,sans-serif'; ctx.textAlign='center';
  const months=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  data.forEach((v,i)=>{
    const x=pad+(cw/(data.length-1))*i;
    ctx.fillText(months[i],x,h-10);
  });
})();

// ===== Device Chart (Donut) =====
(function() {
  const canvas = document.getElementById('deviceChart');
  const ctx = canvas.getContext('2d');
  const data = [
    { label:'桌面端', value:55, color:'#4f46e5' },
    { label:'移动端', value:35, color:'#22c55e' },
    { label:'平板', value:10, color:'#f59e0b' },
  ];
  const cx=150, cy=130, outerR=100, innerR=55;
  let angle=-Math.PI/2;
  data.forEach(d=>{
    const slice=(d.value/100)*Math.PI*2;
    ctx.beginPath();
    ctx.arc(cx,cy,outerR,angle,angle+slice);
    ctx.arc(cx,cy,innerR,angle+slice,angle,true);
    ctx.closePath();
    ctx.fillStyle=d.color; ctx.fill();
    const mid=angle+slice/2;
    const lx=cx+Math.cos(mid)*75;
    const ly=cy+Math.sin(mid)*75;
    ctx.fillStyle='white'; ctx.font='bold 14px Inter,sans-serif'; ctx.textAlign='center';
    ctx.fillText(d.value+'%',lx,ly-2);
    ctx.font='10px Inter,sans-serif'; ctx.fillText(d.label,lx,ly+14);
    angle+=slice;
  });
})();

// ===== Top Pages =====
(function() {
  const pages = [
    { name:'首页 /', views:'32,450', bounce:'2.1%', time:'4:12' },
    { name:'产品中心 /products', views:'18,230', bounce:'3.5%', time:'5:48' },
    { name:'关于我们 /about', views:'8,920', bounce:'4.2%', time:'2:35' },
    { name:'联系我们 /contact', views:'6,340', bounce:'5.1%', time:'3:10' },
    { name:'博客 /blog', views:'5,780', bounce:'3.8%', time:'6:22' },
  ];
  const container = document.getElementById('topPages');
  pages.forEach((p,i)=>{
    const bar = document.createElement('div');
    bar.style.cssText = `
      display:flex; align-items:center; gap:12px; padding:10px 0;
      border-bottom:${i<4?'1px solid var(--border)':'none'};
    `;
    bar.innerHTML = `
      <span style="font-weight:700;color:var(--text-muted);width:20px;">${i+1}</span>
      <span style="flex:1;font-size:13px;font-weight:500;">${p.name}</span>
      <span style="font-size:13px;color:var(--text-muted);">👁 ${p.views}</span>
      <span style="font-size:13px;color:var(--text-muted);">⏱ ${p.time}</span>
      <span style="font-size:12px;color:${p.bounce.startsWith('2')?'#16a34a':'#ea580c'};">📉 ${p.bounce}</span>
    `;
    container.appendChild(bar);
  });
})();

// ===== Order Table =====
(function() {
  const orders = [
    {id:'ORD-2024001',customer:'张三',product:'企业版订阅',amount:'¥9,800',date:'2024-06-10',status:'success'},
    {id:'ORD-2024002',customer:'李四',product:'专业版订阅',amount:'¥3,600',date:'2024-06-09',status:'success'},
    {id:'ORD-2024003',customer:'王五',product:'基础版订阅',amount:'¥1,200',date:'2024-06-09',status:'warning'},
    {id:'ORD-2024004',customer:'赵六',product:'定制开发',amount:'¥28,000',date:'2024-06-08',status:'danger'},
    {id:'ORD-2024005',customer:'孙七',product:'企业版订阅',amount:'¥9,800',date:'2024-06-08',status:'success'},
    {id:'ORD-2024006',customer:'周八',product:'咨询服务',amount:'¥5,500',date:'2024-06-07',status:'success'},
    {id:'ORD-2024007',customer:'吴九',product:'专业版订阅',amount:'¥3,600',date:'2024-06-07',status:'warning'},
    {id:'ORD-2024008',customer:'郑十',product:'基础版订阅',amount:'¥1,200',date:'2024-06-06',status:'success'},
  ];
  const statusMap = {success:'已完成',warning:'处理中',danger:'已取消'};
  const tbody = document.getElementById('orderTableBody');
  orders.forEach(o=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="font-weight:600;color:var(--primary);">${o.id}</td>
      <td>${o.customer}</td>
      <td>${o.product}</td>
      <td style="font-weight:600;">${o.amount}</td>
      <td>${o.date}</td>
      <td><span class="status-badge ${o.status}">${statusMap[o.status]}</span></td>
    `;
    tbody.appendChild(tr);
  });
  const pag = document.getElementById('pagination');
  for(let i=1;i<=5;i++){
    const btn=document.createElement('button');
    btn.textContent=i;
    if(i===1) btn.classList.add('active');
    btn.onclick=function(){
      pag.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      this.classList.add('active');
    };
    pag.appendChild(btn);
  }
})();
</script>
</body>
</html>
