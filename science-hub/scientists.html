<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>科学家数据库 — ScienceHub</title>
<style>
:root {
  --bg:#080c14;--bg2:#0f1624;--card:rgba(15,22,36,0.75);--accent:#ec4899;--accent2:#be185d;--accent3:#f472b6;
  --text:#e2e8f0;--text2:#94a3b8;--glass:rgba(255,255,255,0.04);--glass-border:rgba(255,255,255,0.08);
  --glow:0 0 40px rgba(236,72,153,0.15);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI','PingFang SC',sans-serif;line-height:1.6;padding-top:62px}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(236,72,153,0.06) 0%,transparent 50%),radial-gradient(ellipse at 70% 60%,rgba(244,114,182,0.04) 0%,transparent 50%);pointer-events:none;z-index:0}
nav{position:fixed;top:0;width:100%;z-index:1000;background:rgba(8,12,20,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-border);padding:0 40px;display:flex;align-items:center;justify-content:space-between;height:62px}
nav .logo{font-size:1.4rem;font-weight:700;color:var(--text);text-decoration:none;display:flex;align-items:center;gap:8px}
nav .logo span{background:linear-gradient(135deg,var(--accent),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
nav .links{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
nav .links a{color:var(--text2);text-decoration:none;padding:6px 14px;border-radius:8px;font-size:0.9rem;transition:all 0.25s;white-space:nowrap}
nav .links a:hover,nav .links a.active{color:var(--text);background:var(--glass)}
nav .search-btn{background:var(--glass);border:1px solid var(--glass-border);color:var(--text2);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:0.9rem;transition:all 0.25s;text-decoration:none}
nav .search-btn:hover{border-color:var(--accent);color:var(--text)}

.page-header{text-align:center;padding:60px 20px 30px;position:relative;z-index:1}
.page-header h1{font-size:2.8rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.page-header p{color:var(--text2);font-size:1.1rem;margin-top:8px}

/* Scientist Grid */
.sci-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;max-width:1200px;margin:0 auto 60px;padding:0 40px;position:relative;z-index:1}
.sci-card{background:var(--card);border:1px solid var(--glass-border);border-radius:16px;padding:24px;text-align:center;cursor:pointer;backdrop-filter:blur(10px);transition:all 0.35s}
.sci-card:hover{border-color:var(--accent);transform:translateY(-6px);box-shadow:var(--glow)}
.sci-card .avatar{font-size:4rem;display:block;margin-bottom:12px}
.sci-card h3{font-size:1.1rem;margin-bottom:4px}
.sci-card .field{color:var(--accent3);font-size:0.85rem;margin-bottom:6px}
.sci-card .brief{color:var(--text2);font-size:0.8rem}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:2000;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--bg2);border:1px solid var(--glass-border);border-radius:20px;padding:36px;max-width:640px;width:100%;max-height:85vh;overflow-y:auto;position:relative}
.modal .close{position:sticky;top:0;float:right;background:none;border:none;color:var(--text2);font-size:1.8rem;cursor:pointer;z-index:1}
.modal .close:hover{color:var(--text)}
.modal .m-header{display:flex;align-items:center;gap:20px;margin-bottom:20px}
.modal .m-avatar{font-size:4rem}
.modal .m-info h2{font-size:1.6rem;margin-bottom:4px}
.modal .m-info .m-field{color:var(--accent3);font-size:0.9rem}
.modal .m-section{margin-bottom:18px}
.modal .m-section h4{color:var(--accent3);margin-bottom:8px;font-size:0.95rem;text-transform:uppercase;letter-spacing:1px}
.modal .m-section p{color:var(--text2);font-size:0.9rem;line-height:1.7}
.modal .m-timeline{position:relative;padding-left:20px;border-left:2px solid var(--glass-border)}
.modal .m-timeline .mt-item{padding:6px 0 6px 16px;position:relative;font-size:0.85rem;color:var(--text2)}
.modal .m-timeline .mt-item::before{content:'';position:absolute;left:-26px;top:12px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.modal .m-timeline .mt-item .mt-year{color:var(--accent3);font-weight:600}

footer{background:var(--bg2);border-top:1px solid var(--glass-border);padding:50px 40px 30px;position:relative;z-index:1}
footer .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;max-width:1200px;margin:0 auto 30px}
footer h4{margin-bottom:16px}
footer a{color:var(--text2);text-decoration:none;font-size:0.9rem;display:block;margin-bottom:8px;transition:color 0.2s}
footer a:hover{color:var(--accent)}
footer .bottom{text-align:center;color:var(--text2);font-size:0.85rem;border-top:1px solid var(--glass-border);padding-top:20px;max-width:1200px;margin:0 auto}

@media(max-width:900px){.sci-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.sci-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

<script>
const scientists=[
  {
    id:'einstein',name:'阿尔伯特·爱因斯坦',avatar:'🧑‍🔬',field:'物理学',years:'1879-1955',nationality:'德国/瑞士/美国',
    brief:'相对论之父，E=mc²的提出者。',
    intro:'爱因斯坦是20世纪最伟大的物理学家。他于1905年（"奇迹年"）发表了四篇划时代的论文，分别解释了光电效应、布朗运动、狭义相对论和质能等价关系（E=mc²）。1915年，他提出了广义相对论，将引力解释为时空的弯曲。1921年获得诺贝尔物理学奖。',
    timeline:[{y:'1879',t:'出生于德国乌尔姆'},{y:'1905',t:'奇迹年：四篇划时代论文'},{y:'1915',t:'提出广义相对论'},{y:'1921',t:'获诺贝尔物理学奖'},{y:'1933',t:'移居美国普林斯顿'},{y:'1955',t:'逝世，享年76岁'}],
    related:'相对论、光电效应、质能方程 E=mc²、布朗运动'
  },
  {
    id:'newton',name:'艾萨克·牛顿',avatar:'🍎',field:'物理学/数学',years:'1643-1727',nationality:'英国',

  },
  {

  {
    id:'faraday',name:'迈克尔·法拉第',avatar:'🧲',field:'物理/化学',years:'1791-1867',nationality:'英国',

function buildGrid(){
  const grid=document.getElementById('sciGrid');
  grid.innerHTML=scientists.map(s=>`
    <div class="sci-card" onclick="showScientist('${s.id}')">
      <span class="avatar">${s.avatar}</span>
      <h3>${s.name}</h3>
      <div class="field">${s.field}</div>
      <div class="brief">${s.brief}</div>
    </div>
  `).join('');
}

function showScientist(id){
  const s=scientists.find(x=>x.id===id);
  document.getElementById('modal').innerHTML=`
    <button class="close" onclick="closeModal()">&times;</button>
    <div class="m-header">
      <span class="m-avatar">${s.avatar}</span>
      <div class="m-info">
        <h2>${s.name}</h2>
        <div class="m-field">${s.field} | ${s.years} | ${s.nationality}</div>
      </div>
    </div>
    <div class="m-section"><h4>简介</h4><p>${s.intro}</p></div>
    <div class="m-section"><h4>主要贡献</h4><p>${s.related}</p></div>
    <div class="m-section"><h4>时间轴</h4><div class="m-timeline">${s.timeline.map(t=>`<div class="mt-item"><span class="mt-year">${t.y}年</span> — ${t.t}</div>`).join('')}</div></div>
  `;
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('show')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
buildGrid();
</script>
</body>
</html>
