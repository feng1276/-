<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>搜索中心 — ScienceHub</title>
<style>
:root {
  --bg:#080c14;--bg2:#0f1624;--card:rgba(15,22,36,0.75);--accent:#f59e0b;--accent2:#d97706;--accent3:#fbbf24;
  --text:#e2e8f0;--text2:#94a3b8;--glass:rgba(255,255,255,0.04);--glass-border:rgba(255,255,255,0.08);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI','PingFang SC',sans-serif;line-height:1.6;padding-top:62px;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(245,158,11,0.06) 0%,transparent 50%),radial-gradient(ellipse at 30% 70%,rgba(251,191,36,0.04) 0%,transparent 50%);pointer-events:none;z-index:0}
nav{position:fixed;top:0;width:100%;z-index:1000;background:rgba(8,12,20,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-border);padding:0 40px;display:flex;align-items:center;justify-content:space-between;height:62px}
nav .logo{font-size:1.4rem;font-weight:700;color:var(--text);text-decoration:none;display:flex;align-items:center;gap:8px}
nav .logo span{background:linear-gradient(135deg,var(--accent),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
nav .links{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
nav .links a{color:var(--text2);text-decoration:none;padding:6px 14px;border-radius:8px;font-size:0.9rem;transition:all 0.25s;white-space:nowrap}
nav .links a:hover,nav .links a.active{color:var(--text);background:var(--glass)}
nav .search-btn{background:var(--glass);border:1px solid var(--glass-border);color:var(--text2);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:0.9rem;transition:all 0.25s;text-decoration:none}
nav .search-btn:hover{border-color:var(--accent);color:var(--text)}

.search-hero{text-align:center;padding:80px 20px 40px;position:relative;z-index:1}
.search-hero h1{font-size:2.8rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:24px}
.search-box{display:flex;max-width:600px;margin:0 auto;gap:0;position:relative}
.search-box input{flex:1;background:var(--card);border:1px solid var(--glass-border);color:var(--text);padding:16px 24px;border-radius:50px 0 0 50px;font-size:1.1rem;outline:none;backdrop-filter:blur(10px)}
.search-box input:focus{border-color:var(--accent)}
.search-box input::placeholder{color:var(--text2)}
.search-box button{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;padding:16px 32px;border-radius:0 50px 50px 0;font-size:1.1rem;cursor:pointer;font-weight:600;transition:all 0.3s}
.search-box button:hover{box-shadow:0 6px 24px rgba(245,158,11,0.3)}

.results{max-width:800px;margin:0 auto;padding:0 20px 60px;position:relative;z-index:1}
.result-count{color:var(--text2);font-size:0.9rem;margin-bottom:16px;text-align:center;min-height:24px}
.result-item{background:var(--card);border:1px solid var(--glass-border);border-radius:14px;padding:20px 24px;margin-bottom:12px;backdrop-filter:blur(10px);transition:all 0.3s;cursor:pointer}
.result-item:hover{border-color:var(--accent);transform:translateX(6px)}
.result-item .title{font-size:1.1rem;font-weight:600;margin-bottom:4px;color:var(--accent3)}
.result-item .category{display:inline-block;background:rgba(245,158,11,0.15);color:var(--accent3);padding:2px 10px;border-radius:12px;font-size:0.75rem;margin-bottom:6px}
.result-item .desc{color:var(--text2);font-size:0.9rem}
.result-item .link{color:var(--accent);font-size:0.8rem;margin-top:6px;text-decoration:none;display:inline-block}
.result-item .link:hover{text-decoration:underline}
.no-results{text-align:center;color:var(--text2);padding:40px;font-size:1.1rem}

footer{background:var(--bg2);border-top:1px solid var(--glass-border);padding:50px 40px 30px;position:relative;z-index:1}
footer .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;max-width:1200px;margin:0 auto 30px}
footer h4{margin-bottom:16px}
footer a{color:var(--text2);text-decoration:none;font-size:0.9rem;display:block;margin-bottom:8px;transition:color 0.2s}
footer a:hover{color:var(--accent)}
footer .bottom{text-align:center;color:var(--text2);font-size:0.85rem;border-top:1px solid var(--glass-border);padding-top:20px}
</style>
</head>
<body>
<nav>
  <a href="home.html" class="logo">🔬 <span>ScienceHub</span></a>
  <div class="links">
    <a href="home.html">首页</a><a href="physics.html">物理学</a><a href="chemistry.html">化学</a>
    <a href="biology.html">生物学</a><a href="earth-science.html">地球科学</a><a href="computer-science.html">计算机科学</a>
    <a href="scientists.html">科学家</a><a href="experiments.html">实验室</a>
    <a href="knowledge-graph.html">知识图谱</a><a href="rankings.html">排行榜</a><a href="timeline.html">时间轴</a>
  </div>
  <a href="search.html" class="search-btn" style="border-color:var(--accent)">🔍 搜索</a>
</nav>

<div class="search-hero">
  <h1>🔍 搜索中心</h1>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="搜索：DNA、牛顿、光合作用..." oninput="doSearch()" autofocus>
    <button onclick="doSearch()">🔍 搜索</button>
  </div>
</div>

<div class="results">
  <div class="result-count" id="resultCount"></div>
  <div id="resultList"></div>
</div>

<footer>
  <div class="cols">
    <div><h4>🔬 ScienceHub</h4><p style="color:var(--text2);font-size:0.9rem">科学知识百科平台</p></div>
    <div><h4>快速导航</h4><a href="physics.html">物理学</a><a href="chemistry.html">化学</a><a href="biology.html">生物学</a><a href="scientists.html">科学家</a></div>
    <div><h4>更多</h4><a href="experiments.html">实验室</a><a href="knowledge-graph.html">知识图谱</a><a href="rankings.html">排行榜</a><a href="about.html">关于网站</a></div>
  </div>
  <div class="bottom">&copy; 2026 ScienceHub</div>
</footer>

<script>
const entries=[
  {title:'牛顿三大定律',category:'物理学',desc:'惯性定律、F=ma、作用力与反作用力——经典力学的基石。',link:'physics.html'},
  {title:'E=mc² 质能方程',category:'物理学',desc:'爱因斯坦最著名的公式，揭示了质量与能量的等价关系。',link:'physics.html'},
  {title:'量子力学',category:'物理学',desc:'描述微观世界的概率法则：波粒二象性、不确定性原理、量子纠缠。',link:'physics.html'},
  {title:'相对论',category:'物理学',desc:'狭义与广义相对论——时间膨胀、时空弯曲、引力波。',link:'physics.html'},
  {title:'电磁学',category:'物理学',desc:'电场与磁场的统一理论，麦克斯韦方程组的辉煌。',link:'physics.html'},
  {title:'热力学定律',category:'物理学',desc:'能量守恒与熵增原理——宇宙最根本的法则之一。',link:'physics.html'},
  {title:'光学',category:'物理学',desc:'光的反射、折射、干涉与衍射——波动与粒子的双重身份。',link:'physics.html'},
  {title:'元素周期表',category:'化学',desc:'门捷列夫的天才创造，118种元素的系统排列。',link:'chemistry.html'},
  {title:'化学键',category:'化学',desc:'离子键、共价键、金属键——原子之间的"握手"方式。',link:'chemistry.html'},
  {title:'化学反应',category:'化学',desc:'化学键断裂与形成的过程。氢气+氧气→水。',link:'chemistry.html'},
  {title:'有机化学',category:'化学',desc:'含碳化合物的化学，生命分子的基础。',link:'chemistry.html'},
  {title:'原子结构',category:'化学',desc:'质子、中子、电子——物质的基本组成单元。',link:'chemistry.html'},
  {title:'DNA双螺旋',category:'生物学',desc:'生命的遗传密码，A-T、G-C碱基配对规则。',link:'biology.html'},
  {title:'细胞结构',category:'生物学',desc:'细胞核、线粒体、内质网——生命的基本单位。',link:'biology.html'},
  {title:'进化论',category:'生物学',desc:'达尔文的自然选择理论——适者生存，物种起源。',link:'biology.html'},
  {title:'遗传学',category:'生物学',desc:'孟德尔遗传定律——显性与隐性，基因的传递。',link:'biology.html'},
  {title:'光合作用',category:'生物学',desc:'植物将光能转化为化学能：CO₂+H₂O→葡萄糖+O₂。',link:'biology.html'},
  {title:'微生物学',category:'生物学',desc:'细菌、病毒、真菌——微小生命的大世界。',link:'biology.html'},
  {title:'神经系统',category:'生物学',desc:'860亿个神经元，每个连接1000个同伴——人脑的惊人网络。',link:'biology.html'},
  {title:'板块构造',category:'地球科学',desc:'地壳分为若干板块，在地幔对流驱动下缓慢移动。',link:'earth-science.html'},
  {title:'火山',category:'地球科学',desc:'岩浆沿地壳薄弱处喷出——环太平洋"火环"。',link:'earth-science.html'},
  {title:'地震',category:'地球科学',desc:'板块应力释放引发的地壳震动。P波与S波。',link:'earth-science.html'},
  {title:'海洋',category:'地球科学',desc:'覆盖地球71%面积，平均深度3,688米。',link:'earth-science.html'},
  {title:'气候变暖',category:'地球科学',desc:'温室效应加剧，百年升温约1.1°C。',link:'earth-science.html'},
  {title:'地球圈层',category:'地球科学',desc:'地壳-地幔-外核-内核，5500°C的炽热核心。',link:'earth-science.html'},
  {title:'算法复杂度',category:'计算机科学',desc:'大O表示法：O(n)、O(log n)、O(n²)——算法效率的度量。',link:'computer-science.html'},
  {title:'数据结构',category:'计算机科学',desc:'数组、链表、栈、队列、树、图、哈希表——程序的骨架。',link:'computer-science.html'},
  {title:'人工智能',category:'计算机科学',desc:'从图灵测试到ChatGPT——机器智能的演进。',link:'computer-science.html'},
  {title:'图灵机',category:'计算机科学',desc:'艾伦·图灵提出的抽象计算模型，计算机科学的理论基础。',link:'computer-science.html'},
  {title:'Transformer',category:'计算机科学',desc:'2017年提出的神经网络架构，引发大语言模型革命。',link:'computer-science.html'},
  {title:'互联网',category:'计算机科学',desc:'全球最大计算机网络，基于TCP/IP协议族。',link:'computer-science.html'},
  {title:'阿尔伯特·爱因斯坦',category:'科学家',desc:'相对论之父，E=mc²的提出者，1921年诺贝尔奖得主。',link:'scientists.html'},
  {title:'艾萨克·牛顿',category:'科学家',desc:'万有引力定律和三大运动定律的发现者，微积分发明者。',link:'scientists.html'},
  {title:'玛丽·居里',category:'科学家',desc:'第一位获得诺贝尔奖的女性，发现放射性元素镭和钋。',link:'scientists.html'},
  {title:'查尔斯·达尔文',category:'科学家',desc:'进化论之父，《物种起源》改变了人类对生命的认知。',link:'scientists.html'},
  {title:'尼古拉·特斯拉',category:'科学家',desc:'交流电之父，现代电气工程的奠基人。',link:'scientists.html'},
  {title:'斯蒂芬·霍金',category:'科学家',desc:'黑洞辐射理论的提出者，《时间简史》作者。',link:'scientists.html'},
  {title:'伽利略·伽利莱',category:'科学家',desc:'现代科学之父，首次用望远镜进行天文观测。',link:'scientists.html'},
  {title:'迈克尔·法拉第',category:'科学家',desc:'电磁感应发现者，电动机和发电机的原理奠基人。',link:'scientists.html'},
  {title:'门捷列夫',category:'科学家',desc:'元素周期表的创造者，准确预言了未知元素的性质。',link:'scientists.html'},
  {title:'艾伦·图灵',category:'科学家',desc:'计算机科学之父，破解恩尼格玛密码，提出图灵测试。',link:'scientists.html'},
  {title:'尼尔斯·玻尔',category:'科学家',desc:'量子力学奠基人，原子模型与互补原理的提出者。',link:'scientists.html'},
  {title:'路易·巴斯德',category:'科学家',desc:'微生物学之父，巴氏消毒法和狂犬病疫苗的发明者。',link:'scientists.html'},
  {title:'牛顿摆',category:'实验',desc:'演示动量守恒和能量守恒的经典物理实验装置。',link:'experiments.html'},
  {title:'自由落体',category:'实验',desc:'物体在重力作用下从静止下落的运动，t=√(2h/g)。',link:'experiments.html'},
  {title:'化学反应 H₂+O₂',category:'实验',desc:'氢气与氧气的化合反应，生成水并释放能量。',link:'experiments.html'},
  {title:'工程案例',category:'工程技术',desc:'港珠澳大桥、国际空间站、三峡大坝等人类工程奇迹。',link:'engineering.html'},
  {title:'土木工程',category:'工程技术',desc:'桥梁、建筑、道路——构建人类生活的基础设施。',link:'engineering.html'},
  {title:'航天工程',category:'工程技术',desc:'火箭、卫星、空间站——突破地球引力的探索。',link:'engineering.html'},
  {title:'材料工程',category:'工程技术',desc:'纳米材料、复合材料、半导体——设计未来的原子。',link:'engineering.html'}
];

let debounceTimer;
function doSearch(){
  clearTimeout(debounceTimer);
  debounceTimer=setTimeout(()=>{
    const q=document.getElementById('searchInput').value.trim().toLowerCase();
    if(!q){document.getElementById('resultList').innerHTML='';document.getElementById('resultCount').textContent='';return}
    const results=entries.filter(e=>e.title.toLowerCase().includes(q)||e.category.toLowerCase().includes(q)||e.desc.toLowerCase().includes(q));
    document.getElementById('resultCount').textContent=`找到 ${results.length} 条相关结果`;
    if(results.length===0){
      document.getElementById('resultList').innerHTML='<div class="no-results">😕 未找到相关结果，请尝试其他关键词</div>';
    }else{
      document.getElementById('resultList').innerHTML=results.map(r=>`
        <div class="result-item" onclick="window.location.href='${r.link}'">
          <div class="title">${highlightMatch(r.title,q)}</div>
          <span class="category">${r.category}</span>
          <div class="desc">${highlightMatch(r.desc,q)}</div>
          <a class="link" href="${r.link}">查看详情 →</a>
        </div>
      `).join('');
    }
  },200);
}
function highlightMatch(text,query){
  const re=new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'gi');
  return text.replace(re,'<mark style="background:rgba(245,158,11,0.3);color:var(--accent3);padding:0 2px;border-radius:3px">$1</mark>');
}
</script>
</body>
</html>
