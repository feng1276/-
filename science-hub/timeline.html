<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>科学时间轴 — ScienceHub</title>
<style>
:root {
  --bg:#080c14;--bg2:#0f1624;--card:rgba(15,22,36,0.75);--accent:#3b82f6;--accent2:#2563eb;--accent3:#60a5fa;
  --text:#e2e8f0;--text2:#94a3b8;--glass:rgba(255,255,255,0.04);--glass-border:rgba(255,255,255,0.08);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI','PingFang SC',sans-serif;line-height:1.6;padding-top:62px}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 10%,rgba(59,130,246,0.06) 0%,transparent 50%),radial-gradient(ellipse at 70% 50%,rgba(96,165,250,0.04) 0%,transparent 50%);pointer-events:none;z-index:0}
nav{position:fixed;top:0;width:100%;z-index:1000;background:rgba(8,12,20,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-border);padding:0 40px;display:flex;align-items:center;justify-content:space-between;height:62px}
nav .logo{font-size:1.4rem;font-weight:700;color:var(--text);text-decoration:none;display:flex;align-items:center;gap:8px}
nav .logo span{background:linear-gradient(135deg,var(--accent),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
nav .links{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
nav .links a{color:var(--text2);text-decoration:none;padding:6px 14px;border-radius:8px;font-size:0.9rem;transition:all 0.25s;white-space:nowrap}
nav .links a:hover,nav .links a.active{color:var(--text);background:var(--glass)}
nav .search-btn{background:var(--glass);border:1px solid var(--glass-border);color:var(--text2);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:0.9rem;transition:all 0.25s;text-decoration:none}
nav .search-btn:hover{border-color:var(--accent);color:var(--text)}

.page-header{text-align:center;padding:60px 20px 40px;position:relative;z-index:1}
.page-header h1{font-size:2.8rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.page-header p{color:var(--text2);font-size:1.1rem;margin-top:8px}

.timeline-container{max-width:900px;margin:0 auto;padding:0 20px 60px;position:relative;z-index:1}
.timeline{position:relative}
.timeline::before{
  content:'';position:absolute;left:50%;top:0;bottom:0;width:3px;
  background:linear-gradient(to bottom,var(--accent),var(--accent3),var(--accent),var(--accent3));
  transform:translateX(-50%);border-radius:2px;
}
.tl-item{position:relative;margin-bottom:40px;width:50%}
.tl-item:nth-child(odd){left:0;padding-right:40px;text-align:right}
.tl-item:nth-child(even){left:50%;padding-left:40px;text-align:left}
.tl-item::before{
  content:'';position:absolute;top:20px;width:16px;height:16px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 16px rgba(59,130,246,0.5);z-index:2;
}
.tl-item:nth-child(odd)::before{right:-9.5px}
.tl-item:nth-child(even)::before{left:-6.5px}
.tl-card{
  background:var(--card);border:1px solid var(--glass-border);border-radius:16px;
  padding:22px 24px;backdrop-filter:blur(10px);transition:all 0.3s;
}
.tl-card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 8px 30px rgba(59,130,246,0.1)}
.tl-card .year{font-size:1.5rem;font-weight:800;color:var(--accent3);margin-bottom:4px}
.tl-card h3{font-size:1.05rem;margin-bottom:4px}
.tl-card p{color:var(--text2);font-size:0.85rem}
.tl-card .tag{display:inline-block;background:rgba(59,130,246,0.15);color:var(--accent3);padding:3px 10px;border-radius:12px;font-size:0.75rem;margin-top:6px}

@media(max-width:768px){
  .timeline::before{left:20px}
  .tl-item{width:100%;left:0!important;padding-left:50px!important;padding-right:0!important;text-align:left!important}
  .tl-item::before{left:12px!important}
  .tl-item:nth-child(odd)::before{left:12px!important;right:auto!important}
}

footer{background:var(--bg2);border-top:1px solid var(--glass-border);padding:50px 40px 30px;position:relative;z-index:1}
footer .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;max-width:1200px;margin:0 auto 30px}
footer h4{margin-bottom:16px}
footer a{color:var(--text2);text-decoration:none;font-size:0.9rem;display:block;margin-bottom:8px;transition:color 0.2s}
footer a:hover{color:var(--accent)}
footer .bottom{text-align:center;color:var(--text2);font-size:0.85rem;border-top:1px solid var(--glass-border);padding-top:20px}
</style>
</head>
<body>
<nav>
  <a href="home.html" class="logo">🔬 <span>ScienceHub</span></a>
  <div class="links">
    <a href="home.html">首页</a><a href="physics.html">物理学</a><a href="chemistry.html">化学</a>
    <a href="biology.html">生物学</a><a href="earth-science.html">地球科学</a><a href="computer-science.html">计算机科学</a>
    <a href="scientists.html">科学家</a><a href="experiments.html">实验室</a>
    <a href="knowledge-graph.html">知识图谱</a><a href="rankings.html">排行榜</a>
    <a href="timeline.html" class="active">时间轴</a>
  </div>
  <a href="search.html" class="search-btn">🔍 搜索</a>
</nav>

<div class="page-header">
  <h1>⏳ 科学时间轴</h1>
  <p>从古代智慧到现代科技——人类科学探索的壮阔历程</p>
</div>

<div class="timeline-container">
  <div class="timeline" id="timeline"></div>
</div>

<footer>
  <div class="cols">
    <div><h4>🔬 ScienceHub</h4><p style="color:var(--text2);font-size:0.9rem">科学知识百科平台</p></div>
    <div><h4>快速导航</h4><a href="physics.html">物理学</a><a href="chemistry.html">化学</a><a href="biology.html">生物学</a><a href="scientists.html">科学家</a></div>
    <div><h4>更多</h4><a href="experiments.html">实验室</a><a href="knowledge-graph.html">知识图谱</a><a href="rankings.html">排行榜</a><a href="about.html">关于网站</a></div>
  </div>
  <div class="bottom">&copy; 2026 ScienceHub</div>
</footer>

<script>
const events=[
  {year:'约公元前300年',title:'欧几里得《几何原本》',desc:'古希腊数学家欧几里得系统整理了当时的几何知识，建立了公理化体系，影响了此后两千年的数学教育。',tag:'数学'},
  {year:'约公元前240年',title:'阿基米德原理',desc:'阿基米德发现浮力定律——"尤里卡！"传说中他在浴缸中灵光一闪，裸奔上街。他还发明了杠杆原理和螺旋泵。',tag:'物理学'},
  {year:'1543年',title:'哥白尼日心说',desc:'尼古拉·哥白尼发表《天体运行论》，提出太阳是宇宙的中心，挑战了统治1400年的地心说。',tag:'天文学'},
  {year:'1609年',title:'伽利略的天文望远镜',desc:'伽利略改进望远镜并首次用于天文观测，发现了木星的卫星、月球环形山和太阳黑子。',tag:'天文学'},
  {year:'1687年',title:'牛顿《自然哲学的数学原理》',desc:'艾萨克·牛顿发表万有引力定律和三大运动定律，标志着经典力学的诞生和现代科学的开端。',tag:'物理学'},
  {year:'1752年',title:'富兰克林的风筝实验',desc:'本杰明·富兰克林通过风筝实验证明了闪电就是电，并发明了避雷针。',tag:'物理学'},
  {year:'1789年',title:'拉瓦锡的元素表',desc:'安托万·拉瓦锡发表第一份现代化学元素列表（33种元素），被尊为"现代化学之父"。',tag:'化学'},
  {year:'1831年',title:'法拉第电磁感应',desc:'迈克尔·法拉第发现变化的磁场可以产生电流——发电机和变压器的理论基础。',tag:'物理学'},
  {year:'1859年',title:'达尔文《物种起源》',desc:'查尔斯·达尔文经过20年研究，发表进化论，提出自然选择机制。书出版当天即售罄。',tag:'生物学'},
  {year:'1865年',title:'孟德尔遗传定律',desc:'格雷戈尔·孟德尔通过豌豆实验发现遗传规律，但他的论文在当时几乎被完全忽视。',tag:'生物学'},
  {year:'1869年',title:'门捷列夫周期表',desc:'德米特里·门捷列夫发表元素周期表，并按规律预测了未知元素的性质——后来全部被证实。',tag:'化学'},
  {year:'1873年',title:'麦克斯韦方程组',desc:'詹姆斯·麦克斯韦统一了电学和磁学，推导出电磁波的存在，预言光就是电磁波。',tag:'物理学'},
  {year:'1895年',title:'伦琴发现X射线',desc:'威廉·伦琴意外发现X射线，并用来拍摄了第一张X光片（他妻子的手）。获首届诺贝尔物理学奖。',tag:'物理学'},
  {year:'1896年',title:'贝克勒尔发现放射性',desc:'亨利·贝克勒尔偶然发现铀盐能使底片感光——开启了核物理时代。',tag:'物理学'},
  {year:'1898年',title:'居里夫妇发现镭',desc:'玛丽和皮埃尔·居里发现了放射性元素镭和钋，开创了放射化学新领域。',tag:'化学/物理'},
  {year:'1905年',title:'爱因斯坦奇迹年',desc:'爱因斯坦发表四篇论文：光电效应、布朗运动、狭义相对论和E=mc²。年仅26岁。',tag:'物理学'},
  {year:'1911年',title:'卢瑟福原子模型',desc:'欧内斯特·卢瑟福通过α粒子散射实验发现原子核，提出行星式原子模型。',tag:'物理学'},
  {year:'1913年',title:'玻尔原子模型',desc:'尼尔斯·玻尔将量子概念引入原子结构理论，成功解释了氢原子光谱。',tag:'物理学'},
  {year:'1915年',title:'爱因斯坦广义相对论',desc:'引力被解释为时空弯曲。该理论预测了黑洞和引力波，在百年后被精确验证。',tag:'物理学'},
  {year:'1928年',title:'弗莱明发现青霉素',desc:'亚历山大·弗莱明意外发现霉菌能杀死细菌——青霉素诞生，拯救了数亿生命。',tag:'医学'},
  {year:'1936年',title:'图灵机概念',desc:'艾伦·图灵提出抽象计算模型，奠定了计算机科学的理论基础。',tag:'计算机科学'},
  {year:'1942年',title:'第一个核反应堆',desc:'恩里科·费米在芝加哥大学建造了世界上第一个核反应堆CP-1，开启了核能时代。',tag:'物理学'},
  {year:'1947年',title:'晶体管的发明',desc:'巴丁、布拉顿和肖克利在贝尔实验室发明了晶体管——现代电子学的基石。',tag:'物理学/工程'},
  {year:'1953年',title:'DNA双螺旋结构',desc:'沃森和克里克发现DNA的双螺旋结构——"我们发现了生命的秘密"。',tag:'生物学'},
  {year:'1969年',title:'阿波罗11号登月',desc:'尼尔·阿姆斯特朗成为第一个踏上月球的人："这是一个人的一小步，人类的一大步。"',tag:'航天'},
  {year:'1977年',title:'旅行者号发射',desc:'旅行者1号和2号发射升空，至今仍在星际空间中飞行，携带着人类文明的"金唱片"。',tag:'航天'},
  {year:'1990年',title:'哈勃太空望远镜',desc:'哈勃望远镜发射升空，拍摄了无数震撼的宇宙影像，彻底改变了人类对宇宙的认知。',tag:'天文学'},
  {year:'2003年',title:'人类基因组计划完成',desc:'历时13年，耗资38亿美元，首次完整测序了人类全部基因。',tag:'生物学'},
  {year:'2012年',title:'希格斯玻色子发现',desc:'CERN的大型强子对撞机(LHC)发现了"上帝粒子"——希格斯玻色子，补全了标准模型的最后一块拼图。',tag:'物理学'},
  {year:'2015年',title:'引力波首次探测',desc:'LIGO探测器首次直接探测到引力波，源自两个黑洞的合并，证实了爱因斯坦百年前的预言。',tag:'物理学'},
  {year:'2019年',title:'首张黑洞照片',desc:'事件视界望远镜(EHT)拍摄到M87星系中心超大质量黑洞的影子——人类第一次"看见"黑洞。',tag:'天文学'},
  {year:'2022年',title:'詹姆斯·韦伯望远镜',desc:'韦伯太空望远镜(JWST)开始传回图像，以前所未有的清晰度展示了早期宇宙的面貌。',tag:'天文学'},
  {year:'2022年',title:'ChatGPT与AI革命',desc:'OpenAI发布ChatGPT，人工智能对话助手进入大众视野，开启了AI新纪元。',tag:'计算机科学/AI'}
];

document.getElementById('timeline').innerHTML=events.map(e=>`
  <div class="tl-item">
    <div class="tl-card">
      <div class="year">${e.year}</div>
      <h3>${e.title}</h3>
      <p>${e.desc}</p>
      <span class="tag">${e.tag}</span>
    </div>
  </div>
`).join('');
</script>
</body>
</html>
