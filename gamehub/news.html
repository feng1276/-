<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新闻中心 - GameHub</title>
    <style>
        :root {
            --bg-primary: #1b2838;
            --bg-secondary: #171a21;
            --bg-tertiary: #2a475e;
            --text-primary: #c7d5e0;
            --text-secondary: #8f98a0;
            --text-highlight: #ffffff;
            --accent-blue: #66c0f4;
            --accent-green: #a1cd44;
            --accent-orange: #ff7f50;
            --accent-red: #e74c3c;
            --accent-purple: #8e44ad;
            --gradient-hero: linear-gradient(135deg, #1b2838 0%, #2a475e 50%, #1b2838 100%);
            --shadow-card: 0 4px 15px rgba(0, 0, 0, 0.5);
            --shadow-hover: 0 8px 30px rgba(102, 192, 244, 0.3);
            --border-radius: 8px;
            --transition-speed: 0.3s;
            --nav-height: 70px;
            --max-width: 1400px;
        }
        body.light-mode {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e0e0e0;
            --text-primary: #333333;
            --text-secondary: #666666;
            --text-highlight: #111111;
            --shadow-card: 0 4px 15px rgba(0, 0, 0, 0.15);
            --shadow-hover: 0 8px 30px rgba(102, 192, 244, 0.2);
            --gradient-hero: linear-gradient(135deg, #e8f4f8 0%, #d0e8f0 50%, #e8f4f8 100%);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            transition: background-color var(--transition-speed), color var(--transition-speed);
            overflow-x: hidden;
        }
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--bg-tertiary);
            border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-blue);
        }
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--nav-height);
            background: rgba(23, 26, 33, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            transition: all var(--transition-speed);
        }
        .navbar.scrolled {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            background: rgba(23, 26, 33, 0.95);
        }
        .navbar .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 30px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-highlight);
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 1px;
        }
        .logo-icon {
            width: 44px;
            height: 44px;
            background: var(--accent-blue);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #1b2838;
            font-weight: 900;
        }
        .logo-text {
            background: linear-gradient(135deg, #66c0f4, #a1cd44);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .nav-links {
            display: flex;
            list-style: none;
            gap: 5px;
            align-items: center;
        }
        .nav-links li a {
            display: block;
            padding: 10px 18px;
            color: var(--text-primary);
            text-decoration: none;
            border-radius: 4px;
            transition: all var(--transition-speed);
            font-size: 0.95rem;
            font-weight: 500;
            position: relative;
            white-space: nowrap;
        }
        .nav-links li a::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%) scaleX(0);
            width: 60%;
            height: 2px;
            background: var(--accent-blue);
            transition: transform var(--transition-speed);
            border-radius: 2px;
        }
        .nav-links li a:hover,
        .nav-links li a.active {
            color: var(--text-highlight);
            background: rgba(102, 192, 244, 0.1);
        }
        .nav-links li a:hover::after,
        .nav-links li a.active::after {
            transform: translateX(-50%) scaleX(1);
        }
        .nav-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .btn-icon {
            width: 40px;
            height: 40px;
            border: none;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all var(--transition-speed);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-icon:hover {
            background: rgba(102, 192, 244, 0.2);
            color: var(--accent-blue);
            transform: scale(1.05);
        }
        .mobile-menu-btn {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 5px;
        }
        .mobile-menu-btn span {
            display: block;
            width: 25px;
            height: 2px;
            background: var(--text-primary);
            border-radius: 2px;
        }
        .page-header {
            margin-top: var(--nav-height);
            background: var(--gradient-hero);
            padding: 60px 0;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .page-header h1 {
            font-size: 2.8rem;
            font-weight: 900;
            color: var(--text-highlight);
            margin-bottom: 10px;
        }
        .page-header .breadcrumb {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .page-header .breadcrumb a {
            color: var(--accent-blue);
            text-decoration: none;
        }
        .page-header .breadcrumb a:hover {
            text-decoration: underline;
        }
        .main-content {
            padding: 40px 0 80px;
        }
        .main-content .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 30px;
        }
        .news-filter-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 35px;
            justify-content: center;
        }
        .news-filter-btn {
            padding: 10px 22px;
            background: var(--bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border-radius: 25px;
            cursor: pointer;
            transition: all var(--transition-speed);
            font-size: 0.9rem;
            font-weight: 500;
            white-space: nowrap;
        }
        .news-filter-btn:hover,
        .news-filter-btn.active {
            background: rgba(102, 192, 244, 0.2);
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }
        .news-masonry {
            column-count: 3;
            column-gap: 25px;
        }
        .news-card {
            break-inside: avoid;
            background: var(--bg-secondary);
            border-radius: var(--border-radius);
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: var(--shadow-card);
            transition: all var(--transition-speed);
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .news-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }
        .news-card-img {
            width: 100%;
            aspect-ratio: 16/10;
            background: var(--bg-tertiary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: var(--text-secondary);
            transition: all var(--transition-speed);
        }
        .news-card:hover .news-card-img {
            color: var(--accent-blue);
        }
        .news-card-body {
            padding: 20px;
        }
        .news-card-category {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }
        .cat-news {
            background: rgba(102, 192, 244, 0.15);
            color: var(--accent-blue);
        }
        .cat-update {
            background: rgba(161, 205, 68, 0.15);
            color: var(--accent-green);
        }
        .cat-esports {
            background: rgba(255, 127, 80, 0.15);
            color: var(--accent-orange);
        }
        .cat-review {
            background: rgba(142, 68, 173, 0.15);
            color: var(--accent-purple);
        }
        .cat-event {
            background: rgba(231, 76, 60, 0.15);
            color: var(--accent-red);
        }
        .news-card-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-highlight);
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .news-card-excerpt {
            color: var(--text-secondary);
            font-size: 0.88rem;
            line-height: 1.6;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .news-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 12px;
        }
        .news-card-stats {
            display: flex;
            gap: 12px;
        }
        .news-card-stats span {
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .featured-news {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
            margin-bottom: 40px;
        }
        .featured-main {
            background: var(--bg-secondary);
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--shadow-card);
            text-decoration: none;
            color: inherit;
            display: block;
            transition: all var(--transition-speed);
            position: relative;
        }
        .featured-main:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }
        .featured-main-img {
            width: 100%;
            aspect-ratio: 21/9;
            background: var(--bg-tertiary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            color: var(--text-secondary);
        }
        .featured-main-body {
            padding: 25px;
        }
        .featured-main-body h2 {
            font-size: 1.5rem;
            color: var(--text-highlight);
            margin-bottom: 10px;
        }
        .featured-main-body p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .featured-main-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 8px 18px;
            background: var(--accent-red);
            color: #fff;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .featured-side {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .featured-side-item {
            background: var(--bg-secondary);
            border-radius: var(--border-radius);
            padding: 18px;
            text-decoration: none;
            color: inherit;
            display: flex;
            gap: 15px;
            align-items: center;
            transition: all var(--transition-speed);
            box-shadow: var(--shadow-card);
            flex: 1;
        }
        .featured-side-item:hover {
            transform: translateX(5px);
            box-shadow: var(--shadow-hover);
        }
        .featured-side-icon {
            font-size: 2rem;
            width: 50px;
            text-align: center;
            flex-shrink: 0;
        }
        .featured-side-info h4 {
            font-size: 0.9rem;
            color: var(--text-highlight);
            margin-bottom: 5px;
        }
        .featured-side-info span {
            font-size: 0.78rem;
            color: var(--text-secondary);
        }
        .load-more {
            text-align: center;
            margin-top: 30px;
        }
        .btn {
            display: inline-block;
            padding: 14px 32px;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all var(--transition-speed);
            border: none;
        }
        .btn-outline {
            background: transparent;
            color: var(--text-highlight);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        .btn-outline:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            background: rgba(102, 192, 244, 0.1);
        }
        .footer {
            background: var(--bg-secondary);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding: 40px 0;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 46px;
            height: 46px;
            background: var(--bg-tertiary);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: var(--text-highlight);
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all var(--transition-speed);
            z-index: 999;
        }
        .back-to-top.visible {
            opacity: 1;
            visibility: visible;
        }
        .back-to-top:hover {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: #1b2838;
            transform: translateY(-4px);
            box-shadow: 0 6px 20px rgba(102, 192, 244, 0.4);
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .news-card {
            animation: fadeInUp 0.5s ease forwards;
        }
        @media (max-width: 1024px) {
            .news-masonry {
                column-count: 2;
            }
            .featured-news {
                grid-template-columns: 1fr;
            }
        }
        @media (max-width: 768px) {
            .nav-links {
                display: none;
                position: absolute;
                top: var(--nav-height);
                left: 0;
                width: 100%;
                background: rgba(23, 26, 33, 0.98);
                flex-direction: column;
                padding: 20px;
                backdrop-filter: blur(20px);
                z-index: 999;
            }
            .nav-links.active {
                display: flex;
            }
            .mobile-menu-btn {
                display: flex;
            }
            .news-masonry {
                column-count: 1;
            }
            .page-header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

                category: 'esports', icon: '🏅', date: '2025-05-08', views: 45600, comments: 2345,
            featured: true },
            { id: 13, title: '赛博朋克2077续作开发确认，代号「猎户座」', excerpt: 'CD Projekt Red在投资者会议上确认赛博朋克2077续作正在全力开发中...',
                category: 'news', icon: '🤖', date: '2025-05-05', views: 22300, comments: 890, featured: false },
            { id: 14, title: 'Minecraft与NASA联动：在游戏中探索真实火星地形', excerpt: 'Mojang与美国宇航局合作，将真实火星地形数据导入Minecraft...',
                category: 'news', icon: '⛏️', date: '2025-05-01', views: 16700, comments: 543, featured: false },
            { id: 15, title: '游戏评测：星露谷物语1.6版本——种田游戏的新高度', excerpt: '星露谷物语1.6版本增加了大量新内容和优化，我们将深入体验并给出评测...',
                category: 'review', icon: '🌾', date: '2025-04-28', views: 8700, comments: 198, featured: false }
        ];

        let visibleCount = 9;
        let currentFilter = 'all';

        function getFilteredNews() {
            return currentFilter === 'all' ? allNews : allNews.filter(n => n.category === currentFilter);
        }

        function renderFeaturedNews() {
            const featured = allNews.filter(n => n.featured).slice(0, 4);
            const container = document.getElementById('featuredNews');
            if (featured.length === 0) {
                container.style.display = 'none';
                return;
            }
            container.style.display = 'grid';
            const main = featured[0];
            const side = featured.slice(1, 4);
            container.innerHTML = `
                <a href="#" class="featured-main">
                    <div class="featured-main-img">${main.icon}</div>
                    <div class="featured-main-body">
                        <h2>${main.title}</h2>
                        <p>${main.excerpt}</p>
                        <div style="margin-top:12px;color:var(--text-secondary);font-size:0.85rem;">📅 ${main.date} | 👁️ ${main.views.toLocaleString()} | 💬 ${main.comments}</div>
                    </div>
                    <span class="featured-main-badge">🔥 头条</span>
                </a>
                <div class="featured-side">
                    ${side.map(s => `
                        <a href="#" class="featured-side-item">
                            <span class="featured-side-icon">${s.icon}</span>
                            <div class="featured-side-info">
                                <h4>${s.title}</h4>
                                <span>📅 ${s.date}</span>
                            </div>
                        </a>
                    `).join('')}
                </div>
            `;
        }

        function renderNewsMasonry() {
            const filtered = getFilteredNews();
            const visible = filtered.slice(0, visibleCount);
            const container = document.getElementById('newsMasonry');
            const categoryClassMap = {
                'news': 'cat-news',
                'update': 'cat-update',
                'esports': 'cat-esports',
                'review': 'cat-review',
                'event': 'cat-event'
            };
            const categoryNameMap = {
                'news': '行业新闻',
                'update': '游戏更新',
                'esports': '电竞赛事',
                'review': '游戏评测',
                'event': '展会活动'
            };
            container.innerHTML = visible.map((n, i) => `
                <a href="#" class="news-card" style="animation-delay:${i*0.06}s">
                    <div class="news-card-img">${n.icon}</div>
                    <div class="news-card-body">
                        <span class="news-card-category ${categoryClassMap[n.category]||'cat-news'}">${categoryNameMap[n.category]||n.category}</span>
                        <div class="news-card-title">${n.title}</div>
                        <div class="news-card-excerpt">${n.excerpt}</div>
                        <div class="news-card-footer">
                            <span>📅 ${n.date}</span>
                            <div class="news-card-stats">
                                <span>👁️ ${n.views>1000?(n.views/1000).toFixed(1)+'K':n.views}</span>
                                <span>💬 ${n.comments}</span>
                            </div>
                        </div>
                    </div>
                </a>
            `).join('');
            const loadMoreBtn = document.getElementById('btnLoadMore');
            if (visibleCount >= filtered.length) {
                loadMoreBtn.textContent = '已加载全部新闻 ✓';
                loadMoreBtn.disabled = true;
                loadMoreBtn.style.opacity = '0.5';
                loadMoreBtn.style.cursor = 'not-allowed';
            } else {
                loadMoreBtn.textContent = '加载更多新闻 ↓';
                loadMoreBtn.disabled = false;
                loadMoreBtn.style.opacity = '1';
                loadMoreBtn.style.cursor = 'pointer';
            }
        }

        document.getElementById('newsFilterBar').addEventListener('click', (e) => {
            const btn = e.target.closest('.news-filter-btn');
            if (!btn) return;
            document.querySelectorAll('.news-filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            visibleCount = 9;
            renderNewsMasonry();
        });

        document.getElementById('btnLoadMore').addEventListener('click', () => {
            visibleCount += 6;
            renderNewsMasonry();
        });

        const navbar = document.getElementById('navbar');
        const backToTop = document.getElementById('backToTop');
        window.addEventListener('scroll', () => {
            const scrollY = window.scrollY;
            navbar.classList.toggle('scrolled', scrollY > 50);
            backToTop.classList.toggle('visible', scrollY > 400);
        });
        backToTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const navLinks = document.getElementById('navLinks');
        mobileMenuBtn.addEventListener('click', () => navLinks.classList.toggle('active'));
        navLinks.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => navLinks.classList.remove('active'));
        });

        const btnThemeToggle = document.getElementById('btnThemeToggle');
        const savedTheme = localStorage.getItem('gamehub-theme');
        if (savedTheme === 'light') {
            document.body.classList.add('light-mode');
            btnThemeToggle.textContent = '☀️';
        }
        btnThemeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            btnThemeToggle.textContent = isLight ? '☀️' : '🌙';
            localStorage.setItem('gamehub-theme', isLight ? 'light' : 'dark');
        });

        renderFeaturedNews();
        renderNewsMasonry();
        console.log('%c📰 新闻中心页面已就绪 | 共 %d 条新闻', 'color:#66c0f4;font-size:1.1em;', allNews.length);
    </script>
</body>
</html>
