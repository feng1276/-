<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排行榜 - GameHub</title>
    <style>
        :root {
            --bg-primary: #1b2838;
            --bg-secondary: #171a21;
            --bg-tertiary: #2a475e;
            --text-primary: #c7d5e0;
            --text-secondary: #8f98a0;
            --text-highlight: #ffffff;
            --accent-blue: #66c0f4;
            --accent-green: #a1cd44;
            --accent-orange: #ff7f50;
            --accent-red: #e74c3c;
            --accent-purple: #8e44ad;
            --accent-gold: #ffd700;
            --accent-silver: #c0c0c0;
            --accent-bronze: #cd7f32;
            --gradient-hero: linear-gradient(135deg, #1b2838 0%, #2a475e 50%, #1b2838 100%);
            --shadow-card: 0 4px 15px rgba(0, 0, 0, 0.5);
            --shadow-hover: 0 8px 30px rgba(102, 192, 244, 0.3);
            --border-radius: 8px;
            --transition-speed: 0.3s;
            --nav-height: 70px;
            --max-width: 1400px;
        }
        body.light-mode {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e0e0e0;
            --text-primary: #333333;
            --text-secondary: #666666;
            --text-highlight: #111111;
            --shadow-card: 0 4px 15px rgba(0, 0, 0, 0.15);
            --shadow-hover: 0 8px 30px rgba(102, 192, 244, 0.2);
            --gradient-hero: linear-gradient(135deg, #e8f4f8 0%, #d0e8f0 50%, #e8f4f8 100%);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            transition: background-color var(--transition-speed), color var(--transition-speed);
            overflow-x: hidden;
        }
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--bg-tertiary);
            border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-blue);
        }
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--nav-height);
            background: rgba(23, 26, 33, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            transition: all var(--transition-speed);
        }
        .navbar.scrolled {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            background: rgba(23, 26, 33, 0.95);
        }
        .navbar .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 30px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-highlight);
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 1px;
            transition: all var(--transition-speed);
        }
        .logo-icon {
            width: 44px;
            height: 44px;
            background: var(--accent-blue);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #1b2838;
            font-weight: 900;
            transition: all var(--transition-speed);
            box-shadow: 0 0 15px rgba(102, 192, 244, 0.4);
        }
        .logo:hover .logo-icon {
            transform: rotate(-10deg) scale(1.1);
            box-shadow: 0 0 25px rgba(102, 192, 244, 0.7);
        }
        .logo-text {
            background: linear-gradient(135deg, #66c0f4, #a1cd44);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .nav-links {
            display: flex;
            list-style: none;
            gap: 5px;
            align-items: center;
        }
        .nav-links li a {
            display: block;
            padding: 10px 18px;
            color: var(--text-primary);
            text-decoration: none;
            border-radius: 4px;
            transition: all var(--transition-speed);
            font-size: 0.95rem;
            font-weight: 500;
            position: relative;
            white-space: nowrap;
        }
        .nav-links li a::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%) scaleX(0);
            width: 60%;
            height: 2px;
            background: var(--accent-blue);
            transition: transform var(--transition-speed);
            border-radius: 2px;
        }
        .nav-links li a:hover,
        .nav-links li a.active {
            color: var(--text-highlight);
            background: rgba(102, 192, 244, 0.1);
        }
        .nav-links li a:hover::after,
        .nav-links li a.active::after {
            transform: translateX(-50%) scaleX(1);
        }
        .nav-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .btn-icon {
            width: 40px;
            height: 40px;
            border: none;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all var(--transition-speed);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-icon:hover {
            background: rgba(102, 192, 244, 0.2);
            color: var(--accent-blue);
            transform: scale(1.05);
        }
        .mobile-menu-btn {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 5px;
        }
        .mobile-menu-btn span {
            display: block;
            width: 25px;
            height: 2px;
            background: var(--text-primary);
            transition: all var(--transition-speed);
            border-radius: 2px;
        }
        .page-header {
            margin-top: var(--nav-height);
            background: var(--gradient-hero);
            padding: 60px 0;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }
        .page-header::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        .page-header h1 {
            font-size: 2.8rem;
            font-weight: 900;
            color: var(--text-highlight);
            margin-bottom: 10px;
            position: relative;
        }
        .page-header .breadcrumb {
            color: var(--text-secondary);
            font-size: 0.9rem;
            position: relative;
        }
        .page-header .breadcrumb a {
            color: var(--accent-blue);
            text-decoration: none;
        }
        .page-header .breadcrumb a:hover {
            text-decoration: underline;
        }
        .main-content {
            padding: 40px 0 80px;
        }
        .main-content .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 30px;
        }
        .ranking-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 40px;
        }
        .ranking-tab {
            padding: 12px 28px;
            background: var(--bg-secondary);
            border: 2px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border-radius: 30px;
            cursor: pointer;
            transition: all var(--transition-speed);
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
        }
        .ranking-tab:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            background: rgba(102, 192, 244, 0.08);
        }
        .ranking-tab.active {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #1b2838;
            border-color: transparent;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.3);
        }
        .top-three {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }
        .top-card {
            background: var(--bg-secondary);
            border-radius: var(--border-radius);
            padding: 25px;
            text-align: center;
            box-shadow: var(--shadow-card);
            transition: all var(--transition-speed);
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
            width: 220px;
            position: relative;
            overflow: hidden;
        }
        .top-card:hover {
            transform: translateY(-10px);
            box-shadow: var(--shadow-hover);
        }
        .top-card.rank-1 {
            order: 2;
            width: 260px;
            padding: 30px;
            border: 2px solid var(--accent-gold);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            animation: goldenGlow 2s ease-in-out infinite;
        }
        .top-card.rank-2 {
            order: 1;
            border: 2px solid var(--accent-silver);
        }
        .top-card.rank-3 {
            order: 3;
            border: 2px solid var(--accent-bronze);
        }
        @keyframes goldenGlow {
            0%,
            100% {
                box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            }
            50% {
                box-shadow: 0 0 50px rgba(255, 215, 0, 0.6);
            }
        }
        .top-rank-badge {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 900;
            margin: 0 auto 15px;
        }
        .rank-1 .top-rank-badge {
            background: var(--accent-gold);
            color: #1b2838;
            font-size: 2rem;
            width: 65px;
            height: 65px;
        }
        .rank-2 .top-rank-badge {
            background: var(--accent-silver);
            color: #1b2838;
        }
        .rank-3 .top-rank-badge {
            background: var(--accent-bronze);
            color: #1b2838;
        }
        .top-card-icon {
            font-size: 3.5rem;
            display: block;
            margin-bottom: 12px;
        }
        .rank-1 .top-card-icon {
            font-size: 4.5rem;
        }
        .top-card-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-highlight);
            margin-bottom: 5px;
        }
        .rank-1 .top-card-name {
            font-size: 1.3rem;
        }
        .top-card-rating {
            color: var(--accent-blue);
            font-weight: 700;
            font-size: 1.2rem;
        }
        .rank-1 .top-card-rating {
            font-size: 1.5rem;
        }
        .top-card-developer {
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin-top: 5px;
        }
        .ranking-table-container {
            background: var(--bg-secondary);
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--shadow-card);
        }
        .ranking-table-header {
            display: grid;
            grid-template-columns: 80px 1fr 120px 120px 120px;
            padding: 16px 20px;
            background: var(--bg-tertiary);
            font-weight: 700;
            color: var(--text-highlight);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .ranking-row {
            display: grid;
            grid-template-columns: 80px 1fr 120px 120px 120px;
            padding: 16px 20px;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            transition: all var(--transition-speed);
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }
        .ranking-row:hover {
            background: rgba(102, 192, 244, 0.05);
        }
        .ranking-row:last-child {
            border-bottom: none;
        }
        .rank-number {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .rank-number.top10 {
            color: var(--accent-blue);
        }
        .rank-number.top3 {
            color: var(--accent-gold);
        }
        .rank-change {
            font-size: 0.75rem;
            font-weight: 700;
        }
        .rank-up {
            color: var(--accent-green);
        }
        .rank-down {
            color: var(--accent-red);
        }
        .rank-stay {
            color: var(--text-secondary);
        }
        .game-info-cell {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .game-cell-icon {
            width: 48px;
            height: 48px;
            background: var(--bg-tertiary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            flex-shrink: 0;
        }
        .game-cell-name {
            font-weight: 600;
            color: var(--text-highlight);
            font-size: 0.95rem;
        }
        .game-cell-dev {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .cell-rating {
            font-weight: 700;
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .cell-score {
            font-weight: 700;
            color: var(--text-highlight);
            font-size: 0.9rem;
        }
        .cell-trend {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .trend-bar {
            width: 80px;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            overflow: hidden;
        }
        .trend-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 1s ease;
        }
        .category-ranking {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
            margin-top: 60px;
        }
        .category-card {
            background: var(--bg-secondary);
            border-radius: var(--border-radius);
            padding: 25px;
            box-shadow: var(--shadow-card);
        }
        .category-card h3 {
            color: var(--text-highlight);
            font-size: 1.2rem;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--accent-blue);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .category-list-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            text-decoration: none;
            color: inherit;
            transition: all var(--transition-speed);
        }
        .category-list-item:hover {
            padding-left: 8px;
            color: var(--accent-blue);
        }
        .category-list-rank {
            font-weight: 800;
            font-size: 1.1rem;
            width: 30px;
            text-align: center;
            color: var(--text-secondary);
        }
        .category-list-rank.top3-cat {
            color: var(--accent-gold);
        }
        .category-list-icon {
            font-size: 1.8rem;
            width: 40px;
            text-align: center;
        }
        .category-list-info {
            flex: 1;
        }
        .category-list-name {
            font-weight: 600;
            color: var(--text-highlight);
            font-size: 0.9rem;
        }
        .category-list-dev {
            font-size: 0.78rem;
            color: var(--text-secondary);
        }
        .category-list-rating {
            font-weight: 700;
            color: var(--accent-blue);
            font-size: 0.9rem;
        }
        .stat-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 40px;
            margin-bottom: 40px;
        }
        .stat-summary-card {
            background: var(--bg-secondary);
            border-radius: var(--border-radius);
            padding: 20px;
            text-align: center;
            box-shadow: var(--shadow-card);
        }
        .stat-summary-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .stat-summary-value {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--accent-blue);
        }
        .stat-summary-label {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: 5px;
        }
        .footer {
            background: var(--bg-secondary);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding: 40px 0;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 46px;
            height: 46px;
            background: var(--bg-tertiary);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: var(--text-highlight);
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all var(--transition-speed);
            z-index: 999;
        }
        .back-to-top.visible {
            opacity: 1;
            visibility: visible;
        }
        .back-to-top:hover {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: #1b2838;
            transform: translateY(-4px);
            box-shadow: 0 6px 20px rgba(102, 192, 244, 0.4);
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .ranking-row {
            animation: fadeInUp 0.4s ease forwards;
        }
        @media (max-width: 768px) {
            .nav-links {
                display: none;
                position: absolute;
                top: var(--nav-height);
                left: 0;
                width: 100%;
                background: rgba(23, 26, 33, 0.98);
                flex-direction: column;
                padding: 20px;
                backdrop-filter: blur(20px);
                z-index: 999;
            }
            .nav-links.active {
                display: flex;
            }
            .mobile-menu-btn {
                display: flex;
            }
            .page-header h1 {
                font-size: 2rem;
            }
            .ranking-table-header,
            .ranking-row {
                grid-template-columns: 50px 1fr 80px;
                font-size: 0.8rem;
            }
            .ranking-table-header span:nth-child(4),
            .ranking-table-header span:nth-child(5),
            .ranking-row .cell-score,
            .ranking-row .cell-trend {
                display: none;
            }
            .top-three {
                gap: 10px;
            }
            .top-card {
                width: 160px;
                padding: 15px;
            }
            .top-card.rank-1 {
                width: 180px;
            }
            .top-card-icon {
                font-size: 2.5rem;
            }
            .rank-1 .top-card-icon {
                font-size: 3rem;
            }
            .category-ranking {
                grid-template-columns: 1fr;
            }
        }
        @media (max-width: 480px) {
            .top-three {
                flex-direction: column;
                align-items: center;
            }
            .top-card,
            .top-card.rank-1 {
                width: 100%;
                max-width: 280px;
            }
            .top-card.rank-1 {
                order: 1;
            }
            .top-card.rank-2 {
                order: 2;
            }
            .top-card.rank-3 {
                order: 3;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="container">
            <a href="home.html" class="logo">
                <div class="logo-icon">G</div>
                <span class="logo-text">GameHub</span>
            </a>
            <ul class="nav-links" id="navLinks">
                <li><a href="home.html">首页</a></li>
                <li><a href="games.html">游戏库</a></li>
                <li><a href="ranking.html" class="active">排行榜</a></li>
                <li><a href="news.html">新闻</a></li>
                <li><a href="guide.html">攻略</a></li>
                <li><a href="developers.html">开发商</a></li>
                <li><a href="community.html">社区</a></li>
            </ul>
            <div class="nav-actions">
                <button class="btn-icon" id="btnThemeToggle" title="切换主题">🌙</button>
                <button class="mobile-menu-btn" id="mobileMenuBtn">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </nav>

    <section class="page-header">
        <div class="container">
            <h1>🏆 游戏排行榜</h1>
            <p class="breadcrumb"><a href="home.html">首页</a> / 排行榜</p>
        </div>
    </section>

    <section class="main-content">
        <div class="container">
            <div class="ranking-tabs" id="rankingTabs">
                <button class="ranking-tab active" data-tab="overall">🏅 综合总榜</button>
                <button class="ranking-tab" data-tab="rpg">⚔️ RPG榜</button>
                <button class="ranking-tab" data-tab="fps">🔫 FPS榜</button>
                <button class="ranking-tab" data-tab="sandbox">🏗️ 沙盒榜</button>
                <button class="ranking-tab" data-tab="moba">🏟️ MOBA榜</button>
                <button class="ranking-tab" data-tab="indie">💎 独立游戏榜</button>
            </div>

            <div class="stat-summary" id="statSummary">
                <div class="stat-summary-card">
                    <div class="stat-summary-icon">📊</div>
                    <div class="stat-summary-value" id="totalGamesStat">100</div>
                    <div class="stat-summary-label">上榜游戏总数</div>
                </div>
                <div class="stat-summary-card">
                    <div class="stat-summary-icon">⭐</div>
                    <div class="stat-summary-value" id="avgRatingStat">4.5</div>
                    <div class="stat-summary-label">上榜游戏均分</div>
                </div>
                <div class="stat-summary-card">
                    <div class="stat-summary-icon">🔥</div>
                    <div class="stat-summary-value" id="topGameStat">-</div>

        let currentTab = 'overall';

        function getTopThree(data) {
            return data.slice(0, 3);
        }

        function getRemainingData(data) {
            return data.slice(3);
        }

        function renderTopThree(data) {
            const topThree = getTopThree(data);
            const container = document.getElementById('topThree');
            const rankClasses = ['rank-1', 'rank-2', 'rank-3'];
            const medals = ['🥇', '🥈', '🥉'];
            container.innerHTML = topThree.map((game, i) => `
                <a href="detail.html?id=${game.name.toLowerCase().replace(/[：: ]/g, '').replace(/[^a-z\u4e00-\u9fa5]/g, '')}" class="top-card ${rankClasses[i]}">
                    <div class="top-rank-badge">${medals[i]}</div>
                    <span class="top-card-icon">${game.icon}</span>
                    <div class="top-card-name">${game.name}</div>
                    <div class="top-card-rating">⭐ ${game.rating}</div>
                    <div class="top-card-developer">${game.developer}</div>
                </a>
            `).join('');
        }

        function renderRankingTable(data) {
            const remaining = getRemainingData(data);
            const container = document.getElementById('rankingList');
            container.innerHTML = remaining.map((game, i) => {
                const changeIcon = game.change === 'up' ? '🟢' : game.change === 'down' ? '🔴' : '➖';
                const changeClass = game.change === 'up' ? 'rank-up' : game.change === 'down' ? 'rank-down' :
                    'rank-stay';
                const rankClass = game.rank <= 3 ? 'top3' : game.rank <= 10 ? 'top10' : '';
                const trendPercent = Math.min(100, Math.max(10, (game.score / 10000)));
                const trendColor = game.rating >= 4.7 ? '#a1cd44' : game.rating >= 4.3 ? '#66c0f4' :
                    '#ff7f50';
                return `
                    <a href="detail.html?id=${game.name.toLowerCase().replace(/[：: ]/g, '').replace(/[^a-z\u4e00-\u9fa5]/g, '')}" class="ranking-row" style="animation-delay:${i*0.04}s">
                        <span class="rank-number ${rankClass}">
                            #${game.rank}
                            <span class="rank-change ${changeClass}">${changeIcon} ${Math.abs(game.changeVal)}</span>
                        </span>
                        <span class="game-info-cell">
                            <span class="game-cell-icon">${game.icon}</span>
                            <span>
                                <div class="game-cell-name">${game.name}</div>
                                <div class="game-cell-dev">${game.developer}</div>
                            </span>
                        </span>
                        <span class="cell-rating">⭐ ${game.rating}</span>
                        <span class="cell-score">${(game.score/1000).toFixed(0)}K</span>
                        <span class="cell-trend">
                            <span style="font-size:0.75rem;color:${trendColor};">🔥</span>
                            <div class="trend-bar">
                                <div class="trend-bar-fill" style="width:${trendPercent}%;background:${trendColor};"></div>
                            </div>
                        </span>
                    </a>
                `;
            }).join('');
        }

                { key: 'fps', name: '🔫 射击游戏 FPS', data: rankingsData.fps },

                { key: 'moba', name: '🏟️ MOBA', data: rankingsData.moba },
                { key: 'indie', name: '💎 独立游戏', data: rankingsData.indie }
            ];
            const container = document.getElementById('categoryRanking');
            if (currentTab !== 'overall') {
                container.style.display = 'none';
                return;
            }
            container.style.display = 'grid';
            container.innerHTML = categories.map(cat => `
                <div class="category-card">
                    <h3>${cat.name}<span style="margin-left:auto;font-size:0.8rem;color:var(--text-secondary);">TOP ${cat.data.length}</span></h3>

                            <span class="category-list-icon">${g.icon}</span>
                            <span class="category-list-info">
                                <div class="category-list-name">${g.name}</div>
                                <div class="category-list-dev">${g.developer}</div>
                            </span>
                            <span class="category-list-rating">⭐ ${g.rating}</span>
                        </a>
                    `).join('')}
                </div>
            `).join('');
        }

        function updateStats(data) {
            document.getElementById('totalGamesStat').textContent = data.length;
            const avgRating = (data.reduce((sum, g) => sum + g.rating, 0) / data.length).toFixed(1);
            document.getElementById('avgRatingStat').textContent = avgRating;
            document.getElementById('topGameStat').textContent = data[0]?.name || '-';
        }

        function renderAll(tab) {
            currentTab = tab;
            const data = rankingsData[tab] || rankingsData.overall;
            renderTopThree(data);
            renderRankingTable(data);
            renderCategoryRanking();
            updateStats(data);

            document.getElementById('rankingTabs').querySelectorAll('.ranking-tab').forEach(t => t.classList
                .remove('active'));
            document.getElementById('rankingTabs').querySelector(`[data-tab="${tab}"]`).classList.add(
            'active');
        }

        document.getElementById('rankingTabs').addEventListener('click', (e) => {
            const tab = e.target.closest('.ranking-tab');
            if (!tab) return;
            renderAll(tab.dataset.tab);
        });

        const backToTop = document.getElementById('backToTop');
        window.addEventListener('scroll', () => {
            const scrollY = window.scrollY;
            navbar.classList.toggle('scrolled', scrollY > 50);
            backToTop.classList.toggle('visible', scrollY > 400);
        });
        backToTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const navLinks = document.getElementById('navLinks');
        mobileMenuBtn.addEventListener('click', () => navLinks.classList.toggle('active'));
        navLinks.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => navLinks.classList.remove('active'));
        });

        const btnThemeToggle = document.getElementById('btnThemeToggle');
        const savedTheme = localStorage.getItem('gamehub-theme');
        if (savedTheme === 'light') {
            document.body.classList.add('light-mode');
            btnThemeToggle.textContent = '☀️';
        }
        btnThemeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            btnThemeToggle.textContent = isLight ? '☀️' : '🌙';
            localStorage.setItem('gamehub-theme', isLight ? 'light' : 'dark');
        });
