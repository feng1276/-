<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开发商专区 - GameHub</title>
    <style>
        :root {
            --bg-primary: #1b2838;
            --bg-secondary: #171a21;
            --bg-tertiary: #2a475e;
            --text-primary: #c7d5e0;
            --text-secondary: #8f98a0;
            --text-highlight: #ffffff;
            --accent-blue: #66c0f4;
            --accent-green: #a1cd44;
            --accent-orange: #ff7f50;
            --accent-red: #e74c3c;
            --accent-purple: #8e44ad;
            --gradient-hero: linear-gradient(135deg, #1b2838 0%, #2a475e 50%, #1b2838 100%);
            --shadow-card: 0 4px 15px rgba(0, 0, 0, 0.5);
            --shadow-hover: 0 8px 30px rgba(102, 192, 244, 0.3);
            --border-radius: 8px;
            --transition-speed: 0.3s;
            --nav-height: 70px;
            --max-width: 1400px;
        }
        body.light-mode {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e0e0e0;
            --text-primary: #333333;
            --text-secondary: #666666;
            --text-highlight: #111111;
            --shadow-card: 0 4px 15px rgba(0, 0, 0, 0.15);
            --shadow-hover: 0 8px 30px rgba(102, 192, 244, 0.2);
            --gradient-hero: linear-gradient(135deg, #e8f4f8 0%, #d0e8f0 50%, #e8f4f8 100%);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            transition: background-color var(--transition-speed), color var(--transition-speed);
            overflow-x: hidden;
        }
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--bg-tertiary);
            border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-blue);
        }
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--nav-height);
            background: rgba(23, 26, 33, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            transition: all var(--transition-speed);
        }
        .navbar.scrolled {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            background: rgba(23, 26, 33, 0.95);
        }
        .navbar .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 30px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-highlight);
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 1px;
        }
        .logo-icon {
            width: 44px;
            height: 44px;
            background: var(--accent-blue);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #1b2838;
            font-weight: 900;
        }
        .logo-text {
            background: linear-gradient(135deg, #66c0f4, #a1cd44);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .nav-links {
            display: flex;
            list-style: none;
            gap: 5px;
            align-items: center;
        }
        .nav-links li a {
            display: block;
            padding: 10px 18px;
            color: var(--text-primary);
            text-decoration: none;
            border-radius: 4px;
            transition: all var(--transition-speed);
            font-size: 0.95rem;
            font-weight: 500;
            position: relative;
            white-space: nowrap;
        }
        .nav-links li a::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%) scaleX(0);
            width: 60%;
            height: 2px;
            background: var(--accent-blue);
            transition: transform var(--transition-speed);
            border-radius: 2px;
        }
        .nav-links li a:hover,
        .nav-links li a.active {
            color: var(--text-highlight);
            background: rgba(102, 192, 244, 0.1);
        }
        .nav-links li a:hover::after,
        .nav-links li a.active::after {
            transform: translateX(-50%) scaleX(1);
        }
        .nav-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .btn-icon {
            width: 40px;
            height: 40px;
            border: none;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all var(--transition-speed);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-icon:hover {
            background: rgba(102, 192, 244, 0.2);
            color: var(--accent-blue);
            transform: scale(1.05);
        }
        .mobile-menu-btn {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 5px;
        }
        .mobile-menu-btn span {
            display: block;
            width: 25px;
            height: 2px;
            background: var(--text-primary);
            border-radius: 2px;
        }
        .page-header {
            margin-top: var(--nav-height);
            background: var(--gradient-hero);
            padding: 60px 0;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .page-header h1 {
            font-size: 2.8rem;
            font-weight: 900;
            color: var(--text-highlight);
            margin-bottom: 10px;
        }
        .page-header .breadcrumb {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .page-header .breadcrumb a {
            color: var(--accent-blue);
            text-decoration: none;
        }
        .page-header .breadcrumb a:hover {
            text-decoration: underline;
        }
        .main-content {
            padding: 40px 0 80px;
        }
        .main-content .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 30px;
        }
        .dev-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 30px;
        }
        .dev-card {
            background: var(--bg-secondary);
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--shadow-card);
            transition: all var(--transition-speed);
            cursor: pointer;
            position: relative;
        }
        .dev-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }
        .dev-card-banner {
            width: 100%;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: rgba(255, 255, 255, 0.2);
            position: relative;
        }
        .dev-card-logo {
            width: 80px;
            height: 80px;
            background: var(--bg-tertiary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            position: absolute;
            bottom: -40px;
            left: 25px;
            border: 3px solid var(--bg-secondary);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            z-index: 2;
        }
        .dev-card-body {
            padding: 50px 25px 25px;
        }
        .dev-card-name {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--text-highlight);
            margin-bottom: 8px;
        }
        .dev-card-founded {
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }
                .dev-card-desc {
            color: var(--text-secondary);
            font-size: 0.88rem;
            line-height: 1.6;
            margin-bottom: 15px;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            overflow: hidden;
            -webkit-line-clamp: 2;
            line-clamp: 2;
        }

        .dev-card-games {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        .dev-game-badge {
            padding: 4px 10px;
            background: rgba(102, 192, 244, 0.08);
            color: var(--accent-blue);
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .dev-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 15px;
        }
        .dev-card-stats {
            display: flex;
            gap: 15px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .dev-card-stats span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .dev-card-link {
            color: var(--accent-blue);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .dev-card-link:hover {
            text-decoration: underline;
        }
        .dev-detail-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            overflow-y: auto;
            padding: 40px 20px;
        }
        .dev-detail-modal.active {
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }
        .dev-detail-content {
            background: var(--bg-secondary);
            border-radius: var(--border-radius);
            max-width: 850px;
            width: 100%;
            padding: 35px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            animation: modalSlideIn 0.3s ease;
        }
        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .dev-detail-close {
            float: right;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: var(--text-primary);
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.3rem;
            transition: all var(--transition-speed);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .dev-detail-close:hover {
            background: var(--accent-red);
            color: #fff;
        }
        .dev-detail-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .dev-detail-logo {
            width: 100px;
            height: 100px;
            background: var(--bg-tertiary);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            flex-shrink: 0;
        }
        .dev-detail-name {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--text-highlight);
        }
        .dev-detail-meta {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 5px;
        }
        .dev-detail-section {
            margin-bottom: 25px;
        }
        .dev-detail-section h3 {
            font-size: 1.1rem;
            color: var(--text-highlight);
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--accent-blue);
            display: inline-block;
        }
        .dev-detail-section p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.8;
        }
        .dev-games-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .dev-games-table th,
        .dev-games-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 0.88rem;
        }
        .dev-games-table th {
            color: var(--text-secondary);
            font-weight: 500;
        }
        .dev-games-table td {
            color: var(--text-highlight);
        }
        .dev-games-table a {
            color: var(--accent-blue);
            text-decoration: none;
        }
        .dev-games-table a:hover {
            text-decoration: underline;
        }
        .dev-info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }
        .dev-info-item {
            background: var(--bg-primary);
            border-radius: var(--border-radius);
            padding: 18px;
            text-align: center;
        }
        .dev-info-value {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent-blue);
        }
        .dev-info-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 5px;
        }
        .stat-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: var(--bg-secondary);
            border-radius: var(--border-radius);
            padding: 20px;
            text-align: center;
            box-shadow: var(--shadow-card);
        }
        .stat-card-icon {
            font-size: 2.5rem;
            margin-bottom: 8px;
        }
        .stat-card-value {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--accent-blue);
        }
        .stat-card-label {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        .footer {
            background: var(--bg-secondary);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding: 40px 0;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 46px;
            height: 46px;
            background: var(--bg-tertiary);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: var(--text-highlight);
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all var(--transition-speed);
            z-index: 999;
        }
        .back-to-top.visible {
            opacity: 1;
            visibility: visible;
        }
        .back-to-top:hover {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: #1b2838;
            transform: translateY(-4px);
            box-shadow: 0 6px 20px rgba(102, 192, 244, 0.4);
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .dev-card {
            animation: fadeInUp 0.5s ease forwards;
        }
        @media (max-width: 768px) {
            .nav-links {
                display: none;
                position: absolute;
                top: var(--nav-height);
                left: 0;
                width: 100%;
                background: rgba(23, 26, 33, 0.98);
                flex-direction: column;
                padding: 20px;
                backdrop-filter: blur(20px);
                z-index: 999;
            }
            .nav-links.active {
                display: flex;
            }
            .mobile-menu-btn {
                display: flex;
            }
            .page-header h1 {
                font-size: 2rem;
            }
            .dev-grid {
                grid-template-columns: 1fr;
            }
            .dev-detail-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

                famousGames: ['英雄联盟', '瓦罗兰特', 'Legends of Runeterra'], gameIds: ['lol', 'valorant'],
                rating: 4.3, stats: { gamesPublished: 8, totalPlayers: '8亿+', awards: 80, globalRank: 'Top 8' } },

                stats: { gamesPublished: 40, totalPlayers: '8000万+', awards: 90, globalRank: 'Top 10' } },
            { id: 'nintendo', name: 'Nintendo / 任天堂', logo: '🍄', founded: '1889年', country: '日本京都',

                stats: { gamesPublished: 10, totalPlayers: '1亿+', awards: 150, globalRank: 'Top 12' } }
        ];

        function renderDevGrid() {
            const grid = document.getElementById('devGrid');
            grid.innerHTML = developers.map((dev, i) => `
                <div class="dev-card" style="animation-delay:${i*0.06}s" data-id="${dev.id}">
                    <div class="dev-card-banner" style="background:${dev.banner};">
                        ${dev.logo}
                        <div class="dev-card-logo">${dev.logo}</div>
                    </div>
                    <div class="dev-card-body">
                        <div class="dev-card-name">${dev.name}</div>
                        <div class="dev-card-founded">📍 ${dev.country} | 📅 成立于 ${dev.founded}</div>
                        <div class="dev-card-desc">${dev.description}</div>
                        <div class="dev-card-games">
                            ${dev.famousGames.map(g => `<span class="dev-game-badge">${g}</span>`).join('')}
                        </div>
                        <div class="dev-card-footer">
                            <div class="dev-card-stats">
                                <span>🎮 ${dev.stats.gamesPublished}款</span>
                                <span>⭐ ${dev.rating}</span>
                                <span>👥 ${dev.employees}</span>
                            </div>
                            <span class="dev-card-link">查看详情 →</span>
                        </div>
                    </div>
                </div>
            `).join('');

            grid.querySelectorAll('.dev-card').forEach(card => {
                card.addEventListener('click', () => {
                    openDevDetail(card.dataset.id);
                });
            });
        }

        function openDevDetail(id) {
            const dev = developers.find(d => d.id === id);
            if (!dev) return;
            const modal = document.getElementById('devDetailModal');
            const content = document.getElementById('devDetailContent');
            content.innerHTML = `
                <button class="dev-detail-close" id="devDetailClose">✕</button>
                <div class="dev-detail-header">
                    <div class="dev-detail-logo">${dev.logo}</div>
                    <div>
                        <div class="dev-detail-name">${dev.name}</div>
                        <div class="dev-detail-meta">📍 ${dev.country} | 📅 成立于 ${dev.founded} | 👥 ${dev.employees}名员工</div>
                        <div class="dev-detail-meta">🌐 <a href="${dev.website}" target="_blank" style="color:var(--accent-blue);">${dev.website}</a></div>
                    </div>
                </div>
                <div class="dev-info-grid">
                    <div class="dev-info-item"><div class="dev-info-value">${dev.stats.gamesPublished}</div><div class="dev-info-label">已发行游戏</div></div>
                    <div class="dev-info-item"><div class="dev-info-value">${dev.stats.totalPlayers}</div><div class="dev-info-label">全球玩家</div></div>
                    <div class="dev-info-item"><div class="dev-info-value">${dev.stats.awards}</div><div class="dev-info-label">获奖数量</div></div>
                    <div class="dev-info-item"><div class="dev-info-value">${dev.stats.globalRank}</div><div class="dev-info-label">全球排名</div></div>
                </div>
                <div class="dev-detail-section">
                    <h3>公司简介</h3>
                    <p>${dev.description}</p>
                </div>
                <div class="dev-detail-section">
                    <h3>代表作品</h3>
                    <table class="dev-games-table">
                        <thead><tr><th>游戏名称</th><th>评分</th><th>详情</th></tr></thead>
                        <tbody>
                            ${dev.famousGames.map((g, i) => `
                                <tr>
                                    <td>${g}</td>
                                    <td>⭐ ${dev.rating}</td>
                                    <td><a href="detail.html?id=${dev.gameIds[i]||''}">查看游戏 →</a></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            document.getElementById('devDetailClose').addEventListener('click', closeDevDetail);
        }

        function closeDevDetail() {
            document.getElementById('devDetailModal').classList.remove('active');
            document.body.style.overflow = '';
        }
        document.getElementById('devDetailModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeDevDetail();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeDevDetail();
        });

        const navbar = document.getElementById('navbar');
        const backToTop = document.getElementById('backToTop');
        window.addEventListener('scroll', () => {
            const scrollY = window.scrollY;
            navbar.classList.toggle('scrolled', scrollY > 50);
            backToTop.classList.toggle('visible', scrollY > 400);
        });
        backToTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const navLinks = document.getElementById('navLinks');
        mobileMenuBtn.addEventListener('click', () => navLinks.classList.toggle('active'));
        navLinks.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => navLinks.classList.remove('active'));
        });

        const btnThemeToggle = document.getElementById('btnThemeToggle');
        const savedTheme = localStorage.getItem('gamehub-theme');
        if (savedTheme === 'light') {
            document.body.classList.add('light-mode');
            btnThemeToggle.textContent = '☀️';
        }
        btnThemeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            btnThemeToggle.textContent = isLight ? '☀️' : '🌙';
            localStorage.setItem('gamehub-theme', isLight ? 'light' : 'dark');
        });

        renderDevGrid();
        console.log('%c🏢 开发商专区页面已就绪 | 共 %d 家开发商', 'color:#8e44ad;font-size:1.1em;', developers.length);
    </script>
</body>
</html>
