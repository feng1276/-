<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>攻略中心 - GameHub</title>
    <style>
        :root {
            --bg-primary: #1b2838;
            --bg-secondary: #171a21;
            --bg-tertiary: #2a475e;
            --text-primary: #c7d5e0;
            --text-secondary: #8f98a0;
            --text-highlight: #ffffff;
            --accent-blue: #66c0f4;
            --accent-green: #a1cd44;
            --accent-orange: #ff7f50;
            --accent-red: #e74c3c;
            --accent-purple: #8e44ad;
            --accent-yellow: #ffc107;
            --gradient-hero: linear-gradient(135deg, #1b2838 0%, #2a475e 50%, #1b2838 100%);
            --shadow-card: 0 4px 15px rgba(0, 0, 0, 0.5);
            --shadow-hover: 0 8px 30px rgba(102, 192, 244, 0.3);
            --border-radius: 8px;
            --transition-speed: 0.3s;
            --nav-height: 70px;
            --max-width: 1400px;
        }
        body.light-mode {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e0e0e0;
            --text-primary: #333333;
            --text-secondary: #666666;
            --text-highlight: #111111;
            --shadow-card: 0 4px 15px rgba(0, 0, 0, 0.15);
            --shadow-hover: 0 8px 30px rgba(102, 192, 244, 0.2);
            --gradient-hero: linear-gradient(135deg, #e8f4f8 0%, #d0e8f0 50%, #e8f4f8 100%);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            transition: background-color var(--transition-speed), color var(--transition-speed);
            overflow-x: hidden;
        }
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--bg-tertiary);
            border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-blue);
        }
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--nav-height);
            background: rgba(23, 26, 33, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            transition: all var(--transition-speed);
        }
        .navbar.scrolled {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            background: rgba(23, 26, 33, 0.95);
        }
        .navbar .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 30px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-highlight);
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 1px;
        }
        .logo-icon {
            width: 44px;
            height: 44px;
            background: var(--accent-blue);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #1b2838;
            font-weight: 900;
        }
        .logo-text {
            background: linear-gradient(135deg, #66c0f4, #a1cd44);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .nav-links {
            display: flex;
            list-style: none;
            gap: 5px;
            align-items: center;
        }
        .nav-links li a {
            display: block;
            padding: 10px 18px;
            color: var(--text-primary);
            text-decoration: none;
            border-radius: 4px;
            transition: all var(--transition-speed);
            font-size: 0.95rem;
            font-weight: 500;
            position: relative;
            white-space: nowrap;
        }
        .nav-links li a::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%) scaleX(0);
            width: 60%;
            height: 2px;
            background: var(--accent-blue);
            transition: transform var(--transition-speed);
            border-radius: 2px;
        }
        .nav-links li a:hover,
        .nav-links li a.active {
            color: var(--text-highlight);
            background: rgba(102, 192, 244, 0.1);
        }
        .nav-links li a:hover::after,
        .nav-links li a.active::after {
            transform: translateX(-50%) scaleX(1);
        }
        .nav-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .btn-icon {
            width: 40px;
            height: 40px;
            border: none;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all var(--transition-speed);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-icon:hover {
            background: rgba(102, 192, 244, 0.2);
            color: var(--accent-blue);
            transform: scale(1.05);
        }
        .mobile-menu-btn {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 5px;
        }
        .mobile-menu-btn span {
            display: block;
            width: 25px;
            height: 2px;
            background: var(--text-primary);
            border-radius: 2px;
        }
        .page-header {
            margin-top: var(--nav-height);
            background: var(--gradient-hero);
            padding: 60px 0;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .page-header h1 {
            font-size: 2.8rem;
            font-weight: 900;
            color: var(--text-highlight);
            margin-bottom: 10px;
        }
        .page-header .breadcrumb {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .page-header .breadcrumb a {
            color: var(--accent-blue);
            text-decoration: none;
        }
        .page-header .breadcrumb a:hover {
            text-decoration: underline;
        }
        .main-content {
            padding: 40px 0 80px;
        }
        .main-content .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 30px;
        }
        .guide-categories {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }
        .guide-cat-card {
            background: var(--bg-secondary);
            border-radius: var(--border-radius);
            padding: 28px 20px;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition-speed);
            box-shadow: var(--shadow-card);
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }
        .guide-cat-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
            border-color: var(--accent-blue);
        }
        .guide-cat-card.active {
            border-color: var(--accent-blue);
            background: rgba(102, 192, 244, 0.08);
        }
        .guide-cat-icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 15px;
        }
        .guide-cat-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-highlight);
            margin-bottom: 5px;
        }
        .guide-cat-count {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .guide-cat-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 10px;
            height: 10px;
            background: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
        }
        .search-guide-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }
        .search-guide-bar input {
            flex: 1;
            min-width: 250px;
            padding: 14px 22px;
            background: var(--bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border-radius: 30px;
            outline: none;
            font-size: 0.95rem;
            transition: all var(--transition-speed);
        }
        .search-guide-bar input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(102, 192, 244, 0.08);
        }
        .search-guide-bar select {
            padding: 14px 20px;
            background: var(--bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border-radius: 30px;
            outline: none;
            font-size: 0.9rem;
            cursor: pointer;
            min-width: 160px;
        }
        .guides-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 25px;
        }
        .guide-card {
            background: var(--bg-secondary);
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--shadow-card);
            transition: all var(--transition-speed);
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }
        .guide-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }
        .guide-card-header {
            padding: 25px;
            display: flex;
            align-items: flex-start;
            gap: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .guide-card-icon {
            font-size: 2.5rem;
            width: 60px;
            height: 60px;
            background: var(--bg-tertiary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .guide-card-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-highlight);
            margin-bottom: 8px;
            line-height: 1.4;
        }
        .guide-card-meta {
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .guide-card-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .guide-card-body {
            padding: 20px 25px;
            flex: 1;
        }
        .guide-card-body p {
            color: var(--text-secondary);
            font-size: 0.88rem;
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .guide-card-footer {
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 0.82rem;
            color: var(--text-secondary);
        }
        .guide-card-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .guide-tag {
            padding: 3px 10px;
            background: rgba(102, 192, 244, 0.1);
            color: var(--accent-blue);
            border-radius: 12px;
            font-size: 0.73rem;
        }
        .guide-tag.hot {
            background: rgba(231, 76, 60, 0.15);
            color: var(--accent-red);
        }
        .guide-tag.new {
            background: rgba(161, 205, 68, 0.15);
            color: var(--accent-green);
        }
        .guide-detail-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            overflow-y: auto;
            padding: 40px 20px;
        }
        .guide-detail-modal.active {
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }
        .guide-detail-content {
            background: var(--bg-secondary);
            border-radius: var(--border-radius);
            max-width: 800px;
            width: 100%;
            padding: 35px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            animation: modalSlideIn 0.3s ease;
        }
        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .guide-detail-close {
            float: right;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: var(--text-primary);
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.3rem;
            transition: all var(--transition-speed);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .guide-detail-close:hover {
            background: var(--accent-red);
            color: #fff;
        }
        .guide-detail-content h2 {
            font-size: 1.6rem;
            color: var(--text-highlight);
            margin-bottom: 15px;
            padding-right: 50px;
        }
        .guide-detail-content .guide-toc {
            background: var(--bg-primary);
            border-radius: var(--border-radius);
            padding: 20px;
            margin: 20px 0;
            border-left: 3px solid var(--accent-blue);
        }
        .guide-detail-content .guide-toc h4 {
            color: var(--accent-blue);
            margin-bottom: 10px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .guide-detail-content .guide-toc ul {
            list-style: none;
        }
        .guide-detail-content .guide-toc ul li {
            padding: 6px 0;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .guide-detail-content .guide-toc ul li::before {
            content: '▸ ';
            color: var(--accent-blue);
        }
        .guide-detail-content .guide-section {
            margin-bottom: 25px;
        }
        .guide-detail-content .guide-section h3 {
            color: var(--text-highlight);
            margin-bottom: 12px;
            font-size: 1.15rem;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .guide-detail-content .guide-section p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.8;
        }
        .guide-detail-content .guide-tip {
            background: rgba(161, 205, 68, 0.08);
            border: 1px solid rgba(161, 205, 68, 0.2);
            padding: 15px;
            border-radius: var(--border-radius);
            margin: 15px 0;
            font-size: 0.9rem;
            color: var(--accent-green);
        }
        .related-guides-section {
            margin-top: 50px;
        }
        .related-guides-section h3 {
            font-size: 1.2rem;
            color: var(--text-highlight);
            margin-bottom: 20px;
        }
        .related-guides-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }
        .related-guide-mini {
            background: var(--bg-secondary);
            border-radius: var(--border-radius);
            padding: 15px;
            text-decoration: none;
            color: inherit;
            transition: all var(--transition-speed);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .related-guide-mini:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }
        .related-mini-icon {
            font-size: 1.8rem;
        }
        .related-mini-title {
            font-weight: 600;
            color: var(--text-highlight);
            font-size: 0.88rem;
        }
        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            grid-column: 1 / -1;
        }
        .no-results .icon-large {
            font-size: 4rem;
            display: block;
            margin-bottom: 15px;
        }
        .footer {
            background: var(--bg-secondary);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding: 40px 0;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 46px;
            height: 46px;
            background: var(--bg-tertiary);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: var(--text-highlight);
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all var(--transition-speed);
            z-index: 999;
        }
        .back-to-top.visible {
            opacity: 1;
            visibility: visible;
        }
        .back-to-top:hover {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: #1b2838;
            transform: translateY(-4px);
            box-shadow: 0 6px 20px rgba(102, 192, 244, 0.4);
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .guide-card {
            animation: fadeInUp 0.4s ease forwards;
        }
        @media (max-width: 768px) {
            .nav-links {
                display: none;
                position: absolute;
                top: var(--nav-height);
                left: 0;
                width: 100%;
                background: rgba(23, 26, 33, 0.98);
                flex-direction: column;
                padding: 20px;
                backdrop-filter: blur(20px);
                z-index: 999;
            }
            .nav-links.active {
                display: flex;
            }
            .mobile-menu-btn {
                display: flex;
            }
            .page-header h1 {
                font-size: 2rem;
            }
            .guides-grid {
                grid-template-columns: 1fr;
            }
            .guide-categories {
                grid-template-columns: repeat(2, 1fr);
            }
            .guide-detail-content {
                padding: 20px;
            }
        }
        @media (max-width: 480px) {
            .guide-categories {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="container">
            <a href="home.html" class="logo">
                <div class="logo-icon">G</div>
                <span class="logo-text">GameHub</span>
            </a>
            <ul class="nav-links" id="navLinks">
                <li><a href="home.html">首页</a></li>
                <li><a href="games.html">游戏库</a></li>
                <li><a href="ranking.html">排行榜</a></li>
                <li><a href="news.html">新闻</a></li>
                <li><a href="guide.html" class="active">攻略</a></li>
                <li><a href="developers.html">开发商</a></li>
                <li><a href="community.html">社区</a></li>
            </ul>
            <div class="nav-actions">
                <button class="btn-icon" id="btnThemeToggle" title="切换主题">🌙</button>
                <button class="mobile-menu-btn" id="mobileMenuBtn">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </nav>

    <section class="page-header">
        <div class="container">
            <h1>📖 攻略中心</h1>
            <p class="breadcrumb"><a href="home.html">首页</a> / 攻略中心</p>
        </div>
    </section>

    <section class="main-content">
        <div class="container">
            <div class="guide-categories" id="guideCategories">
                <div class="guide-cat-card active" data-category="all">
                    <span class="guide-cat-icon">📚</span>
                    <div class="guide-cat-name">全部攻略</div>
                    <div class="guide-cat-count">共 15 篇</div>
                </div>
                <div class="guide-cat-card" data-category="beginner">
                    <span class="guide-cat-icon">🌱</span>
                    <div class="guide-cat-name">新手入门</div>
                    <div class="guide-cat-count">5 篇攻略</div>
                </div>
                <div class="guide-cat-card" data-category="character">
                    <span class="guide-cat-icon">🦸</span>
                    <div class="guide-cat-name">角色攻略</div>
                    <div class="guide-cat-count">4 篇攻略</div>
                    <div class="guide-cat-badge"></div>
                </div>
                <div class="guide-cat-card" data-category="weapon">
                    <span class="guide-cat-icon">⚔️</span>
                    <div class="guide-cat-name">武器攻略</div>
                    <div class="guide-cat-count">3 篇攻略</div>
                </div>
                <div class="guide-cat-card" data-category="map">
                    <span class="guide-cat-icon">🗺️</span>
                    <div class="guide-cat-name">地图攻略</div>
                    <div class="guide-cat-count">3 篇攻略</div>
                </div>
            </div>

            <div class="search-guide-bar">
                <input type="text" id="guideSearchInput" placeholder="🔍 搜索攻略...（输入游戏名或关键词）" autocomplete="off">
                <select id="guideGameFilter">
                    <option value="all">全部游戏</option>
                    <option value="原神">原神</option>
                    <option value="黑神话悟空">黑神话：悟空</option>
                    <option value="Minecraft">Minecraft</option>
                    <option value="艾尔登法环">艾尔登法环</option>
                    <option value="CS2">CS2</option>
                    <option value="英雄联盟">英雄联盟</option>
                </select>
            </div>

            <div class="guides-grid" id="guidesGrid"></div>
            <div class="no-results" id="noGuideResults" style="display:none;">
                <span class="icon-large">📭</span>
                <h3>没有找到匹配的攻略</h3>
                <p>试试调整搜索条件或选择其他分类</p>
            </div>
        </div>
    </section>

    <div class="guide-detail-modal" id="guideDetailModal">
        <div class="guide-detail-content" id="guideDetailContent"></div>
    </div>

    <footer class="footer">
        <p>&copy; 2025 GameHub 游戏资料库 | 攻略内容由社区玩家贡献 | 仅供学习使用</p>
    </footer>

    <button class="back-to-top" id="backToTop" title="返回顶部">↑</button>

        let activeCategory = 'all';

        function getFilteredGuides() {
            let guides = [...allGuides];
            if (activeCategory !== 'all') {
                guides = guides.filter(g => g.category === activeCategory);
            }
            if (activeGameFilter !== 'all') {
                guides = guides.filter(g => g.game === activeGameFilter);
            }
            const query = document.getElementById('guideSearchInput').value.toLowerCase().trim();
            if (query) {
                guides = guides.filter(g =>
                    g.title.toLowerCase().includes(query) ||
                    g.game.toLowerCase().includes(query) ||
                    g.tags.some(t => t.toLowerCase().includes(query)) ||
                    g.excerpt.toLowerCase().includes(query)
                );
            }
            return guides;
        }

        function renderGuides() {
            const guides = getFilteredGuides();
            const grid = document.getElementById('guidesGrid');
            const noResults = document.getElementById('noGuideResults');
            if (guides.length === 0) {
                grid.innerHTML = '';
                noResults.style.display = 'block';
            } else {
                noResults.style.display = 'none';
                grid.innerHTML = guides.map((g, i) => `
                    <div class="guide-card" style="animation-delay:${i*0.05}s" data-id="${g.id}">
                        <div class="guide-card-header">
                            <div class="guide-card-icon">${g.icon}</div>
                            <div>
                                <div class="guide-card-title">${g.title}</div>
                                <div class="guide-card-meta">
                                    <span>👤 ${g.author}</span>
                                    <span>📅 ${g.date}</span>
                                </div>
                            </div>
                        </div>
                        <div class="guide-card-body">
                            <p>${g.excerpt}</p>
                        </div>
                        <div class="guide-card-footer">
                            <div class="guide-card-tags">
                                ${g.tags.map(t => `<span class="guide-tag ${t==='新手'||t==='必读'?'hot':t==='版本'?'new':''}">${t}</span>`).join('')}
                            </div>
                            <span>👁️ ${(g.views/1000).toFixed(1)}K | ❤️ ${g.likes}</span>

                grid.querySelectorAll('.guide-card').forEach(card => {
                    card.addEventListener('click', () => {
                        const id = parseInt(card.dataset.id);
                        openGuideDetail(id);

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';

            document.getElementById('guideDetailClose').addEventListener('click', closeGuideDetail);
            content.querySelectorAll('.related-guide-mini').forEach(mini => {
                mini.addEventListener('click', () => {
                    const rid = parseInt(mini.dataset.rid);
                    openGuideDetail(rid);
                    document.getElementById('guideDetailContent').scrollTop = 0;
                });
            });
        }

        function closeGuideDetail() {
            document.getElementById('guideDetailModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        document.getElementById('guideDetailModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeGuideDetail();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeGuideDetail();
        });

        document.getElementById('guideCategories').addEventListener('click', (e) => {
            const card = e.target.closest('.guide-cat-card');
            if (!card) return;
            document.querySelectorAll('.guide-cat-card').forEach(c => c.classList.remove('active'));
            card.classList.add('active');
            activeCategory = card.dataset.category;
            renderGuides();
        });

        document.getElementById('guideGameFilter').addEventListener('change', (e) => {
            activeGameFilter = e.target.value;
            renderGuides();
        });

        let guideSearchTimeout;
        document.getElementById('guideSearchInput').addEventListener('input', () => {
            clearTimeout(guideSearchTimeout);
            guideSearchTimeout = setTimeout(renderGuides, 350);
        });

        const navbar = document.getElementById('navbar');
        const backToTop = document.getElementById('backToTop');
        window.addEventListener('scroll', () => {
            const scrollY = window.scrollY;
            navbar.classList.toggle('scrolled', scrollY > 50);
            backToTop.classList.toggle('visible', scrollY > 400);
        });
        backToTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const navLinks = document.getElementById('navLinks');
        mobileMenuBtn.addEventListener('click', () => navLinks.classList.toggle('active'));
        navLinks.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => navLinks.classList.remove('active'));
        });

        const btnThemeToggle = document.getElementById('btnThemeToggle');
        const savedTheme = localStorage.getItem('gamehub-theme');
        if (savedTheme === 'light') {
            document.body.classList.add('light-mode');
            btnThemeToggle.textContent = '☀️';
        }
        btnThemeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            btnThemeToggle.textContent = isLight ? '☀️' : '🌙';
            localStorage.setItem('gamehub-theme', isLight ? 'light' : 'dark');
        });

        renderGuides();
        console.log('%c📖 攻略中心页面已就绪 | 共 %d 篇攻略', 'color:#a1cd44;font-size:1.1em;', allGuides.length);
    </script>
</body>
</html>
