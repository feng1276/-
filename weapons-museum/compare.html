<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>兵器对比 - 世界兵器博物馆</title>
    <style>
        :root {
            --bg-primary:#0d1117;--bg-secondary:#161b22;--bg-tertiary:#21262d;--bg-card:#1a1f2b;
            --text-primary:#c9d1d9;--text-secondary:#8b949e;--text-highlight:#f0f6fc;
            --accent-military:#2d5a27;--accent-green:#3a7d32;--accent-gold:#c9a84c;--accent-red:#c0392b;
            --accent-blue:#2980b9;--accent-hud:#00ff88;--border-military:#2d3a2d;
            --gradient-hero:linear-gradient(180deg,#0d1117 0%,#1a2f1a 30%,#0d1117 100%);
            --shadow-card:0 4px 20px rgba(0,0,0,0.6);--shadow-hover:0 8px 35px rgba(201,168,76,0.25);
            --border-radius:6px;--transition-speed:0.3s;--nav-height:70px;--max-width:1400px;
        }
        body.light-mode{--bg-primary:#e8ecf1;--bg-secondary:#ffffff;--bg-tertiary:#d5dbe3;--bg-card:#f5f5f0;--text-primary:#2c3e50;--text-secondary:#5a6c7d;--text-highlight:#1a1a2e;--border-military:#c5c9b8;--gradient-hero:linear-gradient(180deg,#d5dbe3 0%,#c5c9b8 30%,#e8ecf1 100%);--shadow-card:0 4px 20px rgba(0,0,0,0.1);}
        *{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;font-size:16px;}
        body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;background-color:var(--bg-primary);color:var(--text-primary);line-height:1.6;transition:background-color var(--transition-speed),color var(--transition-speed);}
        ::-webkit-scrollbar{width:10px;}::-webkit-scrollbar-track{background:var(--bg-secondary);}::-webkit-scrollbar-thumb{background:var(--accent-military);border-radius:2px;}
        .navbar{position:fixed;top:0;left:0;width:100%;height:var(--nav-height);background:rgba(13,17,23,0.92);backdrop-filter:blur(15px);border-bottom:1px solid var(--border-military);z-index:1000;}.navbar.scrolled{box-shadow:0 4px 25px rgba(0,0,0,0.8);}
        .navbar .container{max-width:var(--max-width);margin:0 auto;padding:0 30px;height:100%;display:flex;align-items:center;justify-content:space-between;}
        .logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text-highlight);font-size:1.4rem;font-weight:800;}.logo-icon{width:46px;height:46px;background:linear-gradient(135deg,#2d5a27,#1a3a15);border:2px solid var(--accent-green);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:var(--accent-gold);}.logo-text{background:linear-gradient(135deg,#c9a84c,#8b7a3a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-transform:uppercase;}
        .nav-links{display:flex;list-style:none;gap:2px;}.nav-links li a{display:block;padding:10px 14px;color:var(--text-secondary);text-decoration:none;border-radius:3px;transition:all var(--transition-speed);font-size:0.85rem;font-weight:500;text-transform:uppercase;letter-spacing:0.5px;position:relative;}.nav-links li a::before{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%) scaleX(0);width:60%;height:2px;background:var(--accent-green);transition:transform var(--transition-speed);}.nav-links li a:hover,.nav-links li a.active{color:var(--accent-gold);}.nav-links li a:hover::before,.nav-links li a.active::before{transform:translateX(-50%) scaleX(1);}
        .nav-actions{display:flex;gap:10px;}.btn-icon{width:38px;height:38px;border:1px solid var(--border-military);background:rgba(45,90,39,0.1);color:var(--text-secondary);border-radius:3px;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;}.btn-icon:hover{background:rgba(58,125,50,0.2);border-color:var(--accent-green);color:var(--accent-hud);}
        .mobile-menu-btn{display:none;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;}.mobile-menu-btn span{display:block;width:25px;height:2px;background:var(--accent-green);}
        .page-header{margin-top:var(--nav-height);background:var(--gradient-hero);padding:60px 0;text-align:center;border-bottom:1px solid var(--border-military);}.page-header h1{font-size:2.5rem;font-weight:900;color:var(--text-highlight);text-transform:uppercase;}.page-header .breadcrumb{color:var(--text-secondary);font-size:0.85rem;}.page-header .breadcrumb a{color:var(--accent-hud);text-decoration:none;}
        .main-content{padding:40px 0 80px;}.main-content .container{max-width:var(--max-width);margin:0 auto;padding:0 30px;}
        .compare-setup{background:var(--bg-card);border:1px solid var(--border-military);border-radius:var(--border-radius);padding:35px;margin-bottom:30px;box-shadow:var(--shadow-card);}
        .compare-setup h2{color:var(--accent-gold);text-align:center;margin-bottom:25px;text-transform:uppercase;letter-spacing:2px;}
        .compare-selectors{display:flex;gap:20px;align-items:center;justify-content:center;flex-wrap:wrap;}
        .compare-selector{flex:1;min-width:250px;}.compare-selector label{display:block;color:var(--text-secondary);font-size:0.8rem;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
        .compare-selector select{width:100%;padding:14px;background:var(--bg-tertiary);border:1px solid var(--border-military);color:var(--text-primary);border-radius:3px;font-size:0.9rem;cursor:pointer;outline:none;}.compare-selector select:focus{border-color:var(--accent-green);}
        .compare-vs{font-size:2.5rem;color:var(--accent-red);font-weight:900;text-align:center;}
        .btn{display:inline-flex;align-items:center;gap:8px;padding:14px 32px;border-radius:3px;font-size:0.9rem;font-weight:700;cursor:pointer;border:none;transition:all var(--transition-speed);text-transform:uppercase;letter-spacing:1px;}
        .btn-compare{background:var(--accent-military);color:var(--accent-hud);border:1px solid var(--accent-green);margin-top:25px;}
        .btn-compare:hover{background:var(--accent-green);color:#fff;}
        .compare-result{display:none;}
        .compare-result.active{display:block;}
        .compare-header{display:flex;gap:20px;margin-bottom:30px;}
        .compare-col{flex:1;background:var(--bg-card);border:1px solid var(--border-military);border-radius:var(--border-radius);padding:25px;text-align:center;}
        .compare-col.winner{border-color:var(--accent-gold);box-shadow:0 0 30px rgba(201,168,76,0.3);}
        .compare-col-icon{font-size:4rem;display:block;margin-bottom:10px;}
        .compare-col-name{font-size:1.2rem;font-weight:800;color:var(--text-highlight);text-transform:uppercase;}
        .compare-col-nation{color:var(--accent-gold);font-size:0.85rem;}
        .compare-divider{display:flex;align-items:center;justify-content:center;font-size:2rem;color:var(--accent-red);font-weight:900;width:60px;}
        .compare-table-full{width:100%;border-collapse:collapse;background:var(--bg-card);border:1px solid var(--border-military);border-radius:var(--border-radius);overflow:hidden;}
        .compare-table-full th,.compare-table-full td{padding:14px 18px;text-align:center;border:1px solid var(--border-military);font-size:0.9rem;}
        .compare-table-full th{background:var(--bg-tertiary);color:var(--accent-gold);text-transform:uppercase;letter-spacing:1px;width:30%;}
        .compare-table-full td{color:var(--text-primary);}
        .compare-table-full td.better{color:var(--accent-hud);font-weight:700;}
        .compare-table-full td.better::after{content:' ◀';font-size:0.7rem;}
        .footer{background:var(--bg-secondary);border-top:1px solid var(--border-military);padding:30px;text-align:center;color:var(--text-secondary);font-size:0.8rem;}
        @media(max-width:768px){.nav-links{display:none;position:absolute;top:var(--nav-height);left:0;width:100%;background:rgba(13,17,23,0.98);flex-direction:column;padding:20px;z-index:999;}.nav-links.active{display:flex;}.mobile-menu-btn{display:flex;}.page-header h1{font-size:1.8rem;}.compare-selectors{flex-direction:column;}.compare-vs{font-size:1.5rem;}.compare-header{flex-direction:column;}.compare-divider{width:100%;}}
    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="container">
            <a href="home.html" class="logo"><div class="logo-icon">⚔</div><span class="logo-text">兵器博物馆</span></a>
            <ul class="nav-links" id="navLinks">
                <li><a href="home.html">首页</a></li><li><a href="weapons.html">兵器大全</a></li><li><a href="tanks.html">坦克馆</a></li><li><a href="aircraft.html">战机馆</a></li><li><a href="navy.html">海军馆</a></li><li><a href="missiles.html">导弹馆</a></li><li><a href="compare.html" class="active">对比</a></li><li><a href="ranking.html">排行榜</a></li>
            </ul>
            <div class="nav-actions"><button class="btn-icon" id="btnThemeToggle">◐</button><button class="mobile-menu-btn" id="mobileMenuBtn"><span></span><span></span><span></span></button></div>
        </div>
    </nav>

    <section class="page-header"><h1>⚖️ 兵器对比</h1><p class="breadcrumb"><a href="home.html">首页</a> / 兵器对比</p></section>

    <section class="main-content">
        <div class="container">
            <div class="compare-setup">
                <h2>选择兵器进行对比</h2>
                <div class="compare-selectors">
                    <div class="compare-selector"><label>兵器 A</label><select id="weaponA"><option value="">-- 选择兵器 --</option></select></div>
                    <div class="compare-vs">VS</div>
                    <div class="compare-selector"><label>兵器 B</label><select id="weaponB"><option value="">-- 选择兵器 --</option></select></div>
                </div>
                <div style="text-align:center;"><button class="btn btn-compare" id="btnCompare">开始对比</button></div>
            </div>
            <div class="compare-result" id="compareResult"></div>
        </div>
    </section>

    <footer class="footer"><p>© 2025 世界兵器博物馆 | 对比数据来源公开资料 | 仅供学习参考</p></footer>

    <script>
        const allWeapons = [
            {id:'m1a2',name:'M1A2 Abrams',category:'坦克',nation:'美国',icon:'🛡️',specs:{重量:'68吨',长度:'9.83m',主炮:'120mm',发动机功率:'1500hp',最大速度:'67km/h',乘员:'4人',装甲:'贫铀复合装甲'}},
            {id:'leopard2',name:'Leopard 2A7+',category:'坦克',nation:'德国',icon:'🐆',specs:{重量:'62吨',长度:'9.97m',主炮:'120mm',发动机功率:'1500hp',最大速度:'72km/h',乘员:'4人',装甲:'模块化复合装甲'}},
            {id:'t90',name:'T-90M',category:'坦克',nation:'俄罗斯',icon:'🔴',specs:{重量:'48吨',长度:'9.53m',主炮:'125mm',发动机功率:'1130hp',最大速度:'60km/h',乘员:'3人',装甲:'复合+ERA'}},
            {id:'type99',name:'99A式',category:'坦克',nation:'中国',icon:'🛡️',specs:{重量:'58吨',长度:'11m',主炮:'125mm',发动机功率:'1500hp',最大速度:'70km/h',乘员:'3人',装甲:'复合+ERA'}},
            {id:'f22',name:'F-22 Raptor',category:'战机',nation:'美国',icon:'🦅',specs:{最大速度:'2.25马赫',航程:'2960km',升限:'20000m',发动机:'F119×2',武器:'20mm+AIM-120',首飞:'1997年'}},
            {id:'j20',name:'歼-20 威龙',category:'战机',nation:'中国',icon:'🐉',specs:{最大速度:'2.0马赫',航程:'3400km',升限:'20000m',发动机:'涡扇-15×2',武器:'霹雳-15+霹雳-10',首飞:'2011年'}},
            {id:'su57',name:'苏-57',category:'战机',nation:'俄罗斯',icon:'🦇',specs:{最大速度:'2.0马赫',航程:'3500km',升限:'20000m',发动机:'AL-41F1×2',武器:'30mm+R-77',首飞:'2010年'}},
            {id:'ford',name:'福特号航母',category:'舰艇',nation:'美国',icon:'🚢',specs:{排水量:'100000吨',舰长:'337m',舰载机:'75+架',动力:'核反应堆×2',乘员:'4539人',服役:'2017年'}},
            {id:'type055',name:'055型驱逐舰',category:'舰艇',nation:'中国',icon:'⚓',specs:{排水量:'13000吨',舰长:'180m',武器:'112单元VLS',动力:'燃气轮机×4',乘员:'310人',服役:'2020年'}},
            {id:'df41',name:'东风-41',category:'导弹',nation:'中国',icon:'🚀',specs:{射程:'14000km',速度:'25马赫',制导:'惯性+星光+北斗',弹头:'10枚分导式',发射方式:'公路机动'}},
            {id:'sarmat',name:'萨尔马特',category:'导弹',nation:'俄罗斯',icon:'☠️',specs:{射程:'18000km',速度:'20马赫',制导:'惯性+GLONASS',弹头:'15枚分导式',发射方式:'井基发射'}}
        ];

        function populateSelects(){const sA=document.getElementById('weaponA'),sB=document.getElementById('weaponB');const opts='<option value="">-- 选择兵器 --</option>'+allWeapons.map(w=>`<option value="${w.id}">[${w.category}] ${w.name} (${w.nation})</option>`).join('');sA.innerHTML=opts;sB.innerHTML=opts;}

        document.getElementById('btnCompare').addEventListener('click',()=>{const idA=document.getElementById('weaponA').value,idB=document.getElementById('weaponB').value;if(!idA||!idB){alert('请选择两件兵器进行对比');return;}if(idA===idB){alert('请选择不同的兵器');return;}const a=allWeapons.find(w=>w.id===idA),b=allWeapons.find(w=>w.id===idB);const allKeys=[...new Set([...Object.keys(a.specs),...Object.keys(b.specs)])];let aWins=0,bWins=0;const rows=allKeys.map(k=>{const va=a.specs[k]||'-',vb=b.specs[k]||'-';let aBetter=false,bBetter=false;const na=parseFloat(va),nb=parseFloat(vb);if(!isNaN(na)&&!isNaN(nb)){if(na>nb){aWins++;aBetter=true;}else if(nb>na){bWins++;bBetter=true;}}return`<tr><th>${k}</th><td class="${aBetter?'better':''}">${va}</td><td class="${bBetter?'better':''}">${vb}</td></tr>`;}).join('');const aClass=aWins>bWins?'winner':'',bClass=bWins>aWins?'winner':'';document.getElementById('compareResult').innerHTML=`<div class="compare-header"><div class="compare-col ${aClass}"><span class="compare-col-icon">${a.icon}</span><div class="compare-col-name">${a.name}</div><div class="compare-col-nation">${a.nation} | ${a.category}</div><div style="color:var(--accent-hud);margin-top:8px;">优势参数: ${aWins}</div></div><div class="compare-divider">⚡</div><div class="compare-col ${bClass}"><span class="compare-col-icon">${b.icon}</span><div class="compare-col-name">${b.name}</div><div class="compare-col-nation">${b.nation} | ${b.category}</div><div style="color:var(--accent-hud);margin-top:8px;">优势参数: ${bWins}</div></div></div><table class="compare-table-full"><thead><tr><th>参数</th><th>${a.name}</th><th>${b.name}</th></tr></thead><tbody>${rows}</tbody></table>`;document.getElementById('compareResult').classList.add('active');document.getElementById('compareResult').scrollIntoView({behavior:'smooth'});});

        const navbar=document.getElementById('navbar');window.addEventListener('scroll',()=>{navbar.classList.toggle('scrolled',window.scrollY>50);});
        const mobileMenuBtn=document.getElementById('mobileMenuBtn'),navLinks=document.getElementById('navLinks');mobileMenuBtn.addEventListener('click',()=>navLinks.classList.toggle('active'));navLinks.querySelectorAll('a').forEach(l=>l.addEventListener('click',()=>navLinks.classList.remove('active')));
        const btnThemeToggle=document.getElementById('btnThemeToggle');const saved=localStorage.getItem('museum-theme');if(saved==='light'){document.body.classList.add('light-mode');btnThemeToggle.textContent='◑';}btnThemeToggle.addEventListener('click',()=>{document.body.classList.toggle('light-mode');const isL=document.body.classList.contains('light-mode');btnThemeToggle.textContent=isL?'◑':'◐';localStorage.setItem('museum-theme',isL?'light':'dark');});
        populateSelects();
        console.log('%c⚖️ 兵器对比页面已就绪 | 共 %d 件兵器可供对比','color:#c9a84c;',allWeapons.length);
    </script>
</body>
</html>
