<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导弹馆 - 世界兵器博物馆</title>
    <style>
        :root {
            --bg-primary:#0d1117;--bg-secondary:#161b22;--bg-tertiary:#21262d;--bg-card:#1a1f2b;
            --text-primary:#c9d1d9;--text-secondary:#8b949e;--text-highlight:#f0f6fc;
            --accent-military:#2d5a27;--accent-green:#3a7d32;--accent-gold:#c9a84c;--accent-red:#c0392b;
            --accent-blue:#2980b9;--accent-hud:#00ff88;--accent-missile:#e74c3c;--border-military:#2d3a2d;
            --gradient-hero:linear-gradient(180deg,#0d1117 0%,#2a1010 30%,#0d1117 100%);
            --shadow-card:0 4px 20px rgba(0,0,0,0.6);--shadow-hover:0 8px 35px rgba(231,76,60,0.25);
            --border-radius:6px;--transition-speed:0.3s;--nav-height:70px;--max-width:1400px;
        }
        body.light-mode{--bg-primary:#e8ecf1;--bg-secondary:#ffffff;--bg-tertiary:#d5dbe3;--bg-card:#f5f5f0;--text-primary:#2c3e50;--text-secondary:#5a6c7d;--text-highlight:#1a1a2e;--border-military:#c5c9b8;--gradient-hero:linear-gradient(180deg,#d5dbe3 0%,#d0c8b8 30%,#e8ecf1 100%);--shadow-card:0 4px 20px rgba(0,0,0,0.1);--shadow-hover:0 8px 35px rgba(192,57,43,0.15);}
        *{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;font-size:16px;}
        body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;background-color:var(--bg-primary);color:var(--text-primary);line-height:1.6;transition:background-color var(--transition-speed),color var(--transition-speed);overflow-x:hidden;}
        body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at 50% 0%,rgba(231,76,60,0.03) 0%,transparent 60%);pointer-events:none;z-index:0;}body>*{position:relative;z-index:1;}
        ::-webkit-scrollbar{width:10px;}::-webkit-scrollbar-track{background:var(--bg-secondary);}::-webkit-scrollbar-thumb{background:var(--accent-red);border-radius:2px;}
        .navbar{position:fixed;top:0;left:0;width:100%;height:var(--nav-height);background:rgba(13,17,23,0.92);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);border-bottom:1px solid var(--border-military);z-index:1000;transition:all var(--transition-speed);}.navbar.scrolled{box-shadow:0 4px 25px rgba(0,0,0,0.8);}
        .navbar .container{max-width:var(--max-width);margin:0 auto;padding:0 30px;height:100%;display:flex;align-items:center;justify-content:space-between;}
        .logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text-highlight);font-size:1.4rem;font-weight:800;letter-spacing:1px;}.logo-icon{width:46px;height:46px;background:linear-gradient(135deg,#3d1a1a,#2a1010);border:2px solid var(--accent-missile);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:var(--accent-gold);font-weight:900;box-shadow:0 0 15px rgba(231,76,60,0.3);}.logo-text{background:linear-gradient(135deg,#c9a84c,#8b7a3a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-transform:uppercase;}
        .nav-links{display:flex;list-style:none;gap:2px;}.nav-links li a{display:block;padding:10px 14px;color:var(--text-secondary);text-decoration:none;border-radius:3px;transition:all var(--transition-speed);font-size:0.85rem;font-weight:500;text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap;position:relative;}.nav-links li a::before{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%) scaleX(0);width:60%;height:2px;background:var(--accent-missile);transition:transform var(--transition-speed);}.nav-links li a:hover,.nav-links li a.active{color:var(--accent-gold);background:rgba(201,168,76,0.05);}.nav-links li a:hover::before,.nav-links li a.active::before{transform:translateX(-50%) scaleX(1);}
        .nav-actions{display:flex;gap:10px;align-items:center;}.btn-icon{width:38px;height:38px;border:1px solid var(--border-military);background:rgba(231,76,60,0.1);color:var(--text-secondary);border-radius:3px;cursor:pointer;font-size:1.1rem;transition:all var(--transition-speed);display:flex;align-items:center;justify-content:center;}.btn-icon:hover{background:rgba(231,76,60,0.2);border-color:var(--accent-missile);color:var(--accent-missile);}
        .mobile-menu-btn{display:none;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;padding:5px;}.mobile-menu-btn span{display:block;width:25px;height:2px;background:var(--accent-missile);border-radius:2px;}
        .page-header{margin-top:var(--nav-height);background:var(--gradient-hero);padding:60px 0;text-align:center;border-bottom:1px solid var(--border-military);}.page-header h1{font-size:2.5rem;font-weight:900;color:var(--text-highlight);text-transform:uppercase;letter-spacing:2px;}.page-header .breadcrumb{color:var(--text-secondary);font-size:0.85rem;margin-top:8px;}.page-header .breadcrumb a{color:var(--accent-missile);text-decoration:none;}
        .main-content{padding:40px 0 80px;}.main-content .container{max-width:var(--max-width);margin:0 auto;padding:0 30px;}
        .missile-tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:40px;}
        .missile-tab{padding:12px 24px;background:var(--bg-card);border:1px solid var(--border-military);color:var(--text-secondary);border-radius:3px;cursor:pointer;transition:all var(--transition-speed);font-size:0.85rem;font-weight:600;text-transform:uppercase;letter-spacing:1px;}
        .missile-tab:hover,.missile-tab.active{background:rgba(231,76,60,0.2);border-color:var(--accent-missile);color:var(--accent-missile);}
        .missile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:25px;}
        .missile-card{background:var(--bg-card);border:1px solid var(--border-military);border-radius:var(--border-radius);padding:25px;transition:all var(--transition-speed);cursor:pointer;position:relative;overflow:hidden;}
        .missile-card::before{content:'';position:absolute;top:0;right:0;width:80px;height:80px;background:radial-gradient(circle,rgba(231,76,60,0.1) 0%,transparent 70%);border-radius:50%;}
        .missile-card:hover{transform:translateY(-5px);border-color:var(--accent-missile);box-shadow:var(--shadow-hover);}
        .missile-card-header{display:flex;align-items:center;gap:15px;margin-bottom:15px;}
        .missile-card-icon{font-size:3rem;width:60px;text-align:center;}
        .missile-card-type{display:inline-block;padding:4px 12px;background:rgba(231,76,60,0.15);border:1px solid rgba(231,76,60,0.3);color:var(--accent-missile);font-size:0.7rem;font-weight:700;letter-spacing:1px;border-radius:2px;margin-bottom:6px;}
        .missile-card-name{font-size:1.15rem;font-weight:800;color:var(--text-highlight);text-transform:uppercase;letter-spacing:1px;}
        .missile-card-nation{font-size:0.82rem;color:var(--accent-gold);}
        .missile-card-desc{font-size:0.85rem;color:var(--text-secondary);line-height:1.6;margin-bottom:15px;}
        .missile-specs{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
        .missile-spec{background:var(--bg-tertiary);padding:10px;border-radius:3px;border-left:2px solid var(--accent-missile);}
        .missile-spec-label{font-size:0.68rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:1px;}
        .missile-spec-value{font-size:0.88rem;color:var(--accent-missile);font-weight:700;margin-top:2px;}
        .range-visual{margin-top:40px;background:var(--bg-card);border:1px solid var(--border-military);border-radius:var(--border-radius);padding:30px;}
        .range-visual h3{color:var(--accent-gold);text-transform:uppercase;letter-spacing:2px;font-size:1.1rem;text-align:center;margin-bottom:25px;}
        .range-bar-container{margin-bottom:20px;}
        .range-bar-label{display:flex;justify-content:space-between;font-size:0.8rem;color:var(--text-secondary);margin-bottom:5px;}
        .range-bar{height:8px;background:var(--bg-tertiary);border-radius:4px;overflow:hidden;}
        .range-bar-fill{height:100%;border-radius:4px;transition:width 1.5s ease;}
        .footer{background:var(--bg-secondary);border-top:1px solid var(--border-military);padding:30px;text-align:center;color:var(--text-secondary);font-size:0.8rem;}
        .back-to-top{position:fixed;bottom:30px;right:30px;width:46px;height:46px;background:rgba(231,76,60,0.3);border:1px solid var(--accent-missile);color:var(--accent-missile);border-radius:3px;cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all var(--transition-speed);z-index:999;}.back-to-top.visible{opacity:1;visibility:visible;}.back-to-top:hover{background:var(--accent-missile);border-color:var(--accent-gold);color:#fff;}
        @keyframes fadeInUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}.missile-card{animation:fadeInUp 0.4s ease forwards;}
        @media(max-width:768px){.nav-links{display:none;position:absolute;top:var(--nav-height);left:0;width:100%;background:rgba(13,17,23,0.98);flex-direction:column;padding:20px;backdrop-filter:blur(15px);z-index:999;border-bottom:2px solid var(--accent-military);}.nav-links.active{display:flex;}.mobile-menu-btn{display:flex;}.page-header h1{font-size:1.8rem;}.missile-grid{grid-template-columns:1fr;}}
    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="container">
            <a href="home.html" class="logo"><div class="logo-icon">⚔</div><span class="logo-text">兵器博物馆</span></a>
            <ul class="nav-links" id="navLinks">
                <li><a href="home.html">首页</a></li>
                <li><a href="weapons.html">兵器大全</a></li>
                <li><a href="tanks.html">坦克馆</a></li>
                <li><a href="aircraft.html">战机馆</a></li>
                <li><a href="navy.html">海军馆</a></li>
                <li><a href="missiles.html" class="active">导弹馆</a></li>
                <li><a href="timeline.html">时间轴</a></li>
                <li><a href="ranking.html">排行榜</a></li>
            </ul>
            <div class="nav-actions">
                <button class="btn-icon" id="btnThemeToggle" title="切换主题">◐</button>
                <button class="mobile-menu-btn" id="mobileMenuBtn"><span></span><span></span><span></span></button>
            </div>
        </div>
    </nav>

    <section class="page-header">
        <h1>🚀 导弹馆</h1>
        <p class="breadcrumb"><a href="home.html">首页</a> / 导弹馆</p>
    </section>

    <section class="main-content">
        <div class="container">
            <div class="missile-tabs" id="missileTabs">
                <button class="missile-tab active" data-type="all">全部导弹</button>
                <button class="missile-tab" data-type="洲际导弹">洲际导弹</button>
                <button class="missile-tab" data-type="巡航导弹">巡航导弹</button>
                <button class="missile-tab" data-type="弹道导弹">弹道导弹</button>
            </div>
            <div class="missile-grid" id="missileGrid"></div>

            <div class="range-visual">
                <h3>📏 导弹射程对比</h3>
                <div id="rangeBars"></div>
            </div>
        </div>
    </section>

    <footer class="footer"><p>© 2025 世界兵器博物馆 | 导弹数据来源公开军事资料 | 仅供学习使用</p></footer>
    <button class="back-to-top" id="backToTop" title="返回顶部">▲</button>

    <script>
        const missiles = [
            {id:'df41',name:'东风-41',nation:'中国',type:'洲际导弹',era:'现代',icon:'🚀',desc:'东风-41是中国最新型公路机动洲际弹道导弹，可携带10枚分导式核弹头。射程覆盖全球，具备极强的突防能力和生存能力。',specs:{射程:'14000km',速度:'25马赫',制导方式:'惯性+星光+北斗',弹头:'10枚分导式核弹头',发射方式:'公路机动/铁路机动'}},
            {id:'sarmat',name:'RS-28 萨尔马特',nation:'俄罗斯',type:'洲际导弹',era:'现代',icon:'☠️',desc:'萨尔马特是俄罗斯最新重型洲际弹道导弹，取代老旧的SS-18。可携带高超音速弹头，能够规避现有导弹防御系统。',specs:{射程:'18000km',速度:'20马赫',制导方式:'惯性+GLONASS',弹头:'10-15枚分导式核弹头',发射方式:'井基发射'}},
            {id:'minuteman',name:'LGM-30G 民兵III',nation:'美国',type:'洲际导弹',era:'现代',icon:'🎯',desc:'民兵III是美军唯一的陆基洲际弹道导弹，已服役超过50年。经过多次升级，目前仍在执行核威慑任务。',specs:{射程:'13000km',速度:'23马赫',制导方式:'惯性+GPS',弹头:'3枚分导式核弹头',发射方式:'井基发射'}},
            {id:'tomahawk',name:'BGM-109 战斧',nation:'美国',type:'巡航导弹',era:'现代',icon:'🎯',desc:'战斧巡航导弹是美军最常用的远程精确打击武器。可舰射和潜射，在海湾战争以来的多次冲突中大量使用。',specs:{射程:'2500km',速度:'0.74马赫',制导方式:'GPS+惯性+地形匹配',弹头:'常规/核弹头',发射方式:'舰载/潜射'}},
            {id:'brahmos',name:'布拉莫斯',nation:'俄罗斯/印度',type:'巡航导弹',era:'现代',icon:'💥',desc:'布拉莫斯是俄印联合研制的超音速巡航导弹，速度可达3马赫。有陆基、舰载、空射和潜射等多种型号。',specs:{射程:'450km',速度:'3马赫',制导方式:'惯性+主动雷达',弹头:'常规弹头 300kg',发射方式:'多平台发射'}},
            {id:'v2',name:'V-2火箭',nation:'德国',type:'弹道导弹',era:'二战',icon:'🚀',desc:'V-2是世界上第一种弹道导弹，由德国在二战期间研发。战后美苏两国都基于V-2技术发展了自己的弹道导弹。',specs:{射程:'320km',速度:'4马赫',制导方式:'惯性制导',弹头:'1000kg高爆弹头',发射方式:'固定发射台'}},
            {id:'scud',name:'飞毛腿导弹',nation:'苏联',type:'弹道导弹',era:'冷战',icon:'🚀',desc:'飞毛腿是苏联研发的短程弹道导弹，广泛出口到多个国家。在海湾战争中大量使用，被称为"最著名的弹道导弹"。',specs:{射程:'300-550km',速度:'5马赫',制导方式:'惯性制导',弹头:'常规/化学弹头',发射方式:'公路机动'}}
        ];

        let activeMissileType='all';
        function getFiltered(){return activeMissileType==='all'?missiles:missiles.filter(m=>m.type===activeMissileType);}
        function renderMissiles(){const f=getFiltered();document.getElementById('missileGrid').innerHTML=f.map((m,i)=>`<div class="missile-card" style="animation-delay:${i*0.06}s"><div class="missile-card-header"><span class="missile-card-icon">${m.icon}</span><div><span class="missile-card-type">${m.type}</span><div class="missile-card-name">${m.name}</div><div class="missile-card-nation">${m.nation} | ${m.era}</div></div></div><div class="missile-card-desc">${m.desc}</div><div class="missile-specs">${Object.entries(m.specs).map(([k,v])=>`<div class="missile-spec"><div class="missile-spec-label">${k}</div><div class="missile-spec-value">${v}</div></div>`).join('')}</div></div>`).join('');}
        function renderRangeBars(){const maxRange=20000;document.getElementById('rangeBars').innerHTML=missiles.map(m=>{const pct=Math.min(100,Math.max(5,(parseInt(m.specs.射程)||0)/maxRange*100));return `<div class="range-bar-container"><div class="range-bar-label"><span>${m.name} (${m.nation})</span><span>${m.specs.射程}</span></div><div class="range-bar"><div class="range-bar-fill" style="width:${pct}%;background:linear-gradient(90deg,var(--accent-missile),var(--accent-gold));"></div></div></div>`;}).join('');}
        document.getElementById('missileTabs').addEventListener('click',e=>{const b=e.target.closest('.missile-tab');if(!b)return;document.querySelectorAll('.missile-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeMissileType=b.dataset.type;renderMissiles();});

        const navbar=document.getElementById('navbar'),backToTop=document.getElementById('backToTop');window.addEventListener('scroll',()=>{const s=window.scrollY;navbar.classList.toggle('scrolled',s>50);backToTop.classList.toggle('visible',s>400);});backToTop.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
        const mobileMenuBtn=document.getElementById('mobileMenuBtn'),navLinks=document.getElementById('navLinks');mobileMenuBtn.addEventListener('click',()=>navLinks.classList.toggle('active'));navLinks.querySelectorAll('a').forEach(l=>{l.addEventListener('click',()=>navLinks.classList.remove('active'));});
        const btnThemeToggle=document.getElementById('btnThemeToggle');const saved=localStorage.getItem('museum-theme');if(saved==='light'){document.body.classList.add('light-mode');btnThemeToggle.textContent='◑';}btnThemeToggle.addEventListener('click',()=>{document.body.classList.toggle('light-mode');const isL=document.body.classList.contains('light-mode');btnThemeToggle.textContent=isL?'◑':'◐';localStorage.setItem('museum-theme',isL?'light':'dark');});

        renderMissiles();renderRangeBars();
        console.log('%c🚀 导弹馆已就绪 | 共 %d 款导弹','color:#e74c3c;',missiles.length);
    </script>
</body>
</html>
