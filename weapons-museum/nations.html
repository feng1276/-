<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国家军备库 - 世界兵器博物馆</title>
    <style>
        :root {
            --bg-primary:#0d1117;--bg-secondary:#161b22;--bg-tertiary:#21262d;--bg-card:#1a1f2b;
            --text-primary:#c9d1d9;--text-secondary:#8b949e;--text-highlight:#f0f6fc;
            --accent-military:#2d5a27;--accent-green:#3a7d32;--accent-gold:#c9a84c;--accent-red:#c0392b;
            --accent-blue:#2980b9;--accent-hud:#00ff88;--border-military:#2d3a2d;
            --gradient-hero:linear-gradient(180deg,#0d1117 0%,#1a2f1a 30%,#0d1117 100%);
            --shadow-card:0 4px 20px rgba(0,0,0,0.6);--shadow-hover:0 8px 35px rgba(201,168,76,0.25);
            --border-radius:6px;--transition-speed:0.3s;--nav-height:70px;--max-width:1400px;
        }
        body.light-mode{--bg-primary:#e8ecf1;--bg-secondary:#ffffff;--bg-tertiary:#d5dbe3;--bg-card:#f5f5f0;--text-primary:#2c3e50;--text-secondary:#5a6c7d;--text-highlight:#1a1a2e;--border-military:#c5c9b8;--gradient-hero:linear-gradient(180deg,#d5dbe3 0%,#c5c9b8 30%,#e8ecf1 100%);--shadow-card:0 4px 20px rgba(0,0,0,0.1);}
        *{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;font-size:16px;}
        body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;background-color:var(--bg-primary);color:var(--text-primary);line-height:1.6;transition:background-color var(--transition-speed),color var(--transition-speed);overflow-x:hidden;}
        ::-webkit-scrollbar{width:10px;}::-webkit-scrollbar-track{background:var(--bg-secondary);}::-webkit-scrollbar-thumb{background:var(--accent-military);border-radius:2px;}
        .navbar{position:fixed;top:0;left:0;width:100%;height:var(--nav-height);background:rgba(13,17,23,0.92);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);border-bottom:1px solid var(--border-military);z-index:1000;}.navbar.scrolled{box-shadow:0 4px 25px rgba(0,0,0,0.8);}
        .navbar .container{max-width:var(--max-width);margin:0 auto;padding:0 30px;height:100%;display:flex;align-items:center;justify-content:space-between;}
        .logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text-highlight);font-size:1.4rem;font-weight:800;}.logo-icon{width:46px;height:46px;background:linear-gradient(135deg,#2d5a27,#1a3a15);border:2px solid var(--accent-green);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:var(--accent-gold);}.logo-text{background:linear-gradient(135deg,#c9a84c,#8b7a3a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-transform:uppercase;}
        .nav-links{display:flex;list-style:none;gap:2px;}.nav-links li a{display:block;padding:10px 14px;color:var(--text-secondary);text-decoration:none;border-radius:3px;transition:all var(--transition-speed);font-size:0.85rem;font-weight:500;text-transform:uppercase;letter-spacing:0.5px;position:relative;}.nav-links li a::before{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%) scaleX(0);width:60%;height:2px;background:var(--accent-green);transition:transform var(--transition-speed);}.nav-links li a:hover,.nav-links li a.active{color:var(--accent-gold);}.nav-links li a:hover::before,.nav-links li a.active::before{transform:translateX(-50%) scaleX(1);}
        .nav-actions{display:flex;gap:10px;}.btn-icon{width:38px;height:38px;border:1px solid var(--border-military);background:rgba(45,90,39,0.1);color:var(--text-secondary);border-radius:3px;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;}.btn-icon:hover{background:rgba(58,125,50,0.2);border-color:var(--accent-green);color:var(--accent-hud);}
        .mobile-menu-btn{display:none;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;}.mobile-menu-btn span{display:block;width:25px;height:2px;background:var(--accent-green);}
        .page-header{margin-top:var(--nav-height);background:var(--gradient-hero);padding:60px 0;text-align:center;border-bottom:1px solid var(--border-military);}.page-header h1{font-size:2.5rem;font-weight:900;color:var(--text-highlight);text-transform:uppercase;}.page-header .breadcrumb{color:var(--text-secondary);font-size:0.85rem;margin-top:8px;}.page-header .breadcrumb a{color:var(--accent-hud);text-decoration:none;}
        .main-content{padding:40px 0 80px;}.main-content .container{max-width:var(--max-width);margin:0 auto;padding:0 30px;}
        .map-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:25px;margin-bottom:40px;}
        .nation-card{background:var(--bg-card);border:1px solid var(--border-military);border-radius:var(--border-radius);overflow:hidden;transition:all var(--transition-speed);cursor:pointer;text-decoration:none;color:inherit;display:block;}
        .nation-card:hover{transform:translateY(-5px);border-color:var(--accent-gold);box-shadow:var(--shadow-hover);}
        .nation-card-header{width:100%;aspect-ratio:3/2;display:flex;align-items:center;justify-content:center;font-size:5rem;position:relative;}
        .nation-card-overlay{position:absolute;bottom:0;left:0;width:100%;padding:15px;background:linear-gradient(transparent,rgba(0,0,0,0.8));}
        .nation-card-name{font-size:1.3rem;font-weight:800;color:#fff;text-transform:uppercase;letter-spacing:1px;}
        .nation-card-body{padding:20px;}
        .nation-stat-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.03);font-size:0.85rem;}
        .nation-stat-label{color:var(--text-secondary);}.nation-stat-value{color:var(--accent-hud);font-weight:600;}
        .nation-detail-panel{display:none;background:var(--bg-card);border:1px solid var(--border-military);border-radius:var(--border-radius);padding:30px;margin-top:30px;animation:fadeInUp 0.4s ease;}
        .nation-detail-panel.active{display:block;}
        .nation-detail-header{display:flex;align-items:center;gap:20px;margin-bottom:25px;flex-wrap:wrap;}
        .nation-detail-flag{font-size:4rem;}.nation-detail-name{font-size:1.8rem;font-weight:900;color:var(--text-highlight);}
        .nation-weapons-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:15px;}
        .nation-weapon-item{background:var(--bg-tertiary);border-radius:var(--border-radius);padding:15px;text-align:center;transition:all var(--transition-speed);text-decoration:none;color:inherit;display:block;}
        .nation-weapon-item:hover{background:rgba(201,168,76,0.1);transform:translateY(-3px);}
        .nation-weapon-icon{font-size:2.5rem;display:block;margin-bottom:8px;}
        .nation-weapon-name{font-weight:700;color:var(--text-highlight);font-size:0.85rem;}
        .nation-weapon-type{font-size:0.7rem;color:var(--accent-gold);}
        .footer{background:var(--bg-secondary);border-top:1px solid var(--border-military);padding:30px;text-align:center;color:var(--text-secondary);font-size:0.8rem;}
        .back-to-top{position:fixed;bottom:30px;right:30px;width:46px;height:46px;background:rgba(45,90,39,0.3);border:1px solid var(--accent-green);color:var(--accent-hud);border-radius:3px;cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all var(--transition-speed);z-index:999;}.back-to-top.visible{opacity:1;visibility:visible;}.back-to-top:hover{background:var(--accent-military);border-color:var(--accent-gold);color:var(--accent-gold);}
        @keyframes fadeInUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}.nation-card{animation:fadeInUp 0.4s ease forwards;}
        @media(max-width:768px){.nav-links{display:none;position:absolute;top:var(--nav-height);left:0;width:100%;background:rgba(13,17,23,0.98);flex-direction:column;padding:20px;z-index:999;}.nav-links.active{display:flex;}.mobile-menu-btn{display:flex;}.page-header h1{font-size:1.8rem;}.map-grid{grid-template-columns:1fr;}}
    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="container">
            <a href="home.html" class="logo"><div class="logo-icon">⚔</div><span class="logo-text">兵器博物馆</span></a>
            <ul class="nav-links" id="navLinks">
                <li><a href="home.html">首页</a></li><li><a href="weapons.html">兵器大全</a></li><li><a href="tanks.html">坦克馆</a></li><li><a href="aircraft.html">战机馆</a></li><li><a href="navy.html">海军馆</a></li><li><a href="missiles.html">导弹馆</a></li><li><a href="nations.html" class="active">国家馆</a></li><li><a href="ranking.html">排行榜</a></li>
            </ul>
            <div class="nav-actions"><button class="btn-icon" id="btnThemeToggle">◐</button><button class="mobile-menu-btn" id="mobileMenuBtn"><span></span><span></span><span></span></button></div>
        </div>
    </nav>

    <section class="page-header"><h1>🌍 国家军备库</h1><p class="breadcrumb"><a href="home.html">首页</a> / 国家军备库</p></section>

    <section class="main-content">
        <div class="container">
            <div class="map-grid" id="nationGrid"></div>
            <div class="nation-detail-panel" id="nationDetail"></div>
        </div>
    </section>

    <footer class="footer"><p>© 2025 世界兵器博物馆 | 数据来源公开军事资料 | 仅供学习使用</p></footer>
    <button class="back-to-top" id="backToTop">▲</button>

    <script>
        const nations = [
            {id:'usa',name:'美国',flag:'🇺🇸',color:'linear-gradient(135deg,#1a2a3d,#0d1a2d)',stats:{现役坦克:'6000+',现役战机:'13000+',现役舰艇:'490+',国防预算:'$8860亿',核弹头:'3700+'},desc:'美国拥有全球最强大的军事力量，在陆海空天和网络空间均保持领先地位。',weapons:[{n:'M1A2 Abrams',i:'🛡️',t:'主战坦克'},{n:'F-22 Raptor',i:'🦅',t:'第五代战机'},{n:'福特号航母',i:'🚢',t:'航空母舰'},{n:'民兵III',i:'🎯',t:'洲际导弹'},{n:'M16A4',i:'🔫',t:'突击步枪'}]},
            {id:'russia',name:'俄罗斯',flag:'🇷🇺',color:'linear-gradient(135deg,#2a1a1a,#1a0d0d)',stats:{现役坦克:'12000+',现役战机:'4100+',现役舰艇:'350+',国防预算:'$860亿',核弹头:'4400+'},desc:'俄罗斯继承了苏联的主要军事遗产，在核武器和导弹技术方面实力雄厚。',weapons:[{n:'T-90M',i:'🛡️',t:'主战坦克'},{n:'苏-57',i:'🦇',t:'第五代战机'},{n:'萨尔马特',i:'☠️',t:'洲际导弹'},{n:'库兹涅佐夫号',i:'🚢',t:'航空母舰'},{n:'AK-47',i:'🔫',t:'突击步枪'}]},
            {id:'china',name:'中国',flag:'🇨🇳',color:'linear-gradient(135deg,#3d1a1a,#2a0a0a)',stats:{现役坦克:'5800+',现役战机:'3200+',现役舰艇:'350+',国防预算:'$2960亿',核弹头:'500+'},desc:'中国军事现代化快速发展，在海军舰艇和导弹技术方面取得了显著进步。',weapons:[{n:'99A式',i:'🛡️',t:'主战坦克'},{n:'歼-20',i:'🐉',t:'第五代战机'},{n:'055型驱逐舰',i:'⚓',t:'驱逐舰'},{n:'东风-41',i:'🚀',t:'洲际导弹'},{n:'95式步枪',i:'🔫',t:'突击步枪'}]},
            {id:'germany',name:'德国',flag:'🇩🇪',color:'linear-gradient(135deg,#1a1a1a,#0d0d0d)',stats:{现役坦克:'320+',现役战机:'230+',现役舰艇:'80+',国防预算:'$560亿',核弹头:'0'},desc:'德国是欧洲最大的军事工业国家之一，豹2坦克闻名世界。',weapons:[{n:'Leopard 2A7+',i:'🐆',t:'主战坦克'},{n:'虎式坦克',i:'🐯',t:'重型坦克'},{n:'俾斯麦号',i:'🦅',t:'战列舰'},{n:'V-2火箭',i:'🚀',t:'弹道导弹'},{n:'MG42',i:'💥',t:'通用机枪'}]},
            {id:'japan',name:'日本',flag:'🇯🇵',color:'linear-gradient(135deg,#1a1a2d,#0d0d1a)',stats:{现役坦克:'1000+',现役战机:'1500+',现役舰艇:'150+',国防预算:'$510亿',核弹头:'0'},desc:'日本自卫队装备精良，海上力量在亚洲处于领先地位。',weapons:[{n:'零式战斗机',i:'🔴',t:'舰载战斗机'},{n:'大和号',i:'🗿',t:'战列舰'}]},
            {id:'uk',name:'英国',flag:'🇬🇧',color:'linear-gradient(135deg,#1a2a3d,#0d1620)',stats:{现役坦克:'220+',现役战机:'830+',现役舰艇:'75+',国防预算:'$620亿',核弹头:'225'},desc:'英国皇家海军拥有悠久历史，挑战者坦克和台风战机是其代表装备。',weapons:[{n:'挑战者2',i:'🛡️',t:'主战坦克'},{n:'喷火战斗机',i:'✈️',t:'战斗机'}]},
            {id:'israel',name:'以色列',flag:'🇮🇱',color:'linear-gradient(135deg,#1a2a1a,#0d1a0d)',stats:{现役坦克:'1300+',现役战机:'600+',现役舰艇:'65+',国防预算:'$240亿',核弹头:'90+'},desc:'以色列国防军以创新和实战经验著称，梅卡瓦坦克为自主研制。',weapons:[{n:'梅卡瓦Mk4',i:'🛡️',t:'主战坦克'}]}
        ];

        function renderNations(){document.getElementById('nationGrid').innerHTML=nations.map((n,i)=>`<div class="nation-card" style="animation-delay:${i*0.06}s" data-id="${n.id}"><div class="nation-card-header" style="background:${n.color};">${n.flag}<div class="nation-card-overlay"><div class="nation-card-name">${n.name}</div></div></div><div class="nation-card-body">${Object.entries(n.stats).map(([k,v])=>`<div class="nation-stat-row"><span class="nation-stat-label">${k}</span><span class="nation-stat-value">${v}</span></div>`).join('')}</div></div>`).join('');
            document.querySelectorAll('.nation-card').forEach(card=>{card.addEventListener('click',()=>showNationDetail(card.dataset.id));});}

        function showNationDetail(id){const n=nations.find(x=>x.id===id);if(!n)return;document.getElementById('nationDetail').innerHTML=`<div class="nation-detail-header"><span class="nation-detail-flag">${n.flag}</span><span class="nation-detail-name">${n.name}</span></div><p style="color:var(--text-secondary);margin-bottom:25px;">${n.desc}</p><h3 style="color:var(--accent-gold);margin-bottom:15px;">🛡️ 代表兵器</h3><div class="nation-weapons-grid">${n.weapons.map(w=>`<a href="weapons.html" class="nation-weapon-item"><span class="nation-weapon-icon">${w.i}</span><span class="nation-weapon-name">${w.n}</span><span class="nation-weapon-type">${w.t}</span></a>`).join('')}</div>`;document.getElementById('nationDetail').classList.add('active');document.getElementById('nationDetail').scrollIntoView({behavior:'smooth'});}

        const navbar=document.getElementById('navbar'),backToTop=document.getElementById('backToTop');window.addEventListener('scroll',()=>{navbar.classList.toggle('scrolled',window.scrollY>50);backToTop.classList.toggle('visible',window.scrollY>400);});backToTop.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
        const mobileMenuBtn=document.getElementById('mobileMenuBtn'),navLinks=document.getElementById('navLinks');mobileMenuBtn.addEventListener('click',()=>navLinks.classList.toggle('active'));navLinks.querySelectorAll('a').forEach(l=>l.addEventListener('click',()=>navLinks.classList.remove('active')));
        const btnThemeToggle=document.getElementById('btnThemeToggle');const saved=localStorage.getItem('museum-theme');if(saved==='light'){document.body.classList.add('light-mode');btnThemeToggle.textContent='◑';}btnThemeToggle.addEventListener('click',()=>{document.body.classList.toggle('light-mode');const isL=document.body.classList.contains('light-mode');btnThemeToggle.textContent=isL?'◑':'◐';localStorage.setItem('museum-theme',isL?'light':'dark');});
        renderNations();
        console.log('%c🌍 国家军备库已就绪 | 共 %d 个国家','color:#c9a84c;',nations.length);
    </script>
</body>
</html>
