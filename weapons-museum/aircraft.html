<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>战机馆 - 世界兵器博物馆</title>
    <style>
        :root {
            --bg-primary:#0d1117;--bg-secondary:#161b22;--bg-tertiary:#21262d;--bg-card:#1a1f2b;
            --text-primary:#c9d1d9;--text-secondary:#8b949e;--text-highlight:#f0f6fc;
            --accent-military:#2d5a27;--accent-green:#3a7d32;--accent-gold:#c9a84c;--accent-red:#c0392b;
            --accent-blue:#2980b9;--accent-hud:#00ff88;--accent-sky:#4a9eff;--border-military:#2d3a2d;
            --gradient-hero:linear-gradient(180deg,#0d1117 0%,#1a2f1a 30%,#0d1117 100%);
            --shadow-card:0 4px 20px rgba(0,0,0,0.6);--shadow-hover:0 8px 35px rgba(74,158,255,0.2);
            --border-radius:6px;--transition-speed:0.3s;--nav-height:70px;--max-width:1400px;
        }
        body.light-mode{--bg-primary:#e8ecf1;--bg-secondary:#ffffff;--bg-tertiary:#d5dbe3;--bg-card:#f5f5f0;--text-primary:#2c3e50;--text-secondary:#5a6c7d;--text-highlight:#1a1a2e;--border-military:#c5c9b8;--gradient-hero:linear-gradient(180deg,#d5dbe3 0%,#b8c5d0 30%,#e8ecf1 100%);--shadow-card:0 4px 20px rgba(0,0,0,0.1);--shadow-hover:0 8px 35px rgba(41,128,185,0.15);}
        *{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;font-size:16px;}
        body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;background-color:var(--bg-primary);color:var(--text-primary);line-height:1.6;transition:background-color var(--transition-speed),color var(--transition-speed);overflow-x:hidden;}
        body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(74,158,255,0.01) 3px,rgba(74,158,255,0.01) 6px);pointer-events:none;z-index:0;}body>*{position:relative;z-index:1;}
        ::-webkit-scrollbar{width:10px;}::-webkit-scrollbar-track{background:var(--bg-secondary);}::-webkit-scrollbar-thumb{background:var(--accent-blue);border-radius:2px;}
        .navbar{position:fixed;top:0;left:0;width:100%;height:var(--nav-height);background:rgba(13,17,23,0.92);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);border-bottom:1px solid var(--border-military);z-index:1000;transition:all var(--transition-speed);}.navbar.scrolled{box-shadow:0 4px 25px rgba(0,0,0,0.8);}
        .navbar .container{max-width:var(--max-width);margin:0 auto;padding:0 30px;height:100%;display:flex;align-items:center;justify-content:space-between;}
        .logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text-highlight);font-size:1.4rem;font-weight:800;letter-spacing:1px;}.logo-icon{width:46px;height:46px;background:linear-gradient(135deg,#1a3a5c,#0d2137);border:2px solid var(--accent-sky);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:var(--accent-gold);font-weight:900;box-shadow:0 0 15px rgba(74,158,255,0.3);}.logo-text{background:linear-gradient(135deg,#c9a84c,#8b7a3a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-transform:uppercase;}
        .nav-links{display:flex;list-style:none;gap:2px;}.nav-links li a{display:block;padding:10px 14px;color:var(--text-secondary);text-decoration:none;border-radius:3px;transition:all var(--transition-speed);font-size:0.85rem;font-weight:500;text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap;position:relative;}.nav-links li a::before{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%) scaleX(0);width:60%;height:2px;background:var(--accent-sky);transition:transform var(--transition-speed);}.nav-links li a:hover,.nav-links li a.active{color:var(--accent-gold);background:rgba(201,168,76,0.05);}.nav-links li a:hover::before,.nav-links li a.active::before{transform:translateX(-50%) scaleX(1);}
        .nav-actions{display:flex;gap:10px;align-items:center;}.btn-icon{width:38px;height:38px;border:1px solid var(--border-military);background:rgba(41,128,185,0.1);color:var(--text-secondary);border-radius:3px;cursor:pointer;font-size:1.1rem;transition:all var(--transition-speed);display:flex;align-items:center;justify-content:center;}.btn-icon:hover{background:rgba(74,158,255,0.2);border-color:var(--accent-sky);color:var(--accent-sky);}
        .mobile-menu-btn{display:none;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;padding:5px;}.mobile-menu-btn span{display:block;width:25px;height:2px;background:var(--accent-sky);border-radius:2px;}
        .page-header{margin-top:var(--nav-height);background:linear-gradient(180deg,#0d1117 0%,#0d2137 30%,#0d1117 100%);padding:60px 0;text-align:center;border-bottom:1px solid var(--border-military);}.page-header h1{font-size:2.5rem;font-weight:900;color:var(--text-highlight);text-transform:uppercase;letter-spacing:2px;}.page-header .breadcrumb{color:var(--text-secondary);font-size:0.85rem;margin-top:8px;}.page-header .breadcrumb a{color:var(--accent-sky);text-decoration:none;}
        .main-content{padding:40px 0 80px;}.main-content .container{max-width:var(--max-width);margin:0 auto;padding:0 30px;}
        .type-tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:40px;}
        .type-tab{padding:12px 28px;background:var(--bg-card);border:1px solid var(--border-military);color:var(--text-secondary);border-radius:3px;cursor:pointer;transition:all var(--transition-speed);font-size:0.9rem;font-weight:600;text-transform:uppercase;letter-spacing:1px;}
        .type-tab:hover,.type-tab.active{background:rgba(41,128,185,0.3);border-color:var(--accent-sky);color:var(--accent-sky);}
        .aircraft-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:25px;}
        .aircraft-card{background:var(--bg-card);border:1px solid var(--border-military);border-radius:var(--border-radius);overflow:hidden;transition:all var(--transition-speed);cursor:pointer;position:relative;}
        .aircraft-card:hover{transform:translateY(-6px);border-color:var(--accent-sky);box-shadow:var(--shadow-hover);}
        .aircraft-card-header{width:100%;aspect-ratio:16/9;background:linear-gradient(180deg,#0d2137,#1a3a5c);display:flex;align-items:center;justify-content:center;font-size:5rem;color:var(--text-secondary);position:relative;overflow:hidden;}
        .aircraft-card-header::after{content:'';position:absolute;bottom:0;left:0;width:100%;height:50%;background:linear-gradient(transparent,rgba(0,0,0,0.6));}
        .aircraft-card-type{position:absolute;top:12px;left:12px;padding:5px 12px;background:rgba(0,0,0,0.8);border:1px solid var(--accent-sky);color:var(--accent-sky);font-size:0.7rem;font-weight:700;letter-spacing:1px;border-radius:2px;z-index:2;}
        .aircraft-card-body{padding:22px;}
        .aircraft-card-name{font-size:1.2rem;font-weight:800;color:var(--text-highlight);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
        .aircraft-card-nation{font-size:0.85rem;color:var(--accent-gold);margin-bottom:12px;}
        .aircraft-card-desc{font-size:0.85rem;color:var(--text-secondary);line-height:1.6;margin-bottom:15px;}
        .aircraft-specs{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
        .aircraft-spec{background:var(--bg-tertiary);padding:10px;border-radius:3px;}.aircraft-spec-label{font-size:0.7rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:1px;}.aircraft-spec-value{font-size:0.9rem;color:var(--accent-sky);font-weight:700;margin-top:2px;}
        .radar-section{margin-top:60px;background:var(--bg-card);border:1px solid var(--border-military);border-radius:var(--border-radius);padding:35px;}
        .radar-section h2{color:var(--accent-gold);font-size:1.3rem;text-transform:uppercase;letter-spacing:2px;margin-bottom:25px;text-align:center;}
        .radar-container{display:flex;justify-content:center;align-items:center;min-height:300px;}
        .radar-chart{position:relative;width:300px;height:300px;}
        .radar-bg{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:50%;border:1px solid rgba(74,158,255,0.2);background:radial-gradient(circle,rgba(74,158,255,0.03) 0%,transparent 70%);}
        .radar-ring{position:absolute;border-radius:50%;border:1px solid rgba(74,158,255,0.1);top:15%;left:15%;width:70%;height:70%;}
        .radar-ring:nth-child(3){top:30%;left:30%;width:40%;height:40%;}
        .radar-ring:nth-child(4){top:45%;left:45%;width:10%;height:10%;background:rgba(74,158,255,0.1);}
        .radar-labels{position:absolute;top:0;left:0;width:100%;height:100%;}
        .radar-label{position:absolute;font-size:0.7rem;color:var(--accent-sky);font-weight:600;text-transform:uppercase;}
        .radar-label:nth-child(1){top:5%;left:50%;transform:translateX(-50%);}
        .radar-label:nth-child(2){top:50%;right:2%;transform:translateY(-50%);}
        .radar-label:nth-child(3){bottom:5%;left:50%;transform:translateX(-50%);}
        .radar-label:nth-child(4){top:50%;left:2%;transform:translateY(-50%);}
        .radar-label:nth-child(5){top:15%;right:15%;}
        .radar-value{position:absolute;font-size:0.9rem;color:var(--accent-hud);font-weight:900;font-family:'Courier New',monospace;}
        .radar-value:nth-child(6){top:28%;left:48%;}.radar-value:nth-child(7){top:48%;right:22%;}.radar-value:nth-child(8){bottom:28%;left:48%;}.radar-value:nth-child(9){top:48%;left:22%;}.radar-value:nth-child(10){top:25%;right:25%;}
        .footer{background:var(--bg-secondary);border-top:1px solid var(--border-military);padding:30px;text-align:center;color:var(--text-secondary);font-size:0.8rem;}
        .back-to-top{position:fixed;bottom:30px;right:30px;width:46px;height:46px;background:rgba(41,128,185,0.3);border:1px solid var(--accent-sky);color:var(--accent-sky);border-radius:3px;cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all var(--transition-speed);z-index:999;}.back-to-top.visible{opacity:1;visibility:visible;}.back-to-top:hover{background:var(--accent-blue);border-color:var(--accent-gold);color:var(--accent-gold);}
        @keyframes fadeInUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}.aircraft-card{animation:fadeInUp 0.4s ease forwards;}
        @media(max-width:768px){.nav-links{display:none;position:absolute;top:var(--nav-height);left:0;width:100%;background:rgba(13,17,23,0.98);flex-direction:column;padding:20px;backdrop-filter:blur(15px);z-index:999;border-bottom:2px solid var(--accent-military);}.nav-links.active{display:flex;}.mobile-menu-btn{display:flex;}.page-header h1{font-size:1.8rem;}.aircraft-grid{grid-template-columns:1fr;}}
    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="container">
            <a href="home.html" class="logo"><div class="logo-icon">⚔</div><span class="logo-text">兵器博物馆</span></a>
            <ul class="nav-links" id="navLinks">
                <li><a href="home.html">首页</a></li>
                <li><a href="weapons.html">兵器大全</a></li>
                <li><a href="tanks.html">坦克馆</a></li>
                <li><a href="aircraft.html" class="active">战机馆</a></li>
                <li><a href="navy.html">海军馆</a></li>
                <li><a href="timeline.html">时间轴</a></li>
                <li><a href="nations.html">国家馆</a></li>
                <li><a href="ranking.html">排行榜</a></li>
            </ul>
            <div class="nav-actions">
                <button class="btn-icon" id="btnThemeToggle" title="切换主题">◐</button>
                <button class="mobile-menu-btn" id="mobileMenuBtn"><span></span><span></span><span></span></button>
            </div>
        </div>
    </nav>

    <section class="page-header">
        <h1>✈️ 战机馆</h1>
        <p class="breadcrumb"><a href="home.html">首页</a> / 战机馆</p>
    </section>

    <section class="main-content">
        <div class="container">
            <div class="type-tabs" id="typeTabs">
                <button class="type-tab active" data-type="all">全部战机</button>
                <button class="type-tab" data-type="战斗机">战斗机</button>
                <button class="type-tab" data-type="轰炸机">轰炸机</button>
                <button class="type-tab" data-type="攻击直升机">攻击直升机</button>
                <button class="type-tab" data-type="隐形战机">隐形战机</button>
            </div>
            <div class="aircraft-grid" id="aircraftGrid"></div>

            <div class="radar-section">
                <h2>📡 战机性能雷达图</h2>
                <div class="radar-container">
                    <div class="radar-chart">
                        <div class="radar-bg"></div>
                        <div class="radar-ring"></div>
                        <div class="radar-ring"></div>
                        <div class="radar-ring"></div>
                        <div class="radar-labels">
                            <span class="radar-label">速度</span>
                            <span class="radar-label">机动</span>
                            <span class="radar-label">隐身</span>
                            <span class="radar-label">火力</span>
                            <span class="radar-label">航程</span>
                            <span class="radar-value" style="color:#4a9eff;">F-22</span>
                            <span class="radar-value" style="color:#ff4a4a;">苏-57</span>
                            <span class="radar-value" style="color:#ffaa00;">歼-20</span>
                        </div>
                    </div>
                </div>
                <p style="text-align:center;color:var(--text-secondary);font-size:0.8rem;margin-top:15px;">* 性能雷达图示意——基于公开数据的综合性能评估</p>
            </div>
        </div>
    </section>

    <footer class="footer"><p>© 2025 世界兵器博物馆 | 战机数据来源公开军事资料 | 仅供学习使用</p></footer>
    <button class="back-to-top" id="backToTop" title="返回顶部">▲</button>

    <script>
        const aircraft = [
            {id:'f22',name:'F-22 Raptor',nation:'美国',type:'隐形战机',era:'现代',icon:'🦅',desc:'F-22猛禽是世界上第一款投入使用的第五代隐身战斗机。集隐身、超音速巡航、高机动性和先进航电系统于一身，是目前综合性能最强的空优战斗机。',specs:{首飞:'1997年',最大速度:'2.25马赫',航程:'2960km',发动机:'普惠F119-PW-100×2',武器:'20mm机炮+AIM-120+AIM-9',升限:'20000m'}},
            {id:'j20',name:'歼-20 威龙',nation:'中国',type:'隐形战机',era:'现代',icon:'🐉',desc:'歼-20是中国自主研发的第五代隐身战斗机，具备隐身、超音速巡航和先进的态势感知能力。标志着中国航空工业的重大突破。',specs:{首飞:'2011年',最大速度:'2.0马赫',航程:'3400km',发动机:'涡扇-15×2',武器:'霹雳-15+霹雳-10',升限:'20000m'}},
            {id:'su57',name:'苏-57',nation:'俄罗斯',type:'隐形战机',era:'现代',icon:'🦇',desc:'苏-57是俄罗斯第五代多用途隐身战斗机，强调超机动性和多用途作战能力。配备三维矢量推力发动机和先进的电子战系统。',specs:{首飞:'2010年',最大速度:'2.0马赫',航程:'3500km',发动机:'AL-41F1×2',武器:'30mm机炮+R-77+R-73',升限:'20000m'}},
            {id:'f16',name:'F-16 Fighting Falcon',nation:'美国',type:'战斗机',era:'现代',icon:'⚡',desc:'F-16战隼是全球最成功的第四代多用途战斗机之一，拥有超过4500架的产量。以出色的机动性和多用途能力被数十个国家采用。',specs:{首飞:'1974年',最大速度:'2.0马赫',航程:'4220km',发动机:'F110-GE-129×1',武器:'20mm机炮+多种导弹',升限:'15240m'}},
            {id:'su35',name:'苏-35 超级侧卫',nation:'俄罗斯',type:'战斗机',era:'现代',icon:'🔱',desc:'苏-35是俄罗斯4++代重型多用途战斗机，具备矢量推力发动机和无源相控阵雷达。机动性能极其出色。',specs:{首飞:'2008年',最大速度:'2.25马赫',航程:'3600km',发动机:'AL-41F1S×2',武器:'30mm机炮+多种导弹',升限:'18000m'}},
            {id:'b2',name:'B-2 Spirit',nation:'美国',type:'轰炸机',era:'现代',icon:'👻',desc:'B-2幽灵是目前世界上唯一的隐身战略轰炸机，飞翼布局使其雷达反射截面积极小。能够穿透最严密的防空系统执行核打击任务。',specs:{首飞:'1989年',最大速度:'0.95马赫',航程:'11100km',发动机:'F118-GE-100×4',武器:'核弹+常规精确制导',升限:'15240m'}},
            {id:'apache',name:'AH-64E Apache',nation:'美国',type:'攻击直升机',era:'现代',icon:'🚁',desc:'阿帕奇是世界上装备最广泛、实战经验最丰富的攻击直升机。配备长弓毫米波雷达和地狱火导弹，是坦克的致命杀手。',specs:{首飞:'1975年',最大速度:'293km/h',航程:'476km',发动机:'T700-GE-701D×2',武器:'30mm机炮+地狱火导弹',升限:'6400m'}},
            {id:'mig29',name:'米格-29 支点',nation:'俄罗斯',type:'战斗机',era:'冷战',icon:'✈️',desc:'米格-29是苏联时期研发的前线战斗机，以出色的近距离格斗能力著称。被广泛出口到多个国家。',specs:{首飞:'1977年',最大速度:'2.3马赫',航程:'2100km',发动机:'RD-33×2',武器:'30mm机炮+多种导弹',升限:'18013m'}},
            {id:'zero',name:'零式舰载战斗机',nation:'日本',type:'战斗机',era:'二战',icon:'🔴',desc:'零式战斗机是二战期间日本海军的主力舰载战斗机，以超远的航程和出色的低速机动性在战争初期称霸太平洋。',specs:{首飞:'1939年',最大速度:'533km/h',航程:'3104km',发动机:'荣12型×1',武器:'20mm机炮×2+7.7mm机枪×2',升限:'10000m'}},
            {id:'spitfire',name:'喷火 Mk.IX',nation:'英国',type:'战斗机',era:'二战',icon:'✈️',desc:'喷火战斗机是英国在二战期间最著名的战斗机，在不列颠空战中发挥了决定性作用。优美的椭圆翼是其标志性特征。',specs:{首飞:'1936年',最大速度:'594km/h',航程:'1827km',发动机:'梅林61×1',武器:'20mm机炮×2+12.7mm机枪×4',升限:'13100m'}}
        ];

        let activeType='all';
        function getFiltered(){return activeType==='all'?aircraft:aircraft.filter(a=>a.type===activeType);}
        function render(){const f=getFiltered();document.getElementById('aircraftGrid').innerHTML=f.map((a,i)=>`<div class="aircraft-card" style="animation-delay:${i*0.06}s"><div class="aircraft-card-header">${a.icon}<span class="aircraft-card-type">${a.type}</span></div><div class="aircraft-card-body"><div class="aircraft-card-name">${a.name}</div><div class="aircraft-card-nation">${a.nation} | ${a.era}</div><div class="aircraft-card-desc">${a.desc}</div><div class="aircraft-specs">${Object.entries(a.specs).slice(0,6).map(([k,v])=>`<div class="aircraft-spec"><div class="aircraft-spec-label">${k}</div><div class="aircraft-spec-value">${v}</div></div>`).join('')}</div></div></div>`).join('');}
        document.getElementById('typeTabs').addEventListener('click',e=>{const b=e.target.closest('.type-tab');if(!b)return;document.querySelectorAll('.type-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeType=b.dataset.type;render();});

        const navbar=document.getElementById('navbar'),backToTop=document.getElementById('backToTop');window.addEventListener('scroll',()=>{const s=window.scrollY;navbar.classList.toggle('scrolled',s>50);backToTop.classList.toggle('visible',s>400);});backToTop.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
        const mobileMenuBtn=document.getElementById('mobileMenuBtn'),navLinks=document.getElementById('navLinks');mobileMenuBtn.addEventListener('click',()=>navLinks.classList.toggle('active'));navLinks.querySelectorAll('a').forEach(l=>{l.addEventListener('click',()=>navLinks.classList.remove('active'));});
        const btnThemeToggle=document.getElementById('btnThemeToggle');const saved=localStorage.getItem('museum-theme');if(saved==='light'){document.body.classList.add('light-mode');btnThemeToggle.textContent='◑';}btnThemeToggle.addEventListener('click',()=>{document.body.classList.toggle('light-mode');const isL=document.body.classList.contains('light-mode');btnThemeToggle.textContent=isL?'◑':'◐';localStorage.setItem('museum-theme',isL?'light':'dark');});

        render();
        console.log('%c✈️ 战机馆已就绪 | 共 %d 架战机','color:#4a9eff;',aircraft.length);
    </script>
</body>
</html>
