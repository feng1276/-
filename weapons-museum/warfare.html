<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>战争百科 - 世界兵器博物馆</title>
    <style>
        :root {
            --bg-primary:#0d1117;--bg-secondary:#161b22;--bg-tertiary:#21262d;--bg-card:#1a1f2b;
            --text-primary:#c9d1d9;--text-secondary:#8b949e;--text-highlight:#f0f6fc;
            --accent-military:#2d5a27;--accent-green:#3a7d32;--accent-gold:#c9a84c;--accent-red:#c0392b;
            --accent-blue:#2980b9;--accent-hud:#00ff88;--border-military:#2d3a2d;
            --gradient-hero:linear-gradient(180deg,#0d1117 0%,#2a1010 30%,#0d1117 100%);
            --shadow-card:0 4px 20px rgba(0,0,0,0.6);--shadow-hover:0 8px 35px rgba(192,57,43,0.2);
            --border-radius:6px;--transition-speed:0.3s;--nav-height:70px;--max-width:1200px;
        }
        body.light-mode{--bg-primary:#e8ecf1;--bg-secondary:#ffffff;--bg-tertiary:#d5dbe3;--bg-card:#f5f5f0;--text-primary:#2c3e50;--text-secondary:#5a6c7d;--text-highlight:#1a1a2e;--border-military:#c5c9b8;--gradient-hero:linear-gradient(180deg,#d5dbe3 0%,#d0c8c0 30%,#e8ecf1 100%);--shadow-card:0 4px 20px rgba(0,0,0,0.1);}
        *{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;font-size:16px;}
        body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;background-color:var(--bg-primary);color:var(--text-primary);line-height:1.6;transition:background-color var(--transition-speed),color var(--transition-speed);overflow-x:hidden;}
        ::-webkit-scrollbar{width:10px;}::-webkit-scrollbar-track{background:var(--bg-secondary);}::-webkit-scrollbar-thumb{background:var(--accent-red);border-radius:2px;}
        .navbar{position:fixed;top:0;left:0;width:100%;height:var(--nav-height);background:rgba(13,17,23,0.92);backdrop-filter:blur(15px);border-bottom:1px solid var(--border-military);z-index:1000;}.navbar.scrolled{box-shadow:0 4px 25px rgba(0,0,0,0.8);}
        .navbar .container{max-width:var(--max-width);margin:0 auto;padding:0 30px;height:100%;display:flex;align-items:center;justify-content:space-between;}
        .logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text-highlight);font-size:1.4rem;font-weight:800;}.logo-icon{width:46px;height:46px;background:linear-gradient(135deg,#3d1a1a,#2a1010);border:2px solid var(--accent-red);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:var(--accent-gold);}.logo-text{background:linear-gradient(135deg,#c9a84c,#8b7a3a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-transform:uppercase;}
        .nav-links{display:flex;list-style:none;gap:2px;}.nav-links li a{display:block;padding:10px 14px;color:var(--text-secondary);text-decoration:none;border-radius:3px;transition:all var(--transition-speed);font-size:0.85rem;font-weight:500;text-transform:uppercase;letter-spacing:0.5px;position:relative;}.nav-links li a::before{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%) scaleX(0);width:60%;height:2px;background:var(--accent-red);transition:transform var(--transition-speed);}.nav-links li a:hover,.nav-links li a.active{color:var(--accent-gold);}.nav-links li a:hover::before,.nav-links li a.active::before{transform:translateX(-50%) scaleX(1);}
        .nav-actions{display:flex;gap:10px;}.btn-icon{width:38px;height:38px;border:1px solid var(--border-military);background:rgba(192,57,43,0.1);color:var(--text-secondary);border-radius:3px;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;}.btn-icon:hover{background:rgba(192,57,43,0.2);border-color:var(--accent-red);color:var(--accent-red);}
        .mobile-menu-btn{display:none;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;}.mobile-menu-btn span{display:block;width:25px;height:2px;background:var(--accent-red);}
        .page-header{margin-top:var(--nav-height);background:var(--gradient-hero);padding:60px 0;text-align:center;border-bottom:1px solid var(--border-military);}.page-header h1{font-size:2.5rem;font-weight:900;color:var(--text-highlight);text-transform:uppercase;}.page-header .breadcrumb{color:var(--text-secondary);font-size:0.85rem;}.page-header .breadcrumb a{color:var(--accent-red);text-decoration:none;}
        .main-content{padding:40px 0 80px;}.main-content .container{max-width:var(--max-width);margin:0 auto;padding:0 30px;}
        .war-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:25px;}
        .war-card{background:var(--bg-card);border:1px solid var(--border-military);border-radius:var(--border-radius);overflow:hidden;transition:all var(--transition-speed);cursor:pointer;}
        .war-card:hover{transform:translateY(-5px);border-color:var(--accent-red);box-shadow:var(--shadow-hover);}
        .war-card-header{width:100%;aspect-ratio:2/1;display:flex;align-items:center;justify-content:center;font-size:4rem;position:relative;}
        .war-card-overlay{position:absolute;bottom:0;left:0;width:100%;padding:15px;background:linear-gradient(transparent,rgba(0,0,0,0.85));}
        .war-card-year{font-size:1.5rem;font-weight:900;color:var(--accent-gold);font-family:'Courier New',monospace;}
        .war-card-body{padding:20px;}
        .war-card-name{font-size:1.2rem;font-weight:800;color:var(--text-highlight);text-transform:uppercase;margin-bottom:10px;}
        .war-card-desc{font-size:0.85rem;color:var(--text-secondary);line-height:1.6;margin-bottom:12px;}
        .war-card-info{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
        .war-info-item{background:var(--bg-tertiary);padding:10px;border-radius:3px;}.war-info-label{font-size:0.7rem;color:var(--text-secondary);text-transform:uppercase;}.war-info-value{font-size:0.85rem;color:var(--accent-hud);font-weight:600;margin-top:2px;}
        .footer{background:var(--bg-secondary);border-top:1px solid var(--border-military);padding:30px;text-align:center;color:var(--text-secondary);font-size:0.8rem;}
        .back-to-top{position:fixed;bottom:30px;right:30px;width:46px;height:46px;background:rgba(192,57,43,0.3);border:1px solid var(--accent-red);color:var(--accent-red);border-radius:3px;cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all var(--transition-speed);z-index:999;}.back-to-top.visible{opacity:1;visibility:visible;}
        @media(max-width:768px){.nav-links{display:none;position:absolute;top:var(--nav-height);left:0;width:100%;background:rgba(13,17,23,0.98);flex-direction:column;padding:20px;z-index:999;}.nav-links.active{display:flex;}.mobile-menu-btn{display:flex;}.page-header h1{font-size:1.8rem;}.war-grid{grid-template-columns:1fr;}}
    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="container">
            <a href="home.html" class="logo"><div class="logo-icon">⚔</div><span class="logo-text">兵器博物馆</span></a>
            <ul class="nav-links" id="navLinks">
                <li><a href="home.html">首页</a></li><li><a href="weapons.html">兵器大全</a></li><li><a href="tanks.html">坦克馆</a></li><li><a href="aircraft.html">战机馆</a></li><li><a href="navy.html">海军馆</a></li><li><a href="missiles.html">导弹馆</a></li><li><a href="nations.html">国家馆</a></li><li><a href="warfare.html" class="active">战争百科</a></li>
            </ul>
            <div class="nav-actions"><button class="btn-icon" id="btnThemeToggle">◐</button><button class="mobile-menu-btn" id="mobileMenuBtn"><span></span><span></span><span></span></button></div>
        </div>
    </nav>

    <section class="page-header"><h1>⚔️ 战争百科</h1><p class="breadcrumb"><a href="home.html">首页</a> / 战争百科</p></section>

    <section class="main-content">
        <div class="container">
            <div class="war-grid" id="warGrid"></div>
        </div>
    </section>

    <footer class="footer"><p>© 2025 世界兵器博物馆 | 战争百科内容基于公开历史资料 | 仅供学习参考</p></footer>
    <button class="back-to-top" id="backToTop">▲</button>

    <script>
        const wars = [
            {id:'ww1',name:'第一次世界大战',year:'1914-1918',icon:'🕊️',color:'linear-gradient(135deg,#2d3a1a,#1a2a0d)',desc:'人类历史上第一次全球性大规模战争。以同盟国和协约国两大阵营展开，工业化武器首次大规模使用，造成了前所未有的人员伤亡。',info:{参战国:'30+',伤亡:'4000万+',主要装备:'坦克、机枪、毒气',结果:'协约国胜利',影响:'四大帝国解体'}},
            {id:'ww2',name:'第二次世界大战',year:'1939-1945',icon:'💣',color:'linear-gradient(135deg,#3d2a1a,#2a1a0d)',desc:'人类历史上规模最大的战争。轴心国与同盟国在全球范围内展开激烈对抗，核武器首次投入实战。',info:{参战国:'60+',伤亡:'7000万+',主要装备:'坦克、航母、原子弹',结果:'同盟国胜利',影响:'联合国成立、冷战开始'}},
            {id:'coldwar',name:'冷战',year:'1947-1991',icon:'☢️',color:'linear-gradient(135deg,#1a2a3d,#0d1a2d)',desc:'以美国和苏联为首的两大阵营之间的长期对抗。虽然没有直接爆发全面战争，但军备竞赛和代理人战争贯穿始终。',info:{参战国:'全球阵营',伤亡:'(代理战争)',主要装备:'核武器、洲际导弹',结果:'苏联解体',影响:'单极世界形成'}},
            {id:'gulfwar',name:'海湾战争',year:'1991',icon:'🛢️',color:'linear-gradient(135deg,#3d3d1a,#2a2a0d)',desc:'以美国为首的多国部队为解放科威特而对伊拉克发动的战争。首次大规模使用精确制导武器和隐身战机。',info:{参战国:'34国联军',伤亡:'联军<1000',主要装备:'精确制导武器、隐身战机',结果:'联军胜利',影响:'信息化战争时代'}},
            {id:'ukraine',name:'俄乌战争',year:'2022-至今',icon:'🛡️',color:'linear-gradient(135deg,#1a1a1a,#0d0d0d)',desc:'俄罗斯对乌克兰发起的特别军事行动引发的全面战争。无人机、精确火炮和信息战在现代战场上的作用得到充分体现。',info:{参战国:'俄乌双方',伤亡:'数十万',主要装备:'无人机、精确火炮',结果:'持续中',影响:'欧洲安全格局改变'}}
        ];

        function renderWars(){document.getElementById('warGrid').innerHTML=wars.map((w,i)=>`<div class="war-card" style="animation:fadeInUp 0.4s ease forwards;animation-delay:${i*0.08}s"><div class="war-card-header" style="background:${w.color};">${w.icon}<div class="war-card-overlay"><span class="war-card-year">${w.year}</span></div></div><div class="war-card-body"><div class="war-card-name">${w.name}</div><div class="war-card-desc">${w.desc}</div><div class="war-card-info">${Object.entries(w.info).map(([k,v])=>`<div class="war-info-item"><div class="war-info-label">${k}</div><div class="war-info-value">${v}</div></div>`).join('')}</div></div></div>`).join('');}

        const navbar=document.getElementById('navbar'),backToTop=document.getElementById('backToTop');window.addEventListener('scroll',()=>{navbar.classList.toggle('scrolled',window.scrollY>50);backToTop.classList.toggle('visible',window.scrollY>400);});backToTop.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
        const mobileMenuBtn=document.getElementById('mobileMenuBtn'),navLinks=document.getElementById('navLinks');mobileMenuBtn.addEventListener('click',()=>navLinks.classList.toggle('active'));navLinks.querySelectorAll('a').forEach(l=>l.addEventListener('click',()=>navLinks.classList.remove('active')));
        const btnThemeToggle=document.getElementById('btnThemeToggle');const saved=localStorage.getItem('museum-theme');if(saved==='light'){document.body.classList.add('light-mode');btnThemeToggle.textContent='◑';}btnThemeToggle.addEventListener('click',()=>{document.body.classList.toggle('light-mode');const isL=document.body.classList.contains('light-mode');btnThemeToggle.textContent=isL?'◑':'◐';localStorage.setItem('museum-theme',isL?'light':'dark');});
        renderWars();
        console.log('%c⚔️ 战争百科已就绪 | 共 %d 场战争','color:#c0392b;',wars.length);
    </script>
</body>
</html>
