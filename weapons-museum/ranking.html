<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排行榜 - 世界兵器博物馆</title>
    <style>
        :root {
            --bg-primary:#0d1117;--bg-secondary:#161b22;--bg-tertiary:#21262d;--bg-card:#1a1f2b;
            --text-primary:#c9d1d9;--text-secondary:#8b949e;--text-highlight:#f0f6fc;
            --accent-military:#2d5a27;--accent-green:#3a7d32;--accent-gold:#c9a84c;--accent-red:#c0392b;
            --accent-blue:#2980b9;--accent-hud:#00ff88;--accent-silver:#b0b0b0;--accent-bronze:#cd7f32;
            --border-military:#2d3a2d;--gradient-hero:linear-gradient(180deg,#0d1117 0%,#1a2f1a 30%,#0d1117 100%);
            --shadow-card:0 4px 20px rgba(0,0,0,0.6);--shadow-hover:0 8px 35px rgba(201,168,76,0.25);
            --border-radius:6px;--transition-speed:0.3s;--nav-height:70px;--max-width:1400px;
        }
        body.light-mode{--bg-primary:#e8ecf1;--bg-secondary:#ffffff;--bg-tertiary:#d5dbe3;--bg-card:#f5f5f0;--text-primary:#2c3e50;--text-secondary:#5a6c7d;--text-highlight:#1a1a2e;--border-military:#c5c9b8;--gradient-hero:linear-gradient(180deg,#d5dbe3 0%,#c5c9b8 30%,#e8ecf1 100%);--shadow-card:0 4px 20px rgba(0,0,0,0.1);}
        *{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;font-size:16px;}
        body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;background-color:var(--bg-primary);color:var(--text-primary);line-height:1.6;transition:background-color var(--transition-speed),color var(--transition-speed);overflow-x:hidden;}
        ::-webkit-scrollbar{width:10px;}::-webkit-scrollbar-track{background:var(--bg-secondary);}::-webkit-scrollbar-thumb{background:var(--accent-military);border-radius:2px;}
        .navbar{position:fixed;top:0;left:0;width:100%;height:var(--nav-height);background:rgba(13,17,23,0.92);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);border-bottom:1px solid var(--border-military);z-index:1000;}.navbar.scrolled{box-shadow:0 4px 25px rgba(0,0,0,0.8);}
        .navbar .container{max-width:var(--max-width);margin:0 auto;padding:0 30px;height:100%;display:flex;align-items:center;justify-content:space-between;}
        .logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text-highlight);font-size:1.4rem;font-weight:800;}.logo-icon{width:46px;height:46px;background:linear-gradient(135deg,#2d5a27,#1a3a15);border:2px solid var(--accent-green);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:var(--accent-gold);}.logo-text{background:linear-gradient(135deg,#c9a84c,#8b7a3a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-transform:uppercase;}
        .nav-links{display:flex;list-style:none;gap:2px;}.nav-links li a{display:block;padding:10px 14px;color:var(--text-secondary);text-decoration:none;border-radius:3px;transition:all var(--transition-speed);font-size:0.85rem;font-weight:500;text-transform:uppercase;letter-spacing:0.5px;position:relative;}.nav-links li a::before{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%) scaleX(0);width:60%;height:2px;background:var(--accent-green);transition:transform var(--transition-speed);}.nav-links li a:hover,.nav-links li a.active{color:var(--accent-gold);}.nav-links li a:hover::before,.nav-links li a.active::before{transform:translateX(-50%) scaleX(1);}
        .nav-actions{display:flex;gap:10px;}.btn-icon{width:38px;height:38px;border:1px solid var(--border-military);background:rgba(45,90,39,0.1);color:var(--text-secondary);border-radius:3px;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;}.btn-icon:hover{background:rgba(58,125,50,0.2);border-color:var(--accent-green);color:var(--accent-hud);}
        .mobile-menu-btn{display:none;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;}.mobile-menu-btn span{display:block;width:25px;height:2px;background:var(--accent-green);}
        .page-header{margin-top:var(--nav-height);background:var(--gradient-hero);padding:60px 0;text-align:center;border-bottom:1px solid var(--border-military);}.page-header h1{font-size:2.5rem;font-weight:900;color:var(--text-highlight);text-transform:uppercase;}.page-header .breadcrumb{color:var(--text-secondary);font-size:0.85rem;}.page-header .breadcrumb a{color:var(--accent-hud);text-decoration:none;}
        .main-content{padding:40px 0 80px;}.main-content .container{max-width:var(--max-width);margin:0 auto;padding:0 30px;}
        .rank-tabs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:40px;}
        .rank-tab{padding:12px 28px;background:var(--bg-card);border:1px solid var(--border-military);color:var(--text-secondary);border-radius:3px;cursor:pointer;transition:all var(--transition-speed);font-size:0.9rem;font-weight:600;text-transform:uppercase;letter-spacing:1px;}
        .rank-tab:hover,.rank-tab.active{background:rgba(201,168,76,0.15);border-color:var(--accent-gold);color:var(--accent-gold);}
        .podium{display:flex;justify-content:center;align-items:flex-end;gap:20px;margin-bottom:50px;flex-wrap:wrap;}
        .podium-item{background:var(--bg-card);border:1px solid var(--border-military);border-radius:var(--border-radius);padding:20px;text-align:center;width:200px;transition:all var(--transition-speed);cursor:pointer;}.podium-item:hover{transform:translateY(-8px);box-shadow:var(--shadow-hover);}
        .podium-item.gold{order:2;width:240px;border-color:var(--accent-gold);box-shadow:0 0 30px rgba(201,168,76,0.3);}.podium-item.silver{order:1;border-color:var(--accent-silver);}.podium-item.bronze{order:3;border-color:var(--accent-bronze);}
        .podium-medal{font-size:3rem;display:block;margin-bottom:10px;}.podium-icon{font-size:3rem;display:block;margin-bottom:8px;}.podium-name{font-weight:800;color:var(--text-highlight);font-size:1rem;text-transform:uppercase;}.podium-nation{color:var(--text-secondary);font-size:0.8rem;}
        .rank-list{display:flex;flex-direction:column;gap:8px;}
        .rank-item{display:flex;align-items:center;gap:15px;background:var(--bg-card);border:1px solid var(--border-military);border-radius:var(--border-radius);padding:16px 20px;transition:all var(--transition-speed);cursor:pointer;text-decoration:none;color:inherit;}
        .rank-item:hover{border-color:var(--accent-gold);transform:translateX(5px);box-shadow:var(--shadow-hover);}
        .rank-num{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1rem;background:var(--bg-tertiary);color:var(--text-secondary);flex-shrink:0;}
        .rank-item:nth-child(1) .rank-num{background:var(--accent-gold);color:#1b2838;}
        .rank-item:nth-child(2) .rank-num{background:var(--accent-silver);color:#1b2838;}
        .rank-item:nth-child(3) .rank-num{background:var(--accent-bronze);color:#1b2838;}
        .rank-icon{font-size:2rem;width:40px;text-align:center;}.rank-info{flex:1;}.rank-name{font-weight:700;color:var(--text-highlight);}.rank-detail{font-size:0.8rem;color:var(--text-secondary);}.rank-value{font-weight:700;color:var(--accent-hud);font-size:0.95rem;}
        .footer{background:var(--bg-secondary);border-top:1px solid var(--border-military);padding:30px;text-align:center;color:var(--text-secondary);font-size:0.8rem;}
        .back-to-top{position:fixed;bottom:30px;right:30px;width:46px;height:46px;background:rgba(45,90,39,0.3);border:1px solid var(--accent-green);color:var(--accent-hud);border-radius:3px;cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all var(--transition-speed);z-index:999;}.back-to-top.visible{opacity:1;visibility:visible;}
        @media(max-width:768px){.nav-links{display:none;position:absolute;top:var(--nav-height);left:0;width:100%;background:rgba(13,17,23,0.98);flex-direction:column;padding:20px;z-index:999;}.nav-links.active{display:flex;}.mobile-menu-btn{display:flex;}.page-header h1{font-size:1.8rem;}.podium{flex-direction:column;align-items:center;}.podium-item.gold,.podium-item.silver,.podium-item.bronze{order:0;width:100%;max-width:260px;}}
    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="container">
            <a href="home.html" class="logo"><div class="logo-icon">⚔</div><span class="logo-text">兵器博物馆</span></a>
            <ul class="nav-links" id="navLinks">
                <li><a href="home.html">首页</a></li><li><a href="weapons.html">兵器大全</a></li><li><a href="tanks.html">坦克馆</a></li><li><a href="aircraft.html">战机馆</a></li><li><a href="navy.html">海军馆</a></li><li><a href="missiles.html">导弹馆</a></li><li><a href="nations.html">国家馆</a></li><li><a href="ranking.html" class="active">排行榜</a></li>
            </ul>
            <div class="nav-actions"><button class="btn-icon" id="btnThemeToggle">◐</button><button class="mobile-menu-btn" id="mobileMenuBtn"><span></span><span></span><span></span></button></div>
        </div>
    </nav>

    <section class="page-header"><h1>🏆 兵器排行榜</h1><p class="breadcrumb"><a href="home.html">首页</a> / 排行榜</p></section>

    <section class="main-content">
        <div class="container">
            <div class="rank-tabs" id="rankTabs">
                <button class="rank-tab active" data-cat="tank">十大坦克</button>
                <button class="rank-tab" data-cat="aircraft">十大战斗机</button>
                <button class="rank-tab" data-cat="navy">最大航母</button>
                <button class="rank-tab" data-cat="missile">最快导弹</button>
            </div>
            <div id="rankingContent"></div>
        </div>
    </section>

    <footer class="footer"><p>© 2025 世界兵器博物馆 | 排行基于综合评估 | 仅供学习参考</p></footer>
    <button class="back-to-top" id="backToTop">▲</button>

    <script>
        const rankings = {
            tank:{title:'世界十大主战坦克',podium:[{n:'M1A2 Abrams',i:'🛡️',nat:'美国',v:'综合评分 98'},{n:'Leopard 2A7+',i:'🐆',nat:'德国',v:'综合评分 96'},{n:'99A式',i:'🛡️',nat:'中国',v:'综合评分 94'}],list:[{n:'T-90M',i:'🔴',nat:'俄罗斯',v:'93'},{n:'挑战者2',i:'🛡️',nat:'英国',v:'91'},{n:'梅卡瓦Mk4',i:'🛡️',nat:'以色列',v:'89'},{n:'勒克莱尔',i:'🛡️',nat:'法国',v:'87'},{n:'K2黑豹',i:'🛡️',nat:'韩国',v:'86'},{n:'10式',i:'🛡️',nat:'日本',v:'84'},{n:'阿琼MK2',i:'🛡️',nat:'印度',v:'75'}]},
            aircraft:{title:'世界十大战斗机',podium:[{n:'F-22 Raptor',i:'🦅',nat:'美国',v:'综合评分 99'},{n:'歼-20 威龙',i:'🐉',nat:'中国',v:'综合评分 96'},{n:'苏-57',i:'🦇',nat:'俄罗斯',v:'综合评分 93'}],list:[{n:'F-35 Lightning II',i:'✈️',nat:'美国',v:'91'},{n:'苏-35',i:'🔱',nat:'俄罗斯',v:'88'},{n:'台风战斗机',i:'✈️',nat:'欧洲',v:'86'},{n:'阵风',i:'✈️',nat:'法国',v:'85'},{n:'F-16V',i:'⚡',nat:'美国',v:'83'},{n:'米格-35',i:'✈️',nat:'俄罗斯',v:'80'},{n:'鹰狮E/F',i:'✈️',nat:'瑞典',v:'78'}]},
            navy:{title:'世界最大航空母舰',podium:[{n:'福特号',i:'🚢',nat:'美国',v:'100000吨'},{n:'尼米兹号',i:'🚢',nat:'美国',v:'102000吨'},{n:'福建舰',i:'🚢',nat:'中国',v:'80000吨'}],list:[{n:'库兹涅佐夫号',i:'🚢',nat:'俄罗斯',v:'58600吨'},{n:'伊丽莎白女王号',i:'🚢',nat:'英国',v:'65000吨'},{n:'戴高乐号',i:'🚢',nat:'法国',v:'42000吨'},{n:'维克兰特号',i:'🚢',nat:'印度',v:'45000吨'},{n:'加富尔号',i:'🚢',nat:'意大利',v:'27000吨'},{n:'出云级',i:'🚢',nat:'日本',v:'27000吨'},{n:'独岛号',i:'🚢',nat:'韩国',v:'19000吨'}]},
            missile:{title:'世界最快导弹排行',podium:[{n:'东风-41',i:'🚀',nat:'中国',v:'25马赫'},{n:'萨尔马特',i:'☠️',nat:'俄罗斯',v:'20马赫'},{n:'民兵III',i:'🎯',nat:'美国',v:'23马赫'}],list:[{n:'布拉莫斯',i:'💥',nat:'俄/印',v:'3马赫'},{n:'战斧',i:'🎯',nat:'美国',v:'0.74马赫'},{n:'锆石',i:'🚀',nat:'俄罗斯',v:'9马赫'},{n:'流星',i:'🚀',nat:'欧洲',v:'4马赫'},{n:'KH-47M2',i:'🚀',nat:'俄罗斯',v:'10马赫'},{n:'鹰击-18',i:'🚀',nat:'中国',v:'3马赫'},{n:'LRASM',i:'🚀',nat:'美国',v:'0.9马赫'}]}
        };
        let currentCat='tank';
        function renderRanking(){const r=rankings[currentCat];const medals=['🥇','🥈','🥉'];document.getElementById('rankingContent').innerHTML=`
            <div class="podium">${r.podium.map((p,i)=>`<div class="podium-item ${i===0?'gold':i===1?'silver':'bronze'}"><span class="podium-medal">${medals[i]}</span><span class="podium-icon">${p.i}</span><div class="podium-name">${p.n}</div><div class="podium-nation">${p.nat}</div><div style="color:var(--accent-hud);font-size:0.85rem;margin-top:8px;">${p.v}</div></div>`).join('')}</div>
            <div class="rank-list">${r.list.map((item,i)=>`<div class="rank-item"><span class="rank-num">${i+4}</span><span class="rank-icon">${item.i}</span><span class="rank-info"><div class="rank-name">${item.n}</div><div class="rank-detail">${item.nat}</div></span><span class="rank-value">${item.v}</span></div>`).join('')}</div>`;}
        document.getElementById('rankTabs').addEventListener('click',e=>{const b=e.target.closest('.rank-tab');if(!b)return;document.querySelectorAll('.rank-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentCat=b.dataset.cat;renderRanking();});
        const navbar=document.getElementById('navbar'),backToTop=document.getElementById('backToTop');window.addEventListener('scroll',()=>{navbar.classList.toggle('scrolled',window.scrollY>50);backToTop.classList.toggle('visible',window.scrollY>400);});backToTop.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
        const mobileMenuBtn=document.getElementById('mobileMenuBtn'),navLinks=document.getElementById('navLinks');mobileMenuBtn.addEventListener('click',()=>navLinks.classList.toggle('active'));navLinks.querySelectorAll('a').forEach(l=>l.addEventListener('click',()=>navLinks.classList.remove('active')));
        const btnThemeToggle=document.getElementById('btnThemeToggle');const saved=localStorage.getItem('museum-theme');if(saved==='light'){document.body.classList.add('light-mode');btnThemeToggle.textContent='◑';}btnThemeToggle.addEventListener('click',()=>{document.body.classList.toggle('light-mode');const isL=document.body.classList.contains('light-mode');btnThemeToggle.textContent=isL?'◑':'◐';localStorage.setItem('museum-theme',isL?'light':'dark');});
        renderRanking();
        console.log('%c🏆 排行榜已就绪','color:#c9a84c;font-size:1.1em;');
    </script>
</body>
</html>
