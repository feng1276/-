<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>坦克馆 - 世界兵器博物馆</title>
    <style>
        :root {
            --bg-primary:#0d1117;--bg-secondary:#161b22;--bg-tertiary:#21262d;--bg-card:#1a1f2b;
            --text-primary:#c9d1d9;--text-secondary:#8b949e;--text-highlight:#f0f6fc;
            --accent-military:#2d5a27;--accent-green:#3a7d32;--accent-gold:#c9a84c;--accent-red:#c0392b;
            --accent-blue:#2980b9;--accent-hud:#00ff88;--border-military:#2d3a2d;
            --gradient-hero:linear-gradient(180deg,#0d1117 0%,#1a2f1a 30%,#0d1117 100%);
            --shadow-card:0 4px 20px rgba(0,0,0,0.6);--shadow-hover:0 8px 35px rgba(61,125,50,0.25);
            --border-radius:6px;--transition-speed:0.3s;--nav-height:70px;--max-width:1400px;
        }
        body.light-mode{--bg-primary:#e8ecf1;--bg-secondary:#ffffff;--bg-tertiary:#d5dbe3;--bg-card:#f5f5f0;--text-primary:#2c3e50;--text-secondary:#5a6c7d;--text-highlight:#1a1a2e;--border-military:#c5c9b8;--gradient-hero:linear-gradient(180deg,#d5dbe3 0%,#c5c9b8 30%,#e8ecf1 100%);--shadow-card:0 4px 20px rgba(0,0,0,0.1);--shadow-hover:0 8px 35px rgba(45,90,39,0.15);}
        *{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;font-size:16px;}
        body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;background-color:var(--bg-primary);color:var(--text-primary);line-height:1.6;transition:background-color var(--transition-speed),color var(--transition-speed);overflow-x:hidden;}
        body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,136,0.012) 2px,rgba(0,255,136,0.012) 4px);pointer-events:none;z-index:0;}body>*{position:relative;z-index:1;}
        ::-webkit-scrollbar{width:10px;}::-webkit-scrollbar-track{background:var(--bg-secondary);}::-webkit-scrollbar-thumb{background:var(--accent-military);border-radius:2px;}::-webkit-scrollbar-thumb:hover{background:var(--accent-green);}
        .navbar{position:fixed;top:0;left:0;width:100%;height:var(--nav-height);background:rgba(13,17,23,0.92);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);border-bottom:1px solid var(--border-military);z-index:1000;transition:all var(--transition-speed);}.navbar.scrolled{box-shadow:0 4px 25px rgba(0,0,0,0.8);}
        .navbar .container{max-width:var(--max-width);margin:0 auto;padding:0 30px;height:100%;display:flex;align-items:center;justify-content:space-between;}
        .logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text-highlight);font-size:1.4rem;font-weight:800;letter-spacing:1px;}.logo-icon{width:46px;height:46px;background:linear-gradient(135deg,#2d5a27,#1a3a15);border:2px solid var(--accent-green);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:var(--accent-gold);font-weight:900;box-shadow:0 0 15px rgba(58,125,50,0.3);}.logo-text{background:linear-gradient(135deg,#c9a84c,#8b7a3a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-transform:uppercase;}
        .nav-links{display:flex;list-style:none;gap:2px;}.nav-links li a{display:block;padding:10px 14px;color:var(--text-secondary);text-decoration:none;border-radius:3px;transition:all var(--transition-speed);font-size:0.85rem;font-weight:500;text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap;position:relative;}.nav-links li a::before{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%) scaleX(0);width:60%;height:2px;background:var(--accent-green);transition:transform var(--transition-speed);}.nav-links li a:hover,.nav-links li a.active{color:var(--accent-gold);background:rgba(201,168,76,0.05);}.nav-links li a:hover::before,.nav-links li a.active::before{transform:translateX(-50%) scaleX(1);}
        .nav-actions{display:flex;gap:10px;align-items:center;}.btn-icon{width:38px;height:38px;border:1px solid var(--border-military);background:rgba(45,90,39,0.1);color:var(--text-secondary);border-radius:3px;cursor:pointer;font-size:1.1rem;transition:all var(--transition-speed);display:flex;align-items:center;justify-content:center;}.btn-icon:hover{background:rgba(58,125,50,0.2);border-color:var(--accent-green);color:var(--accent-hud);}
        .mobile-menu-btn{display:none;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;padding:5px;}.mobile-menu-btn span{display:block;width:25px;height:2px;background:var(--accent-green);border-radius:2px;}
        .page-header{margin-top:var(--nav-height);background:var(--gradient-hero);padding:60px 0;text-align:center;border-bottom:1px solid var(--border-military);}.page-header h1{font-size:2.5rem;font-weight:900;color:var(--text-highlight);text-transform:uppercase;letter-spacing:2px;}.page-header .breadcrumb{color:var(--text-secondary);font-size:0.85rem;margin-top:8px;}.page-header .breadcrumb a{color:var(--accent-hud);text-decoration:none;}
        .main-content{padding:40px 0 80px;}.main-content .container{max-width:var(--max-width);margin:0 auto;padding:0 30px;}
        .era-tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:40px;}
        .era-tab{padding:12px 28px;background:var(--bg-card);border:1px solid var(--border-military);color:var(--text-secondary);border-radius:3px;cursor:pointer;transition:all var(--transition-speed);font-size:0.9rem;font-weight:600;text-transform:uppercase;letter-spacing:1px;}
        .era-tab:hover,.era-tab.active{background:var(--accent-military);border-color:var(--accent-green);color:var(--accent-hud);}
        .tank-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:25px;}
        .tank-card{background:var(--bg-card);border:1px solid var(--border-military);border-radius:var(--border-radius);overflow:hidden;transition:all var(--transition-speed);cursor:pointer;position:relative;}
        .tank-card:hover{transform:translateY(-6px);border-color:var(--accent-green);box-shadow:var(--shadow-hover);}
        .tank-card-img{width:100%;aspect-ratio:16/9;background:var(--bg-tertiary);display:flex;align-items:center;justify-content:center;font-size:5rem;color:var(--text-secondary);position:relative;}
        .tank-card-era{position:absolute;top:12px;left:12px;padding:5px 12px;background:rgba(0,0,0,0.8);border:1px solid var(--accent-green);color:var(--accent-hud);font-size:0.7rem;font-weight:700;letter-spacing:1px;border-radius:2px;}
        .tank-card-body{padding:22px;}
        .tank-card-name{font-size:1.2rem;font-weight:800;color:var(--text-highlight);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
        .tank-card-nation{font-size:0.85rem;color:var(--accent-gold);margin-bottom:12px;}
        .tank-card-desc{font-size:0.85rem;color:var(--text-secondary);line-height:1.6;margin-bottom:15px;}
        .tank-specs-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
        .tank-spec-item{background:var(--bg-tertiary);padding:10px 12px;border-radius:3px;}
        .tank-spec-label{font-size:0.7rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:1px;}
        .tank-spec-value{font-size:0.9rem;color:var(--accent-hud);font-weight:700;margin-top:2px;}
        .compare-section{margin-top:60px;background:var(--bg-card);border:1px solid var(--border-military);border-radius:var(--border-radius);padding:35px;}
        .compare-section h2{color:var(--accent-gold);font-size:1.3rem;text-transform:uppercase;letter-spacing:2px;margin-bottom:20px;text-align:center;}
        .compare-container{display:flex;gap:20px;align-items:center;justify-content:center;flex-wrap:wrap;}
        .compare-select{flex:1;min-width:200px;}
        .compare-select select{width:100%;padding:12px;background:var(--bg-tertiary);border:1px solid var(--border-military);color:var(--text-primary);border-radius:3px;font-size:0.9rem;cursor:pointer;}
        .compare-vs{font-size:2rem;color:var(--accent-red);font-weight:900;}
        .compare-table{margin-top:25px;width:100%;border-collapse:collapse;display:none;}
        .compare-table.active{display:table;}
        .compare-table th,.compare-table td{padding:12px 15px;text-align:center;border:1px solid var(--border-military);font-size:0.85rem;}
        .compare-table th{background:var(--accent-military);color:var(--accent-hud);text-transform:uppercase;letter-spacing:1px;}
        .compare-table td{color:var(--text-primary);}
        .compare-table .highlight{color:var(--accent-hud);font-weight:700;}
        .btn{display:inline-flex;align-items:center;gap:6px;padding:12px 24px;border-radius:3px;font-size:0.85rem;font-weight:700;cursor:pointer;border:none;transition:all var(--transition-speed);text-transform:uppercase;letter-spacing:1px;}
        .btn-compare{background:var(--accent-military);color:var(--accent-hud);border:1px solid var(--accent-green);margin-top:20px;}
        .btn-compare:hover{background:var(--accent-green);color:#fff;}
        .footer{background:var(--bg-secondary);border-top:1px solid var(--border-military);padding:30px;text-align:center;color:var(--text-secondary);font-size:0.8rem;}
        .back-to-top{position:fixed;bottom:30px;right:30px;width:46px;height:46px;background:rgba(45,90,39,0.3);border:1px solid var(--accent-green);color:var(--accent-hud);border-radius:3px;cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all var(--transition-speed);z-index:999;}.back-to-top.visible{opacity:1;visibility:visible;}.back-to-top:hover{background:var(--accent-military);border-color:var(--accent-gold);color:var(--accent-gold);}
        @keyframes fadeInUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}.tank-card{animation:fadeInUp 0.4s ease forwards;}
        @media(max-width:768px){.nav-links{display:none;position:absolute;top:var(--nav-height);left:0;width:100%;background:rgba(13,17,23,0.98);flex-direction:column;padding:20px;backdrop-filter:blur(15px);z-index:999;border-bottom:2px solid var(--accent-military);}.nav-links.active{display:flex;}.mobile-menu-btn{display:flex;}.page-header h1{font-size:1.8rem;}.tank-grid{grid-template-columns:1fr;}}
    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="container">
            <a href="home.html" class="logo"><div class="logo-icon">⚔</div><span class="logo-text">兵器博物馆</span></a>
            <ul class="nav-links" id="navLinks">
                <li><a href="home.html">首页</a></li>
                <li><a href="weapons.html">兵器大全</a></li>
                <li><a href="tanks.html" class="active">坦克馆</a></li>
                <li><a href="aircraft.html">战机馆</a></li>
                <li><a href="navy.html">海军馆</a></li>
                <li><a href="timeline.html">时间轴</a></li>
                <li><a href="nations.html">国家馆</a></li>
                <li><a href="ranking.html">排行榜</a></li>
            </ul>
            <div class="nav-actions">
                <button class="btn-icon" id="btnThemeToggle" title="切换主题">◐</button>
                <button class="mobile-menu-btn" id="mobileMenuBtn"><span></span><span></span><span></span></button>
            </div>
        </div>
    </nav>

    <section class="page-header">
        <h1>🛡️ 坦克馆</h1>
        <p class="breadcrumb"><a href="home.html">首页</a> / 坦克馆</p>
    </section>

    <section class="main-content">
        <div class="container">
            <div class="era-tabs" id="eraTabs">
                <button class="era-tab active" data-era="all">全部坦克</button>
                <button class="era-tab" data-era="二战">二战坦克</button>
                <button class="era-tab" data-era="冷战">冷战坦克</button>
                <button class="era-tab" data-era="现代">现代主战坦克</button>
            </div>
            <div class="tank-grid" id="tankGrid"></div>
            <div class="compare-section">
                <h2>⚔ 坦克对比系统</h2>
                <div class="compare-container">
                    <div class="compare-select"><select id="tankA"><option value="">选择坦克A</option></select></div>
                    <span class="compare-vs">VS</span>
                    <div class="compare-select"><select id="tankB"><option value="">选择坦克B</option></select></div>
                </div>
                <div style="text-align:center;"><button class="btn btn-compare" id="btnCompare">开始对比</button></div>
                <table class="compare-table" id="compareTable">
                    <thead><tr><th>参数</th><th id="compareNameA">坦克A</th><th id="compareNameB">坦克B</th></tr></thead>
                    <tbody id="compareBody"></tbody>
                </table>
            </div>
        </div>
    </section>

    <footer class="footer"><p>© 2025 世界兵器博物馆 | 坦克数据来源公开军事资料 | 仅供学习使用</p></footer>
    <button class="back-to-top" id="backToTop" title="返回顶部">▲</button>

    <script>
        const tanks = [
            {id:'m1a2',name:'M1A2 Abrams SEPv3',nation:'美国',era:'现代',icon:'🛡️',desc:'M1A2 Abrams是美军现役最先进的主战坦克，配备120mm滑膛炮和先进的火控系统。采用贫铀装甲和主动防护系统，是世界上最重的主战坦克之一。',specs:{重量:'68吨',长度:'9.83m',宽度:'3.66m',发动机:'AGT1500燃气轮机 1500hp',最大速度:'67km/h',主炮:'120mm M256滑膛炮',乘员:'4人',装甲:'贫铀复合装甲'}},
            {id:'leopard2',name:'Leopard 2A7+',nation:'德国',era:'现代',icon:'🐆',desc:'德国豹2A7+是世界上最优秀的主战坦克之一，以精准的火力和出色的机动性著称。被多个国家采用为主力装备。',specs:{重量:'62吨',长度:'9.97m',宽度:'3.75m',发动机:'MTU柴油机 1500hp',最大速度:'72km/h',主炮:'120mm L/55滑膛炮',乘员:'4人',装甲:'模块化复合装甲'}},
            {id:'t90',name:'T-90M',nation:'俄罗斯',era:'现代',icon:'🔴',desc:'T-90M是俄军最新型主战坦克，结合了T-90的可靠性和现代化升级。装备125mm滑膛炮和Relikt爆炸反应装甲。',specs:{重量:'48吨',长度:'9.53m',宽度:'3.78m',发动机:'V-92S2F柴油机 1130hp',最大速度:'60km/h',主炮:'125mm 2A46M-5滑膛炮',乘员:'3人',装甲:'复合+爆炸反应装甲'}},
            {id:'type99',name:'99A式主战坦克',nation:'中国',era:'现代',icon:'🛡️',desc:'99A式是中国陆军最先进的主战坦克，配备125mm滑膛炮和先进的猎-歼火控系统，具备强大的火力和防护能力。',specs:{重量:'58吨',长度:'11m',宽度:'3.5m',发动机:'涡轮增压柴油机 1500hp',最大速度:'70km/h',主炮:'125mm ZPT-98滑膛炮',乘员:'3人',装甲:'模块化复合装甲+ERA'}},
            {id:'challenger',name:'挑战者2',nation:'英国',era:'现代',icon:'🛡️',desc:'英国挑战者2以其卓越的装甲防护闻名，采用乔巴姆复合装甲。线膛炮在远距离精度方面具有独特优势。',specs:{重量:'75吨',长度:'11.55m',宽度:'3.52m',发动机:'帕金斯柴油机 1200hp',最大速度:'59km/h',主炮:'120mm L30A1线膛炮',乘员:'4人',装甲:'乔巴姆复合装甲'}},
            {id:'tiger',name:'虎式重型坦克',nation:'德国',era:'二战',icon:'🐯',desc:'虎式坦克是二战期间德军最著名的重型坦克，拥有厚重的装甲和强大的88mm炮。在战场上给盟军造成了巨大威胁。',specs:{重量:'57吨',长度:'8.45m',宽度:'3.7m',发动机:'迈巴赫汽油机 700hp',最大速度:'38km/h',主炮:'88mm KwK36 L/56',乘员:'5人',装甲:'轧制均质钢装甲 100mm'}},
            {id:'t34',name:'T-34/85',nation:'苏联',era:'二战',icon:'⭐',desc:'T-34是二战期间产量最大的中型坦克，以倾斜装甲设计和高机动性著称。对战后坦克设计产生了深远影响。',specs:{重量:'32吨',长度:'8.15m',宽度:'3m',发动机:'V-2柴油机 500hp',最大速度:'55km/h',主炮:'85mm ZiS-S-53',乘员:'5人',装甲:'倾斜装甲 45-90mm'}},
            {id:'sherman',name:'M4A3E8谢尔曼',nation:'美国',era:'二战',icon:'⭐',desc:'M4谢尔曼是美军在二战期间的主力坦克，以可靠性高、易于维护著称。通过数量优势在欧洲和太平洋战场发挥了重要作用。',specs:{重量:'33吨',长度:'7.54m',宽度:'3m',发动机:'福特GAA V8 500hp',最大速度:'48km/h',主炮:'76mm M1A2',乘员:'5人',装甲:'铸造+焊接装甲 64mm'}},
            {id:'panther',name:'黑豹中型坦克',nation:'德国',era:'二战',icon:'🐆',desc:'黑豹坦克被认为是二战期间最均衡的坦克设计之一。结合了火力、防护和机动性，影响了战后主战坦克的设计理念。',specs:{重量:'45吨',长度:'8.66m',宽度:'3.27m',发动机:'迈巴赫汽油机 700hp',最大速度:'55km/h',主炮:'75mm KwK42 L/70',乘员:'5人',装甲:'倾斜装甲 80mm'}},
            {id:'merkava',name:'梅卡瓦Mk4',nation:'以色列',era:'现代',icon:'🛡️',desc:'以色列梅卡瓦坦克独特地将发动机前置，增强了乘员防护。设计理念强调乘员生存能力，适合中东地区的作战环境。',specs:{重量:'65吨',长度:'9.04m',宽度:'3.72m',发动机:'MTU柴油机 1500hp',最大速度:'64km/h',主炮:'120mm MG253滑膛炮',乘员:'4人',装甲:'模块化复合装甲'}}
        ];

        let activeEra='all';
        function getFilteredTanks(){return activeEra==='all'?tanks:tanks.filter(t=>t.era===activeEra);}
        function renderTanks(){const f=getFilteredTanks();document.getElementById('tankGrid').innerHTML=f.map((t,i)=>`<div class="tank-card" style="animation-delay:${i*0.06}s" onclick="selectTank('${t.id}')"><div class="tank-card-img">${t.icon}<span class="tank-card-era">${t.era}</span></div><div class="tank-card-body"><div class="tank-card-name">${t.name}</div><div class="tank-card-nation">${t.nation}</div><div class="tank-card-desc">${t.desc}</div><div class="tank-specs-grid">${Object.entries(t.specs).slice(0,6).map(([k,v])=>`<div class="tank-spec-item"><div class="tank-spec-label">${k}</div><div class="tank-spec-value">${v}</div></div>`).join('')}</div></div></div>`).join('');}
        document.getElementById('eraTabs').addEventListener('click',e=>{const b=e.target.closest('.era-tab');if(!b)return;document.querySelectorAll('.era-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeEra=b.dataset.era;renderTanks();});

        function populateSelects(){const sA=document.getElementById('tankA'),sB=document.getElementById('tankB');sA.innerHTML='<option value="">选择坦克A</option>'+tanks.map(t=>`<option value="${t.id}">${t.name} (${t.nation})</option>`).join('');sB.innerHTML='<option value="">选择坦克B</option>'+tanks.map(t=>`<option value="${t.id}">${t.name} (${t.nation})</option>`).join('');}
        function selectTank(id){const sA=document.getElementById('tankA'),sB=document.getElementById('tankB');if(!sA.value){sA.value=id;}else if(!sB.value){sB.value=id;}else{sA.value=id;sB.value='';}}
        document.getElementById('btnCompare').addEventListener('click',()=>{const idA=document.getElementById('tankA').value,idB=document.getElementById('tankB').value;if(!idA||!idB){alert('请选择两辆坦克进行对比');return;}const a=tanks.find(t=>t.id===idA),b=tanks.find(t=>t.id===idB);document.getElementById('compareNameA').textContent=a.name;document.getElementById('compareNameB').textContent=b.name;const allKeys=[...new Set([...Object.keys(a.specs),...Object.keys(b.specs)])];document.getElementById('compareBody').innerHTML=allKeys.map(k=>`<tr><th>${k}</th><td class="${(a.specs[k]||'')>(b.specs[k]||'')?'highlight':''}">${a.specs[k]||'-'}</td><td class="${(b.specs[k]||'')>(a.specs[k]||'')?'highlight':''}">${b.specs[k]||'-'}</td></tr>`).join('');document.getElementById('compareTable').classList.add('active');});

        const navbar=document.getElementById('navbar'),backToTop=document.getElementById('backToTop');window.addEventListener('scroll',()=>{const s=window.scrollY;navbar.classList.toggle('scrolled',s>50);backToTop.classList.toggle('visible',s>400);});backToTop.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
        const mobileMenuBtn=document.getElementById('mobileMenuBtn'),navLinks=document.getElementById('navLinks');mobileMenuBtn.addEventListener('click',()=>navLinks.classList.toggle('active'));navLinks.querySelectorAll('a').forEach(l=>{l.addEventListener('click',()=>navLinks.classList.remove('active'));});
        const btnThemeToggle=document.getElementById('btnThemeToggle');const saved=localStorage.getItem('museum-theme');if(saved==='light'){document.body.classList.add('light-mode');btnThemeToggle.textContent='◑';}btnThemeToggle.addEventListener('click',()=>{document.body.classList.toggle('light-mode');const isL=document.body.classList.contains('light-mode');btnThemeToggle.textContent=isL?'◑':'◐';localStorage.setItem('museum-theme',isL?'light':'dark');});

        populateSelects();renderTanks();
        console.log('%c🛡️ 坦克馆已就绪 | 共 %d 辆坦克 | 对比系统可用','color:#00ff88;',tanks.length);
    </script>
</body>
</html>
