<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>枪械馆 - 世界兵器博物馆</title>
    <style>
        :root {
            --bg-primary:#0d1117;--bg-secondary:#161b22;--bg-tertiary:#21262d;--bg-card:#1a1f2b;
            --text-primary:#c9d1d9;--text-secondary:#8b949e;--text-highlight:#f0f6fc;
            --accent-military:#2d5a27;--accent-green:#3a7d32;--accent-gold:#c9a84c;--accent-red:#c0392b;
            --accent-blue:#2980b9;--accent-hud:#00ff88;--accent-firearm:#d35400;--border-military:#2d3a2d;
            --gradient-hero:linear-gradient(180deg,#0d1117 0%,#1a1a0d 30%,#0d1117 100%);
            --shadow-card:0 4px 20px rgba(0,0,0,0.6);--shadow-hover:0 8px 35px rgba(211,84,0,0.25);
            --border-radius:6px;--transition-speed:0.3s;--nav-height:70px;--max-width:1400px;
        }
        body.light-mode{--bg-primary:#e8ecf1;--bg-secondary:#ffffff;--bg-tertiary:#d5dbe3;--bg-card:#f5f5f0;--text-primary:#2c3e50;--text-secondary:#5a6c7d;--text-highlight:#1a1a2e;--border-military:#c5c9b8;--gradient-hero:linear-gradient(180deg,#d5dbe3 0%,#d0c8b0 30%,#e8ecf1 100%);--shadow-card:0 4px 20px rgba(0,0,0,0.1);--shadow-hover:0 8px 35px rgba(211,84,0,0.15);}
        *{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;font-size:16px;}
        body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;background-color:var(--bg-primary);color:var(--text-primary);line-height:1.6;transition:background-color var(--transition-speed),color var(--transition-speed);overflow-x:hidden;}
        body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(211,84,0,0.008) 3px,rgba(211,84,0,0.008) 6px);pointer-events:none;z-index:0;}body>*{position:relative;z-index:1;}
        ::-webkit-scrollbar{width:10px;}::-webkit-scrollbar-track{background:var(--bg-secondary);}::-webkit-scrollbar-thumb{background:var(--accent-firearm);border-radius:2px;}
        .navbar{position:fixed;top:0;left:0;width:100%;height:var(--nav-height);background:rgba(13,17,23,0.92);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);border-bottom:1px solid var(--border-military);z-index:1000;transition:all var(--transition-speed);}.navbar.scrolled{box-shadow:0 4px 25px rgba(0,0,0,0.8);}
        .navbar .container{max-width:var(--max-width);margin:0 auto;padding:0 30px;height:100%;display:flex;align-items:center;justify-content:space-between;}
        .logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text-highlight);font-size:1.4rem;font-weight:800;letter-spacing:1px;}.logo-icon{width:46px;height:46px;background:linear-gradient(135deg,#3d2a1a,#2a1a10);border:2px solid var(--accent-firearm);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:var(--accent-gold);font-weight:900;box-shadow:0 0 15px rgba(211,84,0,0.3);}.logo-text{background:linear-gradient(135deg,#c9a84c,#8b7a3a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-transform:uppercase;}
        .nav-links{display:flex;list-style:none;gap:2px;}.nav-links li a{display:block;padding:10px 14px;color:var(--text-secondary);text-decoration:none;border-radius:3px;transition:all var(--transition-speed);font-size:0.85rem;font-weight:500;text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap;position:relative;}.nav-links li a::before{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%) scaleX(0);width:60%;height:2px;background:var(--accent-firearm);transition:transform var(--transition-speed);}.nav-links li a:hover,.nav-links li a.active{color:var(--accent-gold);background:rgba(201,168,76,0.05);}.nav-links li a:hover::before,.nav-links li a.active::before{transform:translateX(-50%) scaleX(1);}
        .nav-actions{display:flex;gap:10px;align-items:center;}.btn-icon{width:38px;height:38px;border:1px solid var(--border-military);background:rgba(211,84,0,0.1);color:var(--text-secondary);border-radius:3px;cursor:pointer;font-size:1.1rem;transition:all var(--transition-speed);display:flex;align-items:center;justify-content:center;}.btn-icon:hover{background:rgba(211,84,0,0.2);border-color:var(--accent-firearm);color:var(--accent-firearm);}
        .mobile-menu-btn{display:none;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;padding:5px;}.mobile-menu-btn span{display:block;width:25px;height:2px;background:var(--accent-firearm);border-radius:2px;}
        .page-header{margin-top:var(--nav-height);background:var(--gradient-hero);padding:60px 0;text-align:center;border-bottom:1px solid var(--border-military);}.page-header h1{font-size:2.5rem;font-weight:900;color:var(--text-highlight);text-transform:uppercase;letter-spacing:2px;}.page-header .breadcrumb{color:var(--text-secondary);font-size:0.85rem;margin-top:8px;}.page-header .breadcrumb a{color:var(--accent-firearm);text-decoration:none;}
        .main-content{padding:40px 0 80px;}.main-content .container{max-width:var(--max-width);margin:0 auto;padding:0 30px;display:flex;gap:30px;}
        .sidebar{width:240px;flex-shrink:0;position:sticky;top:calc(var(--nav-height)+20px);height:fit-content;}
        .sidebar-section{background:var(--bg-card);border:1px solid var(--border-military);border-radius:var(--border-radius);padding:20px;margin-bottom:18px;}
        .sidebar-section h3{color:var(--accent-gold);font-size:0.8rem;text-transform:uppercase;letter-spacing:2px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border-military);}
        .sidebar-section ul{list-style:none;}.sidebar-section ul li{margin-bottom:3px;}.sidebar-section ul li a{display:block;padding:7px 10px;color:var(--text-secondary);text-decoration:none;border-radius:2px;transition:all var(--transition-speed);font-size:0.82rem;cursor:pointer;}.sidebar-section ul li a:hover,.sidebar-section ul li a.active{background:rgba(211,84,0,0.15);color:var(--accent-firearm);}
        .content-area{flex:1;}
        .firearm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;}
        .firearm-card{background:var(--bg-card);border:1px solid var(--border-military);border-radius:var(--border-radius);overflow:hidden;transition:all var(--transition-speed);cursor:pointer;}
        .firearm-card:hover{transform:translateY(-5px);border-color:var(--accent-firearm);box-shadow:var(--shadow-hover);}
        .firearm-card-top{width:100%;aspect-ratio:3/1;background:linear-gradient(180deg,var(--bg-tertiary),var(--bg-card));display:flex;align-items:center;justify-content:center;font-size:4rem;color:var(--text-secondary);position:relative;}
        .firearm-card-era{position:absolute;top:10px;right:10px;padding:4px 10px;background:rgba(0,0,0,0.7);border:1px solid var(--accent-firearm);color:var(--accent-firearm);font-size:0.65rem;font-weight:700;letter-spacing:1px;border-radius:2px;}
        .firearm-card-body{padding:18px;}
        .firearm-card-name{font-size:1.1rem;font-weight:800;color:var(--text-highlight);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;}
        .firearm-card-type{display:inline-block;padding:3px 10px;background:rgba(211,84,0,0.1);color:var(--accent-firearm);border-radius:2px;font-size:0.7rem;letter-spacing:1px;margin-bottom:8px;}
        .firearm-card-nation{font-size:0.82rem;color:var(--accent-gold);margin-bottom:8px;}
        .firearm-card-desc{font-size:0.82rem;color:var(--text-secondary);line-height:1.5;margin-bottom:10px;}
        .firearm-spec-row{display:flex;gap:8px;flex-wrap:wrap;}
        .firearm-spec-tag{padding:4px 10px;background:rgba(211,84,0,0.08);border:1px solid rgba(211,84,0,0.2);color:var(--accent-firearm);border-radius:2px;font-size:0.72rem;font-weight:600;}
        .footer{background:var(--bg-secondary);border-top:1px solid var(--border-military);padding:30px;text-align:center;color:var(--text-secondary);font-size:0.8rem;}
        .back-to-top{position:fixed;bottom:30px;right:30px;width:46px;height:46px;background:rgba(211,84,0,0.3);border:1px solid var(--accent-firearm);color:var(--accent-firearm);border-radius:3px;cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all var(--transition-speed);z-index:999;}.back-to-top.visible{opacity:1;visibility:visible;}.back-to-top:hover{background:var(--accent-firearm);border-color:var(--accent-gold);color:#fff;}
        @keyframes fadeInUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}.firearm-card{animation:fadeInUp 0.4s ease forwards;}
        @media(max-width:768px){.nav-links{display:none;position:absolute;top:var(--nav-height);left:0;width:100%;background:rgba(13,17,23,0.98);flex-direction:column;padding:20px;backdrop-filter:blur(15px);z-index:999;border-bottom:2px solid var(--accent-military);}.nav-links.active{display:flex;}.mobile-menu-btn{display:flex;}.main-content .container{flex-direction:column;}.sidebar{width:100%;position:static;display:flex;gap:10px;overflow-x:auto;}.sidebar-section{flex:1;min-width:140px;}.page-header h1{font-size:1.8rem;}.firearm-grid{grid-template-columns:1fr;}}
    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="container">
            <a href="home.html" class="logo"><div class="logo-icon">⚔</div><span class="logo-text">兵器博物馆</span></a>
            <ul class="nav-links" id="navLinks">
                <li><a href="home.html">首页</a></li>
                <li><a href="weapons.html">兵器大全</a></li>
                <li><a href="tanks.html">坦克馆</a></li>
                <li><a href="aircraft.html">战机馆</a></li>
                <li><a href="navy.html">海军馆</a></li>
                <li><a href="missiles.html">导弹馆</a></li>
                <li><a href="firearms.html" class="active">枪械馆</a></li>
                <li><a href="ranking.html">排行榜</a></li>
            </ul>
            <div class="nav-actions">
                <button class="btn-icon" id="btnThemeToggle" title="切换主题">◐</button>
                <button class="mobile-menu-btn" id="mobileMenuBtn"><span></span><span></span><span></span></button>
            </div>
        </div>
    </nav>

    <section class="page-header">
        <h1>🔫 枪械馆</h1>
        <p class="breadcrumb"><a href="home.html">首页</a> / 枪械馆</p>
    </section>

    <section class="main-content">
        <div class="container">
            <aside class="sidebar">
                <div class="sidebar-section">
                    <h3>🔫 枪械分类</h3>
                    <ul id="categoryList">
                        <li><a class="active" data-category="all">全部枪械</a></li>
                        <li><a data-category="突击步枪">突击步枪</a></li>
                        <li><a data-category="机枪">机枪</a></li>
                        <li><a data-category="狙击步枪">狙击步枪</a></li>
                        <li><a data-category="手枪">手枪</a></li>
                    </ul>
                </div>
                <div class="sidebar-section">
                    <h3>⏳ 年代</h3>
                    <ul id="eraList">
                        <li><a data-era="all">全部年代</a></li>
                        <li><a data-era="二战">二战时期</a></li>
                        <li><a data-era="冷战">冷战时期</a></li>
                        <li><a data-era="现代">现代装备</a></li>
                    </ul>
                </div>
            </aside>
            <div class="content-area">
                <div class="firearm-grid" id="firearmGrid"></div>
            </div>
        </div>
    </section>

    <footer class="footer"><p>© 2025 世界兵器博物馆 | 枪械数据来源公开资料 | 仅供学习使用</p></footer>
    <button class="back-to-top" id="backToTop" title="返回顶部">▲</button>

    <script>
        const firearms = [
            {id:'ak47',name:'AK-47',nation:'苏联',category:'突击步枪',era:'冷战',icon:'🔫',desc:'AK-47是世界上产量最高、使用最广泛的突击步枪。由卡拉什尼科夫设计，以可靠性著称，全球产量超过1亿支。',specs:{口径:'7.62×39mm',射速:'600发/分',弹容量:'30发',有效射程:'350m',重量:'4.3kg'}},
            {id:'m16',name:'M16A4',nation:'美国',category:'突击步枪',era:'冷战',icon:'🔫',desc:'M16系列是美军制式步枪，采用5.56mm小口径弹药。精度高、后坐力小，是世界上装备最广泛的步枪之一。',specs:{口径:'5.56×45mm',射速:'700-950发/分',弹容量:'30发',有效射程:'550m',重量:'3.4kg'}},
            {id:'mg42',name:'MG42',nation:'德国',category:'机枪',era:'二战',icon:'💥',desc:'MG42是二战期间德军通用的通用机枪，射速高达1200发/分。因其可怕的射速被称为"希特勒的电锯"。',specs:{口径:'7.92×57mm',射速:'1200发/分',供弹:'弹链',有效射程:'2000m',重量:'11.6kg'}},
            {id:'barrett',name:'M82 Barrett',nation:'美国',category:'狙击步枪',era:'现代',icon:'🎯',desc:'巴雷特M82是世界上最著名的反器材步枪，使用12.7mm大口径弹药。可有效打击轻型装甲目标和远距离人员。',specs:{口径:'12.7×99mm',射速:'半自动',弹容量:'10发',有效射程:'1800m',重量:'14kg'}},
            {id:'glock17',name:'Glock 17',nation:'奥地利',category:'手枪',era:'现代',icon:'🔫',desc:'格洛克17是最成功的现代手枪之一，被全球执法机构和军队广泛采用。以可靠性、大容量和安全性著称。',specs:{口径:'9×19mm',射速:'半自动',弹容量:'17发',有效射程:'50m',重量:'0.71kg'}},
            {id:'type95',name:'95式自动步枪',nation:'中国',category:'突击步枪',era:'现代',icon:'🔫',desc:'95式是中国自主研发的无托式突击步枪，采用5.8mm国产口径。结构紧凑，适合机械化步兵使用。',specs:{口径:'5.8×42mm',射速:'650发/分',弹容量:'30发',有效射程:'400m',重量:'3.25kg'}},
            {id:'mp5',name:'MP5冲锋枪',nation:'德国',category:'突击步枪',era:'冷战',icon:'🔫',desc:'MP5是HK公司研发的冲锋枪，被全球特种部队和执法机构广泛使用。以高精度和高可靠性著称。',specs:{口径:'9×19mm',射速:'800发/分',弹容量:'30发',有效射程:'200m',重量:'2.88kg'}},
            {id:'m1911',name:'M1911手枪',nation:'美国',category:'手枪',era:'二战',icon:'🔫',desc:'M1911是勃朗宁设计的经典手枪，服役超过70年。使用.45ACP大口径弹药，停止作用强。',specs:{口径:'11.43×23mm',射速:'半自动',弹容量:'7发',有效射程:'50m',重量:'1.1kg'}}
        ];

        let activeCategory='all',activeEra='all';
        function getFiltered(){return firearms.filter(f=>(activeCategory==='all'||f.category===activeCategory)&&(activeEra==='all'||f.era===activeEra));}
        function render(){const f=getFiltered();document.getElementById('firearmGrid').innerHTML=f.map((g,i)=>`<div class="firearm-card" style="animation-delay:${i*0.06}s"><div class="firearm-card-top">${g.icon}<span class="firearm-card-era">${g.era}</span></div><div class="firearm-card-body"><span class="firearm-card-type">${g.category}</span><div class="firearm-card-name">${g.name}</div><div class="firearm-card-nation">${g.nation}</div><div class="firearm-card-desc">${g.desc}</div><div class="firearm-spec-row">${Object.entries(g.specs).map(([k,v])=>`<span class="firearm-spec-tag">${k}: ${v}</span>`).join('')}</div></div></div>`).join('');}
        document.getElementById('categoryList').addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;document.querySelectorAll('#categoryList a').forEach(x=>x.classList.remove('active'));a.classList.add('active');activeCategory=a.dataset.category;render();});
        document.getElementById('eraList').addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;document.querySelectorAll('#eraList a').forEach(x=>x.classList.remove('active'));a.classList.add('active');activeEra=a.dataset.era;render();});

        const navbar=document.getElementById('navbar'),backToTop=document.getElementById('backToTop');window.addEventListener('scroll',()=>{const s=window.scrollY;navbar.classList.toggle('scrolled',s>50);backToTop.classList.toggle('visible',s>400);});backToTop.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
        const mobileMenuBtn=document.getElementById('mobileMenuBtn'),navLinks=document.getElementById('navLinks');mobileMenuBtn.addEventListener('click',()=>navLinks.classList.toggle('active'));navLinks.querySelectorAll('a').forEach(l=>{l.addEventListener('click',()=>navLinks.classList.remove('active'));});
        const btnThemeToggle=document.getElementById('btnThemeToggle');const saved=localStorage.getItem('museum-theme');if(saved==='light'){document.body.classList.add('light-mode');btnThemeToggle.textContent='◑';}btnThemeToggle.addEventListener('click',()=>{document.body.classList.toggle('light-mode');const isL=document.body.classList.contains('light-mode');btnThemeToggle.textContent=isL?'◑':'◐';localStorage.setItem('museum-theme',isL?'light':'dark');});

        render();
        console.log('%c🔫 枪械馆已就绪 | 共 %d 款枪械','color:#d35400;',firearms.length);
    </script>
</body>
</html>
