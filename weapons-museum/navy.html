<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海军馆 - 世界兵器博物馆</title>
    <style>
        :root {
            --bg-primary:#0d1117;--bg-secondary:#161b22;--bg-tertiary:#21262d;--bg-card:#1a1f2b;
            --text-primary:#c9d1d9;--text-secondary:#8b949e;--text-highlight:#f0f6fc;
            --accent-military:#2d5a27;--accent-green:#3a7d32;--accent-gold:#c9a84c;--accent-red:#c0392b;
            --accent-blue:#2980b9;--accent-hud:#00ff88;--accent-navy:#1e6fa0;--border-military:#2d3a2d;
            --gradient-hero:linear-gradient(180deg,#0d1117 0%,#0d2137 30%,#0d1117 100%);
            --shadow-card:0 4px 20px rgba(0,0,0,0.6);--shadow-hover:0 8px 35px rgba(30,111,160,0.25);
            --border-radius:6px;--transition-speed:0.3s;--nav-height:70px;--max-width:1400px;
        }
        body.light-mode{--bg-primary:#e8ecf1;--bg-secondary:#ffffff;--bg-tertiary:#d5dbe3;--bg-card:#f5f5f0;--text-primary:#2c3e50;--text-secondary:#5a6c7d;--text-highlight:#1a1a2e;--border-military:#c5c9b8;--gradient-hero:linear-gradient(180deg,#d5dbe3 0%,#b8c5d8 30%,#e8ecf1 100%);--shadow-card:0 4px 20px rgba(0,0,0,0.1);--shadow-hover:0 8px 35px rgba(30,111,160,0.15);}
        *{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;font-size:16px;}
        body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;background-color:var(--bg-primary);color:var(--text-primary);line-height:1.6;transition:background-color var(--transition-speed),color var(--transition-speed);overflow-x:hidden;}
        body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg,transparent,transparent 4px,rgba(30,111,160,0.008) 4px,rgba(30,111,160,0.008) 8px);pointer-events:none;z-index:0;}body>*{position:relative;z-index:1;}
        ::-webkit-scrollbar{width:10px;}::-webkit-scrollbar-track{background:var(--bg-secondary);}::-webkit-scrollbar-thumb{background:var(--accent-navy);border-radius:2px;}
        .navbar{position:fixed;top:0;left:0;width:100%;height:var(--nav-height);background:rgba(13,17,23,0.92);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);border-bottom:1px solid var(--border-military);z-index:1000;transition:all var(--transition-speed);}.navbar.scrolled{box-shadow:0 4px 25px rgba(0,0,0,0.8);}
        .navbar .container{max-width:var(--max-width);margin:0 auto;padding:0 30px;height:100%;display:flex;align-items:center;justify-content:space-between;}
        .logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text-highlight);font-size:1.4rem;font-weight:800;letter-spacing:1px;}.logo-icon{width:46px;height:46px;background:linear-gradient(135deg,#1a3a5c,#0d2137);border:2px solid var(--accent-navy);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:var(--accent-gold);font-weight:900;box-shadow:0 0 15px rgba(30,111,160,0.3);}.logo-text{background:linear-gradient(135deg,#c9a84c,#8b7a3a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-transform:uppercase;}
        .nav-links{display:flex;list-style:none;gap:2px;}.nav-links li a{display:block;padding:10px 14px;color:var(--text-secondary);text-decoration:none;border-radius:3px;transition:all var(--transition-speed);font-size:0.85rem;font-weight:500;text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap;position:relative;}.nav-links li a::before{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%) scaleX(0);width:60%;height:2px;background:var(--accent-navy);transition:transform var(--transition-speed);}.nav-links li a:hover,.nav-links li a.active{color:var(--accent-gold);background:rgba(201,168,76,0.05);}.nav-links li a:hover::before,.nav-links li a.active::before{transform:translateX(-50%) scaleX(1);}
        .nav-actions{display:flex;gap:10px;align-items:center;}.btn-icon{width:38px;height:38px;border:1px solid var(--border-military);background:rgba(30,111,160,0.1);color:var(--text-secondary);border-radius:3px;cursor:pointer;font-size:1.1rem;transition:all var(--transition-speed);display:flex;align-items:center;justify-content:center;}.btn-icon:hover{background:rgba(30,111,160,0.2);border-color:var(--accent-navy);color:var(--accent-navy);}
        .mobile-menu-btn{display:none;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;padding:5px;}.mobile-menu-btn span{display:block;width:25px;height:2px;background:var(--accent-navy);border-radius:2px;}
        .page-header{margin-top:var(--nav-height);background:linear-gradient(180deg,#0d1117 0%,#0d2137 30%,#0d1117 100%);padding:60px 0;text-align:center;border-bottom:1px solid var(--border-military);}.page-header h1{font-size:2.5rem;font-weight:900;color:var(--text-highlight);text-transform:uppercase;letter-spacing:2px;}.page-header .breadcrumb{color:var(--text-secondary);font-size:0.85rem;margin-top:8px;}.page-header .breadcrumb a{color:var(--accent-navy);text-decoration:none;}
        .main-content{padding:40px 0 80px;}.main-content .container{max-width:var(--max-width);margin:0 auto;padding:0 30px;}
        .vessel-tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:40px;}
        .vessel-tab{padding:12px 24px;background:var(--bg-card);border:1px solid var(--border-military);color:var(--text-secondary);border-radius:3px;cursor:pointer;transition:all var(--transition-speed);font-size:0.85rem;font-weight:600;text-transform:uppercase;letter-spacing:1px;}
        .vessel-tab:hover,.vessel-tab.active{background:rgba(30,111,160,0.3);border-color:var(--accent-navy);color:var(--accent-navy);}
        .vessel-list{display:flex;flex-direction:column;gap:25px;}
        .vessel-card{background:var(--bg-card);border:1px solid var(--border-military);border-radius:var(--border-radius);overflow:hidden;transition:all var(--transition-speed);cursor:pointer;display:flex;}
        .vessel-card:hover{transform:translateX(5px);border-color:var(--accent-navy);box-shadow:var(--shadow-hover);}
        .vessel-card-img{width:280px;min-width:280px;background:linear-gradient(180deg,#0d2137,#1a3a5c);display:flex;align-items:center;justify-content:center;font-size:5rem;color:var(--text-secondary);position:relative;}
        .vessel-card-type{position:absolute;top:12px;left:12px;padding:4px 10px;background:rgba(0,0,0,0.8);border:1px solid var(--accent-navy);color:var(--accent-navy);font-size:0.65rem;font-weight:700;letter-spacing:1px;border-radius:2px;}
        .vessel-card-body{padding:22px;flex:1;}
        .vessel-card-name{font-size:1.2rem;font-weight:800;color:var(--text-highlight);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
        .vessel-card-nation{font-size:0.85rem;color:var(--accent-gold);margin-bottom:10px;}
        .vessel-card-desc{font-size:0.85rem;color:var(--text-secondary);line-height:1.6;margin-bottom:12px;}
        .vessel-specs-row{display:flex;gap:15px;flex-wrap:wrap;}
        .vessel-spec-tag{padding:6px 14px;background:rgba(30,111,160,0.1);border:1px solid rgba(30,111,160,0.2);color:var(--accent-navy);border-radius:2px;font-size:0.78rem;font-weight:600;}
        .vessel-detail-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:2000;overflow-y:auto;padding:40px 20px;}
        .vessel-detail-modal.active{display:flex;align-items:flex-start;justify-content:center;}
        .vessel-detail-content{background:var(--bg-card);border:1px solid var(--border-military);border-radius:var(--border-radius);max-width:750px;width:100%;padding:30px;animation:modalSlide 0.3s ease;}
        @keyframes modalSlide{from{opacity:0;transform:translateY(-30px);}to{opacity:1;transform:translateY(0);}}
        .vessel-detail-close{float:right;width:36px;height:36px;background:rgba(255,255,255,0.05);border:1px solid var(--border-military);color:var(--text-secondary);border-radius:3px;cursor:pointer;font-size:1.2rem;transition:all var(--transition-speed);}.vessel-detail-close:hover{background:var(--accent-red);color:#fff;border-color:var(--accent-red);}
        .vessel-detail-content h2{font-size:1.5rem;color:var(--text-highlight);margin-bottom:5px;padding-right:40px;}
        .vessel-detail-content .detail-nation{color:var(--accent-gold);font-size:0.9rem;margin-bottom:15px;}
        .vessel-detail-content .detail-desc{color:var(--text-secondary);line-height:1.8;margin-bottom:20px;}
        .detail-specs-table{width:100%;border-collapse:collapse;margin-bottom:20px;}
        .detail-specs-table th,.detail-specs-table td{padding:10px 14px;text-align:left;border:1px solid var(--border-military);font-size:0.85rem;}
        .detail-specs-table th{background:rgba(30,111,160,0.2);color:var(--accent-navy);width:35%;text-transform:uppercase;letter-spacing:1px;}
        .detail-specs-table td{color:var(--text-primary);}
        .footer{background:var(--bg-secondary);border-top:1px solid var(--border-military);padding:30px;text-align:center;color:var(--text-secondary);font-size:0.8rem;}
        .back-to-top{position:fixed;bottom:30px;right:30px;width:46px;height:46px;background:rgba(30,111,160,0.3);border:1px solid var(--accent-navy);color:var(--accent-navy);border-radius:3px;cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all var(--transition-speed);z-index:999;}.back-to-top.visible{opacity:1;visibility:visible;}.back-to-top:hover{background:var(--accent-navy);border-color:var(--accent-gold);color:var(--accent-gold);}
        @keyframes fadeInUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}.vessel-card{animation:fadeInUp 0.4s ease forwards;}
        @media(max-width:768px){.nav-links{display:none;position:absolute;top:var(--nav-height);left:0;width:100%;background:rgba(13,17,23,0.98);flex-direction:column;padding:20px;backdrop-filter:blur(15px);z-index:999;border-bottom:2px solid var(--accent-military);}.nav-links.active{display:flex;}.mobile-menu-btn{display:flex;}.page-header h1{font-size:1.8rem;}.vessel-card{flex-direction:column;}.vessel-card-img{width:100%;min-width:auto;aspect-ratio:16/9;}}
    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="container">
            <a href="home.html" class="logo"><div class="logo-icon">⚔</div><span class="logo-text">兵器博物馆</span></a>
            <ul class="nav-links" id="navLinks">
                <li><a href="home.html">首页</a></li>
                <li><a href="weapons.html">兵器大全</a></li>
                <li><a href="tanks.html">坦克馆</a></li>
                <li><a href="aircraft.html">战机馆</a></li>
                <li><a href="navy.html" class="active">海军馆</a></li>
                <li><a href="timeline.html">时间轴</a></li>
                <li><a href="nations.html">国家馆</a></li>
                <li><a href="ranking.html">排行榜</a></li>
            </ul>
            <div class="nav-actions">
                <button class="btn-icon" id="btnThemeToggle" title="切换主题">◐</button>
                <button class="mobile-menu-btn" id="mobileMenuBtn"><span></span><span></span><span></span></button>
            </div>
        </div>
    </nav>

    <section class="page-header">
        <h1>🚢 海军馆</h1>
        <p class="breadcrumb"><a href="home.html">首页</a> / 海军馆</p>
    </section>

    <section class="main-content">
        <div class="container">
            <div class="vessel-tabs" id="vesselTabs">
                <button class="vessel-tab active" data-type="all">全部舰艇</button>
                <button class="vessel-tab" data-type="航空母舰">航空母舰</button>
                <button class="vessel-tab" data-type="驱逐舰">驱逐舰</button>
                <button class="vessel-tab" data-type="战列舰">战列舰</button>
                <button class="vessel-tab" data-type="潜艇">潜艇</button>
            </div>
            <div class="vessel-list" id="vesselList"></div>
        </div>
    </section>

    <div class="vessel-detail-modal" id="vesselModal"><div class="vessel-detail-content" id="vesselDetailContent"></div></div>

    <footer class="footer"><p>© 2025 世界兵器博物馆 | 舰艇数据来源公开军事资料 | 仅供学习使用</p></footer>
    <button class="back-to-top" id="backToTop" title="返回顶部">▲</button>

    <script>
        const vessels = [
            {id:'ford',name:'福特号航空母舰',nation:'美国',type:'航空母舰',era:'现代',icon:'🚢',desc:'福特号是美军最新一代超级航母，采用电磁弹射系统和新一代核反应堆。满载排水量超过10万吨，可搭载75架以上各型舰载机，是世界上最先进的航空母舰。',specs:{舰长:'337m',排水量:'100000吨',舰载机:'75+架',动力:'A1B核反应堆×2',乘员:'4539人',服役:'2017年'}},
            {id:'nimitz',name:'尼米兹号航空母舰',nation:'美国',type:'航空母舰',era:'现代',icon:'🚢',desc:'尼米兹级核动力航母是美国海军的主力航母，共建造10艘。服役超过40年，参与了多次重大军事行动。',specs:{舰长:'332.8m',排水量:'102000吨',舰载机:'90架',动力:'A4W核反应堆×2',乘员:'5680人',服役:'1975年'}},
            {id:'type055',name:'055型驱逐舰',nation:'中国',type:'驱逐舰',era:'现代',icon:'⚓',desc:'055型是中国最新一代万吨级驱逐舰，配备112单元通用垂直发射系统和双波段相控阵雷达。综合作战能力居世界前列。',specs:{舰长:'180m',排水量:'13000吨',武器:'112单元VLS',动力:'燃气轮机×4',乘员:'310人',服役:'2020年'}},
            {id:'arleigh',name:'阿利·伯克级驱逐舰',nation:'美国',type:'驱逐舰',era:'现代',icon:'⚓',desc:'阿利伯克级是全球建造数量最多的宙斯盾驱逐舰，装备96单元MK41垂直发射系统。Flight III型配备新型SPY-6雷达。',specs:{舰长:'155m',排水量:'9500吨',武器:'96单元VLS',动力:'燃气轮机×4',乘员:'323人',服役:'1991年'}},
            {id:'yamato',name:'大和号战列舰',nation:'日本',type:'战列舰',era:'二战',icon:'🗿',desc:'大和号是人类历史上建造的最大战列舰，装备9门460mm主炮。满载排水量超过7万吨。1945年在冲绳战役中被美军击沉。',specs:{舰长:'263m',排水量:'72800吨',主炮:'460mm×9门',动力:'蒸汽轮机×4',乘员:'2767人',服役:'1941年'}},
            {id:'bismarck',name:'俾斯麦号战列舰',nation:'德国',type:'战列舰',era:'二战',icon:'🦅',desc:'俾斯麦号是德国海军在二战期间最强大的战列舰。1941年5月在大西洋海战中击沉胡德号战列巡洋舰后被英军围攻击沉。',specs:{舰长:'251m',排水量:'50900吨',主炮:'380mm×8门',动力:'蒸汽轮机×3',乘员:'2092人',服役:'1940年'}},
            {id:'virginia',name:'弗吉尼亚级核潜艇',nation:'美国',type:'潜艇',era:'现代',icon:'🐋',desc:'弗吉尼亚级是美军现役最先进的攻击型核潜艇，配备战斧巡航导弹和先进声呐系统。具备出色的近海作战和特种作战支援能力。',specs:{舰长:'115m',排水量:'7800吨',武器:'战斧导弹+鱼雷',动力:'S9G核反应堆',乘员:'135人',服役:'2004年'}},
            {id:'kuznetsov',name:'库兹涅佐夫号',nation:'俄罗斯',type:'航空母舰',era:'现代',icon:'🚢',desc:'库兹涅佐夫号是俄罗斯海军唯一的航空母舰，采用滑跃起飞方式。可搭载苏-33和米格-29K舰载战斗机。',specs:{舰长:'305m',排水量:'58600吨',舰载机:'30架',动力:'蒸汽轮机×4',乘员:'1980人',服役:'1990年'}}
        ];

        let activeVesselType='all';
        function getFiltered(){return activeVesselType==='all'?vessels:vessels.filter(v=>v.type===activeVesselType);}
        function renderVessels(){const f=getFiltered();document.getElementById('vesselList').innerHTML=f.map((v,i)=>`<div class="vessel-card" style="animation-delay:${i*0.06}s" data-id="${v.id}"><div class="vessel-card-img">${v.icon}<span class="vessel-card-type">${v.type}</span></div><div class="vessel-card-body"><div class="vessel-card-name">${v.name}</div><div class="vessel-card-nation">${v.nation} | ${v.era}</div><div class="vessel-card-desc">${v.desc}</div><div class="vessel-specs-row">${Object.entries(v.specs).slice(0,4).map(([k,val])=>`<span class="vessel-spec-tag">${k}: ${val}</span>`).join('')}</div></div></div>`).join('');
            document.querySelectorAll('.vessel-card').forEach(card=>{card.addEventListener('click',()=>openDetail(card.dataset.id));});}
        function openDetail(id){const v=vessels.find(x=>x.id===id);if(!v)return;document.getElementById('vesselDetailContent').innerHTML=`<button class="vessel-detail-close" onclick="closeDetail()">✕</button><div style="font-size:4rem;text-align:center;margin-bottom:15px;">${v.icon}</div><h2>${v.name}</h2><div class="detail-nation">${v.nation} | ${v.type} | ${v.era}</div><div class="detail-desc">${v.desc}</div><table class="detail-specs-table">${Object.entries(v.specs).map(([k,val])=>`<tr><th>${k}</th><td>${val}</td></tr>`).join('')}</table>`;document.getElementById('vesselModal').classList.add('active');document.body.style.overflow='hidden';}
        function closeDetail(){document.getElementById('vesselModal').classList.remove('active');document.body.style.overflow='';}
        document.getElementById('vesselModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeDetail();});
        document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail();});
        document.getElementById('vesselTabs').addEventListener('click',e=>{const b=e.target.closest('.vessel-tab');if(!b)return;document.querySelectorAll('.vessel-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeVesselType=b.dataset.type;renderVessels();});

        const navbar=document.getElementById('navbar'),backToTop=document.getElementById('backToTop');window.addEventListener('scroll',()=>{const s=window.scrollY;navbar.classList.toggle('scrolled',s>50);backToTop.classList.toggle('visible',s>400);});backToTop.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
        const mobileMenuBtn=document.getElementById('mobileMenuBtn'),navLinks=document.getElementById('navLinks');mobileMenuBtn.addEventListener('click',()=>navLinks.classList.toggle('active'));navLinks.querySelectorAll('a').forEach(l=>{l.addEventListener('click',()=>navLinks.classList.remove('active'));});
        const btnThemeToggle=document.getElementById('btnThemeToggle');const saved=localStorage.getItem('museum-theme');if(saved==='light'){document.body.classList.add('light-mode');btnThemeToggle.textContent='◑';}btnThemeToggle.addEventListener('click',()=>{document.body.classList.toggle('light-mode');const isL=document.body.classList.contains('light-mode');btnThemeToggle.textContent=isL?'◑':'◐';localStorage.setItem('museum-theme',isL?'light':'dark');});

        renderVessels();
        console.log('%c🚢 海军馆已就绪 | 共 %d 艘舰艇','color:#1e6fa0;',vessels.length);
    </script>
</body>
</html>
