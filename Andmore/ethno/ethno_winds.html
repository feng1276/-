<head>

    <style>
        :root {
            --wood-dark:#3e2723;--wood-mahogany:#5d3a2c;--wood-oak:#8b6914;--wood-maple:#c4956a;--wood-birch:#deb887;--wood-pale:#f5e6d3;--wood-cream:#faf3e8;
            --gold-brass:#c9a84c;--text-primary:#2c1810;--text-secondary:#4a3025;--text-muted:#7a6050;
            --bg-body:#fdf8f3;--bg-card:#fffdf9;--border-wood:#d4c4a8;
            --shadow-xs:0 1px 3px rgba(62,39,35,0.04);--shadow-sm:0 2px 8px rgba(62,39,35,0.06);--shadow-md:0 8px 30px rgba(62,39,35,0.10);--shadow-hover:0 12px 35px rgba(62,39,35,0.15);
            --radius-sm:6px;--radius-md:10px;--radius-lg:16px;--radius-xl:24px;--radius-full:50px;
            --transition-fast:0.2s ease;--transition-smooth:0.35s cubic-bezier(0.4,0,0.2,1);
            --font-heading:'Georgia','Noto Serif SC','Songti SC',serif;--font-body:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;--font-mono:'SF Mono','Consolas',monospace;
        }
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:var(--font-body);background:var(--bg-body);color:var(--text-primary);min-height:100vh;padding-bottom:3rem;line-height:1.6;}
        .navbar{position:sticky;top:0;z-index:100;background:rgba(255,253,249,0.94);backdrop-filter:blur(16px);border-bottom:2px solid var(--border-wood);padding:0.7rem 2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;}
        .logo{display:flex;align-items:center;gap:0.5rem;cursor:pointer;text-decoration:none;}
        .logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--wood-maple),var(--wood-mahogany));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.2rem;}
        .logo-text{font-family:var(--font-heading);font-size:1.2rem;font-weight:700;color:var(--wood-dark);}
        .nav-links{display:flex;gap:1.2rem;list-style:none;flex-wrap:wrap;}
        .nav-links a{color:var(--text-secondary);text-decoration:none;font-weight:500;font-size:0.85rem;transition:color var(--transition-fast);border-bottom:2px solid transparent;}
        .nav-links a:hover{color:var(--wood-oak);border-bottom-color:var(--wood-maple);}
        .nav-links a.active{color:var(--wood-mahogany);font-weight:600;border-bottom-color:var(--wood-oak);}
        .page-header{text-align:center;padding:2rem 1rem 1rem;}
        .page-header h1{font-family:var(--font-heading);font-size:2.3rem;color:var(--wood-dark);}
        .container{max-width:1100px;margin:0 auto;padding:0 1.5rem;}
        .intro-card{background:var(--bg-card);border:1px solid var(--border-wood);border-radius:var(--radius-lg);padding:2rem;margin-bottom:2rem;box-shadow:var(--shadow-sm);}
        .intro-card p{color:var(--text-secondary);line-height:1.9;font-size:0.95rem;text-indent:2em;}
        .winds-list{display:flex;flex-direction:column;gap:2rem;}
        .wind-item{background:var(--bg-card);border:1px solid var(--border-wood);border-radius:var(--radius-xl);padding:2.2rem;box-shadow:var(--shadow-xs);transition:all var(--transition-smooth);}
        .wind-item:hover{box-shadow:var(--shadow-hover);}
        .wind-item h3{font-family:var(--font-heading);font-size:1.4rem;color:var(--wood-dark);}
        .wind-item .meta{font-size:0.85rem;color:var(--wood-oak);font-weight:600;margin:0.3rem 0;}
        .wind-item .info-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:1rem 0;}
        .wind-item .info-cell{font-size:0.85rem;}
        .wind-item .info-cell .lbl{font-weight:700;color:var(--text-muted);font-size:0.7rem;text-transform:uppercase;letter-spacing:0.5px;}
        .wind-item .info-cell .val{color:var(--text-secondary);margin-top:0.1rem;}
        .wind-item p{color:var(--text-secondary);line-height:1.8;font-size:0.9rem;margin:0.4rem 0;}
        .wind-item .culture-box{background:rgba(201,168,76,0.06);border-left:3px solid var(--gold-brass);padding:0.8rem 1.2rem;margin:0.8rem 0;border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-size:0.88rem;color:var(--text-secondary);}
        @media(max-width:768px){.wind-item .info-row{grid-template-columns:1fr;}}
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <a href="ethno_home.html" class="logo"><span class="logo-icon">🎵</span><span class="logo-text">EthnoSound</span></a>
        <ul class="nav-links">
            <li><a href="ethno_home.html">首页</a></li>
            <li><a href="ethno_strings.html">弦鸣乐器</a></li>

        </ul>

    <div class="page-header">
        <h1>🎷 气鸣乐器</h1>
        <p style="color:var(--text-muted);">Aerophones · 通过空气振动发声的乐器</p>
    </div>

    <div class="container">
        <div class="intro-card">
            <p>气鸣乐器（Aerophones）通过振动空气柱产生声音，是人类最古老的乐器类型之一。考古发现表明，距今约4万年前的旧石器时代晚期就已出现骨笛。气鸣乐器种类繁多，包括边棱音管乐器（笛子、尺八）、簧鸣乐器（萨克斯、单簧管）、自由簧乐器（口琴、笙）和唇鸣乐器（号角、迪吉里杜管）等。不同文化中的管乐器展现了人类对空气动力学的深刻理解，每一种管乐器都是声学原理与艺术表达的完美结合。</p>
        </div>

        <div class="winds-list" id="windsList"></div>
    </div>

    <script>
        const windInstruments=[
            {name:'迪吉里杜管',origin:'澳大利亚',era:'至少1500年前',type:'唇鸣乐器',
                material:'白蚁蛀空的桉树枝、蜂蜡吹嘴',range:'单一基音+泛音',technique:'循环呼吸法',
                desc:'迪吉里杜管是澳大利亚原住民最古老的管乐器，由白蚁自然蛀空的桉树枝干制成。演奏者通过振动嘴唇发出持续的嗡嗡声（基音），同时运用循环呼吸法（用鼻子吸气、口中储存的空气继续吹奏）实现连续不断的演奏。迪吉里杜管的音色低沉而富有共鸣，配合人声模仿动物叫声和自然声音。',
                culture:'迪吉里杜管在原住民文化中是神圣的仪式乐器，用于"梦幻时代"的创世故事讲述和治愈仪式。传统上仅限男性演奏。近年来迪吉里杜管在全球范围流行，成为澳大利亚文化的象征。',
                construction:'制作迪吉里杜管首先需要找到被白蚁自然蛀空的桉树（通常是小叶桉或血木桉）。制作者将树枝砍下，清除内部残留物，打磨吹嘴端，用蜂蜡塑造舒适的吹嘴。管长从1米到2.5米不等，越长音高越低。'},
            {name:'尺八',origin:'日本(源自中国)',era:'唐代传入日本(7-8世纪)',type:'边棱音管乐器',
                material:'真竹(桂竹)根部、漆涂内壁',range:'约2.5个八度',technique:'沉浮技法、气声控制',
                desc:'尺八是日本传统竹制竖吹管乐器，因长一尺八寸（约54.5厘米）而得名。尺八的声音极富表现力，从空灵的泛音到气声丰富的低音都能完美呈现。尺八演奏者通过头部角度微调（"沉浮"）和指法变化来产生丰富的音色变化。尺八的音阶基于五声音阶，但通过沉浮技法可以产生微分音。',
                culture:'尺八在江户时代成为虚无僧（禅宗普化宗僧侣）修行的法器，他们吹奏尺八作为冥想实践（"吹禅"）。经典曲目《鹤之巢笼》通过尺八模仿鹤的叫声和飞行姿态，展现了乐器与自然的深刻联系。20世纪以来尺八在现代音乐和世界音乐中广泛应用。',
                construction:'传统尺八选用竹龄5-7年的真竹根部制作，竹节和根部的天然形态被巧妙保留。内壁涂以"地"（漆和石粉混合物），经过精密调音。吹口为外斜切式。现代尺八也使用木材或合成材料制作。'},
            {name:'苏格兰风笛',origin:'苏格兰',era:'中世纪(约13世纪)',type:'簧鸣乐器',
                material:'黑檀木管身、皮革气囊、藤条簧片',range:'约2个八度',technique:'持续低音+旋律管',
                desc:'苏格兰高地风笛是苏格兰文化最著名的象征之一。风笛由皮革气囊、吹管、旋律管(Chanter)和三根持续低音管(Drones)组成。演奏者通过吹管向气囊充气，手臂挤压气囊维持恒定的气压。旋律管上演奏旋律，三根低音管始终发出固定的低音，形成独特的和声效果。',
                culture:'风笛在苏格兰历史中扮演重要角色，曾在战场上鼓舞士气。如今风笛是苏格兰婚礼、葬礼和庆典不可或缺的音乐。每年世界风笛锦标赛在格拉斯哥举行。风笛曲目包括进行曲、哀歌(piobaireachd)等。',
                construction:'传统风笛使用非洲黑木制作管身，装饰以银质或象牙配件。皮革气囊通常由羊皮或牛皮制成。旋律管簧片为双簧片，低音管为单簧片。制作一套风笛需要高超的手工艺技能。'},
            {name:'排箫',origin:'全球多地独立起源',era:'公元前2000年以上',type:'边棱音管乐器',
                material:'竹子、芦苇、木材',range:'根据管数而定',technique:'移动吹奏不同管',
                desc:'排箫是最古老的乐器之一，由一系列长度递增的闭管排列而成。演奏者将嘴唇对准管口吹气产生声音。排箫在安第斯山脉(称为Zampoña或Siku)、罗马尼亚(称为Nai)和中国(称为排箫)等地独立发展。安第斯排箫通常由两人合奏，一人吹奏奇数管，另一人吹奏偶数管。',
                culture:'排箫在安第斯文化中是重要的传统乐器，用于丰收庆典和宗教仪式。罗马尼亚排箫大师Gheorghe Zamfir将排箫艺术推向世界舞台。中国排箫在《诗经》中已有记载。',
                construction:'排箫的管子按长度排列，管长决定音高。安第斯排箫通常用竹子制作，每根管子的底部用天然节点封闭。管子用绳索或布带绑扎。'},
            {name:'萨克斯',origin:'比利时',era:'1840年',type:'单簧乐器',
                material:'黄铜管体、藤片或合成簧片',range:'约2.5个八度',technique:'指法+气息控制',
                desc:'萨克斯由比利时乐器制作家阿道夫·萨克斯于1840年发明，是唯一由单个人设计并成功推广的现代管乐器。萨克斯结合了铜管乐器的金属共鸣体和木管乐器的簧片发声原理。萨克斯家族包括高音萨克斯、中音萨克斯、次中音萨克斯和上低音萨克斯等。',
                culture:'萨克斯在爵士乐中扮演核心角色，查理·帕克、约翰·柯川等大师将其表现力发挥到极致。萨克斯也广泛用于古典音乐、流行音乐和军乐队。',
                construction:'萨克斯的管体为圆锥形，逐渐变宽，末端为向上翻的喇叭口。按键系统基于波姆体系。簧片由藤条制成，固定在吹嘴上。'},
            {name:'笙',origin:'中国',era:'商周时期(约3000年前)',type:'自由簧乐器',
                material:'竹管、铜簧片、木制笙斗',range:'约2个八度',technique:'和声吹奏',
                desc:'笙是中国最古老的簧管乐器，也是世界上最早使用自由簧的乐器。笙由多根竹管插入一个共鸣斗中组成，每根竹管底部装有铜制簧片。演奏者通过吹气或吸气使簧片振动发声。笙能同时发出多个音，演奏和声。',
                culture:'笙在周代宫廷雅乐中占有重要地位。《诗经》中就有"吹笙鼓簧"的记载。笙流传至日本成为"笙"(Shō)，至朝鲜成为"笙簧"(Saenghwang)。笙是现代口琴和手风琴的鼻祖。',
                construction:'传统笙有17根竹管，现代改革笙扩展到36簧。笙斗由硬木或金属制成。簧片为铜合金，通过精密调音。笙的独特之处在于吹吸皆可发声。'},
        ];

        document.getElementById('windsList').innerHTML=windInstruments.map((w,i)=>`
        <div class="wind-item" style="animation:fadeIn 0.5s ease ${i*0.05}s both;">
          <h3>${w.name}</h3>
          <div class="meta">📍 ${w.origin} · 🕐 ${w.era} · 🏷️ ${w.type}</div>
          <div class="info-row">
            <div class="info-cell"><span class="lbl">制作材料</span><div class="val">${w.material}</div></div>
            <div class="info-cell"><span class="lbl">音域</span><div class="val">${w.range}</div></div>
            <div class="info-cell"><span class="lbl">演奏技法</span><div class="val">${w.technique}</div></div>
          </div>
          <p><strong>📖 乐器概述：</strong>${w.desc}</p>
          <p><strong>🔨 制作工艺：</strong>${w.construction}</p>
          <div class="culture-box">🎼 <strong>文化意义：</strong>${w.culture}</div>
        </div>`).join('');
        const st=document.createElement('style');st.textContent='@keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}';document.head.appendChild(st);
    </script>
</body>
</html>
