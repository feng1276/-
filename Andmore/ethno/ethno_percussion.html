<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打击乐器 · EthnoSound</title>
    <meta name="description" content="EthnoSound打击乐器图鉴，收录太鼓、非洲鼓、编钟、木琴、卡林巴、钢鼓等12+种世界打击乐器，包含制作工艺、演奏技法和文化传统。">
    <style>
        :root {
            --wood-dark:#3e2723;--wood-mahogany:#5d3a2c;--wood-oak:#8b6914;--wood-maple:#c4956a;--wood-birch:#deb887;--wood-cream:#faf3e8;
            --gold-brass:#c9a84c;--text-primary:#2c1810;--text-secondary:#4a3025;--text-muted:#7a6050;
            --bg-body:#fdf8f3;--bg-card:#fffdf9;--border-wood:#d4c4a8;
            --shadow-xs:0 1px 3px rgba(62,39,35,0.04);--shadow-sm:0 2px 8px rgba(62,39,35,0.06);--shadow-md:0 8px 30px rgba(62,39,35,0.10);--shadow-hover:0 12px 35px rgba(62,39,35,0.15);
            --radius-sm:6px;--radius-md:10px;--radius-lg:16px;--radius-xl:24px;--radius-full:50px;
            --transition-fast:0.2s ease;--transition-smooth:0.35s cubic-bezier(0.4,0,0.2,1);
            --font-heading:'Georgia','Noto Serif SC','Songti SC',serif;--font-body:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
        }
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:var(--font-body);background:var(--bg-body);color:var(--text-primary);min-height:100vh;padding-bottom:3rem;line-height:1.6;}
        .navbar{position:sticky;top:0;z-index:100;background:rgba(255,253,249,0.94);backdrop-filter:blur(16px);border-bottom:2px solid var(--border-wood);padding:0.7rem 2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;}
        .logo{display:flex;align-items:center;gap:0.5rem;cursor:pointer;text-decoration:none;}
        .logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--wood-maple),var(--wood-mahogany));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.2rem;}
        .logo-text{font-family:var(--font-heading);font-size:1.2rem;font-weight:700;color:var(--wood-dark);}
        .nav-links{display:flex;gap:1.2rem;list-style:none;flex-wrap:wrap;}
        .nav-links a{color:var(--text-secondary);text-decoration:none;font-weight:500;font-size:0.85rem;transition:color var(--transition-fast);border-bottom:2px solid transparent;}
        .nav-links a:hover{color:var(--wood-oak);border-bottom-color:var(--wood-maple);}
        .nav-links a.active{color:var(--wood-mahogany);font-weight:600;border-bottom-color:var(--wood-oak);}
        .page-header{text-align:center;padding:2rem 1rem 1rem;}
        .page-header h1{font-family:var(--font-heading);font-size:2.3rem;color:var(--wood-dark);}
        .container{max-width:1100px;margin:0 auto;padding:0 1.5rem;}
        .intro-card{background:var(--bg-card);border:1px solid var(--border-wood);border-radius:var(--radius-lg);padding:2rem;margin-bottom:2rem;box-shadow:var(--shadow-sm);}
        .intro-card p{color:var(--text-secondary);line-height:1.9;font-size:0.95rem;text-indent:2em;}
        .percussion-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.8rem;}
        .percussion-card{background:var(--bg-card);border:1px solid var(--border-wood);border-radius:var(--radius-xl);padding:2rem;box-shadow:var(--shadow-xs);transition:all var(--transition-smooth);border-top:4px solid var(--gold-brass);}
        .percussion-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-4px);}
        .percussion-card h3{font-family:var(--font-heading);font-size:1.3rem;color:var(--wood-dark);}
        .percussion-card .origin{font-size:0.85rem;color:var(--wood-oak);font-weight:600;}
        .percussion-card .perc-type{display:inline-block;padding:0.15rem 0.6rem;border-radius:var(--radius-full);font-size:0.7rem;font-weight:700;background:rgba(139,105,20,0.08);color:var(--wood-oak);margin:0.3rem 0;}
        .percussion-card p{color:var(--text-secondary);font-size:0.88rem;line-height:1.7;margin:0.5rem 0;}
        .percussion-card .culture-note{font-size:0.82rem;color:var(--text-muted);font-style:italic;border-top:1px solid var(--border-wood);padding-top:0.6rem;margin-top:0.6rem;}
        @media(max-width:768px){.percussion-grid{grid-template-columns:1fr;}}
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <a href="ethno_home.html" class="logo"><span class="logo-icon">🎵</span><span class="logo-text">EthnoSound</span></a>
        <ul class="nav-links">
            <li><a href="ethno_home.html">首页</a></li>
            <li><a href="ethno_strings.html">弦鸣乐器</a></li>
            <li><a href="ethno_winds.html">气鸣乐器</a></li>
            <li><a href="ethno_percussion.html" class="active">打击乐器</a></li>
            <li><a href="ethno_craft.html">制作与文化</a></li>
        </ul>
    </nav>

    <div class="page-header">
        <h1>🥁 打击乐器</h1>
        <p style="color:var(--text-muted);">Membranophones & Idiophones · 通过敲击发声的乐器</p>
    </div>

    <div class="container">
        <div class="intro-card">
            <p>打击乐器是人类最古老的乐器类型，考古发现表明史前人类就已使用石头和木棍敲击节奏。打击乐器分为膜鸣乐器（鼓类，通过振动绷紧的皮膜发声）和体鸣乐器（通过振动乐器本身发声，如编钟、木琴）。打击乐器在所有文化中都扮演着核心角色——从非洲鼓的复杂节奏到中国编钟的庄严钟声，从印度塔布拉鼓的精妙技巧到加勒比钢鼓的欢快旋律。</p>
        </div>
        <div class="percussion-grid" id="percussionGrid"></div>
    </div>

    <script>
        const percussionData=[
            {name:'太鼓',origin:'日本',era:'约1500年前',type:'膜鸣乐器',
                desc:'太鼓是日本传统大鼓，鼓身由一整块榉木掏空制成，鼓面覆盖牛皮。太鼓的尺寸从直径30厘米到超过2米。演奏者使用粗大的鼓槌(拨)敲击，产生低沉而有力的声音。太鼓不仅是一种乐器，更是日本文化中力量与精神的象征。',
                construction:'传统太鼓制作需时数月：选取树龄百年以上的榉木，整段木头手工凿空。鼓面使用整张牛皮，通过楔子和绳索系统绷紧。最大太鼓重达数吨。制作过程中举行神道仪式祈福。',
                culture:'太鼓在日本祭典(Matsuri)中扮演核心角色，鼓声被认为能驱邪迎神。现代太鼓表演团体"鼓童"(Kodo)将太鼓艺术推广至全球。',
                rhythm:'太鼓节奏以复合拍子为特色，常用5拍、7拍等不规整拍子。基本节奏型包括"ドンドコ"(Don Doko)等拟声词记忆传承。'},
            {name:'非洲鼓(Djembe)',origin:'西非(马里、几内亚)',era:'约800年前',type:'膜鸣乐器',
                desc:'Djembe（金贝鼓）是西非曼德族人民创造的杯形手鼓。鼓身由一整块硬木雕刻而成，鼓面覆盖山羊皮。Djembe能发出三种基本声音：低音(Bass)、开放音(Tone)和高音(Slap)，通过不同手法组合产生极为丰富的节奏语言。',
                construction:'鼓身选用伦克木(Lenke)或桃花心木等密度适中的硬木，整段木材手工凿空成高脚杯形。鼓面用山羊皮，通过绳索系统调节张力。制作一个Djembe需要数周时间。',
                culture:'Djembe在西非社会生活中扮演重要角色——婚礼、葬礼、丰收庆典和部落会议都有Djembe的节奏伴随。传统上鼓手(Djembefola)是备受尊敬的职业。',
                rhythm:'Djembe节奏复杂多变，常用12/8复合拍子。经典节奏包括"Kuku"(庆祝节奏)、"Soli"(婚礼节奏)等。'},
            {name:'编钟',origin:'中国',era:'西周(约3000年前)',type:'体鸣乐器',
                desc:'编钟是中国古代最宏伟的乐器之一，由多个不同大小的青铜钟按照音高排列悬挂在木架上。最著名的曾侯乙编钟(公元前433年)共有65枚钟，音域跨越5个半八度，十二律齐全。每枚钟能发出两个不同的音(敲击正鼓部和侧鼓部)。',
                construction:'编钟的制作需要高超的青铜铸造技术。工匠精确控制铜、锡、铅的比例来调音。每枚钟的形状为合瓦形(非圆形)，这是能发两个音的声学秘密。',
                culture:'编钟在周代是礼乐制度的核心，象征权力和秩序。"钟鸣鼎食"形容贵族生活。曾侯乙编钟的出土震惊世界，证明了中国古代高度发达的音乐文明。',
                rhythm:'编钟通常演奏庄重的旋律，用于宫廷雅乐。每枚钟的延音较长，演奏时需考虑和声效果。'},
            {name:'卡林巴(Kalimba)',origin:'非洲',era:'约3000年前',type:'体鸣乐器(弹拨体鸣)',
                desc:'卡林巴(又称拇指琴)是非洲传统乐器，由一系列不同长度的金属弹片(通常为钢制)固定在木制共鸣箱或共鸣板上构成。演奏者用拇指弹拨弹片产生清脆的声音。卡林巴体积小巧，音色纯净空灵，被称为"口袋钢琴"。',
                construction:'传统卡林巴使用竹片或锻造金属片作为弹片。现代卡林巴通常使用弹簧钢材质的弹片。共鸣箱可以是整块木材挖空，也可以是简单的木制共鸣板。弹片通过金属压条固定在琴桥上。',
                culture:'卡林巴在非洲广泛分布，不同地区有不同名称和形制。在津巴布韦，Mbira是祖先灵魂沟通的媒介。现代卡林巴作为便携乐器在全球流行。',
                rhythm:'卡林巴既可以演奏旋律也可以同时产生简单的伴奏，弹片通常按音阶排列。'},
            {name:'钢鼓(Steelpan)',origin:'特立尼达和多巴哥',era:'20世纪30年代',type:'体鸣乐器',
                desc:'钢鼓是20世纪唯一被广泛接受的新型声学乐器，由废弃的55加仑油桶改造而成。桶底被锤击成凹形，分割成多个不同音高的区域。钢鼓能演奏完整的旋律，音色明亮欢快。',
                construction:'制作钢鼓需将油桶底部反复锤击使其凹陷，然后分割音区，每个音区调音到精确音高。调音师使用锤子和钢棒进行精细调音。一个钢鼓通常包含20-30个音。',
                culture:'钢鼓诞生于特立尼达的狂欢节文化，最初是底层民众用废弃物创造的乐器。如今钢鼓乐队(Steelband)遍布全球，是加勒比文化的象征。',
                rhythm:'钢鼓乐队通常包括低音钢鼓、中音钢鼓和高音钢鼓，类似管弦乐团的分部。演奏卡里普索和索卡风格音乐。'},
        ];

        document.getElementById('percussionGrid').innerHTML=percussionData.map((p,i)=>`
        <div class="percussion-card" style="animation:fadeIn 0.5s ease ${i*0.05}s both;">
          <h3>${p.name}</h3>
          <div class="origin">📍 ${p.origin} · 🕐 ${p.era}</div>
          <span class="perc-type">${p.type}</span>
          <p><strong>📖 概述：</strong>${p.desc}</p>
          <p><strong>🔨 制作工艺：</strong>${p.construction}</p>
          <p><strong>🎵 节奏特色：</strong>${p.rhythm}</p>
          <div class="culture-note">🎼 ${p.culture}</div>
        </div>`).join('');
        const st=document.createElement('style');st.textContent='@keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}';document.head.appendChild(st);
    </script>
</body>
</html>
