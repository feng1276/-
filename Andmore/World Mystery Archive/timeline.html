<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时间线 · 未解之谜档案馆</title>
    <style>
        :root {
            --bg-void: #0a0a0f;
            --bg-card: rgba(18, 18, 26, 0.85);
            --glass-bg: rgba(10, 10, 20, 0.7);
            --glass-border: rgba(180, 40, 40, 0.18);
            --accent-crimson: #c0392b;
            --accent-warning: #e74c3c;
            --accent-amber: #d4a017;
            --accent-glow: rgba(220, 50, 50, 0.5);
            --accent-neon: #ff3030;
            --text-primary: #e0d8d0;
            --text-secondary: #a09890;
            --text-muted: #6a6258;
            --border-radius-xl: 1.5rem;
            --font-body: 'Crimson Text', 'Georgia', serif;
            --font-heading: 'Cinzel', 'Georgia', serif;
            --font-mono: 'Courier Prime', 'Courier New', monospace;
            /* Category colors */
            --cat-ufo: #4fc3f7;
            --cat-ufo-bg: rgba(79, 195, 247, 0.12);
            --cat-ufo-border: rgba(79, 195, 247, 0.3);
            --cat-ufo-glow: rgba(79, 195, 247, 0.4);
            --cat-missing: #ffb74d;
            --cat-missing-bg: rgba(255, 183, 77, 0.12);
            --cat-missing-border: rgba(255, 183, 77, 0.3);
            --cat-missing-glow: rgba(255, 183, 77, 0.4);
            --cat-supernatural: #ce93d8;
            --cat-supernatural-bg: rgba(206, 147, 216, 0.12);
            --cat-supernatural-border: rgba(206, 147, 216, 0.3);
            --cat-supernatural-glow: rgba(206, 147, 216, 0.4);
            --cat-historical: #ef5350;
            --cat-historical-bg: rgba(239, 83, 80, 0.12);
            --cat-historical-border: rgba(239, 83, 80, 0.3);
            --cat-historical-glow: rgba(239, 83, 80, 0.4);
            --cat-cryptid: #81c784;
            --cat-cryptid-bg: rgba(129, 199, 132, 0.12);
            --cat-cryptid-border: rgba(129, 199, 132, 0.3);
            --cat-cryptid-glow: rgba(129, 199, 132, 0.4);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: var(--font-body);
            background: var(--bg-void);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 4rem;
        }
        /* ========== NAVIGATION ========== */
        .navbar {
            position: sticky;
            top: 10px;
            margin: 10px 20px;
            padding: 0.7rem 1.8rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 3rem;
            z-index: 100;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .logo {
            font-family: var(--font-heading);
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .logo span {
            color: var(--accent-warning);
        }
        .nav-links {
            display: flex;
            gap: 1rem;
            list-style: none;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: 0.2s;
        }
        .nav-links a:hover,
        .nav-links a.active {
            color: var(--accent-warning);
        }
        /* ========== HEADER ========== */
        .page-header {
            text-align: center;
            padding: 3rem 1rem 1.5rem;
        }
        .page-header h1 {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }
        /* ========== STATS BAR ========== */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }
        .stats-bar .stat-mini {
            background: var(--bg-card);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 1rem;
            padding: 0.8rem;
            text-align: center;
        }
        .stat-mini .sm-value {
            font-family: var(--font-heading);
            font-size: 1.4rem;
            color: var(--accent-warning);
            letter-spacing: 1px;
        }
        .stat-mini .sm-label {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 0.2rem;
        }
        /* ========== ERA FILTER BAR ========== */
        .era-filter-bar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.2rem;
        }
        .era-filter-btn {
            padding: 0.4rem 1.1rem;
            border-radius: 2rem;
            background: rgba(220, 50, 50, 0.06);
            border: 1px solid rgba(220, 50, 50, 0.2);
            color: var(--text-secondary);
            cursor: pointer;
            font-family: var(--font-body);
            font-size: 0.72rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .era-filter-btn:hover,
        .era-filter-btn.active {
            background: rgba(220, 50, 50, 0.2);
            color: var(--accent-warning);
            border-color: var(--accent-warning);
            box-shadow: 0 0 15px rgba(220, 50, 50, 0.25);
        }
        .era-filter-btn .era-count {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            opacity: 0.7;
            margin-left: 0.3rem;
        }
        /* ========== JUMP TO ERA ========== */
        .jump-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            justify-content: center;
            margin-bottom: 1.5rem;
        }
        .jump-nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-family: var(--font-mono);
            font-size: 0.65rem;
            letter-spacing: 1px;
            padding: 0.2rem 0.6rem;
            border-radius: 1rem;
            transition: 0.2s;
            border: 1px solid transparent;
        }
        .jump-nav a:hover {
            color: var(--accent-warning);
            border-color: rgba(220, 50, 50, 0.3);
            background: rgba(220, 50, 50, 0.08);
        }
        /* ========== SPACING TOGGLE ========== */
        .view-controls {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 1rem;
        }
        .view-controls span {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }
        .spacing-toggle {
            display: flex;
            border-radius: 2rem;
            overflow: hidden;
            border: 1px solid rgba(220, 50, 50, 0.25);
        }
        .spacing-toggle button {
            padding: 0.3rem 0.9rem;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-family: var(--font-mono);
            font-size: 0.65rem;
            letter-spacing: 1px;
            transition: 0.2s;
        }
        .spacing-toggle button.active {
            background: rgba(220, 50, 50, 0.2);
            color: var(--accent-warning);
        }
        /* ========== TIMELINE MAIN ========== */
        .timeline-vertical-main {
            position: relative;
            padding-left: 3.5rem;
        }
        .timeline-vertical-main::before {
            content: '';
            position: absolute;
            left: 1.5rem;
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(180deg, var(--accent-crimson), var(--accent-amber), var(--accent-crimson), var(--accent-amber), var(--accent-crimson));
            border-radius: 2px;
        }
        /* Era section dividers */
        .era-divider {
            position: relative;
            margin: 3rem 0 1.5rem;
            padding-left: 2rem;
        }
        .era-divider .era-label {
            font-family: var(--font-heading);
            font-size: 1.4rem;
            letter-spacing: 3px;
            color: var(--accent-warning);
            text-transform: uppercase;
            position: relative;
            display: inline-block;
        }
        .era-divider .era-label::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            right: -20px;
            height: 1px;
            background: linear-gradient(90deg, var(--accent-warning), transparent);
        }
        .era-divider::before {
            content: '';
            position: absolute;
            left: -2.15rem;
            top: 0.65rem;
            width: 18px;
            height: 18px;
            background: var(--bg-void);
            border: 3px solid var(--accent-amber);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--accent-glow);
            z-index: 2;
        }
        /* ========== TIMELINE ENTRY ========== */
        .tl-entry {
            position: relative;
            margin-bottom: 2.5rem;
            padding-left: 2rem;
            cursor: pointer;
            transition: 0.3s;
            border-left: 3px solid transparent;
            border-radius: 0 0.8rem 0.8rem 0;
        }
        .tl-entry:hover {
            transform: translateX(8px);
        }
        .tl-entry.compact {
            margin-bottom: 1.2rem;
        }
        .tl-entry.compact .tl-desc {
            display: none;
        }
        .tl-entry.compact .tl-year {
            font-size: 1.3rem;
        }
        .tl-entry::before {
            content: '';
            position: absolute;
            left: -2.05rem;
            top: 0.5rem;
            width: 14px;
            height: 14px;
            background: var(--bg-void);
            border: 3px solid var(--accent-crimson);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--accent-glow);
            z-index: 2;
        }
        /* Category-specific node styling */
        .tl-entry.cat-ufo::before {
            border-color: var(--cat-ufo);
            box-shadow: 0 0 18px var(--cat-ufo-glow);
        }
        .tl-entry.cat-missing::before {
            border-color: var(--cat-missing);
            box-shadow: 0 0 18px var(--cat-missing-glow);
        }
        .tl-entry.cat-supernatural::before {
            border-color: var(--cat-supernatural);
            box-shadow: 0 0 18px var(--cat-supernatural-glow);
        }
        .tl-entry.cat-historical::before {
            border-color: var(--cat-historical);
            box-shadow: 0 0 18px var(--cat-historical-glow);
        }
        .tl-entry.cat-cryptid::before {
            border-color: var(--cat-cryptid);
            box-shadow: 0 0 18px var(--cat-cryptid-glow);
        }
        /* Major event pulse animation */
        .tl-entry.major::before {
            animation: nodePulse 2s ease-in-out infinite;
        }
        @keyframes nodePulse {
            0%,
            100% {
                box-shadow: 0 0 15px var(--accent-glow);
            }
            50% {
                box-shadow: 0 0 35px var(--accent-glow-strong), 0 0 60px var(--accent-glow);
            }
        }
        .tl-entry .tl-year {
            font-family: var(--font-heading);
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent-crimson);
            letter-spacing: 2px;
            display: block;
            margin-bottom: 0.3rem;
        }
        .tl-entry .tl-title {
            font-family: var(--font-heading);
            font-size: 1.2rem;
            letter-spacing: 1px;
        }
        .tl-entry .tl-desc {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.5;
            margin-top: 0.3rem;
            overflow: hidden;
            transition: max-height 0.5s ease;
        }
        .tl-entry .tl-desc.expanded {
            max-height: 300px;
        }
        .tl-entry .tl-type {
            display: inline-block;
            padding: 0.15rem 0.6rem;
            border-radius: 2rem;
            font-size: 0.65rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: rgba(220, 50, 50, 0.12);
            border: 1px solid rgba(220, 50, 50, 0.3);
            color: var(--accent-warning);
            margin-top: 0.4rem;
        }
        /* Category-specific type badge colors */
        .tl-type.type-ufo {
            background: var(--cat-ufo-bg);
            border-color: var(--cat-ufo-border);
            color: var(--cat-ufo);
        }
        .tl-type.type-missing {
            background: var(--cat-missing-bg);
            border-color: var(--cat-missing-border);
            color: var(--cat-missing);
        }
        .tl-type.type-supernatural {
            background: var(--cat-supernatural-bg);
            border-color: var(--cat-supernatural-border);
            color: var(--cat-supernatural);
        }
        .tl-type.type-historical {
            background: var(--cat-historical-bg);
            border-color: var(--cat-historical-border);
            color: var(--cat-historical);
        }
        .tl-type.type-cryptid {
            background: var(--cat-cryptid-bg);
            border-color: var(--cat-cryptid-border);
            color: var(--cat-cryptid);
        }
        /* Era-specific left border gradient */
        .tl-entry.era-ancient {
            border-left-color: rgba(212, 160, 23, 0.3);
            background: linear-gradient(90deg, rgba(212, 160, 23, 0.04), transparent);
        }
        .tl-entry.era-medieval {
            border-left-color: rgba(206, 147, 216, 0.3);
            background: linear-gradient(90deg, rgba(206, 147, 216, 0.04), transparent);
        }
        .tl-entry.era-1800s {
            border-left-color: rgba(239, 83, 80, 0.3);
            background: linear-gradient(90deg, rgba(239, 83, 80, 0.04), transparent);
        }
        .tl-entry.era-1900-1950 {
            border-left-color: rgba(255, 183, 77, 0.3);
            background: linear-gradient(90deg, rgba(255, 183, 77, 0.04), transparent);
        }
        .tl-entry.era-1950-2000 {
            border-left-color: rgba(79, 195, 247, 0.3);
            background: linear-gradient(90deg, rgba(79, 195, 247, 0.04), transparent);
        }
        .tl-entry.era-2000plus {
            border-left-color: rgba(255, 48, 48, 0.3);
            background: linear-gradient(90deg, rgba(255, 48, 48, 0.04), transparent);
        }
        /* ========== SVG TRACK ========== */
        .svg-track-container {
            position: relative;
            margin: 2rem 0;
            overflow-x: auto;
            background: var(--bg-card);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius-xl);
            padding: 1rem;
        }
        .svg-track-container h4 {
            font-family: var(--font-heading);
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 0.5rem;
        }
        .svg-track-container svg {
            width: 100%;
            min-width: 700px;
            height: 150px;
        }
        /* ========== RESPONSIVE ========== */
        @media (max-width: 768px) {
            .stats-bar {
                grid-template-columns: repeat(2, 1fr);
            }
            .timeline-vertical-main {
                padding-left: 2.5rem;
            }
            .tl-entry .tl-year {
                font-size: 1.4rem;
            }
            .era-filter-bar {
                gap: 0.3rem;
            }
            .era-filter-btn {
                padding: 0.3rem 0.7rem;
                font-size: 0.65rem;
            }
        }
        @media (max-width: 480px) {
            .stats-bar {
                grid-template-columns: 1fr 1fr;
            }
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>

</head>

    <div class="page-header">
        <h1>🕰️ 神秘事件时间线</h1>
        <p style="color:var(--text-muted); letter-spacing:1px;">CHRONOLOGICAL ARCHIVE OF UNEXPLAINED EVENTS</p>
    </div>

    <div class="container">
        <!-- ========== STATS BAR ========== -->
        <div class="stats-bar" id="statsBar"></div>

        <!-- ========== JUMP TO ERA ========== -->
        <div class="jump-nav" id="jumpNav"></div>

        <!-- ========== ERA FILTER BAR ========== -->
        <div class="era-filter-bar" id="eraFilterBar"></div>

        <!-- ========== SVG TRACK ========== -->
        <div class="svg-track-container">
            <h4>VISUAL CHRONOLOGY TRACK</h4>
            <svg id="svgTrack" viewBox="0 0 1200 150" preserveAspectRatio="xMidYMid meet"></svg>
        </div>

        <!-- ========== VIEW CONTROLS ========== -->
        <div class="view-controls">
            <span>间距模式</span>
            <div class="spacing-toggle">
                <button id="spacingExpanded" class="active">展开</button>
                <button id="spacingCompact">紧凑</button>
            </div>

        <!-- ========== TIMELINE MAIN ========== -->
        <div class="timeline-vertical-main" id="timelineContainer"></div>

    <script>
        // ========== EXPANDED TIMELINE EVENTS (50+) ==========
        const timelineEvents = [
            // --- ANCIENT ERA ---
            { year: '公元前3000', title: '巨石阵建造一期', type: '历史悬案', cat: 'historical', era: 'ancient',
                desc: '英国索尔兹伯里平原上开始建造巨石阵第一阶段——环形沟渠与奥布里孔。其精确的天文对准和巨大的石块运输方式至今仍是考古学谜题。',
                major: true },
            { year: '公元前2560', title: '吉萨大金字塔完工', type: '历史悬案', cat: 'historical', era: 'ancient',
                desc: '古埃及第四王朝法老胡夫的大金字塔建成。其精确度、石块重量与当时的技术水平之间的矛盾至今无法完美解释。', major: true },
            { year: '公元前1400', title: '纳斯卡线条开始绘制', type: '历史悬案', cat: 'historical', era: 'ancient',
                desc: '秘鲁南部纳斯卡沙漠中出现巨大地面图案。其用途——天文、宗教仪式还是其他——迄今没有定论。', major: false },
            { year: '约公元前500', title: '巴比伦空中花园之谜', type: '历史悬案', cat: 'historical', era: 'ancient',
                desc: '古代世界七大奇迹之一——巴比伦空中花园的确切位置和真实存在性至今在学者中存在争议，考古证据仍不充分。', major: false },
            { year: '约公元前300', title: '亚历山大灯塔之谜', type: '历史悬案', cat: 'historical', era: 'ancient',
                desc: '古代世界七大奇迹之一的亚历山大灯塔确切结构已失传，考古学家仅能从古代文献和海底遗迹中推测其原貌。', major: false },

            // --- MEDIEVAL ERA ---
            { year: '公元793', title: '林迪斯法恩袭击', type: '历史悬案', cat: 'historical', era: 'medieval',
                desc: '维京人对英格兰林迪斯法恩修道院的袭击震惊欧洲，但维京人为何突然开始大规模扩张性掠夺仍是历史之谜。', major: false },
            { year: '公元1211', title: '伍尔皮特绿孩', type: '超自然现象', cat: 'supernatural', era: 'medieval',
                desc: '英格兰萨福克郡出现两名绿色皮肤的儿童，讲一种无人能懂的语言。女孩后学会英语，声称来自一个永远黑暗的"圣马丁之地"。', major: false },
            { year: '1307年10月13日', title: '圣殿骑士团大逮捕', type: '历史悬案', cat: 'historical', era: 'medieval',
                desc: '法国国王腓力四世下令逮捕全部圣殿骑士团成员，这正是"星期五13日"不吉利传说的来源之一。骑士团传说中的宝藏至今下落不明。',
                major: true },
            { year: '公元1434', title: '伏尼契手稿推测年代', type: '历史悬案', cat: 'historical', era: 'medieval',
                desc: '这份用未知文字写成的神秘手稿碳定年推测产于15世纪早期。数百年来，各国密码学家都无法破译，甚至无法确定这是密码还是恶作剧。',
                major: false },
            { year: '1561年4月', title: '纽伦堡天体异象', type: 'UFO事件', cat: 'ufo', era: '1800s',
                desc: '德国纽伦堡上空出现数百个圆柱体、球体和十字形物体在空中"战斗"。当地报纸以木版画详细记录了这一奇异事件，被认为是历史上最早的UFO大规模目击记载之一。',
                major: false },

        // ========== ERA DEFINITIONS ==========
        const eraDefs = [
            { key: 'all', label: '全部事件', anchor: 'top' },
            { key: 'ancient', label: '古代', anchor: 'era-ancient' },
            { key: 'medieval', label: '中世纪', anchor: 'era-medieval' },
            { key: '1800s', label: '1500-1800s', anchor: 'era-1800s' },
            { key: '1900-1950', label: '1900-1950', anchor: 'era-1900-1950' },
            { key: '1950-2000', label: '1950-2000', anchor: 'era-1950-2000' },
            { key: '2000plus', label: '2000+', anchor: 'era-2000plus' },
        ];

        let activeEraFilter = 'all';
        let compactMode = false;

        // ========== STATS BAR ==========
        function renderStatsBar(filteredEvents) {
            const events = filteredEvents || timelineEvents;
            const total = events.length;
            // Most active decade
            const decadeMap = {};
            events.forEach(e => {
                const y = parseInt(e.year.replace(/[^0-9]/g, ''));
                if (!isNaN(y)) {
                    const dec = Math.floor(y / 10) * 10;
                    decadeMap[dec] = (decadeMap[dec] || 0) + 1;
                }
            });
            let bestDecade = 'N/A';
            let bestCount = 0;
            Object.entries(decadeMap).forEach(([dec, c]) => { if (c > bestCount) { bestCount = c;
                    bestDecade = dec + 's'; } });
            // Most common category
            const catMap = {};
            events.forEach(e => { catMap[e.cat] = (catMap[e.cat] || 0) + 1; });
            let bestCat = 'N/A';
            let bestCatCount = 0;
            Object.entries(catMap).forEach(([cat, c]) => { if (c > bestCatCount) { bestCatCount = c;
                    bestCat = cat; } });
            const catLabels = { ufo: 'UFO/UAP', missing: '失踪案件', supernatural: '超自然', historical: '历史悬案', cryptid: '未知生物' };

            document.getElementById('statsBar').innerHTML = `
                <div class="stat-mini"><div class="sm-value">${total}</div><div class="sm-label">事件总数</div></div>
                <div class="stat-mini"><div class="sm-value">${bestDecade}</div><div class="sm-label">最活跃年代</div></div>
                <div class="stat-mini"><div class="sm-value">${catLabels[bestCat] || bestCat}</div><div class="sm-label">最常见类别</div></div>
                <div class="stat-mini"><div class="sm-value">${events.filter(e => e.major).length}</div><div class="sm-label">重大事件</div></div>
            `;
        }
        renderStatsBar();

        // ========== JUMP NAV ==========
        document.getElementById('jumpNav').innerHTML = eraDefs.filter(ed => ed.key !== 'all').map(ed =>
            `<a href="#${ed.anchor}" data-era="${ed.key}">⬡ ${ed.label}</a>`
        ).join('');

        document.querySelectorAll('.jump-nav a').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const era = this.dataset.era;
                activeEraFilter = era;
                updateFilterButtons();
                renderTimeline();
                const eraSection = document.getElementById('era-' + era);
                if (eraSection) {
                    eraSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            });
        });

        // ========== ERA FILTER BAR ==========
        function countEventsByEra(eraKey) {
            if (eraKey === 'all') return timelineEvents.length;
            return timelineEvents.filter(e => e.era === eraKey).length;
        }

        function renderFilterButtons() {
            document.getElementById('eraFilterBar').innerHTML = eraDefs.map(ed => {
                const count = countEventsByEra(ed.key);
                const activeClass = ed.key === activeEraFilter ? ' active' : '';
                return `<button class="era-filter-btn${activeClass}" data-era="${ed.key}">${ed.label}<span class="era-count">${count}</span></button>`;
            }).join('');
        }
        renderFilterButtons();

        function updateFilterButtons() {
            document.querySelectorAll('.era-filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.era === activeEraFilter);
            });
        }

        document.querySelectorAll('.era-filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                activeEraFilter = this.dataset.era;
                updateFilterButtons();
                renderTimeline();
                updateSVGTrack();
            });
        });

        // ========== SPACING TOGGLE ==========
        document.getElementById('spacingExpanded').addEventListener('click', function() {
            compactMode = false;
            this.classList.add('active');
            document.getElementById('spacingCompact').classList.remove('active');
            renderTimeline();
        });
        document.getElementById('spacingCompact').addEventListener('click', function() {
            compactMode = true;
            this.classList.add('active');
            document.getElementById('spacingExpanded').classList.remove('active');
            renderTimeline();
        });

        // ========== RENDER TIMELINE ==========
        function renderTimeline() {
            const filtered = activeEraFilter === 'all' ?
                timelineEvents :
                timelineEvents.filter(e => e.era === activeEraFilter);

            renderStatsBar(filtered);

            const container = document.getElementById('timelineContainer');
            const eraOrder = ['ancient', 'medieval', '1800s', '1900-1950', '1950-2000', '2000plus'];
            const eraLabels = { ancient: 'ANCIENT ERA · 古代', medieval: 'MEDIEVAL ERA · 中世纪', '1800s': '1500-1800s · 近代早期',
                '1900-1950': '1900-1950 · 二战前后', '1950-2000': '1950-2000 · 冷战时代', '2000plus': '2000+ · 新世纪' };

            let html = '';
            let currentEra = null;

            filtered.forEach((e, i) => {
                if (e.era !== currentEra && activeEraFilter === 'all') {
                    currentEra = e.era;
                    html += `<div class="era-divider" id="era-${currentEra}"><span class="era-label">${eraLabels[currentEra] || ''}</span></div>`;
                }
                const catClass = `cat-${e.cat}`;
                const majorClass = e.major ? ' major' : '';
                const compactClass = compactMode ? ' compact' : '';
                const eraClass = `era-${e.era}`;
                const typeClass = `type-${e.cat}`;
                html += `
                <div class="tl-entry ${catClass}${majorClass}${compactClass} ${eraClass}" style="animation: fadeInUp 0.5s ease-out ${i*0.02}s both;" data-title="${encodeURIComponent(e.title)}" data-idx="${i}">
                  <span class="tl-year">${e.year}</span>
                  <div class="tl-title">${e.title}${e.major ? ' <span style="font-size:0.6rem;color:var(--accent-neon);animation:pulse 1.5s ease-in-out infinite;vertical-align:middle;">MAJOR</span>' : ''}</div>
                  <span class="tl-type ${typeClass}">${e.type}</span>
                  <p class="tl-desc">${e.desc}</p>
                </div>`;
            });

            container.innerHTML = html;

            // Click handler: expand detail on click
            container.querySelectorAll('.tl-entry').forEach(entry => {
                entry.addEventListener('click', function(e) {
                    // Don't interfere with archive link navigation on type badge
                    const desc = this.querySelector('.tl-desc');
                    if (desc) {
                        desc.classList.toggle('expanded');
                    }
                });
                // Double-click to navigate to archives
                entry.addEventListener('dblclick', function() {
                    const title = decodeURIComponent(this.dataset.title);
                    window.location.href = 'archives.html?search=' + encodeURIComponent(title);
                });
            });

            updateSVGTrack();
        }

        // ========== SVG TIMELINE TRACK ==========
        function updateSVGTrack() {
            const svg = document.getElementById('svgTrack');
            const filtered = activeEraFilter === 'all' ?
                timelineEvents :
                timelineEvents.filter(e => e.era === activeEraFilter);

            const w = 1200;
            const h = 150;
            const padX = 60;
            const padY = 30;
            const trackY = h / 2;
            const usableW = w - padX * 2;

            // Determine year range
            const years = filtered.map(e => {
                const s = e.year.replace(/[^0-9]/g, '');
                if (s.length === 0) return null;
                let y = parseInt(s);
                if (e.year.includes('公元前') || e.year.includes('BC')) y = -y;
                return y;
            }).filter(y => y !== null);
            if (years.length === 0) { svg.innerHTML = ''; return; }
            const minY = Math.min(...years);
            const maxY = Math.max(...years);
            const range = maxY - minY || 1;

            const catColors = { ufo: '#4fc3f7', missing: '#ffb74d', supernatural: '#ce93d8', historical: '#ef5350',
                cryptid: '#81c784' };

            let svgHTML = `
            <!-- Track line -->
            <line x1="${padX}" y1="${trackY}" x2="${w-padX}" y2="${trackY}" stroke="rgba(220,50,50,0.2)" stroke-width="2"/>
            <!-- Grid lines -->
            ${[...Array(11)].map((_, i) => {
                const x = padX + (usableW/10)*i;
                return `<line x1="${x}" y1="${trackY-15}" x2="${x}" y2="${trackY+15}" stroke="rgba(220,50,50,0.1)" stroke-width="0.5"/>`;
            }).join('')}
            <!-- Nodes -->
            ${filtered.map((e, i) => {
                const y = years[i];
                const x = padX + ((y - minY) / range) * usableW;
                const color = catColors[e.cat] || '#c0392b';
                const r = e.major ? 7 : 4;
                const glow = e.major ? `filter="url(#glow)"` : '';
                return `
                <g class="svg-node" data-idx="${i}" style="cursor:pointer;">
                    <circle cx="${x}" cy="${trackY}" r="${r+3}" fill="none" stroke="${color}" stroke-width="1" opacity="0.4"/>
                    <circle cx="${x}" cy="${trackY}" r="${r}" fill="${color}" ${glow} opacity="0.9"/>
                    <title>${e.year} - ${e.title}</title>
                </g>`;
            }).join('')}
            <!-- Year labels -->
            ${filtered.filter((e, i) => e.major || i % Math.max(1, Math.floor(filtered.length/10)) === 0).map((e, i) => {
                const y = years[filtered.indexOf(e)];
                const x = padX + ((y - minY) / range) * usableW;
                return `<text x="${x}" y="${trackY+25}" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="9" letter-spacing="0.5">${e.year}</text>`;
            }).join('')}
            <!-- Glow filter -->
            <defs>
                <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
                    <feGaussianBlur stdDeviation="3" result="blur"/>
                    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
            </defs>
            `;

            svg.innerHTML = svgHTML;

            // SVG node click handlers
            svg.querySelectorAll('.svg-node').forEach(node => {
                node.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.idx);
                    const title = encodeURIComponent(filtered[idx].title);
                    window.location.href = 'archives.html?search=' + title;
                });
            });
        }

        // ========== INITIAL RENDER ==========
        renderTimeline();

        // ========== CONSOLE ==========
        console.log('🕰️ 时间线已加载 - ' + timelineEvents.length + ' 个事件, ' +
            timelineEvents.filter(e => e.major).length + ' 个重大事件, 覆盖 ' +
            [...new Set(timelineEvents.map(e => e.era))].length + ' 个时代');
    </script>
</body>
</html>
