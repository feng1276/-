<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>档案库 · 未解之谜档案馆</title>
    <style>
        :root {
            --bg-void: #0a0a0f;
            --bg-abyss: #0d0d14;
            --bg-surface: #111118;
            --bg-card: rgba(18, 18, 26, 0.85);
            --bg-card-hover: rgba(22, 22, 32, 0.92);
            --glass-bg: rgba(10, 10, 20, 0.7);
            --glass-border: rgba(180, 40, 40, 0.18);
            --glass-border-bright: rgba(220, 50, 50, 0.35);
            --accent-crimson: #c0392b;
            --accent-blood: #8b0000;
            --accent-warning: #e74c3c;
            --accent-amber: #d4a017;
            --accent-neon: #ff2d2d;
            --accent-glow: rgba(220, 50, 50, 0.5);
            --accent-glow-strong: rgba(255, 40, 40, 0.7);
            --text-primary: #e0d8d0;
            --text-secondary: #a09890;
            --text-muted: #6a6258;
            --text-warning: #ff6b6b;
            --border-radius-xl: 1.5rem;
            --border-radius-lg: 1rem;
            --border-radius-md: 0.7rem;
            --border-radius-sm: 0.5rem;
            --transition-smooth: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.6);
            --shadow-glow-red: 0 0 40px rgba(220, 50, 50, 0.35);
            --font-body: 'Crimson Text', 'Georgia', 'Noto Serif SC', 'Songti SC', serif;
            --font-heading: 'Cinzel', 'Georgia', 'Noto Serif SC', serif;
            --font-mono: 'Courier Prime', 'Courier New', monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-body);
            background: var(--bg-void);
            background-image:
                radial-gradient(ellipse at 20% 10%, rgba(180, 30, 30, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(212, 160, 23, 0.03) 0%, transparent 50%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.025'/%3E%3C/svg%3E");
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 4rem;
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-abyss); }
        ::-webkit-scrollbar-thumb { background: var(--accent-crimson); border-radius: 10px; }
        .navbar {
            position: sticky; top: 10px; margin: 10px 20px;
            padding: 0.8rem 2rem; display: flex; align-items: center;
            justify-content: space-between; background: var(--glass-bg);
            backdrop-filter: blur(20px); border: 1px solid var(--glass-border);
            border-radius: 3rem; z-index: 100; flex-wrap: wrap; gap: 1rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        .logo {
            font-family: var(--font-heading); font-size: 1.5rem;
            font-weight: 700; letter-spacing: 2px; color: var(--text-primary);
            cursor: pointer; text-transform: uppercase;
        }
        .logo span { color: var(--accent-warning); text-shadow: 0 0 15px var(--accent-glow); }
        .nav-links { display: flex; gap: 1.2rem; list-style: none; flex-wrap: wrap; }
        .nav-links a {
            color: var(--text-secondary); text-decoration: none; font-size: 0.85rem;
            letter-spacing: 0.6px; text-transform: uppercase; transition: 0.2s;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--accent-warning); }
        .page-header { text-align: center; padding: 3rem 1rem 1.5rem; }
        .page-header h1 {
            font-family: var(--font-heading); font-size: 2.5rem;
            letter-spacing: 3px; text-transform: uppercase;
        }
        .page-header .divider {
            width: 50px; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-crimson), transparent);
            margin: 0.8rem auto;
        }

        /* ===== STATISTICS HEADER ===== */
        .stats-bar {
            display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center;
            padding: 1rem 2rem; max-width: 1400px; margin: 0 auto 1.5rem;
        }
        .stat-box {
            background: var(--bg-card); backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border); border-radius: var(--border-radius-lg);
            padding: 0.8rem 1.5rem; text-align: center; min-width: 130px;
            transition: all var(--transition-fast); position: relative; overflow: hidden;
        }
        .stat-box::after {
            content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-crimson), transparent);
        }
        .stat-box:hover { border-color: var(--glass-border-bright); box-shadow: var(--shadow-glow-red); }
        .stat-value {
            font-family: var(--font-heading); font-size: 1.6rem; color: var(--accent-warning);
            letter-spacing: 1px;
        }
        .stat-label {
            font-family: var(--font-mono); font-size: 0.65rem; color: var(--text-muted);
            letter-spacing: 1px; text-transform: uppercase; margin-top: 0.2rem;
        }

        /* ===== TOOLBAR ===== */
        .toolbar {
            display: flex; gap: 0.8rem; flex-wrap: wrap; align-items: center;
            padding: 0 2rem 1rem; max-width: 1400px; margin: 0 auto;
        }
        .toolbar button, .toolbar select {
            padding: 0.45rem 1rem; border-radius: 2rem;
            background: var(--bg-card); border: 1px solid var(--glass-border);
            color: var(--text-secondary); cursor: pointer;
            font-family: var(--font-mono); font-size: 0.75rem;
            letter-spacing: 0.6px; transition: all var(--transition-fast);
        }
        .toolbar button:hover, .toolbar select:hover {
            border-color: var(--accent-warning); color: var(--accent-warning);
            box-shadow: 0 0 12px var(--accent-glow);
        }
        .toolbar button.active {
            background: rgba(220, 50, 50, 0.15); border-color: var(--accent-warning); color: var(--accent-warning);
        }
        .toolbar .spacer { flex: 1; }

        /* ===== BULK COMPARE ===== */
        .bulk-compare-panel {
            display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--bg-card); backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border-bright); border-radius: 3rem;
            padding: 0.6rem 1.8rem; z-index: 200;
            box-shadow: 0 8px 40px rgba(0,0,0,0.7), var(--shadow-glow-red);
            align-items: center; gap: 1rem;
        }
        .bulk-compare-panel.show { display: flex; }
        .bulk-compare-panel span {
            font-family: var(--font-mono); font-size: 0.8rem; color: var(--accent-warning); letter-spacing: 1px;
        }
        .bulk-compare-panel button {
            padding: 0.4rem 1.2rem; border-radius: 2rem;
            background: var(--accent-crimson); border: none; color: #fff;
            cursor: pointer; font-family: var(--font-mono); font-size: 0.75rem;
            letter-spacing: 0.8px; transition: 0.2s;
        }
        .bulk-compare-panel button:hover { background: var(--accent-warning); }
        .bulk-compare-panel .clear-compare {
            background: transparent; border: 1px solid var(--glass-border); color: var(--text-muted);
        }

        /* ===== SELECT CHECKBOX ===== */
        .card-select {
            position: absolute; top: 12px; right: 14px; z-index: 10;
            width: 22px; height: 22px; cursor: pointer;
            accent-color: var(--accent-warning); opacity: 0;
            transition: opacity 0.2s;
        }
        .archive-card:hover .card-select { opacity: 1; }
        .archive-card.selected {
            border-color: var(--accent-warning) !important;
            box-shadow: 0 0 25px rgba(255, 40, 40, 0.5), 0 8px 32px rgba(0,0,0,0.6) !important;
        }
        .archive-card.selected .card-select { opacity: 1; }

        .main-layout {
            display: flex; gap: 2rem; padding: 1rem 2rem;
            max-width: 1400px; margin: 0 auto;
        }
        .filter-sidebar {
            width: 250px; flex-shrink: 0; background: var(--bg-card);
            backdrop-filter: blur(15px); border: 1px solid var(--glass-border);
            border-radius: var(--border-radius-xl); padding: 1.8rem;
            position: sticky; top: 110px; height: fit-content; max-height: 80vh; overflow-y: auto;
        }
        .filter-sidebar h3 {
            font-family: var(--font-heading); color: var(--accent-warning);
            margin-bottom: 1.2rem; letter-spacing: 1px; font-size: 1.1rem;
        }
        .filter-group { margin-bottom: 1.5rem; }
        .filter-group label {
            display: block; font-weight: 600; font-size: 0.82rem;
            letter-spacing: 0.8px; margin-bottom: 0.4rem;
            color: var(--text-secondary); text-transform: uppercase;
        }
        .filter-group select {
            width: 100%; padding: 0.6rem 0.8rem; background: var(--bg-surface);
            border: 1px solid var(--glass-border); border-radius: var(--border-radius-sm);
            color: var(--text-primary); font-family: var(--font-body); cursor: pointer; font-size: 0.9rem;
        }
        .filter-group select:focus {
            border-color: var(--accent-warning); outline: none; box-shadow: 0 0 15px var(--accent-glow);
        }
        .credibility-options { display: flex; flex-wrap: wrap; gap: 0.4rem; }
        .cred-chip {
            padding: 0.3rem 0.7rem; border-radius: 2rem; font-size: 0.7rem;
            cursor: pointer; border: 1px solid var(--glass-border);
            background: transparent; color: var(--text-secondary);
            letter-spacing: 0.5px; transition: 0.2s; font-family: var(--font-body);
        }
        .cred-chip.active {
            background: rgba(220, 50, 50, 0.2); border-color: var(--accent-warning); color: var(--accent-warning);
        }
        .reset-btn {
            width: 100%; padding: 0.6rem; border-radius: 2rem;
            background: transparent; border: 1px solid var(--glass-border);
            color: var(--text-secondary); cursor: pointer; font-family: var(--font-body);
            letter-spacing: 0.8px; transition: 0.2s; margin-top: 0.5rem;
        }
        .reset-btn:hover { border-color: var(--accent-warning); color: var(--accent-warning); }

        /* ===== GRID / LIST VIEWS ===== */
        .archives-grid {
            flex: 1; display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem; align-content: start;
        }
        .archives-grid.list-view {
            display: flex; flex-direction: column; gap: 0.8rem;
        }
        .archives-grid.list-view .archive-card {
            display: flex; align-items: center; padding: 0.8rem 1.5rem;
            flex-direction: row; gap: 1.5rem;
        }
        .archives-grid.list-view .archive-card .archive-card-header { flex-shrink: 0; padding: 0; min-width: 200px; }
        .archives-grid.list-view .archive-card .archive-card-body { flex: 1; display: flex; align-items: center; gap: 1rem; padding: 0; }
        .archives-grid.list-view .archive-card .card-preview-box { display: none; }
        .archives-grid.list-view .archive-card .preview-trigger { display: none; }

        /* ===== CASE CARD ENHANCED ===== */
        .archive-card {
            background: var(--bg-card); backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border); border-radius: var(--border-radius-xl);
            overflow: visible; cursor: pointer; transition: all var(--transition-smooth);
            position: relative;
        }
        .archive-card:hover {
            transform: translateY(-6px);
            border-color: var(--glass-border-bright);
            box-shadow: 0 0 25px rgba(220, 50, 50, 0.4), 0 0 60px rgba(220, 50, 50, 0.15), 0 12px 30px rgba(0, 0, 0, 0.5);
        }
        .archive-card-header {
            padding: 1.5rem 1.5rem 0.5rem; display: flex; align-items: flex-start; gap: 1rem;
        }
        .archive-card-header .card-icon { font-size: 2.5rem; position: relative; }
        .archive-card-header h3 {
            font-family: var(--font-heading); font-size: 1.2rem; letter-spacing: 1px;
        }
        .archive-card-body { padding: 0.5rem 1.5rem 1.5rem; }
        .archive-card-body .meta-row {
            display: flex; gap: 0.8rem; flex-wrap: wrap; margin: 0.5rem 0;
            font-size: 0.78rem; color: var(--text-muted); letter-spacing: 0.5px;
        }
        .archive-card-body p { color: var(--text-secondary); font-size: 0.9rem; line-height: 1.5; }

        /* ===== CASE NUMBER BADGE ===== */
        .case-num-badge {
            position: absolute; top: -8px; left: -8px;
            background: var(--accent-blood); color: var(--text-primary);
            font-family: var(--font-mono); font-size: 0.6rem;
            padding: 0.2rem 0.6rem; border-radius: 1rem;
            letter-spacing: 1px; z-index: 5;
            border: 1px solid var(--accent-warning);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* ===== EVIDENCE COUNTER BADGE ===== */
        .evidence-counter {
            display: inline-flex; align-items: center; gap: 0.3rem;
            padding: 0.2rem 0.7rem; border-radius: 2rem;
            background: rgba(212, 160, 23, 0.12); border: 1px solid rgba(212, 160, 23, 0.3);
            font-family: var(--font-mono); font-size: 0.65rem; color: var(--accent-amber);
            letter-spacing: 0.5px; margin-top: 0.4rem;
        }

        /* ===== QUICK PREVIEW (HOVER) ===== */
        .card-preview-box {
            position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
            background: var(--bg-card-hover); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border-bright); border-radius: var(--border-radius-lg);
            padding: 1rem 1.2rem; width: 280px; z-index: 50;
            opacity: 0; visibility: hidden; pointer-events: none;
            transition: all 0.3s ease; margin-bottom: 8px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.7), 0 0 25px rgba(220,50,50,0.3);
        }
        .card-preview-box::after {
            content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
            border-left: 8px solid transparent; border-right: 8px solid transparent;
            border-top: 8px solid var(--glass-border-bright);
        }
        .archive-card:hover .card-preview-box {
            opacity: 1; visibility: visible;
        }
        .card-preview-box .pv-title {
            font-family: var(--font-heading); font-size: 0.9rem; color: var(--accent-warning);
            letter-spacing: 1px; margin-bottom: 0.5rem;
        }
        .card-preview-box .pv-row {
            font-size: 0.72rem; color: var(--text-secondary); margin: 0.25rem 0;
            font-family: var(--font-mono);
        }
        .card-preview-box .pv-row strong { color: var(--accent-amber); }

        .status-badge {
            display: inline-block; padding: 0.2rem 0.7rem; border-radius: 2rem;
            font-size: 0.7rem; letter-spacing: 1px; text-transform: uppercase; font-weight: 700;
        }
        .status-unsolved { background: rgba(220, 50, 50, 0.2); color: var(--accent-warning); border: 1px solid rgba(220, 50, 50, 0.4); }
        .status-controversial { background: rgba(212, 160, 23, 0.2); color: var(--accent-amber); border: 1px solid rgba(212, 160, 23, 0.4); }
        .status-solved { background: rgba(40, 160, 80, 0.2); color: #5bca7b; border: 1px solid rgba(40, 160, 80, 0.4); }
        .cred-stars { color: var(--accent-amber); letter-spacing: 2px; }

        /* ===== REDACTED STAMP ===== */
        .redacted-stamp {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%) rotate(-25deg);
            font-family: var(--font-heading); font-size: 3rem; color: rgba(220,50,50,0.08);
            letter-spacing: 5px; pointer-events: none; z-index: 1;
            text-transform: uppercase; white-space: nowrap;
        }

        .pagination {
            display: flex; justify-content: center; gap: 0.5rem; margin-top: 2rem;
        }
        .page-btn {
            padding: 0.5rem 1rem; border-radius: 2rem;
            background: var(--bg-card); border: 1px solid var(--glass-border);
            color: var(--text-secondary); cursor: pointer; transition: 0.2s;
            font-family: var(--font-mono); font-size: 0.85rem;
        }
        .page-btn.active { background: var(--accent-crimson); color: #e0d0c0; border-color: var(--accent-crimson); }
        .result-count {
            margin-bottom: 1rem; color: var(--text-muted);
            font-family: var(--font-mono); font-size: 0.85rem; letter-spacing: 1px;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .archive-card { animation: fadeInUp 0.5s ease-out both; }

        /* ===== TOAST ===== */
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: var(--bg-card); border: 1px solid var(--accent-amber);
            padding: 0.7rem 2rem; border-radius: 2rem; z-index: 300;
            font-family: var(--font-mono); font-size: 0.8rem; color: var(--accent-amber);
            letter-spacing: 1px; opacity: 0; transition: opacity 0.3s;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .toast.show { opacity: 1; }

        @media (max-width: 900px) {
            .main-layout { flex-direction: column; padding: 1rem; }
            .filter-sidebar { width: 100%; position: static; max-height: none; }
            .archives-grid { grid-template-columns: 1fr; }
            .stats-bar { padding: 0.5rem; gap: 0.5rem; }
            .stat-box { min-width: 70px; padding: 0.5rem 0.8rem; }
            .stat-value { font-size: 1.2rem; }
        }

        /* ===== PULSE GLOW ON CARD HOVER ===== */
        @keyframes crimsonPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(220, 50, 50, 0.3), 0 0 50px rgba(220, 50, 50, 0.08); }
            50% { box-shadow: 0 0 35px rgba(220, 50, 50, 0.55), 0 0 80px rgba(220, 50, 50, 0.2); }
        }
        .archive-card:hover {
            animation: crimsonPulse 2s ease-in-out infinite;
        }

        /* ===== HOVER SCAN LINE ===== */
        .archive-card::before {
            content: '';
            position: absolute; top: 0; left: -100%;
            width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-neon), transparent);
            transition: left 0.6s ease; z-index: 6;
        }
        .archive-card:hover::before { left: 100%; }

        /* ===== CLASSIFIED CORNER FOLD ===== */
        .archive-card::after {
            content: '';
            position: absolute; bottom: 0; right: 0;
            width: 30px; height: 30px;
            background: linear-gradient(135deg, transparent 50%, rgba(220, 50, 50, 0.15) 50%);
            border-radius: 0 0 var(--border-radius-xl) 0;
            z-index: 4; pointer-events: none;
        }

        /* ===== ACTIVE FILTER TAGS ===== */
        .active-filters-row {
            display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center;
            padding: 0 2rem 0.5rem; max-width: 1400px; margin: 0 auto;
        }
        .filter-tag {
            display: inline-flex; align-items: center; gap: 0.3rem;
            padding: 0.25rem 0.8rem; border-radius: 2rem;
            background: rgba(220, 50, 50, 0.12); border: 1px solid rgba(220, 50, 50, 0.3);
            font-family: var(--font-mono); font-size: 0.65rem;
            color: var(--accent-warning); letter-spacing: 0.5px;
        }
        .filter-tag .remove-tag {
            cursor: pointer; font-size: 0.9rem; color: var(--accent-crimson);
            transition: 0.2s;
        }
        .filter-tag .remove-tag:hover { color: var(--accent-warning); }

        /* ===== KEYBOARD SHORTCUT HINT ===== */
        .kbd-hint {
            display: inline-block; padding: 0.15rem 0.45rem;
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
            border-radius: 4px; font-family: var(--font-mono); font-size: 0.6rem;
            color: var(--text-muted); letter-spacing: 0.5px;
        }

        /* ===== SCROLL TO TOP BUTTON ===== */
        .scroll-top-btn {
            position: fixed; bottom: 30px; right: 30px; z-index: 199;
            width: 44px; height: 44px; border-radius: 50%;
            background: var(--bg-card); border: 1px solid var(--glass-border);
            color: var(--accent-warning); cursor: pointer; font-size: 1.2rem;
            transition: all 0.3s; opacity: 0; visibility: hidden;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .scroll-top-btn.show { opacity: 1; visibility: visible; }
        .scroll-top-btn:hover { border-color: var(--accent-warning); box-shadow: 0 0 20px var(--accent-glow); }

        /* ===== EMPTY STATE STYLING ===== */
        .empty-state {
            text-align: center; padding: 3rem; color: var(--text-muted);
            font-family: var(--font-mono); letter-spacing: 1px; font-size: 0.85rem;
        }
        .empty-state .empty-icon { font-size: 4rem; margin-bottom: 1rem; opacity: 0.4; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
</head>

    <div class="page-header">
        <h1>未解事件档案库</h1>
        <div class="divider"></div>
        <p style="color:var(--text-muted); letter-spacing:1px;">CLASSIFIED CASE FILES</p>
    </div>

    <!-- Statistics Header -->

        let activeCred = null;
        const itemsPerPage = 8;
        let currentPage = 1;
        let viewMode = 'grid';
        let sortMode = 'default';
        let selectedCompare = new Set();
        let favorites = JSON.parse(localStorage.getItem('mysteryFavs') || '[]');

        function getFiltered() {
            const typeVal = document.getElementById('typeFilter').value;
            const regionVal = document.getElementById('regionFilter').value;
            const eraVal = document.getElementById('eraFilter').value;
            let filtered = casesData.filter(c => {
                if (typeVal !== 'all' && c.type !== typeVal) return false;
                if (regionVal !== 'all' && c.region !== regionVal && c.region !== 'all') return false;
                if (eraVal !== 'all' && c.era !== eraVal) return false;
                if (activeCred && c.credibility !== activeCred) return false;
                return true;
            });
            // Sort
            if (sortMode === 'name') {
                filtered.sort((a, b) => a.name.localeCompare(b.name));
            } else if (sortMode === 'date') {
                filtered.sort((a, b) => {
                    const ay = parseInt(a.year) || 9999;
                    const by = parseInt(b.year) || 9999;
                    return ay - by;
                });
            } else if (sortMode === 'credibility') {
                const order = { 'high': 0, 'medium': 1, 'low': 2, 'unknown': 3 };
                filtered.sort((a, b) => (order[a.credibility] || 3) - (order[b.credibility] || 3));
            } else if (sortMode === 'newest') {
                filtered.reverse();
            }
            return filtered;
        }

        function getCaseNumber(idx) {
            return 'FILE-' + String(idx + 1).padStart(3, '0');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2200);
        }

        function updateStats(filtered) {
            document.getElementById('statTotal').textContent = casesData.length;
            document.getElementById('statFiltered').textContent = filtered.length;
            // Most common type
            const typeCount = {};
            filtered.forEach(c => { typeCount[c.type] = (typeCount[c.type] || 0) + 1; });
            let topType = '--', topTypeN = 0;
            const typeNames = { ufo: 'UFO事件', missing: '失踪案件', supernatural: '超自然', geographic: '地理异常', historical: '历史悬案', cryptid: '未知生物' };
            for (const [k, v] of Object.entries(typeCount)) {
                if (v > topTypeN) { topType = typeNames[k] || k;
                    topTypeN = v; }
            }
            document.getElementById('statTopType').textContent = topType;
            // Most active region
            const regionCount = {};
            filtered.forEach(c => { if (c.region !== 'all') { regionCount[c.region] = (regionCount[c.region] || 0) + 1; } });
            let topRegion = '--', topRegionN = 0;
            const regionNames = { north_america: '北美', europe: '欧洲', asia: '亚洲', south_america: '南美', oceania: '大洋洲', africa: '非洲' };
            for (const [k, v] of Object.entries(regionCount)) {
                if (v > topRegionN) { topRegion = regionNames[k] || k;
                    topRegionN = v; }
            }
            document.getElementById('statTopRegion').textContent = topRegion;
        }

        function renderArchives() {
            const filtered = getFiltered();
            document.getElementById('resultCount').textContent = `共显示 ${filtered.length} 个案件`;
            updateStats(filtered);
            const totalPages = Math.ceil(filtered.length / itemsPerPage);
            if (currentPage > totalPages) currentPage = Math.max(1, totalPages);
            const start = (currentPage - 1) * itemsPerPage;
            const pageItems = filtered.slice(start, start + itemsPerPage);
            const grid = document.getElementById('archivesGrid');
            grid.innerHTML = pageItems.map((c, i) => {
                const credStars = c.credibility === 'high' ? '★★★' : c.credibility === 'medium' ? '★★☆' : c.credibility === 'low' ? '★☆☆' : '???';
                const isFav = favorites.includes(c.id);
                const isSelected = selectedCompare.has(c.id);
                const fileNum = getCaseNumber(casesData.indexOf(c));
                const typeLabels = { ufo: 'UFO事件', missing: '失踪案件', supernatural: '超自然现象', geographic: '地理异常', historical: '历史悬案', cryptid: '未知生物' };
                const typeLabel = typeLabels[c.type] || c.type;
                const regionFullLabels = { north_america: '北美', europe: '欧洲', asia: '亚洲', south_america: '南美', oceania: '大洋洲', africa: '非洲', all: '全球' };
                const regionLabel = regionFullLabels[c.region] || c.region;
                return `
            <div class="archive-card${isSelected ? ' selected' : ''}" style="animation-delay:${i*0.05}s;" onclick="window.location.href='mystery_detail.html?case=${c.id}'">
              <span class="case-num-badge">${fileNum}</span>
              <span class="redacted-stamp">CLASSIFIED</span>
              <input type="checkbox" class="card-select" ${isSelected ? 'checked' : ''} onclick="event.stopPropagation();toggleCompareSelect('${c.id}', this)" title="选择对比">
              <div class="archive-card-header">
                <span class="card-icon">${c.icon}</span>
                <div>
                  <h3>${c.name}</h3>
                  <span class="status-badge status-${c.status}">${c.status === 'unsolved' ? '⚠ 未解' : c.status === 'solved' ? '✓ 已解' : '⚡ 争议'}</span>
                </div>
              </div>
              <div class="archive-card-body">
                <div class="meta-row">
                  <span>📍 ${c.location}</span>
                  <span>📅 ${c.year}</span>
                </div>
                <p>${c.desc}</p>
                <div class="meta-row" style="margin-top:0.3rem;">
                  <span>📂 ${typeLabel}</span>
                  <span>🌍 ${regionLabel}</span>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:0.8rem;">
                  <span class="cred-stars">可信度: ${credStars}</span>
                  <div style="display:flex; align-items:center; gap:0.3rem;">
                    <span class="evidence-counter">📋 证据:${Math.floor(Math.random()*8)+2}项</span>
                    <button style="background:none;border:none;cursor:pointer;font-size:1.3rem;" onclick="event.stopPropagation();toggleFav('${c.id}')">${isFav ? '❤️' : '🤍'}</button>
                  </div>
                </div>
              </div>
              <!-- Quick Preview on Hover -->
              <div class="card-preview-box">
                <div class="pv-title">📁 快速预览: ${c.name}</div>
                <div class="pv-row"><strong>案件编号:</strong> ${fileNum}</div>
                <div class="pv-row"><strong>类型:</strong> ${typeLabel}</div>
                <div class="pv-row"><strong>地区:</strong> ${regionLabel}</div>
                <div class="pv-row"><strong>年代:</strong> ${c.year}</div>
                <div class="pv-row"><strong>可信度:</strong> ${credStars}</div>
                <div class="pv-row"><strong>状态:</strong> ${c.status === 'unsolved' ? '⚠ 未解' : c.status === 'solved' ? '✓ 已解' : '⚡ 争议'}</div>
              </div>
            </div>`;
            }).join('');
            // Set view mode class
            grid.classList.toggle('list-view', viewMode === 'list');
            // Re-apply selection checkbox states
            document.querySelectorAll('.card-select').forEach(cb => {
                cb.checked = selectedCompare.has(cb.getAttribute('onclick').match(/'([^']+)'/)[1]);
            });
            const pagDiv = document.getElementById('pagination');
            if (totalPages <= 1) { pagDiv.innerHTML = ''; } else {
                let html = '';
                for (let p = 1; p <= totalPages; p++) {
                    html += `<button class="page-btn ${p===currentPage?'active':''}" data-page="${p}">${p}</button>`;
                }
                pagDiv.innerHTML = html;
                pagDiv.querySelectorAll('.page-btn').forEach(b => b.addEventListener('click', function() {
                    currentPage = parseInt(this.dataset.page);
                    renderArchives();
                    window.scrollTo({ top: 300, behavior: 'smooth' });
                }));
            }
            updateBulkPanel();
        }

        window.toggleFav = function(id) {
            if (favorites.includes(id)) favorites = favorites.filter(f => f !== id);
            else favorites.push(id);
            localStorage.setItem('mysteryFavs', JSON.stringify(favorites));
            renderArchives();
        };

        window.toggleCompareSelect = function(id, checkbox) {
            if (checkbox.checked) {
                selectedCompare.add(id);
            } else {
                selectedCompare.delete(id);
            }
            // Update card visual
            const card = checkbox.closest('.archive-card');
            if (card) card.classList.toggle('selected', checkbox.checked);
            updateBulkPanel();
        };

        function updateBulkPanel() {
            const panel = document.getElementById('bulkPanel');
            const countEl = document.getElementById('bulkCount');
            const btnClear = document.getElementById('btnClearCompare');
            countEl.textContent = selectedCompare.size;
            document.getElementById('bulkPanelText').textContent = `已选择 ${selectedCompare.size} 个案件`;
            if (selectedCompare.size > 0) {
                panel.classList.add('show');
                btnClear.style.display = 'inline-block';
            } else {
                panel.classList.remove('show');
                btnClear.style.display = 'none';
            }
        }

        // Export feature
        document.getElementById('btnExport').addEventListener('click', () => {
            const filtered = getFiltered();
            if (filtered.length === 0) { showToast('没有可导出的案件'); return; }
            let text = '══════════════════════════════════\n';
            text += '  未解之谜档案馆 - 案件列表导出\n';
            text += '══════════════════════════════════\n\n';
            filtered.forEach((c, i) => {
                text += `[${getCaseNumber(casesData.indexOf(c))}] ${c.name}\n`;
                text += `类型: ${c.type} | 地区: ${c.region} | 年代: ${c.year}\n`;
                text += `可信度: ${c.credibility} | 状态: ${c.status}\n`;
                text += `位置: ${c.location}\n`;
                text += `描述: ${c.desc}\n`;
                text += `详情链接: mystery_detail.html?case=${c.id}\n`;
                text += '─'.repeat(40) + '\n';
            });
            text += `\n导出时间: ${new Date().toLocaleString()}\n`;
            text += `共 ${filtered.length} 个案件\n`;
            navigator.clipboard.writeText(text).then(() => {
                showToast('案件列表已复制到剪贴板');
            }).catch(() => {
                showToast('复制失败，请检查浏览器权限');
            });
        });

        // Bulk compare
        document.getElementById('btnBulkCompare').addEventListener('click', () => {
            if (selectedCompare.size < 2) { showToast('请至少选择 2 个案件进行对比'); return; }
            if (selectedCompare.size > 5) { showToast('最多只能对比 5 个案件'); return; }
            const ids = Array.from(selectedCompare).join(',');
            window.location.href = `compare.html?cases=${ids}`;
        });
        document.getElementById('bulkCompareGo').addEventListener('click', () => {
            document.getElementById('btnBulkCompare').click();
        });
        document.getElementById('bulkClear').addEventListener('click', () => {
            selectedCompare.clear();
            renderArchives();
            updateBulkPanel();
        });
        document.getElementById('btnClearCompare').addEventListener('click', () => {
            selectedCompare.clear();
            renderArchives();
            updateBulkPanel();
        });

        // Grid/List toggle
        document.getElementById('btnGridView').addEventListener('click', function() {
            viewMode = 'grid';
            this.classList.add('active');
            document.getElementById('btnListView').classList.remove('active');
            renderArchives();
        });
        document.getElementById('btnListView').addEventListener('click', function() {
            viewMode = 'list';
            this.classList.add('active');
            document.getElementById('btnGridView').classList.remove('active');
            renderArchives();
        });

        // Sort
        document.getElementById('sortBy').addEventListener('change', function() {
            sortMode = this.value;
            currentPage = 1;
            renderArchives();
        });

        // Filters
        ['typeFilter', 'regionFilter', 'eraFilter'].forEach(id => {
            document.getElementById(id).addEventListener('change', () => { currentPage = 1;
                renderArchives(); });
        });
        document.getElementById('credOptions').addEventListener('click', function(e) {
            if (e.target.classList.contains('cred-chip')) {
                const cred = e.target.dataset.cred;
                if (activeCred === cred) { activeCred = null;
                    e.target.classList.remove('active'); } else {
                    document.querySelectorAll('.cred-chip').forEach(c => c.classList.remove('active'));
                    activeCred = cred;
                    e.target.classList.add('active');
                }
                currentPage = 1;
                renderArchives();
            }
        });
        document.getElementById('resetFilters').addEventListener('click', () => {
            document.getElementById('typeFilter').value = 'all';
            document.getElementById('regionFilter').value = 'all';
            document.getElementById('eraFilter').value = 'all';
            activeCred = null;
            document.querySelectorAll('.cred-chip').forEach(c => c.classList.remove('active'));
            currentPage = 1;
            renderArchives();
        });

        // URL params
        const urlParams = new URLSearchParams(window.location.search);
        const searchQ = urlParams.get('search');
        const typeQ = urlParams.get('type');
        if (searchQ) {
            const filtered = casesData.filter(c => c.name.includes(searchQ) || c.desc.includes(searchQ));
            document.getElementById('archivesGrid').innerHTML = filtered.length ? '' : '<p>未找到匹配案件</p>';
        }
        if (typeQ) { document.getElementById('typeFilter').value = typeQ; }
        renderArchives();
        console.log('档案库已加载 - ' + casesData.length + ' 个案件');

        // ===== ADDITIONAL INTERACTIVE FEATURES =====

        // Scroll-to-top button visibility
        const scrollTopBtn = document.getElementById('scrollTopBtn');
        window.addEventListener('scroll', function() {
            if (window.scrollY > 500) scrollTopBtn.classList.add('show');
            else scrollTopBtn.classList.remove('show');
        });

        // Keyboard shortcuts
        window.addEventListener('keydown', function(e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
            switch(e.key.toLowerCase()) {
                case 'g':
                    if (viewMode !== 'grid') { viewMode = 'grid';
                        document.getElementById('btnGridView').classList.add('active');
                        document.getElementById('btnListView').classList.remove('active');
                        renderArchives();
                        showToast('切换到网格视图'); }
                    break;
                case 'l':
                    if (viewMode !== 'list') { viewMode = 'list';
                        document.getElementById('btnListView').classList.add('active');
                        document.getElementById('btnGridView').classList.remove('active');
                        renderArchives();
                        showToast('切换到列表视图'); }
                    break;
                case 'r':
                    document.getElementById('resetFilters').click();
                    showToast('所有筛选已重置');
                    break;
            }
        });

        // Active filter tags display
        function updateFilterTags() {
            const row = document.getElementById('activeFiltersRow');
            const tags = [];
            const typeVal = document.getElementById('typeFilter').value;
            const regionVal = document.getElementById('regionFilter').value;
            const eraVal = document.getElementById('eraFilter').value;
            const typeNames = { ufo: 'UFO事件', missing: '失踪案件', supernatural: '超自然现象', geographic: '地理异常', historical: '历史悬案', cryptid: '未知生物' };
            const regionNames = { north_america: '北美', europe: '欧洲', asia: '亚洲', south_america: '南美', oceania: '大洋洲', africa: '非洲' };
            const eraNames = { ancient: '古代', medieval: '中世纪', modern: '近代', contemporary: '现代' };
            if (typeVal !== 'all') tags.push({ label: typeNames[typeVal] || typeVal, action: () => { document.getElementById('typeFilter').value = 'all';
                    currentPage = 1;
                    renderArchives(); } });
            if (regionVal !== 'all') tags.push({ label: regionNames[regionVal] || regionVal, action: () => { document.getElementById('regionFilter').value = 'all';
                    currentPage = 1;
                    renderArchives(); } });
            if (eraVal !== 'all') tags.push({ label: eraNames[eraVal] || eraVal, action: () => { document.getElementById('eraFilter').value = 'all';
                    currentPage = 1;
                    renderArchives(); } });
            if (activeCred) tags.push({ label: '可信度: ' + (activeCred === 'high' ? '高' : activeCred === 'medium' ? '中' : activeCred === 'low' ? '低' :
                    '未知'), action: () => { activeCred = null;
                    document.querySelectorAll('.cred-chip').forEach(c => c.classList.remove('active'));
                    currentPage = 1;
                    renderArchives(); } });
            if (sortMode !== 'default') {
                const sortLabels = { name: '名称排序', date: '年代排序', credibility: '可信度排序', newest: '最新排序' };
                tags.push({ label: sortLabels[sortMode] || sortMode, action: () => { document.getElementById('sortBy').value = 'default';
                        sortMode = 'default';
                        currentPage = 1;
                        renderArchives(); } });
            }
            if (tags.length === 0) { row.innerHTML = ''; return; }
            row.innerHTML = tags.map(t =>
                `<span class="filter-tag">${t.label} <span class="remove-tag" onclick="event.stopPropagation(); arguments[0].stopPropagation();" data-clear="true">✕</span></span>`
            ).join('');
            // Attach click handlers to remove tags
            row.querySelectorAll('.remove-tag').forEach((btn, i) => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (tags[i]) tags[i].action();
                });
            });
        }

        // Wire filter tags into render cycle
        const origRenderArchives = renderArchives;
        renderArchives = function() {
            origRenderArchives();
            updateFilterTags();
        };

        // Initial filter tags
        updateFilterTags();

        // Save last search/view preferences
        window.addEventListener('beforeunload', function() {
            try {
                const prefs = { viewMode, sortMode, activeCred };
                sessionStorage.setItem('archivesPrefs', JSON.stringify(prefs));
            } catch(e) {}
        });

        // Restore preferences
        (function() {
            try {
                const savedPrefs = sessionStorage.getItem('archivesPrefs');
                if (savedPrefs) {
                    const prefs = JSON.parse(savedPrefs);
                    if (prefs.viewMode === 'list') {
                        viewMode = 'list';
                        document.getElementById('btnListView').classList.add('active');
                        document.getElementById('btnGridView').classList.remove('active');
                    }
                    if (prefs.sortMode && prefs.sortMode !== 'default') {
                        sortMode = prefs.sortMode;
                        document.getElementById('sortBy').value = sortMode;
                    }
                    if (prefs.activeCred) {
                        activeCred = prefs.activeCred;
                        document.querySelectorAll('.cred-chip').forEach(c => {
                            c.classList.toggle('active', c.dataset.cred === activeCred);
                        });
                    }
                    renderArchives();
                }
            } catch(e) {}
        })();
    </script>
</body>
</html>
