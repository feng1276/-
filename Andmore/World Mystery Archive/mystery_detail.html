<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>案件详情 · 未解之谜档案馆</title>
    <style>
        :root {
            --bg-void: #0a0a0f;
            --bg-card: rgba(18, 18, 26, 0.85);
            --glass-bg: rgba(10, 10, 20, 0.7);
            --glass-border: rgba(180, 40, 40, 0.18);
            --glass-border-bright: rgba(220, 50, 50, 0.35);
            --accent-crimson: #c0392b;
            --accent-warning: #e74c3c;
            --accent-amber: #d4a017;
            --accent-glow: rgba(220, 50, 50, 0.5);
            --text-primary: #e0d8d0;
            --text-secondary: #a09890;
            --text-muted: #6a6258;
            --border-radius-xl: 1.5rem;
            --border-radius-md: 0.7rem;
            --transition-smooth: 0.4s ease;
            --font-body: 'Crimson Text', 'Georgia', 'Noto Serif SC', serif;
            --font-heading: 'Cinzel', 'Georgia', 'Noto Serif SC', serif;
            --font-mono: 'Courier Prime', 'Courier New', monospace;
        }

        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

        /* ========== NOISE TEXTURE OVERLAY ========== */
        body::before { content:''; position:fixed; inset:0; z-index:9999; pointer-events:none; opacity:0.035; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); background-size:200px 200px; }
        body { font-family:var(--font-body); background:var(--bg-void); color:var(--text-primary); min-height:100vh; padding-bottom:4rem; }

        /* ========== CLASSIFIED WATERMARK ========== */
        .classified-stamp { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) rotate(-25deg); font-family:var(--font-heading); font-size:8rem; color:rgba(192,57,43,0.035); pointer-events:none; z-index:0; letter-spacing:1.5rem; white-space:nowrap; user-select:none; }

        /* ========== KEYFRAME ANIMATIONS ========== */
        @keyframes flickerGlow { 0%,100%{text-shadow:0 0 4px var(--accent-glow)} 14%{text-shadow:0 0 20px var(--accent-glow),0 0 35px rgba(220,50,50,0.4)} 15%{text-shadow:0 0 2px var(--accent-glow)} 45%{text-shadow:0 0 28px var(--accent-glow),0 0 55px rgba(220,50,50,0.45)} 46%{text-shadow:0 0 3px var(--accent-glow)} }
        @keyframes blinkCursor { 0%,100%{border-color:var(--accent-warning)} 50%{border-color:transparent} }
        @keyframes fadeSlideIn { from{opacity:0;transform:translateY(15px)} to{opacity:1;transform:translateY(0)} }
        @keyframes pulseGlow { 0%,100%{box-shadow:0 0 5px rgba(220,50,50,0.2)} 50%{box-shadow:0 0 25px rgba(220,50,50,0.7)} }
        @keyframes redactReveal { 0%{background:#111;color:transparent} 100%{background:transparent;color:var(--accent-warning)} }
        @keyframes dotPulse { 0%,100%{opacity:0.3} 50%{opacity:1} }

        /* ========== NAVIGATION ========== */
        .navbar { position:sticky; top:10px; margin:10px 20px; padding:0.7rem 1.8rem; display:flex; align-items:center; justify-content:space-between; background:var(--glass-bg); backdrop-filter:blur(20px); border:1px solid var(--glass-border); border-radius:3rem; z-index:300; flex-wrap:wrap; gap:1rem; }
        .logo { font-family:var(--font-heading); font-size:1.4rem; font-weight:700; letter-spacing:2px; cursor:pointer; text-transform:uppercase; }
        .logo span { color:var(--accent-warning); }
        .nav-links { display:flex; gap:1rem; list-style:none; flex-wrap:wrap; }
        .nav-links a { color:var(--text-secondary); text-decoration:none; font-size:0.8rem; letter-spacing:0.5px; text-transform:uppercase; transition:0.2s; }
        .nav-links a:hover { color:var(--accent-warning); }

        /* ========== EVIDENCE ANALYZER CANVAS ========== */
        .analyzer-wrap { position:relative; margin:0 auto 0.5rem; max-width:950px; border:1px solid var(--glass-border-bright); border-radius:var(--border-radius-md); overflow:hidden; background:#000; box-shadow:0 0 30px rgba(220,50,50,0.08); }
        .analyzer-wrap canvas { display:block; width:100%; height:200px; }
        .analyzer-label { position:absolute; bottom:10px; left:15px; font-family:var(--font-mono); font-size:0.65rem; color:var(--accent-amber); letter-spacing:2px; text-shadow:0 0 6px var(--accent-glow); }
        .analyzer-dot { position:absolute; top:10px; right:15px; width:8px; height:8px; background:#f00; border-radius:50%; animation:dotPulse 1.2s ease-in-out infinite; box-shadow:0 0 10px rgba(255,0,0,0.7); }
        .ac-tl,.ac-tr,.ac-bl,.ac-br { position:absolute; width:18px; height:18px; border-color:rgba(220,50,50,0.4); pointer-events:none; }
        .ac-tl { top:8px; left:8px; border-top:1px solid; border-left:1px solid; }
        .ac-tr { top:8px; right:8px; border-top:1px solid; border-right:1px solid; }
        .ac-bl { bottom:8px; left:8px; border-bottom:1px solid; border-left:1px solid; }
        .ac-br { bottom:8px; right:8px; border-bottom:1px solid; border-right:1px solid; }

        /* ========== DETAIL CONTAINER ========== */
        .detail-container { max-width:950px; margin:1.5rem auto; padding:0 1.5rem; position:relative; z-index:1; }
        .case-hero { background:var(--bg-card); backdrop-filter:blur(15px); border:1px solid var(--glass-border); border-radius:var(--border-radius-xl); padding:2.5rem; margin-bottom:2rem; display:flex; gap:2rem; flex-wrap:wrap; align-items:center; box-shadow:0 8px 30px rgba(0,0,0,0.5); position:relative; overflow:hidden; }
        .case-hero::after { content:'CLASSIFIED'; position:absolute; right:-20px; bottom:-20px; font-family:var(--font-heading); font-size:4rem; color:rgba(192,57,43,0.05); letter-spacing:1rem; pointer-events:none; }
        .case-hero .case-icon-large { font-size:5rem; text-shadow:0 0 30px var(--accent-glow); }
        .case-hero h1 { font-family:var(--font-heading); font-size:2.2rem; letter-spacing:2px; text-transform:uppercase; }
        .flicker-text { animation:flickerGlow 5s infinite; }
        .case-meta { display:flex; gap:1rem; flex-wrap:wrap; margin-top:0.8rem; }
        .case-meta span { padding:0.3rem 1rem; border-radius:2rem; font-size:0.75rem; letter-spacing:1px; background:rgba(220,50,50,0.1); border:1px solid rgba(220,50,50,0.3); color:var(--accent-warning); }

        /* ========== STATUS BADGES ========== */
        .status-badge { display:inline-block; padding:0.25rem 0.8rem; border-radius:2rem; font-family:var(--font-mono); font-size:0.7rem; letter-spacing:2px; text-transform:uppercase; }
        .status-badge.unsolved { background:rgba(220,50,50,0.2); color:var(--accent-warning); border:1px solid rgba(220,50,50,0.4); }
        .status-badge.contested { background:rgba(212,160,23,0.15); color:var(--accent-amber); border:1px solid rgba(212,160,23,0.3); }
        .status-badge.closed { background:rgba(100,100,100,0.2); color:var(--text-muted); border:1px solid rgba(100,100,100,0.3); }

        /* ========== DOSSIER CORNER ========== */
        .doc-corner { position:absolute; top:15px; right:20px; font-family:var(--font-mono); font-size:0.6rem; color:var(--text-muted); letter-spacing:3px; opacity:0.55; }

        /* ========== TAB NAVIGATION ========== */
        .tab-nav { display:flex; gap:0.2rem; margin-bottom:1.5rem; flex-wrap:wrap; border-bottom:1px solid var(--glass-border-bright); }
        .tab-btn { padding:0.65rem 1.3rem; background:transparent; border:1px solid transparent; color:var(--text-muted); font-family:var(--font-mono); font-size:0.78rem; letter-spacing:1px; cursor:pointer; transition:0.3s; border-radius:0.5rem 0.5rem 0 0; text-transform:uppercase; position:relative; }
        .tab-btn:hover { color:var(--accent-amber); border-color:var(--glass-border); }
        .tab-btn.active { color:var(--accent-warning); border-color:var(--glass-border-bright) var(--glass-border-bright) transparent; background:var(--bg-card); text-shadow:0 0 8px var(--accent-glow); }
        .tab-btn.active::after { content:''; position:absolute; bottom:-1px; left:0; right:0; height:2px; background:var(--bg-card); }
        .tab-panel { display:none; }
        .tab-panel.active { display:block; animation:fadeSlideIn 0.5s ease; }

        /* ========== SECTION CARD ========== */
        .section-card { background:var(--bg-card); backdrop-filter:blur(12px); border:1px solid var(--glass-border); border-radius:var(--border-radius-xl); padding:2rem; margin-bottom:1.5rem; box-shadow:0 4px 20px rgba(0,0,0,0.4); position:relative; }
        .section-card h2 { font-family:var(--font-heading); color:var(--accent-warning); letter-spacing:2px; margin-bottom:1.2rem; font-size:1.3rem; border-bottom:1px solid var(--glass-border); padding-bottom:0.6rem; }
        .section-card p { color:var(--text-secondary); line-height:1.8; margin-bottom:1rem; text-indent:2em; }

        /* ========== TYPEWRITER ========== */
        .typewriter-line { display:inline-block; border-right:2px solid var(--accent-warning); animation:blinkCursor 0.85s steps(1) infinite; padding-right:3px; }

        /* ========== REDACTED TEXT ========== */
        .redacted { background:#111; color:transparent; padding:0 0.4rem; border-radius:3px; user-select:none; cursor:pointer; position:relative; transition:0.5s; display:inline-block; }
        .redacted::before { content:'[REDACTED]'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:0.6rem; color:var(--text-muted); letter-spacing:2px; transition:0.3s; }
        .redacted:hover::before { opacity:0.6; }
        .redacted.revealed { background:transparent; color:var(--accent-warning); text-shadow:0 0 8px var(--accent-glow); animation:redactReveal 0.6s ease forwards; }
        .redacted.revealed::before { opacity:0; }

        /* ========== KEY FACTS TABLE ========== */
        .facts-table { width:100%; border-collapse:collapse; font-family:var(--font-mono); font-size:0.85rem; margin:1rem 0; }
        .facts-table th,.facts-table td { padding:0.65rem 1rem; border-bottom:1px solid var(--glass-border); text-align:left; }
        .facts-table th { color:var(--accent-amber); letter-spacing:1px; width:28%; font-size:0.78rem; }
        .facts-table td { color:var(--text-secondary); }

        /* ========== TIMELINE ========== */
        .timeline-vertical { position:relative; padding-left:2rem; border-left:2px solid var(--glass-border-bright); margin:1.5rem 0; }
        .timeline-vertical .tl-item { position:relative; margin-bottom:1.5rem; padding-left:1.5rem; }
        .timeline-vertical .tl-item::before { content:''; position:absolute; left:-2.35rem; top:0.4rem; width:12px; height:12px; background:var(--accent-crimson); border-radius:50%; box-shadow:0 0 15px var(--accent-glow); }
        .timeline-vertical .tl-item .tl-date { font-family:var(--font-mono); color:var(--accent-amber); font-size:0.85rem; letter-spacing:1px; }

        /* ========== EVIDENCE GRID ========== */
        .evidence-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:1rem; margin:1rem 0; }
        .evidence-item { background:rgba(220,50,50,0.05); border:1px solid var(--glass-border); border-radius:var(--border-radius-md); padding:1rem; text-align:center; transition:all var(--transition-smooth); }
        .evidence-item:hover { border-color:var(--accent-warning); background:rgba(220,50,50,0.1); transform:translateY(-2px); box-shadow:0 6px 20px rgba(220,50,50,0.1); }
        .evidence-item .evidence-icon { font-size:2rem; display:block; margin-bottom:0.5rem; }
        .evidence-item .evidence-label { font-family:var(--font-mono); font-size:0.75rem; color:var(--text-muted); letter-spacing:1px; }

        /* ========== THEORIES ========== */
        .theories-list { list-style:none; padding:0; }
        .theories-list li { padding:0.8rem 1rem; border-bottom:1px solid var(--glass-border); color:var(--text-secondary); cursor:pointer; transition:all var(--transition-smooth); display:flex; justify-content:space-between; align-items:center; }
        .theories-list li:hover { background:rgba(220,50,50,0.05); color:var(--text-primary); }
        .theory-bar { height:4px; background:rgba(220,50,50,0.2); border-radius:2px; margin-top:4px; }
        .theory-bar-fill { height:100%; border-radius:2px; background:var(--accent-warning); transition:width 0.8s ease; }
        .theory-votes { font-family:var(--font-mono); color:var(--accent-amber); font-size:0.8rem; min-width:45px; text-align:right; }

        /* ========== WITNESS CARDS ========== */
        .witness-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:1rem; margin:1rem 0; }
        .witness-card { background:rgba(212,160,23,0.04); border:1px solid var(--glass-border); border-radius:var(--border-radius-md); padding:1.2rem; border-left:3px solid var(--accent-crimson); }
        .witness-card .witness-name { font-family:var(--font-heading); color:var(--accent-amber); font-size:1rem; }
        .witness-card .witness-text { font-size:0.82rem; color:var(--text-secondary); margin-top:0.5rem; font-style:italic; line-height:1.6; }

        /* ========== GALLERY ========== */
        .gallery-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:1rem; margin:1rem 0; }
        .gallery-item { border:1px solid var(--glass-border); border-radius:var(--border-radius-md); overflow:hidden; background:rgba(0,0,0,0.3); transition:all var(--transition-smooth); }
        .gallery-item:hover { border-color:var(--accent-amber); transform:scale(1.03); box-shadow:0 8px 28px rgba(220,50,50,0.12); }
        .gallery-item img { width:100%; height:165px; object-fit:cover; display:block; transition:0.5s; opacity:0.8; }
        .gallery-item:hover img { opacity:1; transform:scale(1.06); }
        .gallery-item .gallery-cap { padding:0.5rem 0.6rem; font-size:0.7rem; color:var(--text-muted); text-align:center; font-family:var(--font-mono); letter-spacing:0.5px; background:rgba(0,0,0,0.5); }
        .gallery-fb { display:none; height:165px; background:rgba(0,0,0,0.3); align-items:center; justify-content:center; font-size:3rem; }

        /* ========== RELATED CASES ========== */
        .related-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:1rem; margin:1rem 0; }
        .related-case { background:rgba(0,0,0,0.2); border:1px solid var(--glass-border); border-radius:var(--border-radius-md); padding:1rem; text-align:center; transition:all var(--transition-smooth); text-decoration:none; color:inherit; display:block; }
        .related-case:hover { border-color:var(--accent-warning); transform:translateY(-3px); box-shadow:0 6px 20px rgba(220,50,50,0.15); }
        .related-case .rc-icon { font-size:2rem; display:block; }
        .related-case .rc-name { font-family:var(--font-heading); font-size:0.9rem; margin-top:0.5rem; color:var(--accent-amber); }

        /* ========== MYSTERY METER ========== */
        .mystery-meter { background:rgba(0,0,0,0.3); border:1px solid var(--glass-border); border-radius:var(--border-radius-md); padding:1.5rem; margin:1rem 0; text-align:center; }
        .mystery-meter h3 { color:var(--accent-amber); font-family:var(--font-heading); font-size:1rem; margin-bottom:1rem; }
        .meter-row { display:flex; justify-content:space-between; align-items:center; margin:0.5rem 0; font-size:0.82rem; color:var(--text-secondary); }
        .meter-row .meter-label { width:120px; text-align:right; }
        .meter-row .meter-track { flex:1; height:8px; background:rgba(220,50,50,0.1); border-radius:4px; margin:0 12px; overflow:hidden; }
        .meter-row .meter-fill { height:100%; border-radius:4px; transition:width 1s ease; }
        .meter-row .meter-val { width:45px; font-family:var(--font-mono); font-size:0.75rem; color:var(--accent-amber); text-align:left; }

        /* ========== QUICK STATS ========== */
        .quick-stats-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:0.8rem; margin:1rem 0; }
        .quick-stat { background:rgba(0,0,0,0.2); border:1px solid var(--glass-border); border-radius:var(--border-radius-md); padding:1rem; text-align:center; }
        .quick-stat .qs-value { font-family:var(--font-heading); font-size:1.5rem; color:var(--accent-amber); }
        .quick-stat .qs-label { font-size:0.7rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; margin-top:2px; }
        .pulse-glow { animation:pulseGlow 2.5s infinite; }

        /* ========== BACK LINKS ========== */
        .back-link { display:inline-block; margin-top:1rem; color:var(--accent-amber); text-decoration:none; font-family:var(--font-mono); letter-spacing:1px; transition:0.2s; }
        .back-link:hover { color:var(--accent-warning); text-shadow:0 0 10px var(--accent-glow); }

        @media (max-width:600px) { .case-hero { flex-direction:column; text-align:center; } .classified-stamp { font-size:3.5rem; letter-spacing:0.5rem; } .tab-btn { font-size:0.6rem; padding:0.45rem 0.6rem; letter-spacing:0.5px; } .analyzer-wrap canvas { height:130px; } }

    <!-- EVIDENCE ANALYZER CANVAS -->
    <div class="analyzer-wrap pulse-glow">
        <canvas id="evidenceCanvas"></canvas>
        <div class="ac-tl"></div><div class="ac-tr"></div>
        <div class="ac-bl"></div><div class="ac-br"></div>
        <span class="analyzer-label">EVIDENCE ANALYZER // LIVE FEED</span>

    </div>

    <script>
        // ============ EVIDENCE ANALYZER CANVAS ANIMATION ============
        (function(){
            const canvas=document.getElementById('evidenceCanvas');
            if(!canvas)return;
            const ctx=canvas.getContext('2d');
            let particles=[];const MAX_P=70;

            function resize(){canvas.width=canvas.parentElement.clientWidth;canvas.height=200;initParticles();}
            resize();window.addEventListener('resize',resize);

            function initParticles(){
                particles=[];
                for(let i=0;i<MAX_P;i++){
                    particles.push({
                        x:Math.random()*canvas.width,
                        y:Math.random()*canvas.height,
                        vx:(Math.random()-0.5)*1.0,
                        vy:(Math.random()-0.5)*1.0,
                        size:Math.random()*2+0.4,
                        alpha:Math.random()*0.5+0.1,
                        pulse:Math.random()*Math.PI*2
                    });
                }
            }

            let scanY=0,scanDir=1;
            function draw(ts){
                ctx.fillStyle='rgba(0,0,5,0.18)';ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.strokeStyle='rgba(192,57,43,0.05)';ctx.lineWidth=0.5;
                const gs=22;
                for(let x=0;x<canvas.width;x+=gs){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke();}
                for(let y=0;y<canvas.height;y+=gs){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();}
                for(let p of particles){
                    p.x+=p.vx;p.y+=p.vy;
                    if(p.x<0)p.x=canvas.width;if(p.x>canvas.width)p.x=0;
                    if(p.y<0)p.y=canvas.height;if(p.y>canvas.height)p.y=0;
                    const fl=Math.sin(ts*0.008+p.pulse)*0.35+0.65,a=p.alpha*fl;
                    ctx.fillStyle='rgba(220,50,50,'+a+')';ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
                    ctx.fillStyle='rgba(220,50,50,'+(a*0.25)+')';ctx.beginPath();ctx.arc(p.x,p.y,p.size*3.5,0,Math.PI*2);ctx.fill();
                }
                for(let i=0;i<particles.length;i++)for(let j=i+1;j<particles.length;j++){
                    const dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y,dist=Math.sqrt(dx*dx+dy*dy);
                    if(dist<75){ctx.strokeStyle='rgba(220,50,50,'+(0.07*(1-dist/75))+')';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(particles[j].x,particles[j].y);ctx.stroke();}
                }
                scanY+=scanDir*1.3;if(scanY>canvas.height){scanY=canvas.height;scanDir=-1;}if(scanY<0){scanY=0;scanDir=1;}
                const grad=ctx.createLinearGradient(0,scanY-12,0,scanY+12);
                grad.addColorStop(0,'rgba(220,50,50,0)');grad.addColorStop(0.5,'rgba(220,50,50,0.25)');grad.addColorStop(1,'rgba(220,50,50,0)');
                ctx.fillStyle=grad;ctx.fillRect(0,scanY-12,canvas.width,24);
                ctx.strokeStyle='rgba(220,50,50,0.45)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,scanY);ctx.lineTo(canvas.width,scanY);ctx.stroke();
                requestAnimationFrame(draw);
            }
            requestAnimationFrame(draw);
        })();

        // ============ CASE DATABASE (22 CASES) ============
        const detailDB={
            // CASE 01: BERMUDA TRIANGLE

        '<div class="case-hero">'+
          '<span class="case-icon-large pulse-glow">'+data.icon+'</span>'+
          '<div style="flex:1;">'+
            '<h1 class="flicker-text">'+data.name+'</h1>'+
            '<div class="case-meta">'+
              '<span>&#x1F4C2; '+data.type+'</span>'+
              '<span>&#x1F4CD; '+data.location+'</span>'+
              '<span>&#x1F4C5; '+data.era+'</span>'+
              '<span class="status-badge '+sCls+'">'+(data.status||'未解')+'</span>'+
            '</div>'+
            '<p style="margin-top:0.8rem;color:var(--accent-amber);font-family:var(--font-mono);">'+
              '可信度: '+data.credibility+' &nbsp;|&nbsp; <span class="typewriter-line">'+dsNum+'</span>'+
            '</p>'+
          '</div>'+
          '<span class="doc-corner">DOSSIER NO. '+dsNum+'</span>'+
        '</div>'+

        '<!-- TAB NAVIGATION -->'+
        '<div class="tab-nav">'+
          '<button class="tab-btn active" data-tab="tab-overview">案件概述</button>'+
          '<button class="tab-btn" data-tab="tab-evidence">证据材料</button>'+
          '<button class="tab-btn" data-tab="tab-theories">理论分析</button>'+
          '<button class="tab-btn" data-tab="tab-timeline">时间线</button>'+
          '<button class="tab-btn" data-tab="tab-gallery">档案图库</button>'+
        '</div>'+

        '<!-- TAB: OVERVIEW -->'+
        '<div class="tab-panel active" id="tab-overview">'+
          '<div class="section-card">'+
            '<h2>&#x1F4CB; 案件概述</h2>'+
            '<p>'+data.description+'</p>'+
            '<div class="mystery-meter"><h3>&#x1F39A; 神秘度评估</h3>'+
              '<div class="meter-row"><span class="meter-label">神秘指数</span><div class="meter-track"><div class="meter-fill" style="width:'+data.metrics.mystery+'%;background:var(--accent-warning);"></div></div><span class="meter-val">'+data.metrics.mystery+'/100</span></div>'+
              '<div class="meter-row"><span class="meter-label">证据充足度</span><div class="meter-track"><div class="meter-fill" style="width:'+data.metrics.evidence+'%;background:var(--accent-amber);"></div></div><span class="meter-val">'+data.metrics.evidence+'/100</span></div>'+
              '<div class="meter-row"><span class="meter-label">公众关注度</span><div class="meter-track"><div class="meter-fill" style="width:'+data.metrics.attention+'%;background:#ff6b6b;"></div></div><span class="meter-val">'+data.metrics.attention+'/100</span></div>'+
              '<div class="meter-row"><span class="meter-label">科学共识度</span><div class="meter-track"><div class="meter-fill" style="width:'+data.metrics.consensus+'%;background:#4ecb71;"></div></div><span class="meter-val">'+data.metrics.consensus+'/100</span></div>'+
            '</div>'+
          '</div>'+
          '<div class="section-card">'+
            '<h2>&#x1F4CA; 案件数据</h2>'+
            '<div class="quick-stats-row">'+
              '<div class="quick-stat"><div class="qs-value">'+(data.timeline||[]).length+'</div><div class="qs-label">关键事件</div></div>'+
              '<div class="quick-stat"><div class="qs-value">'+(data.theories||[]).length+'</div><div class="qs-label">理论假说</div></div>'+
              '<div class="quick-stat"><div class="qs-value">'+(data.evidence||[]).length+'</div><div class="qs-label">证据条目</div></div>'+
              '<div class="quick-stat"><div class="qs-value">'+(data.witnesses||[]).length+'</div><div class="qs-label">关键证词</div></div>'+
            '</div>'+
          '</div>'+
          '<div class="section-card"><h2>&#x1F4DC; 背景资料</h2><p>'+data.background+'</p></div>'+
          '<div class="section-card"><h2>&#x1F4CA; 关键事实</h2>'+buildKeyFacts(data.keyFacts)+'</div>'+
          ((data.witnesses||[]).length>0?'<div class="section-card"><h2>&#x1F5E3; 目击者 / 证人证词</h2>'+buildWitnesses(data.witnesses)+'</div>':'')+
          '<div class="section-card"><h2>&#x1F517; 相关案件</h2>'+buildRelated(data.related)+'</div>'+
          '<div style="text-align:center;margin:1rem 0;">'+
            '<p style="font-family:var(--font-mono);font-size:0.7rem;color:var(--text-muted);">'+
              '[ 档案状态: 开放调查中 &mdash; 最后更新: <span class="redacted" title="点击揭示">'+(new Date().toISOString().split('T')[0])+'</span> ]'+
            '</p>'+
          '</div>'+
        '</div>'+

        '<!-- TAB: EVIDENCE -->'+
        '<div class="tab-panel" id="tab-evidence">'+
          '<div class="section-card"><h2>&#x1F50D; 证据材料</h2>'+buildEvidence(data.evidence)+'</div>'+
          '<div class="section-card"><h2>&#x1F5E3; 目击者证词</h2>'+buildWitnesses(data.witnesses)+'</div>'+
          '<div class="section-card"><h2>&#x1F4CA; 关键数据点</h2>'+buildKeyFacts(data.keyFacts)+'</div>'+
        '</div>'+

        '<!-- TAB: THEORIES -->'+
        '<div class="tab-panel" id="tab-theories">'+
          '<div class="section-card"><h2>&#x1F4A1; 主要理论分析</h2>'+buildTheories(data.theories,data.theoryWeights)+'</div>'+
          '<div class="section-card"><h2>&#x1F517; 相关案件</h2>'+buildRelated(data.related)+'</div>'+
        '</div>'+

        '<!-- TAB: TIMELINE -->'+
        '<div class="tab-panel" id="tab-timeline">'+
          '<div class="section-card"><h2>&#x1F570; 事件时间线</h2>'+buildTimeline(data.timeline)+'</div>'+
        '</div>'+

        '<!-- TAB: GALLERY -->'+
        '<div class="tab-panel" id="tab-gallery">'+
          '<div class="section-card"><h2>&#x1F4F7; 档案图像</h2>'+buildGallery(data.photos,data.icon)+'</div>'+
        '</div>'+

        '<!-- FOOTER LINKS -->'+
        '<a href="archives.html" class="back-link">&#x2190; 返回档案库</a>'+
        '<a href="compare.html?caseA='+caseId+'" class="back-link" style="margin-left:1.5rem;">&#x2696; 对比此案件</a>'+
        '<a href="map.html" class="back-link" style="margin-left:1.5rem;">&#x1F5FA; 世界地图</a>';

        // ============ TAB SWITCHING ============
        document.querySelectorAll('.tab-btn').forEach(btn=>{
            btn.addEventListener('click',()=>{
                document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
                btn.classList.add('active');
                document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
                const panel=document.getElementById(btn.dataset.tab);
                if(panel)panel.classList.add('active');
            });
        });

        // ============ REDACTED TEXT CLICK TO REVEAL ============
        document.querySelectorAll('.redacted').forEach(el=>{
            el.addEventListener('click',()=>el.classList.toggle('revealed'));
        });

        // ============ THEORY VOTING ============
        window.voteTheory=function(idx){
            const li=document.getElementById('theory-'+idx);
            if(!li)return;
            const vEl=li.querySelector('.theory-votes');
            if(vEl.textContent.includes('✓'))return;
            vEl.textContent+=' ✓';
            li.style.color='var(--accent-warning)';
        };

        // ============ UPDATE DOCUMENT TITLE ============
        document.title=data.name+' · 未解之谜档案馆';
        console.log('DOSSIER: '+dsNum+' | 案件: '+data.name+' | 共 '+Object.keys(detailDB).length+' 个案件可用');
    </script>
</body>
</html>
