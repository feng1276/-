    <style>
        :root{--red-curtain:#8b1a1a;--red-deep:#6b1010;--red-velvet:#a52a2a;--red-bright:#c0392b;--red-dark:#3d0808;--gold-trim:#d4a853;--gold-light:#e8d5a0;--gold-dark:#a07830;--black-stage:#1a1a1a;--text-primary:#1a1410;--text-secondary:#3d3028;--text-muted:#7a6b5d;--text-on-dark:#f0e8d8;--text-on-red:#ffe8e0;--bg-body:#fdf9f4;--bg-card:#fffdf9;--border-gold:#c9a84c;--shadow-xs:0 1px 3px rgba(26,20,16,0.04);--shadow-sm:0 2px 8px rgba(26,20,16,0.06);--radius-sm:4px;--radius-lg:14px;--radius-xl:20px;--transition-fast:0.2s ease;--transition-smooth:0.35s cubic-bezier(0.4,0,0.2,1);--font-heading:'Playfair Display','Georgia','Noto Serif SC',serif;--font-body:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;--font-mono:'SF Mono','Consolas',monospace;}
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:var(--font-body);background:var(--bg-body);color:var(--text-primary);min-height:100vh;padding-bottom:3rem;line-height:1.6;}
        .navbar{position:sticky;top:0;z-index:100;background:rgba(26,26,26,0.96);backdrop-filter:blur(16px);border-bottom:2px solid var(--gold-trim);padding:0.7rem 2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;}
        .logo{display:flex;align-items:center;gap:0.5rem;cursor:pointer;text-decoration:none;}.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--red-curtain),var(--red-dark));border:1px solid var(--gold-trim);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:var(--gold-light);}.logo-text{font-family:var(--font-heading);font-size:1.2rem;font-weight:700;color:var(--gold-light);}
        .nav-links{display:flex;gap:1rem;list-style:none;flex-wrap:wrap;}.nav-links a{color:#c0b8a8;text-decoration:none;font-weight:500;font-size:0.78rem;transition:color var(--transition-fast);border-bottom:2px solid transparent;}.nav-links a:hover{color:var(--gold-light);border-bottom-color:var(--gold-trim);}.nav-links a.active{color:var(--gold-light);font-weight:600;border-bottom-color:var(--red-bright);}
        .page-header{text-align:center;padding:2.5rem 1rem 1rem;}.page-header h1{font-family:var(--font-heading);font-size:2.5rem;color:var(--text-primary);}
        .container{max-width:1100px;margin:0 auto;padding:0 1.5rem;}
        .glossary-section{background:var(--bg-card);border:2px solid var(--border-gold);border-radius:var(--radius-xl);padding:2.5rem;margin-bottom:2rem;box-shadow:var(--shadow-xs);}
        .glossary-section h2{font-family:var(--font-heading);font-size:1.5rem;color:var(--red-curtain);margin-bottom:1.2rem;}
        .glossary-section p{color:var(--text-secondary);line-height:2;font-size:0.95rem;text-indent:2em;margin-bottom:0.8rem;}
        .term-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1rem;}
        .term-card{background:var(--bg-card);border:1px solid var(--border-gold);border-radius:var(--radius-lg);padding:1.2rem 1.5rem;transition:all var(--transition-smooth);}.term-card:hover{box-shadow:var(--shadow-sm);}
        .term-card .term-name{font-family:var(--font-heading);font-weight:700;color:var(--red-curtain);font-size:1.05rem;}.term-card .term-def{font-size:0.85rem;color:var(--text-secondary);margin-top:0.3rem;line-height:1.6;}
        .season-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.2rem;}
        .season-card{background:var(--bg-card);border:1px solid var(--border-gold);border-radius:var(--radius-lg);padding:1.5rem;text-align:center;}.season-card h4{font-family:var(--font-heading);color:var(--red-curtain);}.season-card p{font-size:0.85rem;color:var(--text-muted);}
        @media(max-width:768px){.term-grid{grid-template-columns:1fr;}}
    </style>

<body>
    <nav class="navbar"><a href="theatre_home.html" class="logo"><span class="logo-icon">🎭</span><span class="logo-text">TheatreAtlas</span></a><ul class="nav-links"><li><a href="theatre_home.html">首页</a></li><li><a href="theatre_opera1.html">歌剧(上)</a></li><li><a href="theatre_opera2.html">歌剧(下)</a></li><li><a href="theatre_drama1.html">戏剧(上)</a></li><li><a href="theatre_drama2.html">戏剧(下)</a></li><li><a href="theatre_east.html">东方戏剧</a></li><li><a href="theatre_craft.html">舞台艺术</a></li><li><a href="theatre_glossary.html" class="active">术语资料</a></li></ul></nav>

    <div class="page-header"><h1>📖 术语与资料</h1><p style="color:var(--text-muted);font-style:italic;">歌剧术语 · 戏剧词汇 · 剧院名录 · 演出季日历</p></div>

    <div class="container">
        <div class="glossary-section"><h2>📚 歌剧术语词汇表</h2><div class="term-grid" id="termGrid"></div></div>
        <div class="glossary-section"><h2>🎭 戏剧术语词汇表</h2><div class="term-grid" id="dramaTermGrid"></div></div>
        <div class="glossary-section"><h2>📅 世界著名歌剧节与演出季</h2><div class="season-grid" id="seasonGrid"></div></div>
    </div>

    <script>
        const operaTerms=[{name:'咏叹调(Aria)',def:'歌剧中角色抒发情感的独唱段落，通常旋律优美，是歌剧中最引人注目的部分。例如《茶花女》中的《饮酒歌》。'},{name:'宣叙调(Recitative)',def:'模仿说话音调的歌剧唱法，用于推进剧情和对白。节奏自由，伴奏简单。'},{name:'重唱(Ensemble)',def:'两个或以上角色同时演唱的段落。莫扎特以精妙的重唱写作著称，不同角色在同一时间表达各自的情感。'},{name:'合唱(Chorus)',def:'群众演员演唱的段落，通常代表民众、士兵等群体角色。威尔第歌剧中合唱常表达民族情感。'},{name:'序曲(Overture)',def:'歌剧开场时演奏的管弦乐曲，通常概括歌剧的主题旋律。罗西尼的序曲以渐强效果闻名。'},{name:'女高音(Soprano)',def:'女性最高音域。花腔女高音擅长快速音阶和装饰音，抒情女高音音色温暖，戏剧女高音音量大、表现力强。'},{name:'男高音(Tenor)',def:'男性最高音域。抒情男高音适合浪漫角色，戏剧男高音音量大，适合英雄角色。帕瓦罗蒂是著名男高音。'},{name:'指挥(Conductor)',def:'歌剧中统领乐队和歌手的音乐总监。指挥控制速度、平衡和整体艺术效果。卡拉扬是20世纪著名歌剧指挥。'}];
        document.getElementById('termGrid').innerHTML=operaTerms.map(t=>`<div class="term-card"><span class="term-name">${t.name}</span><p class="term-def">${t.def}</p></div>`).join('');
        const dramaTerms=[{name:'独白(Soliloquy)',def:'角色独自在舞台上表达的内心思想。哈姆雷特的"生存还是毁灭"是最著名的独白。'},{name:'第四面墙(Fourth Wall)',def:'舞台与观众之间的隐形屏障。打破第四面墙指角色直接对观众说话。'},{name:'间离效果(Verfremdungseffekt)',def:'布莱希特提出的戏剧理论——通过打断观众沉浸感，促使他们理性思考戏剧内容。'},{name:'三一律(Three Unities)',def:'亚里士多德提出的戏剧原则：时间统一（24小时内）、地点统一（同一地点）、行动统一（单一情节）。'},{name:'悲剧(Tragedy)',def:'以严肃主题和不幸结局为特征的戏剧类型。亚里士多德认为悲剧通过怜悯和恐惧净化观众情感。'},{name:'喜剧(Comedy)',def:'以幽默和幸福结局为特征的戏剧类型。莫里哀将性格喜剧推向高峰。'}];
        document.getElementById('dramaTermGrid').innerHTML=dramaTerms.map(t=>`<div class="term-card"><span class="term-name">${t.name}</span><p class="term-def">${t.def}</p></div>`).join('');
        const seasons=[{name:'萨尔茨堡音乐节',location:'奥地利萨尔茨堡',period:'每年7-8月',desc:'世界最著名音乐节之一，莫扎特故乡。'},{name:'拜罗伊特音乐节',location:'德国拜罗伊特',period:'每年7-8月',desc:'专门上演瓦格纳歌剧的节日。'},{name:'维罗纳歌剧节',location:'意大利维罗纳',period:'每年6-9月',desc:'在古罗马竞技场演出歌剧。'},{name:'格莱德伯恩歌剧节',location:'英国东萨塞克斯',period:'每年5-8月',desc:'乡间庄园中的歌剧盛宴。'}];
        document.getElementById('seasonGrid').innerHTML=seasons.map(s=>`<div class="season-card"><h4>${s.name}</h4><p>📍 ${s.location}</p><p>📅 ${s.period}</p><p style="font-size:0.8rem;color:var(--text-muted);">${s.desc}</p></div>`).join('');
    </script>
</body>
