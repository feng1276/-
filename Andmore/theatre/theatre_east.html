    <title>东方戏剧 · TheatreAtlas</title>
    <meta name="description" content="TheatreAtlas东方戏剧专题，收录京剧、昆曲、歌舞伎、能乐、文乐、印度梵剧、卡塔卡利舞剧、皮影戏等10种亚洲传统戏剧形式的详细介绍。">
    <style>
        :root{--red-curtain:#8b1a1a;--red-deep:#6b1010;--red-velvet:#a52a2a;--red-bright:#c0392b;--red-dark:#3d0808;--gold-trim:#d4a853;--gold-light:#e8d5a0;--gold-dark:#a07830;--black-stage:#1a1a1a;--text-primary:#1a1410;--text-secondary:#3d3028;--text-muted:#7a6b5d;--text-on-dark:#f0e8d8;--text-on-red:#ffe8e0;--bg-body:#fdf9f4;--bg-card:#fffdf9;--border-gold:#c9a84c;--shadow-xs:0 1px 3px rgba(26,20,16,0.04);--shadow-sm:0 2px 8px rgba(26,20,16,0.06);--shadow-hover:0 12px 35px rgba(139,26,26,0.2);--radius-sm:4px;--radius-lg:14px;--radius-xl:20px;--transition-fast:0.2s ease;--transition-smooth:0.35s cubic-bezier(0.4,0,0.2,1);--font-heading:'Playfair Display','Georgia','Noto Serif SC',serif;--font-body:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;}
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:var(--font-body);background:var(--bg-body);color:var(--text-primary);min-height:100vh;padding-bottom:3rem;line-height:1.6;}
        .navbar{position:sticky;top:0;z-index:100;background:rgba(26,26,26,0.96);backdrop-filter:blur(16px);border-bottom:2px solid var(--gold-trim);padding:0.7rem 2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;}
        .logo{display:flex;align-items:center;gap:0.5rem;cursor:pointer;text-decoration:none;}.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--red-curtain),var(--red-dark));border:1px solid var(--gold-trim);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:var(--gold-light);}.logo-text{font-family:var(--font-heading);font-size:1.2rem;font-weight:700;color:var(--gold-light);}
        .nav-links{display:flex;gap:1rem;list-style:none;flex-wrap:wrap;}.nav-links a{color:#c0b8a8;text-decoration:none;font-weight:500;font-size:0.78rem;transition:color var(--transition-fast);border-bottom:2px solid transparent;}.nav-links a:hover{color:var(--gold-light);border-bottom-color:var(--gold-trim);}.nav-links a.active{color:var(--gold-light);font-weight:600;border-bottom-color:var(--red-bright);}
        .page-header{text-align:center;padding:2.5rem 1rem 1rem;}.page-header h1{font-family:var(--font-heading);font-size:2.5rem;color:var(--text-primary);}
        .container{max-width:1200px;margin:0 auto;padding:0 1.5rem;}
        .east-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(450px,1fr));gap:2rem;}
        .east-card{background:var(--bg-card);border:2px solid var(--border-gold);border-radius:var(--radius-xl);overflow:hidden;box-shadow:var(--shadow-xs);transition:all var(--transition-smooth);}.east-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-4px);}
        .east-card .card-head{background:linear-gradient(135deg,var(--red-dark),var(--red-curtain));padding:1.5rem;color:var(--text-on-red);}.east-card .card-head h3{font-family:var(--font-heading);font-size:1.4rem;}.east-card .card-head .region{font-size:0.85rem;opacity:0.85;}
        .east-card .card-body{padding:2rem;}.east-card .card-body p{color:var(--text-secondary);line-height:1.9;font-size:0.9rem;text-indent:2em;margin:0.5rem 0;}
        .east-card .card-body .features{list-style:none;padding:0;margin:0.8rem 0;}.east-card .card-body .features li{padding:0.4rem 0;border-bottom:1px solid rgba(0,0,0,0.04);color:var(--text-secondary);font-size:0.88rem;}.east-card .card-body .features li::before{content:'◆ ';color:var(--gold-dark);}
        @media(max-width:768px){.east-grid{grid-template-columns:1fr;}}
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar"><a href="theatre_home.html" class="logo"><span class="logo-icon">🎭</span><span class="logo-text">TheatreAtlas</span></a><ul class="nav-links"><li><a href="theatre_home.html">首页</a></li><li><a href="theatre_opera1.html">歌剧(上)</a></li><li><a href="theatre_opera2.html">歌剧(下)</a></li><li><a href="theatre_drama1.html">戏剧(上)</a></li><li><a href="theatre_drama2.html">戏剧(下)</a></li><li><a href="theatre_east.html" class="active">东方戏剧</a></li><li><a href="theatre_craft.html">舞台艺术</a></li><li><a href="theatre_glossary.html">术语资料</a></li></ul></nav>

    <div class="page-header"><h1>🏮 东方戏剧</h1><p style="color:var(--text-muted);font-style:italic;">京剧 · 昆曲 · 歌舞伎 · 能乐 · 文乐 · 梵剧 · 卡塔卡利 · 皮影戏</p></div>

    <div class="container"><div class="east-grid" id="eastGrid"></div></div>

    <script>
        const eastTheatre=[{name:'京剧',region:'中国',era:'形成于18世纪末',desc:'京剧是中国影响力最大的戏曲剧种，被誉为"国粹"。融合徽剧和汉剧精华，在清代宫廷支持下迅速发展。表演体系高度程式化——"唱念做打"四功和"手眼身法步"五法构成完整表演技法。角色分为生（男性角色）、旦（女性角色）、净（花脸）、丑（喜剧角色）四大行当。2010年列入联合国人类非物质文化遗产。',features:['脸谱艺术：通过色彩图案表现角色性格——红色表忠勇，白色表奸诈，黑色表刚直','虚拟表演：极少使用道具布景，一桌二椅可代表任何场景','音乐伴奏：以京胡为主要乐器，配合锣鼓经','代表剧目：《霸王别姬》《贵妃醉酒》《空城计》']},{name:'昆曲',region:'中国',era:'形成于14世纪（元末明初）',desc:'昆曲是中国最古老的戏曲剧种之一，被誉为"百戏之祖"。起源于江苏昆山，由魏良辅改革而成。昆曲以笛子为主要伴奏乐器，唱腔婉转细腻——"水磨腔"。文字极其典雅，多为文人创作。2001年被列为联合国教科文组织"人类口述和非物质遗产代表作"之首。',features:['文辞典雅：多为文人所写，如汤显祖《牡丹亭》','唱腔细腻：水磨腔，一字数转','舞蹈性强：身段动作优美流畅','代表剧目：《牡丹亭》《长生殿》《桃花扇》']},{name:'歌舞伎',region:'日本',era:'始于1603年',desc:'歌舞伎是日本最具代表性的传统戏剧，诞生于江户时代。名称源自"倾"(kabuku)，意为偏离常规。最初由女性表演，后被幕府禁止，改为全男性演出——男性扮演女性称"女形"。表演以夸张动作、华丽服饰和独特舞台装置著称。2005年列入联合国非物质文化遗产。',features:['花道：从舞台延伸至观众席的走道','隈取：独特脸谱化妆技法','回转舞台：18世纪发明的旋转舞台','代表剧目：《忠臣藏》《义经千本樱》']},{name:'能乐',region:'日本',era:'形成于14世纪',desc:'能乐是日本最古老的戏剧形式，由观阿弥和世阿弥父子创立。表演极为简约——缓慢动作、单调音乐和诗歌吟唱构成独特审美。"幽玄"是能乐追求的最高美学境界。能面约有60种，分为翁、尉、男、女、鬼神等类型。世阿弥《风姿花传》是日本最古老戏剧理论著作。',features:['能面：约60种面具传统','仕手：主角佩戴面具表演','囃子：四种乐器伴奏','代表剧目：《羽衣》《葵上》《井筒》']},{name:'文乐',region:'日本',era:'形成于17世纪',desc:'文乐是日本传统木偶剧，与歌舞伎和能乐并称日本三大传统戏剧。每个木偶由三名操作者共同操控——主操作者控制头部和右手，左操作者控制左手，足操作者控制脚部。太夫（叙述者）负责所有角色的台词和叙述，三味线伴奏。',features:['三人操控一偶：需要多年训练达到完美配合','太夫一人多角：用声音区分所有角色','三味线伴奏：音乐与叙述紧密配合','代表剧目：《曾根崎心中》《菅原传授手习鉴》']},{name:'印度梵剧',region:'印度',era:'公元前2世纪',desc:'印度梵剧是世界最古老戏剧传统之一。婆罗多牟尼《舞论》是最早系统论述戏剧艺术的著作，涵盖表演、舞蹈、音乐、舞台设计。迦梨陀娑《沙恭达罗》是梵剧最著名作品。梵剧融合舞蹈、音乐和诗歌，语言分为梵语（上层人物）和俗语（下层人物）。',features:['九种"味"：爱情、幽默、怜悯、愤怒、英勇、恐惧、厌恶、惊奇、平静','开场仪式：每次演出前的祈福仪式','阶级语言：不同社会阶层使用不同语言','代表剧目：《沙恭达罗》《摩罗维迦与火友王》']},{name:'卡塔卡利舞剧',region:'印度喀拉拉邦',era:'形成于17世纪',desc:'卡塔卡利是印度喀拉拉邦的传统舞剧，以精细的脸部化妆、夸张的眼部动作和手势语言著称。演员不讲话，完全通过面部表情和手势（Mudras）讲述故事。化妆过程长达数小时，色彩具有象征意义——绿色代表英雄，红色代表暴力，黑色代表邪恶。',features:['精细化妆：用天然颜料，耗时数小时','手势语言：24种基本手势表达丰富含义','面部表演：眼部肌肉控制训练极为严格','故事来源：《摩诃婆罗多》《罗摩衍那》']},{name:'皮影戏',region:'东南亚（印尼、泰国、马来西亚）',era:'至少1000年历史',desc:'皮影戏在东南亚广泛流传，以印尼哇扬皮影戏最为著名。牛皮雕刻成各种角色，在白色幕布后通过灯光投影表演。达朗（操纵者）一人控制所有皮影、讲述故事、指挥乐队，通常持续整夜。故事多取材自印度史诗《摩诃婆罗多》和《罗摩衍那》。',features:['牛皮雕刻：精细手工雕刻','达朗一人全能：操纵、叙述、指挥','整夜演出：从黄昏到黎明','代表剧目：《摩诃婆罗多》故事改编']}];
        document.getElementById('eastGrid').innerHTML=eastTheatre.map(e=>`<div class="east-card"><div class="card-head"><h3>${e.name}</h3><div class="region">📍 ${e.region} · 🕐 ${e.era}</div></div><div class="card-body"><p>${e.desc}</p><ul class="features">${e.features.map(f=>`<li>${f}</li>`).join('')}</ul></div></div>`).join('');
    </script>
</body>
