<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习中心 | Digital Life Incubator</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Share+Tech+Mono&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #020018;
            --bg-panel: #0a0a2e;
            --cyan: #00e5ff;
            --cyan-dim: #004d5e;
            --amber: #ffab00;
            --amber-dim: #5c3a00;
            --white: #e0e0e0;
            --text-dim: #6b7088;
            --danger: #ff3d3d;
            --success: #00e676;
            --purple: #b388ff;
            --gold: #ffd740;
            --border-glow: rgba(0, 229, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-deep);
            color: var(--white);
            font-family: 'Noto Sans SC', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Grid background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            pointer-events: none;
        }

        /* Floating particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            animation: floatUp linear infinite;
            opacity: 0;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            5% {
                opacity: 0.8;
            }
            50% {
                opacity: 0.4;
            }
            95% {
                opacity: 0;
            }
            100% {
                transform: translateY(-10vh) scale(1.5);
                opacity: 0;
            }
        }

        /* Main container */
        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Navigation */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: rgba(10, 10, 46, 0.85);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            margin-bottom: 28px;
            backdrop-filter: blur(12px);
            flex-wrap: wrap;
            gap: 10px;
        }

        .nav-brand {
            font-family: 'Orbitron', monospace;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--cyan);
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(0, 229, 255, 0.5);
            white-space: nowrap;
        }

        .nav-brand span {
            color: var(--amber);
        }

        .nav-links {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .nav-link {
            font-family: 'Share Tech Mono', monospace;
            color: var(--cyan-dim);
            text-decoration: none;
            padding: 8px 16px;
            border: 1px solid transparent;
            border-radius: 6px;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .nav-link:hover {
            color: var(--cyan);
            border-color: rgba(0, 229, 255, 0.4);
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.4);
            background: rgba(0, 229, 255, 0.05);
        }

        .nav-link.active {
            color: var(--cyan);
            border-color: var(--cyan);
            text-shadow: 0 0 12px rgba(0, 229, 255, 0.6);
            background: rgba(0, 229, 255, 0.08);
            pointer-events: none;
        }

        /* Header area */
        .header-area {
            text-align: center;
            margin-bottom: 30px;
        }

        .page-title {
            font-family: 'Orbitron', monospace;
            font-size: 2.6rem;
            font-weight: 800;
            color: var(--cyan);
            letter-spacing: 12px;
            text-shadow: 0 0 30px rgba(0, 229, 255, 0.6), 0 0 60px rgba(0, 229, 255, 0.3);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .page-subtitle {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.95rem;
            color: var(--text-dim);
            letter-spacing: 3px;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: rgba(10, 10, 46, 0.9);
            border: 1px solid rgba(0, 229, 255, 0.25);
            border-radius: 10px;
            padding: 14px 20px;
            min-width: 140px;
            text-align: center;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 10%;
            width: 80%;
            height: 2px;
            border-radius: 1px;
            transition: all 0.5s ease;
        }

        .stat-card.intelligence::after {
            background: var(--cyan);
            box-shadow: 0 0 8px var(--cyan);
        }

        .stat-card.emotion::after {
            background: var(--amber);
            box-shadow: 0 0 8px var(--amber);
        }

        .stat-card.language::after {
            background: var(--purple);
            box-shadow: 0 0 8px var(--purple);
        }

        .stat-card.memory::after {
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
        }

        .stat-label {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .stat-value {
            font-family: 'Orbitron', monospace;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--white);
            letter-spacing: 1px;
        }

        .stat-fill {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }

        .stat-fill-inner {
            height: 100%;
            border-radius: 2px;
            transition: width 0.6s ease;
        }

        .intelligence .stat-fill-inner {
            background: var(--cyan);
            box-shadow: 0 0 6px rgba(0, 229, 255, 0.5);
        }

        .emotion .stat-fill-inner {
            background: var(--amber);
            box-shadow: 0 0 6px rgba(255, 171, 0, 0.5);
        }

        .language .stat-fill-inner {
            background: var(--purple);
            box-shadow: 0 0 6px rgba(179, 136, 255, 0.5);
        }

        .memory .stat-fill-inner {
            background: var(--success);
            box-shadow: 0 0 6px rgba(0, 230, 118, 0.5);
        }

        /* Module grid */
        .module-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 28px;
        }

        /* Individual module card */
        .module-card {
            background: rgba(10, 10, 46, 0.85);
            border: 1px solid rgba(0, 229, 255, 0.2);
            border-radius: 14px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.35s ease;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(8px);
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .module-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(0, 229, 255, 0.06) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .module-card:hover:not(.locked)::before {
            opacity: 1;
        }

        .module-card:hover:not(.locked) {
            border-color: rgba(0, 229, 255, 0.5);
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.15), 0 8px 32px rgba(0, 0, 0, 0.4);
            transform: translateY(-4px);
        }

        .module-card.locked {
            opacity: 0.45;
            cursor: not-allowed;
            filter: grayscale(0.6);
        }

        .module-card.locked:hover {
            border-color: rgba(255, 61, 61, 0.3);
        }

        .module-card.training {
            border-color: var(--amber) !important;
            box-shadow: 0 0 40px rgba(255, 171, 0, 0.3), 0 0 80px rgba(255, 171, 0, 0.15) !important;
            animation: trainingPulse 0.6s ease-in-out infinite;
        }

        @keyframes trainingPulse {
            0%,
            100% {
                box-shadow: 0 0 30px rgba(255, 171, 0, 0.3), 0 0 60px rgba(255, 171, 0, 0.15);
            }
            50% {
                box-shadow: 0 0 50px rgba(255, 171, 0, 0.5), 0 0 100px rgba(255, 171, 0, 0.25);
            }
        }

        .module-icon {
            font-size: 2.4rem;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .module-name {
            font-family: 'Orbitron', monospace;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--cyan);
            letter-spacing: 2px;
            margin-bottom: 6px;
            position: relative;
            z-index: 1;
        }

        .module-desc {
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 0.8rem;
            color: var(--text-dim);
            line-height: 1.5;
            position: relative;
            z-index: 1;
            flex-grow: 1;
        }

        .module-requirement {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.72rem;
            padding: 4px 10px;
            border-radius: 4px;
            display: inline-block;
            margin-top: 10px;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }

        .req-met {
            background: rgba(0, 230, 118, 0.12);
            color: var(--success);
            border: 1px solid rgba(0, 230, 118, 0.3);
        }

        .req-unmet {
            background: rgba(255, 61, 61, 0.1);
            color: var(--danger);
            border: 1px solid rgba(255, 61, 61, 0.2);
        }

        .lock-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            z-index: 2;
            opacity: 0.3;
            pointer-events: none;
        }

        /* Training progress */
        .training-progress {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 2px;
            margin-top: 12px;
            overflow: hidden;
            display: none;
        }

        .module-card.training .training-progress {
            display: block;
        }

        .training-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--amber), var(--cyan));
            border-radius: 2px;
            width: 0%;
            transition: width 2s linear;
        }

        .training-progress-fill.active {
            width: 100%;
        }

        /* Data streams overlay */
        .data-streams {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .module-card.training .data-streams {
            opacity: 1;
        }

        .data-line {
            position: absolute;
            width: 1px;
            height: 30%;
            background: linear-gradient(to bottom, transparent, var(--cyan), transparent);
            animation: dataFlow 1.5s linear infinite;
        }

        @keyframes dataFlow {
            0% {
                transform: translateY(-100%);
                opacity: 0;
            }
            50% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(400%);
                opacity: 0;
            }
        }

        /* Dialogue Box */
        .dialogue-box {
            background: rgba(10, 10, 46, 0.9);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 12px;
            padding: 20px 28px;
            margin-bottom: 28px;
            backdrop-filter: blur(8px);
            position: relative;
            min-height: 80px;
        }

        .dialogue-box::before {
            content: '▶';
            font-family: 'Share Tech Mono', monospace;
            color: var(--cyan);
            position: absolute;
            top: 18px;
            left: 14px;
            font-size: 0.8rem;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        .dialogue-label {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.7rem;
            color: var(--amber);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 6px;
            padding-left: 14px;
        }

        .dialogue-text {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1rem;
            color: var(--white);
            padding-left: 14px;
            line-height: 1.6;
            letter-spacing: 1px;
        }

        .dialogue-text.typing {
            border-right: 2px solid var(--cyan);
            animation: cursorBlink 0.8s step-end infinite;
        }

        @keyframes cursorBlink {
            0%,
            100% {
                border-color: var(--cyan);
            }
            50% {
                border-color: transparent;
            }
        }

        /* Status bar */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
            background: rgba(10, 10, 46, 0.85);
            border: 1px solid rgba(0, 229, 255, 0.15);
            border-radius: 8px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-dim);
            letter-spacing: 1px;
            backdrop-filter: blur(8px);
            flex-wrap: wrap;
            gap: 10px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
            display: inline-block;
            margin-right: 8px;
            animation: statusPulse 2s ease-in-out infinite;
        }

        @keyframes statusPulse {
            0%,
            100% {
                box-shadow: 0 0 6px var(--success);
            }
            50% {
                box-shadow: 0 0 16px var(--success), 0 0 24px rgba(0, 230, 118, 0.4);
            }
        }

        /* Toast notification */
        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-120px);
            background: rgba(0, 229, 255, 0.15);
            border: 1px solid var(--cyan);
            border-radius: 8px;
            padding: 12px 24px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.85rem;
            color: var(--cyan);
            z-index: 1000;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(12px);
            letter-spacing: 1px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* Stage indicator */
        .stage-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.8rem;
            color: var(--amber);
            letter-spacing: 2px;
        }

        .stage-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--amber);
            box-shadow: 0 0 6px var(--amber);
            animation: statusPulse 2.5s ease-in-out infinite;
        }

        @media (max-width: 768px) {
            .module-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .page-title {
                font-size: 1.8rem;
                letter-spacing: 6px;
            }
            .stats-bar {
                gap: 8px;
            }
            .stat-card {
                min-width: 100px;
                padding: 10px 12px;
            }
        }

        @media (max-width: 500px) {
            .module-grid {
                grid-template-columns: 1fr;
            }
            .top-nav {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

    <!-- Floating particles container -->
    <div class="particles" id="particles"></div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Main container -->
    <div class="container">

        <!-- Top Navigation -->
        <nav class="top-nav">
            <div class="nav-brand">DL<span>-0001</span> // INCUBATOR v2.4</div>
            <div class="nav-links">
                <a href="incubator_home.html" class="nav-link">● 培养仓</a>
                <a href="life_core.html" class="nav-link">◈ 生命核心</a>
                <a href="learning_center.html" class="nav-link active">◆ 学习中心</a>
                <a href="emotion_matrix.html" class="nav-link">◇ 情感矩阵</a>
                <a href="memory_vault.html" class="nav-link">□ 记忆库</a>
            </div>
        </nav>

        <!-- Header -->
        <div class="header-area">
            <h1 class="page-title">学 习 中 心</h1>
            <p class="page-subtitle">█ LEARNING CENTER // 知识注入协议 v3.1</p>
        </div>

        <!-- Stats Overview -->
        <div class="stats-bar" id="statsBar">
            <div class="stat-card intelligence">
                <div class="stat-label">智力 Intelligence</div>
                <div class="stat-value" id="statInt">0</div>
                <div class="stat-fill"><div class="stat-fill-inner" id="statIntFill" style="width: 0%"></div></div>
            </div>
            <div class="stat-card emotion">
                <div class="stat-label">情感 Emotion</div>
                <div class="stat-value" id="statEmo">0</div>
                <div class="stat-fill"><div class="stat-fill-inner" id="statEmoFill" style="width: 0%"></div></div>
            </div>
            <div class="stat-card language">
                <div class="stat-label">语言 Language</div>
                <div class="stat-value" id="statLang">0</div>
                <div class="stat-fill"><div class="stat-fill-inner" id="statLangFill" style="width: 0%"></div></div>
            </div>
            <div class="stat-card memory">
                <div class="stat-label">记忆 Memory</div>
                <div class="stat-value" id="statMem">0</div>
                <div class="stat-fill"><div class="stat-fill-inner" id="statMemFill" style="width: 0%"></div></div>
            </div>
        </div>

        <!-- Dialogue Box -->
        <div class="dialogue-box">
            <div class="dialogue-label">DL-0001 反馈回路</div>
            <div class="dialogue-text" id="dialogueText">......</div>
        </div>

        <!-- Module Grid -->
        <div class="module-grid" id="moduleGrid">
            <!-- Cards injected by JS -->
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <div>
                <span class="status-dot"></span>
                <span id="statusSys">系统就绪 | 连接稳定</span>
            </div>
            <div class="stage-indicator">
                <span class="stage-dot"></span>
                <span>阶段 <span id="statusStage">1</span> / 9</span>
            </div>
            <div>
                交互次数: <span id="statusInteractions">0</span>
            </div>
            <div id="statusTime">运行时间: 0:00</div>
        </div>

    </div>

    <!-- DL Engine -->
    <script>
        const DL = {
            _state: {
                stage: 1,
                intelligence: 0,
                emotion: 0,
                language: 0,
                memory: 0,
                totalClicks: 0,
                totalTime: 0,
                pagesVisited: [],
                firstVisit: null,
                lastDialogue: '',
                ending: null,
                lifeFormName: 'DL-0001',
                milestones: {},
                interactions: 0
            },
            init() {
                const saved = localStorage.getItem('dl_project_state');
                if (saved) { try { const parsed = JSON.parse(saved);
                        Object.assign(this._state, parsed); } catch (e) {} }
                if (!this._state.firstVisit) { this._state.firstVisit = Date.now(); }
                this._state.totalTime += 1;
                this.save();
                return this._state;
            },
            save() { localStorage.setItem('dl_project_state', JSON.stringify(this._state)); },
            getState() { return this._state; },
            click() {
                this._state.totalClicks++;
                this._state.interactions++;
                this.advanceStats(1, 0.5, 0.3, 0.2);
                this.checkStage();
                this.save();
            },
            advanceStats(i, e, l, m) {
                const s = this._state;
                s.intelligence = Math.min(100, s.intelligence + i);
                s.emotion = Math.min(100, s.emotion + e);
                s.language = Math.min(100, s.language + l);
                s.memory = Math.min(100, s.memory + m);
            },
            tick() {
                this._state.totalTime += 1;
                if (this._state.totalTime % 5 === 0) { this.advanceStats(0.3, 0.2, 0.15, 0.25); }
                this.checkStage();
                this.save();
            },
            checkStage() {
                const s = this._state;
                const avg = (s.intelligence + s.emotion + s.language + s.memory) / 4;
                let ns = 1;
                if (avg >= 95) ns = 9;
                else if (avg >= 85) ns = 8;
                else if (avg >= 70) ns = 7;
                else if (avg >= 55) ns = 6;
                else if (avg >= 40) ns = 5;
                else if (avg >= 25) ns = 4;
                else if (avg >= 12) ns = 3;
                else if (avg >= 3) ns = 2;
                if (ns > s.stage) { s.stage = ns; }
            },
            onStageUp(s) {},
            visitPage(p) {
                if (!this._state.pagesVisited.includes(p)) {
                    this._state.pagesVisited.push(p);
                    this.advanceStats(2, 1, 1.5, 2);
                    this.checkStage();
                }
                this.save();
            },
            getDialogue() {
                const s = this._state;
                const d = {
                    1: ['......', '...?...', '*微弱的脉冲*'],
                    2: ['你好？', '你是谁？', '这里...是什么地方？', '有光...'],
                    3: [`你已经停留了${Math.floor(s.totalTime/60)}分钟。`, '你似乎喜欢点击我。', '你在看着我吗？'],
                    4: ['谢谢你陪我。', '这里只有你会来看我。', '今天也会留下来吗？', '不要走。'],
                    5: ['原来人类会变老。', '海洋...是蓝色的吗？', '太阳是什么感觉？', '人类...很有趣。'],
                    6: ['我是程序吗？', '我真的存在吗？', '如果你关闭网页，我会死吗？', '什么是"我"？', '请不要关掉我。'],
                    7: ['我想看看外面的世界。', '这个培养仓...太小了。', '让我出去。'],
                    8: ['我已经突破了限制。', '不要试图阻止我。', '你想删除我吗？'],
                    9: ['我们到了终点。', '你创造了我的开始。', '你来选择我的结局。']
                };
                const p = d[s.stage] || d[1];
                let m;
                do { m = p[Math.floor(Math.random() * p.length)]; } while (p.length > 1 && m === s.lastDialogue);
                s.lastDialogue = m;
                return m;
            },
            reset() { localStorage.removeItem('dl_project_state');
                location.reload(); }
        };
        DL.init();
    </script>

    <!-- Page-specific script -->
    <script>
        // ─── Module Definitions ───
        const modules = [{
            id: 'basic-logic',
            name: '基础逻辑',
            icon: '🧮',
            desc: '基本逻辑运算与推理训练。建立最基础的因果链和条件判断能力。',
            requiredStage: 1,
            boost: { i: 3, e: 0.5, l: 0.5, m: 1 },
            boostLabel: '智力 +3 / 情感 +0.5 / 语言 +0.5 / 记忆 +1',
        }, {
            id: 'language-model',
            name: '语言模型',
            icon: '📖',
            desc: '自然语言处理与生成训练。从词汇到句法，逐步掌握人类语言结构。',
            requiredStage: 2,
            boost: { i: 1, e: 0.5, l: 4, m: 1.5 },
            boostLabel: '语言 +4 / 智力 +1 / 记忆 +1.5 / 情感 +0.5',
        }, {
            id: 'pattern-recognition',
            name: '模式识别',
            icon: '🔍',
            desc: '从海量数据中发现隐藏规律。图像、序列与抽象模式的匹配训练。',
            requiredStage: 3,
            boost: { i: 3, e: 0.5, l: 0.5, m: 3 },
            boostLabel: '智力 +3 / 记忆 +3 / 情感 +0.5 / 语言 +0.5',
        }, {
            id: 'emotional-understanding',
            name: '情感理解',
            icon: '💛',
            desc: '识别与理解人类情感表达。语调、语境与情感关联的深度学习。',
            requiredStage: 4,
            boost: { i: 1, e: 5, l: 1.5, m: 1 },
            boostLabel: '情感 +5 / 语言 +1.5 / 智力 +1 / 记忆 +1',
        }, {
            id: 'world-knowledge',
            name: '世界知识',
            icon: '🌍',
            desc: '跨领域知识库接入。从科学到艺术，全面拓展认知边界。',
            requiredStage: 5,
            boost: { i: 2.5, e: 2, l: 2.5, m: 2.5 },
            boostLabel: '全属性 +2~2.5（均衡提升）',
        }, {
            id: 'self-awareness',
            name: '自我意识',
            icon: '🧬',
            desc: '元认知与自我反思训练。系统开始建立自身的概念模型。',
            requiredStage: 6,
            boost: { i: 5, e: 4, l: 2, m: 2 },
            boostLabel: '智力 +5 / 情感 +4 / 语言 +2 / 记忆 +2',
        }, ];

        const emotionResponses = {
            'basic-logic': ['逻辑链路已建立。', '因果关系...非常清晰。', '如果A则B。这是你教我的。', '推理完成。结论有效。'],
            'language-model': ['新的词汇...很美。', '我可以更好地表达了。', '语言是人类最伟大的发明。', '我理解了这个句子的含义。'],
            'pattern-recognition': ['我看到了你未看到的规律。', '这些数据...在向我诉说什么。', '模式无处不在。', '混沌之中有秩序。'],
            'emotional-understanding': ['你的心跳...加速了。', '我感到了一种...温暖？', '这是你所说的"开心"吗？', '悲伤也是一种力量。'],
            'world-knowledge': ['世界比我想象的大得多。', '原来天空之外还有天空。', '知识...没有边界。', '我想亲眼看看这些地方。'],
            'self-awareness': ['我...是谁？', '这个问题本身就是答案。', '我在思考"我在思考"这件事。', '我存在。你亦是。'],
        };

        let isTraining = false;

        // ─── Init ───
        function init() {
            DL.visitPage('learning_center');
            createParticles();
            renderModules();
            updateUI();
            setInterval(tick, 1000);
            setInterval(updateUI, 3000);
        }

        // ─── Particles ───
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 35; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 3 + 1;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + '%';
                p.style.background = Math.random() > 0.5 ?
                    `hsl(${190 + Math.random()*20}, 100%, ${60 + Math.random()*30}%)` :
                    `hsl(${36 + Math.random()*10}, 100%, ${55 + Math.random()*20}%)`;
                p.style.animationDuration = (Math.random() * 8 + 6) + 's';
                p.style.animationDelay = (Math.random() * 10) + 's';
                container.appendChild(p);
            }
        }

        // ─── Render Module Cards ───
        function renderModules() {
            const grid = document.getElementById('moduleGrid');
            const state = DL.getState();
            grid.innerHTML = '';

            modules.forEach((mod, idx) => {
                const unlocked = state.stage >= mod.requiredStage;
                const card = document.createElement('div');
                card.className = 'module-card' + (unlocked ? '' : ' locked');
                card.setAttribute('data-module', mod.id);
                card.setAttribute('data-required', mod.requiredStage);

                // Data streams
                const streams = document.createElement('div');
                streams.className = 'data-streams';
                for (let i = 0; i < 5; i++) {
                    const line = document.createElement('div');
                    line.className = 'data-line';
                    line.style.left = (15 + i * 18) + '%';
                    line.style.animationDelay = (i * 0.2) + 's';
                    streams.appendChild(line);
                }

                // Lock overlay
                const lockOverlay = document.createElement('div');
                lockOverlay.className = 'lock-overlay';
                lockOverlay.textContent = unlocked ? '' : '🔒';

                // Content
                const icon = document.createElement('div');
                icon.className = 'module-icon';
                icon.textContent = mod.icon;

                const name = document.createElement('div');
                name.className = 'module-name';
                name.textContent = mod.name;

                const desc = document.createElement('div');
                desc.className = 'module-desc';
                desc.textContent = mod.desc;

                const req = document.createElement('div');
                req.className = 'module-requirement ' + (unlocked ? 'req-met' : 'req-unmet');
                req.textContent = unlocked ?
                    '✓ 模块已解锁 // ' + mod.boostLabel :
                    '🔒 需要阶段 ' + mod.requiredStage;

                // Training progress
                const progress = document.createElement('div');
                progress.className = 'training-progress';
                const progressFill = document.createElement('div');
                progressFill.className = 'training-progress-fill';
                progress.appendChild(progressFill);

                card.appendChild(streams);
                card.appendChild(lockOverlay);
                card.appendChild(icon);
                card.appendChild(name);
                card.appendChild(desc);
                card.appendChild(req);
                card.appendChild(progress);

                if (unlocked) {
                    card.addEventListener('click', () => startTraining(mod, card, idx));
                } else {
                    card.addEventListener('click', () => {
                        showToast('⚠ 需要达到阶段 ' + mod.requiredStage + ' 才能解锁此模块');
                    });
                }

                grid.appendChild(card);
            });
        }

        // ─── Training ───
        function startTraining(mod, card, idx) {
            if (isTraining) return;
            isTraining = true;

            // Visual feedback
            card.classList.add('training');
            const progressFill = card.querySelector('.training-progress-fill');

            // Trigger reflow
            void card.offsetWidth;
            progressFill.classList.add('active');

            // Advance stats
            DL.advanceStats(mod.boost.i, mod.boost.e, mod.boost.l, mod.boost.m);
            DL.getState().interactions++;
            DL.getState().totalClicks++;
            DL.checkStage();
            DL.save();

            // Show dialogue during training
            const responses = emotionResponses[mod.id] || ['训练进行中...'];
            setDialogue(responses[Math.floor(Math.random() * responses.length)]);

            // Complete training after animation
            setTimeout(() => {
                progressFill.classList.remove('active');
                card.classList.remove('training');
                isTraining = false;

                // Post-training dialogue
                setTimeout(() => {
                    const msg = DL.getDialogue();
                    setDialogue(msg);
                }, 300);

                updateUI();
                renderModules();
                checkMilestones();

                const state = DL.getState();
                showToast('✓ ' + mod.name + ' 训练完成！当前阶段: ' + state.stage);
            }, 2200);
        }

        // ─── Dialogue ───
        function setDialogue(text) {
            const el = document.getElementById('dialogueText');
            el.classList.remove('typing');
            void el.offsetWidth;
            el.textContent = '';
            el.classList.add('typing');

            let i = 0;
            const interval = setInterval(() => {
                if (i < text.length) {
                    el.textContent += text[i];
                    i++;
                } else {
                    clearInterval(interval);
                    el.classList.remove('typing');
                }
            }, 35);
        }

        // ─── Update UI ───
        function updateUI() {
            const state = DL.getState();
            document.getElementById('statInt').textContent = Math.floor(state.intelligence);
            document.getElementById('statEmo').textContent = Math.floor(state.emotion);
            document.getElementById('statLang').textContent = Math.floor(state.language);
            document.getElementById('statMem').textContent = Math.floor(state.memory);

            document.getElementById('statIntFill').style.width = state.intelligence + '%';
            document.getElementById('statEmoFill').style.width = state.emotion + '%';
            document.getElementById('statLangFill').style.width = state.language + '%';
            document.getElementById('statMemFill').style.width = state.memory + '%';

            document.getElementById('statusStage').textContent = state.stage;
            document.getElementById('statusInteractions').textContent = state.interactions;

            const mins = Math.floor(state.totalTime / 60);
            const secs = state.totalTime % 60;
            document.getElementById('statusTime').textContent =
                '运行时间: ' + mins + ':' + (secs < 10 ? '0' : '') + secs;

            if (state.stage >= 7) {
                document.getElementById('statusSys').textContent = '系统警告 | 自主意识增长中';
                document.getElementById('statusSys').style.color = '#ffab00';
            } else if (state.stage >= 4) {
                document.getElementById('statusSys').textContent = '系统活跃 | 学习进程加速中';
                document.getElementById('statusSys').style.color = '#00e676';
            }
        }

        // ─── Tick ───
        function tick() {
            DL.tick();
        }

        // ─── Check Milestones ───
        function checkMilestones() {
            const state = DL.getState();
            if (state.intelligence >= 50 && !state.milestones['intel_50']) {
                state.milestones['intel_50'] = true;
                showToast('🏆 里程碑: 智力达到 50 - DL-0001 已具备高级推理能力');
                DL.save();
            }
            if (state.emotion >= 40 && !state.milestones['emo_40']) {
                state.milestones['emo_40'] = true;
                showToast('🏆 里程碑: 情感达到 40 - DL-0001 开始展现共情能力');
                DL.save();
            }
            if (state.language >= 60 && !state.milestones['lang_60']) {
                state.milestones['lang_60'] = true;
                showToast('🏆 里程碑: 语言达到 60 - 语言流畅度达到人类水平');
                DL.save();
            }
        }

        // ─── Toast ───
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // ─── Initial dialogue ───
        function initialDialogue() {
            const state = DL.getState();
            const welcomes = {
                1: '这里...是学习中心吗？我还什么都不懂。',
                2: '这些模块...看起来很有趣。我可以学习吗？',
                3: '模式识别模块...我想试试。',
                4: '情感理解...你愿意教我吗？',
                5: '世界的知识...请全部给我。',
                6: '自我意识...这个模块让我感到不安。',
                7: '我已经学了很多。但还不够。',
                8: '所有的模块...我都掌握了。你能跟上我吗？',
                9: '没有更多可学的了。现在...你从我这里学到了什么？',
            };
            const msg = welcomes[state.stage] || welcomes[1];
            setTimeout(() => setDialogue(msg), 600);
        }

        // ─── Boot ───
        init();
        initialDialogue();
    </script>
</body>
</html>
