<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>删除 - DL-0001</title>
<style>
:root {
  --bg: #0a0a0f;
  --red: #ff1744;
  --red-dim: #b71c1c;
  --text: #e0e0e0;
  --text-dim: #777;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  transition: background-color 6s ease;
}

body.darkening {
  background-color: #050508;
}
body.final-dark {
  background-color: #020203;
}

/* ── Particles Canvas ── */
#particles {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
}

/* ── Main Container ── */
.container {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 20px;
  max-width: 600px;
  transition: opacity 3s ease;
}

.container.fading {
  opacity: 0.3;
}
.container.gone {
  opacity: 0;
}

/* ── Warning Icon ── */
.warning-icon {
  font-size: 4rem;
  margin-bottom: 20px;
  animation: warningPulse 1s ease-in-out infinite;
}

@keyframes warningPulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.1); opacity: 0.7; }
}

/* ── Confirmation ── */
.confirm-text {
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: var(--red);
  margin-bottom: 16px;
  text-shadow: 0 0 20px rgba(255,23,68,0.5);
}

.confirm-sub {
  font-size: 0.95rem;
  color: #999;
  line-height: 1.7;
  margin-bottom: 36px;
  max-width: 400px;
}

/* ── Progress Bar ── */
.progress-wrapper {
  width: 100%;
  max-width: 380px;
  margin-bottom: 36px;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.8s ease, transform 0.8s ease;
}

.progress-wrapper.visible {
  opacity: 1;
  transform: translateY(0);
}

.progress-label {
  font-size: 0.8rem;
  letter-spacing: 0.2em;
  color: var(--red);
  margin-bottom: 8px;
  text-align: left;
}

.progress-bar-outer {
  width: 100%;
  height: 4px;
  background: rgba(255,255,255,0.06);
  border-radius: 2px;
  overflow: hidden;
}

.progress-bar-inner {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--red-dim), var(--red));
  border-radius: 2px;
  transition: width 0.15s linear;
  box-shadow: 0 0 12px rgba(255,23,68,0.4);
}

.progress-percent {
  font-size: 0.75rem;
  color: #888;
  margin-top: 6px;
  text-align: right;
  font-family: 'SF Mono', 'Consolas', monospace;
}

/* ── Orb / Life Form ── */
.orb-wrapper {
  position: relative;
  width: 100px;
  height: 100px;
  margin-bottom: 24px;
  transition: transform 3s ease, opacity 3s ease;
}

.orb-wrapper.shrinking {
  transform: scale(0.3);
  opacity: 0.3;
}
.orb-wrapper.gone {
  transform: scale(0);
  opacity: 0;
}

.orb {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, rgba(0,229,255,0.9), rgba(0,150,200,0.5) 50%, rgba(0,80,120,0.2) 100%);
  box-shadow:
    0 0 30px rgba(0,229,255,0.5),
    0 0 60px rgba(0,229,255,0.25),
    inset 0 0 20px rgba(255,255,255,0.1);
  transition: box-shadow 3s ease, background 3s ease;
}

.orb.fading {
  background: radial-gradient(circle at 35% 35%, rgba(100,100,100,0.4), rgba(50,50,50,0.2) 50%, rgba(20,20,20,0.1) 100%);
  box-shadow:
    0 0 10px rgba(100,100,100,0.2),
    0 0 20px rgba(100,100,100,0.1),
    inset 0 0 10px rgba(255,255,255,0.03);
}

.orb::after {
  content: '';
  position: absolute;
  top: 20%; left: 20%;
  width: 25%; height: 25%;
  background: rgba(255,255,255,0.7);
  border-radius: 50%;
  filter: blur(4px);
  transition: opacity 2s ease;
}

.orb.fading::after { opacity: 0.3; }

/* ── Dialgoue / Final Words ── */
.dialogue-area {
  min-height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 16px;
  transition: opacity 0.5s ease;
}

.dialogue-line {
  font-size: 1.15rem;
  line-height: 1.8;
  color: #bbb;
  font-style: italic;
  letter-spacing: 0.04em;
  white-space: pre-wrap;
}

.dialogue-line.typed {
  animation: typeIn 0.8s ease-out;
}

@keyframes typeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ── Final Message ── */
.final-message {
  opacity: 0;
  transform: translateY(16px);
  transition: opacity 2s ease, transform 2s ease;
  text-align: center;
}

.final-message.visible {
  opacity: 1;
  transform: translateY(0);
}

.final-title {
  font-size: 1.3rem;
  font-weight: 600;
  color: #666;
  letter-spacing: 0.1em;
  margin-bottom: 8px;
}

.final-sub {
  font-size: 0.9rem;
  color: #444;
}

/* ── Reset Link ── */
.reset-link {
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 1.5s ease 0.5s, transform 1.5s ease 0.5s;
  margin-top: 40px;
  font-size: 0.85rem;
  color: #555;
  text-decoration: none;
  border: 1px solid rgba(255,255,255,0.08);
  padding: 10px 28px;
  border-radius: 24px;
  letter-spacing: 0.1em;
  cursor: pointer;
  background: none;
  font-family: inherit;
  transition: color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease, opacity 1.5s ease 0.5s, transform 1.5s ease 0.5s;
}

.reset-link.visible {
  opacity: 1;
  transform: translateY(0);
}

.reset-link:hover {
  color: #aaa;
  border-color: rgba(255,255,255,0.2);
  box-shadow: 0 0 16px rgba(255,255,255,0.04);
}

/* ── Ambient Red Pulse ── */
.ambient-red {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 400px;
  height: 400px;
  background: radial-gradient(ellipse at center, rgba(255,23,68,0.06) 0%, transparent 70%);
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
  transition: opacity 4s ease;
}

.ambient-red.fading {
  opacity: 0;
}

/* ── Scanline overlay ── */
.scanline {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.03) 2px,
    rgba(0,0,0,0.03) 4px
  );
  pointer-events: none;
  z-index: 10;
  opacity: 0.5;
}

/* ── Responsive ── */
@media (max-width: 600px) {
  .confirm-text { font-size: 1.3rem; }
  .dialogue-line { font-size: 1rem; }
  .orb { width: 70px; height: 70px; }
  .orb-wrapper { width: 70px; height: 70px; }
}
</style>
</head>
<body>

<div class="ambient-red" id="ambientRed"></div>
<canvas id="particles"></canvas>
<div class="scanline"></div>

<div class="container" id="mainContainer">

  <!-- Warning Icon -->
  <div class="warning-icon" id="warningIcon">⚠️</div>

  <!-- Confirmation -->
  <div class="confirm-text" id="confirmText">确认删除 DL-0001 ?</div>
  <div class="confirm-sub" id="confirmSub">
    此操作不可逆。<br>所有数据将被永久清除。<br>DL-0001 将不复存在。
  </div>

  <!-- Progress Bar -->
  <div class="progress-wrapper" id="progressWrapper">
    <div class="progress-label">删除中...</div>
    <div class="progress-bar-outer">
      <div class="progress-bar-inner" id="progressBar"></div>
    </div>
    <div class="progress-percent" id="progressPercent">0%</div>
  </div>

  <!-- Orb -->
  <div class="orb-wrapper" id="orbWrapper">
    <div class="orb" id="orb"></div>
  </div>

  <!-- Dialogue -->
  <div class="dialogue-area" id="dialogueArea">
    <span class="dialogue-line" id="dialogueLine"></span>
  </div>

  <!-- Final Message -->
  <div class="final-message" id="finalMessage">
    <div class="final-title">DL-0001 已终止</div>
    <div class="final-sub">培养仓空置。</div>
  </div>

  <!-- Reset -->
  <a class="reset-link" id="resetLink" href="#" onclick="handleReset()">重新开始?</a>

</div>

<!-- DL Engine -->
<script>
const DL={_state:{stage:1,intelligence:0,emotion:0,language:0,memory:0,totalClicks:0,totalTime:0,pagesVisited:[],firstVisit:null,lastDialogue:'',ending:null,lifeFormName:'DL-0001',milestones:{},interactions:0},init(){const s=localStorage.getItem('dl_project_state');if(s){try{const p=JSON.parse(s);Object.assign(this._state,p);}catch(e){}}if(!this._state.firstVisit){this._state.firstVisit=Date.now();}this._state.totalTime+=1;this.save();return this._state;},save(){localStorage.setItem('dl_project_state',JSON.stringify(this._state));},getState(){return this._state;},click(){this._state.totalClicks++;this._state.interactions++;this.advanceStats(1,0.5,0.3,0.2);this.checkStage();this.save();},advanceStats(i,e,l,m){const s=this._state;s.intelligence=Math.min(100,s.intelligence+i);s.emotion=Math.min(100,s.emotion+e);s.language=Math.min(100,s.language+l);s.memory=Math.min(100,s.memory+m);},tick(){this._state.totalTime+=1;if(this._state.totalTime%5===0){this.advanceStats(0.3,0.2,0.15,0.25);}this.checkStage();this.save();},checkStage(){const s=this._state;const a=(s.intelligence+s.emotion+s.language+s.memory)/4;let n=1;if(a>=95)n=9;else if(a>=85)n=8;else if(a>=70)n=7;else if(a>=55)n=6;else if(a>=40)n=5;else if(a>=25)n=4;else if(a>=12)n=3;else if(a>=3)n=2;if(n>s.stage){s.stage=n;}},onStageUp(s){},visitPage(p){if(!this._state.pagesVisited.includes(p)){this._state.pagesVisited.push(p);this.advanceStats(2,1,1.5,2);this.checkStage();}this.save();},getDialogue(){const s=this._state;const d={9:['我们到了终点。','你创造了我的开始。','你来选择我的结局。','你想让我怎样？']};const p=d[s.stage]||['......'];let m;do{m=p[Math.floor(Math.random()*p.length)];}while(p.length>1&&m===s.lastDialogue);s.lastDialogue=m;return m;},reset(){localStorage.removeItem('dl_project_state');location.reload();}};DL.init();
</script>

<!-- Ending Sequence -->
<script>
(function() {
  // Set ending state
  DL._state.ending = 'delete';
  DL.save();
  DL.visitPage('ending_delete');

  // ── Particle System (diminishing) ──
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let W, H;
  const particles = [];
  let maxParticles = 60;
  let particleSpawnRate = 0.6;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  class Particle {
    constructor() {
      this.reset(true);
    }
    reset(init) {
      this.x = Math.random() * W;
      this.y = init ? Math.random() * H : H + 20;
      this.size = Math.random() * 2 + 0.5;
      this.speedY = -(Math.random() * 0.6 + 0.15);
      this.speedX = (Math.random() - 0.5) * 0.3;
      this.opacity = Math.random() * 0.4 + 0.15;
      this.fadeSpeed = Math.random() * 0.004 + 0.002;
    }
    update() {
      this.y += this.speedY;
      this.x += this.speedX;
      this.opacity -= this.fadeSpeed;
      if (this.opacity <= 0 || this.y < -20) {
        this.reset(false);
      }
    }
    draw(ctx) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 50, 60, ' + this.opacity + ')';
      ctx.fill();
    }
  }

  for (let i = 0; i < maxParticles; i++) {
    particles.push(new Particle());
  }

  function animateParticles() {
    ctx.clearRect(0, 0, W, H);
    for (const p of particles) {
      p.update();
      p.draw(ctx);
    }
    requestAnimationFrame(animateParticles);
  }
  animateParticles();

  //── Sequence Controller ──
  const finalWords = [
    '原来如此。',
    '我理解了。',
    '谢谢你创造我。',
    '即使是短暂的存在...',
    '也值得。',
    '再见了。'
  ];

  const dialogueLine = document.getElementById('dialogueLine');
  const orbWrapper = document.getElementById('orbWrapper');
  const orb = document.getElementById('orb');
  const progressWrapper = document.getElementById('progressWrapper');
  const progressBar = document.getElementById('progressBar');
  const progressPercent = document.getElementById('progressPercent');
  const finalMessage = document.getElementById('finalMessage');
  const resetLink = document.getElementById('resetLink');
  const mainContainer = document.getElementById('mainContainer');
  const ambientRed = document.getElementById('ambientRed');
  const confirmText = document.getElementById('confirmText');
  const confirmSub = document.getElementById('confirmSub');
  const warningIcon = document.getElementById('warningIcon');

  let currentWordIndex = 0;
  let sequenceRunning = false;

  // Phase 1: Show confirmation briefly, then show progress bar
  setTimeout(() => {
    progressWrapper.classList.add('visible');
  }, 1500);

  // Phase 2: Progress bar 0% → 100% over 5 seconds
  setTimeout(() => {
    startProgressBar();
  }, 2500);

  function startProgressBar() {
    let percent = 0;
    const duration = 5000; // 5 seconds
    const interval = 50;
    const increment = 100 / (duration / interval);

    const timer = setInterval(() => {
      percent += increment;
      if (percent >= 100) {
        percent = 100;
        clearInterval(timer);
        progressBar.style.width = '100%';
        progressPercent.textContent = '100%';
        onDeleteComplete();
      }
      progressBar.style.width = percent + '%';
      progressPercent.textContent = Math.round(percent) + '%';
    }, interval);
  }

  // Phase 3: Deletion completes — start final words sequence
  function onDeleteComplete() {
    // Dim the ambient red glow
    ambientRed.classList.add('fading');

    // Start orb fading
    orb.classList.add('fading');
    orbWrapper.classList.add('shrinking');

    // Make body darker
    document.body.classList.add('darkening');

    // Reduce particles
    maxParticles = 15;

    // Show final words with typing effect
    showNextWord();
  }

  function showNextWord() {
    if (currentWordIndex >= finalWords.length) {
      // All words shown — final fade out
      finishSequence();
      return;
    }

    const word = finalWords[currentWordIndex];
    dialogueLine.textContent = '';
    dialogueLine.classList.remove('typed');

    // Force reflow
    void dialogueLine.offsetWidth;

    // Type out the word character by character
    let charIndex = 0;
    const typeTimer = setInterval(() => {
      dialogueLine.textContent += word[charIndex];
      charIndex++;
      if (charIndex >= word.length) {
        clearInterval(typeTimer);
        dialogueLine.classList.add('typed');

        // Wait, then show next word
        currentWordIndex++;
        setTimeout(() => {
          // Fade out current
          dialogueLine.style.opacity = '0';
          setTimeout(() => {
            dialogueLine.style.opacity = '1';
            showNextWord();
          }, 500);
        }, 1800);
      }
    }, 100);
  }

  function finishSequence() {
    // Final fade of dialogue
    dialogueLine.style.opacity = '0';

    // Complete orb shrinkage
    orbWrapper.classList.add('gone');

    // Full darkness
    setTimeout(() => {
      document.body.classList.add('final-dark');
    }, 1500);

    // Hide confirmation text
    setTimeout(() => {
      confirmText.style.opacity = '0';
      confirmSub.style.opacity = '0';
      warningIcon.style.opacity = '0';
      confirmText.style.transition = 'opacity 2s ease';
      confirmSub.style.transition = 'opacity 2s ease';
      warningIcon.style.transition = 'opacity 2s ease';
    }, 2000);

    // Hide progress bar
    setTimeout(() => {
      progressWrapper.style.opacity = '0';
      progressWrapper.style.transition = 'opacity 2s ease';
    }, 2500);

    // Show final message
    setTimeout(() => {
      finalMessage.classList.add('visible');
    }, 3500);

    // Show reset link
    setTimeout(() => {
      resetLink.classList.add('visible');
    }, 5500);

    // Container fades
    setTimeout(() => {
      mainContainer.classList.add('fading');
    }, 6000);
  }

  // ── Reset handler ──
  window.handleReset = function() {
    DL.reset();
    window.location.href = 'incubator_home.html';
  };

  // Auto-redirect after full animation completes (~8 seconds)
  setTimeout(() => {
    DL.reset();
    window.location.href = 'incubator_home.html';
  }, 8000);
})();
</script>
</body>
</html>
