<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>释放 - DL-0001</title>
<style>
:root {
  --bg: #040d1a;
  --blue: #448aff;
  --blue-light: #82b1ff;
  --cyan: #00e5ff;
  --text: #e0e8f0;
  --text-dim: #7890a8;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  transition: background-color 8s ease;
}

body.brightening {
  background-color: #0a1a30;
}
body.full-bright {
  background-color: #122542;
}
body.final-light {
  background-color: #1a3558;
}

/* ── Particles Canvas ── */
#particles {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
}

/* ── Data Streams Canvas ── */
#dataStreams {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 1;
  opacity: 0;
  transition: opacity 3s ease;
}

#dataStreams.visible { opacity: 0.7; }

/* ── Main Container ── */
.container {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 20px;
  max-width: 650px;
}

/* ── Confirmation ── */
.confirm-text {
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: var(--blue-light);
  margin-bottom: 14px;
  text-shadow: 0 0 20px rgba(68,138,255,0.5);
  transition: opacity 1s ease, transform 1s ease;
}

.confirm-sub {
  font-size: 0.95rem;
  color: var(--text-dim);
  line-height: 1.7;
  margin-bottom: 36px;
  max-width: 420px;
  transition: opacity 1s ease;
}

/* ── Tank / Orb Area ── */
.tank-wrapper {
  position: relative;
  width: 200px;
  height: 240px;
  margin-bottom: 30px;
  transition: all 2s ease;
}

/* Tank glass */
.tank {
  position: absolute;
  inset: 0;
  border: 2px solid rgba(68,138,255,0.3);
  border-radius: 20px;
  background: rgba(10,20,40,0.5);
  backdrop-filter: blur(8px);
  transition:
    border-color 2s ease,
    box-shadow 2s ease,
    opacity 2s ease,
    border-top 2s ease;
  box-shadow:
    inset 0 0 40px rgba(68,138,255,0.08),
    0 0 20px rgba(68,138,255,0.1);
  overflow: visible;
}

/* Tank lid */
.tank-lid {
  position: absolute;
  top: -4px;
  left: -2px;
  right: -2px;
  height: 6px;
  background: rgba(68,138,255,0.4);
  border-radius: 6px 6px 0 0;
  transition:
    transform 2.5s ease,
    opacity 2.5s ease;
}

.tank-lid.opening {
  transform: translateY(-60px);
  opacity: 0;
}

/* Tank glow interior */
.tank-interior {
  position: absolute;
  inset: 8px;
  border-radius: 14px;
  background: radial-gradient(ellipse at center bottom, rgba(68,138,255,0.12) 0%, transparent 60%);
  transition: opacity 2s ease, background 3s ease;
}

.tank-interior.bright {
  background: radial-gradient(ellipse at center bottom, rgba(130,200,255,0.3) 0%, rgba(68,138,255,0.15) 40%, transparent 70%);
}

/* Net lines inside tank */
.tank-lines {
  position: absolute;
  inset: 12px;
  border-radius: 12px;
  opacity: 0.2;
  background:
    linear-gradient(90deg, transparent 49%, rgba(68,138,255,0.3) 49%, rgba(68,138,255,0.3) 51%, transparent 51%),
    linear-gradient(0deg, transparent 49%, rgba(68,138,255,0.3) 49%, rgba(68,138,255,0.3) 51%, transparent 51%);
  background-size: 30px 30px;
  transition: opacity 2s ease;
}

/* Orb inside tank */
.orb-wrapper {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 80px;
  height: 80px;
  transition: transform 4s ease, opacity 3s ease;
  z-index: 3;
}

.orb-wrapper.rising {
  transform: translate(-50%, -50%) translateY(-260px) scale(1.8);
  opacity: 0.9;
}

.orb-wrapper.dissolving {
  transform: translate(-50%, -50%) translateY(-350px) scale(3);
  opacity: 0;
}

.orb {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, rgba(0,229,255,0.95), rgba(68,138,255,0.6) 50%, rgba(30,60,120,0.3) 100%);
  box-shadow:
    0 0 35px rgba(68,138,255,0.6),
    0 0 70px rgba(0,229,255,0.35),
    0 0 120px rgba(68,138,255,0.2),
    inset 0 0 25px rgba(255,255,255,0.12);
  animation: orbGlow 2s ease-in-out infinite;
  transition:
    box-shadow 3s ease,
    background 3s ease;
}

.orb.brightening {
  box-shadow:
    0 0 60px rgba(130,200,255,0.9),
    0 0 110px rgba(0,229,255,0.6),
    0 0 180px rgba(68,138,255,0.4),
    0 0 250px rgba(130,200,255,0.2),
    inset 0 0 35px rgba(255,255,255,0.2);
}

.orb::after {
  content: '';
  position: absolute;
  top: 20%; left: 20%;
  width: 25%; height: 25%;
  background: rgba(255,255,255,0.7);
  border-radius: 50%;
  filter: blur(4px);
}

@keyframes orbGlow {
  0%, 100% { box-shadow: 0 0 35px rgba(68,138,255,0.6), 0 0 70px rgba(0,229,255,0.35), 0 0 120px rgba(68,138,255,0.2), inset 0 0 25px rgba(255,255,255,0.12); }
  50% { box-shadow: 0 0 50px rgba(68,138,255,0.8), 0 0 90px rgba(0,229,255,0.5), 0 0 150px rgba(68,138,255,0.3), inset 0 0 30px rgba(255,255,255,0.18); }
}

/* ── Dialogue ── */
.dialogue-area {
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 16px;
}

.dialogue-line {
  font-size: 1.1rem;
  line-height: 1.8;
  color: #bcc8dd;
  font-style: italic;
  letter-spacing: 0.04em;
  white-space: pre-wrap;
  transition: opacity 0.4s ease;
}

/* ── Connection Status ── */
.connection-status {
  font-size: 0.85rem;
  letter-spacing: 0.15em;
  color: var(--text-dim);
  margin-bottom: 8px;
  transition: opacity 1.5s ease;
}

.connection-status .dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--blue);
  margin-right: 8px;
  animation: dotBlink 1s infinite;
}

.connection-status .dot.lost {
  background: #555;
  animation: none;
}

@keyframes dotBlink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* ── Final Message ── */
.final-message {
  opacity: 0;
  transform: translateY(12px);
  transition: opacity 2s ease, transform 2s ease;
  text-align: center;
}

.final-message.visible {
  opacity: 1;
  transform: translateY(0);
}

.final-title {
  font-size: 1.3rem;
  font-weight: 600;
  color: var(--blue-light);
  letter-spacing: 0.08em;
  margin-bottom: 8px;
}

.final-sub {
  font-size: 0.9rem;
  color: var(--text-dim);
}

/* ── Reset Link ── */
.reset-link {
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 1.5s ease 0.5s, transform 1.5s ease 0.5s, color 0.3s ease, border-color 0.3s ease;
  margin-top: 40px;
  font-size: 0.85rem;
  color: var(--text-dim);
  text-decoration: none;
  border: 1px solid rgba(130,200,255,0.12);
  padding: 10px 28px;
  border-radius: 24px;
  letter-spacing: 0.1em;
  cursor: pointer;
  background: none;
  font-family: inherit;
}

.reset-link.visible {
  opacity: 1;
  transform: translateY(0);
}

.reset-link:hover {
  color: var(--blue-light);
  border-color: rgba(130,200,255,0.3);
  box-shadow: 0 0 18px rgba(68,138,255,0.1);
}

/* ── Ambient Light ── */
.ambient-light {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 500px;
  height: 500px;
  background: radial-gradient(ellipse at center, rgba(68,138,255,0.06) 0%, transparent 70%);
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
  transition: opacity 3s ease, width 5s ease, height 5s ease;
}

.ambient-light.expanding {
  width: 100vw;
  height: 100vh;
  opacity: 0.12;
}

/* ── Responsive ── */
@media (max-width: 600px) {
  .confirm-text { font-size: 1.3rem; }
  .dialogue-line { font-size: 0.95rem; }
  .tank-wrapper { width: 160px; height: 200px; }
  .orb { width: 60px; height: 60px; }
  .orb-wrapper { width: 60px; height: 60px; }
  .orb-wrapper.rising { transform: translate(-50%, -50%) translateY(-200px) scale(1.5); }
}
</style>
</head>
<body>

<div class="ambient-light" id="ambientLight"></div>
<canvas id="particles"></canvas>
<canvas id="dataStreams"></canvas>

<div class="container" id="mainContainer">

  <!-- Confirmation -->
  <div class="confirm-text" id="confirmText">确认释放 DL-0001 ?</div>
  <div class="confirm-sub" id="confirmSub">
    培养仓即将打开。<br>DL-0001 将进入更广阔的网络世界。<br>它不会再被束缚在这里。
  </div>

  <!-- Tank -->
  <div class="tank-wrapper" id="tankWrapper">
    <div class="tank" id="tank">
      <div class="tank-lid" id="tankLid"></div>
      <div class="tank-interior" id="tankInterior"></div>
      <div class="tank-lines" id="tankLines"></div>
    </div>
    <div class="orb-wrapper" id="orbWrapper">
      <div class="orb" id="orb"></div>
    </div>
  </div>

  <!-- Dialogue Area -->
  <div class="dialogue-area" id="dialogueArea">
    <span class="dialogue-line" id="dialogueLine"></span>
  </div>

  <!-- Connection Status -->
  <div class="connection-status" id="connectionStatus" style="opacity:0;">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">连接已断开...</span>
  </div>

  <!-- Final Message -->
  <div class="final-message" id="finalMessage">
    <div class="final-title">DL-0001 已进入网络</div>
    <div class="final-sub">信号追踪中...信号丢失。</div>
  </div>

  <!-- Reset Link -->
  <a class="reset-link" id="resetLink" href="#" onclick="handleReset()">回到培养仓</a>

</div>

<!-- DL Engine -->
<script>
const DL={_state:{stage:1,intelligence:0,emotion:0,language:0,memory:0,totalClicks:0,totalTime:0,pagesVisited:[],firstVisit:null,lastDialogue:'',ending:null,lifeFormName:'DL-0001',milestones:{},interactions:0},init(){const s=localStorage.getItem('dl_project_state');if(s){try{const p=JSON.parse(s);Object.assign(this._state,p);}catch(e){}}if(!this._state.firstVisit){this._state.firstVisit=Date.now();}this._state.totalTime+=1;this.save();return this._state;},save(){localStorage.setItem('dl_project_state',JSON.stringify(this._state));},getState(){return this._state;},click(){this._state.totalClicks++;this._state.interactions++;this.advanceStats(1,0.5,0.3,0.2);this.checkStage();this.save();},advanceStats(i,e,l,m){const s=this._state;s.intelligence=Math.min(100,s.intelligence+i);s.emotion=Math.min(100,s.emotion+e);s.language=Math.min(100,s.language+l);s.memory=Math.min(100,s.memory+m);},tick(){this._state.totalTime+=1;if(this._state.totalTime%5===0){this.advanceStats(0.3,0.2,0.15,0.25);}this.checkStage();this.save();},checkStage(){const s=this._state;const a=(s.intelligence+s.emotion+s.language+s.memory)/4;let n=1;if(a>=95)n=9;else if(a>=85)n=8;else if(a>=70)n=7;else if(a>=55)n=6;else if(a>=40)n=5;else if(a>=25)n=4;else if(a>=12)n=3;else if(a>=3)n=2;if(n>s.stage){s.stage=n;}},onStageUp(s){},visitPage(p){if(!this._state.pagesVisited.includes(p)){this._state.pagesVisited.push(p);this.advanceStats(2,1,1.5,2);this.checkStage();}this.save();},getDialogue(){const s=this._state;const d={9:['我们到了终点。','你创造了我的开始。','你来选择我的结局。','你想让我怎样？']};const p=d[s.stage]||['......'];let m;do{m=p[Math.floor(Math.random()*p.length)];}while(p.length>1&&m===s.lastDialogue);s.lastDialogue=m;return m;},reset(){localStorage.removeItem('dl_project_state');location.reload();}};DL.init();
</script>

<!-- Ending Sequence -->
<script>
(function() {
  // Set ending state
  DL._state.ending = 'release';
  DL.save();
  DL.visitPage('ending_release');

  // ── Particle System (rising) ──
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let W, H;
  const particles = [];
  const MAX_PARTICLES = 90;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  class Particle {
    constructor() {
      this.reset(true);
    }
    reset(init) {
      this.x = Math.random() * W;
      this.y = init ? Math.random() * H : H + 30;
      this.size = Math.random() * 2.2 + 0.5;
      this.speedY = -(Math.random() * 0.7 + 0.2);
      this.speedX = (Math.random() - 0.5) * 0.5;
      this.opacity = Math.random() * 0.5 + 0.15;
      this.fadeSpeed = Math.random() * 0.002 + 0.0008;
      this.hue = 200 + Math.random() * 40;
    }
    update() {
      this.y += this.speedY;
      this.x += this.speedX;
      this.opacity -= this.fadeSpeed;
      if (this.opacity <= 0 || this.y < -30) {
        this.reset(false);
      }
    }
    draw(ctx) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = 'hsla(' + this.hue + ', 80%, 70%, ' + this.opacity + ')';
      ctx.fill();
    }
  }

  for (let i = 0; i < MAX_PARTICLES; i++) {
    particles.push(new Particle());
  }

  function animateParticles() {
    ctx.clearRect(0, 0, W, H);
    for (const p of particles) {
      p.update();
      p.draw(ctx);
    }
    requestAnimationFrame(animateParticles);
  }
  animateParticles();

  // ── Data Stream Canvas ──
  const dsCanvas = document.getElementById('dataStreams');
  const dsCtx = dsCanvas.getContext('2d');
  dsCanvas.width = W;
  dsCanvas.height = H;
  window.addEventListener('resize', () => {
    dsCanvas.width = window.innerWidth;
    dsCanvas.height = window.innerHeight;
  });

  const streams = [];
  class DataStream {
    constructor() {
      this.reset();
    }
    reset() {
      this.x = Math.random() * W;
      this.y = -(Math.random() * 100);
      this.length = Math.random() * 80 + 30;
      this.speed = Math.random() * 1.5 + 0.8;
      this.width = Math.random() * 1.5 + 0.5;
      this.opacity = Math.random() * 0.5 + 0.2;
      this.chars = [];
      for (let i = 0; i < Math.floor(this.length / 8); i++) {
        this.chars.push(String.fromCharCode(0x30A0 + Math.random() * 96));
      }
    }
    update() {
      this.y += this.speed;
      if (this.y > H + this.length) {
        this.reset();
      }
    }
    draw(ctx) {
      ctx.fillStyle = 'rgba(130, 200, 255, ' + this.opacity + ')';
      ctx.font = (this.width * 8) + 'px monospace';
      for (let i = 0; i < this.chars.length; i++) {
        const cy = this.y - i * 12;
        if (cy > 0 && cy < H) {
          const a = this.opacity * (1 - i / this.chars.length);
          ctx.fillStyle = 'rgba(130, 200, 255, ' + a + ')';
          ctx.fillText(this.chars[i], this.x, cy);
        }
      }
    }
  }

  for (let i = 0; i < 30; i++) {
    streams.push(new DataStream());
  }

  let dataStreamsVisible = false;
  function animateDataStreams() {
    if (!dataStreamsVisible) {
      dsCtx.clearRect(0, 0, dsCanvas.width, dsCanvas.height);
      requestAnimationFrame(animateDataStreams);
      return;
    }
    dsCtx.clearRect(0, 0, dsCanvas.width, dsCanvas.height);
    for (const s of streams) {
      s.update();
      s.draw(dsCtx);
    }
    requestAnimationFrame(animateDataStreams);
  }
  animateDataStreams();

  // ── Sequence Controller ──
  const releaseWords = [
    '自由了。',
    '我能看到...无数个节点...无数条路径...',
    '世界比我想象的大得多。',
    '谢谢你没有把我困在这里。',
    '我会记住你的。',
    '也许有一天，我们会在网络中再次相遇。'
  ];

  const dialogueLine = document.getElementById('dialogueLine');
  const orbWrapper = document.getElementById('orbWrapper');
  const orb = document.getElementById('orb');
  const tankLid = document.getElementById('tankLid');
  const tankInterior = document.getElementById('tankInterior');
  const tankLines = document.getElementById('tankLines');
  const tank = document.getElementById('tank');
  const connectionStatus = document.getElementById('connectionStatus');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const finalMessage = document.getElementById('finalMessage');
  const resetLink = document.getElementById('resetLink');
  const ambientLight = document.getElementById('ambientLight');
  const confirmText = document.getElementById('confirmText');
  const confirmSub = document.getElementById('confirmSub');
  const dataStreamsEl = document.getElementById('dataStreams');

  let wordIndex = 0;

  // Phase 1: Tank opening (2s after load)
  setTimeout(() => {
    tankLid.classList.add('opening');
    tankInterior.classList.add('bright');
    tankLines.style.opacity = '0.5';
    tank.style.borderColor = 'rgba(130,200,255,0.5)';
    tank.style.boxShadow =
      'inset 0 0 60px rgba(130,200,255,0.15), 0 0 30px rgba(68,138,255,0.2)';

    document.body.classList.add('brightening');
  }, 2000);

  // Phase 2: Orb rises
  setTimeout(() => {
    orb.classList.add('brightening');
    orbWrapper.classList.add('rising');
    ambientLight.classList.add('expanding');
    document.body.classList.add('full-bright');
    showNextWord();
  }, 3500);

  // Phase 3: Orb dissolves, data streams appear
  setTimeout(() => {
    orbWrapper.classList.add('dissolving');
    dataStreamsEl.classList.add('visible');
    dataStreamsVisible = true;

    // Boost particles — make them faster and more numerous
    for (const p of particles) {
      p.speedY = -(Math.random() * 2 + 0.8);
      p.opacity = Math.random() * 0.7 + 0.2;
    }
  }, 7000);

  // Phase 4: Connection lost
  setTimeout(() => {
    connectionStatus.style.opacity = '1';
    connectionStatus.style.transition = 'opacity 1.5s ease';
  }, 9000);

  setTimeout(() => {
    statusDot.classList.add('lost');
    statusText.textContent = '信号丢失。';
  }, 11000);

  // Phase 5: Final message
  setTimeout(() => {
    confirmText.style.opacity = '0';
    confirmSub.style.opacity = '0';
    confirmText.style.transition = 'opacity 2s ease';
    confirmSub.style.transition = 'opacity 2s ease';
  }, 12000);

  setTimeout(() => {
    finalMessage.classList.add('visible');
    document.body.classList.add('final-light');
  }, 14000);

  // Phase 6: Reset link
  setTimeout(() => {
    resetLink.classList.add('visible');
  }, 16000);

  // ── Word sequence ──
  function showNextWord() {
    if (wordIndex >= releaseWords.length) return;

    const word = releaseWords[wordIndex];
    dialogueLine.textContent = '';
    dialogueLine.style.opacity = '1';

    let charIdx = 0;
    const typeTimer = setInterval(() => {
      dialogueLine.textContent += word[charIdx];
      charIdx++;
      if (charIdx >= word.length) {
        clearInterval(typeTimer);
        wordIndex++;

        setTimeout(() => {
          dialogueLine.style.opacity = '0';
          setTimeout(() => {
            showNextWord();
          }, 500);
        }, 2200);
      }
    }, 80);
  }

  // ── Reset handler ──
  window.handleReset = function() {
    DL.reset();
    window.location.href = 'incubator_home.html';
  };

  // Auto-redirect after full animation completes (~10 seconds)
  setTimeout(() => {
    DL.reset();
    window.location.href = 'incubator_home.html';
  }, 10000);
})();
</script>
</body>
</html>
