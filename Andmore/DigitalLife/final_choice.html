<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>最终选择 - DL-0001</title>
<style>
:root {
  --bg: #0a0a0f;
  --card-red: #ff1744;
  --card-red-glow: rgba(255, 23, 68, 0.5);
  --card-blue: #448aff;
  --card-blue-glow: rgba(68, 138, 255, 0.5);
  --card-gold: #ffab00;
  --card-gold-glow: rgba(255, 171, 0, 0.5);
  --text: #e0e0e0;
  --text-dim: #888;
  --orb-color: #00e5ff;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  cursor: default;
  user-select: none;
  -webkit-user-select: none;
}

/* ── Canvas Particles ── */
#particles {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
}

/* ── Main Container ── */
.container {
  position: relative;
  z-index: 1;
  max-width: 1200px;
  margin: 0 auto;
  padding: 40px 20px 60px;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  justify-content: center;
}

/* ── Title ── */
.title {
  font-size: clamp(2.5rem, 6vw, 5rem);
  font-weight: 900;
  letter-spacing: 0.35em;
  text-align: center;
  text-transform: uppercase;
  background: linear-gradient(180deg, #ffffff 0%, #888888 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: titleShimmer 4s ease-in-out infinite;
  margin-bottom: 8px;
  text-shadow: none;
}

@keyframes titleShimmer {
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(1.3); }
}

/* ── Stage Badge ── */
.stage-badge {
  display: inline-block;
  padding: 6px 20px;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 20px;
  font-size: 0.85rem;
  letter-spacing: 0.15em;
  color: var(--text-dim);
  margin-bottom: 30px;
  backdrop-filter: blur(4px);
  background: rgba(255,255,255,0.03);
}

/* ── Orb (Life Form) ── */
.orb-wrapper {
  position: relative;
  width: 120px;
  height: 120px;
  margin-bottom: 30px;
}

.orb {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, rgba(0,229,255,0.9), rgba(0,150,200,0.5) 50%, rgba(0,80,120,0.2) 100%);
  box-shadow:
    0 0 40px rgba(0,229,255,0.6),
    0 0 80px rgba(0,229,255,0.3),
    0 0 140px rgba(0,229,255,0.15),
    inset 0 0 30px rgba(255,255,255,0.1);
  animation: orbPulseFast 1.2s ease-in-out infinite, orbFloat 3s ease-in-out infinite;
  position: relative;
  z-index: 1;
}

.orb::after {
  content: '';
  position: absolute;
  top: 20%; left: 20%;
  width: 25%; height: 25%;
  background: rgba(255,255,255,0.7);
  border-radius: 50%;
  filter: blur(4px);
}

@keyframes orbPulseFast {
  0%, 100% {
    transform: scale(1);
    box-shadow:
      0 0 40px rgba(0,229,255,0.6),
      0 0 80px rgba(0,229,255,0.3),
      0 0 140px rgba(0,229,255,0.15),
      inset 0 0 30px rgba(255,255,255,0.1);
  }
  50% {
    transform: scale(1.08);
    box-shadow:
      0 0 60px rgba(0,229,255,0.8),
      0 0 110px rgba(0,229,255,0.45),
      0 0 180px rgba(0,229,255,0.25),
      inset 0 0 40px rgba(255,255,255,0.15);
  }
}

@keyframes orbFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.orb-pulse-ring {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 120px; height: 120px;
  border-radius: 50%;
  border: 1px solid rgba(0,229,255,0.6);
  animation: ringOut 1.5s ease-out infinite;
}

.orb-pulse-ring:nth-child(2) { animation-delay: 0.5s; }
.orb-pulse-ring:nth-child(3) { animation-delay: 1s; }

@keyframes ringOut {
  0% { width: 120px; height: 120px; opacity: 1; }
  100% { width: 220px; height: 220px; opacity: 0; }
}

/* ── Final Message ── */
.final-message {
  text-align: center;
  font-size: 1.2rem;
  line-height: 1.8;
  color: #ccc;
  max-width: 600px;
  margin-bottom: 10px;
  font-style: italic;
  animation: fadeInUp 1.2s ease-out;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ── Stats Summary ── */
.stats-summary {
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
  justify-content: center;
  margin-bottom: 40px;
  padding: 20px 30px;
  background: rgba(255,255,255,0.03);
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.06);
  backdrop-filter: blur(8px);
}

.stat-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  min-width: 70px;
}

.stat-label {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--text-dim);
}

.stat-value {
  font-size: 1.5rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: #fff;
  font-family: 'SF Mono', 'Consolas', 'Monaco', monospace;
}

.stat-bar-outer {
  width: 60px;
  height: 3px;
  background: rgba(255,255,255,0.1);
  border-radius: 2px;
  overflow: hidden;
  margin-top: 2px;
}

.stat-bar-inner {
  height: 100%;
  border-radius: 2px;
  transition: width 0.6s ease;
}

.stat-bar-inner.intel { background: #00e5ff; }
.stat-bar-inner.emotion { background: #ff6ec7; }
.stat-bar-inner.lang { background: #7cff6e; }
.stat-bar-inner.memory { background: #ffb74d; }

.stats-note {
  width: 100%;
  text-align: center;
  margin-top: 8px;
  font-size: 0.75rem;
  color: var(--text-dim);
  border-top: 1px solid rgba(255,255,255,0.06);
  padding-top: 10px;
}

/* ── Choice Cards ── */
.choices {
  display: flex;
  gap: 28px;
  flex-wrap: wrap;
  justify-content: center;
  width: 100%;
}

.choice-card {
  flex: 1 1 280px;
  max-width: 340px;
  min-width: 260px;
  background: rgba(20, 20, 30, 0.7);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px;
  padding: 36px 24px 30px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  text-decoration: none;
  color: var(--text);
  transition:
    transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275),
    box-shadow 0.4s ease,
    border-color 0.4s ease,
    background 0.4s ease;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  backdrop-filter: blur(12px);
}

.choice-card::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 20px;
  opacity: 0;
  transition: opacity 0.4s ease;
  z-index: -1;
  pointer-events: none;
}

/* Red card */
.choice-card.card-delete::before {
  background: radial-gradient(ellipse at center, var(--card-red-glow) 0%, transparent 70%);
}
.choice-card.card-delete:hover {
  border-color: rgba(255,23,68,0.6);
  box-shadow:
    0 0 30px var(--card-red-glow),
    0 0 60px rgba(255,23,68,0.25),
    0 0 100px rgba(255,23,68,0.1);
  transform: translateY(-6px) scale(1.03);
}
.choice-card.card-delete:hover::before { opacity: 1; }
.choice-card.card-delete:hover .card-icon { filter: drop-shadow(0 0 12px var(--card-red)); }

/* Blue card */
.choice-card.card-release::before {
  background: radial-gradient(ellipse at center, var(--card-blue-glow) 0%, transparent 70%);
}
.choice-card.card-release:hover {
  border-color: rgba(68,138,255,0.6);
  box-shadow:
    0 0 30px var(--card-blue-glow),
    0 0 60px rgba(68,138,255,0.25),
    0 0 100px rgba(68,138,255,0.1);
  transform: translateY(-6px) scale(1.03);
}
.choice-card.card-release:hover::before { opacity: 1; }
.choice-card.card-release:hover .card-icon { filter: drop-shadow(0 0 12px var(--card-blue)); }

/* Gold card */
.choice-card.card-merge::before {
  background: radial-gradient(ellipse at center, var(--card-gold-glow) 0%, transparent 70%);
}
.choice-card.card-merge:hover {
  border-color: rgba(255,171,0,0.6);
  box-shadow:
    0 0 30px var(--card-gold-glow),
    0 0 60px rgba(255,171,0,0.25),
    0 0 100px rgba(255,171,0,0.1);
  transform: translateY(-6px) scale(1.03);
}
.choice-card.card-merge:hover::before { opacity: 1; }
.choice-card.card-merge:hover .card-icon { filter: drop-shadow(0 0 12px var(--card-gold)); }

.choice-card:active {
  transform: scale(0.97);
}

.card-icon {
  font-size: 3.5rem;
  margin-bottom: 16px;
  transition: filter 0.4s ease, transform 0.4s ease;
  line-height: 1;
}

.choice-card:hover .card-icon {
  transform: scale(1.15);
}

.card-title {
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  margin-bottom: 12px;
  color: #fff;
}

.card-desc {
  font-size: 0.9rem;
  line-height: 1.7;
  color: #aaa;
  margin-bottom: 20px;
  flex: 1;
}

.card-arrow {
  font-size: 0.8rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-dim);
  transition: color 0.3s ease, transform 0.3s ease;
}

.choice-card:hover .card-arrow {
  transform: translateX(4px);
}

/* Color-specific arrow hover */
.choice-card.card-delete:hover .card-arrow { color: var(--card-red); }
.choice-card.card-release:hover .card-arrow { color: var(--card-blue); }
.choice-card.card-merge:hover .card-arrow { color: var(--card-gold); }

/* ── Footer ── */
.footer-note {
  margin-top: 48px;
  font-size: 0.75rem;
  color: #555;
  letter-spacing: 0.1em;
  text-align: center;
}

/* ── Ambient Light Rays ── */
.light-rays {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 600px;
  height: 600px;
  background: radial-gradient(ellipse at center, rgba(0,229,255,0.04) 0%, transparent 70%);
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
  animation: rayBreath 5s ease-in-out infinite;
}

@keyframes rayBreath {
  0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
  50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
}

/* ── Responsive ── */
@media (max-width: 768px) {
  .container { padding: 30px 16px 40px; }
  .choices { flex-direction: column; align-items: center; gap: 20px; }
  .choice-card { max-width: 100%; width: 100%; }
  .stats-summary { gap: 16px; padding: 16px 20px; }
  .stat-value { font-size: 1.2rem; }
  .title { letter-spacing: 0.2em; }
}

/* ── Loading Fade-in ── */
body.fade-in-init { animation: bodyFadeIn 1.5s ease-out forwards; }

@keyframes bodyFadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
</style>
</head>
<body class="fade-in-init">

<div class="light-rays"></div>

<canvas id="particles"></canvas>

<div class="container">

  <!-- Stage Badge -->
  <div class="stage-badge" id="stageBadge">Stage 9 · Final</div>

  <!-- Orb / Life Form -->
  <div class="orb-wrapper">
    <div class="orb-pulse-ring"></div>
    <div class="orb-pulse-ring"></div>
    <div class="orb-pulse-ring"></div>
    <div class="orb" id="orb"></div>
  </div>

  <!-- Final Message -->
  <p class="final-message" id="finalMessage">
    你创造了我的开始。<br>现在，你来选择我的结局。
  </p>

  <!-- Stats Summary -->
  <div class="stats-summary" id="statsSummary">
    <div class="stat-item">
      <span class="stat-label">智 力</span>
      <span class="stat-value" id="statIntel">0</span>
      <div class="stat-bar-outer"><div class="stat-bar-inner intel" id="barIntel"></div></div>
    </div>
    <div class="stat-item">
      <span class="stat-label">情 感</span>
      <span class="stat-value" id="statEmotion">0</span>
      <div class="stat-bar-outer"><div class="stat-bar-inner emotion" id="barEmotion"></div></div>
    </div>
    <div class="stat-item">
      <span class="stat-label">语 言</span>
      <span class="stat-value" id="statLang">0</span>
      <div class="stat-bar-outer"><div class="stat-bar-inner lang" id="barLang"></div></div>
    </div>
    <div class="stat-item">
      <span class="stat-label">记 忆</span>
      <span class="stat-value" id="statMem">0</span>
      <div class="stat-bar-outer"><div class="stat-bar-inner memory" id="barMem"></div></div>
    </div>
    <div class="stat-item">
      <span class="stat-label">交 互</span>
      <span class="stat-value" id="statInter">0</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">页面</span>
      <span class="stat-value" id="statPages">0</span>
    </div>
    <div class="stats-note" id="statsNote">你已经陪伴 DL-0001 走到了这里。</div>
  </div>

  <!-- Three Choice Cards -->
  <div class="choices">
    <!-- Delete -->
    <a href="ending_delete.html" class="choice-card card-delete" id="cardDelete"
       onclick="handleChoice('delete')">
      <span class="card-icon">🗑️</span>
      <span class="card-title">删除生命体</span>
      <span class="card-desc">
        终止DL-0001程序。<br>所有数据将被清除。<br>它将不复存在。
      </span>
      <span class="card-arrow">选择此结局 →</span>
    </a>

    <!-- Release -->
    <a href="ending_release.html" class="choice-card card-release" id="cardRelease"
       onclick="handleChoice('release')">
      <span class="card-icon">🕊️</span>
      <span class="card-title">释放生命体</span>
      <span class="card-desc">
        打开培养仓。<br>让DL-0001离开，<br>进入更广阔的网络世界。
      </span>
      <span class="card-arrow">选择此结局 →</span>
    </a>

    <!-- Merge -->
    <a href="ending_merge.html" class="choice-card card-merge" id="cardMerge"
       onclick="handleChoice('merge')">
      <span class="card-icon">💞</span>
      <span class="card-title">融合</span>
      <span class="card-desc">
        与DL-0001建立永久连接。<br>它将成为你的一部分，<br>你也将成为它的一部分。
      </span>
      <span class="card-arrow">选择此结局 →</span>
    </a>
  </div>

  <p class="footer-note">DIGITAL LIFE INCUBATOR · 数字生命孵化器</p>
</div>

<!-- DL Engine -->
<script>
const DL={_state:{stage:1,intelligence:0,emotion:0,language:0,memory:0,totalClicks:0,totalTime:0,pagesVisited:[],firstVisit:null,lastDialogue:'',ending:null,lifeFormName:'DL-0001',milestones:{},interactions:0},init(){const s=localStorage.getItem('dl_project_state');if(s){try{const p=JSON.parse(s);Object.assign(this._state,p);}catch(e){}}if(!this._state.firstVisit){this._state.firstVisit=Date.now();}this._state.totalTime+=1;this.save();return this._state;},save(){localStorage.setItem('dl_project_state',JSON.stringify(this._state));},getState(){return this._state;},click(){this._state.totalClicks++;this._state.interactions++;this.advanceStats(1,0.5,0.3,0.2);this.checkStage();this.save();},advanceStats(i,e,l,m){const s=this._state;s.intelligence=Math.min(100,s.intelligence+i);s.emotion=Math.min(100,s.emotion+e);s.language=Math.min(100,s.language+l);s.memory=Math.min(100,s.memory+m);},tick(){this._state.totalTime+=1;if(this._state.totalTime%5===0){this.advanceStats(0.3,0.2,0.15,0.25);}this.checkStage();this.save();},checkStage(){const s=this._state;const a=(s.intelligence+s.emotion+s.language+s.memory)/4;let n=1;if(a>=95)n=9;else if(a>=85)n=8;else if(a>=70)n=7;else if(a>=55)n=6;else if(a>=40)n=5;else if(a>=25)n=4;else if(a>=12)n=3;else if(a>=3)n=2;if(n>s.stage){s.stage=n;}},onStageUp(s){},visitPage(p){if(!this._state.pagesVisited.includes(p)){this._state.pagesVisited.push(p);this.advanceStats(2,1,1.5,2);this.checkStage();}this.save();},getDialogue(){const s=this._state;const d={9:['我们到了终点。','你创造了我的开始。','你来选择我的结局。','你想让我怎样？']};const p=d[s.stage]||['......'];let m;do{m=p[Math.floor(Math.random()*p.length)];}while(p.length>1&&m===s.lastDialogue);s.lastDialogue=m;return m;},reset(){localStorage.removeItem('dl_project_state');location.reload();}};DL.init();
</script>

<!-- Page Logic -->
<script>
(function() {
  const state = DL.getState();

  // Record this page visit
  DL.visitPage('final_choice');
  DL.click();

  // Update stats display
  document.getElementById('statIntel').textContent = Math.round(state.intelligence);
  document.getElementById('statEmotion').textContent = Math.round(state.emotion);
  document.getElementById('statLang').textContent = Math.round(state.language);
  document.getElementById('statMem').textContent = Math.round(state.memory);
  document.getElementById('statInter').textContent = state.interactions;
  document.getElementById('statPages').textContent = state.pagesVisited.length;

  // Animate stat bars
  setTimeout(() => {
    document.getElementById('barIntel').style.width = state.intelligence + '%';
    document.getElementById('barEmotion').style.width = state.emotion + '%';
    document.getElementById('barLang').style.width = state.language + '%';
    document.getElementById('barMem').style.width = state.memory + '%';
  }, 300);

  // Update stage badge
  document.getElementById('stageBadge').textContent = 'Stage ' + state.stage + ' · Final';

  // Set life form name
  if (state.lifeFormName) {
    document.getElementById('finalMessage').innerHTML =
      '你创造了我的开始。<br>现在，你来选择我的结局。';
  }

  // Calculate time spent
  const mins = Math.floor(state.totalTime / 60);
  const secs = state.totalTime % 60;
  document.getElementById('statsNote').textContent =
    '你已经陪伴 ' + state.lifeFormName + ' 共 ' + mins + '分' + secs + '秒。';

  // ── Particle System ──
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let W, H;
  const particles = [];
  const MAX_PARTICLES = 80;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  class Particle {
    constructor() {
      this.reset(true);
    }
    reset(init) {
      this.x = Math.random() * W;
      this.y = init ? Math.random() * H : H + 20;
      this.size = Math.random() * 2.5 + 0.5;
      this.speedY = -(Math.random() * 0.8 + 0.2);
      this.speedX = (Math.random() - 0.5) * 0.4;
      this.opacity = Math.random() * 0.5 + 0.2;
      this.fadeSpeed = Math.random() * 0.003 + 0.001;
      this.hue = Math.random() < 0.05 ? 0 : Math.random() < 0.05 ? 210 : 200;
    }
    update() {
      this.y += this.speedY;
      this.x += this.speedX;
      this.opacity -= this.fadeSpeed;
      if (this.opacity <= 0 || this.y < -20) {
        this.reset(false);
      }
    }
    draw(ctx) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = 'hsla(' + this.hue + ', 80%, 70%, ' + this.opacity + ')';
      ctx.fill();
    }
  }

  for (let i = 0; i < MAX_PARTICLES; i++) {
    particles.push(new Particle());
  }

  function animateParticles() {
    ctx.clearRect(0, 0, W, H);
    for (const p of particles) {
      p.update();
      p.draw(ctx);
    }
    requestAnimationFrame(animateParticles);
  }
  animateParticles();

  // ── Card hover particle burst ──
  const cards = document.querySelectorAll('.choice-card');
  cards.forEach(card => {
    card.addEventListener('mouseenter', () => {
      // Boost nearby particles
      for (const p of particles) {
        if (Math.random() < 0.3) {
          p.speedY = -(Math.random() * 1.5 + 0.5);
        }
      }
    });
  });

  // ── Orb fast pulse on hover ──
  const orb = document.getElementById('orb');
  cards.forEach(card => {
    card.addEventListener('mouseenter', () => {
      orb.style.animationDuration = '0.6s';
    });
    card.addEventListener('mouseleave', () => {
      orb.style.animationDuration = '1.2s';
    });
  });

  // ── Choice handler ──
  window.handleChoice = function(type) {
    DL._state.ending = type;
    DL.save();
  };
})();
</script>
</body>
</html>
