<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>航空公司(上) · AeroAtlas</title>
    <meta name="description" content="AeroAtlas亚太地区航空公司档案，收录中国国航、新加坡航空、全日空、澳洲航空、阿联酋航空、卡塔尔航空等20+航司的详细资料。">
    <style>
        :root{--sky-deep:#0a1628;--sky-navy:#0d2137;--sky-blue:#1a5f8a;--sky-light:#2196c8;--sky-pale:#e3f2fd;--cloud-white:#f5f9fc;--accent-gold:#d4a017;--accent-silver:#b0bec5;--text-primary:#1a1a1a;--text-secondary:#3d3d3d;--text-muted:#6b6b6b;--text-on-dark:#e8f0f8;--border-light:#dde4ea;--shadow-soft:0 4px 20px rgba(10,22,40,0.06);--shadow-hover:0 12px 35px rgba(10,22,40,0.15);--radius-sm:6px;--radius-md:10px;--radius-lg:16px;--radius-xl:22px;--radius-full:50px;--transition-fast:0.2s ease;--transition-smooth:0.35s cubic-bezier(0.4,0,0.2,1);--font-heading:'Georgia','Noto Serif SC',serif;--font-body:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;--font-mono:'SF Mono','Consolas',monospace;}
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:var(--font-body);background:var(--cloud-white);color:var(--text-primary);min-height:100vh;padding-bottom:3rem;line-height:1.6;}
        .navbar{position:sticky;top:0;z-index:100;background:rgba(10,22,40,0.96);backdrop-filter:blur(16px);border-bottom:2px solid var(--accent-gold);padding:0.7rem 2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;}
        .logo{display:flex;align-items:center;gap:0.5rem;cursor:pointer;text-decoration:none;}.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--sky-blue),var(--sky-navy));border:1px solid var(--accent-gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:var(--accent-gold);}.logo-text{font-family:var(--font-heading);font-size:1.2rem;font-weight:700;color:var(--text-on-dark);}
        .nav-links{display:flex;gap:1rem;list-style:none;flex-wrap:wrap;}.nav-links a{color:#c0ccd8;text-decoration:none;font-weight:500;font-size:0.78rem;transition:color var(--transition-fast);border-bottom:2px solid transparent;}.nav-links a:hover{color:var(--accent-gold);border-bottom-color:var(--accent-gold);}.nav-links a.active{color:var(--accent-gold);font-weight:600;border-bottom-color:var(--sky-light);}
        .page-header{text-align:center;padding:2.5rem 1rem 1rem;}.page-header h1{font-family:var(--font-heading);font-size:2.5rem;color:var(--text-primary);}.page-header .subtitle{color:var(--text-muted);}
        .container{max-width:1200px;margin:0 auto;padding:0 1.5rem;}
        .airline-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:2rem;}
        .airline-card{background:white;border:1px solid var(--border-light);border-radius:var(--radius-xl);overflow:hidden;box-shadow:var(--shadow-soft);transition:all var(--transition-smooth);}.airline-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-4px);}
        .airline-card .card-head{background:linear-gradient(135deg,var(--sky-navy),var(--sky-blue));padding:1.5rem;color:var(--text-on-dark);display:flex;align-items:center;gap:1rem;}
        .airline-card .card-head .airline-logo{width:50px;height:50px;background:rgba(255,255,255,0.15);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0;}
        .airline-card .card-head h3{font-family:var(--font-heading);font-size:1.3rem;}.airline-card .card-head .iata{font-family:var(--font-mono);font-size:0.8rem;opacity:0.8;}
        .airline-card .card-body{padding:1.8rem;}
        .airline-card .card-body .info-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;}
        .airline-card .card-body .info-item{font-size:0.85rem;}.airline-card .card-body .info-item .lbl{font-weight:700;color:var(--sky-blue);font-size:0.7rem;text-transform:uppercase;letter-spacing:0.5px;}.airline-card .card-body .info-item .val{color:var(--text-secondary);}
        .airline-card .card-body p{color:var(--text-secondary);line-height:1.8;font-size:0.9rem;text-indent:2em;margin:0.5rem 0;}
        .airline-card .card-body .fleet-tags{display:flex;flex-wrap:wrap;gap:0.3rem;margin:0.5rem 0;}
        .fleet-tag{padding:0.15rem 0.5rem;border-radius:var(--radius-full);font-size:0.68rem;background:var(--sky-pale);color:var(--sky-blue);font-weight:600;}
        @media(max-width:768px){.airline-grid{grid-template-columns:1fr;}.airline-card .card-body .info-row{grid-template-columns:1fr;}}
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar"><a href="aviation_home.html" class="logo"><span class="logo-icon">✈️</span><span class="logo-text">AeroAtlas</span></a><ul class="nav-links"><li><a href="aviation_home.html">首页</a></li><li><a href="aviation_airlines1.html" class="active">航空公司(上)</a></li><li><a href="aviation_airlines2.html">航空公司(下)</a></li><li><a href="aviation_aircraft1.html">客机机型(上)</a></li><li><a href="aviation_aircraft2.html">客机机型(下)</a></li><li><a href="aviation_alliance.html">航空联盟</a></li><li><a href="aviation_history.html">航空历史</a></li><li><a href="aviation_airport.html">世界机场</a></li></ul></nav>
    <div class="page-header"><h1>🌏 全球航空公司（上）</h1><p class="subtitle">亚太地区 · 中东 · 大洋洲 — 20+航空公司详细档案</p></div>
    <div class="container"><div class="airline-grid" id="airlineGrid"></div></div>
    <script>
        const airlines=[{
            name:'中国国际航空',iata:'CA',icao:'CCA',callsign:'国航',country:'中国',founded:'1988年',hub:'北京首都国际机场(PEK)',fleet:'约450架',alliance:'星空联盟',destinations:'200+',
            desc:'中国国际航空股份有限公司是中国载旗航空公司，也是中国最大的航空公司之一。国航以北京首都国际机场为主枢纽，成都双流国际机场和上海浦东国际机场为区域枢纽。国航拥有广泛的国内航线网络和覆盖六大洲的国际航线。作为星空联盟成员，国航旅客可享受全球1,300多个目的地的无缝连接。国航机队包括波音777-300ER、787梦想客机和空客A350等现代化机型。',
            fleetTypes:['波音777-300ER','波音787-9','空客A350-900','空客A330-300','波音737-800'],
            history:'国航的前身可追溯至1955年成立的中国民航北京管理局。1988年，中国民航体制改革，国航正式成立。2004年，国航在香港和伦敦上市。2007年加入星空联盟。'
        },{
            name:'新加坡航空',iata:'SQ',icao:'SIA',callsign:'新加坡',country:'新加坡',founded:'1972年',hub:'新加坡樟宜国际机场(SIN)',fleet:'约150架',alliance:'星空联盟',destinations:'130+',
            desc:'新加坡航空是全球公认的最佳航空公司之一，以卓越的服务品质和创新著称。新航以樟宜机场为枢纽，航线网络覆盖全球六大洲。新航是空客A380的首发客户，也是全球首家运营A380的航空公司。新航的"新加坡女孩"形象已成为航空业最具辨识度的品牌标志之一。',
            fleetTypes:['空客A380-800','空客A350-900','波音777-300ER','波音787-10','波音737 MAX 8'],
            history:'新加坡航空的前身是1947年成立的马来亚航空。1972年，新加坡与马来西亚分离后，新加坡航空正式成立。2004年，新航开通全球最长的不经停商业航线——新加坡至纽约。'
        },{
            name:'全日空',iata:'NH',icao:'ANA',callsign:'全日空',country:'日本',founded:'1952年',hub:'东京羽田机场(HND)/成田机场(NRT)',fleet:'约240架',alliance:'星空联盟',destinations:'100+',
            desc:'全日本空输株式会社（简称全日空或ANA）是日本最大的航空公司。全日空以东京两座机场（羽田和成田）为枢纽，拥有庞大的国内航线网络和不断扩展的国际航线。全日空是波音787梦想客机的首发客户和全球最大运营商之一。全日空以准点率和精细的日式服务著称。',
            fleetTypes:['波音787-9','波音777-300ER','波音767-300ER','空客A380(飞往夏威夷)','空客A321neo'],
            history:'全日空成立于1952年，最初以直升机服务起家。1986年开始运营国际航线。2013年，全日空接收全球首架波音787。'
        },{
            name:'阿联酋航空',iata:'EK',icao:'UAE',callsign:'阿联酋',country:'阿联酋',founded:'1985年',hub:'迪拜国际机场(DXB)',fleet:'约260架',alliance:'无(独立运营)',destinations:'150+',
            desc:'阿联酋航空是全球最大的国际航空公司之一，以迪拜为枢纽连接世界。阿联酋航空是全球最大的空客A380和波音777运营商。其头等舱的私人套间和机上淋浴设施重新定义了奢华航空旅行。阿联酋航空不加入任何航空联盟，依靠迪拜的地理优势和庞大的宽体机队与全球航空公司竞争。',
            fleetTypes:['空客A380-800(最大运营商)','波音777-300ER','波音777-200LR'],
            history:'阿联酋航空于1985年由迪拜政府创立，最初仅有两架租赁的飞机。1990年代迅速扩张，2008年成为全球最大的A380客户。迪拜国际机场已成为全球最繁忙的国际航空枢纽。'
        },{
            name:'卡塔尔航空',iata:'QR',icao:'QTR',callsign:'卡塔尔',country:'卡塔尔',founded:'1993年',hub:'多哈哈马德国际机场(DOH)',fleet:'约230架',alliance:'寰宇一家',destinations:'160+',
            desc:'卡塔尔航空是中东三大航之一，以多哈哈马德国际机场为枢纽。卡塔尔航空多次被评为Skytrax年度最佳航空公司。其Qsuite商务舱产品被认为是业界最佳商务舱之一。卡塔尔航空是空客A350的首发客户。',
            fleetTypes:['空客A350-1000','空客A350-900','波音777-300ER','波音787-9','空客A380-800'],
            history:'卡塔尔航空成立于1993年，最初是小型区域航空公司。2014年搬迁至新建的哈马德国际机场。2013年加入寰宇一家航空联盟。'
        }];
        document.getElementById('airlineGrid').innerHTML=airlines.map((a,i)=>`<div class="airline-card" style="animation:fadeIn 0.5s ease ${i*0.05}s both;"><div class="card-head"><span class="airline-logo">✈️</span><div><h3>${a.name}</h3><span class="iata">${a.iata}/${a.icao} · ${a.callsign}</span></div></div><div class="card-body"><div class="info-row"><div class="info-item"><span class="lbl">国家</span><div class="val">${a.country}</div></div><div class="info-item"><span class="lbl">成立</span><div class="val">${a.founded}</div></div><div class="info-item"><span class="lbl">枢纽</span><div class="val">${a.hub}</div></div><div class="info-item"><span class="lbl">机队</span><div class="val">${a.fleet}</div></div><div class="info-item"><span class="lbl">联盟</span><div class="val">${a.alliance}</div></div><div class="info-item"><span class="lbl">目的地</span><div class="val">${a.destinations}</div></div></div><p>${a.desc}</p><div class="fleet-tags">${a.fleetTypes.map(f=>`<span class="fleet-tag">${f}</span>`).join('')}</div><p style="font-size:0.82rem;color:var(--text-muted);"><strong>历史：</strong>${a.history}</p></div></div>`).join('');
        const st=document.createElement('style');st.textContent='@keyframes fadeIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}';document.head.appendChild(st);
    </script>
</body>
