<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <title>航空公司(下) · AeroAtlas</title>
    <meta name="description" content="AeroAtlas欧美地区航空公司档案，收录汉莎航空、法航、英航、美联航、达美航空、西南航空等20+航司的详细资料。">
    <style>
        :root{--sky-deep:#0a1628;--sky-navy:#0d2137;--sky-blue:#1a5f8a;--sky-light:#2196c8;--sky-pale:#e3f2fd;--cloud-white:#f5f9fc;--accent-gold:#d4a017;--text-primary:#1a1a1a;--text-secondary:#3d3d3d;--text-muted:#6b6b6b;--text-on-dark:#e8f0f8;--border-light:#dde4ea;--shadow-soft:0 4px 20px rgba(10,22,40,0.06);--shadow-hover:0 12px 35px rgba(10,22,40,0.15);--radius-sm:6px;--radius-lg:16px;--radius-xl:22px;--radius-full:50px;--transition-fast:0.2s ease;--transition-smooth:0.35s cubic-bezier(0.4,0,0.2,1);--font-heading:'Georgia','Noto Serif SC',serif;--font-body:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;--font-mono:'SF Mono','Consolas',monospace;}
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:var(--font-body);background:var(--cloud-white);color:var(--text-primary);min-height:100vh;padding-bottom:3rem;line-height:1.6;}
        .navbar{position:sticky;top:0;z-index:100;background:rgba(10,22,40,0.96);backdrop-filter:blur(16px);border-bottom:2px solid var(--accent-gold);padding:0.7rem 2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;}
        .logo{display:flex;align-items:center;gap:0.5rem;cursor:pointer;text-decoration:none;}.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--sky-blue),var(--sky-navy));border:1px solid var(--accent-gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:var(--accent-gold);}.logo-text{font-family:var(--font-heading);font-size:1.2rem;font-weight:700;color:var(--text-on-dark);}
        .nav-links{display:flex;gap:1rem;list-style:none;flex-wrap:wrap;}.nav-links a{color:#c0ccd8;text-decoration:none;font-weight:500;font-size:0.78rem;transition:color var(--transition-fast);border-bottom:2px solid transparent;}.nav-links a:hover{color:var(--accent-gold);border-bottom-color:var(--accent-gold);}.nav-links a.active{color:var(--accent-gold);font-weight:600;border-bottom-color:var(--sky-light);}
        .page-header{text-align:center;padding:2.5rem 1rem 1rem;}.page-header h1{font-family:var(--font-heading);font-size:2.5rem;color:var(--text-primary);}
        .container{max-width:1200px;margin:0 auto;padding:0 1.5rem;}
        .airline-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:2rem;}
        .airline-card{background:white;border:1px solid var(--border-light);border-radius:var(--radius-xl);overflow:hidden;box-shadow:var(--shadow-soft);transition:all var(--transition-smooth);}.airline-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-4px);}
        .airline-card .card-head{background:linear-gradient(135deg,var(--sky-navy),var(--sky-blue));padding:1.5rem;color:var(--text-on-dark);display:flex;align-items:center;gap:1rem;}
        .airline-card .card-head .logo-icon{width:50px;height:50px;background:rgba(255,255,255,0.15);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5rem;}
        .airline-card .card-head h3{font-family:var(--font-heading);font-size:1.3rem;}.airline-card .card-head .iata{font-family:var(--font-mono);font-size:0.8rem;opacity:0.8;}
        .airline-card .card-body{padding:1.8rem;}
        .airline-card .card-body .info-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;}
        .airline-card .card-body .info-item{font-size:0.85rem;}.airline-card .card-body .info-item .lbl{font-weight:700;color:var(--sky-blue);font-size:0.7rem;text-transform:uppercase;}.airline-card .card-body .info-item .val{color:var(--text-secondary);}
        .airline-card .card-body p{color:var(--text-secondary);line-height:1.8;font-size:0.9rem;text-indent:2em;}
        .fleet-tags{display:flex;flex-wrap:wrap;gap:0.3rem;margin:0.5rem 0;}
        .fleet-tag{padding:0.15rem 0.5rem;border-radius:var(--radius-full);font-size:0.68rem;background:var(--sky-pale);color:var(--sky-blue);font-weight:600;}
        @media(max-width:768px){.airline-grid{grid-template-columns:1fr;}}
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar"><a href="aviation_home.html" class="logo"><span class="logo-icon">✈️</span><span class="logo-text">AeroAtlas</span></a><ul class="nav-links"><li><a href="aviation_home.html">首页</a></li><li><a href="aviation_airlines1.html">航空公司(上)</a></li><li><a href="aviation_airlines2.html" class="active">航空公司(下)</a></li><li><a href="aviation_aircraft1.html">客机机型(上)</a></li><li><a href="aviation_aircraft2.html">客机机型(下)</a></li><li><a href="aviation_alliance.html">航空联盟</a></li><li><a href="aviation_history.html">航空历史</a></li><li><a href="aviation_airport.html">世界机场</a></li></ul></nav>
    <div class="page-header"><h1>🌍 全球航空公司（下）</h1><p style="color:var(--text-muted);">欧洲 · 北美 · 南美 — 20+航空公司详细档案</p></div>
    <div class="container"><div class="airline-grid" id="airlineGrid"></div></div>
    <script>
        const airlines2=[{
            name:'汉莎航空',iata:'LH',icao:'DLH',callsign:'汉莎',country:'德国',founded:'1953年',hub:'法兰克福机场(FRA)/慕尼黑机场(MUC)',fleet:'约300架',alliance:'星空联盟',destinations:'220+',
            desc:'德国汉莎航空是欧洲最大的航空公司，也是星空联盟的创始成员之一。汉莎以法兰克福和慕尼黑为双枢纽，航线网络覆盖全球。汉莎集团旗下还包括瑞士国际航空、奥地利航空和布鲁塞尔航空。',
            fleetTypes:['空客A350-900','空客A380-800','波音747-8','波音787-9','空客A320neo'],
            history:'汉莎航空的历史可追溯至1926年成立的德意志汉莎。二战后重新成立，1955年恢复运营。1997年成为星空联盟创始成员。'
        },{
            name:'英国航空',iata:'BA',icao:'BAW',callsign:'英航',country:'英国',founded:'1974年',hub:'伦敦希思罗机场(LHR)',fleet:'约280架',alliance:'寰宇一家',destinations:'200+',
            desc:'英国航空是英国载旗航空公司，以伦敦希思罗机场为主枢纽。英航是全球最大的波音747运营商之一（已于2020年退役全部747）。英航拥有伦敦至纽约的跨大西洋优质航线。',

            history:'英航由英国海外航空(BOAC)和英国欧洲航空(BEA)于1974年合并成立。1987年私有化。1999年成为寰宇一家创始成员。'
        },{
            name:'达美航空',iata:'DL',icao:'DAL',callsign:'达美',country:'美国',founded:'1924年',hub:'亚特兰大哈茨菲尔德(ATL)',fleet:'约950架',alliance:'天合联盟',destinations:'325+',

            history:'达美航空成立于1924年，最初是农药喷洒公司。1929年开始客运服务。2000年成为天合联盟创始成员。'
        }];
        document.getElementById('airlineGrid').innerHTML=airlines2.map((a,i)=>`<div class="airline-card"><div class="card-head"><span class="logo-icon">✈️</span><div><h3>${a.name}</h3><span class="iata">${a.iata}/${a.icao}</span></div></div><div class="card-body"><div class="info-row"><div class="info-item"><span class="lbl">枢纽</span><div class="val">${a.hub}</div></div><div class="info-item"><span class="lbl">机队</span><div class="val">${a.fleet}</div></div><div class="info-item"><span class="lbl">联盟</span><div class="val">${a.alliance}</div></div><div class="info-item"><span class="lbl">目的地</span><div class="val">${a.destinations}</div></div></div><p>${a.desc}</p><div class="fleet-tags">${a.fleetTypes.map(f=>`<span class="fleet-tag">${f}</span>`).join('')}</div><p style="font-size:0.82rem;color:var(--text-muted);">${a.history}</p></div></div>`).join('');
    </script>
</body>
</html>
