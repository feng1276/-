<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>航空历史 · AeroAtlas</title>
    <meta name="description" content="AeroAtlas航空历史专题，收录从莱特兄弟首次飞行到超音速协和号的百年航空史，包含里程碑事件、先驱人物和技术革新。">
    <style>
        :root{--sky-deep:#0a1628;--sky-navy:#0d2137;--sky-blue:#1a5f8a;--sky-light:#2196c8;--sky-pale:#e3f2fd;--cloud-white:#f5f9fc;--accent-gold:#d4a017;--text-primary:#1a1a1a;--text-secondary:#3d3d3d;--text-muted:#6b6b6b;--text-on-dark:#e8f0f8;--border-light:#dde4ea;--shadow-soft:0 4px 20px rgba(10,22,40,0.06);--shadow-hover:0 12px 35px rgba(10,22,40,0.15);--radius-sm:6px;--radius-lg:16px;--radius-xl:22px;--radius-full:50px;--transition-fast:0.2s ease;--transition-smooth:0.35s cubic-bezier(0.4,0,0.2,1);--font-heading:'Georgia','Noto Serif SC',serif;--font-body:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;--font-mono:'SF Mono','Consolas',monospace;}
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:var(--font-body);background:var(--cloud-white);color:var(--text-primary);min-height:100vh;padding-bottom:3rem;line-height:1.6;}
        .navbar{position:sticky;top:0;z-index:100;background:rgba(10,22,40,0.96);backdrop-filter:blur(16px);border-bottom:2px solid var(--accent-gold);padding:0.7rem 2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;}
        .logo{display:flex;align-items:center;gap:0.5rem;cursor:pointer;text-decoration:none;}.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--sky-blue),var(--sky-navy));border:1px solid var(--accent-gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:var(--accent-gold);}.logo-text{font-family:var(--font-heading);font-size:1.2rem;font-weight:700;color:var(--text-on-dark);}
        .nav-links{display:flex;gap:1rem;list-style:none;flex-wrap:wrap;}.nav-links a{color:#c0ccd8;text-decoration:none;font-weight:500;font-size:0.78rem;transition:color var(--transition-fast);border-bottom:2px solid transparent;}.nav-links a:hover{color:var(--accent-gold);border-bottom-color:var(--accent-gold);}.nav-links a.active{color:var(--accent-gold);font-weight:600;border-bottom-color:var(--sky-light);}
        .page-header{text-align:center;padding:2.5rem 1rem 1rem;}.page-header h1{font-family:var(--font-heading);font-size:2.5rem;color:var(--text-primary);}
        .container{max-width:900px;margin:0 auto;padding:0 1.5rem;}
        .timeline-v{position:relative;padding-left:3rem;}
        .timeline-v::before{content:'';position:absolute;left:1.2rem;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--sky-blue),var(--sky-light),var(--sky-blue));border-radius:2px;}
        .tl-entry{position:relative;margin-bottom:2.5rem;padding-left:2rem;cursor:pointer;transition:all var(--transition-smooth);}
        .tl-entry:hover{transform:translateX(6px);}
        .tl-entry::before{content:'';position:absolute;left:-1.95rem;top:0.5rem;width:14px;height:14px;background:white;border:3px solid var(--sky-blue);border-radius:50%;z-index:2;box-shadow:0 0 12px rgba(26,95,138,0.4);}
        .tl-entry .tl-year{font-family:var(--font-heading);font-size:1.8rem;font-weight:700;color:var(--sky-blue);}
        .tl-entry .tl-title{font-family:var(--font-heading);font-size:1.2rem;}.tl-entry .tl-desc{color:var(--text-secondary);font-size:0.9rem;line-height:1.7;margin-top:0.3rem;}
        @media(max-width:600px){.timeline-v{padding-left:2rem;}}
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar"><a href="aviation_home.html" class="logo"><span class="logo-icon">✈️</span><span class="logo-text">AeroAtlas</span></a><ul class="nav-links"><li><a href="aviation_home.html">首页</a></li><li><a href="aviation_airlines1.html">航空公司(上)</a></li><li><a href="aviation_airlines2.html">航空公司(下)</a></li><li><a href="aviation_aircraft1.html">客机机型(上)</a></li><li><a href="aviation_aircraft2.html">客机机型(下)</a></li><li><a href="aviation_alliance.html">航空联盟</a></li><li><a href="aviation_history.html" class="active">航空历史</a></li><li><a href="aviation_airport.html">世界机场</a></li></ul></nav>
    <div class="page-header"><h1>📜 航空历史</h1><p style="color:var(--text-muted);">从莱特兄弟到超音速时代 · 百年航空里程碑</p></div>
    <div class="container"><div class="timeline-v" id="timelineContainer"></div></div>
    <script>
        const timeline=[{year:'1903年',title:'莱特兄弟首次飞行',desc:'12月17日，威尔伯·莱特和奥维尔·莱特在美国北卡罗来纳州基蒂霍克驾驶"飞行者一号"完成了人类历史上首次受控、持续的重量级飞行。第一次飞行持续12秒，飞行距离36米。这次飞行开启了人类的航空时代。'},{year:'1914年',title:'首次商业航空服务',desc:'1月1日，圣彼得堡-坦帕气垫船航线开通，这是世界第一条定期商业航空服务。飞行距离23英里，票价5美元。'},{year:'1927年',title:'林德伯格跨大西洋飞行',desc:'5月20-21日，查尔斯·林德伯格驾驶"圣路易斯精神号"单翼机，从纽约起飞，历时33.5小时抵达巴黎，完成了首次单人跨大西洋飞行。'},{year:'1952年',title:'喷气时代开启',desc:'5月2日，英国海外航空(BOAC)使用德哈维兰彗星型客机开通世界首条喷气式客机商业航线（伦敦至约翰内斯堡）。喷气时代的到来将飞行时间大幅缩短。'},{year:'1969年',title:'波音747首飞与协和号首飞',desc:'2月9日，波音747"空中女王"首飞，开创宽体客机时代。3月2日，英法联合研制的协和号超音速客机首飞，巡航速度达2马赫（约2200km/h）。'},{year:'1976年',title:'协和号投入商业运营',desc:'1月21日，协和号同时从伦敦和巴黎起飞，开启了超音速商业航空时代。伦敦至纽约的飞行时间缩短至3.5小时。2003年协和号退役。'},{year:'2007年',title:'空客A380投入运营',desc:'10月25日，新加坡航空使用空客A380执飞新加坡至悉尼的航班。A380是世界最大客机，双层全宽体，标准布局可载550人。'},{year:'2011年',title:'波音787投入运营',desc:'10月26日，全日空使用波音787梦想客机执飞东京至香港航线。787大量使用复合材料，燃油效率提升20%。'}];
        document.getElementById('timelineContainer').innerHTML=timeline.map(t=>`<div class="tl-entry"><span class="tl-year">${t.year}</span><div class="tl-title">${t.title}</div><p class="tl-desc">${t.desc}</p></div>`).join('');
    </script>
</body>
</html>
