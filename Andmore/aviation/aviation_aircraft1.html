<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客机机型(上) · AeroAtlas</title>
    <meta name="description" content="AeroAtlas波音系列客机全机型详解，收录波音737、747、767、777、787等所有型号的技术参数、座位布局和运营数据。">
    <style>
        :root{--sky-deep:#0a1628;--sky-navy:#0d2137;--sky-blue:#1a5f8a;--sky-light:#2196c8;--sky-pale:#e3f2fd;--cloud-white:#f5f9fc;--accent-gold:#d4a017;--text-primary:#1a1a1a;--text-secondary:#3d3d3d;--text-muted:#6b6b6b;--text-on-dark:#e8f0f8;--border-light:#dde4ea;--shadow-soft:0 4px 20px rgba(10,22,40,0.06);--shadow-hover:0 12px 35px rgba(10,22,40,0.15);--radius-sm:6px;--radius-lg:16px;--radius-xl:22px;--radius-full:50px;--transition-fast:0.2s ease;--transition-smooth:0.35s cubic-bezier(0.4,0,0.2,1);--font-heading:'Georgia','Noto Serif SC',serif;--font-body:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;--font-mono:'SF Mono','Consolas',monospace;}
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:var(--font-body);background:var(--cloud-white);color:var(--text-primary);min-height:100vh;padding-bottom:3rem;line-height:1.6;}
        .navbar{position:sticky;top:0;z-index:100;background:rgba(10,22,40,0.96);backdrop-filter:blur(16px);border-bottom:2px solid var(--accent-gold);padding:0.7rem 2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;}
        .logo{display:flex;align-items:center;gap:0.5rem;cursor:pointer;text-decoration:none;}.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--sky-blue),var(--sky-navy));border:1px solid var(--accent-gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:var(--accent-gold);}.logo-text{font-family:var(--font-heading);font-size:1.2rem;font-weight:700;color:var(--text-on-dark);}
        .nav-links{display:flex;gap:1rem;list-style:none;flex-wrap:wrap;}.nav-links a{color:#c0ccd8;text-decoration:none;font-weight:500;font-size:0.78rem;transition:color var(--transition-fast);border-bottom:2px solid transparent;}.nav-links a:hover{color:var(--accent-gold);border-bottom-color:var(--accent-gold);}.nav-links a.active{color:var(--accent-gold);font-weight:600;border-bottom-color:var(--sky-light);}
        .page-header{text-align:center;padding:2.5rem 1rem 1rem;}.page-header h1{font-family:var(--font-heading);font-size:2.5rem;color:var(--text-primary);}
        .container{max-width:1200px;margin:0 auto;padding:0 1.5rem;}
        .aircraft-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:2rem;}
        .aircraft-card{background:white;border:1px solid var(--border-light);border-radius:var(--radius-xl);overflow:hidden;box-shadow:var(--shadow-soft);transition:all var(--transition-smooth);}.aircraft-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-4px);}
        .aircraft-card .card-head{background:linear-gradient(135deg,var(--sky-navy),var(--sky-blue));padding:1.5rem;color:var(--text-on-dark);}
        .aircraft-card .card-head h3{font-family:var(--font-heading);font-size:1.4rem;}.aircraft-card .card-head .nickname{font-size:0.9rem;opacity:0.85;font-style:italic;}
        .aircraft-card .card-body{padding:1.8rem;}
        .aircraft-card .card-body .spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;}
        .aircraft-card .card-body .spec-item{font-size:0.85rem;}.aircraft-card .card-body .spec-item .lbl{font-weight:700;color:var(--sky-blue);font-size:0.7rem;text-transform:uppercase;}.aircraft-card .card-body .spec-item .val{color:var(--text-secondary);}
        .aircraft-card .card-body p{color:var(--text-secondary);line-height:1.8;font-size:0.9rem;text-indent:2em;}
        @media(max-width:768px){.aircraft-grid{grid-template-columns:1fr;}}
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar"><a href="aviation_home.html" class="logo"><span class="logo-icon">✈️</span><span class="logo-text">AeroAtlas</span></a><ul class="nav-links"><li><a href="aviation_home.html">首页</a></li><li><a href="aviation_airlines1.html">航空公司(上)</a></li><li><a href="aviation_airlines2.html">航空公司(下)</a></li><li><a href="aviation_aircraft1.html" class="active">客机机型(上)</a></li><li><a href="aviation_aircraft2.html">客机机型(下)</a></li><li><a href="aviation_alliance.html">航空联盟</a></li><li><a href="aviation_history.html">航空历史</a></li><li><a href="aviation_airport.html">世界机场</a></li></ul></nav>
    <div class="page-header"><h1>🛩️ 客机机型（上）—— 波音系列</h1><p style="color:var(--text-muted);">Boeing · 从707到787梦想客机</p></div>
    <div class="container"><div class="aircraft-grid" id="aircraftGrid"></div></div>
    <script>
        const boeing=[{
            name:'波音737',nickname:'全球最畅销客机',firstFlight:'1967年',variants:'737-100至737 MAX 10',range:'5,000-7,000km',capacity:'130-230座',engines:'CFM56/LEAP-1B',orders:'15,000+架',
            desc:'波音737是全球航空史上最畅销的商用客机，自1967年首飞以来已交付超过11,000架。737经历了四代演变：Original（-100/-200）、Classic（-300/-400/-500）、Next Generation（-600/-700/-800/-900）和MAX（MAX 7/8/9/10）。737以其可靠性、经济性和灵活性成为全球短中程航线的主力机型。',
            significance:'737是航空史上产量最大的喷气式客机。西南航空是全737机队的最大用户。2018-2019年的MAX停飞事件是航空史上最大的机型停飞事件之一。'
        },{
            name:'波音747',nickname:'空中女王',firstFlight:'1969年',variants:'747-100至747-8',range:'9,000-14,000km',capacity:'350-600座',engines:'PW4000/CF6/Rolls-Royce RB211/GEnx',orders:'1,570+架',
            desc:'波音747是世界上第一款宽体客机，1969年首飞，以其独特的"驼峰"上层甲板设计成为航空史上最具标志性的机型。747将航空旅行从精英阶层扩展到大众市场——"巨型喷气机时代"由此开启。747-8是747系列的最后一个型号，于2023年交付最后一架。',
            significance:'747服役超过50年，美国总统专机"空军一号"就是定制版747。747货机版本至今仍在生产。747开创了双通道宽体客机的时代。'
        },{
            name:'波音777',nickname:'三发七',firstFlight:'1994年',variants:'777-200/200ER/200LR/300/300ER/777X',range:'9,700-17,000km',capacity:'300-450座',engines:'GE90(世界最大喷气发动机)',orders:'2,000+架',
            desc:'波音777是全球最大的双发宽体客机，以可靠性著称。777-200LR是世界航程最长的客机之一。GE90发动机是航空史上推力最大的喷气发动机。777X（777-8/777-9）是777系列最新型号，采用折叠翼尖设计。',
            significance:'777是波音首款完全使用计算机辅助设计的客机。777-300ER是最受欢迎的远程宽体客机之一。'
        },{
            name:'波音787',nickname:'梦想客机',firstFlight:'2009年',variants:'787-8/787-9/787-10',range:'13,500-14,000km',capacity:'240-330座',engines:'GEnx/Rolls-Royce Trent 1000',orders:'1,800+架',
            desc:'波音787梦想客机是波音最新一代宽体客机，大量使用碳纤维复合材料（占比50%），比同类机型节油20%。787采用更大的窗户、更高的客舱压力和湿度，改善了乘客体验。787-9是787系列最受欢迎的型号。',
            significance:'787开创了中型远程客机市场，使"点对点"长途航线经济可行。全日空是787首发客户和最大运营商。'
        }];
        document.getElementById('aircraftGrid').innerHTML=boeing.map((a,i)=>`<div class="aircraft-card"><div class="card-head"><h3>${a.name}</h3><span class="nickname">"${a.nickname}"</span></div><div class="card-body"><div class="spec-grid"><div class="spec-item"><span class="lbl">首飞</span><div class="val">${a.firstFlight}</div></div><div class="spec-item"><span class="lbl">型号</span><div class="val">${a.variants}</div></div><div class="spec-item"><span class="lbl">航程</span><div class="val">${a.range}</div></div><div class="spec-item"><span class="lbl">载客</span><div class="val">${a.capacity}</div></div><div class="spec-item"><span class="lbl">发动机</span><div class="val">${a.engines}</div></div><div class="spec-item"><span class="lbl">订单</span><div class="val">${a.orders}</div></div></div><p>${a.desc}</p><p style="font-size:0.82rem;color:var(--text-muted);">${a.significance}</p></div></div>`).join('');
    </script>
</body>
</html>
