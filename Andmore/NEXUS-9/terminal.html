<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS-9 TERMINAL v3.7</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Share Tech Mono', 'Courier New', monospace;
    overflow: hidden;
  }
  #terminal-container {
    width: 900px;
    max-width: 98vw;
    height: 92vh;
    max-height: 700px;
    background: #0c0c0c;
    border: 2px solid #1a3a1a;
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 30px rgba(0,255,65,0.08), inset 0 0 60px rgba(0,0,0,0.6);
    position: relative;
  }
  #terminal-container::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.03) 0px, rgba(0,0,0,0.03) 2px, transparent 2px, transparent 4px);
    pointer-events: none;
    z-index: 10;
    border-radius: 6px;
  }
  #terminal-topbar {
    background: #111;
    border-bottom: 1px solid #1a3a1a;
    padding: 8px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    border-radius: 6px 6px 0 0;
  }
  #terminal-topbar .title {
    color: #00ff41;
    font-size: 13px;
    letter-spacing: 1px;
  }
  #terminal-topbar .title span {
    color: #555;
  }
  #terminal-topbar .buttons {
    display: flex;
    gap: 8px;
  }
  #terminal-topbar .btn {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    display: inline-block;
    cursor: pointer;
    border: none;
    transition: filter 0.1s;
  }
  #terminal-topbar .btn:hover { filter: brightness(1.4); }
  #terminal-topbar .btn-close { background: #ff4444; }
  #terminal-topbar .btn-min { background: #ffaa00; }
  #terminal-topbar .btn-max { background: #00cc44; }
  #terminal-output {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    color: #00ff41;
    font-size: 14px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-all;
    position: relative;
    z-index: 5;
    scroll-behavior: smooth;
  }
  #terminal-output::-webkit-scrollbar { width: 5px; }
  #terminal-output::-webkit-scrollbar-track { background: #0c0c0c; }
  #terminal-output::-webkit-scrollbar-thumb { background: #1a3a1a; border-radius: 3px; }
  .output-line { margin: 0; }
  .output-line.prompt { color: #00cc44; }
  .output-line.cmd { color: #e0e0e0; }
  .output-line.info { color: #00ff41; }
  .output-line.warn { color: #ffcc00; }
  .output-line.error { color: #ff4444; }
  .output-line.dim { color: #338833; }
  .output-line.highlight { color: #66ff99; font-weight: bold; }
  .output-line.cyan { color: #00cccc; }
  #input-line {
    display: flex;
    align-items: center;
    padding: 0 16px 10px;
    flex-shrink: 0;
    position: relative;
    z-index: 5;
  }
  #prompt {
    color: #00cc44;
    font-size: 14px;
    white-space: pre;
    flex-shrink: 0;
  }
  #cmd-input {
    flex: 1;
    background: transparent;
    border: none;
    color: #e0e0e0;
    font-family: 'Share Tech Mono', 'Courier New', monospace;
    font-size: 14px;
    outline: none;
    caret-color: transparent;
    padding: 0;
    margin-left: 4px;
  }
  #cursor {
    display: inline-block;
    width: 9px;
    height: 17px;
    background: #00ff41;
    animation: blink 1s step-end infinite;
    flex-shrink: 0;
    margin-left: 1px;
    vertical-align: middle;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
  #suggestions {
    padding: 0 16px 6px;
    color: #225522;
    font-size: 12px;
    min-height: 18px;
    flex-shrink: 0;
    position: relative;
    z-index: 5;
  }
</style>
</head>
<body>

<div id="terminal-container">
  <div id="terminal-topbar">
    <div class="title">NEXUS-9 <span>//</span> TERMINAL <span>v3.7</span></div>
    <div class="buttons">
      <button class="btn btn-min" title="Minimize" onclick="document.getElementById('terminal-container').style.display='none'; setTimeout(function(){document.getElementById('terminal-container').style.display='flex';}, 300);"></button>
      <a href="city_map.html" style="text-decoration:none;"><button class="btn btn-close" title="Exit to City Map"></button></a>
    </div>
  </div>
  <div id="terminal-output"></div>
  <div id="suggestions"></div>
  <div id="input-line">
    <span id="prompt">nexus@n9:~$ </span>
    <input type="text" id="cmd-input" autofocus autocomplete="off" spellcheck="false">
    <span id="cursor"></span>
  </div>
</div>

  var locations = {
    'district-1': '第一区 (上城区) - 政府中心 / Government Center',

  // --- ASCII ART ---
  var asciiBanner = [
    '<span class="output-line cyan">',

    '  ████╗  ██║██╔════╝╚██╗██╔╝██║   ██║██╔════╝  ██╔══██╗',
    '  ██╔██╗ ██║█████╗   ╚███╔╝ ██║   ██║███████╗  ╚█████╔╝',
    '  ██║╚██╗██║██╔══╝   ██╔██╗ ██║   ██║╚════██║  ██╔══██╗',
    '  ██║ ╚████║███████╗██╔╝ ██╗╚██████╔╝███████║  ╚█████╔╝',
    '  ╚═╝  ╚═══╝╚══════╝╚═╝  ╚═╝ ╚═════╝ ╚══════╝   ╚════╝',
    '                                                         ',
    '</span>',
    '<span class="output-line highlight">  >> NEXUS-9 城市终端接口 v3.7 <<</span>',
    '<span class="output-line dim">  >> Cyber City Command Line Interface <<</span>',
    '<span class="output-line dim">  >> 输入 "help" 获取命令列表 <<</span>',
    '<span class="output-line dim">  >> 输入 "exit" 返回城市地图 <<</span>',
    ''
  ].join('\n');

  // --- HELPERS ---
  function write(text, cls) {
    cls = cls || 'info';
    var lines = String(text).split('\n');
    for (var i = 0; i < lines.length; i++) {
      var div = document.createElement('div');
      div.className = 'output-line ' + cls;
      div.innerHTML = lines[i] || '&nbsp;';
      output.appendChild(div);
    }
    output.scrollTop = output.scrollHeight;
  }

  function writeSystemLog(msg) {
    logEntries.push({ time: new Date().toISOString().replace('T',' ').substring(0,19), msg: msg });
    if (logEntries.length > 50) logEntries.shift();
  }

  var hiddenCommands = {
    'sudo su': function(){ write('root@nexus-9:~# 权限不足。你不是管理员。\nAccess denied. You are not the administrator.','warn'); writeSystemLog('FAILED sudo su attempt'); },
    'sudo rm -rf /': function(){ write('拒绝访问。核心系统受保护。\nPermission denied. Core system protected.','error'); writeSystemLog('BLOCKED rm -rf / attempt'); },
    'matrix': function(){
      write('正在进入矩阵... / Entering the Matrix...','cyan');
      setTimeout(function(){
        var chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789';
        var rain = '';
        for(var r=0; r<18; r++){ for(var c=0; c<50; c++){ rain += chars[Math.floor(Math.random()*chars.length)]; } rain += '\n'; }
        write(rain,'dim');
        write('你看到那个穿红裙的女人了吗？ / Did you see the woman in the red dress?','highlight');
        writeSystemLog('Matrix sequence triggered');
      }, 500);
    },
    'portal': function(){ write('正在打开传送门... 错误：目标维度不可达\nOpening portal... ERROR: Target dimension unreachable','error'); writeSystemLog('Portal attempt failed'); },
    '42': function(){ write('生命、宇宙以及任何事情的终极答案。\nThe Answer to the Ultimate Question of Life, the Universe, and Everything.','highlight'); writeSystemLog('Deep Thought accessed'); },
    'rubberducky': function(){ write('  __\n<\' ）））））））~\n  --\n  嘎嘎！调试成功！ / Quack! Debugging complete!','highlight'); },
    'overclock': function(){ write('警告：CPU超频至 9.9GHz... 核心温度上升中...\nWARNING: CPU overclocked to 9.9GHz... Core temperature rising...','warn'); writeSystemLog('CPU overclocked'); },
    'decrypt': function(){ write('解密模块初始化... 需要128位量子密钥。\nDecryption module init... 128-bit quantum key required.','cyan'); writeSystemLog('Decrypt module accessed'); },
  };

  function getFileSystemPath(p) {
    var parts = p.replace(/\/+/g,'/').replace(/\/$/,'').split('/').filter(Boolean);
    var current = fileSystem['/'];
    if (!current) return null;
    var path = '/';
    for (var i = 0; i < parts.length; i++) {
      path += (path==='/'?'':'/') + parts[i];
      if (!fileSystem[path]) return null;
      current = fileSystem[path];
      if (current.type === 'file' && i < parts.length-1) return null;
    }
    return { path: path, node: current };
  }

  function resolvePath(inputPath) {
    if (!inputPath || inputPath === '.') return currentDir;
    if (inputPath === '..') {
      if (currentDir === '/') return '/';
      var p = currentDir.split('/').filter(Boolean); p.pop();
      return '/' + p.join('/') || '/';
    }
    if (inputPath === '~' || inputPath === '~/') return '/home/nexus';
    if (inputPath.startsWith('~/')) return '/home/nexus' + (inputPath.length > 1 ? '/' + inputPath.substring(2) : '');
    if (inputPath.startsWith('/')) return inputPath;
    return (currentDir === '/' ? '/' + inputPath : currentDir + '/' + inputPath).replace(/\/+/g,'/');
  }

  // --- COMMAND HANDLERS ---
  function cmd_help(args) {
    write('═══════════════════════════════════════════════','cyan');
    write('  NEXUS-9 TERMINAL - 可用命令 / Available Commands','highlight');
    write('═══════════════════════════════════════════════','cyan');
    var keys = Object.keys(commands).sort();
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i];
      var c = commands[k];
      write('  ' + k + (c.usage ? ' ' + c.usage : '') + '  —  ' + c.desc,'info');
    }
    write('');
    write('提示: 使用 Tab 键自动补全, 上下箭头浏览历史','dim');
    write('Tip: Use Tab for auto-complete, Up/Down for history','dim');
    write('═══════════════════════════════════════════════','cyan');
    writeSystemLog('help command executed');
  }

    write('  NEXUS-9 城市系统状态 / City System Status','highlight');
    write('═════════════════════════════════════','cyan');
    write('');
    var stats = [
      ['核心处理器 / Core CPU','[████████░░] 87%','info'],

      ['网络负载 / Network Load','[████████░░] 85%  节点数: 1,247','info'],
      ['AI集群 / AI Cluster','[█████████░] 94%  活跃','warn'],
      ['第一区 / District 1','在线 / Online  状态: 正常','info'],
      ['第二区 / District 2','在线 / Online  状态: 正常','info'],
      ['第三区 / District 3','在线 / Online  状态: 正常','info'],
      ['第四区 / District 4','在线 / Online  状态: 正常','info'],
      ['第五区 / District 5','在线 / Online  状态: 正常','info'],
      ['第六区 / District 6','部分中断 / Partial Outage  状态: 不稳定','warn'],
      ['第七区 / District 7','[已封锁] / [LOCKED]  状态: 未知','error'],
      ['第八区 / District 8','在线 / Online  状态: 正在维护','info'],
      ['第九区 / District 9','[核心] / [CORE]  状态: 受保护','highlight'],
      ['防火墙 / Firewall','[██████████] 100%  活跃','info'],
      ['入侵检测 / IDS','在线 / Active  威胁等级: 中等','warn'],

    for (var i = 0; i < stats.length; i++) {
      write('  ' + stats[i][0] + '  ' + stats[i][1], stats[i][2]);
    }
    write('');
    write('  系统运行时间: 127天 14小时 32分钟 / Uptime: 127d 14h 32m','dim');

  function cmd_scan(args) {

    var targets = [
      { ip:'10.0.1.1', name:'District-3-Gateway', status:'OPEN', os:'NexOS 3.7', dist:'1.2km' },
      { ip:'10.0.2.1', name:'District-7-Gateway', status:'LOCKED', os:'???', dist:'4.7km' },

      { ip:'10.0.5.14', name:'Unknown-Device', status:'STEALTH', os:'???', dist:'2.1km' },
      { ip:'10.0.8.99', name:'NEXUS-Labs-Workstation', status:'OPEN', os:'NexOS 3.7', dist:'1.8km' },
      { ip:'192.168.1.100', name:'Civilian-Terminal', status:'OPEN', os:'CitizenOS 1.2', dist:'0.5km' },

    write('  IP地址            主机名                    状态      系统              距离','dim');

    for (var i = 0; i < targets.length; i++) {

    write('  扫描完成。发现 ' + targets.length + ' 个系统。 / Scan complete. ' + targets.length + ' systems found.','dim');

  function cmd_map(args) {
    write('═══════════════════════════════════════════════','cyan');
    write('  NEXUS-9 城市地图坐标 / City Map Coordinates','highlight');
    write('═══════════════════════════════════════════════','cyan');
    var map = [
      '         ┌─────────┬─────────┬─────────┐',
      '         │   D1    │   D2    │   D3    │',
      '         │ 政务区  │ 商业区  │ 工业区  │',

      var cls = map[i].indexOf('D7') !== -1 ? 'error' : (map[i].indexOf('D9') !== -1 ? 'highlight' : 'info');
      write(map[i], cls);
    }
    write('');
    write('  当前位置 / Current: ' + currentDir,'dim');
    if (connectedTo) { write('  已连接 / Connected: ' + (locations[connectedTo] || connectedTo), 'cyan'); }
    write('═══════════════════════════════════════════════','cyan');

  function padRight(s, len) {

  // --- PROCESS INPUT ---
  function processCommand(cmdStr) {
    var trimmed = cmdStr.trim();
    if (!trimmed) return;

    // Echo the command
    write(prompt.textContent + trimmed, 'cmd');

    // Parse
    var parts = trimmed.split(/\s+/);
    var cmd = parts[0].toLowerCase();
    var args = parts.slice(1);

    // Check hidden commands first
    if (hiddenCommands[trimmed]) {
      hiddenCommands[trimmed]();
      writeSystemLog('Command executed: ' + trimmed);
    }
    // Check main commands
    else if (cmd === 'help') { cmd_help(args); }
    else if (cmd === 'status') { cmd_status(args); }
    else if (cmd === 'scan') { cmd_scan(args); }
    else if (cmd === 'map') { cmd_map(args); }
    else if (cmd === 'connect') { cmd_connect(args); }
    else if (cmd === 'logs') { cmd_logs(args); }
    else if (cmd === 'whoami') { cmd_whoami(args); }
    else if (cmd === 'clear') { output.innerHTML = ''; }
    else if (cmd === 'secret') { cmd_secret(args); }
    else if (cmd === 'nexus') { cmd_nexus(args); }
    else if (cmd === 'exit') { write('正在断开连接... / Disconnecting... 返回城市地图\n','cyan'); write('<a href="city_map.html" style="color:#00ff41;">>>> 点击这里返回城市地图 / Click here to return to City Map <<<</a>','highlight'); }
    else if (cmd === 'ls') { cmd_ls(args); }
    else if (cmd === 'cd') { cmd_cd(args); }
    else if (cmd === 'pwd') { cmd_pwd(args); }
    else if (cmd === 'cat') { cmd_cat(args); }
    else if (cmd === 'sysinfo') { cmd_sysinfo(args); }
    else if (cmd === 'ping') { cmd_ping(args); }
    else if (cmd === 'trace') { cmd_trace(args); }
    else if (cmd === 'hack') { cmd_hack(args); }
    else if (cmd === 'reboot') { cmd_reboot(args); }
    else if (cmd === 'date') { cmd_date(args); }
    else if (cmd === 'who') { cmd_who(args); }
    else if (cmd === 'ps') { cmd_ps(args); }
    else if (cmd === 'netstat') { cmd_netstat(args); }
    else if (cmd === 'df') { cmd_df(args); }
    else {
      write('命令未找到: ' + cmd + '\nCommand not found: ' + cmd,'error');
      write('输入 "help" 查看可用命令。 / Type "help" for available commands.','dim');
    }
  }

  // --- AUTO-COMPLETE ---
  function getSuggestions(partial) {
    var all = Object.keys(commands);
    // add file system items
    var fs = getFileSystemPath(currentDir);
    if (fs && fs.node.type === 'dir') {
      all = all.concat(Object.keys(fs.node.contents));
    }
    all = all.filter(function(c, i, arr){ return arr.indexOf(c) === i; });
    return all.filter(function(c){ return c.startsWith(partial) && c !== partial; });
  }

  input.addEventListener('input', function(){
    var val = input.value.trim();
    if (!val) { suggestions.textContent = ''; return; }
    var matches = getSuggestions(val.split(/\s+/).pop() || val);
    if (matches.length === 1) {
      suggestions.textContent = '> ' + matches[0];
      suggestions.style.color = '#225522';
    } else if (matches.length > 1) {
      suggestions.textContent = '> ' + matches.slice(0,8).join(' | ') + (matches.length > 8 ? ' ...' : '');
      suggestions.style.color = '#1a3a1a';
    } else {
      suggestions.textContent = '';
    }
  });

  input.addEventListener('keydown', function(e){
    // Enter
    if (e.key === 'Enter') {
      var cmd = input.value;
      if (cmd.trim()) {
        history.push(cmd);
        historyIndex = history.length;
      }
      processCommand(cmd);
      input.value = '';
      suggestions.textContent = '';
    }
    // Arrow Up
    else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (history.length > 0) {
        if (historyIndex > 0) historyIndex--;
        input.value = history[historyIndex];
        input.setSelectionRange(input.value.length, input.value.length);
        suggestions.textContent = '';
      }
    }
    // Arrow Down
    else if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (historyIndex < history.length - 1) {
        historyIndex++;
        input.value = history[historyIndex];
      } else {
        historyIndex = history.length;
        input.value = '';
      }
      input.setSelectionRange(input.value.length, input.value.length);
      suggestions.textContent = '';
    }
    // Tab
    else if (e.key === 'Tab') {
      e.preventDefault();
      var val = input.value;
      var lastWord = val.split(/\s+/).pop() || '';
      var matches = getSuggestions(lastWord);
      if (matches.length === 1) {
        var words = val.split(/\s+/);
        words[words.length-1] = matches[0];
        input.value = words.join(' ');
        if (val.split(/\s+/).length === 1) input.value += ' ';
        suggestions.textContent = '';
      } else if (matches.length > 1) {
        suggestions.textContent = '> ' + matches.join(' | ');
        suggestions.style.color = '#338833';
      }
      input.setSelectionRange(input.value.length, input.value.length);
    }
    // Ctrl+L = clear
    else if (e.key === 'l' && e.ctrlKey) {
      e.preventDefault();
      output.innerHTML = '';
    }
  });

  // Keep cursor blinking and input focused
  document.addEventListener('click', function(e){
    if (e.target.closest('#terminal-container')) {
