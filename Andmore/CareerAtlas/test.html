<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>职业测试 · 世界职业百科</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-deep: #060b14;
            --bg-card: rgba(15, 23, 42, 0.8);
            --glass-bg: rgba(15, 23, 42, 0.55);
            --glass-border: rgba(56, 189, 248, 0.2);
            --accent: #38bdf8;
            --accent-purple: #a78bfa;
            --accent-green: #34d399;
            --accent-pink: #f472b6;
            --accent-orange: #fb923c;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --border-radius-lg: 2rem;
            --border-radius-md: 1.5rem;
            --border-radius-sm: 1rem;
            --font-primary: 'Inter', sans-serif;
        }
        body {
            font-family: var(--font-primary);
            background:
                radial-gradient(ellipse 80% 60% at 50% -20%, rgba(56, 189, 248, 0.15), transparent),
                radial-gradient(ellipse 60% 50% at 80% 80%, rgba(167, 139, 250, 0.1), transparent),
                radial-gradient(ellipse 50% 40% at 20% 50%, rgba(244, 114, 182, 0.08), transparent),
                var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0;
        }

        /* ── Navbar ── */
        .navbar {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 2rem;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .navbar .logo {
            font-size: 1.3rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }
        .navbar .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }
        .navbar .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.3s;
        }
        .navbar .nav-links a:hover {
            color: var(--accent);
        }

        /* ── Page Title ── */
        .page-title {
            text-align: center;
            padding: 2.5rem 2rem 0.5rem;
        }
        .page-title h1 {
            font-size: 2.4rem;
            font-weight: 900;
            background: linear-gradient(135deg, #fff, #bae6fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        .page-title p {
            color: var(--text-secondary);
            font-size: 1.05rem;
        }

        /* ── Quiz Container ── */
        .quiz-container {
            background: var(--bg-card);
            backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius-lg);
            padding: 2.5rem 3rem 3rem;
            max-width: 700px;
            width: 90%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
            margin: 1rem 0 3rem;
        }
        .quiz-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .quiz-header h2 {
            font-size: 2rem;
            background: linear-gradient(135deg, #fff, #bae6fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ── Progress Bar ── */
        .progress-bar {
            height: 6px;
            background: rgba(56, 189, 248, 0.15);
            border-radius: 10px;
            margin: 1.5rem 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #a78bfa);
            border-radius: 10px;
            transition: width 0.5s ease;
        }
        .progress-label {
            display: flex;
            justify-content: flex-end;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 0.3rem;
        }

        /* ── Question ── */
        .question-text {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .options-grid {
            display: grid;
            gap: 1rem;
        }
        .option-btn {
            padding: 1.2rem 1.5rem;
            background: rgba(56, 189, 248, 0.06);
            border: 1.5px solid var(--glass-border);
            border-radius: 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
            color: var(--text-primary);
            font-size: 1.05rem;
            text-align: left;
            font-family: var(--font-primary);
        }
        .option-btn:hover {
            background: rgba(56, 189, 248, 0.15);
            border-color: var(--accent);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.3);
            transform: translateX(5px);
        }

        /* ── Intro Screen ── */
        .intro-screen {
            text-align: center;
        }
        .intro-screen .intro-icon {
            font-size: 5rem;
            margin: 1rem 0;
        }
        .intro-screen h3 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
        }
        .intro-screen .intro-desc {
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            text-align: left;
        }
        .intro-screen .dimension-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6rem 1.5rem;
            text-align: left;
            margin-bottom: 2rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .intro-screen .dimension-list span {
            color: var(--accent);
        }

        /* ── Result Section ── */
        .result-icon {
            font-size: 5rem;
            text-align: center;
            margin: 1rem 0;
            animation: floatIn 0.8s ease-out;
        }
        @keyframes floatIn {
            from { opacity: 0; transform: translateY(30px) scale(0.8); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .match-percentage {
            font-size: 3.5rem;
            font-weight: 900;
            text-align: center;
            animation: scoreCount 1.5s ease-out;
        }
        @keyframes scoreCount {
            from { opacity: 0; transform: scale(0.3); }
            to { opacity: 1; transform: scale(1); }
        }
        .primary-match-badge {
            display: inline-block;
            padding: 0.3rem 1rem;
            border-radius: 3rem;
            font-size: 0.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--accent-purple));
            color: #fff;
            margin-bottom: 0.5rem;
        }
        .secondary-match-badge {
            display: inline-block;
            padding: 0.25rem 0.9rem;
            border-radius: 3rem;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid var(--glass-border);
            color: var(--accent);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 1rem;
            border-radius: 3rem;
            background: linear-gradient(135deg, var(--accent), #6366f1);
            border: none;
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: 0.3s;
            font-family: var(--font-primary);
        }
        .btn:hover {
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.5);
            transform: translateY(-2px);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--glass-border);
        }
        .btn-outline:hover {
            background: rgba(56, 189, 248, 0.08);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
        }
        .btn-sm {
            display: inline-block;
            width: auto;
            padding: 0.6rem 1.5rem;
            font-size: 0.9rem;
            margin: 0.3rem;
        }

        /* ── Score Bars (Animated) ── */
        .score-bar-row {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin: 0.5rem 0;
            font-size: 0.88rem;
        }
        .score-bar-label {
            min-width: 130px;
            text-align: right;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .score-bar-track {
            flex: 1;
            height: 10px;
            background: rgba(56, 189, 248, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }
        .score-bar-fill {
            height: 100%;
            border-radius: 10px;
            width: 0%;
            transition: width 1.2s cubic-bezier(0.22, 0.61, 0.36, 1);
        }
        .score-bar-pct {
            min-width: 40px;
            font-weight: 700;
            color: var(--accent);
            font-size: 0.85rem;
        }

        /* ── Personality Profile ── */
        .personality-card {
            background: rgba(56, 189, 248, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius-md);
            padding: 1.5rem;
            margin: 1.2rem 0;
        }
        .personality-card h4 {
            color: var(--accent-purple);
            margin-bottom: 0.8rem;
            font-size: 1.1rem;
        }
        .personality-card .traits {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin: 0.8rem 0;
        }
        .personality-card .trait-tag {
            padding: 0.3rem 0.8rem;
            border-radius: 2rem;
            background: rgba(56, 189, 248, 0.1);
            font-size: 0.82rem;
            color: var(--accent);
        }
        .personality-card p {
            color: var(--text-secondary);
            line-height: 1.7;
            font-size: 0.92rem;
        }

        /* ── Secondary Match ── */
        .secondary-card {
            background: rgba(167, 139, 250, 0.05);
            border: 1px solid rgba(167, 139, 250, 0.2);
            border-radius: var(--border-radius-md);
            padding: 1.2rem;
            margin: 1rem 0;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .secondary-card .sec-icon {
            font-size: 2.5rem;
        }
        .secondary-card .sec-info h4 {
            font-size: 1rem;
            margin-bottom: 0.2rem;
        }
        .secondary-card .sec-info p {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* ── Career Path Viz ── */
        .career-path-section {
            background: rgba(56, 189, 248, 0.04);
            border-radius: var(--border-radius-md);
            padding: 1.5rem;
            margin: 1.2rem 0;
        }
        .career-path-section h4 {
            margin-bottom: 1rem;
            font-size: 1rem;
            color: var(--accent-green);
        }
        .path-level {
            padding: 0.7rem 1rem;
            margin: 0.4rem 0;
            border-radius: var(--border-radius-sm);
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            border-left: 4px solid;
        }
        .path-level.high { background: rgba(52, 211, 153, 0.08); border-left-color: var(--accent-green); }
        .path-level.medium { background: rgba(56, 189, 248, 0.08); border-left-color: var(--accent); }
        .path-level.low { background: rgba(148, 163, 184, 0.06); border-left-color: var(--text-secondary); }
        .path-level .path-icon { font-size: 1.4rem; }
        .path-level .path-category { font-weight: 700; min-width: 80px; }
        .path-level .path-careers { color: var(--text-secondary); font-size: 0.82rem; }

        /* ── Share / Copy ── */
        .share-section {
            background: rgba(56, 189, 248, 0.06);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius-md);
            padding: 1.2rem;
            margin: 1.2rem 0;
            text-align: center;
        }
        .share-section h4 {
            margin-bottom: 0.8rem;
            font-size: 0.95rem;
        }
        .share-textarea {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius-sm);
            color: var(--text-primary);
            padding: 0.8rem;
            font-size: 0.85rem;
            font-family: var(--font-primary);
            resize: none;
            margin-bottom: 0.8rem;
        }
        .copied-toast {
            position: fixed;
            top: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent-green);
            color: #0f172a;
            padding: 0.7rem 2rem;
            border-radius: 3rem;
            font-weight: 700;
            font-size: 0.9rem;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .copied-toast.show {
            opacity: 1;
        }

        /* ── Retake ── */
        .retake-row {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        .retake-row .btn {
            flex: 1;
            min-width: 140px;
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .quiz-container { padding: 1.8rem; }
            .navbar .nav-links { gap: 1rem; font-size: 0.85rem; }
            .intro-screen .dimension-list { grid-template-columns: 1fr; }
            .score-bar-label { min-width: 90px; font-size: 0.78rem; }
            .page-title h1 { font-size: 1.8rem; }
            .retake-row .btn { min-width: 100%; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>

    <!-- ── Navbar ── -->

    <!-- ── Page Title ── -->
    <div class="page-title">
        <h1>职业兴趣与人格测试</h1>
        <p>探索你的职业潜能 · 发现最适合你的人生方向</p>
    </div>

    <!-- ── Toast ── -->
    <div class="copied-toast" id="copiedToast">已复制分享内容!</div>

    <!-- ── Quiz Container ── -->
    <div class="quiz-container" id="quizContainer">

    </div>

    <script>
        // ═══════════════════════════════════════
        //  QUESTIONS — 20 expanded dimensions
        // ═══════════════════════════════════════
        const questions = [
            {
                q: '你喜欢独立工作还是团队合作？',
                options: ['独立完成', '团队协作', '两者均可'],

            },
            {
                q: '你对帮助他人有强烈的愿望吗？',
                options: ['非常强烈', '有一些', '不太强烈'],
                scores: [
                    { medical: 3, education: 3, social: 3 },
                    { law: 2, medical: 1, sports: 2, research: 1 },
                    { tech: 2, finance: 2, engineering: 2 }
                ]
            },
            {

                options: ['非常愿意', '愿意但有限', '不太愿意'],
                scores: [
                    { tech: 3, medical: 3, research: 3, engineering: 2 },
                    { finance: 2, law: 2, education: 2, aviation: 1 },
                    { education: 1, creative: 1, sports: 1, social: 1 }
                ]
            },
            {
                q: '你更喜欢领导团队还是被领导？',
                options: ['领导团队', '被领导', '视情况而定'],
                scores: [
                    { entrepreneurship: 3, law: 2, sports: 2, tech: 1 },
                    { creative: 1, arts: 2, research: 2, education: 1 },

            {

            {
                q: '你对冒险和风险的态度是什么？',
                options: ['喜欢冒险', '规避风险', '适度冒险'],

                    { entrepreneurship: 3, sports: 3, aviation: 2, creative: 1 },

            {

            {
                q: '你喜欢与人打交道还是与事物打交道？',

                    { social: 3, education: 3, medical: 2, creative: 1 },

        // ═══════════════════════════════════════
        //  STATE

        // ═══════════════════════════════════════
        //  RENDER: Intro Screen
        // ═══════════════════════════════════════
        function renderIntro() {
            screen = 'intro';
            container.innerHTML = `
            <div class="intro-screen">
              <div class="quiz-header">
                <h2>🧪 职业兴趣与人格测试</h2>
              </div>

        // ═══════════════════════════════════════
        //  START QUIZ
        // ═══════════════════════════════════════
        function startQuiz() {
            screen = 'quiz';
            currentQuestion = 0;
            scores = {
                tech: 0, medical: 0, creative: 0, law: 0, finance: 0,
                education: 0, engineering: 0, aviation: 0, research: 0,
                entrepreneurship: 0, arts: 0, social: 0, sports: 0
            };
            renderQuestion();
        }

        // ═══════════════════════════════════════
        //  RENDER: Question
        // ═══════════════════════════════════════
        function renderQuestion() {
            if (currentQuestion >= totalQuestions) {
                showResult();
                return;
            }
            const q = questions[currentQuestion];
            const progress = ((currentQuestion) / totalQuestions) * 100;
            container.innerHTML = `
            <div class="quiz-header">
              <h2>🧪 职业兴趣测试</h2>
              <p style="color:var(--text-secondary);">问题 ${currentQuestion + 1} / ${totalQuestions}</p>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" style="width:${progress}%;"></div>
            </div>
            <div class="progress-label">${Math.round(progress)}% 完成</div>
            <div class="question-text">${q.q}</div>
            <div class="options-grid">
              ${q.options.map((opt, i) => `
                <button class="option-btn" data-idx="${i}">${String.fromCharCode(65 + i)}. ${opt}</button>
              `).join('')}
            </div>
          `;
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.idx);
                    const scoreAdd = q.scores[idx];
                    for (let [key, val] of Object.entries(scoreAdd)) {
                        scores[key] = (scores[key] || 0) + val;
                    }
                    currentQuestion++;
                    renderQuestion();
                });
            });
        }

        // ═══════════════════════════════════════
        //  SHOW RESULT
        // ═══════════════════════════════════════
        function showResult() {
            screen = 'result';
            const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
            const top = sorted[0];
            const secondary = sorted[1];
            const result = careerMap[top[0]] || careerMap.tech;
            const secondResult = careerMap[secondary[0]] || careerMap.education;
            const profile = personalityProfiles[top[0]] || personalityProfiles.tech;
            const percentage = Math.min(98, Math.round((top[1] / maxPossible) * 100));
            const secondPct = Math.min(98, Math.round((secondary[1] / maxPossible) * 100));

            // Build category score bars HTML
            const scoreBarsHTML = sorted.map(([k, v], i) => {
                const pct = Math.round((v / maxPossible) * 100);
                const cm = careerMap[k] || { icon: '📌', name: k, color: '#94a3b8' };
                const barColors = [
                    'linear-gradient(90deg, #34d399, #38bdf8)',
                    'linear-gradient(90deg, #38bdf8, #a78bfa)',
                    'linear-gradient(90deg, #a78bfa, #f472b6)',
                    'linear-gradient(90deg, #f472b6, #fb923c)',
                    'linear-gradient(90deg, #fb923c, #fbbf24)',
                    'linear-gradient(90deg, #38bdf8, #34d399)',
                    'linear-gradient(90deg, #818cf8, #a78bfa)',
                ];
                const barColor = barColors[i % barColors.length];
                return `
                <div class="score-bar-row">
                  <span class="score-bar-label">${cm.icon} ${cm.name}</span>
                  <div class="score-bar-track">
                    <div class="score-bar-fill" data-width="${pct}" style="background:${barColor};"></div>
                  </div>
                  <span class="score-bar-pct">${pct}%</span>
                </div>
              `;
            }).join('');

            // Build career path visualization
            const highMatches = sorted.filter(([, v]) => (v / maxPossible) >= 0.6).slice(0, 3);
            const medMatches = sorted.filter(([, v]) => (v / maxPossible) >= 0.35 && (v / maxPossible) < 0.6).slice(0, 3);
            const lowMatches = sorted.filter(([, v]) => (v / maxPossible) < 0.35).slice(0, 3);

            const pathHTML = `
            <div class="career-path-section">
              <h4>🛤️ 职业路径匹配图</h4>
              ${highMatches.length > 0 ? `
              <div class="path-level high">
                <span class="path-icon">⭐</span>
                <span class="path-category">高度匹配</span>
                <span class="path-careers">${highMatches.map(([k]) => careerMap[k]?.name || k).join(' · ')}</span>
              </div>` : ''}
              ${medMatches.length > 0 ? `
              <div class="path-level medium">
                <span class="path-icon">🔹</span>
                <span class="path-category">中度匹配</span>
                <span class="path-careers">${medMatches.map(([k]) => careerMap[k]?.name || k).join(' · ')}</span>
              </div>` : ''}
              ${lowMatches.length > 0 ? `
              <div class="path-level low">
                <span class="path-icon">🔸</span>
                <span class="path-category">探索方向</span>
                <span class="path-careers">${lowMatches.map(([k]) => careerMap[k]?.name || k).join(' · ')}</span>
              </div>` : ''}
            </div>
          `;

            // Build share text
            const shareText = `🧪 我的职业测试结果\n\n🎯 最佳匹配：${result.icon} ${result.name}（${percentage}%）\n👤 人格类型：${profile.type}\n🥈 第二匹配：${secondResult.icon} ${secondResult.name}（${secondPct}%）\n\n📊 全部排名：\n${sorted.slice(0,5).map(([k,v]) => `${careerMap[k]?.icon||'📌'} ${careerMap[k]?.name||k}: ${Math.round((v/maxPossible)*100)}%`).join('\n')}\n\n🔗 来世界职业百科测试你的职业方向吧！`;

            container.innerHTML = `
            <div class="quiz-header">
              <h2>🎯 测试结果</h2>
            </div>

            <!-- Primary Match -->
            <div class="result-icon">${result.icon}</div>
            <span class="primary-match-badge" style="display:block; text-align:center; width:fit-content; margin:0 auto 0.5rem;">🏆 最佳匹配</span>
            <div class="match-percentage">${percentage}%</div>
            <p style="text-align:center; font-size:1.4rem; font-weight:700; margin:0.5rem 0;">${result.name}</p>
            <p style="text-align:center; color:var(--text-secondary); margin-bottom:0.5rem;">${result.reason}</p>

            <!-- Personality Profile -->
            <div class="personality-card">
              <h4>🧬 人格画像：${profile.type}</h4>
              <div class="traits">
                ${profile.traits.map(t => `<span class="trait-tag">${t}</span>`).join('')}
              </div>
              <p>${profile.desc}</p>
            </div>

            <!-- Secondary Match -->
            <div class="secondary-card">
              <span class="sec-icon">${secondResult.icon}</span>
              <div class="sec-info">
                <span class="secondary-match-badge">🥈 第二匹配</span>
                <h4>${secondResult.name} <span style="color:var(--accent); font-size:0.9rem;">${secondPct}%</span></h4>
                <p>${secondResult.reason}</p>
              </div>
            </div>

            <!-- Score Bars -->
            <div style="background:rgba(56,189,248,0.06); border-radius:var(--border-radius-md); padding:1.5rem; margin:1.2rem 0;">
              <h4 style="color:var(--accent); margin-bottom:1rem;">📊 各领域匹配度</h4>
              ${scoreBarsHTML}
            </div>

            <!-- Career Path Viz -->
            ${pathHTML}

            <!-- Share Section -->
            <div class="share-section">
              <h4>📤 分享你的结果</h4>
              <textarea class="share-textarea" id="shareTextarea" rows="6" readonly>${shareText}</textarea>
              <button class="btn btn-sm" onclick="copyShare()" style="margin:0;">📋 复制分享内容</button>
            </div>

            <!-- Action Buttons -->
            <div class="retake-row">
              <button class="btn" onclick="window.location.href='careers.html'">📚 浏览匹配职业</button>
              <button class="btn btn-outline" onclick="window.location.href='compare.html'">🔄 对比这些职业</button>
            </div>
            <button class="btn btn-outline" style="margin-top:0.6rem;" onclick="retakeTest()">🔄 重新测试</button>
          `;

            // Trigger score bar animation after render
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    document.querySelectorAll('.score-bar-fill').forEach(bar => {
                        bar.style.width = bar.dataset.width + '%';
                    });
                });
            });
        }

        // ═══════════════════════════════════════
        //  COPY SHARE
        // ═══════════════════════════════════════
        function copyShare() {
            const textarea = document.getElementById('shareTextarea');
            if (!textarea) return;
            textarea.select();
            textarea.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(textarea.value).then(() => {
                const toast = document.getElementById('copiedToast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            }).catch(() => {
                // Fallback for older browsers
                try {
                    textarea.select();
                    document.execCommand('copy');
                    const toast = document.getElementById('copiedToast');
                    toast.classList.add('show');
                    setTimeout(() => toast.classList.remove('show'), 2000);
                } catch (e) {
                    alert('复制失败，请手动选择文本复制');
                }
            });
        }

        // ═══════════════════════════════════════
        //  RETAKE TEST
        // ═══════════════════════════════════════
        function retakeTest() {
            renderIntro();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ═══════════════════════════════════════
        //  INIT
        // ═══════════════════════════════════════
        renderIntro();
        console.log('🧪 职业测试页面已加载 - ' + totalQuestions + ' 道题目 · 13个职业领域 · 完备人格分析');
    </script>
