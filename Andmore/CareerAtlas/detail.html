<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>职业详情 · 世界职业百科</title>
    <style>
        /* ========== CSS变量与全局重置 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep: #060b14;
            --bg-primary: #0b1120;
            --bg-secondary: #111827;
            --bg-card: rgba(15, 23, 42, 0.75);
            --bg-card-solid: #0f172a;
            --glass-bg: rgba(15, 23, 42, 0.55);
            --glass-bg-strong: rgba(15, 23, 42, 0.85);
            --glass-border: rgba(56, 189, 248, 0.18);
            --glass-border-strong: rgba(56, 189, 248, 0.35);
            --accent: #38bdf8;
            --accent-secondary: #818cf8;
            --accent-glow: rgba(56, 189, 248, 0.45);
            --accent-glow-strong: rgba(56, 189, 248, 0.7);
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
            --info: #60a5fa;
            --border-radius-xl: 2.5rem;
            --border-radius-lg: 1.75rem;
            --border-radius-md: 1.25rem;
            --border-radius-sm: 0.85rem;
            --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 40px var(--accent-glow);
            --font-primary: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            --font-display: 'Space Grotesk', 'Inter', sans-serif;
        }

        /* 日间模式变量 */
        body.light-mode {
            --bg-deep: #f1f5f9;
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-card: rgba(255, 255, 255, 0.8);
            --bg-card-solid: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-bg-strong: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(56, 189, 248, 0.35);
            --glass-border-strong: rgba(56, 189, 248, 0.55);
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --accent: #0284c7;
            --accent-secondary: #4f46e5;
            --accent-glow: rgba(2, 132, 199, 0.3);
            --accent-glow-strong: rgba(2, 132, 199, 0.5);
            --shadow-lg: 0 20px 40px -12px rgba(0, 0, 0, 0.1);
            --shadow-glow: 0 0 35px rgba(2, 132, 199, 0.25);
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }

        body {
            font-family: var(--font-primary);
            background: var(--bg-deep);
            background-image:
                radial-gradient(ellipse at 25% 5%, rgba(56, 189, 248, 0.10) 0%, transparent 55%),
                radial-gradient(ellipse at 70% 15%, rgba(129, 140, 248, 0.07) 0%, transparent 55%),
                radial-gradient(ellipse at 45% 85%, rgba(56, 189, 248, 0.05) 0%, transparent 55%);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            transition: background 0.5s ease, color 0.4s ease;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            padding-bottom: 4rem;
        }

        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-deep);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--accent), var(--accent-secondary));
            border-radius: 10px;
            border: 2px solid var(--bg-deep);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        /* ========== 导航栏 ========== */
        .navbar {
            position: sticky;
            top: 15px;
            margin: 15px 28px;
            padding: 0.9rem 2.2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--glass-bg);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid var(--glass-border);
            border-radius: 4rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
            z-index: 1000;
            transition: all var(--transition-smooth);
            flex-wrap: wrap;
            gap: 1rem;
        }
        .logo {
            font-weight: 800;
            font-size: 1.6rem;
            background: linear-gradient(135deg, var(--accent), #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            cursor: pointer;
            white-space: nowrap;
            letter-spacing: -0.02em;
        }
        .nav-links {
            display: flex;
            gap: 1.3rem;
            list-style: none;
            flex-wrap: wrap;
            align-items: center;
        }
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.85rem;
            transition: var(--transition-fast);
            padding: 0.25rem 0;
            position: relative;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent);
            transition: width var(--transition-smooth);
            border-radius: 2px;
        }
        .nav-links a:hover {
            color: var(--accent);
            text-shadow: 0 0 12px var(--accent-glow);
        }
        .nav-links a:hover::after {
            width: 100%;
        }
        .theme-toggle {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--glass-border);
            border-radius: 2.5rem;
            padding: 0.5rem 1.2rem;
            color: var(--text-primary);
            cursor: pointer;
            font-family: var(--font-primary);
            font-size: 0.85rem;
            font-weight: 500;
            transition: all var(--transition-smooth);
            white-space: nowrap;
            backdrop-filter: blur(10px);
        }
        .theme-toggle:hover {
            background: rgba(56, 189, 248, 0.12);
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* ========== 主容器 ========== */
        .detail-container {
            max-width: 1040px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        /* ========== 区域标签页（Hash导航）========== */
        .section-tabs {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1.8rem;
            padding: 0.3rem;
            background: var(--glass-bg);
            backdrop-filter: blur(18px);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius-lg);
            position: sticky;
            top: 115px;
            z-index: 50;
        }
        .section-tab {
            padding: 0.55rem 1.1rem;
            border-radius: 2rem;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-family: var(--font-primary);
            font-size: 0.82rem;
            font-weight: 500;
            transition: all var(--transition-fast);
            white-space: nowrap;
            text-decoration: none;
        }
        .section-tab:hover {
            color: var(--text-primary);
            background: rgba(56, 189, 248, 0.08);
        }
        .section-tab.active {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent);
            font-weight: 600;
            box-shadow: 0 0 14px var(--accent-glow);
        }

        /* ========== 封面区域 ========== */
        .cover-section {
            background: var(--bg-card);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius-lg);
            padding: 2.5rem;
            margin-bottom: 2rem;
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            align-items: center;
            transition: all var(--transition-smooth);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        .cover-section:hover {
            border-color: var(--glass-border-strong);
            box-shadow: 0 12px 40px rgba(56, 189, 248, 0.08);
        }
        .cover-icon {
            font-size: 5rem;
            background: rgba(56, 189, 248, 0.1);
            border-radius: 2rem;
            padding: 1.5rem;
            transition: all var(--transition-smooth);
            flex-shrink: 0;
        }
        .cover-icon:hover {
            background: rgba(56, 189, 248, 0.18);
            transform: scale(1.05);
            box-shadow: 0 0 30px var(--accent-glow);
        }
        .cover-info h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(180deg, var(--text-primary), var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .cover-meta {
            display: flex;
            gap: 1rem;
            margin-top: 0.8rem;
            flex-wrap: wrap;
        }
        .meta-item {
            background: rgba(56, 189, 248, 0.08);
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            font-size: 0.88rem;
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            transition: all var(--transition-fast);
        }
        .meta-item:hover {
            background: rgba(56, 189, 248, 0.15);
            border-color: var(--accent);
        }
        .cover-description {
            margin-top: 1rem;
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.7;
        }

        /* ========== 信息网格卡片 ========== */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .info-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius-md);
            padding: 1.8rem;
            transition: all var(--transition-smooth);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.15);
        }
        .info-card:hover {
            border-color: var(--glass-border-strong);
            box-shadow: 0 8px 36px rgba(56, 189, 248, 0.08);
            transform: translateY(-2px);
        }
        .info-card h3 {
            color: var(--accent);
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }
        .info-card ul {
            list-style: none;
            padding: 0;
        }
        .info-card li {
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            transition: all var(--transition-fast);
        }
        .info-card li:hover {
            color: var(--text-primary);
            padding-left: 0.3rem;
        }
        .info-card li::before {
            content: '• ';
            color: var(--accent);
            font-weight: bold;
        }

        /* ========== 技能条 ========== */
        .skill-bar {
            margin: 0.7rem 0;
        }
        .skill-bar-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 0.3rem;
            color: var(--text-secondary);
        }
        .skill-bar-fill {
            height: 8px;
            background: rgba(56, 189, 248, 0.12);
            border-radius: 10px;
            overflow: hidden;
        }
        .skill-bar-fill-inner {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #a78bfa);
            border-radius: 10px;
            transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        /* 脉冲动画 */
        .skill-bar-fill-inner.animated {
            animation: skillPulse 2.5s ease-in-out infinite;
        }
        @keyframes skillPulse {
            0%, 100% {
                box-shadow: 0 0 6px var(--accent-glow);
            }
            50% {
                box-shadow: 0 0 18px var(--accent-glow-strong), 0 0 36px var(--accent-glow);
            }
        }

        /* 加分技能标签 */
        .bonus-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }
        .bonus-tag {
            background: rgba(251, 191, 36, 0.12);
            border: 1px solid rgba(251, 191, 36, 0.25);
            padding: 0.3rem 0.9rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            color: var(--warning);
            transition: all var(--transition-fast);
        }
        .bonus-tag:hover {
            background: rgba(251, 191, 36, 0.2);
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.2);
        }

        /* ========== 时间线 (学习路径) ========== */
        .timeline {
            position: relative;
            padding-left: 2rem;
            border-left: 2px solid var(--glass-border);
            margin: 1.5rem 0;
        }
        .timeline-item {
            position: relative;
            margin-bottom: 1.8rem;
            padding-left: 1.5rem;
            transition: all var(--transition-fast);
        }
        .timeline-item:hover {
            transform: translateX(4px);
        }
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -2.55rem;
            top: 0.3rem;
            width: 14px;
            height: 14px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--accent-glow);
            transition: all var(--transition-smooth);
        }
        .timeline-item:hover::before {
            box-shadow: 0 0 25px var(--accent-glow-strong);
            transform: scale(1.2);
        }
        .timeline-item h4 {
            color: var(--accent);
            margin-bottom: 0.3rem;
            font-weight: 700;
        }

        /* ========== 职业发展路径步骤 ========== */
        .progress-steps {
            display: flex;
            justify-content: space-between;
            margin: 2rem 0;
            position: relative;
            gap: 0.5rem;
        }
        .progress-steps::before {
            content: '';
            position: absolute;
            top: 18px;
            left: 10%;
            right: 10%;
            height: 3px;
            background: var(--glass-border);
            z-index: 0;
            border-radius: 3px;
        }
        .step {
            text-align: center;
            position: relative;
            z-index: 1;
            flex: 1;
            transition: all var(--transition-fast);
        }
        .step:hover {
            transform: translateY(-4px);
        }
        .step-circle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 2px solid var(--accent);
            margin: 0 auto 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--accent);
            transition: all var(--transition-smooth);
        }
        .step:hover .step-circle {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 0 24px var(--accent-glow-strong);
        }
        .step-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* ========== 薪资预测柱状图 ========== */
        .salary-projection {
            margin-bottom: 2rem;
        }
        .salary-chart {
            display: flex;
            align-items: flex-end;
            gap: 2rem;
            padding: 1.5rem 1rem;
            min-height: 220px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .salary-bar-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
            flex: 1;
            min-width: 100px;
            max-width: 160px;
        }
        .salary-bar-value {
            font-weight: 700;
            font-size: 1rem;
            color: var(--accent);
        }
        .salary-bar {
            width: 70px;
            border-radius: 12px 12px 0 0;
            transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            min-height: 20px;
            cursor: pointer;
        }
        .salary-bar:hover {
            filter: brightness(1.2);
            box-shadow: 0 0 24px var(--accent-glow);
        }
        .salary-bar.entry {
            background: linear-gradient(180deg, var(--accent), #7dd3fc);
            height: 60px;
        }
        .salary-bar.mid {
            background: linear-gradient(180deg, #38bdf8, #818cf8);
            height: 110px;
        }
        .salary-bar.senior {
            background: linear-gradient(180deg, #818cf8, #a78bfa);
            height: 160px;
        }
        .salary-bar.expert {
            background: linear-gradient(180deg, #a78bfa, #c084fc);
            height: 200px;
        }
        .salary-bar-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* ========== 日间一日时间线 ========== */
        .day-timeline {
            position: relative;
            padding-left: 2.5rem;
            border-left: 2px solid var(--glass-border);
            margin: 1.5rem 0;
        }
        .day-timeline-item {
            position: relative;
            margin-bottom: 1.5rem;
            padding: 0.8rem 1.2rem;
            background: rgba(56, 189, 248, 0.04);
            border-radius: var(--border-radius-sm);
            border: 1px solid transparent;
            transition: all var(--transition-fast);
        }
        .day-timeline-item:hover {
            border-color: var(--glass-border);
            background: rgba(56, 189, 248, 0.08);
        }
        .day-timeline-item::before {
            content: '';
            position: absolute;
            left: -2.82rem;
            top: 1rem;
            width: 10px;
            height: 10px;
            background: var(--accent-secondary);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--accent-glow);
        }
        .day-time {
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--accent);
            margin-bottom: 0.2rem;
        }
        .day-activity {
            color: var(--text-secondary);
            font-size: 0.92rem;
        }

        /* ========== 利弊对比 ========== */
        .pros-cons-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }
        .pros-box, .cons-box {
            padding: 1.5rem;
            border-radius: var(--border-radius-md);
            border: 1px solid;
            transition: all var(--transition-smooth);
        }
        .pros-box {
            background: rgba(52, 211, 153, 0.06);
            border-color: rgba(52, 211, 153, 0.25);
        }
        .pros-box:hover {
            background: rgba(52, 211, 153, 0.1);
            box-shadow: 0 0 24px rgba(52, 211, 153, 0.12);
        }
        .pros-box h4 {
            color: var(--success);
            margin-bottom: 0.8rem;
            font-size: 1.1rem;
        }
        .cons-box {
            background: rgba(248, 113, 113, 0.06);
            border-color: rgba(248, 113, 113, 0.25);
        }
        .cons-box:hover {
            background: rgba(248, 113, 113, 0.1);
            box-shadow: 0 0 24px rgba(248, 113, 113, 0.12);
        }
        .cons-box h4 {
            color: var(--danger);
            margin-bottom: 0.8rem;
            font-size: 1.1rem;
        }
        .pros-cons-list {
            list-style: none;
            padding: 0;
        }
        .pros-cons-list li {
            padding: 0.4rem 0;
            color: var(--text-secondary);
            font-size: 0.9rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .pros-box .pros-cons-list li::before {
            content: '✓ ';
            color: var(--success);
            font-weight: bold;
        }
        .cons-box .pros-cons-list li::before {
            content: '✗ ';
            color: var(--danger);
            font-weight: bold;
        }

        /* ========== 认证证书 ========== */
        .cert-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
        }
        .cert-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius-sm);
            padding: 1.2rem;
            transition: all var(--transition-smooth);
            cursor: default;
        }
        .cert-card:hover {
            border-color: var(--accent);
            box-shadow: 0 0 22px var(--accent-glow);
            transform: translateY(-3px);
        }
        .cert-card h4 {
            color: var(--accent);
            font-size: 0.95rem;
            margin-bottom: 0.3rem;
        }
        .cert-card p {
            font-size: 0.82rem;
            color: var(--text-muted);
            line-height: 1.4;
        }
        .cert-difficulty {
            display: inline-block;
            margin-top: 0.5rem;
            padding: 0.2rem 0.7rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .cert-difficulty.hard {
            background: rgba(248, 113, 113, 0.15);
            color: var(--danger);
        }
        .cert-difficulty.medium {
            background: rgba(251, 191, 36, 0.15);
            color: var(--warning);
        }
        .cert-difficulty.easy {
            background: rgba(52, 211, 153, 0.15);
            color: var(--success);
        }

        /* ========== 全球需求地图 ========== */
        .demand-regions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.8rem;
        }
        .demand-region {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius-sm);
            padding: 1rem;
            text-align: center;
            transition: all var(--transition-smooth);
        }
        .demand-region:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        .demand-flag {
            font-size: 1.6rem;
        }
        .demand-region-name {
            font-weight: 600;
            color: var(--text-primary);
            margin: 0.3rem 0;
            font-size: 0.9rem;
        }
        .demand-meter {
            height: 6px;
            background: rgba(56, 189, 248, 0.12);
            border-radius: 6px;
            margin-top: 0.5rem;
            overflow: hidden;
        }
        .demand-meter-fill {
            height: 100%;
            border-radius: 6px;
            transition: width 1s ease;
        }

                </div>

                <!-- 相似职业 -->
                <div class="full-width-card animate-in delay-6" id="similar">
                    <h3>🔗 相似职业推荐</h3>
                    <p style="color:var(--text-secondary); margin-bottom:1rem; font-size:0.9rem;">与${careerData.name}技能相近的职业方向</p>
                    ${buildSimilarCareers(careerData)}
                </div>
            `;

            // ========== 动画技能条 ==========
            setTimeout(() => {
                document.querySelectorAll('.skill-bar-fill-inner').forEach(el => {
                    el.style.width = el.dataset.width;
                    // 添加脉冲动画
                    setTimeout(() => {
                        el.classList.add('animated');
                    }, 1200);
                });
            }, 200);

            // ========== 区域标签点击滚动 ==========
            const sectionTabs = document.querySelectorAll('.section-tab');
            sectionTabs.forEach(tab => {
                tab.addEventListener('click', function(e) {
                    e.preventDefault();
                    const targetId = this.getAttribute('data-section');
                    const target = document.getElementById(targetId);
                    if (target) {
                        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        // 更新URL hash（不触发跳转）
                        history.replaceState(null, null, '#' + targetId);
                        // 高亮当前标签
                        sectionTabs.forEach(t => t.classList.remove('active'));
                        this.classList.add('active');
                    }
                });
            });

            // ========== URL Hash导航（页面加载时） ==========
            function handleHashNavigation() {
                const hash = window.location.hash.replace('#', '');
                if (hash) {
                    const target = document.getElementById(hash);
                    if (target) {
                        setTimeout(() => {
                            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        }, 400);
                        sectionTabs.forEach(t => {
                            t.classList.remove('active');
                            if (t.getAttribute('data-section') === hash) {
                                t.classList.add('active');
                            }
                        });
                    }
                }
            }
            handleHashNavigation();
            window.addEventListener('hashchange', handleHashNavigation);

            // ========== 滚动时自动高亮区域标签 ==========
            const sectionIds = ['overview', 'skills', 'learning', 'salary-projection', 'day-in-life', 'pros-cons', 'certifications', 'global-demand', 'similar'];
            let ticking = false;
            window.addEventListener('scroll', function() {
                if (!ticking) {
                    requestAnimationFrame(function() {
                        const scrollPos = window.scrollY + 140;
                        let activeSection = 'overview';
                        sectionIds.forEach(id => {
                            const el = document.getElementById(id);
                            if (el && el.offsetTop <= scrollPos) {
                                activeSection = id;
                            }
                        });
                        sectionTabs.forEach(t => {
                            t.classList.remove('active');
                            if (t.getAttribute('data-section') === activeSection) {
                                t.classList.add('active');
                            }
                        });
                        ticking = false;
                    });
                    ticking = true;
                }
            });

            console.log('🧠 职业详情页已加载 - ' + careerData.name + ' (ID: ' + careerId + ')');
        })();
    </script>
</body>
</html>
