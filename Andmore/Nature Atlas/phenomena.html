<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>现象库 · Nature Atlas</title>
    <style>
        :root {
            --bg-deep: #0a0e14;
            --bg-card: rgba(17, 22, 29, 0.82);
            --glass-bg: rgba(10, 14, 20, 0.7);
            --glass-border: rgba(0, 160, 220, 0.18);
            --glass-border-bright: rgba(0, 180, 240, 0.35);
            --accent-ocean: #0099cc;
            --accent-storm: #e8793e;
            --accent-magma: #e0553d;
            --accent-aurora: #4ecb71;
            --accent-lightning: #f5c842;
            --accent-glow-ocean: rgba(0, 160, 220, 0.4);
            --text-primary: #e2e6ea;
            --text-secondary: #a8b4c0;
            --text-muted: #6b7885;
            --border-radius-xl: 1.8rem;
            --border-radius-md: 0.8rem;
            --shadow-card: 0 8px 35px rgba(0, 0, 0, 0.55);
            --transition-smooth: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            --font-body: 'Source Sans 3', 'Inter', sans-serif;
            --font-heading: 'Playfair Display', 'Georgia', serif;
            --font-mono: 'JetBrains Mono', 'Courier New', monospace;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: var(--font-body);
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 4rem;
        }
        .navbar {
            position: sticky;
            top: 10px;
            margin: 10px 20px;
            padding: 0.8rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 3rem;
            z-index: 100;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .logo {
            font-family: var(--font-heading);
            font-size: 1.4rem;
            font-weight: 700;
            cursor: pointer;
        }
        .logo .nat {
            color: var(--accent-ocean);
        }
        .nav-links {
            display: flex;
            gap: 1.2rem;
            list-style: none;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            transition: 0.2s;
        }
        .nav-links a:hover,
        .nav-links a.active {
            color: var(--accent-ocean);
        }
        .page-header {
            text-align: center;
            padding: 3rem 1rem 1.5rem;
        }
        .page-header h1 {
            font-family: var(--font-heading);
            font-size: 2.5rem;
        }
        .main-layout {
            display: flex;
            gap: 2rem;
            padding: 1rem 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }
        .filter-sidebar {
            width: 240px;
            flex-shrink: 0;
            background: var(--bg-card);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius-xl);
            padding: 1.8rem;
            position: sticky;
            top: 110px;
            height: fit-content;
        }
        .filter-sidebar h3 {
            font-family: var(--font-heading);
            color: var(--accent-ocean);
            margin-bottom: 1.2rem;
        }
        .filter-group {
            margin-bottom: 1.3rem;
        }
        .filter-group label {
            display: block;
            font-weight: 600;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            margin-bottom: 0.3rem;
            color: var(--text-secondary);
            text-transform: uppercase;
        }
        .filter-group select {
            width: 100%;
            padding: 0.6rem;
            background: #1a2029;
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius-md);
            color: var(--text-primary);
            font-family: var(--font-body);
            cursor: pointer;
        }
        .intensity-options {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
        }
        .intensity-chip {
            padding: 0.25rem 0.6rem;
            border-radius: 2rem;
            font-size: 0.7rem;
            cursor: pointer;
            border: 1px solid var(--glass-border);
            background: transparent;
            color: var(--text-secondary);
            transition: 0.2s;
        }
        .intensity-chip.active {
            background: rgba(0, 160, 220, 0.2);
            border-color: var(--accent-ocean);
            color: var(--accent-ocean);
        }
        .phenomena-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            align-content: start;
        }
        .phenom-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius-xl);
            overflow: hidden;
            cursor: pointer;
            transition: all var(--transition-smooth);
            box-shadow: var(--shadow-card);
            position: relative;
        }
        .phenom-card:hover {
            transform: translateY(-6px);
            border-color: var(--accent-ocean);
            box-shadow: 0 0 35px var(--accent-glow-ocean), 0 15px 30px rgba(0, 0, 0, 0.5);
        }
        .phenom-img {
            height: 170px;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
            padding: 0.8rem;
        }
        .phenom-body {
            padding: 1.3rem;
        }
        .phenom-body h3 {
            font-family: var(--font-heading);
            font-size: 1.2rem;
        }
        .level-badge {
            display: inline-block;
            padding: 0.2rem 0.7rem;
            border-radius: 2rem;
            font-size: 0.7rem;
            letter-spacing: 1px;
            font-weight: 700;
        }
        .level-extreme {
            background: rgba(224, 85, 61, 0.2);
            color: var(--accent-magma);
        }
        .level-high {
            background: rgba(232, 121, 62, 0.2);
            color: var(--accent-storm);
        }
        .level-moderate {
            background: rgba(245, 200, 66, 0.2);
            color: var(--accent-lightning);
        }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 2rem;
        }
        .page-btn {
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            cursor: pointer;
        }
        .page-btn.active {
            background: var(--accent-ocean);
            color: #fff;
        }
        @media (max-width: 900px) {
            .main-layout {
                flex-direction: column;
                padding: 1rem;
            }
            .filter-sidebar {
                width: 100%;
                position: static;
            }
        }

        /* ========== NEW: Quick Stats Bar ========== */
        .quick-stats-bar {
            display: flex;
            gap: 1.2rem;
            justify-content: center;
            flex-wrap: wrap;
            padding: 1rem 2rem;
            max-width: 1400px;
            margin: 0 auto 0.5rem;
        }
        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius-md);
            padding: 0.9rem 1.5rem;
            text-align: center;
            min-width: 140px;
            transition: all var(--transition-smooth);
        }
        .stat-card:hover {
            border-color: var(--accent-ocean);
            box-shadow: 0 0 20px var(--accent-glow-ocean);
        }
        .stat-number {
            font-family: var(--font-heading);
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent-ocean);
        }
        .stat-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 0.2rem;
        }

        /* ========== NEW: Featured Phenomenon Banner ========== */
        .featured-banner {
            max-width: 1400px;
            margin: 0 auto 1.5rem;
            padding: 0 2rem;
        }
        .featured-card {
            background: var(--bg-card);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border-bright);
            border-radius: var(--border-radius-xl);
            display: flex;
            overflow: hidden;
            min-height: 220px;
            transition: all 0.6s ease;
            position: relative;
        }
        .featured-card.fade-out {
            opacity: 0;
            transform: translateY(10px);
        }
        .featured-img {
            width: 340px;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .featured-img .featured-icon {
            position: absolute;
            bottom: 1rem;
            left: 1rem;
            font-size: 2.5rem;
        }
        .featured-body {
            padding: 1.8rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex: 1;
        }
        .featured-body h2 {
            font-family: var(--font-heading);
            font-size: 1.8rem;
            margin-bottom: 0.3rem;
        }
        .featured-body .featured-type-badge {
            display: inline-block;
            padding: 0.2rem 0.8rem;
            border-radius: 2rem;
            font-size: 0.7rem;
            letter-spacing: 1px;
            font-weight: 700;
            margin-bottom: 0.6rem;
            width: fit-content;
        }
        .featured-body .featured-desc {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 0.5rem;
        }
        .featured-body .featured-meta {
            color: var(--text-muted);
            font-size: 0.75rem;
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        .featured-body .featured-meta span {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        @media (max-width: 768px) {
            .featured-card {
                flex-direction: column;
            }
            .featured-img {
                width: 100%;
                height: 180px;
            }
        }

        /* ========== NEW: Phenomenon of the Day glowing border ========== */
        @keyframes potdGlow {
            0%, 100% { border-color: var(--accent-ocean); box-shadow: 0 0 15px var(--accent-glow-ocean), 0 0 35px rgba(0,160,220,0.25); }
            25% { border-color: var(--accent-aurora); box-shadow: 0 0 15px rgba(78,203,113,0.4), 0 0 35px rgba(78,203,113,0.25); }
            50% { border-color: var(--accent-storm); box-shadow: 0 0 15px rgba(232,121,62,0.4), 0 0 35px rgba(232,121,62,0.25); }
            75% { border-color: var(--accent-magma); box-shadow: 0 0 15px rgba(224,85,61,0.4), 0 0 35px rgba(224,85,61,0.25); }
        }
        .phenom-card.potd {
            animation: potdGlow 3s ease-in-out infinite;
            border-width: 2px;
        }
        .phenom-card.potd::before {
            content: '⭐ 今日现象';
            position: absolute;
            top: 8px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: var(--accent-lightning);
            font-size: 0.65rem;
            padding: 0.2rem 0.55rem;
            border-radius: 1rem;
            z-index: 5;
            letter-spacing: 0.5px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(245,200,66,0.35);
        }

        /* ========== NEW: Type-specific card top borders ========== */
        .phenom-card.border-weather { border-top: 3px solid var(--accent-storm); }
        .phenom-card.border-geology { border-top: 3px solid var(--accent-magma); }
        .phenom-card.border-ocean   { border-top: 3px solid var(--accent-ocean); }
        .phenom-card.border-optical { border-top: 3px solid var(--accent-aurora); }

        /* ========== NEW: Sort toggle buttons ========== */
        .sort-toggle-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
            margin-top: 0.3rem;
        }
        .sort-btn {
            padding: 0.3rem 0.6rem;
            border-radius: 2rem;
            font-size: 0.65rem;
            cursor: pointer;
            border: 1px solid var(--glass-border);
            background: transparent;
            color: var(--text-secondary);
            transition: 0.2s;
            font-family: var(--font-body);
            white-space: nowrap;
        }
        .sort-btn.active {
            background: rgba(0,160,220,0.2);
            border-color: var(--accent-ocean);
            color: var(--accent-ocean);
        }
        .sort-dir-toggle {
            padding: 0.3rem 0.5rem;
            border-radius: 50%;
            font-size: 0.65rem;
            cursor: pointer;
            border: 1px solid var(--glass-border);
            background: transparent;
            color: var(--text-secondary);
            transition: 0.2s;
            font-family: var(--font-body);
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .sort-dir-toggle:hover {
            border-color: var(--accent-ocean);
            color: var(--accent-ocean);
        }

        /* ========== NEW: Compare selection ========== */
        .phenom-card .compare-check {
            position: absolute;
            top: 8px;
            left: 10px;
            z-index: 5;
            width: 18px;
            height: 18px;
            accent-color: var(--accent-ocean);
            cursor: pointer;
            transform: scale(1.2);
        }
        .phenom-card.selected-for-compare {
            border-color: var(--accent-lightning);
            box-shadow: 0 0 20px rgba(245,200,66,0.3);
        }
        .compare-bar {
            display: none;
            position: sticky;
            bottom: 20px;
            z-index: 90;
            text-align: center;
            margin: 0 auto;
            max-width: 400px;
        }
        .compare-bar.visible {
            display: block;
        }
        .compare-btn-main {
            padding: 0.7rem 1.8rem;
            border-radius: 3rem;
            background: var(--accent-ocean);
            border: none;
            color: #fff;
            font-family: var(--font-body);
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: 0.2s;
            box-shadow: 0 4px 20px rgba(0,160,220,0.4);
        }
        .compare-btn-main:hover {
            background: #00b4e5;
            box-shadow: 0 6px 28px rgba(0,180,240,0.55);
        }
        .compare-btn-main:disabled {
            background: #3a4450;
            box-shadow: none;
            cursor: not-allowed;
        }
        .compare-selection-hint {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 0.4rem;
        }

        /* ========== NEW: Scientific metadata tooltip on hover ========== */
        .phenom-card .sci-tooltip {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #11171f;
            color: var(--text-secondary);
            font-size: 0.7rem;
            line-height: 1.5;
            padding: 0.7rem 1rem;
            border-radius: var(--border-radius-md);
            border: 1px solid var(--glass-border-bright);
            white-space: normal;
            width: 260px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.25s ease;
            z-index: 20;
            text-align: left;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            margin-bottom: 8px;
        }
        .phenom-card .sci-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 6px solid transparent;
            border-top-color: rgba(0,180,240,0.35);
        }
        .phenom-card:hover .sci-tooltip {
            opacity: 1;
        }

        /* ========== NEW: Featured type badges ========== */
        .badge-weather { background: rgba(232,121,62,0.2); color: var(--accent-storm); }
        .badge-geology { background: rgba(224,85,61,0.2); color: var(--accent-magma); }
        .badge-ocean   { background: rgba(0,153,204,0.2); color: var(--accent-ocean); }
        .badge-optical { background: rgba(78,203,113,0.2); color: var(--accent-aurora); }

        /* ========== NEW: Type badge on cards ========== */
        .phenom-body .type-tag {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 1rem;
            font-size: 0.6rem;
            letter-spacing: 0.5px;
            margin-bottom: 0.4rem;
        }
        .type-weather { background: rgba(232,121,62,0.18); color: var(--accent-storm); }
        .type-geology { background: rgba(224,85,61,0.18); color: var(--accent-magma); }
        .type-ocean   { background: rgba(0,153,204,0.18); color: var(--accent-ocean); }
        .type-optical { background: rgba(78,203,113,0.18); color: var(--accent-aurora); }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Source+Sans+3:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="logo"><span class="nat">NATURE</span> ATLAS</div>
        <ul class="nav-links">
            <li><a href="nature_home.html">首页</a></li>
            <li><a href="phenomena.html" class="active">现象库</a></li>
            <li><a href="weather.html">极端天气</a></li>
            <li><a href="geology.html">地质现象</a></li>
            <li><a href="ocean.html">海洋现象</a></li>
            <li><a href="optical.html">光学现象</a></li>
            <li><a href="map.html">世界地图</a></li>
            <li><a href="timeline.html">时间轴</a></li>
            <li><a href="compare.html">数据对比</a></li>
        </ul>
    </nav>

    <div class="page-header">
        <h1>📚 自然现象库</h1>
        <p style="color:var(--text-muted);">探索地球最震撼的自然奇观</p>
    </div>

    <!-- NEW: Quick Stats Bar -->
    <div class="quick-stats-bar" id="quickStatsBar">
        <div class="stat-card">
            <div class="stat-number" id="statTotal">0</div>
            <div class="stat-label">收录现象</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="statTypes">0</div>
            <div class="stat-label">现象类型</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="statExtreme">0</div>
            <div class="stat-label">极端现象</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="statCommon">0</div>
            <div class="stat-label">常见现象</div>
        </div>
    </div>

    <!-- NEW: Featured Phenomenon Banner -->
    <div class="featured-banner" id="featuredBanner">
        <div class="featured-card" id="featuredCard">
            <div class="featured-img" id="featuredImg">
                <span class="featured-icon" id="featuredIcon"></span>
            </div>
            <div class="featured-body">
                <span class="featured-type-badge" id="featuredTypeBadge"></span>
                <h2 id="featuredName"></h2>
                <p class="featured-desc" id="featuredDesc"></p>
                <div class="featured-meta">
                    <span id="featuredIntensity"></span>
                    <span id="featuredLocation"></span>
                    <span id="featuredFrequency"></span>
                </div>
            </div>
        </div>
    </div>

    <div class="main-layout">
        <aside class="filter-sidebar">
            <h3>🔍 筛选</h3>
            <div class="filter-group">
                <label>类型</label>
                <select id="typeFilter">
                    <option value="all">全部</option><option value="weather">极端天气</option>
                    <option value="geology">地质现象</option><option value="ocean">海洋现象</option>
                    <option value="optical">光学现象</option>
                </select>
            </div>
            <div class="filter-group">
                <label>强度等级</label>
                <div class="intensity-options" id="intensityOptions">
                    <span class="intensity-chip" data-int="extreme">极端</span>
                    <span class="intensity-chip" data-int="high">高</span>
                    <span class="intensity-chip" data-int="moderate">中等</span>
                </div>
            </div>
            <!-- NEW: Sort Controls -->
            <div class="filter-group">
                <label>排序方式</label>
                <div class="sort-toggle-group" id="sortToggles">
                    <button class="sort-btn active" data-sort="default">默认</button>
                    <button class="sort-btn" data-sort="name">名称</button>
                    <button class="sort-btn" data-sort="intensity">强度</button>
                    <button class="sort-btn" data-sort="frequency">频率</button>
                </div>
                <div style="display:flex;align-items:center;gap:0.4rem;margin-top:0.35rem;">
                    <span style="font-size:0.65rem;color:var(--text-muted);">方向:</span>
                    <button class="sort-dir-toggle" id="sortDirToggle" title="切换升序/降序">↑</button>
                </div>
            </div>
            <button id="resetFilter" style="width:100%;padding:0.5rem;border-radius:2rem;background:transparent;border:1px solid var(--glass-border);color:var(--text-secondary);cursor:pointer;margin-top:0.5rem;">重置</button>
            <!-- NEW: Compare Selected Button -->
            <div style="margin-top:1rem;border-top:1px solid var(--glass-border);padding-top:1rem;">
                <button id="compareBtn" class="compare-btn-main" style="width:100%;" disabled>⚖️ 对比选中 (0/2)</button>
                <p class="compare-selection-hint">勾选卡片左上角复选框选择2个现象</p>
            </div>
        </aside>
        <div style="flex:1;">
            <div class="phenomena-grid" id="phenomenaGrid"></div>
            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <!-- NEW: Floating Compare Bar -->
    <div class="compare-bar" id="compareBar">
        <button class="compare-btn-main" id="compareBarBtn">⚖️ 对比选中现象</button>
    </div>

    <script>
        const phenomenaData = [
            // ===== WEATHER - 极端天气 =====
            { id: 'tornado', name: '龙卷风', icon: '🌪️', type: 'weather', intensity: 'extreme', level: 5,
                location: '全球(北美为主)', frequency: 'uncommon',

        let activeIntensity = null;
        let currentSort = 'default';
        let sortAscending = true;
        const itemsPerPage = 8;
        let currentPage = 1;
        let compareSet = [];
        const maxCompare = 2;

        // ===== SORT LOGIC =====
        const freqOrder = { 'very-common': 1, 'common': 2, 'uncommon': 3, 'rare': 4, 'very-rare': 5 };

        function sortData(data) {
            const sorted = [...data];
            if (currentSort === 'default') return sorted;
            if (currentSort === 'name') {
                sorted.sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'));
            } else if (currentSort === 'intensity') {
                sorted.sort((a, b) => a.level - b.level);
            } else if (currentSort === 'frequency') {
                sorted.sort((a, b) => (freqOrder[a.frequency] || 3) - (freqOrder[b.frequency] || 3));
            }
            if (!sortAscending) sorted.reverse();
            return sorted;
        }

        function getFiltered() {
            const typeVal = document.getElementById('typeFilter').value;
            const filtered = phenomenaData.filter(p => {
                if (typeVal !== 'all' && p.type !== typeVal) return false;
                if (activeIntensity && p.intensity !== activeIntensity) return false;
                return true;
            });
            return sortData(filtered);
        }

        function render() {
            const filtered = getFiltered();
            const totalPages = Math.ceil(filtered.length / itemsPerPage);
            if (currentPage > totalPages) currentPage = Math.max(1, totalPages);
            const start = (currentPage - 1) * itemsPerPage;
            const items = filtered.slice(start, start + itemsPerPage);
            const grid = document.getElementById('phenomenaGrid');
            const potdIndex = getPotdIndex();
            const globalIdx = phenomenaData.findIndex(p => p.id === items[0]?.id);

            grid.innerHTML = items.map((p, i) => {
                const realIdx = (start + i);
                const isPotd = (function() {
                    const dayIdx = hashDate() % phenomenaData.length;
                    const globalI = phenomenaData.findIndex(dp => dp.id === p.id);
                    return globalI === dayIdx;
                })();
                const isSelected = compareSet.includes(p.id);
                const typeLabel = { weather: '极端天气', geology: '地质现象', ocean: '海洋现象', optical: '光学现象' }[p.type] || p.type;
                return `
            <div class="phenom-card border-${p.type}${isPotd ? ' potd' : ''}${isSelected ? ' selected-for-compare' : ''}" style="animation: fadeIn 0.5s ease ${i*0.05}s both;" data-id="${p.id}">
              <input type="checkbox" class="compare-check" data-id="${p.id}" ${isSelected ? 'checked' : ''} title="选择对比">
              <div class="sci-tooltip">🔬 <strong>科学数据：</strong>${p.scientific}</div>
              <div class="phenom-img" style="background-image:url('${p.img}');"><span style="font-size:2rem;">${p.icon}</span></div>
              <div class="phenom-body" onclick="window.location.href='detail.html?phenomenon=${p.id}'">
                <span class="type-tag type-${p.type}">${typeLabel}</span>
                <h3>${p.name}</h3>
                <span class="level-badge level-${p.intensity}">强度: ${p.level}/5</span>
                <p style="color:var(--text-secondary); font-size:0.85rem; margin-top:0.5rem;">${p.desc}</p>
                <p style="color:var(--text-muted); font-size:0.75rem;">📍 ${p.location}</p>
              </div>
            </div>`;
            }).join('');

            // Attach checkbox event listeners
            grid.querySelectorAll('.compare-check').forEach(cb => {
                cb.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = this.dataset.id;
                    if (this.checked) {
                        if (compareSet.length >= maxCompare) {
                            this.checked = false;
                            alert('最多只能选择2个现象进行对比');
                            return;
                        }
                        compareSet.push(id);
                    } else {
                        compareSet = compareSet.filter(x => x !== id);
                    }
                    updateCompareUI();
                    render();
                });
            });

            const pagDiv = document.getElementById('pagination');
            if (totalPages <= 1) { pagDiv.innerHTML = ''; } else {
                let h = '';
                for (let p = 1; p <= totalPages; p++)
                    h +=
                    `<button class="page-btn ${p===currentPage?'active':''}" data-p="${p}">${p}</button>`;
                pagDiv.innerHTML = h;
                pagDiv.querySelectorAll('.page-btn').forEach(b => b.addEventListener('click', function() {
                    currentPage = parseInt(this.dataset.p);
                    render();
                    window.scrollTo({ top: 300, behavior: 'smooth' });
                }));
            }
        }

        // ===== QUICK STATS =====
        function updateQuickStats() {
            document.getElementById('statTotal').textContent = phenomenaData.length;
            const types = new Set(phenomenaData.map(p => p.type));
            document.getElementById('statTypes').textContent = types.size;
            const extreme = phenomenaData.filter(p => p.intensity === 'extreme').length;
            document.getElementById('statExtreme').textContent = extreme;
            const common = phenomenaData.filter(p => p.frequency === 'common' || p.frequency === 'very-common').length;
            document.getElementById('statCommon').textContent = common;
        }

        // ===== FEATURED PHENOMENON =====
        let featuredIdx = Math.floor(Math.random() * phenomenaData.length);
        let featuredTimer = null;

        function updateFeatured() {
            const p = phenomenaData[featuredIdx];
            const card = document.getElementById('featuredCard');
            card.classList.add('fade-out');
            setTimeout(() => {
                document.getElementById('featuredImg').style.backgroundImage = `url('${p.img}')`;
                document.getElementById('featuredIcon').textContent = p.icon;
                const typeLabel = { weather: '极端天气', geology: '地质现象', ocean: '海洋现象', optical: '光学现象' }[p.type];
                const badge = document.getElementById('featuredTypeBadge');
                badge.textContent = typeLabel;
                badge.className = `featured-type-badge badge-${p.type}`;
                document.getElementById('featuredName').textContent = p.name;
                document.getElementById('featuredDesc').textContent = p.desc;
                document.getElementById('featuredIntensity').innerHTML = `⚡ 强度 ${p.level}/5 (${p.intensity})`;
                document.getElementById('featuredLocation').innerHTML = `📍 ${p.location}`;
                const freqLabel = { 'very-common': '极常见', 'common': '常见', 'uncommon': '不常见', 'rare': '罕见', 'very-rare': '极罕见' }[p.frequency] || p.frequency;
                document.getElementById('featuredFrequency').innerHTML = `🔄 ${freqLabel}`;
                card.classList.remove('fade-out');
            }, 300);
            featuredIdx = (featuredIdx + 1) % phenomenaData.length;
        }

        function startFeaturedRotation() {
            updateFeatured();
            featuredTimer = setInterval(() => {
                updateFeatured();
            }, 30000);
        }

        // ===== COMPARE =====
        function updateCompareUI() {
            const btn = document.getElementById('compareBtn');
            const bar = document.getElementById('compareBar');
            const barBtn = document.getElementById('compareBarBtn');
            const count = compareSet.length;
            btn.textContent = `⚖️ 对比选中 (${count}/${maxCompare})`;
            btn.disabled = count !== 2;
            if (count === 2) {
                btn.style.opacity = '1';
                bar.classList.add('visible');
            } else {
                btn.style.opacity = '0.6';
                bar.classList.remove('visible');
            }
        }

        function doCompare() {
            if (compareSet.length === 2) {
                window.location.href = `compare.html?ids=${compareSet[0]},${compareSet[1]}`;
            }
        }

        // ===== PHENOMENON OF THE DAY =====
        function hashDate() {
            const s = new Date().toDateString();
            let h = 0;
            for (let i = 0; i < s.length; i++) { h = ((h << 5) - h) + s.charCodeAt(i);
                h |= 0; }
            return Math.abs(h);
        }

        function getPotdIndex() {
            return hashDate() % phenomenaData.length;
        }

        // ===== EVENT LISTENERS =====
        document.getElementById('typeFilter').addEventListener('change', () => { currentPage = 1;
            render(); });
        document.getElementById('intensityOptions').addEventListener('click', function(e) {
            if (e.target.classList.contains('intensity-chip')) {
                const int = e.target.dataset.int;
                if (activeIntensity === int) { activeIntensity = null;
                    e.target.classList.remove('active'); } else {
                    document.querySelectorAll('.intensity-chip').forEach(c => c.classList.remove(
                        'active'));
                    activeIntensity = int;
                    e.target.classList.add('active');
                }
                currentPage = 1;
                render();
            }
        });
        document.getElementById('resetFilter').addEventListener('click', () => {
            document.getElementById('typeFilter').value = 'all';
            activeIntensity = null;
            currentSort = 'default';
            sortAscending = true;
            document.querySelectorAll('.intensity-chip').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.sort-btn').forEach(b => { b.classList.remove('active'); if (b.dataset.sort === 'default') b.classList.add('active'); });
            document.getElementById('sortDirToggle').textContent = '↑';
            currentPage = 1;
            compareSet = [];
            updateCompareUI();
            render();
        });

        // Sort toggle buttons
        document.getElementById('sortToggles').addEventListener('click', function(e) {
            if (e.target.classList.contains('sort-btn')) {
                document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentSort = e.target.dataset.sort;
                currentPage = 1;
                render();
            }
        });

        // Sort direction toggle
        document.getElementById('sortDirToggle').addEventListener('click', function() {
            sortAscending = !sortAscending;
            this.textContent = sortAscending ? '↑' : '↓';
            currentPage = 1;
            render();
        });

        // Compare buttons
        document.getElementById('compareBtn').addEventListener('click', doCompare);
        document.getElementById('compareBarBtn').addEventListener('click', doCompare);

        // Search params handling (preserved from original)
        const urlP = new URLSearchParams(window.location.search);
        if (urlP.get('search')) {
            const q = urlP.get('search').toLowerCase();
            const filtered = phenomenaData.filter(p => p.name.includes(q) || p.desc.includes(q));
            document.getElementById('phenomenaGrid').innerHTML = filtered.length ? '' : '<p>未找到</p>';
        }

        // ===== INIT =====
        updateQuickStats();
        startFeaturedRotation();
        updateCompareUI();
        render();
        const st = document.createElement('style');
        st.textContent =
            '@keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}';
        document.head.appendChild(st);
    </script>
</body>
</html>
