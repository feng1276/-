    <style>
        :root {
            --bg-deep: #0a0e14;
            --bg-card: rgba(17, 22, 29, 0.82);
            --glass-bg: rgba(10, 14, 20, 0.7);
            --glass-border: rgba(0, 160, 220, 0.18);
            --accent-ocean: #0099cc;
            --accent-storm: #e8793e;
            --accent-magma: #e0553d;
            --accent-aurora: #4ecb71;
            --accent-lightning: #f5c842;
            --accent-glow-ocean: rgba(0, 160, 220, 0.4);
            --accent-weather: #e8793e;
            --accent-geology: #e0553d;
            --accent-optical: #c084fc;
            --accent-ocean-type: #38bdf8;
            --text-primary: #e2e6ea;
            --text-secondary: #a8b4c0;
            --text-muted: #6b7885;
            --border-radius-xl: 1.8rem;
            --border-radius-md: 0.8rem;
            --shadow-card: 0 8px 35px rgba(0, 0, 0, 0.55);
            --transition-smooth: 0.4s ease;
            --font-body: 'Source Sans 3', 'Inter', sans-serif;
            --font-heading: 'Playfair Display', 'Georgia', serif;
            --font-mono: 'JetBrains Mono', 'Courier New', monospace;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: var(--font-body);
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 4rem;
        }
        .navbar {
            position: sticky;
            top: 10px;
            margin: 10px 20px;
            padding: 0.7rem 1.8rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 3rem;
            z-index: 100;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .logo {
            font-family: var(--font-heading);
            font-size: 1.3rem;
            font-weight: 700;
            cursor: pointer;
        }
        .logo .nat {
            color: var(--accent-ocean);
        }
        .nav-links {
            display: flex;
            gap: 1rem;
            list-style: none;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.8rem;
            transition: 0.2s;
        }
        .nav-links a:hover {
            color: var(--accent-ocean);
        }
        .detail-container {
            max-width: 950px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
        .hero-banner {
            height: 350px;
            background-size: cover;
            background-position: center;
            border-radius: var(--border-radius-xl);
            display: flex;
            align-items: flex-end;
            padding: 2rem;
            position: relative;
            overflow: hidden;
            margin-bottom: 2rem;
            box-shadow: var(--shadow-card);
        }
        .hero-banner::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60%;
            background: linear-gradient(transparent, rgba(10, 14, 20, 0.9));
            pointer-events: none;
        }
        .hero-banner .banner-content {
            position: relative;
            z-index: 1;
        }
        .hero-banner h1 {
            font-family: var(--font-heading);
            font-size: 2.8rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.6);
        }
        .hero-banner .type-badge {
            display: inline-block;
            padding: 0.3rem 1rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            letter-spacing: 1px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            color: var(--accent-storm);
            margin-bottom: 0.8rem;
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .info-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius-xl);
            padding: 1.5rem;
            text-align: center;
            box-shadow: var(--shadow-card);
            transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
            cursor: default;
        }
        .info-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 48px rgba(0,0,0,0.65), 0 0 30px var(--card-glow, rgba(0,160,220,0.25));
            border-color: var(--card-glow, rgba(0,160,220,0.5));
        }
        .info-card.type-weather { --card-glow: rgba(232,121,62,0.35); }
        .info-card.type-geology { --card-glow: rgba(224,85,61,0.35); }
        .info-card.type-ocean { --card-glow: rgba(56,189,248,0.35); }
        .info-card.type-optical { --card-glow: rgba(192,132,252,0.35); }
        .info-card .info-icon {
            font-size: 2rem;
            display: block;
            margin-bottom: 0.5rem;
        }
        .info-card .info-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .info-card .info-value {
            font-family: var(--font-heading);
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent-ocean);
        }
        .section-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius-xl);
            padding: 2rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow-card);
        }
        .section-card h2 {
            font-family: var(--font-heading);
            color: var(--accent-ocean);
            margin-bottom: 1.2rem;
            font-size: 1.5rem;
            border-bottom: 2px solid rgba(0, 160, 220, 0.2);
            padding-bottom: 0.5rem;
        }
        .section-card p {
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: 1rem;
            font-size: 1rem;
        }
        .chart-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-top: 1rem;
        }
        .chart-box {
            background: rgba(0, 0, 0, 0.2);
            border-radius: var(--border-radius-md);
            padding: 1rem;
        }
        .chart-box h4 {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
        }
        .back-link {
            display: inline-block;
            margin-top: 1rem;
            color: var(--accent-ocean);
            text-decoration: none;
            font-weight: 600;
            transition: 0.2s;
        }
        .back-link:hover {
            text-shadow: 0 0 15px var(--accent-glow-ocean);
        }

        /* === NEW ENRICHED CSS === */

        /* Fade-in staggered animation */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-section {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.7s ease forwards;
        }
        .animate-d1 { animation-delay: 0.05s; }
        .animate-d2 { animation-delay: 0.12s; }
        .animate-d3 { animation-delay: 0.19s; }
        .animate-d4 { animation-delay: 0.26s; }
        .animate-d5 { animation-delay: 0.33s; }
        .animate-d6 { animation-delay: 0.40s; }
        .animate-d7 { animation-delay: 0.47s; }

        /* Scientific Classification card */
        .classify-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
            margin-top: 0.5rem;
        }
        .classify-item {
            background: rgba(0,0,0,0.18);
            border-radius: var(--border-radius-md);
            padding: 1rem 1.2rem;
        }
        .classify-item .clabel {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 0.3rem;
        }
        .classify-item .cvalue {
            font-family: var(--font-heading);
            font-size: 1.05rem;
            color: var(--text-primary);
        }
        .related-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.6rem;
        }
        .related-tag {
            padding: 0.25rem 0.9rem;
            border-radius: 2rem;
            font-size: 0.78rem;
            background: rgba(0,160,220,0.12);
            color: var(--accent-ocean);
            border: 1px solid rgba(0,160,220,0.25);
        }

        /* Climate Factors */
        .climate-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.7rem;
            list-style: none;
            padding: 0;
        }
        .climate-list li {
            padding: 0.6rem 1rem;
            background: rgba(0,0,0,0.16);
            border-radius: var(--border-radius-md);
            color: var(--text-secondary);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .climate-list li::before { content: '🌍'; font-size: 0.9rem; }

        /* Measurement & Detection */
        .measure-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
        }
        .measure-item {
            background: rgba(0,0,0,0.16);
            border-radius: var(--border-radius-md);
            padding: 0.9rem 1.1rem;
        }
        .measure-item .mtitle {
            font-size: 0.72rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .measure-item .mbody {
            font-size: 0.92rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        /* Timeline */
        .timeline-list {
            list-style: none;
            padding: 0;
            position: relative;
        }
        .timeline-list::before {
            content: '';
            position: absolute;
            left: 14px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: rgba(0,160,220,0.3);
        }
        .timeline-list li {
            padding: 0.6rem 0 0.6rem 2.5rem;
            position: relative;
            color: var(--text-secondary);
            font-size: 0.92rem;
        }
        .timeline-list li::before {
            content: '';
            position: absolute;
            left: 7px;
            top: 1rem;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent-ocean);
            box-shadow: 0 0 10px var(--accent-glow-ocean);
        }
        .timeline-list li .tdate {
            font-size: 0.7rem;
            color: var(--accent-ocean);
            font-family: var(--font-mono);
            display: block;
        }

        /* Photo Gallery */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.8rem;
            margin-top: 0.5rem;
        }
        .gallery-item {
            border-radius: var(--border-radius-md);
            overflow: hidden;
            aspect-ratio: 4/3;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.25,0.8,0.25,1.2), box-shadow 0.4s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .gallery-item:hover {
            transform: scale(1.08);
            box-shadow: 0 12px 35px rgba(0,0,0,0.7);
            z-index: 5;
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Did You Know box */
        .did-you-know {
            background: linear-gradient(135deg, rgba(0,160,220,0.07), rgba(0,160,220,0.02));
            border: 1px solid var(--glass-border);
            border-left: 4px solid var(--accent-lightning);
            border-radius: var(--border-radius-xl);
            padding: 1.8rem 2rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow-card);
            position: relative;
        }
        .did-you-know .dyk-icon {
            font-size: 2.5rem;
            position: absolute;
            top: -1.2rem;
            left: 1.5rem;
            background: var(--bg-deep);
            padding: 0 0.5rem;
        }
        .did-you-know h2 {
            font-family: var(--font-heading);
            color: var(--accent-lightning);
            margin-bottom: 1rem;
            font-size: 1.4rem;
            margin-top: 0.3rem;
        }
        .did-you-know .fact-item {
            padding: 0.55rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            color: var(--text-secondary);
            font-size: 0.92rem;
            line-height: 1.6;
        }
        .did-you-know .fact-item:last-child { border-bottom: none; }
        .did-you-know .fact-item .fact-num {
            color: var(--accent-lightning);
            font-weight: 700;
            margin-right: 0.5rem;
        }

        /* Simulator Canvas */
        .simulator-container {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius-xl);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow-card);
            text-align: center;
        }
        .simulator-container h2 {
            font-family: var(--font-heading);
            color: var(--accent-ocean);
            margin-bottom: 0.8rem;
            font-size: 1.4rem;
            border-bottom: 2px solid rgba(0,160,220,0.2);
            padding-bottom: 0.5rem;
        }
        .simulator-container canvas {
            border-radius: var(--border-radius-md);
            background: rgba(0,0,0,0.35);
            max-width: 100%;
        }
        .simulator-container .sim-caption {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        @media (max-width: 768px) {
            .chart-row { grid-template-columns: 1fr; }
            .hero-banner { height: 250px; }
            .hero-banner h1 { font-size: 2rem; }
            .gallery-grid { grid-template-columns: repeat(2, 1fr); }
            .classify-grid, .climate-list, .measure-grid { grid-template-columns: 1fr; }
        }
    </style>

                    p.hue = type === 'volcano' ? 10 + Math.random() * 30 : 180 + Math.random() * 40;

                    p.hue = 195 + Math.random() * 40;
                } else if (type === 'lightning') {
                    p.x = w / 2 + (Math.random() - 0.5) * w;
                    p.y = Math.random() * h * 0.6;
                    p.vx = (Math.random() - 0.5) * 12;
                    p.vy = Math.random() * 8;
                    p.size = Math.random() * 2 + 0.8;
                    p.hue = 50 + Math.random() * 20;
                    p.alpha = 0.9;
                } else if (type === 'sandstorm' || type === 'blizzard' || type === 'hailstorm') {
                    p.x = Math.random() * w;
                    p.y = Math.random() * h * 0.4;
                    p.vx = (Math.random() - 0.5) * 8 + 2;
                    p.vy = Math.random() * 3 + 1;
                    p.size = Math.random() * 3 + 1;
                    p.hue = type === 'sandstorm' ? 35 + Math.random() * 20 : type === 'blizzard' ? 210 : 200;
                } else if (type === 'bioluminescence') {
                    p.x = Math.random() * w;
                    p.y = Math.random() * h;
                    p.vx = (Math.random() - 0.5) * 0.3;
                    p.vy = (Math.random() - 0.5) * 0.3 - 0.1;
                    p.size = Math.random() * 3 + 2;
                    p.hue = 160 + Math.random() * 40;
                    p.alpha = Math.random() * 0.6 + 0.3;
                } else if (type === 'rainbow' || type === 'halo' || type === 'glory') {
                    p.x = w / 2 + Math.cos(Math.random() * Math.PI * 2) * (w * 0.25);
                    p.y = h / 2 + Math.sin(Math.random() * Math.PI * 2) * (h * 0.35);
                    p.vx = (Math.random() - 0.5) * 0.4;
                    p.vy = (Math.random() - 0.5) * 0.4;
                    p.size = Math.random() * 2.5 + 1;
                    p.hue = Math.random() * 360;
                    p.alpha = 0.6;
                } else if (type === 'mirage' || type === 'sunpillar') {
                    p.x = Math.random() * w;
                    p.y = h * 0.5 + Math.random() * h * 0.2;
                    p.vx = (Math.random() - 0.5) * 1.5;
                    p.vy = (Math.random() - 0.5) * 0.3;
                    p.size = Math.random() * 2 + 1;
                    p.hue = type === 'sunpillar' ? 30 + Math.random() * 25 : 40;
                    p.alpha = 0.4;
                } else if (type === 'maelstrom') {
                    const angle = Math.random() * Math.PI * 2;
                    const radius = 20 + Math.random() * 100;
                    p.x = w / 2 + Math.cos(angle) * radius;
                    p.y = h / 2 + Math.sin(angle) * radius;
                    p.vx = 0; p.vy = 0;
                    p.size = Math.random() * 3 + 1;
                    p.hue = 190 + Math.random() * 50;
                    p.angle = angle; p.radius = radius;
                } else {
                    p.x = Math.random() * w;
                    p.y = Math.random() * h;
                    p.vx = (Math.random() - 0.5) * 2;
                    p.vy = (Math.random() - 0.5) * 2;
                    p.size = Math.random() * 2 + 1;
                    p.hue = 200;
                }
                return p;
            }

            for (let i = 0; i < maxP; i++) particles.push(createParticle());

            function draw() {
                ctx.clearRect(0, 0, w, h);

                // Background effects per type
                if (type === 'tsunami' || type === 'rogue_wave' || type === 'storm_surge') {
                    ctx.strokeStyle = 'rgba(0,153,204,0.4)';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    const time = Date.now() / 3000;
                    for (let x = 0; x < w; x += 3) {
                        const y = h / 2 + 35 * Math.sin(x / w * Math.PI * 3 + time * 8);
                        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                    }
                    ctx.stroke();
                }
                if (type === 'rainbow' || type === 'halo' || type === 'glory') {
                    const grad = ctx.createRadialGradient(w/2, h/2, 40, w/2, h/2, 140);
                    ['#ff0000','#ff8800','#ffff00','#00cc00','#0066ff','#4b0082','#9900cc'].forEach((c, i) => {
                        grad.addColorStop(i/6, c.replace(')', ',0.08)').replace('rgb', 'rgba'));
                    });
                    ctx.fillStyle = grad;
                    ctx.beginPath(); ctx.arc(w/2, h/2, 140, 0, Math.PI*2); ctx.fill();
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.life -= 0.002;
                    if (p.life <= 0) { particles[i] = createParticle(); particles[i].life = 1; continue; }

                    if (type === 'tornado' || type === 'hurricane' || type === 'waterspout' || type === 'fire_whirl') {
                        const cx = w / 2;
                        const dx = p.x - cx;
                        const swirl = Math.sin(p.y / 40 + Date.now() / 800) * 2.5;
                        p.x += swirl - dx * 0.008 + p.vx * 0.3;
                        p.y += p.vy * (1 - p.y / h * 0.5);
                        p.vy += 0.02;
                        if (p.y < 0) p.y = h;
                        if (p.y > h) { p.y = h - 2; p.vy = -(Math.random() * 3 + 1); p.x = cx + (Math.random() - 0.5) * 60; }
                    } else if (type === 'maelstrom') {
                        p.angle += 0.03 + (1 - p.radius / 120) * 0.05;
                        p.radius -= 0.15;
                        if (p.radius < 5) p.radius = 110;
                        p.x = w / 2 + Math.cos(p.angle) * p.radius;
                        p.y = h / 2 + Math.sin(p.angle) * p.radius * 0.6;
                    } else if (type === 'earthquake' || type === 'landslide' || type === 'sinkhole') {
                        const shake = Math.sin(Date.now() / 50) * 4;
                        p.x += p.vx + shake * (Math.random() - 0.5);
                        p.y += p.vy;
                        if (p.x < 0 || p.x > w || p.y < 0 || p.y > h) {
                            p.x = Math.random() * w; p.y = h / 2 + (Math.random() - 0.5) * 30; p.life = 1;
                        }
                    } else {
                        p.x += p.vx;
                        p.y += p.vy;
                        if (type === 'aurora') { p.x += Math.sin(p.y / 60 + Date.now() / 2000) * 0.6; }
                        if (type === 'volcano' || type === 'geyser') { p.vy -= 0.03; if (p.y < 0) p.life = 0; }
                    }

                    if (p.x < 0) p.x = w; if (p.x > w) p.x = 0;
                    if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;

                    ctx.beginPath();
                    if (type === 'bioluminescence') {
                        const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 2.5);
                        glow.addColorStop(0, `hsla(${p.hue},80%,70%,${p.alpha * p.life})`);
                        glow.addColorStop(1, 'transparent');
                        ctx.fillStyle = glow;
                        ctx.arc(p.x, p.y, p.size * 2.5, 0, Math.PI * 2);
                    } else {
                        ctx.fillStyle = `hsla(${p.hue},70%,55%,${p.alpha * p.life})`;
                        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                    }
                    ctx.fill();
                }
                requestAnimationFrame(draw);
            }
            draw();
        }

        // Color-code info cards based on phenomenon type
        document.querySelectorAll('.info-card').forEach(card => {
            if (card.classList.contains('type-weather')) card.style.setProperty('--card-glow', 'rgba(232,121,62,0.35)');
            if (card.classList.contains('type-geology')) card.style.setProperty('--card-glow', 'rgba(224,85,61,0.35)');
            if (card.classList.contains('type-ocean')) card.style.setProperty('--card-glow', 'rgba(56,189,248,0.35)');
            if (card.classList.contains('type-optical')) card.style.setProperty('--card-glow', 'rgba(192,132,252,0.35)');
        });

        console.log('📖 详情页已加载 - ' + data.name + ' [' + data.type + ']');
    </script>
</body>
</html>
