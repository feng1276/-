<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时间轴 · Nature Atlas</title>
    <style>
        :root {
            --bg-deep: #0a0e14;
            --bg-card: rgba(17, 22, 29, 0.82);
            --glass-bg: rgba(10, 14, 20, 0.7);
            --glass-border: rgba(0, 160, 220, 0.18);
            --accent-ocean: #0099cc;
            --accent-storm: #e8793e;
            --accent-magma: #e0553d;
            --accent-aurora: #4ecb71;
            --accent-gold: #f0c040;
            --text-primary: #e2e6ea;
            --text-secondary: #a8b4c0;
            --text-muted: #6b7885;
            --border-radius-xl: 1.8rem;
            --shadow-card: 0 8px 35px rgba(0, 0, 0, 0.55);
            --font-body: 'Source Sans 3', sans-serif;
            --font-heading: 'Playfair Display', serif;
            --font-mono: 'JetBrains Mono', monospace;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: var(--font-body);
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 4rem;
        }
        .navbar {
            position: sticky; top:10px; margin:10px 20px; padding:0.7rem 1.8rem;
            display:flex; align-items:center; justify-content:space-between;
            background: var(--glass-bg); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 3rem;
            z-index: 100; flex-wrap:wrap; gap:1rem;
        }
        .logo { font-family: var(--font-heading); font-size:1.3rem; font-weight:700; cursor:pointer; }
        .logo .nat { color: var(--accent-ocean); }
        .nav-links { display:flex; gap:1rem; list-style:none; flex-wrap:wrap; }
        .nav-links a {
            color: var(--text-secondary); text-decoration:none; font-size:0.8rem; transition:0.2s;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--accent-ocean); }
        .page-header { text-align:center; padding:3rem 1rem 1.5rem; }
        .page-header h1 { font-family: var(--font-heading); font-size:2.5rem; }
        .container { max-width:900px; margin:0 auto; padding:0 1.5rem; }

        /* Stats Bar */
        .stats-bar {
            display:flex; justify-content:center; gap:1.5rem; flex-wrap:wrap;
            margin:1.5rem 0 2rem;
        }
        .stat-card {
            background: var(--bg-card); border:1px solid var(--glass-border);
            border-radius:1.2rem; padding:1rem 1.5rem; text-align:center;
            box-shadow: var(--shadow-card); min-width:130px;
        }
        .stat-card .stat-num {
            font-family: var(--font-heading); font-size:2rem; font-weight:700; color: var(--accent-ocean);
        }
        .stat-card .stat-num.deadly { color: var(--accent-magma); }
        .stat-card .stat-label { font-size:0.7rem; color: var(--text-muted); margin-top:0.2rem; text-transform:uppercase; }

        /* Era Filters */
        .era-filters {
            display:flex; justify-content:center; gap:0.6rem; flex-wrap:wrap; margin-bottom:2rem;
        }
        .era-btn {
            padding:0.5rem 1.2rem; border-radius:3rem; border:1px solid var(--glass-border);
            background: var(--bg-card); color: var(--text-secondary); font-family: var(--font-body);
            font-size:0.8rem; cursor:pointer; transition:0.3s;
        }
        .era-btn:hover, .era-btn.active { border-color: var(--accent-ocean); color: var(--accent-ocean); background: rgba(0,153,204,0.1); }
        .era-btn.active { box-shadow: 0 0 15px rgba(0,153,204,0.25); }

        /* SVG Timeline Track */
        .svg-track-wrap {
            position:relative; margin:1.5rem 0 2rem;
            background: var(--bg-card); border:1px solid var(--glass-border);
            border-radius: var(--border-radius-xl); overflow:hidden;
            box-shadow: var(--shadow-card); padding:0.5rem;
        }
        .svg-track-wrap svg { display:block; width:100%; height:auto; }

        /* Scroll-to-year navigation */
        .year-nav {
            display:flex; align-items:center; justify-content:center; gap:0.8rem; margin-bottom:1.5rem;
            flex-wrap:wrap;
        }
        .year-nav select {
            padding:0.5rem 1rem; border-radius:3rem; background:var(--bg-card);
            border:1px solid var(--glass-border); color:var(--text-primary);
            font-family:var(--font-body); font-size:0.85rem; cursor:pointer;
        }
        .year-nav button {
            padding:0.5rem 1.2rem; border-radius:3rem; background:var(--accent-ocean);
            border:none; color:#fff; font-family:var(--font-body); font-size:0.85rem; cursor:pointer; transition:0.3s;
        }
        .year-nav button:hover { background:#00b3e6; box-shadow:0 0 20px rgba(0,160,220,0.5); }

        /* Timeline Vertical */
        .timeline-v {
            position:relative; padding-left:3rem;
        }
        .timeline-v::before {
            content:''; position:absolute; left:1.2rem; top:0; bottom:0;
            width:3px; background: linear-gradient(180deg, var(--accent-ocean), var(--accent-storm), var(--accent-magma), var(--accent-aurora));
            border-radius:2px;
        }
        .tl-entry {
            position:relative; margin-bottom:2.5rem; padding-left:2rem; cursor:pointer; transition:0.3s;
        }
        .tl-entry:hover { transform:translateX(6px); }
        .tl-entry::before {
            content:''; position:absolute; left:-1.95rem; top:0.4rem;
            width:14px; height:14px; background: var(--bg-deep);
            border:3px solid var(--accent-ocean); border-radius:50%;
            z-index:2; box-shadow:0 0 15px rgba(0,160,220,0.5);
            transition:0.3s;
        }
        .tl-entry.era-ancient::before { border-color: var(--accent-gold); box-shadow:0 0 15px rgba(240,192,64,0.5); }
        .tl-entry.era-1800s::before { border-color: var(--accent-aurora); box-shadow:0 0 15px rgba(78,203,113,0.5); }
        .tl-entry.era-1900::before { border-color: var(--accent-ocean); box-shadow:0 0 15px rgba(0,153,204,0.5); }
        .tl-entry.era-1950::before { border-color: var(--accent-storm); box-shadow:0 0 15px rgba(232,121,62,0.5); }
        .tl-entry.era-2000::before { border-color: var(--accent-magma); box-shadow:0 0 15px rgba(224,85,61,0.5); }

        .tl-entry .tl-year {
            font-family: var(--font-heading); font-size:1.8rem; font-weight:700; color:var(--accent-ocean);
        }
        .tl-entry.era-ancient .tl-year { color: var(--accent-gold); }
        .tl-entry.era-1800s .tl-year { color: var(--accent-aurora); }
        .tl-entry.era-1900 .tl-year { color: var(--accent-ocean); }
        .tl-entry.era-1950 .tl-year { color: var(--accent-storm); }
        .tl-entry.era-2000 .tl-year { color: var(--accent-magma); }

        .tl-entry .tl-title { font-family: var(--font-heading); font-size:1.2rem; }
        .tl-entry .tl-desc { color:var(--text-secondary); font-size:0.9rem; margin-top:0.3rem; }

        /* Deadliest marker */
        .deadliest-badge {
            display:inline-block; background:var(--accent-magma); color:#fff;
            font-size:0.6rem; padding:0.15rem 0.5rem; border-radius:2rem;
            font-weight:700; letter-spacing:0.05em; margin-left:0.5rem;
            animation: deadlyPulse 2s ease-in-out infinite;
        }
        @keyframes deadlyPulse {
            0%,100% { box-shadow:0 0 4px rgba(224,85,61,0.4); }
            50% { box-shadow:0 0 14px rgba(224,85,61,0.9); }
        }

        /* Major event pulse */
        .tl-entry.major::before {
            animation: tlPulse 1.8s ease-in-out infinite;
        }
        @keyframes tlPulse {
            0%,100% { transform:scale(1); box-shadow:0 0 15px rgba(0,160,220,0.5); }
            50% { transform:scale(1.5); box-shadow:0 0 30px rgba(0,160,220,0.8); }
        }

        /* Death toll styling */
        .tl-entry .tl-deaths {
            font-family: var(--font-mono); font-size:0.75rem; color: var(--accent-magma);
            margin-top:0.2rem;
        }

        /* Location tag */
        .tl-entry .tl-location {
            font-size:0.7rem; color: var(--text-muted);
        }

        @media (max-width:600px) {
            .timeline-v { padding-left:2rem; }
            .stats-bar { gap:0.8rem; }
            .stat-card { min-width:100px; padding:0.8rem 1rem; }
            .stat-card .stat-num { font-size:1.5rem; }
        }
    </style>

            { year:'2019-2020', yearNum:2020, type:'野火', title:'澳大利亚丛林大火', location:'澳大利亚', desc:'史无前例的丛林大火季，烧毁超1800万公顷土地，约10亿动物死亡。', deaths:34, era:'2000', major:true },
            { year:'2020年', yearNum:2020, type:'飓风/疫情', title:'大西洋飓风季爆发', location:'大西洋/加勒比', desc:'有记录以来最活跃大西洋飓风季，共30场命名风暴，叠加新冠疫情。', deaths:400, era:'2000', major:false },
            { year:'2021年', yearNum:2021, type:'热浪', title:'太平洋西北热穹', location:'美国/加拿大西部', desc:'前所未有的极端热浪袭击太平洋西北，加拿大创下49.6°C最高温记录，数百人死亡。', deaths:1400, era:'2000', major:true },
            { year:'2022年', yearNum:2022, type:'火山', title:'洪加汤加火山喷发', location:'南太平洋汤加', desc:'南太平洋海底火山剧烈喷发，引发跨太平洋海啸，火山灰柱高57公里。', deaths:6, era:'2000', major:true },
            { year:'2023年', yearNum:2023, type:'地震', title:'土耳其-叙利亚大地震', location:'土耳其/叙利亚', desc:'7.8级双震重创土耳其南部和叙利亚北部，约5.9万人死亡，为本世纪最致命地震之一。', deaths:59000, era:'2000', major:true },
            { year:'2023年', yearNum:2023, type:'热浪', title:'全球极端高温', location:'全球', desc:'全球多地创下历史最高气温记录，7月成为有记录以来最热月份。', deaths:0, era:'2000', major:false },
            { year:'2024年', yearNum:2024, type:'洪水', title:'欧洲中部大洪水', location:'中欧', desc:'暴雨引发中欧多地灾难性洪水，多瑙河等流域创历史水位记录。', deaths:25, era:'2000', major:false },
        ];

        // ============ ERA MAPPING ============
        function getEraClass(era) {
            const map = { 'ancient':'era-ancient', '1800s':'era-1800s', '1900':'era-1900', '1950':'era-1950', '2000':'era-2000' };
            return map[era] || '';
        }

        // ============ STATISTICS ============
        const totalEvents = timelineEvents.length;

        // Deadliest decade
        const decadeMap = {};
        timelineEvents.forEach(e => {
            const decade = Math.floor(e.yearNum / 10) * 10;
            if (!decadeMap[decade]) decadeMap[decade] = 0;
            decadeMap[decade] += (e.deaths || 0);
        });
        let deadliestDecade = '';
        let maxDeaths = 0;
        for (const [dec, d] of Object.entries(decadeMap)) {
            if (d > maxDeaths) { maxDeaths = d; deadliestDecade = dec + '年代'; }
        }

        // Most common type
        const typeCount = {};
        timelineEvents.forEach(e => {
            const t = e.type.split('/')[0];
            typeCount[t] = (typeCount[t] || 0) + 1;
        });
        let mostCommonType = '';
        let maxType = 0;
        for (const [t, c] of Object.entries(typeCount)) {
            if (c > maxType) { maxType = c; mostCommonType = t; }
        }

        // Total deaths
        const totalDeaths = timelineEvents.reduce((sum, e) => sum + (e.deaths || 0), 0);
        function fmtNum(n) {
            if (n >= 1000000) return (n/1000000).toFixed(1)+'M';
            if (n >= 1000) return (n/1000).toFixed(0)+'K';
            return n.toString();
        }

        document.getElementById('statsBar').innerHTML = `
            <div class="stat-card"><div class="stat-num">${totalEvents}</div><div class="stat-label">记录事件</div></div>
            <div class="stat-card"><div class="stat-num deadly">${fmtNum(totalDeaths)}</div><div class="stat-label">累计死亡</div></div>
            <div class="stat-card"><div class="stat-num">${deadliestDecade}</div><div class="stat-label">最致命年代</div></div>
            <div class="stat-card"><div class="stat-num">${mostCommonType}</div><div class="stat-label">最常见类型</div></div>
            <div class="stat-card"><div class="stat-num">${timelineEvents.filter(e=>e.deadliest).length}</div><div class="stat-label">★ 最致命事件</div></div>
        `;

        // ============ YEAR SELECT ============
        const yearSelect = document.getElementById('yearSelect');
        const uniqueYears = [...new Set(timelineEvents.map(e => e.yearNum))].sort((a,b) => a - b);
        yearSelect.innerHTML += uniqueYears.map(y => `<option value="${y}">${y}年</option>`).join('');

        function scrollToYear() {
            const selYear = parseInt(yearSelect.value);
            if (!selYear) return;
            const entry = document.querySelector(`.tl-entry[data-year="${selYear}"]`);
            if (entry) {
                entry.scrollIntoView({ behavior:'smooth', block:'center' });
                entry.style.transform = 'translateX(10px)';
                setTimeout(() => entry.style.transform = '', 800);
            }
        }

        // ============ ERA FILTER ============
        let currentEra = 'all';
        document.querySelectorAll('.era-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.era-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentEra = this.dataset.era;
                renderTimeline();
            });
        });

        // ============ RENDER TIMELINE ============
        function renderTimeline() {
            const filtered = currentEra === 'all' ? timelineEvents : timelineEvents.filter(e => e.era === currentEra);
            document.getElementById('timelineContainer').innerHTML = filtered.map((e, i) => {
                const eraCls = getEraClass(e.era);
                const majorCls = e.major ? ' major' : '';
                return `
                <div class="tl-entry${eraCls}${majorCls}" data-year="${e.yearNum}" data-era="${e.era}"
                     style="animation:fadeIn 0.5s ease ${i*0.03}s both;"
                     onclick="window.location.href='phenomena.html?search=${encodeURIComponent(e.title)}'">
                  <span class="tl-year">${e.year}</span>
                  ${e.deadliest ? '<span class="deadliest-badge">☠ 最致命</span>' : ''}
                  ${e.major && !e.deadliest ? '<span style="font-size:0.65rem;color:var(--accent-gold);margin-left:0.5rem;">★ 重大</span>' : ''}
                  <div class="tl-title">${e.title}</div>
                  <span class="tl-location">📍 ${e.location}</span>
                  <span style="font-size:0.7rem;color:var(--accent-storm);display:block;">${e.type}</span>
                  ${e.deaths > 0 ? `<span class="tl-deaths">☠ ${e.deaths >= 1000000 ? (e.deaths/1000000).toFixed(1)+'M' : e.deaths >= 1000 ? (e.deaths/1000).toFixed(0)+'K' : e.deaths}人死亡</span>` : ''}
                  <p class="tl-desc">${e.desc}</p>
                </div>
              `;
            }).join('');
        }

        const st = document.createElement('style');
        st.textContent = '@keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}';
        document.head.appendChild(st);

        renderTimeline();

        // ============ SVG TIMELINE TRACK ============
        function drawSvgTrack() {
            const svg = document.getElementById('timelineSvg');
            const W = 860, H = 80;
            const padX = 40, trackW = W - padX * 2;

            // Find year range
            const minY = Math.min(...timelineEvents.map(e => e.yearNum));
            const maxY = Math.max(...timelineEvents.map(e => e.yearNum));
            const rangeY = maxY - minY;

            function xForYear(y) { return padX + ((y - minY) / rangeY) * trackW; }

            let html = '';

            // Gradient track
            html += `<defs><linearGradient id="trackGrad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="var(--accent-gold, #f0c040)"/>
                <stop offset="30%" stop-color="var(--accent-aurora, #4ecb71)"/>
                <stop offset="50%" stop-color="var(--accent-ocean, #0099cc)"/>
                <stop offset="75%" stop-color="var(--accent-storm, #e8793e)"/>
                <stop offset="100%" stop-color="var(--accent-magma, #e0553d)"/>
            </linearGradient></defs>`;

            // Track line
            html += `<line x1="${padX}" y1="${H/2}" x2="${W-padX}" y2="${H/2}" stroke="url(#trackGrad)" stroke-width="2" stroke-linecap="round"/>`;

            // Glowing nodes
            timelineEvents.forEach(e => {
                const cx = xForYear(e.yearNum);
                const cy = H/2;
                const r = e.deadliest ? 7 : e.major ? 5 : 3;
                const color = e.deadliest ? '#e0553d' : e.major ? '#f0c040' : (e.era === 'ancient' ? '#f0c040' : e.era === '1800s' ? '#4ecb71' : e.era === '1900' ? '#0099cc' : e.era === '1950' ? '#e8793e' : '#e0553d');
                const glow = e.deadliest || e.major ? ` filter="url(#glow)"` : '';

                // Glow filter
                if (e.deadliest || e.major) {
                    html += `<circle cx="${cx}" cy="${cy}" r="${r+4}" fill="${color}" opacity="0.3">
                        <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite"/>
                        <animate attributeName="r" values="${r+4};${r+7};${r+4}" dur="2s" repeatCount="indefinite"/>
                    </circle>`;
                }

                html += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}" stroke="${color}" stroke-width="1" opacity="0.9">
                    <title>${e.year} - ${e.title}</title>
                </circle>`;

                // Clickable transparent larger circle
                html += `<circle cx="${cx}" cy="${cy}" r="8" fill="transparent" style="cursor:pointer" onclick="document.querySelector('.tl-entry[data-year=\\'${e.yearNum}\\']')?.scrollIntoView({behavior:'smooth',block:'center'})">
                    <title>${e.year} - ${e.title}${e.deaths>0?' ('+e.deaths.toLocaleString()+'人死亡)':''}</title>
                </circle>`;
            });

            // Year labels at bottom
            const labelYears = [minY, Math.round(minY+rangeY*0.25), Math.round(minY+rangeY*0.5), Math.round(minY+rangeY*0.75), maxY];
            labelYears.forEach(y => {
                const lx = xForYear(y);
                if (y === labelYears[0]) {
                    html += `<text x="${lx}" y="${H-8}" text-anchor="start" font-size="9" fill="#6b7885" font-family="'Source Sans 3', sans-serif">${y}</text>`;
                } else if (y === labelYears[labelYears.length-1]) {
                    html += `<text x="${lx}" y="${H-8}" text-anchor="end" font-size="9" fill="#6b7885" font-family="'Source Sans 3', sans-serif">${y}</text>`;
                } else {
                    html += `<text x="${lx}" y="${H-8}" text-anchor="middle" font-size="9" fill="#6b7885" font-family="'Source Sans 3', sans-serif">${y}</text>`;
                }
            });

            svg.innerHTML = html;
        }

        drawSvgTrack();

        // ============ TYPE FILTER SECTION (additional below timeline) ============
        const allTypes = [...new Set(timelineEvents.map(e => e.type.split('/')[0].trim()))];
        const typeFilterHTML = `
            <div style="margin-top:2rem;text-align:center;">
                <span style="font-size:0.75rem;color:var(--text-muted);margin-right:0.8rem;">按类型筛选:</span>
                ${allTypes.map(t => `<button class="type-filter-btn" data-type="${t}" style="padding:0.35rem 0.8rem;border-radius:3rem;border:1px solid var(--glass-border);background:var(--bg-card);color:var(--text-secondary);font-size:0.7rem;cursor:pointer;margin:0.2rem;transition:0.3s;">${t} (${timelineEvents.filter(e=>e.type.split('/')[0].trim()===t).length})</button>`).join('')}
                <button class="type-filter-btn active" data-type="all" style="padding:0.35rem 0.8rem;border-radius:3rem;border:1px solid var(--accent-ocean);background:rgba(0,153,204,0.15);color:var(--accent-ocean);font-size:0.7rem;cursor:pointer;margin:0.2rem;">全部</button>
            </div>
        `;
        const typeFilterWrap = document.createElement('div');
        typeFilterWrap.innerHTML = typeFilterHTML;
        document.getElementById('timelineContainer').after(typeFilterWrap);

        let currentType = 'all';
        typeFilterWrap.querySelectorAll('.type-filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                typeFilterWrap.querySelectorAll('.type-filter-btn').forEach(b => {
                    b.style.borderColor = 'var(--glass-border)';
                    b.style.background = 'var(--bg-card)';
                    b.style.color = 'var(--text-secondary)';
                });
                this.style.borderColor = 'var(--accent-ocean)';
                this.style.background = 'rgba(0,153,204,0.15)';
                this.style.color = 'var(--accent-ocean)';
                currentType = this.dataset.type;
                applyAllFilters();
            });
        });

        function applyAllFilters() {
            let filtered = timelineEvents;
            if (currentEra !== 'all') filtered = filtered.filter(e => e.era === currentEra);
            if (currentType !== 'all') filtered = filtered.filter(e => e.type.split('/')[0].trim() === currentType);
            document.getElementById('timelineContainer').innerHTML = filtered.map((e, i) => {
                const eraCls = getEraClass(e.era);
                const majorCls = e.major ? ' major' : '';
                return `
                <div class="tl-entry${eraCls}${majorCls}" data-year="${e.yearNum}" data-era="${e.era}"
                     style="animation:fadeIn 0.5s ease ${i*0.03}s both;"
                     onclick="window.location.href='phenomena.html?search=${encodeURIComponent(e.title)}'">
                  <span class="tl-year">${e.year}</span>
                  ${e.deadliest ? '<span class="deadliest-badge">☠ 最致命</span>' : ''}
                  ${e.major && !e.deadliest ? '<span style="font-size:0.65rem;color:var(--accent-gold);margin-left:0.5rem;">★ 重大</span>' : ''}
                  <div class="tl-title">${e.title}</div>
                  <span class="tl-location">📍 ${e.location}</span>
                  <span style="font-size:0.7rem;color:var(--accent-storm);display:block;">${e.type}</span>
                  ${e.deaths > 0 ? `<span class="tl-deaths">☠ ${e.deaths >= 1000000 ? (e.deaths/1000000).toFixed(1)+'M' : e.deaths >= 1000 ? (e.deaths/1000).toFixed(0)+'K' : e.deaths}人死亡</span>` : ''}
                  <p class="tl-desc">${e.desc}</p>
                </div>
              `;
            }).join('');

            // Update stats for filtered view
            const visEvents = filtered.length;
            const visDeaths = filtered.reduce((sum, e) => sum + (e.deaths || 0), 0);
            document.querySelector('.stat-card:nth-child(1) .stat-num').textContent = visEvents;
            document.querySelector('.stat-card:nth-child(2) .stat-num').textContent = fmtNum(visDeaths) + (visEvents < totalEvents ? '*' : '');
        }

        // Override renderTimeline to use applyAllFilters
        const origRenderTimeline = renderTimeline;
        renderTimeline = function() { applyAllFilters(); };

        console.log('🕰️ 时间轴已加载 · 共'+totalEvents+'个事件 · '+uniqueYears.length+'个年代 · '+allTypes.length+'种类型');
    </script>
</body>
</html>
