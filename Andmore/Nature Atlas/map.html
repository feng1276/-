<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>世界地图 · Nature Atlas</title>
    <style>
        :root {
            --bg-deep: #0a0e14;
            --bg-card: rgba(17, 22, 29, 0.82);
            --glass-bg: rgba(10, 14, 20, 0.7);
            --glass-border: rgba(0, 160, 220, 0.18);
            --accent-ocean: #0099cc;
            --accent-storm: #e8793e;
            --accent-magma: #e0553d;
            --accent-aurora: #4ecb71;
            --accent-glow-ocean: rgba(0, 160, 220, 0.4);
            --text-primary: #e2e6ea;
            --text-secondary: #a8b4c0;
            --text-muted: #6b7885;
            --border-radius-xl: 1.8rem;
            --shadow-card: 0 8px 35px rgba(0, 0, 0, 0.55);
            --transition-smooth: 0.4s ease;
            --font-body: 'Source Sans 3', sans-serif;
            --font-heading: 'Playfair Display', serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: var(--font-body);
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 3rem;
        }
        .navbar {
            position: sticky; top:10px; margin:10px 20px; padding:0.7rem 1.8rem;
            display:flex; align-items:center; justify-content:space-between;
            background: var(--glass-bg); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 3rem;
            z-index: 100; flex-wrap:wrap; gap:1rem;
        }
        .logo { font-family: var(--font-heading); font-size:1.3rem; font-weight:700; cursor:pointer; }
        .logo .nat { color: var(--accent-ocean); }
        .nav-links { display:flex; gap:1rem; list-style:none; flex-wrap:wrap; }
        .nav-links a {
            color: var(--text-secondary); text-decoration:none; font-size:0.8rem; transition:0.2s;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--accent-ocean); }
        .page-header { text-align:center; padding:2.5rem 1rem 1rem; }
        .page-header h1 { font-family: var(--font-heading); font-size:2.5rem; }
        .container { max-width:1300px; margin:0 auto; padding:0 1.5rem; }

        /* Search / Filter */
        .search-bar {
            display:flex; justify-content:center; margin:1.5rem 0 2rem; gap:0.8rem; flex-wrap:wrap;
        }
        .search-bar input {
            padding:0.7rem 1.5rem; border-radius:3rem; background: var(--bg-card);
            border: 1px solid var(--glass-border); color: var(--text-primary);
            font-family: var(--font-body); font-size:0.9rem; width:280px; transition:0.3s;
        }
        .search-bar input:focus { outline:none; border-color: var(--accent-ocean); box-shadow:0 0 15px var(--accent-glow-ocean); }
        .search-bar button {
            padding:0.7rem 1.5rem; border-radius:3rem; background: var(--accent-ocean);
            border:none; color:#fff; font-family: var(--font-body); font-size:0.9rem; cursor:pointer; transition:0.3s;
        }
        .search-bar button:hover { background: #00b3e6; box-shadow:0 0 20px rgba(0,160,220,0.5); }

        /* Canvas Map */
        .canvas-map-wrap {
            position:relative; margin:1rem 0 2rem; background: var(--bg-card);
            border: 1px solid var(--glass-border); border-radius: var(--border-radius-xl);
            overflow:hidden; box-shadow: var(--shadow-card);
        }
        .canvas-legend-toggle {
            position:absolute; top:12px; right:14px; z-index:5;
            background: var(--bg-card); border:1px solid var(--glass-border); border-radius:50%;
            width:34px; height:34px; cursor:pointer; font-size:1.1rem; color:var(--text-primary);
            display:flex; align-items:center; justify-content:center; transition:0.3s;
        }
        .canvas-legend-toggle:hover { border-color: var(--accent-ocean); }
        .canvas-legend-panel {
            position:absolute; top:54px; right:14px; z-index:5;
            background: var(--bg-card); border:1px solid var(--glass-border); border-radius:1rem;
            padding:1rem 1.2rem; font-size:0.75rem; color:var(--text-secondary);
            display:none; backdrop-filter: blur(12px);
        }
        .canvas-legend-panel.open { display:block; }
        .canvas-legend-panel .leg-item { display:flex; align-items:center; gap:0.5rem; margin-bottom:0.5rem; }
        .canvas-legend-panel .leg-dot { width:10px; height:10px; border-radius:50%; }

        /* Region Grid */
        .section-label {
            font-family: var(--font-heading); font-size:1.3rem; margin:2.5rem 0 1rem;
            color: var(--accent-ocean);
        }
        .map-grid {
            display:grid; grid-template-columns:repeat(5,1fr); gap:0.3rem; margin:0.5rem 0 1.5rem;
            background:rgba(30,30,40,0.3); border:1px solid var(--glass-border);
            border-radius:var(--border-radius-xl); overflow:hidden; box-shadow:var(--shadow-card);
        }
        .map-cell {
            background:rgba(17,22,29,0.7); padding:1.2rem 0.8rem; text-align:center; cursor:pointer;
            transition:all var(--transition-smooth); border:1px solid transparent; min-height:110px;
            display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0.3rem;
            position:relative;
        }
        .map-cell:hover {
            background:rgba(0,160,220,0.12); border-color:var(--accent-ocean);
            box-shadow:inset 0 0 40px rgba(0,160,220,0.15); z-index:2; transform:scale(1.04);
        }
        .map-cell .region-icon { font-size:1.8rem; }
        .map-cell .region-name { font-family:var(--font-heading); font-size:0.85rem; font-weight:600; }
        .map-cell .phenom-count { font-size:0.65rem; color:var(--accent-ocean); }

        /* Heat indicator on cells */
        .heat-indicator {
            position:absolute; top:6px; right:8px; display:flex; gap:2px;
        }
        .heat-indicator .heat-bar {
            width:5px; border-radius:2px; transition:0.3s;
        }

        /* Hot dot */
        .hot-dot {
            width:7px; height:7px; background:var(--accent-storm); border-radius:50%;
            box-shadow:0 0 10px rgba(232,121,62,0.7); animation:pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,100% { opacity:1; transform:scale(1); }
            50% { opacity:0.5; transform:scale(2); }
        }

        /* Map pin pulse */
        @keyframes pinPulse {
            0%,100% { r:5; opacity:1; }
            50% { r:10; opacity:0.3; }
        }
        @keyframes heatGlow {
            0%,100% { filter:drop-shadow(0 0 3px rgba(232,121,62,0.6)); }
            50% { filter:drop-shadow(0 0 12px rgba(232,121,62,1)); }
        }

        /* Info panel */
        .info-panel {
            background:var(--bg-card); border:1px solid var(--glass-border);
            border-radius:var(--border-radius-xl); padding:2rem; display:none; box-shadow:var(--shadow-card);
        }
        .info-panel.active { display:block; }
        .info-panel h3 { font-family:var(--font-heading); color:var(--accent-ocean); margin-bottom:1rem; }

        /* Layout: sidebar + main */
        .layout-row {
            display:grid; grid-template-columns:280px 1fr; gap:1.5rem; margin:2rem 0;
        }

        /* Stats sidebar */
        .stats-sidebar {
            background:var(--bg-card); border:1px solid var(--glass-border);
            border-radius:var(--border-radius-xl); padding:1.5rem; box-shadow:var(--shadow-card);
            height:fit-content;
        }
        .stats-sidebar h3 { font-family:var(--font-heading); color:var(--accent-ocean); margin-bottom:1rem; font-size:1.1rem; }
        .stats-sidebar .stat-row {
            display:flex; justify-content:space-between; padding:0.5rem 0;
            border-bottom:1px solid rgba(255,255,255,0.04); font-size:0.85rem; color:var(--text-secondary);
        }
        .stats-sidebar .stat-row .stat-val { color:var(--accent-ocean); font-weight:600; }

        /* Leaderboard */
        .leaderboard {
            background:var(--bg-card); border:1px solid var(--glass-border);
            border-radius:var(--border-radius-xl); padding:1.5rem; box-shadow:var(--shadow-card);
            margin-top:1.5rem;
        }
        .leaderboard h3 { font-family:var(--font-heading); color:var(--accent-storm); margin-bottom:1rem; font-size:1.1rem; }
        .leaderboard .lb-row {
            display:flex; align-items:center; gap:0.8rem; padding:0.45rem 0;
            border-bottom:1px solid rgba(255,255,255,0.04); font-size:0.85rem; color:var(--text-secondary);
            transition:0.3s;
        }
        .leaderboard .lb-row:hover { color:var(--text-primary); }
        .leaderboard .lb-rank {
            width:22px; height:22px; border-radius:50%; display:flex; align-items:center;
            justify-content:center; font-size:0.7rem; font-weight:700;
            background:rgba(0,160,220,0.15); color:var(--accent-ocean);
        }
        .leaderboard .lb-rank.top { background:rgba(232,121,62,0.2); color:var(--accent-storm); }
        .leaderboard .lb-name { flex:1; }
        .leaderboard .lb-score { font-weight:600; color:var(--accent-ocean); }

        /* Region highlight transitions */
        @keyframes regionHighlight {
            0% { border-color:transparent; }
            50% { border-color:var(--accent-ocean); box-shadow:inset 0 0 30px rgba(0,160,220,0.2); }
            100% { border-color:transparent; }
        }

        @media (max-width:992px) {
            .layout-row { grid-template-columns:1fr; }
            .map-grid { grid-template-columns:repeat(3,1fr); }
        }
        @media (max-width:600px) {
            .map-grid { grid-template-columns:repeat(2,1fr); }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="logo"><span class="nat">NATURE</span> ATLAS</div>
        <ul class="nav-links">
            <li><a href="nature_home.html">首页</a></li>
            <li><a href="phenomena.html">现象库</a></li>
            <li><a href="weather.html">极端天气</a></li>
            <li><a href="geology.html">地质现象</a></li>
            <li><a href="ocean.html">海洋现象</a></li>
            <li><a href="optical.html">光学现象</a></li>
            <li><a href="map.html" class="active">世界地图</a></li>
            <li><a href="timeline.html">时间轴</a></li>
            <li><a href="compare.html">数据对比</a></li>
        </ul>
    </nav>

    <div class="page-header">
        <h1>🗺️ 全球自然现象分布</h1>
        <p style="color:var(--text-muted);">点击区域查看当地主要自然现象 · 交互式世界地图</p>
    </div>

    <div class="container">
        <!-- Search Bar -->
        <div class="search-bar">
            <input type="text" id="regionSearch" placeholder="🔍 搜索地区名称..." oninput="filterRegions()">
            <button onclick="resetFilter()">显示全部</button>
        </div>

        <!-- Canvas World Map -->
        <div class="canvas-map-wrap">
            <canvas id="worldCanvas" width="1260" height="550" style="width:100%; height:auto; display:block;"></canvas>
            <button class="canvas-legend-toggle" id="legendToggle" title="图例" onclick="toggleLegend()">ℹ</button>
            <div class="canvas-legend-panel" id="legendPanel">
                <div class="leg-item"><span class="leg-dot" style="background:var(--accent-storm);box-shadow:0 0 6px var(--accent-storm);"></span> 极高密度 (4+)</div>
                <div class="leg-item"><span class="leg-dot" style="background:var(--accent-ocean);box-shadow:0 0 6px var(--accent-ocean);"></span> 高密度 (3)</div>
                <div class="leg-item"><span class="leg-dot" style="background:var(--accent-aurora);box-shadow:0 0 6px rgba(78,203,113,0.6);"></span> 中等密度 (2)</div>
                <div class="leg-item"><span class="leg-dot" style="background:var(--text-muted);"></span> 低密度 (1)</div>
                <div class="leg-item" style="font-size:0.7rem;margin-top:0.5rem;color:var(--text-muted);">图标: ▲火山 ◆地震 ●风暴 ▣洪水 ★极光</div>
            </div>
        </div>

        <!-- Layout: Sidebar + Grid -->
        <div class="layout-row">
            <!-- Sidebar -->
            <div>
                <div class="stats-sidebar" id="statsSidebar">
                    <h3>📈 地区对比统计</h3>
                    <div class="stat-row"><span>总覆盖区域</span><span class="stat-val" id="statTotal">-</span></div>
                    <div class="stat-row"><span>高活跃区域</span><span class="stat-val" id="statHot">-</span></div>
                    <div class="stat-row"><span>现象类型总数</span><span class="stat-val" id="statTypes">-</span></div>
                    <div class="stat-row"><span>火山活跃带</span><span class="stat-val" id="statVolcano">-</span></div>
                    <div class="stat-row"><span>台风/飓风带</span><span class="stat-val" id="statCyclone">-</span></div>
                    <div class="stat-row"><span>地震高发带</span><span class="stat-val" id="statQuake">-</span></div>
                </div>
                <div class="leaderboard" id="leaderboard">
                    <h3>🏆 最活跃地区</h3>
                </div>
            </div>

            <!-- Main content -->
            <div>
                <div class="section-label">🌍 全球区域总览</div>
                <div class="map-grid" id="mapGrid"></div>
                <div class="info-panel" id="infoPanel"></div>
            </div>
        </div>
    </div>

    <script>
        // ============ EXPANDED REGIONS (20+) ============
        const regions = [
            { id:'na', name:'北美', icon:'🌎', lat:40, lng:-100,
              phenomena:['龙卷风(龙卷风走廊)','飓风(东南沿海)','暴风雪(东北部)','火山(阿拉斯加)','热浪(西部)'], hot:true },
            { id:'sa', name:'南美', icon:'🌎', lat:-15, lng:-58,
              phenomena:['火山(安第斯山脉)','地震(智利/秘鲁)','亚马逊洪水','干旱(巴西东北)'], hot:true },
            { id:'eu', name:'欧洲', icon:'🏰', lat:50, lng:10,
              phenomena:['极光(北欧)','风暴(北海)','火山(冰岛)','热浪(南欧)'], hot:false },
            { id:'asia', name:'东亚', icon:'🏯', lat:35, lng:110,
              phenomena:['台风(东亚/东南亚)','地震(日本/印尼)','火山(环太平洋)','沙尘暴(中亚)','洪水(长江流域)'], hot:true },
            { id:'af', name:'非洲', icon:'🌍', lat:5, lng:25,
              phenomena:['沙尘暴(撒哈拉)','干旱(萨赫勒)','火山(东非大裂谷)','洪水(尼日尔)'], hot:false },
            { id:'oc', name:'大洋洲', icon:'🏝️', lat:-25, lng:135,
              phenomena:['热带气旋(澳大利亚北部)','火山(新西兰)','丛林大火','热浪'], hot:false },
            { id:'polar', name:'极地', icon:'❄️', lat:80, lng:0,
              phenomena:['极光','暴风雪','冰架崩塌','永冻层融化'], hot:false },
            { id:'pacific', name:'太平洋', icon:'🌊', lat:-10, lng:-140,
              phenomena:['台风/飓风','海啸','厄尔尼诺现象','火山岛弧','珊瑚白化'], hot:true },
            // === NEW REGIONS ===
            { id:'central_america', name:'中美洲', icon:'🌴', lat:13, lng:-85,
              phenomena:['火山(危地马拉)','飓风(加勒比海)','地震','滑坡'], hot:true },
            { id:'caribbean', name:'加勒比', icon:'🏖️', lat:18, lng:-72,
              phenomena:['飓风','海啸','珊瑚白化','热带风暴'], hot:true },
            { id:'middle_east', name:'中东', icon:'🕌', lat:30, lng:42,
              phenomena:['沙尘暴','干旱','热浪','地震(伊朗)'], hot:false },
            { id:'southeast_asia', name:'东南亚', icon:'🌴', lat:5, lng:110,
              phenomena:['台风','火山(印尼/菲律宾)','地震','海啸','洪水'], hot:true },
            { id:'south_asia', name:'南亚', icon:'🛕', lat:22, lng:78,
              phenomena:['季风洪水','热带气旋(孟加拉湾)','地震(喜马拉雅)','热浪','干旱'], hot:true },
            { id:'east_asia', name:'东北亚', icon:'🏯', lat:38, lng:132,
              phenomena:['地震(日本)','海啸','火山(富士山)','台风','暴风雪(北海道)'], hot:true },
            { id:'central_asia', name:'中亚', icon:'🏔️', lat:42, lng:68,
              phenomena:['沙尘暴','地震','干旱','极端温差'], hot:false },
            { id:'north_africa', name:'北非', icon:'🏜️', lat:28, lng:10,
              phenomena:['沙尘暴(撒哈拉)','干旱','热浪','蝗灾'], hot:false },
            { id:'west_africa', name:'西非', icon:'🌴', lat:10, lng:-5,
              phenomena:['洪水(尼日尔河)','干旱(萨赫勒)','热带风暴','海岸侵蚀'], hot:false },
            { id:'east_africa', name:'东非', icon:'🦒', lat:0, lng:37,
              phenomena:['火山(大裂谷)','干旱','地震','洪水(维多利亚湖)'], hot:true },
            { id:'southern_africa', name:'南部非洲', icon:'🦁', lat:-23, lng:25,
              phenomena:['干旱','热带气旋(莫桑比克)','洪水','热浪'], hot:false },
            { id:'mediterranean', name:'地中海', icon:'🏛️', lat:38, lng:15,
              phenomena:['地震(意大利/希腊)','火山(埃特纳)','热浪','森林火灾','风暴'], hot:true },
            { id:'north_atlantic', name:'北大西洋', icon:'⛵', lat:45, lng:-35,
              phenomena:['飓风','风暴潮','冰山','巨浪'], hot:true },
            { id:'south_pacific', name:'南太平洋', icon:'🏝️', lat:-20, lng:-160,
              phenomena:['热带气旋','海啸','火山(汤加)','珊瑚白化','厄尔尼诺'], hot:true },
            { id:'indian_ocean', name:'印度洋', icon:'🌊', lat:-15, lng:70,
              phenomena:['热带气旋','海啸','季风','珊瑚白化'], hot:true },
            { id:'arctic', name:'北极', icon:'🧊', lat:78, lng:30,
              phenomena:['极光','冰架崩塌','永冻层融化','暴风雪','北极放大效应'], hot:false },
        ];

        // ============ SEARCH / FILTER ============
        function filterRegions() {
            const q = document.getElementById('regionSearch').value.toLowerCase();
            document.querySelectorAll('.map-cell').forEach(cell => {
                const name = cell.dataset.name.toLowerCase();
                cell.style.display = !q || name.includes(q) ? 'flex' : 'none';
            });
        }
        function resetFilter() {
            document.getElementById('regionSearch').value = '';
            document.querySelectorAll('.map-cell').forEach(c => c.style.display = 'flex');
        }

        // ============ RENDER REGION GRID ============
        function getHeatLevel(phenomenaCount) {
            if (phenomenaCount >= 5) return 'very-high';
            if (phenomenaCount >= 4) return 'high';
            if (phenomenaCount >= 3) return 'medium';
            return 'low';
        }
        function getHeatColor(level) {
            return { 'very-high':'var(--accent-storm)', 'high':'var(--accent-ocean)', 'medium':'var(--accent-aurora)', 'low':'var(--text-muted)' }[level];
        }

        document.getElementById('mapGrid').innerHTML = regions.map(r => {
            const heatLvl = getHeatLevel(r.phenomena.length);
            const heatCol = getHeatColor(heatLvl);
            const bars = [1,2,3,4].map(i => {
                const active = i <= Math.min(r.phenomena.length, 4);
                return `<div class="heat-bar" style="height:${4+i*3}px;background:${active?heatCol:'rgba(255,255,255,0.08)'};${active?'box-shadow:0 0 4px '+heatCol:''}"></div>`;
            }).join('');
            return `
            <div class="map-cell" data-id="${r.id}" data-name="${r.name}" data-lat="${r.lat}" data-lng="${r.lng}">
              ${r.hot ? '<span class="hot-dot" style="position:absolute;top:6px;left:8px;"></span>' : ''}
              <div class="heat-indicator">${bars}</div>
              <span class="region-icon">${r.icon}</span>
              <span class="region-name">${r.name}</span>
              <span class="phenom-count">${r.phenomena.length}种现象 · ${heatLvl==='very-high'?'极高密度':heatLvl==='high'?'高密度':heatLvl==='medium'?'中等':'低密度'}</span>
            </div>
          `;
        }).join('');

        // ============ INFO PANEL ============
        const infoPanel = document.getElementById('infoPanel');
        document.querySelectorAll('.map-cell').forEach(cell => {
            cell.addEventListener('click', function() {
                const id = this.dataset.id;
                const region = regions.find(r => r.id === id);
                document.querySelectorAll('.map-cell').forEach(c => c.style.borderColor = 'transparent');
                this.style.borderColor = 'var(--accent-ocean)';
                this.style.animation = 'regionHighlight 1s ease';
                setTimeout(() => this.style.animation = '', 1000);
                infoPanel.classList.add('active');
                infoPanel.innerHTML = `
                  <h3>${region.icon} ${region.name}地区 <span style="font-size:0.7rem;color:var(--text-muted);">(${region.lat>0?region.lat+'°N':(-region.lat)+'°S'}, ${region.lng>0?region.lng+'°E':(-region.lng)+'°W'})</span></h3>
                  <p style="color:var(--text-muted);margin-bottom:1rem;">活跃度: ${region.hot?'<span style="color:var(--accent-storm);">🔴 高活跃</span>':'<span style="color:var(--accent-aurora);">🟢 正常</span>'} · 现象密度: ${getHeatLevel(region.phenomena.length) === 'very-high' ? '极高' : getHeatLevel(region.phenomena.length) === 'high' ? '高' : getHeatLevel(region.phenomena.length) === 'medium' ? '中等' : '低'}</p>
                  <ul style="list-style:none;padding:0;">
                    ${region.phenomena.map(p => `<li style="padding:0.5rem 0;border-bottom:1px solid rgba(255,255,255,0.05);color:var(--text-secondary);">◆ ${p}</li>`).join('')}
                  </ul>
                `;
            });
        });

        // ============ STATS SIDEBAR ============
        const allPhenomTypes = new Set();
        regions.forEach(r => r.phenomena.forEach(p => {
            const t = p.split('(')[0].trim();
            if (t) allPhenomTypes.add(t);
        }));
        const volcanoRegions = regions.filter(r => r.phenomena.some(p => p.includes('火山'))).length;
        const cycloneRegions = regions.filter(r => r.phenomena.some(p => p.includes('台风') || p.includes('飓风') || p.includes('热带气旋') || p.includes('旋风'))).length;
        const quakeRegions = regions.filter(r => r.phenomena.some(p => p.includes('地震'))).length;

        document.getElementById('statTotal').textContent = regions.length;
        document.getElementById('statHot').textContent = regions.filter(r => r.hot).length;
        document.getElementById('statTypes').textContent = allPhenomTypes.size;
        document.getElementById('statVolcano').textContent = volcanoRegions;
        document.getElementById('statCyclone').textContent = cycloneRegions;
        document.getElementById('statQuake').textContent = quakeRegions;

        // ============ LEADERBOARD ============
        const sorted = [...regions].sort((a,b) => b.phenomena.length - a.phenomena.length);
        document.getElementById('leaderboard').innerHTML = `
          <h3>🏆 最活跃地区</h3>
          ${sorted.slice(0,8).map((r,i) => `
            <div class="lb-row">
              <span class="lb-rank ${i<3?'top':''}">${i+1}</span>
              <span>${r.icon}</span>
              <span class="lb-name">${r.name}</span>
              <span class="lb-score">${r.phenomena.length}种</span>
            </div>
          `).join('')}
        `;

        // ============ CANVAS WORLD MAP ============
        function drawWorldMap() {
            const canvas = document.getElementById('worldCanvas');
            const ctx = canvas.getContext('2d');
            const W = canvas.width;
            const H = canvas.height;

            // Background gradient
            const bgGrad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W*0.7);
            bgGrad.addColorStop(0, 'rgba(0,153,204,0.06)');
            bgGrad.addColorStop(1, 'rgba(10,14,20,0.95)');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, W, H);

            // Draw simplified continent outlines
            ctx.strokeStyle = 'rgba(0,153,204,0.15)';
            ctx.lineWidth = 1;
            ctx.fillStyle = 'rgba(0,153,204,0.04)';

            // Helper to convert lat/lng to canvas coords (Equirectangular)
            function proj(lat, lng) {
                const x = ((lng + 180) / 360) * W;
                const y = ((90 - lat) / 180) * H;
                return [x, y];
            }

            // Simplified continent shapes (arrays of [lat, lng])
            const continents = {
                northAmerica: [[70,-168],[68,-140],[60,-140],[50,-125],[40,-124],[30,-115],[25,-110],[20,-105],[15,-90],[10,-80],[8,-77],[15,-88],[20,-96],[25,-97],[30,-90],[35,-76],[40,-74],[45,-67],[50,-55],[60,-60],[65,-70],[70,-130],[70,-168]],
                southAmerica: [[12,-72],[5,-77],[0,-80],[-5,-81],[-10,-76],[-15,-75],[-20,-70],[-23,-68],[-30,-72],[-35,-70],[-40,-72],[-45,-75],[-50,-73],[-55,-68],[-52,-60],[-40,-58],[-30,-50],[-20,-40],[-10,-38],[0,-50],[5,-55],[8,-60],[10,-65],[12,-72]],
                europe: [[70,-20],[65,-15],[60,-5],[55,5],[50,2],[43,-5],[40,-8],[36,-6],[36,0],[38,10],[43,15],[45,20],[43,25],[40,26],[38,34],[40,36],[45,35],[48,28],[50,20],[55,15],[60,15],[63,10],[65,0],[68,-5],[70,-10],[70,-20]],
                africa: [[37,10],[35,-5],[30,-10],[25,-15],[15,-17],[10,-15],[5,-5],[0,10],[-5,12],[-10,13],[-15,12],[-18,12],[-25,15],[-30,17],[-35,20],[-35,25],[-30,32],[-25,35],[-15,40],[-5,42],[5,43],[12,43],[20,38],[25,35],[30,32],[35,30],[37,20],[37,10]],
                asia: [[70,30],[68,40],[65,50],[60,55],[55,60],[50,55],[45,45],[40,50],[35,55],[30,65],[25,70],[20,75],[10,78],[5,80],[0,75],[-5,70],[-8,65],[-5,60],[0,55],[5,50],[8,43],[10,35],[15,30],[20,25],[25,35],[30,40],[35,38],[37,42],[43,40],[45,35],[43,30],[38,25],[35,15],[40,5],[45,-5],[50,0],[55,5],[60,10],[65,15],[68,20],[70,25],[70,30]],
                australia: [[-12,130],[-15,125],[-20,115],[-25,113],[-30,115],[-35,117],[-38,120],[-35,138],[-32,145],[-28,150],[-25,153],[-20,150],[-16,145],[-12,140],[-10,135],[-12,130]],
                antarctica: [[-70,-180],[-70,-120],[-72,-60],[-68,0],[-70,60],[-72,120],[-75,180],[-70,180],[-70,-180]]
            };

            // Draw continent fills
            for (const [name, coords] of Object.entries(continents)) {
                ctx.beginPath();
                const [sx, sy] = proj(coords[0][0], coords[0][1]);
                ctx.moveTo(sx, sy);
                for (let i = 1; i < coords.length; i++) {
                    const [cx, cy] = proj(coords[i][0], coords[i][1]);
                    ctx.lineTo(cx, cy);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }

            // Draw equator line
            ctx.strokeStyle = 'rgba(255,255,255,0.04)';
            ctx.setLineDash([8, 16]);
            ctx.beginPath();
            const [eqX1, eqY] = proj(0, -180);
            const [eqX2] = proj(0, 180);
            ctx.moveTo(eqX1, eqY);
            ctx.lineTo(eqX2, eqY);
            ctx.stroke();
            ctx.setLineDash([]);

            // Draw Tropics
            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            ctx.setLineDash([4, 12]);
            for (const tropicLat of [23.5, -23.5, 66.5, -66.5]) {
                const [tx1, ty] = proj(tropicLat, -180);
                const [tx2] = proj(tropicLat, 180);
                ctx.beginPath();
                ctx.moveTo(tx1, ty);
                ctx.lineTo(tx2, ty);
                ctx.stroke();
            }
            ctx.setLineDash([]);

            // Draw region markers
            regions.forEach(r => {
                const [px, py] = proj(r.lat, r.lng);
                const heatLvl = getHeatLevel(r.phenomena.length);

                // Glow ring
                const glowColors = {
                    'very-high': 'rgba(232,121,62,0.3)',
                    'high': 'rgba(0,153,204,0.3)',
                    'medium': 'rgba(78,203,113,0.3)',
                    'low': 'rgba(107,120,133,0.2)'
                };
                const fillColors = {
                    'very-high': 'rgba(232,121,62,0.8)',
                    'high': 'rgba(0,153,204,0.8)',
                    'medium': 'rgba(78,203,113,0.7)',
                    'low': 'rgba(107,120,133,0.5)'
                };

                // Outer glow ring
                ctx.beginPath();
                ctx.arc(px, py, r.hot ? 14 : 10, 0, Math.PI * 2);
                ctx.fillStyle = glowColors[heatLvl];
                ctx.fill();

                // Solid dot
                ctx.beginPath();
                ctx.arc(px, py, 5, 0, Math.PI * 2);
                ctx.fillStyle = fillColors[heatLvl];
                ctx.fill();

                // Hot regions: pulse ring
                if (r.hot) {
                    ctx.beginPath();
                    ctx.arc(px, py, 8, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(232,121,62,0.4)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }

                // Label
                ctx.fillStyle = '#e2e6ea';
                ctx.font = '11px "Source Sans 3", sans-serif';
                ctx.textAlign = 'center';
                const labelName = r.name.length > 3 ? r.name : r.name;
                ctx.fillText(labelName, px, py - 14);
            });

            // Click handler on canvas
            canvas.onclick = function(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = W / rect.width;
                const scaleY = H / rect.height;
                const mx = (e.clientX - rect.left) * scaleX;
                const my = (e.clientY - rect.top) * scaleY;

                let closest = null;
                let closestDist = Infinity;
                regions.forEach(r => {
                    const [px, py] = proj(r.lat, r.lng);
                    const dist = Math.hypot(mx - px, my - py);
                    if (dist < 30 && dist < closestDist) {
                        closestDist = dist;
                        closest = r;
                    }
                });
                if (closest) {
                    const cell = document.querySelector(`.map-cell[data-id="${closest.id}"]`);
                    if (cell) cell.click();
                }
            };

            canvas.style.cursor = 'pointer';
        }

        function toggleLegend() {
            document.getElementById('legendPanel').classList.toggle('open');
        }

        drawWorldMap();

        // ============ CANVAS TOOLTIP ============
        const canvas = document.getElementById('worldCanvas');
        const tooltipEl = document.createElement('div');
        tooltipEl.id = 'canvasTooltip';
        tooltipEl.style.cssText = 'position:absolute;pointer-events:none;background:var(--bg-card);border:1px solid var(--accent-ocean);border-radius:0.8rem;padding:0.5rem 0.8rem;font-size:0.75rem;color:var(--text-primary);display:none;z-index:10;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,0.6);';
        canvas.parentElement.appendChild(tooltipEl);

        canvas.addEventListener('mousemove', function(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = 1260 / rect.width;
            const scaleY = 550 / rect.height;
            const mx = (e.clientX - rect.left) * scaleX;
            const my = (e.clientY - rect.top) * scaleY;

            let closest = null;
            let closestDist = Infinity;
            regions.forEach(r => {
                const [px, py] = [(r.lng + 180) / 360 * 1260, (90 - r.lat) / 180 * 550];
                const dist = Math.hypot(mx - px, my - py);
                if (dist < 25 && dist < closestDist) { closestDist = dist; closest = r; }
            });
            if (closest) {
                tooltipEl.style.display = 'block';
                tooltipEl.style.left = (e.clientX - canvas.parentElement.getBoundingClientRect().left + 16) + 'px';
                tooltipEl.style.top = (e.clientY - canvas.parentElement.getBoundingClientRect().top - 40) + 'px';
                const heatLvl = getHeatLevel(closest.phenomena.length);
                const heatLabel = heatLvl==='very-high'?'极高密度':heatLvl==='high'?'高密度':heatLvl==='medium'?'中等':'低密度';
                tooltipEl.innerHTML = `${closest.icon} <strong>${closest.name}</strong> · ${closest.phenomena.length}现象 · ${heatLabel}`;
            } else {
                tooltipEl.style.display = 'none';
            }
        });
        canvas.addEventListener('mouseleave', () => { tooltipEl.style.display = 'none'; });

        // Density summary bar
        const densityCounts = { 'very-high':0, 'high':0, 'medium':0, 'low':0 };
        regions.forEach(r => densityCounts[getHeatLevel(r.phenomena.length)]++);
        console.log('🗺️ 世界地图已加载 · 共'+regions.length+'个区域 · 密度分布: 极高'+densityCounts['very-high']+' 高'+densityCounts['high']+' 中'+densityCounts['medium']+' 低'+densityCounts['low']);
    </script>
</body>
</html>
