    <style>
        :root{--space-void:#020510;--space-deep:#060d1f;--space-navy:#0a1830;--space-panel:#081020;--star-white:#e0e8f8;--star-dim:#a0b0d0;--star-muted:#607090;--signal-green:#00ff88;--signal-cyan:#00e5ff;--signal-amber:#ffab00;--signal-red:#ff3d3d;--signal-purple:#b388ff;--alien-blue:#448aff;--text-primary:#d0d8f0;--text-secondary:#8899bb;--border-panel:#1a2a45;--shadow-glow-cyan:0 0 20px rgba(0,229,255,0.2);--radius-xs:3px;--radius-sm:6px;--radius-md:10px;--radius-lg:16px;--font-mono:'Courier New','Consolas','SF Mono','Monaco','Menlo',monospace;--font-display:'Georgia','Noto Serif SC','Songti SC',serif;--font-body:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;}
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:var(--font-body);background:var(--space-void);background-image:radial-gradient(ellipse at 50% 5%,rgba(0,229,255,0.04) 0%,transparent 60%);color:var(--text-primary);min-height:100vh;}

        .top-bar{background:var(--space-deep);border-bottom:1px solid var(--border-panel);padding:0.3rem 1.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:0.7rem;color:var(--star-muted);font-family:var(--font-mono);}
        .navbar{background:rgba(8,16,32,0.94);backdrop-filter:blur(16px);border-bottom:2px solid var(--border-panel);padding:0.7rem 2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;position:sticky;top:0;z-index:100;}
        .logo{display:flex;align-items:center;gap:0.5rem;cursor:pointer;text-decoration:none;}.logo-icon{width:38px;height:38px;background:radial-gradient(circle,var(--signal-cyan),var(--alien-blue));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.2rem;}.logo-text{font-family:var(--font-display);font-size:1.2rem;font-weight:700;color:var(--star-white);}.logo-text .accent{color:var(--signal-cyan);}
        .nav-links{display:flex;gap:1rem;list-style:none;flex-wrap:wrap;}.nav-links a{color:var(--star-dim);text-decoration:none;font-size:0.72rem;font-family:var(--font-mono);transition:all 0.2s;border-bottom:2px solid transparent;}.nav-links a:hover{color:var(--signal-cyan);border-bottom-color:var(--signal-cyan);}.nav-links a.active{color:var(--signal-cyan);border-bottom-color:var(--signal-cyan);font-weight:600;}
        .page-header{text-align:center;padding:2rem 1rem 1rem;}.page-header h1{font-family:var(--font-display);font-size:2.2rem;color:var(--star-white);}
        .container{max-width:900px;margin:0 auto;padding:0 1.5rem;}

        .timeline-v::before{content:'';position:absolute;left:1.4rem;top:0;bottom:0;width:2px;background:linear-gradient(180deg,var(--signal-cyan),var(--signal-purple),var(--signal-amber),var(--signal-red));border-radius:1px;}
        .tl-entry{position:relative;margin-bottom:2.5rem;padding-left:2rem;transition:all 0.3s;}.tl-entry:hover{transform:translateX(8px);}
        .tl-entry::before{content:'';position:absolute;left:-2.25rem;top:0.5rem;width:14px;height:14px;background:var(--space-void);border:3px solid var(--signal-cyan);border-radius:50%;z-index:2;box-shadow:0 0 15px rgba(0,229,255,0.5);}
        .tl-entry.milestone::before{border-color:var(--signal-amber);box-shadow:0 0 15px rgba(255,171,0,0.5);}
        .tl-entry.warning::before{border-color:var(--signal-red);box-shadow:0 0 15px rgba(255,61,61,0.5);}
        .tl-entry .tl-date{font-family:var(--font-mono);font-size:1.1rem;font-weight:700;color:var(--signal-cyan);display:block;margin-bottom:0.2rem;}
        .tl-entry .tl-title{font-family:var(--font-display);font-size:1.15rem;color:var(--star-white);}
        .tl-entry .tl-desc{color:var(--text-secondary);font-size:0.88rem;line-height:1.7;margin-top:0.3rem;}
        .tl-entry .tl-tag{display:inline-block;padding:0.1rem 0.4rem;border-radius:2px;font-size:0.6rem;font-family:var(--font-mono);margin-top:0.3rem;}
        .tag-discovery{background:rgba(0,229,255,0.1);color:var(--signal-cyan);border:1px solid rgba(0,229,255,0.2);}

    <div class="page-header"><h1>🕰️ 接触时间轴</h1><p style="color:var(--star-dim);">CONTACT TIMELINE — 人类与地外文明接触的完整历史记录</p></div>

    <script>
        const timeline=[{date:'2045-03-15',title:'人类首次主动星际广播',type:'discovery',tagText:'发现',tagClass:'tag-discovery',desc:'XENOCOM项目前身——国际SETI联盟向VEGA星系方向发射了第一条主动星际广播。广播使用1.42GHz氢线频率，内容包含二进制编码的数学常数和氢原子能级图。这是人类第一次有意识地尝试与地外文明建立联系。发射功率500千瓦，预计2070年到达VEGA星系。'},{date:'2047-06-12',title:'VEGA-III 首次回复',type:'contact',tagText:'首次接触',tagClass:'tag-contact',desc:'在人类首次广播24个月后，VEGA星系方向接收到明确的人工信号。信号包含警告信息："我们已聆听了370万年。不要广播你们的位置。他们来了。"这是人类历史上确认的第一个地外文明通讯。令人困惑的是，按光速计算信号应需要25年才能到达VEGA星系——但回复仅用了2年。'},{date:'2047-09-01',title:'全球紧急会议',type:'warning',tagText:'紧急',tagClass:'tag-warning',desc:'联合国召开紧急闭门会议，讨论VEGA-III警告的含义。会议持续了72小时，最终决定立即暂停所有主动SETI广播。各国航天机构开始制定《星际通讯安全协议》。黑暗森林假说首次被纳入官方政策讨论。全球范围内的抗议和恐慌持续数周。'},{date:'2047-09-15',title:'全球无线电静默令生效',type:'discovery',tagText:'发现',tagClass:'tag-discovery',desc:'联合国通过第8847号决议：立即停止所有非必要的射电广播。所有国家必须在30天内关闭功率超过100千瓦的非必要射电发射设备。全球射电天文台转向纯被动监听模式。这一决议对全球通信行业造成了巨大冲击。'},{date:'2048-01-23',title:'舒曼共振异常信号',type:'discovery',tagText:'发现',tagClass:'tag-discovery',desc:'地球电离层7.832Hz舒曼共振频率上检测到异常调制信号。初步分析表明信号可能来自近地空间。信号的调制模式与人类脑电波alpha波段高度相关，引发"地球意识场"假说。XENOCOM成立专门小组调查该信号。'},{date:'2048-06-20',title:'信号档案突破100条',type:'discovery',tagText:'发现',tagClass:'tag-discovery',desc:'XENOCOM信号数据库突破100条记录。这些信号来自23个不同的天区，其中37条被确认为智能来源。AI辅助分析系统上线，大幅提升了信号筛选和分类效率。全球7个监测节点实现实时数据共享。'},{date:'2048-08-15',title:'LUYTEN-B信号首次检测',type:'discovery',tagText:'发现',tagClass:'tag-discovery',desc:'监测网络在3.14GHz频率上检测到来自LUYTEN星方向的规律性信号。信号使用了一种前所未见的"四维矩阵"编码结构。初期解码尝试全部失败，直到量子计算团队开发出专门的多维解码算法才取得突破。'},{date:'2048-09-05',title:'开普勒442信标确认',type:'discovery',tagText:'发现',tagClass:'tag-discovery',desc:'检测到来自开普勒442b方向的定向脉冲信号，距离1200光年。分析表明这是银河系尺度的导航信标网络节点。信号持续仅3.7秒，但包含完整的三维星图和质数序列。这是人类确认的第一个III型文明迹象。'},{date:'2048-10-01',title:'XENOCOM安全委员会成立',type:'contact',tagText:'里程碑',tagClass:'tag-contact',desc:'鉴于VEGA-III警告带来的潜在威胁，联合国成立XENOCOM安全委员会，专门负责评估和应对星际接触带来的安全风险。委员会由来自12个国家的科学家、军事专家和政策制定者组成。'},{date:'2048-11-03',title:'地球轨道异常信号确认',type:'warning',tagText:'警报',tagClass:'tag-warning',desc:'地球同步轨道上检测到与舒曼共振同步的生物电信号。信号源距离地球仅3.6万公里，这是人类首次在地球附近发现疑似外星装置的信号。XENOCOM安全委员会将威胁等级提升至Level 2（警戒）。'},{date:'2048-12-20',title:'XENOCOM项目正式启动',type:'contact',tagText:'里程碑',tagClass:'tag-contact',desc:'整合全球资源，XENOCOM星际广播站正式投入运行。项目汇集了来自47个国家的射电天文学家、语言学家、密码学家和人工智能专家。主要目标：监听、分析和分类所有疑似地外文明的信号。年度预算达到120亿美元。'},{date:'2049-01-20',title:'TRAPPIST-1系统文明迹象',type:'discovery',tagText:'发现',tagClass:'tag-discovery',desc:'监测网络在TRAPPIST-1系统方向检测到人工电磁泄漏。进一步分析表明，该系统中至少有三颗行星存在文明活动迹象。这是人类首次发现一个恒星系统中存在多个文明（或一个文明的多个殖民地）。'},{date:'2049-02-14',title:'PROXIMA-C文明确认',type:'discovery',tagText:'发现',tagClass:'tag-discovery',desc:'比邻星C方向的高强度信号被确认为智能来源。该文明距离地球仅4.2光年，是人类已知最近的地外文明。信号强度异常高，暗示他们可能使用了超出I型文明水平的发射技术。'},{date:'2049-03-01',title:'WOLF-1061生物信号解码',type:'discovery',tagText:'发现',tagClass:'tag-discovery',desc:'来自WOLF-1061星的生物节律信号完成初步解码。信号表现出与母星自转周期精确同步的周期性特征，强烈暗示了一个表面居住的生物文明。这是人类首次通过信号特征直接推断外星生物的生理节律。'},{date:'2049-03-05',title:'银河系中心辐射异常增强',type:'warning',tagText:'警报',tagClass:'tag-warning',desc:'来自银心方向的持续宽带辐射强度在过去6个月内增加了23%。这种异常增强无法用已知的天体物理解释。如果这是文明活动，其能量级别暗示着一个远超III型文明的存在。'},{date:'2049-03-10',title:'仙女座星系异常脉冲',type:'warning',tagText:'警报',tagClass:'tag-warning',desc:'监测网络在仙女座星系（M31）方向检测到规律性高能脉冲。周期精确为11.3天，单次脉冲能量估计达10^20焦耳。如此巨大的能量和精确的周期性不太可能是自然现象。这也许是I型文明（星系间文明）的首次证据。'},{date:'2049-03-15',title:'项目Chronos异常',type:'warning',tagText:'异常',tagClass:'tag-warning',desc:'XENOCOM内部实验项目"Chronos"（时间位移研究）发生意外。实验对象X-77在7.832Hz舒曼共振频率暴露后从密封舱中消失。舱内时钟重置至1987年。该事件被列为最高机密，引发了关于外星技术可能涉及时间操控的惊人猜测。'},{date:'2049-03-20',title:'巴纳德星导航信标确认',type:'discovery',tagText:'发现',tagClass:'tag-discovery',desc:'来自巴纳德星（距离地球仅6光年）的规律性1.42GHz信号被确认为智能来源。信号中包含一个持续的时间计数器，以该星的自转周期为单位。XENOCOM分析师普遍认为这是一个自动运行的星际导航信标。这是人类确认的第二个最近的外星文明迹象。'},{date:'2049-03-22',title:'罗斯128信号首次解码',type:'contact',tagText:'里程碑',tagClass:'tag-contact',desc:'来自罗斯128星的4.2GHz信号完成初步解码。信号包含重复的数学序列（π、e、√2、φ），随后是一段目前尚无法解析的符号序列。这是人类首次成功解码来自红矮星系统的信号。罗斯128是一颗极其稳定的恒星，几乎没有耀斑活动，被认为是宜居行星的理想宿主。'},{date:'2049-03-25',title:'旅行者1号异常信号事件',type:'warning',tagText:'警报',tagClass:'tag-warning',desc:'NASA深空网络检测到旅行者1号的信号被未知机制异常增强（+40dB）并反射回地球。回声延迟约37小时，暗示增强源位于日球层顶附近。NASA和XENOCOM已联合成立调查小组。如果太阳系边缘确实存在未知的人工结构，这将彻底改变人类对宇宙孤独性的认知。'},{date:'2049-03-28',title:'全球射电静默一周年',type:'discovery',tagText:'里程碑',tagClass:'tag-discovery',desc:'联合国第8847号决议实施一周年。全球射电发射功率降低了约87%。虽然对通信行业造成了重大经济影响，但静默令成功将地球的射电特征降低了约30dB。XENOCOM安全委员会评估认为，如果黑暗森林法则成立，这一措施将显著降低地球被探测到的概率。'},{date:'2049-04-01',title:'仙女座脉冲首次检测',type:'warning',tagText:'警报',tagClass:'tag-warning',desc:'位于夏威夷的Maunakea监测站在仙女座星系方向检测到规律性高能脉冲。周期精确为11.3天，能量级别远超任何已知自然现象。如果这是III型文明的活动信号，那么该文明存在于254万年前——那时地球上还没有人类。'},{date:'2049-04-05',title:'塔比星射电信号关联确认',type:'discovery',tagText:'发现',tagClass:'tag-discovery',desc:'XENOCOM确认塔比星（KIC 8462852）的异常亮度变化与同步射电信号之间的关联。在亮度下降期间，射电信号强度同步增强。这一发现为"戴森球假说"提供了迄今为止最有力的支持证据。该恒星距离地球1470光年，如果确实存在戴森球结构，建造者可能早已消亡，而结构本身仍在运行。'},{date:'2049-04-10',title:'XENOCOM公民科学家计划启动',type:'contact',tagText:'里程碑',tagClass:'tag-contact',desc:'为应对日益增长的信号数据量，XENOCOM正式推出"公民科学家计划"。全球任何人都可以使用廉价的RTL-SDR设备参与射电信号监测，将数据上传至XENOCOM分布式分析网络。计划上线首周即吸引了超过50万名参与者，覆盖了地球表面约85%的区域。'},{date:'2049-04-15',title:'木卫二舒曼共振信号确认',type:'discovery',tagText:'发现',tagClass:'tag-discovery',desc:'木星探测器团队确认，来自木卫二方向的7.832Hz信号具有生物节律特征。信号强度呈现与该卫星轨道周期相关的波动。如果该信号确实来自木卫二的地下海洋，这将是人类首次在地球以外发现生命活动的电磁证据。NASA已决定加速Europa Clipper任务的射电观测计划。'},{date:'2049-04-20',title:'LUYTEN-B四维语言教材出版',type:'contact',tagText:'里程碑',tagClass:'tag-contact',desc:'XENOCOM语言团队完成了首部LUYTEN-B四维语言的入门教材。教材采用交互式全息投影技术，允许学习者从多个维度同时"阅读"信息。首批100名学员来自全球47个国家的顶尖大学和研究机构。这是人类历史上首次系统地学习一种外星语言。'},{date:'2049-04-25',title:'量子通讯协议突破',type:'contact',tagText:'技术突破',tagClass:'tag-contact',desc:'XENOCOM量子通讯实验室宣布实现了首次跨星际的量子纠缠通讯演示。虽然受制于退相干问题，该技术为未来创建"量子星际互联网"奠定了理论基础。如果能够克服距离限制，量子通讯可以实现真正意义上的即时通讯，不受光速限制。'},{date:'2049-05-01',title:'土星环神秘物体再分析',type:'discovery',tagText:'发现',tagClass:'tag-discovery',desc:'重新分析卡西尼号历史数据发现在土星B环外侧边缘存在一个直径约数公里的物体。物体表面的射电反射特性与周围冰质环差异显著。最可能的解释是这是一个远古文明的遗迹，或者是某种类型的人造结构。这个发现重新点燃了关于太阳系远古文明的讨论。'},{date:'2049-05-05',title:'开普勒-186f水蒸气证据',type:'discovery',tagText:'发现',tagClass:'tag-discovery',desc:'詹姆斯·韦伯太空望远镜的观测数据显示开普勒-186f大气层中存在水蒸气特征。虽然这不能直接证明生命存在，但结合XENOCOM宜居性评估模型给出的0.82分，该行星成为人类寻找"第二地球"的焦点目标。开普勒-186f距离地球约500光年。'},{date:'2049-05-10',title:'太阳系内地外装置搜索启动',type:'discovery',tagText:'任务启动',tagClass:'tag-discovery',desc:'XENOCOM联合多国航天机构启动"太阳系搜索计划"，使用地基射电望远镜阵列对月球背面、火星轨道、小行星带以及木星、土星的多个卫星进行深度扫描。计划在两年内完成对太阳系内所有可能隐藏外星装置地点的全面调查。'},{date:'2049-05-15',title:'火星峡谷神秘回波',type:'warning',tagText:'发现',tagClass:'tag-discovery',desc:'火星水手号峡谷区域检测到规律的地下回波信号。信号频率为7.832Hz，与地球舒曼共振完全一致。回波深度分析显示信号源位于峡谷下方约3公里处。考虑到火星在诺亚纪时期可能存在液态水和稠密大气，科学家猜测这里可能是远古文明的地下避难所。'},{date:'2049-05-20',title:'比邻星b大气层检测到甲烷',type:'discovery',tagText:'发现',tagClass:'tag-discovery',desc:'使用新型光谱仪技术，科学家在比邻星b的大气层中检测到高浓度甲烷。在无生命存在的行星上，甲烷会迅速被紫外光分解。因此，甲烷的存在暗示着两种可能：要么存在产甲烷生命，要么存在地质活动。该发现使比邻星b成为寻找外星生命的首要目标。'},{date:'2049-05-25',title:'月球背面基地谣言调查',type:'warning',tagText:'调查',tagClass:'tag-warning',desc:'针对网络上流传的"月球背面存在外星基地"的说法，XENOCOM宣布将对月球背面进行前所未有的详细测绘。计划发射一系列微型卫星星座，使用穿墙雷达对整个月球背面进行高分辨率扫描。任何直径超过1米的人造结构都将被发现。'},{date:'2049-06-01',title:'三角座星系异常信号',type:'warning',tagText:'警报',tagClass:'tag-warning',desc:'监测网络在三角座星系（M33）方向检测到一组复杂的调制信号。信号持续时间约7.3小时，包含多个频段的叠加。频谱分析显示信号具有极高的时间相干性——这种相干性在自然界中几乎不可能存在。三角座星系距离地球约250万光年，这意味着信号在人类出现之前就已发出。'},{date:'2049-06-05',title:'地球磁场异常波动',type:'warning',tagText:'异常',tagClass:'tag-warning',desc:'全球地磁监测站检测到地球磁场出现前所未有的异常波动。波动模式与7.832Hz舒曼共振频率存在明显的谐波关系。虽然自然现象可以解释部分波动，但某些时段的变化幅度远超理论预测。一些科学家认为这可能是地外文明试图利用地球自身的共振频率进行通讯或探测。'},{date:'2049-06-10',title:'谷神星红外特征异常',type:'discovery',tagText:'发现',tagClass:'tag-discovery',desc:'黎明号探测器历史数据再分析发现谷神星（太阳系最大小行星）Occator撞击坑区域存在异常红外辐射。辐射特征与任何已知矿物都不匹配，但与某些III型文明能量收集装置的理论模型高度吻合。如果确认，这将是人类首次在主带小行星上发现文明活动迹象。'},{date:'2049-06-15',title:'XENOCOM语言学部门扩张',type:'contact',tagText:'里程碑',tagClass:'tag-contact',desc:'随着信号解码工作的深入，XENOCOM宣布将语言学部门规模扩大10倍。新部门将包含47种语言的专家、数学逻辑学家、符号学家、认知科学家和量子计算专家。目标是在未来5年内建立一套完整的"星际语言学框架"，为与地外文明的真正对话做准备。'},{date:'2049-06-20',title:'玉夫座矮星系信号确认',type:'discovery',tagText:'发现',tagClass:'tag-discovery',desc:'位于银河系卫星星系玉夫座矮星系方向检测到规律的X射线脉冲。令人惊讶的是，脉冲模式包含精确的质数序列，这使其几乎肯定是智能来源。玉夫座矮星系是距离银河系中心约7万光年的小型星系，这进一步证明高等文明在宇宙中的分布远比我们想象的广泛。'},{date:'2049-06-25',title:'星际介质量子通讯实验',type:'contact',tagText:'实验',tagClass:'tag-contact',desc:'XENOCOM与欧洲核子研究中心合作开展"星际介质量子通讯"实验。理论上，星际介质可以作为量子纠缠的分发通道，实现跨越数光年的即时通讯。实验使用国际空间站作为中继站，试图在地球和月球背面之间建立量子链路。如果成功，将彻底改变人类与太阳系内潜在文明的通讯方式。'},{date:'2049-07-01',title:'史匹哲望远镜数据泄露事件',type:'warning',tagText:'安全事件',tagClass:'tag-warning',desc:'一名XENOCOM内部人员试图向外界泄露詹姆斯·韦伯太空望远镜的原始观测数据。这些数据可能包含与地外文明相关的敏感信息。XENOCOM安全委员会立即启动应急响应，追溯了数据流向并堵住了安全漏洞。该事件暴露了数据安全方面的重大隐患。'},{date:'2049-07-05',title:'TRAPPIST-1多行星信号协调',type:'discovery',tagText:'发现',tagClass:'tag-discovery',desc:'分析显示TRAPPIST-1系统中的七颗行星中有三颗同时发出信号。更重要的是，这三个信号之间存在精确的时间同步关系，延迟与光在它们之间传播的时间完全一致。这暗示要么这是一个跨越多行星的超级文明，要么行星之间存在某种我们尚不理解物理联系。'},{date:'2049-07-10',title:'太阳黑子与VEGA信号关联',type:'warning',tagText:'发现',tagClass:'tag-discovery',desc:'XENOCOM统计分析发现，太阳黑子活动的11年周期与VEGA-III方向信号的强度变化存在显著相关性。这种相关性在统计学上几乎不可能是巧合。这意味着要么VEGA-III文明能够探测到太阳的内部活动，要么他们通过某种方式在影响太阳的行为。无论哪种可能，都令人不安。'},{date:'2049-07-15',title:'星际信号检索数据库上线',type:'contact',tagText:'里程碑',tagClass:'tag-contact',desc:'XENOCOM宣布向公众开放"星际信号检索数据库"。任何人都可以查询自2045年以来所有检测到的疑似地外信号。数据库包含信号的完整元数据、频谱图、时间序列分析和初步解码尝试。这是人类历史上最大规模的科学数据开放项目之一。'},{date:'2049-07-20',title:'奥陌陌返回预测',type:'discovery',tagText:'预测',tagClass:'tag-discovery',desc:'欧洲南方天文台计算出著名的"奥陌陌"星际访客将在约23年后再次接近太阳。考虑到其异常的非彗星轨道和巨大的长宽比，XENOCOM已经计划在它再次接近时发射探测器进行近距离观测。如果奥陌陌是外星探测器，这将是人类首次直接研究星际飞船。'},{date:'2049-07-25',title:'银河系中心人工信号搜索',type:'warning',tagText:'任务启动',tagClass:'tag-warning',desc:'鉴于银心方向持续增强的辐射，XENOCOM批准了"银河系中心深度搜索计划"。该计划将调动全球最大的射电望远镜，包括中国的FAST和南非的MeerKAT，对银心方向进行为期5年的连续监测。如果辐射确实来自文明，其能量输出将达到II型文明的上限。'},{date:'2049-08-01',title:'木卫二海洋盐度异常',type:'discovery',tagText:'发现',tagClass:'tag-discovery',desc:'木星探测器最新数据显示，木卫二地下海洋的盐度远低于此前估计。这种低盐度环境更接近地球原始海洋，可能是生命诞生的理想条件。更重要的是，木卫二的海洋似乎通过多热液活动保持着稳定的化学能输出，这可以支持生命的存在。'},{date:'2049-08-05',title:'星际分子云中的复杂有机物',type:'discovery',tagText:'发现',tagClass:'tag-discovery',desc:'使用阿塔卡马大型毫米波阵列，科学家在距离地球400光年的星际分子云中检测到复杂的氨基酸前体分子。这些发现表明，生命的原材料在银河系中普遍存在。XENOCOM生物学家认为，这大大提高了宇宙中生命出现的概率。'},{date:'2049-08-10',title:'费米悖论新解答',type:'contact',tagText:'理论',tagClass:'tag-contact',desc:'XENOCOM理论物理学家团队提出了"大过滤器延迟"理论。该理论认为，宇宙中智慧文明普遍存在，但它们会在发展到特定阶段后有意保持沉默，以避免黑暗森林打击。这种"主动沉默"策略可以解释为什么我们至今没有收到明确的文明信号。'},{date:'2049-08-15',title:'VEGA-III信号延迟谜团新解释',type:'discovery',tagText:'研究',tagClass:'tag-discovery',desc:'为了解释VEGA-III信号为何在仅2年内到达地球（而非预期的25年），物理学家提出了"曲速气泡"理论。该理论认为VEGA-III文明可能使用了某种基于时空弯曲的推进技术，使信号在传播过程中"乘坐"了一个时空泡沫，从而大幅缩短了到达时间。'},{date:'2049-08-20',title:'暗物质与文明能源假说',type:'warning',tagText:'理论',tagClass:'tag-warning',desc:'XENOCOM理论团队提出，如果暗物质确实与宇宙常数相关，那么高等文明可能已经学会了直接利用暗物质作为能源。如果这一假说成立，那么III型文明的能量收集范围将远超此前估计，可能包括我们尚未能探测到的暗物质晕。这或许解释了为什么我们看不到银河系中心应该存在的II型文明能量特征。'},{date:'2049-08-25',title:'XENOCOM年度报告发布',type:'contact',tagText:'报告',tagClass:'tag-contact',desc:'XENOCOM发布首份公开年度报告。报告显示，过去一年共检测到147条新的疑似地外信号，累计信号库总数达到312条。其中23条被确认为智能来源，分布在17个不同的恒星系统。报告还首次披露了与多个文明的"接触"细节，包括信号交换和编码结构分析。'},{date:'2049-09-01',title:'人类首个星际广播两周年',type:'contact',tagText:'纪念',tagClass:'tag-contact',desc:'人类首次主动星际广播两周年。XENOCOM在纽约、伦敦、东京、悉尼等城市举办公众开放日，向公众展示过去两年取得的成就和面临的挑战。同日，第二轮主动广播计划"星际广播2.0"进入公众咨询阶段。该计划提议向包括天狼星和巴纳德星在内的多个近距恒星系统发射更强的定向信号。'},{date:'2049-09-05',title:'戴森球建造评估报告',type:'discovery',tagText:'报告',tagClass:'tag-discovery',desc:'XENOCOM工程团队发布首份《戴森球可行性评估报告》。报告详细分析了建造一个完整戴森球所需的技术路径和资源需求。结论是，即使动用整个地球的资源，人类也需要约300年才能完成一个能够收集太阳全部能量输出的戴森球。报告同时指出，更现实的方案是"戴森群"——数千颗独立卫星组成的卫星网络。'},{date:'2049-09-10',title:'开普勒-452b大气层详细分析',type:'discovery',tagText:'发现',tagClass:'tag-discovery',desc:'詹姆斯·韦伯太空望远镜对开普勒-452b（被誉为"地球2.0"）进行了迄今最详细的大气层分析。结果显示该行星大气层中存在水蒸气和氧气，同时检测到可能的植被光谱特征——一种被称为"红边"的现象。如果确认，这将是地球以外存在生命的最直接证据。'},{date:'2049-09-15',title:'XENOCOM教育计划启动',type:'contact',tagText:'教育',tagClass:'tag-contact',desc:'XENOCOM与联合国教科文组织合作推出"星际教育计划"。该计划将在全球10万所中小学引入基础的天体生物学和星际通讯课程。教材由全球顶尖科学家编写，包含互动式模拟软件，让学生可以体验"解码"外星信号的乐趣。'},{date:'2049-09-20',title:'引力波通讯理论突破',type:'contact',tagText:'技术突破',tagClass:'tag-contact',desc:'XENOCOM理论物理学家团队提出了一种基于引力波的全新通讯方式。相比电磁波，引力波可以几乎无衰减地穿越任何物质，且不受量子退相干的影响。虽然当前技术无法产生足够强的引力波信号，但该理论为未来与高等文明的通讯提供了新的方向。'}, {date:'2049-09-25',title:'半人马座α星信号分析',type:'discovery',tagText:'发现',tagClass:'tag-discovery',desc:'对半人马座α星（三体问题的原型）方向的监测取得突破。在这个距离地球最近的恒星系统中，检测到三种不同的信号模式，分别来自三颗恒星的不同距离。这暗示该系统可能存在一个已经适应了三星系统的复杂文明，能够利用三体运动周期的规律进行某种形式的能量收集。'},{date:'2049-10-01',title:'XENOCOM国际合作峰会',type:'contact',tagText:'会议',tagClass:'tag-contact',desc:'来自全球127个国家的代表齐聚日内瓦，参加XENOCOM首届国际合作峰会。会议主题为"人类命运共同体：星际视角"。与会者讨论了在地外文明威胁面前人类团结的可能性，以及如何建立统一的星际防御和通讯策略。峰会通过了《日内瓦星际协议》，为未来可能的国际冲突设定了框架。'},{date:'2049-10-05',title:'VEGA-III沉默原因新假说',type:'warning',tagText:'理论',tagClass:'tag-warning',desc:'XENOCOM理论团队提出VEGA-III永久沉默的新解释：他们可能已经离开了物理宇宙。根据"计算宇宙学"理论，足够先进的文明最终会选择将意识上传到虚拟宇宙中——在那里他们可以创造无限的体验，而不受物理定律的限制。如果VEGA-III真的进入了"后物理"阶段，那么他们对人类的警告可能是他们最后的"物理存在"遗留。'},{date:'2049-10-10',title:'银心方向信号强度破纪录',type:'warning',tagText:'警报',tagClass:'tag-warning',desc:'银心方向的辐射强度在过去一个月内再次飙升了40%，创下历史新高。能量输出估计达到银河系总能量的0.1%——这意味着一个II型文明的巅峰状态，或者一个正在运作的银河级巨型工程。XENOCOM已将威胁评估提升至最高级别。'},{date:'2049-10-15',title:'月球背面射电望远镜启用',type:'contact',tagText:'里程碑',tagClass:'tag-contact',desc:'人类在月球背面建造的首个永久性射电望远镜阵列正式启用。这个名为"寂静之眼"的阵列由48面天线组成，总接收面积相当于一座直径1公里的单镜面望远镜。由于月球背面永远背对地球，不受地球无线电干扰，这是人类有史以来最灵敏的深空监测设备。它的启用将检测范围扩展到了可观测宇宙的边缘。'},{date:'2049-10-20',title:'星际信号标准化命名法发布',type:'contact',tagText:'标准',tagClass:'tag-contact',desc:'XENOCOM与IAU（国际天文学联合会）联合发布首部《星际信号标准化命名法》。新命名法采用"BFS-年份-序列号"格式（如BFS-2049-0047），取代了此前混乱的多种命名系统。命名法还包含了信号类型的标准化定义，以及一套描述信号特征的通用术语。这标志着星际信号学作为一门正式学科的确立。'},{date:'2049-10-25',title:'星际尘埃中的纳米机器',type:'discovery',tagText:'发现',tagClass:'tag-discovery',desc:'分析显示，在地球轨道附近收集的星际尘埃样本中存在着异常复杂的纳米结构。这些结构的尺寸在10-100纳米之间，呈现出高度对称的几何形状——这在自然环境中几乎不可能形成。虽然无法确认这些是外星探测器，但XENOCOM已成立专门小组对这些样本进行深度分析。'},{date:'2049-11-01',title:'引力透镜通讯实验',type:'contact',tagText:'实验',tagClass:'tag-contact',desc:'XENOCOM使用太阳引力透镜效应进行通讯实验。通过将发射器精确对准太阳边缘，信号被太阳引力弯曲并聚焦到远端目标——理论上可以将信号强度放大数十亿倍。实验首次成功将信号传输到距离地球500天文单位的探测器——这是有史以来最远距离的定向通讯。'},{date:'2049-11-05',title:'地球2.0候选者发现',type:'discovery',tagText:'发现',tagClass:'tag-discovery',desc:'开普勒-452b被正式确认为"地球2.0计划"的首要目标。这颗行星不仅位于宜居带，而且其母星的年龄（约60亿年）比太阳更老——这意味着如果该行星上存在生命，他们的文明可能比人类领先数十亿年。XENOCOM已向该方向调整了最大灵敏度的监测设备。'},{date:'2049-11-10',title:'外星文明接触模拟软件发布',type:'contact',tagText:'发布',tagClass:'tag-contact',desc:'XENOCOM向公众发布了一款名为"星际接触模拟器"的教育软件。软件基于真实物理定律和已知的文明样本数据，允许用户模拟与不同类型外星文明的第一次接触。用户可以体验文化差异、沟通障碍、技术差距带来的挑战，以及可能的误解和冲突。软件上线首月下载量即突破1亿次。'},{date:'2049-11-15',title:'暗能量通讯理论',type:'contact',tagText:'理论',tagClass:'tag-contact',desc:'XENOCOM理论物理学家提出了一种革命性的通讯方式：利用暗能量作为通讯媒介。暗能量被认为是驱动宇宙加速膨胀的神秘力量，约占宇宙总能量的68%。如果文明能够操纵暗能量，理论上可以实现跨越任意距离的即时通讯，且不受任何已知的物理限制。这一理论为寻找"丢失的文明信号"提供了新的方向。'},{date:'2049-11-20',title:'地球保护计划第三阶段',type:'warning',tagText:'计划',tagClass:'tag-warning',desc:'XENOCOM安全委员会批准了"地球保护计划"第三阶段方案。该计划包括：在地球轨道部署防御性卫星网络、研发能够屏蔽全球射电信号的"电磁茧"技术、以及建立地下备用指挥中心。批评者指出这些措施可能会引发新的军备竞赛，而支持者则认为在黑暗森林中生存是文明的本能。'},{date:'2049-11-25',title:'星际移民可能性评估',type:'contact',tagText:'报告',tagClass:'tag-contact',desc:'XENOCOM发布首份《星际移民可能性评估报告》。报告分析了人类在面对可能的文明威胁时，向其他恒星系统移民的技术可行性。结论是：即使使用最乐观的技术预测，在未来100年内，人类向太阳系外移民的能力仍然极为有限。报告建议将资源集中在"防御"而非"逃离"上。'},{date:'2049-12-01',title:'三体问题新解法与文明关系',type:'discovery',tagText:'研究',tagClass:'tag-discovery',desc:'数学家发现三体问题存在一种新的稳定解——被称为"谐波锁定轨道"。这种轨道允许三颗恒星在特定条件下保持长期的相对稳定。巧合的是，半人马座α星的实际轨道观测数据与这一新解法高度吻合。这暗示该系统中的任何文明可能早已习惯了三体运动，并发展出了独特的生存策略。'},{date:'2049-12-05',title:'首张银河系文明分布图',type:'contact',tagText:'里程碑',tagClass:'tag-contact',desc:'XENOCOM发布了人类历史上首张银河系文明可能分布图。图上标注了所有已确认的文明位置、可能的文明位置，以及根据"大过滤器"理论计算出的文明稀疏区域。虽然这张图充满了不确定性，但它标志着人类对宇宙文明的认知进入了一个新阶段。地图显示地球位于一个相对"空旷"的区域——这可能是幸存的标志，也可能是灾难前的宁静。'},{date:'2049-12-10',title:'VEGA-III文明追踪计划',type:'warning',tagText:'任务',tagClass:'tag-warning',desc:'尽管VEGA-III已经永久沉默，XENOCOM决定启动一项长期追踪计划。计划将使用分布在整个太阳系的传感器阵列，持续监测VEGA-III可能发出的任何信号——无论是物理宇宙中的电磁波，还是虚拟宇宙中的量子信息。如果VEGA-III真的进入了"后物理"阶段，他们的"数字幽灵"可能仍然存在于我们的宇宙中。'},{date:'2049-12-15',title:'外星生命证据搜寻新方向',type:'discovery',tagText:'发现',tagClass:'tag-discovery',desc:'XENOCOM生物学家提出了一种寻找外星生命的新方法：通过检测大气层中的"工业污染"迹象。氨气、氯氟烃等化合物在自然环境中极为罕见，但却是工业文明的标志。詹姆斯·韦伯太空望远镜已开始对多颗系外行星进行大气层成分分析。如果检测到这些污染物，将是外星文明存在的铁证。'},{date:'2049-12-20',title:'地球文明保护协议通过',type:'contact',tagText:'协议',tagClass:'tag-contact',desc:'联合国大会以压倒性多数通过了《地球文明保护协议》。协议规定：任何国家不得单独向外星文明发送未经授权的信息；所有星际通讯必须通过XENOCOM统一协调；任何疑似外星文明接触事件必须立即向XENOCOM报告。协议还建立了一个国际监督委员会，负责确保条款的执行。这标志着人类在星际事务上走向团结。'},{date:'2049-12-25',title:'卡尔达肖夫文明类型新定义',type:'contact',tagText:'理论',tagClass:'tag-contact',desc:'XENOCOM科学家团队提出了卡尔达肖夫文明类型的新扩展定义。传统定义只考虑能量利用，但新版定义加入了"信息处理能力"和"意识上传技术"两个维度。新定义中，VEGA-III文明被重新分类为"Type II.5"——介于II型和III型之间，但已经掌握了意识上传技术。这解释了为什么他们能够在"警告"后迅速消失在我们的观测范围之外。'},{date:'2049-12-30',title:'XENOCOM年度十大发现',type:'contact',tagText:'总结',tagClass:'tag-contact',desc:'XENOCOM发布年度十大发现：1) 银心方向辐射强度创纪录；2) 首张银河系文明分布图；3) 三体问题新解法验证；4) 比邻星b甲烷检测；5) 月球背面望远镜启用；6) 量子星际通讯实验成功；7) 外星纳米机器样本发现；8) VEGA-IIII文明追踪；9) 暗能量通讯理论提出；10) 卡尔达肖夫类型新定义。这标志着2049年成为人类星际探索史上最重要的一年。'}];
        document.getElementById('timelineContainer').innerHTML=timeline.map(t=>`<div class="tl-entry ${t.type==='contact'?'milestone':t.type==='warning'?'warning':''}"><span class="tl-date">${t.date}</span><div class="tl-title">${t.title}</div><span class="tl-tag ${t.tagClass}">${t.tagText}</span><p class="tl-desc">${t.desc}</p></div>`).join('');
    </script>
