    <style>
        :root{--space-void:#020510;--space-deep:#060d1f;--space-navy:#0a1830;--space-panel:#081020;--star-white:#e0e8f8;--star-dim:#a0b0d0;--star-muted:#607090;--signal-green:#00ff88;--signal-green-dim:#00cc66;--signal-cyan:#00e5ff;--signal-amber:#ffab00;--signal-red:#ff3d3d;--signal-purple:#b388ff;--alien-blue:#448aff;--alien-teal:#1de9b6;--text-primary:#d0d8f0;--text-secondary:#8899bb;--text-muted:#556688;--border-panel:#1a2a45;--border-active:#448aff;--shadow-glow-blue:0 0 20px rgba(68,138,255,0.25);--shadow-glow-purple:0 0 20px rgba(179,136,255,0.2);--radius-xs:3px;--radius-sm:6px;--radius-md:10px;--radius-lg:16px;--font-mono:'Courier New','Consolas','SF Mono','Monaco','Menlo',monospace;--font-display:'Georgia','Noto Serif SC','Songti SC',serif;--font-body:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;}
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:var(--font-body);background:var(--space-void);background-image:radial-gradient(ellipse at 30% 10%,rgba(179,136,255,0.04) 0%,transparent 50%),radial-gradient(ellipse at 70% 30%,rgba(68,138,255,0.03) 0%,transparent 50%);color:var(--text-primary);min-height:100vh;}
        ::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:var(--space-void);}::-webkit-scrollbar-thumb{background:var(--signal-purple);border-radius:3px;}
        .top-bar{background:var(--space-deep);border-bottom:1px solid var(--border-panel);padding:0.3rem 1.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:0.7rem;color:var(--star-muted);font-family:var(--font-mono);}
        .navbar{background:rgba(8,16,32,0.94);backdrop-filter:blur(16px);border-bottom:2px solid var(--border-panel);padding:0.7rem 2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;position:sticky;top:0;z-index:100;}
        .logo{display:flex;align-items:center;gap:0.5rem;cursor:pointer;text-decoration:none;}.logo-icon{width:38px;height:38px;background:radial-gradient(circle,var(--signal-purple),var(--alien-blue));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.2rem;box-shadow:0 0 15px rgba(179,136,255,0.35);}.logo-text{font-family:var(--font-display);font-size:1.2rem;font-weight:700;color:var(--star-white);}.logo-text .accent{color:var(--signal-purple);}
        .nav-links{display:flex;gap:1.3rem;list-style:none;flex-wrap:wrap;}.nav-links a{color:var(--star-dim);text-decoration:none;font-size:0.78rem;font-family:var(--font-mono);transition:all 0.2s;border-bottom:2px solid transparent;}.nav-links a:hover{color:var(--signal-purple);border-bottom-color:var(--signal-purple);}.nav-links a.active{color:var(--signal-purple);border-bottom-color:var(--signal-purple);font-weight:600;}
        .page-header{text-align:center;padding:2rem 1rem 1rem;}.page-header h1{font-family:var(--font-display);font-size:2.2rem;color:var(--star-white);}
        .container{max-width:1200px;margin:0 auto;padding:0 1.5rem;}
        .civ-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:2rem;margin-top:1.5rem;}
        .civ-card{background:var(--space-panel);border:1px solid var(--border-panel);border-radius:var(--radius-lg);overflow:hidden;transition:all 0.3s;}.civ-card:hover{border-color:var(--signal-purple);box-shadow:var(--shadow-glow-purple);transform:translateY(-4px);}
        .civ-card .civ-header{background:linear-gradient(135deg,var(--space-navy),var(--space-deep));border-bottom:1px solid var(--border-panel);padding:1.5rem;display:flex;align-items:center;gap:1rem;}
        .civ-card .civ-header .civ-icon{font-size:2.5rem;flex-shrink:0;}
        .civ-card .civ-header .civ-info{flex:1;}.civ-card .civ-header .civ-name{font-family:var(--font-display);font-size:1.3rem;color:var(--signal-purple);}.civ-card .civ-header .civ-loc{font-size:0.72rem;color:var(--star-muted);font-family:var(--font-mono);}
        .civ-card .civ-body{padding:1.5rem;}
        .civ-card .civ-body .spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;margin-bottom:1rem;}
        .civ-card .civ-body .spec-item{font-size:0.8rem;}.civ-card .civ-body .spec-item .lbl{color:var(--star-muted);font-size:0.65rem;text-transform:uppercase;letter-spacing:0.5px;}.civ-card .civ-body .spec-item .val{color:var(--star-dim);}
        .civ-card .civ-body p{color:var(--text-secondary);line-height:1.8;font-size:0.88rem;text-indent:2em;margin:0.5rem 0;}
        .civ-card .civ-body .tech-bar{height:5px;background:var(--space-deep);border-radius:3px;margin:0.5rem 0;overflow:hidden;}.civ-card .civ-body .tech-fill{height:100%;background:linear-gradient(90deg,var(--signal-purple),var(--signal-cyan));border-radius:3px;}
        .kardashev-tag{display:inline-block;padding:0.15rem 0.5rem;border-radius:2px;font-size:0.65rem;font-weight:700;font-family:var(--font-mono);}
        .k-type1{background:rgba(0,255,136,0.1);color:var(--signal-green);border:1px solid rgba(0,255,136,0.2);}
        .k-type2{background:rgba(0,229,255,0.1);color:var(--signal-cyan);border:1px solid rgba(0,229,255,0.2);}
        .k-type3{background:rgba(179,136,255,0.1);color:var(--signal-purple);border:1px solid rgba(179,136,255,0.2);}
        @media(max-width:768px){.civ-grid{grid-template-columns:1fr;}}
    </style>

    <div class="page-header"><h1>🌌 文明档案库</h1><p style="color:var(--star-dim);">CIVILIZATION ARCHIVE — 23个已确认地外文明</p></div>
    <div class="container"><div class="civ-grid" id="civGrid"></div></div>
    <script>
        const civilizations=[{name:'VEGA-III 文明',icon:'🌌',location:'VEGA星系',distance:'25光年',kardashev:'Type II',kClass:'k-type2',techLevel:92,firstContact:'2047年',commMethod:'1.42GHz氢线广播',biology:'碳基生命，类人形态。拥有高度发达的前额叶。',desc:'VEGA-III文明是人类确认的第一个地外文明。他们通过1.42GHz氢线频率发出警告信息，提醒人类不要广播自己的位置。据其自身描述，他们已存在至少370万年，经历了从生物文明到后生物文明的转变。他们的社会结构类似集体意识网络，个体既是独立的存在，也与整个文明共享信息。VEGA-III文明的技术水平已达到卡尔达肖夫II型——能够利用整个恒星系统的能量。他们的戴森球结构在红外波段可被探测到。',warning:'VEGA-III文明在唯一一次通讯后便沉默了。他们的警告——"他们来了"——所指的威胁尚不明确。'},{name:'KEPLER-442 信标网络',icon:'🪐',location:'开普勒442系统',distance:'1200光年',kardashev:'Type III',kClass:'k-type3',techLevel:98,firstContact:'2048年',commMethod:'22.3GHz定向脉冲',biology:'未知。可能为后生物/机器文明。',desc:'开普勒442系统的信号表现为精确的导航信标脉冲。分析表明这是一个银河系尺度的信标网络节点。脉冲中包含三维星图坐标和质数序列，可能是为星际航行提供导航参考。该信标网络的能量消耗巨大——单个脉冲的能量相当于人类全年的能源消耗。这表明该文明已达到卡尔达肖夫III型——能够利用整个星系的能量。',warning:'该文明似乎不主动与新兴文明交流。信标网络可能是为同等级文明之间的星际航行服务。'},{name:'LUYTEN-B 文明',icon:'🔷',location:'LUYTEN星',distance:'12.2光年',kardashev:'Type I',kClass:'k-type1',techLevel:78,firstContact:'2048年',commMethod:'3.14GHz数学频率广播',biology:'硅基生命，晶体结构，以电磁辐射为代谢基础。',desc:'LUYTEN-B文明是人类确认的第三个地外文明，也是距离地球最近的已知文明。他们的信息编码方式极其独特——使用四维矩阵来同时传输空间、时间、情感和逻辑四个维度的信息。这种多维语言结构暗示他们可能具有与人类完全不同的认知架构，能够同时处理多个并行的思维线程。',warning:'尽管LUYTEN-B文明技术水平仅为I型，但他们的数学能力似乎远超人类。他们能够在信号中嵌入高维拓扑结构，这暗示他们可能掌握了某种基于几何学的计算方式，远超人类的图灵机模型。'},{name:'TRAPPIST-1 文明群',icon:'🔴',location:'TRAPPIST-1系统',distance:'39光年',kardashev:'Type I',kClass:'k-type1',techLevel:65,firstContact:'2049年',commMethod:'5.55GHz电磁泄漏',biology:'碳基水生生命，可能存在于地下海洋中。',desc:'TRAPPIST-1系统中至少有三颗行星存在文明迹象。他们的信号特征较为原始——主要是未加密的电磁泄漏，类似于人类20世纪的无线电广播。信号中包含简单的脉冲间隔编码，使用质数间隔来区分不同含义，这被视为一种初级的"智能签名"。',warning:'TRAPPIST-1文明的信号中检测到了军事通讯特征——加密的指令模式和雷达脉冲。尽管技术水平不高，但他们似乎正处于一个充满竞争和冲突的发展阶段。'},{name:'PROXIMA-C 文明',icon:'🟢',location:'比邻星C',distance:'4.2光年',kardashev:'Type I',kClass:'k-type1',techLevel:81,firstContact:'2049年',commMethod:'1.42GHz高强度定向信号',biology:'未知，信号传输速率极高，暗示非生物智能或量子神经系统。',desc:'PROXIMA-C文明是人类确认的最近的地外文明，距离仅4.2光年。他们的信号强度异常高，远超一个I型文明应有的发射能力。更令人惊讶的是他们的信号传输速率——高达10^6 bit/s，是人类的数千倍。这暗示他们可能拥有完全不同的信息处理架构。',warning:'PROXIMA-C文明的高强度信号可能是一种"宣示存在"的行为——故意使用高功率吸引注意。这种行为模式可能是友好的，也可能是某种陷阱。'},{name:'WOLF-1061 文明',icon:'🟡',location:'WOLF-1061星',distance:'14光年',kardashev:'Type I',kClass:'k-type1',techLevel:58,firstContact:'2049年',commMethod:'7.832Hz舒曼共振调制',biology:'碳基陆生生命，具有高度发达的情感共鸣能力。',desc:'WOLF-1061文明使用舒曼共振频率（7.832Hz）作为通讯载波。这一频率恰好对应地球电离层空腔的基频共振——暗示该文明可能了解行星电磁环境的物理特性。他们的信号表现出与生物节律相关的特征——信号强度呈现约24.6小时的周期性波动，精确吻合其母星的自转周期。',warning:'WOLF-1061文明的信号中包含了一种我们无法完全理解的情绪编码。某些分析师在长时间接触这些信号后报告了异常的梦境和情绪波动。我们正在研究这种信号是否可能对人类神经系统产生未知影响。'},{name:'ROSS-128 文明',icon:'🔴',location:'罗斯128星',distance:'11光年',kardashev:'Type I',kClass:'k-type1',techLevel:72,firstContact:'2048年',commMethod:'4.2GHz AM广播',biology:'可能为碳基生命，具体形态未知。',desc:'罗斯128是一颗极其安静的红矮星，几乎没有耀斑活动。2048年，XENOCOM确认接收到来自该方向的4.2GHz规律信号。信号使用了简单的幅度调制（AM），包含重复的数学序列。文明的技术水平估计为中等I型——他们已经掌握了射电天文学，但尚未发展出高效的定向通讯技术。',warning:'罗斯128信号中包含了一个持续计数的序列，以该星的自转周期为单位。这可能是一个自动导航信标，也可能是某种时间标记系统。该文明的意图尚不明确。'},{name:'巴纳德星文明',icon:'⭐',location:'巴纳德星',distance:'6光年',kardashev:'Type I',kClass:'k-type1',techLevel:68,firstContact:'2048年',commMethod:'1.42GHz BPSK导航信标',biology:'未知。信号为自动设备发出，可能非生物。',desc:'巴纳德星是距离地球第二近的恒星系统。2048年确认的信号表现为规律的1.42GHz脉冲，使用BPSK调制。信号中包含一个以巴纳德星自转周期为单位的时间计数器，当前读数约为4.7×10^9。这种设计强烈暗示这是一个自动运行的星际导航信标，类似于地球上的灯塔，为星际旅行者提供位置参考。',warning:'如果该信号确实是导航信标，那么它的设计者可能早已消亡或迁移——信号本身只是他们留下的自动设备。这暗示了宇宙中可能存在大量"文明遗迹"——自动运行的设备在文明消亡后继续广播。'},{name:'仙女座脉冲文明',icon:'🌌',location:'仙女座星系(M31)',distance:'254万光年',kardashev:'Type III',kClass:'k-type3',techLevel:99,firstContact:'2049年',commMethod:'多频段高能脉冲',biology:'完全未知。可能已超越生物形态。',desc:'来自仙女座星系的规律性脉冲是人类确认的最遥远的地外文明迹象。周期精确为11.3天，单次脉冲能量估计达10^20焦耳。如此巨大的能量和精确的周期性几乎不可能是自然现象。如果这是人工信号，那么发射方已经达到了卡尔达肖夫III型——能够利用整个星系的能量。',warning:'254万光年的距离意味着信号是在254万年前发出的。这个文明可能早已不存在，或者已经演化为完全不同的形态。我们对他们几乎一无所知。'},{name:'塔比星建造者',icon:'🏗️',location:'KIC 8462852',distance:'1470光年',kardashev:'Type II',kClass:'k-type2',techLevel:88,firstContact:'2049年',commMethod:'红外/射电异常',biology:'未知。可能为机器文明。',desc:'塔比星自2015年起就因异常的亮度变化而闻名，亮度无规律下降最高达22%。2049年，XENOCOM在该星方向检测到与亮度变化同步的微弱射电信号，使"戴森球假说"获得了新的支持。该文明的能量工程能力已达到II型水平——能够建造行星尺度的巨型结构来收集恒星能量。',warning:'塔比星的异常光变模式不符合任何已知的自然解释。如果确实是戴森球结构，那么建造者可能仍在继续扩建。我们对这个文明没有任何直接的通讯记录。'},{name:'太阳系边缘文明',icon:'🛸',location:'日球层顶附近',distance:'0光年',kardashev:'未知',kClass:'k-type3',techLevel:95,firstContact:'2049年',commMethod:'未知增强机制',biology:'完全未知。',desc:'2049年，XENOCOM和NASA联合检测到旅行者1号的信号被某种未知机制增强并反射回地球。信号强度异常增加了40dB，并存在明显的人工回声。这暗示在太阳系边缘（日球层顶附近）可能存在某种未知的设备或结构，能够捕获、增强和重新发射电磁波。',warning:'如果这个增强装置确实存在，那么它的建造者可能在人类历史上就已经在太阳系附近活动了。最可怕的是：他们可能一直都在这里。'},{name:'木卫二生物圈',icon:'🌑',location:'木卫二(Europa)',distance:'0光年',kardashev:'Type 0',kClass:'k-type1',techLevel:12,firstContact:'2049年',commMethod:'7.832Hz生物电磁活动',biology:'碳基水生微生物群，可能已形成简单神经网络。',desc:'2049年，XENOCOM在木卫二方向检测到7.832Hz的舒曼共振信号。信号表现出微弱的生物节律特征。如果该信号确实来自木卫二的地下海洋，这意味着那里可能存在一个由微生物组成的全球性电磁活动网络——类似于地球的生物圈电磁场。',warning:'木卫二生物圈如果确实存在，可能代表了生命在太阳系内的第二次独立起源。这将对人类理解生命的普遍性产生深远影响。'},{name:'天狼星双星文明',icon:'🌟',location:'天狼星系统',distance:'8.6光年',kardashev:'Type II',kClass:'k-type2',techLevel:85,firstContact:'2049年',commMethod:'3.2GHz周期性脉冲',biology:'硅基生命体，可能存在于环绕双星的高轨道站上。',desc:'天狼星是一个双星系统，包含一颗白矮星和一颗主序星。检测到的脉冲信号周期为50.1年，与双星轨道周期精确吻合。这种相关性暗示可能存在一个围绕双星系统运行的空间站网络，利用双星的引力势能做周期性调整。如果这确实是人工结构，那么其规模和技术水平都远超人类当前能力。',warning:'50.1年的周期恰好是中国的甲子周期，这种文化巧合的意义尚不明确。信号的精确数学特征暗示建造者可能对数学有深刻的理解。'},{name:'τ星(天仓五)知识库文明',icon:'📚',location:'τ星系统',distance:'12光年',kardashev:'Type I',kClass:'k-type1',techLevel:75,firstContact:'2049年',commMethod:'2.7GHz数据包传输',biology:'碳基生命，具体形态未知。',desc:'τ星是一颗与太阳相似的G型恒星，周围有多颗行星。2049年检测到的信号包含一个大型数据包，分为数学、物理、化学和生物四个模块，总数据量约2MB。这相当于人类整个互联网信息量的百分之一。如果数据包被完全解码，人类的基础科学可能发生革命性变化。',warning:'联合国已下令隔离所有τ星数据，等待安全评估。部分科学家担忧数据包中可能包含恶意代码或意识操纵信息。'},{name:'卡普坦星古老文明',icon:'⏳',location:'卡普坦星',distance:'12.8光年',kardashev:'Type I',kClass:'k-type1',techLevel:70,firstContact:'2048年',commMethod:'1.42GHz时间戳广播',biology:'未知。据估计其年龄约110亿年，可能是宇宙中最古老的文明之一。',desc:'卡普坦星是一颗约110亿年老的恒星——几乎是宇宙年龄的四分之一。如果其周围的文明起源也如此古老，他们可能经历了比我们长数万倍的发展时间。检测到的信号包含一个"宇宙时间戳"，记录了从大爆炸到现在的时间。',warning:'一个存在超过100亿年的文明可能已经经历了无数次的技术革命和文明崩溃。他们可能已经完全超越了我们的理解范围——无论是技术上还是意识形态上。'},{name:'格列581新兴文明',icon:'🌱',location:'格列581系统',distance:'20光年',kardashev:'Type I',kClass:'k-type1',techLevel:55,firstContact:'2049年',commMethod:'5.1GHz脉冲编码',biology:'碳基生命，可能为海洋生物。',desc:'格列581系统拥有7颗已确认的行星，其中格列581g被认为是最具宜居性的候选。2049年检测到的信号来自该系统，表现为简单的开关键控脉冲，类似于莫尔斯电码但使用不同的时序模式。文明的通讯技术约为人类20世纪中期的水平。',warning:'该文明可能刚刚进入技术时代。他们的信号泄漏表明他们对射电天文学有所了解，但尚未意识到在宇宙中广播自己位置的危险。'},{name:'LHS 1140b 水世界文明',icon:'💧',location:'LHS 1140',distance:'41光年',kardashev:'Type I',kClass:'k-type1',techLevel:62,firstContact:'2049年',commMethod:'3.5GHz水分子信号',biology:'碳基水生生命，可能具有水下智慧。',desc:'LHS 1140b是一颗半径为地球1.4倍的岩石行星，位于红矮星的宜居带内。检测到的3.5GHz信号中明确包含水蒸气的光谱特征，这是首次在外星信号中直接检测到水的证据。信号的周期（24.7天）与行星公转周期精确吻合，表明信号来自行星本身。',warning:'LHS 1140b的信号显示其可能拥有稠密的大气层和液态水海洋。如果确实存在水生文明，他们的生物学和思维方式可能与人类完全不同。'},{name:'TOI-700d 沙漠文明',icon:'🏜️',location:'TOI-700系统',distance:'100光年',kardashev:'Type I',kClass:'k-type1',techLevel:68,firstContact:'2049年',commMethod:'6.7GHz甲醛频率',biology:'碳基生命，适应干旱环境，可能为地下生物。',desc:'TOI-700是一颗位于长蛇座的红矮星，其行星TOI-700d位于宜居带内。检测到的6.7GHz信号恰好是甲醛（CH2O）的分子共振频率之一。甲醛与生命起源密切相关，这可能暗示发送方故意选择了这个具有生物学意义的频率。',warning:'TOI-700d的沙漠环境可能催生出与地球完全不同的生命形式。信号中检测到的复杂调制暗示该文明可能拥有比预期更高的技术水平。'},{name:'开普勒-186f 森林文明',icon:'🌿',distance:'500光年',kardashev:'Type I',kClass:'k-type1',techLevel:70,firstContact:'2049年',commMethod:'1.42GHz生物信息编码',biology:'碳基生命，可能为植物或真菌起源的智慧体。',desc:'开普勒-186f是第一颗确认位于宜居带的地球大小行星。检测到的1.42GHz信号包含与生物学相关的信息编码——水分子结构、碳基有机化合物、氨基酸序列等。信号的组织方式类似于教科书，可能是一种"生物学入门"。',warning:'如果信号中的生物学信息是刻意设计的，那么发送方可能对地球文明有一定的了解。这可能意味着他们在宇宙中主动寻找可以交流的对象。'},{name:'奥陌陌遗留文明',icon:'☄️',location:'星际空间',distance:'未知',kardashev:'未知',kClass:'k-type2',techLevel:90,firstContact:'2049年',commMethod:'高频电磁脉冲',biology:'完全未知。可能为机器文明或后生物文明。',desc:'奥陌陌是人类确认的第一个星际物体。2049年，在它的遗留轨迹上检测到持续的高频脉冲辐射。这种"死亡航标"模式暗示奥陌陌可能不是自然物体，而是某种失去了动力的星际探测器或航标。它的建造者可能早已消失在宇宙的长河中，只留下这个自动设备继续广播。',warning:'奥陌陌的发现改变了对星际物体本质的理解。即使是"死去"的探测器也可能对路过文明构成危险——或者只是无意义的太空垃圾。'},{name:'银河系中心III型文明',icon:'⚫',location:'银河系中心',distance:'2.7万光年',kardashev:'Type III',kClass:'k-type3',techLevel:100,firstContact:'2049年',commMethod:'全频段宽频带',biology:'完全未知。可能已超越物质形态。',desc:'银河系中心方向检测到的持续宽带辐射覆盖所有射电频率，能量输出相当于数百万颗恒星的总额。这可能是宇宙中最强大的文明迹象。信号中没有检测到任何调制特征——如果这是通讯信号，那它的编码方式远超人类理解能力。',warning:'一个能够控制整个星系能量输出的文明，在技术上与我们相比几乎是神级的存在。他们可能根本不需要"通讯"——对他们来说，银河系本身的结构可能就是他们的语言。'},{name:'南河三双星文明',icon:'✨',location:'南河三系统',distance:'11.4光年',kardashev:'Type II',kClass:'k-type2',techLevel:82,firstContact:'2049年',commMethod:'4.8GHz能量爆发',biology:'未知。白矮星伴星可能提供了特殊的环境。',desc:'南河三是一个双星系统，距离地球11.4光年。2049年检测到的单次宽频带爆发在0.7秒内释放了约10^18焦耳的能量——相当于地球一年总发电量的十分之一。这种能量级别的精确控制暗示了II型文明的技术水平。',warning:'白矮星的存在可能使这个系统成为II型文明的理想家园——他们可能利用白矮星的引力势能或物质吸积来获取能源。'},{name:'沃尔夫359活跃文明',icon:'🔴',location:'沃尔夫359',distance:'7.9光年',kardashev:'Type I',kClass:'k-type1',techLevel:72,firstContact:'2048年',commMethod:'2.4GHz跳频扩频',biology:'未知。红矮星的频繁耀斑可能影响了生命的进化。',desc:'沃尔夫359是一颗活跃的红矮星，距离地球7.9光年。检测到的2.4GHz信号使用了极其复杂的跳频扩频技术，跳频速率达每秒1000次。这种技术远超自然现象的可能范围，暗示了该文明的存在。',warning:'活跃的恒星环境可能使这个星系的文明面临更多的生存挑战。但正是这种恶劣环境可能催生出更顽强的技术文明。'},{name:'比邻星B 原住民',icon:'🌍',location:'比邻星b',distance:'4.2光年',kardashev:'Type I',kClass:'k-type1',techLevel:75,firstContact:'2048年',commMethod:'1.42GHz复合信号',biology:'碳基生命，适应红矮星环境，可能具有特殊的视觉系统。',desc:'比邻星b是距离地球最近的已确认系外行星。2048年确认的1.42GHz信号表现出与PROXIMA-C不同的特征——强度较低但包含更复杂的信息结构。这可能意味着比邻星b和C是两个不同的文明，或者比邻星C文明内部存在多个派系。',warning:'4.2光年的距离使物理接触成为可能。如果比邻星文明能够建造亚光速飞船，他们可能在不到100年内到达地球。这是最紧迫需要监测的地外文明之一。'},{name:'月球背面远古文明',icon:'🌙',location:'月球背面',distance:'0光年',kardashev:'未知',kClass:'k-type1',techLevel:0,firstContact:'2049年',commMethod:'1.42GHz反射信号',biology:'完全未知。可能已灭绝。',desc:'2049年检测到的月球背面反射信号与VEGA-III的原始广播高度相似。反射体的成分分析显示其年龄约为300万年。如果这确实是VEGA-III的探测器残骸，那么他们在人类出现之前很久就已经在太阳系内活动了。',warning:'一个能够在月球背面放置设备的文明，可能在远古时期就具备了星际旅行能力。他们现在在哪里？他们是VEGA-III警告中提到的"他们"吗？还是另一个已经消亡的文明？'},{name:'土星环智慧结构',icon:'🪐',location:'土星环',distance:'0光年',kardashev:'未知',kClass:'k-type1',techLevel:75,firstContact:'2049年',commMethod:'1.42GHz反射脉冲',biology:'未知。可能是机器结构。',desc:'土星B环外侧边缘检测到的反射信号周期（11.3小时）与土星自转周期精确吻合。卡西尼号的数据分析表明，这个位置存在一个直径约数公里的物体，表面覆盖着某种高效射电反射材料。',warning:'土星环中的这个物体可能是自然形成的，也可能是远古文明的遗迹。无论如何，它的存在表明太阳系的历史可能比我们想象的更加复杂。'},{name:'OGLE-2019-BLG-0037 黑洞能源文明',icon:'🕳️',location:'银河系中心方向',distance:'约20000光年',kardashev:'Type III',kClass:'k-type3',techLevel:95,firstContact:'2050年',commMethod:'引力波调制+量子纠缠',biology:'未知。可能是后生物形态。',desc:'OGLE-2019-BLG-0037是人类接触到的最神秘的文明之一。他们的信号同时使用了引力波和量子纠缠技术，暗示他们已经掌握了时空本质的力量。他们确认了黑洞能源的可行性，并警告人类引力场操控的危险性。这个文明可能已经超越了物质形态，以某种形式的能量意识存在。',warning:'他们能够在银河系中心方向的极端环境中生存，说明他们已经掌握了远超人类理解的技术。他们选择与人类交流的动机尚不明确。'},{name:'Gliese 667C 多文明融合体',icon:'🌿',location:'Gliese 667C系统',distance:'23.6光年',kardashev:'Type II',kClass:'k-type2',techLevel:88,firstContact:'2050年',commMethod:'多频段复合信号',biology:'混合生物形态。可能由多个种族融合而成。',desc:'Gliese 667C的回复暗示他们经历了多文明合并的过程。他们的信号同时包含多种生物电特征，暗示这个文明实际上是由多个不同种族融合而成的共同体。这种融合可能通过生物工程或意识上传技术实现，他们现在以一个统一的集体意识存在。',warning:'他们的多文明融合过程可能并不和平。历史上可能发生过激烈的冲突，最终以一个文明的胜利结束。'},{name:'HD 219134 时间循环者',icon:'🔄',location:'HD 219134系统',distance:'21光年',kardashev:'Type II',kClass:'k-type2',techLevel:82,firstContact:'2050年',commMethod:'脉冲编码+时间戳',biology:'未知。可能已经超越了生物形态。',desc:'HD 219134对时间的理解与人类物理学中的"闭合类时间曲线"理论不谋而合。他们暗示时间不是线性的，而是可以循环的。这个文明可能已经掌握了创造人工时间循环的能力，使他们能够在某种程度上"回到过去"或"预见未来"。',warning:'如果他们能够操控时间，理论上他们可以在人类文明的任何历史时刻进行干预。这种能力对人类来说既是威胁也是机遇。'},{name:'ROSS-128 量子观察者',icon:'👁️',location:'ROSS-128系统',distance:'10.9光年',kardashev:'Type I',kClass:'k-type1',techLevel:65,firstContact:'2048年',commMethod:'量子态编码',biology:'碳基生命，类人体型。',desc:'ROSS-128文明的量子观察者计划使用量子纠缠技术在不干扰的情况下观察其他文明。他们的信号证实了他们确实在不同时空位置进行"观测"，但坚称这不是"监视"而是"记录"。他们可能已经建立了宇宙尺度的量子观测网络。',warning:'尽管他们声称是"和平观察"，但量子观测技术可能被武器化。如果他们能够观测任何时间地点的事件，理论上他们也能够在那个时间地点制造变化。'}];
        document.getElementById('civGrid').innerHTML=civilizations.map(c=>`<div class="civ-card"><div class="civ-header"><span class="civ-icon">${c.icon}</span><div class="civ-info"><div class="civ-name">${c.name}</div><div class="civ-loc">📍 ${c.location} | 📏 ${c.distance} | 🕐 首次接触: ${c.firstContact}</div></div></div><div class="civ-body"><div class="spec-grid"><div class="spec-item"><span class="lbl">卡尔达肖夫等级</span><div class="val"><span class="kardashev-tag ${c.kClass}">${c.kardashev}</span></div></div><div class="spec-item"><span class="lbl">技术水平</span><div class="val">${c.techLevel}/100</div></div><div class="spec-item"><span class="lbl">通讯方式</span><div class="val">${c.commMethod}</div></div><div class="spec-item"><span class="lbl">生命形态</span><div class="val">${c.biology}</div></div></div><div class="tech-bar"><div class="tech-fill" style="width:${c.techLevel}%;"></div></div><p>${c.desc}</p><p style="color:var(--signal-amber);font-size:0.8rem;"><strong>⚠️ ${c.warning}</strong></p></div></div>`).join('');
    </script>
