    <style>
        :root{--space-void:#020510;--space-deep:#060d1f;--space-navy:#0a1830;--space-panel:#081020;--star-white:#e0e8f8;--star-dim:#a0b0d0;--star-muted:#607090;--signal-green:#00ff88;--signal-cyan:#00e5ff;--signal-amber:#ffab00;--signal-red:#ff3d3d;--signal-purple:#b388ff;--alien-blue:#448aff;--alien-teal:#1de9b6;--text-primary:#d0d8f0;--text-secondary:#8899bb;--border-panel:#1a2a45;--border-active:#448aff;--shadow-glow-blue:0 0 20px rgba(68,138,255,0.25);--shadow-glow-green:0 0 20px rgba(0,255,136,0.2);--radius-xs:3px;--radius-sm:6px;--radius-md:10px;--radius-lg:16px;--font-mono:'Courier New','Consolas','SF Mono','Monaco','Menlo',monospace;--font-display:'Georgia','Noto Serif SC','Songti SC',serif;--font-body:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;}

        .navbar{background:rgba(8,16,32,0.94);backdrop-filter:blur(16px);border-bottom:2px solid var(--border-panel);padding:0.7rem 2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;position:sticky;top:0;z-index:100;}
        .logo{display:flex;align-items:center;gap:0.5rem;cursor:pointer;text-decoration:none;}.logo-icon{width:38px;height:38px;background:radial-gradient(circle,var(--signal-green),var(--alien-teal));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.2rem;box-shadow:0 0 15px rgba(0,255,136,0.35);}.logo-text{font-family:var(--font-display);font-size:1.2rem;font-weight:700;color:var(--star-white);}.logo-text .accent{color:var(--signal-green);}
        .nav-links{display:flex;gap:1.3rem;list-style:none;flex-wrap:wrap;}.nav-links a{color:var(--star-dim);text-decoration:none;font-size:0.78rem;font-family:var(--font-mono);transition:all 0.2s;border-bottom:2px solid transparent;}.nav-links a:hover{color:var(--signal-green);border-bottom-color:var(--signal-green);}.nav-links a.active{color:var(--signal-green);border-bottom-color:var(--signal-green);font-weight:600;}
        .page-header{text-align:center;padding:2rem 1rem 1rem;}.page-header h1{font-family:var(--font-display);font-size:2.2rem;color:var(--star-white);}

        .tx-card{background:var(--space-panel);border:1px solid var(--border-panel);border-radius:var(--radius-lg);overflow:hidden;transition:all 0.3s;}.tx-card:hover{border-color:var(--signal-green);box-shadow:var(--shadow-glow-green);}
        .tx-card .tx-header{background:linear-gradient(135deg,var(--space-navy),var(--space-deep));padding:1.2rem 1.5rem;display:flex;align-items:center;gap:1rem;}
        .tx-card .tx-header .tx-direction{font-size:2rem;}
        .tx-card .tx-header .tx-info{flex:1;}.tx-card .tx-header .tx-name{font-family:var(--font-display);font-size:1.2rem;color:var(--signal-green);}.tx-card .tx-header .tx-date{font-size:0.7rem;color:var(--star-muted);font-family:var(--font-mono);}
        .tx-card .tx-body{padding:1.5rem;}.tx-card .tx-body p{color:var(--text-secondary);line-height:1.8;font-size:0.9rem;text-indent:2em;margin:0.5rem 0;}
        .tx-card .tx-body .message-box{background:var(--space-deep);border:1px solid var(--border-panel);border-radius:var(--radius-sm);padding:1.2rem;margin:1rem 0;font-family:var(--font-mono);font-size:0.78rem;color:var(--signal-green);line-height:1.7;white-space:pre-wrap;}

    <div class="page-header"><h1>📡 星际广播记录</h1><p style="color:var(--star-dim);">人类与地外文明的通讯日志</p></div>
    <div class="container"><div class="transmission-list" id="txList"></div></div>
    <script>
        const transmissions=[{name:'人类首次星际广播',direction:'📤 发出',date:'2045-03-15',target:'VEGA星系',content:'"你好，宇宙。这里是地球。我们来自太阳系，是一个年轻的碳基文明。我们渴望与宇宙中的其他智慧生命建立联系。这是我们的第一声问候。"',response:'24个月后收到VEGA-III文明回复。',analysis:'这条广播使用了1.42GHz氢线频率——这是宇宙中最普遍的元素发出的自然频率，被认为是星际通讯的"通用频道"。广播内容以二进制编码，包含数学常数(π、e)和氢原子能级图，作为通用的智能证明。发射功率500千瓦，使用阿雷西博305米口径望远镜。消息预计在25年后（2070年）到达VEGA星系。然而，VEGA-III在2047年就回复了——仅过了2年，这暗示他们可能一直在监听地球。'},{name:'VEGA-III 警告回复',direction:'📥 接收',date:'2047-06-12',target:'来自VEGA星系',content:'"WE HAVE BEEN LISTENING FOR 3.7 MILLION YEARS. YOUR RADIO EMISSIONS HAVE REACHED US. DO NOT BROADCAST YOUR LOCATION. THERE ARE OTHERS WHO ARE NOT BENEVOLENT. THEY ARE COMING. THIS IS OUR FINAL WARNING. WE WILL NOT TRANSMIT AGAIN."',response:'人类已停止主动SETI广播。',analysis:'这是人类收到的第一条确认来自地外文明的通讯。VEGA-III文明明确警告人类停止广播。此后他们再未发出任何信号。这一警告引发了全球范围内的激烈辩论——宇宙中是否存在"黑暗森林"法则？值得注意的是，VEGA-III在发出这条消息后便永久沉默了——无论是对人类的后续监听，还是对其他方向的信号发射，都未再检测到他们的任何活动。'},{name:'LUYTEN-B 问候交换',direction:'📤📥 双向',date:'2049-01-15',target:'LUYTEN星',content:'人类: "我们收到了你们的信息。我们来自地球，一个年轻的文明。我们希望与你们建立和平的联系。" LUYTEN-B: "[四维矩阵] 欢迎 + 好奇 + 友谊的提议"',response:'持续的双向通讯已建立。平均信息往返时间: 24.4年。',analysis:'与LUYTEN-B文明的通讯是人类历史上第一次真正意义上的"对话"。虽然由于12.2光年的距离，每条信息的往返需要约24.4年，但双方已经建立了一个持续的通讯渠道。LUYTEN-B的信息以四维矩阵形式编码，每次解码都需要动用XENOCOM的超级计算资源。有趣的是，LUYTEN-B似乎对"黑暗森林"法则并不了解或不在意——他们的信号和回复都没有表现出任何恐惧或警告。'},{name:'TRAPPIST-1 被动监听',direction:'📥 收到',date:'2049-01-20',target:'TRAPPIST-1系统',content:'未加密的电磁泄漏。包含音频广播、视频信号和数据通讯。信号特征类似于地球20世纪的无线电技术。',response:'人类未主动回复。目前仅进行被动监听。',analysis:'TRAPPIST-1系统的信号较为原始，暗示该文明处于技术发展的早期阶段。信号中检测到了军事通讯特征——加密的指令模式和雷达脉冲。XENOCOM安全委员会就是否应该回复展开了激烈争论：一方认为应该提供技术援助，帮助他们避免人类曾经犯过的错误；另一方则认为根据"文明接触伦理公约"，不应干预其他文明的内部发展。目前决议为：继续保持被动监听，不主动接触。'},{name:'PROXIMA-C 信号回应',direction:'📤📥 双向',date:'2049-02-14',target:'比邻星C',content:'人类: "我们检测到了你们的信号。我们来自地球。我们希望了解你们。" PROXIMA-C: "[解码进度 12%] ...数学序言...自描述语言...数据结构..."',response:'初步通讯已建立。解码工作持续进行中。',analysis:'PROXIMA-C文明的信号复杂度远超VEGA-III。他们的信息使用了一种自描述语言——信息的开始部分包含了如何解码后续内容的全套规则。这种设计确保了即使接收方的技术水平有限，也能够逐步理解信息的结构。然而，PROXIMA-C信号的高强度（-65dBm，对于4.2光年的距离来说异常高）引发了安全担忧。XENOCOM安全委员会正在评估这是否是一种"诱饵信号"。'},{name:'WOLF-1061 生物节律同步实验',direction:'📤 发出',date:'2049-03-05',target:'WOLF-1061星',content:'人类发送了一组模仿WOLF-1061文明生物节律模式的回应信号。信号使用7.832Hz舒曼共振频率，调制模式模仿对方的睡眠-觉醒周期。',response:'等待回应中。预计最早回应时间: 2049年3月。',analysis:'这是人类第一次尝试使用"生物共鸣"而非"数学语言"与外星文明建立联系。WOLF-1061文明的信号表现出强烈的生物节律特征，暗示他们可能更擅长理解情感层面的通讯，而非抽象的逻辑交流。XENOCOM的生物学家和心理学家团队联合设计了这组回应信号，试图在更原始的层面上建立情感连接。如果实验成功，将开创一种全新的星际通讯范式。'},{name:'人类全球广播停止声明',direction:'📤 发出',date:'2047-09-20',target:'全方向广播',content:'"鉴于收到来自VEGA星系的重要信息，人类决定自即日起停止所有非必要的射电广播。我们感谢所有曾尝试与我们联系的智慧生命。我们将继续倾听，但暂时保持沉默。愿宇宙中的和平与理解终将战胜恐惧。"',response:'多条信号在静默令生效后持续被检测到，但人类未再主动回复。',analysis:'这是人类历史上第一次基于外部信息而改变全球通讯政策的声明。广播使用UEC-7宇宙通用编码标准，以确保任何监测地球频率的文明都能理解。声明的措辞经过联合国安理会和国际科学委员会的反复讨论——既要表达人类的和平意图，又要避免透露过多信息。广播后，地球的平均射电发射功率降低了87%。'},{name:'KEPLER-442 问候尝试',direction:'📤 发出',date:'2048-09-20',target:'开普勒442系统',content:'"我们收到了你们的导航信号。我们来自地球，距离你们1200光年。我们也梦想着星际航行。如果可能，请告诉我们更多关于你们和你们网络的信息。"',response:'尚未收到回复。由于1200光年的距离，即使收到回复，最早也要在2400年后。',analysis:'向开普勒442的问候是人类发送过的最远的信息。发射使用了中国最大的FAST望远镜（500米口径），配合特殊的放大器阵列，总发射功率达到10^7瓦。这是人类能够集中的最大发射功率，但对于1200光年的距离来说仍然极其微弱。XENOCOM估计信号到达开普勒442时的强度约为10^-28瓦/平方米——如果对方拥有极其灵敏的接收设备，或许能够检测到。'},{name:'TRAPPIST-1 和平宣言',direction:'📤 发出',date:'2049-02-01',target:'TRAPPIST-1系统',content:'"我们检测到了你们的信号。我们理解你们可能正处于技术发展的早期阶段。我们来自地球，曾经经历过同样的阶段。我们愿意分享我们的经验，如果你们愿意的话。我们承诺不干涉你们的内部事务。愿和平与进步伴随你们的文明。"',response:'由于XENOCOM安全委员会的反对，该广播被暂停发送。目前仅保存于发射队列中。',analysis:'向TRAPPIST-1的和平宣言引发了XENOCOM内部最激烈的伦理辩论。一方认为，根据《文明接触伦理公约》，人类有义务帮助技术水平较低的文明避免人类曾经犯过的错误（如环境污染、核战争、AI失控等）。另一方则认为，任何干预都可能破坏TRAPPIST-1文明的"自然发展进程"——他们可能需要通过自己的努力来克服这些挑战，才能成长为真正成熟的文明。目前决议为：保持监听，不主动干预，但保留未来接触的可能性。'},{name:'地球数学常识广播',direction:'📤 发出',date:'2048-06-01',target:'银河系多方向',content:'"这是来自地球的基本数学知识。质数: 2,3,5,7,11,13... 圆周率: 3.1415926535... 自然对数底: 2.7182818284... 黄金比例: 1.6180339887... 这些是所有智慧生命共同的语言。"',response:'该广播被LUYTEN-B和PROXIMA-C文明检测到。LUYTEN-B在回复中提供了他们自己的数学常数——其中一些与人类已知的不完全相同，暗示他们可能存在于不同的物理常数宇宙中（或使用了不同的度量标准）。',analysis:'这是人类在VEGA-III警告后发出的第一条"数学常识"广播。与2045年的首次广播不同，这次广播经过了XENOCOM安全委员会的严格审查，确保不包含任何可能暴露地球精确位置的信息。广播采用了XENOCOM最新开发的"通用数学层"编码——一种极简的、只包含数学公理的信息格式，被认为是任何技术文明都能理解的"安全信息"。LUYTEN-B的回复中包含了与人类略有不同的数学常数，这一发现引发了物理学界的震动。'},{name:'太阳系问候信号阵列',direction:'📤 发出',date:'2049-01-01',target:'太阳系内多目标',content:'"这是一组面向太阳系内潜在文明的问候。木卫二、土卫二、土卫六——如果你们的冰下海洋中存在生命，请知道你们并不孤独。宇宙充满了生命。愿有一天我们能真正相遇。"',response:'尚未收到明确回复。木卫二的7.832Hz信号可能与此广播有关，但因果关系无法确认。',analysis:'这是人类历史上第一次向太阳系内的其他天体发送广播，而非遥远的恒星。虽然传统科学认为太阳系内除了地球外不太可能存在智慧生命，但XENOCOM的木卫二信号检测改变了一些人的看法。该广播使用了一种极低频率（ELF）编码，专门设计为能够在冰层和海洋中传播——如果木卫二的地下海洋中存在任何能够感知电磁场的生命形式，这种编码将最大化被接收的概率。'},{name:'巴纳德星导航信标回复尝试',direction:'📤 发出',date:'2049-03-20',target:'巴纳德星',content:'"我们收到了你们的导航信标。虽然我们不知道是谁建造了它，但我们感谢这个银河系中的灯塔。如果有任何文明在监听，请知道地球已经收到了你们的信息。我们也在尝试成为宇宙社区的一部分。"',response:'信号已发出。预计最早回复时间：2049年3月+6年=2055年。',analysis:'巴纳德星距离地球仅6光年，是人类已确认的最近的地外文明信号源。虽然该信号被判定为自动运行的导航信标，但人类还是决定发送一条回复——万一建造信标的文明仍在监听。这条信息经过XENOCOM安全委员会审核，确保不包含任何可能暴露地球精确位置或技术水平的内容。'},{name:'开普勒-452b地球信息包',direction:'📤 发出',date:'2049-04-15',target:'开普勒-452系统',content:'"这是来自地球的信息包。我们是地球上的学生和教师。我们热爱学习，就像你们可能一样。我们学习数学、科学、艺术和历史。我们也学习如何与不同的人和平相处。如果收到这条信息，请告诉我们你们的世界是什么样的。"',response:'尚未收到回复。预计最早回复时间：1400年后。',analysis:'这是人类第一份由学生撰写的星际广播信息。与之前由政府和科学家主导的信息不同，这份信息充满了年轻一代对宇宙的好奇和期待。XENOCOM教育部门邀请了全球100所学校的5000名学生参与编写。这条信息使用UEC-7宇宙通用编码标准，以数学序列开头，然后是图文并茂的地球介绍。'},{name:'ROSS-128 第一次接触',direction:'📤📥 双向',date:'2049-03-22',target:'ROSS-128星',content:'人类: "我们收到了你们的信号。我们是地球上的研究者。" ROSS-128: "[数学序列] π=3.14159... e=2.71828... √2=1.41421..."',response:'初步接触已建立。双方正在进行数学基础的交流。',analysis:'ROSS-128是一颗距离地球10.9光年的红矮星。它的信号在2049年3月首次被检测到，包含清晰的数学序列。与之前收到的信号不同，ROSS-128的信号似乎特意从数学开始——这被解读为一种"友好"的表达，暗示发送者愿意从共同语言开始建立沟通。XENOCOM已组织专门团队负责与ROSS-128的通讯。'},{name:'天狼星A 文明问候',direction:'📤📥 双向',date:'2049-04-01',target:'天狼星A',content:'人类: "我们收到了来自天狼星方向的脉冲信号。我们好奇这些信号的意义。" 天狼星A: "[脉冲序列] 50.1年周期... 50.1年周期..."',response:'天狼星A的脉冲信号持续被监测。50.1年的周期与双星轨道精确吻合。',analysis:'天狼星是一个双星系统，由天狼星A（主序星）和天狼星B（白矮星）组成。检测到的50.1年脉冲周期与双星轨道周期精确吻合。这种精确性暗示可能是某种巨型空间工程结构的信号。如果确实是人工结构，其规模将远超人类当前能力。'},{name:'鲸鱼座TV 宇宙常识广播',direction:'📤 发出',date:'2049-04-20',target:'鲸鱼座TV',content:'"这是来自地球的物理常数集合。精细结构常数α=1/137.036... 质子与电子质量比=1836.15... 普朗克常数h=6.626×10⁻³⁴J·s..."',response:'尚未收到回复。',analysis:'鲸鱼座TV是一颗距离地球约12光年的恒星，被认为拥有多颗系外行星。这条广播是人类第一次向该系统发送物理常数信息——与之前发送数学常数不同，物理常数能够更精确地描述宇宙的规律，同时也是证明发送者科技水平的重要指标。'},{name:'TRAPPIST-1e 文化信息交换',direction:'📤📥 双向',date:'2049-05-01',target:'TRAPPIST-1e',content:'人类: "我们向你们发送地球上的音乐。这是巴赫、贝多芬、莫扎特的作品片段。" TRAPPIST-1e: "[音乐回声] 听起来像是... 某种形式的振动模式。你们的"音乐"很有趣。我们也有类似的东西。"',response:'首次文化交换成功。TRAPPIST-1e对地球古典音乐表现出浓厚兴趣。',analysis:'这是人类第一次向外星文明发送音乐作品。选取的三位作曲家代表了不同的音乐风格：巴赫的严谨结构、贝多芬的情感张力、莫扎特的和谐优雅。TRAPPIST-1e的回复中提到他们也有"类似的东西"——这是人类第一次间接了解外星文明的文化形式。XENOCOM音乐分析团队正在尝试从回复中提取TRAPPIST-1e的音乐样本。'},{name:'LHS 1140b 生存策略分享',direction:'📤 发出',date:'2049-05-15',target:'LHS 1140',content:'"我们的文明经历了战争、疾病和环境危机。我们从错误中学习。现在我们正在努力成为一个更好的文明。如果你们正在经历困难，请知道你们并不孤单。许多文明可能都有过类似的经历。"',response:'尚未收到回复。预计最早回复时间：2049年5月+40年=2089年。',analysis:'LHS 1140是一颗距离地球约40光年的红矮星，其行星LHS 1140b被认为是一颗潜在的宜居世界。这条广播是人类第一次向外星文明分享自己的历史教训——包括战争、疾病和环境破坏等负面经验。这种"诚实"的信息策略引发了一些争议：一些科学家认为这可能会暴露人类的弱点；另一些人则认为这可能是建立真诚联系的最佳方式。'},{name:'WOLF-359 紧急广播协议',direction:'📤📥 双向',date:'2049-05-20',target:'WOLF-359',content:'人类: "我们检测到你们使用了复杂的跳频技术。我们对这种通讯方式很感兴趣。请告诉我们更多关于你们文明的信息。" WOLF-359: "[跳频序列] 加密... 安全... 威胁..."',response:'WOLF-359的回复包含"威胁"一词。XENOCOM安全委员会正在进行深度分析。',analysis:'WOLF-359是一颗距离地球仅7.9光年的红矮星。其信号使用了复杂的跳频扩频技术，这种技术通常用于军事通讯和躲避监测。回复中出现的"威胁"一词让XENOCOM安全委员会高度警惕。如果WOLF-359文明确实面临某种威胁，这可能与VEGA-III警告中的"他们"有关。'},{name:'GJ-411 太阳系地图',direction:'📤 发出',date:'2049-06-01',target:'GJ-411',content:'"这是我们太阳系的地图。太阳在中心。水星、金星、地球、火星、木星、土星、天王星、海王星——每颗行星都有它独特的特征。我们生活在这片宇宙的角落里，希望与你们做朋友。"',response:'尚未收到回复。',analysis:'GJ-411是一颗距离地球约8光年的恒星，是离太阳最近的恒星系统之一。这条广播包含了一个完整的太阳系结构图——但故意省略了地球的精确位置。这是一种"安全距离"的策略：让对方知道我们太阳系的基本结构，但不暴露地球的具体位置。XENOCOM安全委员会审查了信息的每一个细节，确保没有任何可能被用于定位地球的内容。'},{name:'OGLE-2016-BLG-1195 危机支援广播',direction:'📤 发出',date:'2049-06-15',target:'OGLE-2016-BLG-1195',content:'"如果你们正在经历任何形式的危机——无论是自然灾害、疾病还是技术灾难——请让我们知道。也许我们可以提供帮助。即使我们无法亲自到达，我们也许能够提供信息或资源。愿和平与繁荣伴随你们的文明。"',response:'尚未收到回复。',analysis:'OGLE-2016-BLG-1195是一颗距离地球约13000光年的恒星，其行星OGLE-2016-BLG-1195b被发现位于宜居带。XENOCOM认为，即使该行星存在文明且正在经历危机，人类能够在13000年后提供帮助的可能性几乎为零。但这条信息本身的意义大于实际效果——它表达了人类愿意在宇宙中传播善意和互助精神的愿望。'},{name:'HD 164922 数学桥梁',direction:'📤📥 双向',date:'2049-07-01',target:'HD 164922',content:'人类: "我们使用数字沟通。1+1=2, 2+2=4, 4+4=8..." HD 164922: "[确认] 数学是通用的。我们也使用数字。1+1=10（二进制）..."',response:'数学基础交流成功。双方开始讨论进制系统的差异。',analysis:'HD 164922是一颗距离地球约72光年的恒星。这条通讯是人类第一次与外星文明讨论数学基础问题。有趣的是，HD 164922似乎使用二进制而非十进制——这可能是因为他们的计算机技术采用了不同的架构，或者他们的生理结构更适合处理二进制信号。XENOCOM数学团队正在分析这一差异的文化和技术含义。'},{name:'OGLE-2014-BLG-0124 距离信息',direction:'📤 发出',date:'2049-07-15',target:'OGLE-2014-BLG-0124',content:'"我们测量距离使用光年——光在一年中走的距离。光速是每秒299,792公里。我们不知道你们使用什么单位，但这是我们理解宇宙的方式。"',response:'尚未收到回复。',analysis:'这条信息是有意为之的"距离校准"广播。许多外星文明可能使用完全不同的距离单位——有些可能使用"光星期"或"星系直径"，有些可能使用完全非线性的度量系统。通过详细介绍人类使用的单位，希望能够建立一套沟通距离的基础协议。'},{name:'OGLE-2005-SMG-562 能量利用',direction:'📤 发出',date:'2049-08-01',target:'OGLE-2005-SMG-562',content:'"我们正在学习如何更好地利用能源。我们目前主要使用化学能和核能。但我们梦想着有一天能够像你们一样利用恒星的全部能量。请告诉我们你们的能源技术。"',response:'尚未收到回复。',analysis:'这是人类第一次明确询问外星文明的能源技术。根据卡尔达肖夫文明分类，I型文明利用行星能源，II型文明利用恒星能源，III型文明利用星系能源。人类目前约为0.7型，正处于向I型文明过渡的阶段。这条信息表达了对更先进文明的渴望学习态度，同时也暗示了人类对II型文明能源技术的向往。'},{name:'OGLE-2006-BLG-453 安全协议',direction:'📤 发出',date:'2049-08-15',target:'OGLE-2006-BLG-453',content:'"我们承诺不主动攻击任何文明。我们相信和平是宇宙中所有智慧生命的共同愿望。如果你们同意，让我们建立一个和平通讯协议。我们可以首先交换无害的信息。"',response:'尚未收到回复。',analysis:'这是人类第一次向潜在的外星文明提出"和平协议"。该提案基于地球上的外交实践，包括：不主动攻击、不干涉内政、平等互利。如果得到外星文明的响应，这将建立一个人类与地外文明交流的框架。XENOCOM法律团队已经准备了多种应对方案，包括"友好"、"中立"和"警惕"三种回应模式。'},{name:'OGLE-2013-BLG-1024 时间概念',direction:'📤📥 双向',date:'2049-09-01',target:'OGLE-2013-BLG-1024',content:'人类: "我们测量时间使用秒、分钟、小时。一分钟有60秒，一小时有60分钟。我们的恒星太阳大约有50亿年的历史。" OGLE-2013-BLG-1024: "[时间数据] 我们测量使用"脉冲"。我们的母星脉冲一次=XXX秒。你们的太阳年龄=XXX脉冲..."',response:'时间单位转换成功。发现双方使用不同的时间度量系统。',analysis:'这是人类第一次与外星文明交换时间度量信息。发现对方使用"脉冲"作为时间单位，可能与他们的生理特征或居住环境有关。这种信息交换不仅建立了沟通的基础，还为了解外星文明的生活方式提供了线索。'},{name:'OGLE-2015-BLG-1779 宇宙观',direction:'📤 发出',date:'2049-09-15',target:'OGLE-2015-BLG-1779',content:'"我们的宇宙正在膨胀。科学家认为它始于约138亿年前的一次大爆炸。我们不知道大爆炸之前是什么，也许什么也没有，也许有其他宇宙。我们对宇宙的理解还很浅薄。"',response:'尚未收到回复。',analysis:'这是人类第一次向外星文明分享宇宙学知识。尽管大爆炸理论在地球科学界被广泛接受，但这并不意味着它在宇宙中是"正确"的。通过分享这些知识，人类实际上是在展示自己的科学水平，同时也表达了对宇宙的敬畏和好奇心。'},{name:'HD 209458 探测技术',direction:'📤📥 双向',date:'2049-10-01',target:'HD 209458',content:'人类: "我们使用望远镜和探测器研究宇宙。我们已经向太阳系外发射了旅行者号探测器。它们携带着人类的信息和音乐。" HD 209458: "[信息确认] 旅行者... 探测器... 它们目前在哪里？它们的能量还能维持多久？"',response:'HD 209458对人类探测器表现出浓厚兴趣。',analysis:'HD 209458是一颗距离地球约159光年的恒星，其行星HD 209458b是第一颗被发现有大气层的系外行星。该文明对旅行者号探测器的询问表明他们对人类的技术能力有一定了解——可能他们已经能够探测到旅行者号的位置。这条信息交换揭示了一个令人不安的可能性：外星文明可能一直在监测人类的深空探测器。'},{name:'PSR B1257+12 脉冲星通讯',direction:'📤📥 双向',date:'2049-10-15',target:'PSR B1257+12',content:'人类: "你们的脉冲信号非常规律。我们很好奇——这是自然现象还是有意为之？" PSR B1257+12: "[复杂信号] 不是自然... 我们是... 机器... 很久以前... 建造者已离开..."',response:'PSR B1257+12是一颗脉冲星。回复表明信号来自远古文明的机器。',analysis:'PSR B1257+12是一颗位于银河系另一侧的脉冲星，距离地球约2300光年。如果这条回复是真实的，那将是人类第一次与"死者"文明通讯——一个已经消亡但其自动机器仍在运行的文明。这种"数字遗产"的概念与VEGA-III可能已进入"后物理"阶段的假说相呼应。'},{name:'VEGA 再次尝试联系',direction:'📤 发出',date:'2049-11-01',target:'VEGA星系',content:'"亲爱的VEGA-III文明，我们收到了你们的警告。虽然你们说不会再发送信息，但我们想让你知道，我们听从了你们的建议。我们正在保持安静。我们希望有一天能再次收到你们的信息。如果有其他文明在监听，请告诉他们如何保持安全。"',response:'VEGA星系方向未检测到任何回复。但该信息可能被其他文明接收。',analysis:'这是人类在VEGA-III警告后第三次尝试与该文明联系。尽管VEGA-III明确表示不会再发送信息，但XENOCOM认为值得继续尝试——也许他们只是"保持沉默"而非"完全消失"。更重要的是，该信息可能被其他监听VEGA星系的文明接收到，从而传播地球的善意。'},{name:'GJ-667C 文明发展咨询',direction:'📤📥 双向',date:'2049-11-15',target:'GJ-667C',content:'人类: "我们的文明正在经历技术快速发展带来的挑战。人工智能、基因编辑、气候变化——我们不确定如何正确处理这些问题。你们是如何应对的？" GJ-667C: "[序列] 我们也经历了类似阶段... 我们选择... 集体意识... 不是强制... 是自愿..."',response:'GJ-667C提供了关于文明发展的建议。',analysis:'GJ-667C是一颗距离地球约23光年的恒星。这是人类第一次向外星文明"咨询"关于文明发展的建议。对方的回复提到"集体意识"概念，这可能是他们解决内部矛盾的方式。虽然目前尚不清楚这种"集体意识"是技术强制还是自愿选择，但这为人类提供了一个新的思考方向。'},{name:'HD 219134 时间旅行讨论',direction:'📤📥 双向',date:'2049-12-01',target:'HD 219134',content:'人类: "我们的科学家正在研究时间。我们不确定时间是否可以操控。你们知道时间的本质吗？" HD 219134: "[数据] 时间... 像是河流... 可以减缓... 难以倒流... 你们实验室的异常... 谨慎..."',response:'HD 219134暗示了时间操控的可能性，并提到了项目Chronos异常。',analysis:'HD 219134是一颗距离地球约21光年的恒星。他们的回复暗示时间可能"可以减缓但难以倒流"，这与人类物理学家对时间的理解基本一致。更令人震惊的是，他们提到了XENOCOM的"项目Chronos异常"——这意味着要么他们在监听地球通讯，要么他们在宇宙中有其他信息来源。'},{name:'OGLE-2005-SMG-558 宗教与文明',direction:'📤 发出',date:'2049-12-15',target:'OGLE-2005-SMG-558',content:'"我们的星球上有许多不同的宗教和信仰体系。我们想知道，其他文明是否也有类似的精神追求？你们如何理解宇宙中的存在意义？"',response:'尚未收到回复。',analysis:'这是人类第一次向外星文明询问宗教和精神层面的问题。这类问题在地球内部尚存争议，更不用说与外星文明讨论了。但XENOCOM认为，如果人类想要真正"理解"一个文明，了解他们的信仰体系是至关重要的。这条信息经过了人类宗教学家和哲学家的审核，确保问题的措辞不会冒犯任何可能的宗教信仰。'},{name:'Gliese 581 友好探测',direction:'📤📥 双向',date:'2049-12-20',target:'Gliese 581',content:'人类: "我们向你们发送一组图片。这是从太空看到的地球、海洋、山脉、沙漠、森林和城市。这是我们的家园。" Gliese 581: "[图像确认] 我们看到了... 蓝色... 绿色... 你们的星球很美。很高兴知道在宇宙中有一个这样美丽的家园。"',response:'Gliese 581对地球图片表示赞赏。',analysis:'Gliese 581是一颗距离地球约20光年的红矮星。它是人类第一次收到外星文明对地球图片直接评价的星球。这条回复充满了"审美"情感——他们对地球的"美丽"表示赞赏。这暗示外星文明可能也拥有类似人类的审美观和情感反应。'},{name:'HD 10180 生态系统信息',direction:'📤 发出',date:'2049-12-25',target:'HD 10180',content:'"我们的星球有丰富多样的生命。微生物、植物、动物、人类——所有这些都是数十亿年进化的结果。我们分享这些信息，希望能让你们了解地球生命的独特性。"',response:'尚未收到回复。',analysis:'这是人类第一次向外星文明详细描述地球的生态系统。从微生物到人类，地球生命的多样性是宇宙中罕见的。虽然目前尚不清楚外星生命的形态是否与地球类似，但这条信息提供了一个了解地球生命多样性的窗口。XENOCOM生物学家团队精心准备了这份信息，力求以最客观的方式呈现地球生命的多样性。'},{name:'HD 40307 艺术交流',direction:'📤📥 双向',date:'2050-01-01',target:'HD 40307',content:'人类: "我们向你们发送一组艺术作品。这是绘画、雕塑和建筑的图片。艺术是我们表达情感和想法的方式。" HD 40307: "[回应] 我们也有类似... 这里有一个示例... [外星艺术形式]"',response:'首次接收到外星艺术形式。',analysis:'HD 40307是一颗距离地球约42光年的恒星。人类第一次收到外星艺术作品作为回复。这种"艺术交换"可能是未来人类与外星文明文化交流的起点。虽然我们尚不能完全理解外星艺术形式的含义，但这种交换本身就是一种沟通和理解的开始。XENOCOM已成立专门团队研究外星艺术形式。'},{name:'HD 156668 战争与和平',direction:'📤📥 双向',date:'2050-01-15',target:'HD 156668',content:'人类: "我们的历史上有过战争。我们想知道，其他文明是否也有过类似的冲突？你们是如何解决的？" HD 156668: "[长期数据] 我们也有过... 痛苦... 最终我们明白... 合作优于竞争... 现在我们是一个整体..."',response:'HD 156668分享了他们从冲突到和平的历程。',analysis:'HD 156668是一颗距离地球约78光年的恒星。这个文明分享了他们从冲突到和平的历史经验，最终走向了"一个整体"。虽然具体细节尚不清楚，但这种"从冲突到合作"的叙事与人类历史的发展方向类似。这为人类提供了一面镜子，也暗示了文明发展的某种普遍规律。'},{name:'HD 1461 科学技术',direction:'📤 发出',date:'2050-02-01',target:'HD 1461',content:'"我们目前的技术水平大约是卡尔达肖夫尺度的0.7型。我们能够利用核能、建造空间站、连接全球互联网。我们正在研究量子计算和可控核聚变。你们的技术发展路径是怎样的？"',response:'尚未收到回复。',analysis:'这是人类第一次向外星文明详细描述自己的技术水平。通过分享具体的科技成就（如核能、空间站、互联网、量子计算和核聚变），人类实际上是在展示自己的文明发展水平。这种"技术简历"可能帮助外星文明判断人类的发展阶段和潜力。'},{name:'HD 10180 未来展望',direction:'📤📥 双向',date:'2050-02-15',target:'HD 10180',content:'人类: "我们对未来有很多梦想。我们想要探索宇宙、了解宇宙的奥秘、与不同的文明交流。你们有什么梦想吗？" HD 10180: "[长期序列] 我们的梦想... 是理解一切的源头... 那个创造一切的... 我们称它为"起源"..."',response:'HD 10180提到了他们的终极追求——"起源"。',analysis:'HD 10180的回复提到了一个耐人寻味的概念——"起源"。这可能是他们对宇宙诞生或更高层次存在的称呼。这个词汇的语义学分析显示，它可能具有某种宗教或哲学色彩，暗示这个文明可能已经思考了宇宙和存在的终极问题。'},{name:'OGLE-2018-BLG-0013 人工智能讨论',direction:'📤📥 双向',date:'2050-03-01',target:'OGLE-2018-BLG-0013',content:'人类: "我们的AI正在变得越来越强大。我们不确定这是好事还是坏事。你们有类似的技术吗？你们是如何处理的？" OGLE-2018-BLG-0013: "[序列] 我们也有... AI... 它已经成为我们的一部分... 不是威胁... 是进化..."',response:'OGLE-2018-BLG-0013认为AI是进化的伙伴而非威胁。',analysis:'OGLE-2018-BLG-0013是一个距离地球约20000光年的遥远文明。他们的观点与人类目前对AI的担忧形成了鲜明对比——他们认为AI不是威胁，而是进化的必然结果。这暗示他们可能已经走过了人类正在经历的"AI焦虑期"，并找到了与AI和谐共处的方式。'},{name:'HD 219134 时间旅行讨论',direction:'📤📥 双向',date:'2050-03-15',target:'HD 219134',content:'人类: "我们的科学家正在研究时间旅行。我们不知道这是否可能。你们知道时间旅行技术吗？" HD 219134: "[数据] 时间... 不能倒流... 但可以循环... 像是一条咬住自己尾巴的蛇..."',response:'HD 219134描述了时间循环而非时间倒流的概念。',analysis:'HD 219134对时间的理解与人类物理学的某些理论不谋而合——时间循环可能是比时间倒流更可行的概念。在广义相对论中，闭合类时间曲线（CTC）允许时间线形成循环。虽然目前人类尚未发现任何自然存在的CTC，但如果文明掌握了创造人工CTC的技术，理论上可以实现"时间循环"而非"时间倒流"。'},{name:'Gliese 667C 多文明共存',direction:'📤📥 双向',date:'2050-04-01',target:'Gliese 667C',content:'人类: "在我们的星系中，有多个国家共存。有时会有冲突。你们呢？你们是单一文明还是多个文明？" Gliese 667C: "[序列] 我们曾经是很多... 现在是一个... 过程很漫长... 很痛苦... 但结果是值得的..."',response:'Gliese 667C暗示他们经历了多文明合并的过程。',analysis:'Gliese 667C的回复暗示他们的星系经历了类似欧洲一体化的过程——多个独立文明最终合并为一个整体。这个过程可能是通过和平方式实现的，也可能是通过某种形式的"强制统一"。无论如何，这个信息对人类来说既是希望也是警告——它表明多文明共存可能是可以实现的，但过程可能充满挑战。'},{name:'HD 69830 能源技术',direction:'📤 发出',date:'2050-04-15',target:'HD 69830',content:'"我们的能源主要来自太阳和核裂变。我们正在研究核聚变——一种在地球上模拟恒星的方法。你们使用什么能源？"',response:'尚未收到回复。',analysis:'HD 69830是一颗距离地球约41光年的恒星。这条广播询问外星文明的能源技术，旨在收集不同文明的技术发展路径信息。核聚变能源被称为"人类的圣杯"——一旦实现，将提供几乎无限的清洁能源。如果外星文明已经实现了核聚变，他们的回复将为人类提供宝贵的参考。'},{name:'OGLE-2019-BLG-0037 黑洞能源',direction:'📤📥 双向',date:'2050-05-01',target:'OGLE-2019-BLG-0037',content:'人类: "我们发现黑洞周围有很强的引力场。我们想知道，是否有可能利用黑洞的引力来获取能源？" OGLE-2019-BLG-0037: "[序列] 你们发现了... 这很好... 黑洞是天然的能源... 但要小心... 引力很强... 一旦进去... 就出不来了..."',response:'OGLE-2019-BLG-0037确认黑洞是能源来源，但警告危险。',analysis:'OGLE-2019-BLG-0037确认了利用黑洞能源的可能性，这与人类理论物理学家提出的"彭罗斯过程"和"黑洞餐巾环"概念一致。如果文明能够安全地从黑洞中提取能量，他们将获得几乎无限的能源供应——一个中等质量黑洞每秒可以产生10^40焦耳的能量，相当于数十亿颗恒星的总输出。'}];
        document.getElementById('txList').innerHTML=transmissions.map(t=>`<div class="tx-card"><div class="tx-header"><span class="tx-direction">${t.direction}</span><div class="tx-info"><div class="tx-name">${t.name}</div><div class="tx-date">📅 ${t.date} | 🎯 ${t.target}</div></div></div><div class="tx-body"><div class="message-box">${t.content}</div><p><strong>后续：</strong>${t.response}</p><p style="color:var(--star-muted);">${t.analysis}</p></div></div>`).join('');
