        let activeCat = 'all';

        function renderProducts() {
            const filtered = activeCat === 'all' ? allCakes : allCakes.filter(c => c.category === activeCat);
            document.getElementById('productsGrid').innerHTML = filtered.map((c, i) => `
            <div class="product-card" style="animation: fadeIn 0.5s ease ${i*0.04}s both;" onclick="window.location.href='cake_detail.html?name=${encodeURIComponent(c.name)}'">
              <div class="product-img" style="background-image:url('${c.img}'); background-color:#fce4ec;">
                ${c.badge ? `<span class="product-badge badge-${c.badge}">${c.badgeText}</span>` : ''}
              </div>
              <div class="product-info">
                <div class="product-name">${c.name}</div>
                <div class="product-desc">${c.desc}</div>
                <div class="product-meta">
                  <span class="product-price">¥${c.price}<span class="original">¥${c.originalPrice}</span></span>
                  <button class="add-btn" onclick="event.stopPropagation();alert('已加入购物车！🛒')">+</button>
                </div>
              </div>
            </div>
          `).join('');
        }

        document.getElementById('filterBar').addEventListener('click', function(e) {
            if (e.target.classList.contains('filter-chip')) {
                document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
                e.target.classList.add('active');
                activeCat = e.target.dataset.cat;
                renderProducts();
            }
        });

        const urlP = new URLSearchParams(window.location.search);
        if (urlP.get('cat')) {
            activeCat = urlP.get('cat');
            document.querySelectorAll('.filter-chip').forEach(c => {
                c.classList.remove('active');
                if (c.dataset.cat === activeCat) c.classList.add('active');
            });
        }
        renderProducts();

        const style = document.createElement('style');
        style.textContent =
            '@keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}';
        document.head.appendChild(style);
    </script>
