<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>图鉴库 · CritterPedia</title>
    <style>
        :root {
            --bg-sky: #e8f4fd;
            --bg-card: #ffffff;
            --accent-coral: #ff6b6b;
            --accent-sunny: #ffd93d;
            --accent-mint: #6bcb77;
            --accent-lavender: #a66cff;
            --accent-skyblue: #4d96ff;
            --accent-peach: #ffb27f;
            --accent-bubblegum: #ff85a1;
            --text-dark: #3d2c2c;
            --text-medium: #5c4a4a;
            --text-light: #8a7a7a;
            --shadow-soft: 0 6px 20px rgba(0, 0, 0, 0.08);
            --shadow-bouncy: 0 6px 0 rgba(0, 0, 0, 0.12);
            --shadow-float: 0 10px 30px rgba(0, 0, 0, 0.12);
            --radius-xl: 2rem;
            --radius-lg: 1.5rem;
            --radius-md: 1rem;
            --transition-bounce: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            --font-title: 'Fredoka One', 'Comic Sans MS', cursive, sans-serif;
            --font-body: 'Nunito', 'Segoe UI', sans-serif;
            --font-fun: 'Bubblegum Sans', 'Comic Sans MS', cursive;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: var(--font-body);
            background: var(--bg-sky);
            background-image:
                radial-gradient(ellipse at 25% 10%, rgba(255, 217, 61, 0.12) 0%, transparent 40%),
                radial-gradient(ellipse at 75% 30%, rgba(166, 108, 255, 0.08) 0%, transparent 40%),
                url("data:image/svg+xml,%3Csvg width='40' height='40' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='20' cy='20' r='1.5' fill='%23ffffff' opacity='0.4'/%3E%3C/svg%3E");
            color: var(--text-dark);
            min-height: 100vh;
            padding-bottom: 4rem;
            position: relative;
            overflow-x: hidden;
        }
        .navbar {
            position: sticky;
            top: 10px;
            margin: 10px 18px;
            padding: 0.7rem 1.8rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            border: 3px solid #e0e8f0;
            border-radius: 3.5rem;
            z-index: 100;
            flex-wrap: wrap;
            gap: 1rem;
            box-shadow: var(--shadow-soft);
        }
        .logo {
            font-family: var(--font-title);
            font-size: 1.4rem;
            color: var(--accent-coral);
            cursor: pointer;
        }
        .nav-links {
            display: flex;
            gap: 1rem;
            list-style: none;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: var(--text-medium);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 0.35rem 0.8rem;
            border-radius: 2rem;
            transition: all var(--transition-bounce);
        }
        .nav-links a:hover {
            background: var(--accent-sunny);
            transform: scale(1.06);
        }
        .nav-links a.active {
            background: var(--accent-skyblue);
            color: #fff;
            box-shadow: var(--shadow-bouncy);
        }
        .page-header {
            text-align: center;
            padding: 2.5rem 1rem 1rem;
        }
        .page-header h1 {
            font-family: var(--font-title);
            font-size: 2.5rem;
            color: var(--text-dark);
        }
        .page-header .fun-dots {
            display: flex;
            justify-content: center;
            gap: 0.3rem;
            margin: 0.5rem 0;
        }
        .fun-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: bounce 1.3s ease-in-out infinite;
        }
        @keyframes bounce {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }
        /* ── View Controls Bar ── */
        .view-controls {
            max-width: 1350px;
            margin: 0 auto 1rem;
            padding: 0 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            flex-wrap: wrap;
        }
        .controls-left, .controls-right {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
        }
        .btn-pill {
            padding: 0.5rem 1.1rem;
            border-radius: 2rem;
            border: 2px solid #e0e8f0;
            background: #fff;
            cursor: pointer;
            font-weight: 700;
            font-family: var(--font-body);
            font-size: 0.82rem;
            transition: all var(--transition-bounce);
            white-space: nowrap;
        }
        .btn-pill:hover {
            transform: scale(1.06);
            box-shadow: var(--shadow-soft);
        }
        .btn-pill.active {
            background: var(--accent-coral);
            color: #fff;
            border-color: var(--accent-coral);
            box-shadow: var(--shadow-bouncy);
        }
        .btn-pill.btn-mint {
            border-color: var(--accent-mint);
            color: var(--accent-mint);
        }
        .btn-pill.btn-mint:hover, .btn-pill.btn-mint.active {
            background: var(--accent-mint);
            color: #fff;
            border-color: var(--accent-mint);
            box-shadow: var(--shadow-bouncy);
        }
        .btn-pill.btn-lavender {
            border-color: var(--accent-lavender);
            color: var(--accent-lavender);
        }
        .btn-pill.btn-lavender:hover, .btn-pill.btn-lavender.active {
            background: var(--accent-lavender);
            color: #fff;
            border-color: var(--accent-lavender);
            box-shadow: var(--shadow-bouncy);
        }
        .btn-pill.btn-sunny {
            border-color: var(--accent-sunny);
            color: #e6a800;
        }
        .btn-pill.btn-sunny:hover {
            background: var(--accent-sunny);
            color: #3d2c2c;
            border-color: var(--accent-sunny);
            box-shadow: var(--shadow-bouncy);
            animation: wiggle 0.5s ease-in-out;
        }
        .btn-pill.btn-surprise {
            background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6bcb77, #a66cff, #4d96ff);
            background-size: 400% 400%;
            color: #fff;
            border: none;
            font-size: 0.9rem;
            padding: 0.55rem 1.3rem;
            animation: gradientShift 3s ease infinite;
        }
        .btn-pill.btn-surprise:hover {
            transform: scale(1.1);
            box-shadow: var(--shadow-float);
        }
        @keyframes gradientShift {
            0%{background-position:0% 50%}
            50%{background-position:100% 50%}
            100%{background-position:0% 50%}
        }
        @keyframes wiggle {
            0%,100%{transform:rotate(0)}
            25%{transform:rotate(-8deg)}
            75%{transform:rotate(8deg)}
        }
        .sort-select {
            padding: 0.5rem 0.8rem;
            border-radius: 2rem;
            border: 2px solid #e0e8f0;
            background: #fff;
            font-family: var(--font-body);
            font-weight: 700;
            font-size: 0.82rem;
            color: var(--text-dark);
            cursor: pointer;
            transition: all var(--transition-bounce);
        }
        .sort-select:focus {
            outline: none;
            border-color: var(--accent-lavender);
        }
        /* ── Animal Count Bar ── */
        .animal-count-bar {
            max-width: 1350px;
            margin: 0 auto 0.8rem;
            padding: 0 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-medium);
            font-weight: 700;
        }
        .animal-count-bar .count-num {
            color: var(--accent-coral);
            font-family: var(--font-title);
            font-size: 1.1rem;
        }
        /* ── Collection Stats Dashboard ── */
        .stats-dashboard {
            max-width: 1350px;
            margin: 0 auto 1.2rem;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.8rem;
        }
        .stat-card {
            background: #fff;
            border: 3px solid #e8eef5;
            border-radius: var(--radius-lg);
            padding: 1rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            box-shadow: var(--shadow-soft);
            transition: all var(--transition-bounce);
        }
        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-float);
        }
        .stat-card .stat-emoji {
            font-size: 2rem;
            flex-shrink: 0;
        }
        .stat-card .stat-info h4 {
            font-family: var(--font-title);
            font-size: 0.85rem;
            color: var(--text-medium);
        }
        .stat-card .stat-info .stat-val {
            font-family: var(--font-title);
            font-size: 1.3rem;
            color: var(--accent-coral);
        }
        /* ── Main Layout ── */
        .main-layout {
            display: flex;
            gap: 2rem;
            padding: 1rem 2rem;
            max-width: 1350px;
            margin: 0 auto;
        }
        .filter-sidebar {
            width: 240px;
            flex-shrink: 0;
            background: #fff;
            border: 3px solid #e8eef5;
            border-radius: var(--radius-xl);
            padding: 1.5rem;
            position: sticky;
            top: 110px;
            height: fit-content;
            box-shadow: var(--shadow-soft);
        }
        .filter-sidebar h3 {
            font-family: var(--font-title);
            color: var(--accent-lavender);
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }
        .filter-group {
            margin-bottom: 1.2rem;
        }
        .filter-group label {
            display: block;
            font-weight: 700;
            font-size: 0.8rem;
            color: var(--text-medium);
            margin-bottom: 0.3rem;
        }
        .filter-group select {
            width: 100%;
            padding: 0.55rem 0.7rem;
            border: 2px solid #e0e8f0;
            border-radius: var(--radius-md);
            font-family: var(--font-body);
            color: var(--text-dark);
            cursor: pointer;
            background: #fafcfe;
        }
        .rarity-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
        }
        .rarity-chip {
            padding: 0.3rem 0.6rem;
            border-radius: 2rem;
            font-size: 0.7rem;
            cursor: pointer;
            border: 2px solid #e0e8f0;
            background: #fff;
            font-weight: 700;
            transition: all var(--transition-bounce);
        }
        .rarity-chip.active {
            background: var(--accent-sunny);
            border-color: var(--accent-sunny);
            box-shadow: var(--shadow-bouncy);
        }
        .rarity-chip .chip-count {
            font-size: 0.62rem;
            opacity: 0.7;
            margin-left: 2px;
        }
        .habitat-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
        }
        .habitat-chip {
            padding: 0.25rem 0.55rem;
            border-radius: 2rem;
            font-size: 0.68rem;
            cursor: pointer;
            border: 2px solid #e0e8f0;
            background: #fff;
            font-weight: 700;
            transition: all var(--transition-bounce);
        }
        .habitat-chip.active {
            background: var(--accent-mint);
            border-color: var(--accent-mint);
            color: #fff;
            box-shadow: var(--shadow-bouncy);
        }
        .habitat-chip .chip-count {
            font-size: 0.6rem;
            opacity: 0.7;
            margin-left: 2px;
        }
        .animals-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.5rem;
            align-content: start;
        }
        /* ── List View ── */
        .animals-grid.list-view {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .animals-grid.list-view .animal-card {
            display: flex;
            flex-direction: row;
            text-align: left;
            padding: 0;
        }
        .animals-grid.list-view .animal-img-area {
            width: 130px;
            height: auto;
            min-height: 130px;
            flex-shrink: 0;
            font-size: 3.5rem;
            border-radius: var(--radius-lg) 0 0 var(--radius-lg);
        }
        .animals-grid.list-view .animal-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0.3rem;
            padding: 1rem 1.5rem;
        }
        .animals-grid.list-view .animal-body h3 {
            margin-bottom: 0;
        }
        .animals-grid.list-view .animal-body .animal-desc {
            font-size: 0.78rem;
            color: var(--text-light);
            line-height: 1.4;
        }
        /* ── Animal Card ── */
        .animal-card {
            background: #fff;
            border: 3px solid #e8eef5;
            border-radius: var(--radius-xl);
            overflow: hidden;
            cursor: pointer;
            transition: all var(--transition-bounce);
            box-shadow: var(--shadow-soft);
            text-align: center;
            position: relative;
        }
        .animal-card:hover {
            transform: translateY(-8px) rotate(-1deg);
            box-shadow: var(--shadow-float);
            border-color: var(--accent-coral);
        }
        .animal-card.shuffle-out {
            animation: shuffleOut 0.35s ease forwards;
        }
        .animal-card.shuffle-in {
            animation: shuffleIn 0.4s 0.05s ease backwards;
        }
        @keyframes shuffleOut {
            to { opacity: 0; transform: scale(0.85) translateY(20px) rotate(5deg); }
        }
        @keyframes shuffleIn {
            from { opacity: 0; transform: scale(0.85) translateY(-20px) rotate(-5deg); }
            to { opacity: 1; transform: scale(1) translateY(0) rotate(0); }
        }
        .animal-img-area {
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4.5rem;
            position: relative;
        }
        .animal-img-area .fav-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #fff;
            border: 2px solid #e0e8f0;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-size: 1rem;
            transition: all var(--transition-bounce);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }
        .animal-img-area .fav-btn:hover {
            transform: scale(1.2);
            border-color: var(--accent-coral);
        }
        .animal-img-area .fav-btn.fav-boom {
            animation: favBoom 0.5s ease;
        }
        @keyframes favBoom {
            0% { transform: scale(1); }
            30% { transform: scale(1.6); }
            100% { transform: scale(1); }
        }
        .animal-img-area .info-btn {
            position: absolute;
            top: 8px;
            left: 8px;
            background: #fff;
            border: 2px solid #e0e8f0;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all var(--transition-bounce);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }
        .animal-img-area .info-btn:hover {
            transform: scale(1.2);
            border-color: var(--accent-skyblue);
        }
        .animal-body {
            padding: 1rem 1.2rem 1.2rem;
        }
        .animal-body h3 {
            font-family: var(--font-title);
            font-size: 1.2rem;
            margin-bottom: 0.3rem;
        }
        .animal-body .type-badge {
            display: inline-block;
            padding: 0.2rem 0.7rem;
            border-radius: 2rem;
            font-size: 0.68rem;
            font-weight: 700;
            margin: 0.3rem 0;
        }
        .badge-mammal {
            background: #fff3e0;
            color: #e65100;
        }
        .badge-bird {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .badge-reptile {
            background: #fce4ec;
            color: #c62828;
        }
        .badge-marine {
            background: #e3f2fd;
            color: #1565c0;
        }
        .badge-insect {
            background: #f3e5f5;
            color: #7b1fa2;
        }
        .stat-mini {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            margin-top: 0.5rem;
            font-size: 0.75rem;
            color: var(--text-light);
        }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.4rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }
        .page-btn {
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            background: #fff;
            border: 2px solid #e0e8f0;
            cursor: pointer;
            font-weight: 700;
            font-family: var(--font-body);
            transition: all var(--transition-bounce);
        }
        .page-btn.active {
            background: var(--accent-coral);
            color: #fff;
            border-color: var(--accent-coral);
            box-shadow: var(--shadow-bouncy);
        }
        .page-btn:hover:not(.active) {
            background: var(--accent-sunny);
            border-color: var(--accent-sunny);
            transform: scale(1.08);
        }
        /* ── Quick Preview Modal ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .modal-popup {
            background: #fff;
            border-radius: var(--radius-xl);
            padding: 2rem;
            max-width: 420px;
            width: 90%;
            text-align: center;
            box-shadow: var(--shadow-float);
            animation: modalPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }
        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.8) translateY(30px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-popup .modal-emoji {
            font-size: 5rem;
        }
        .modal-popup .modal-close {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light);
            transition: all var(--transition-bounce);
        }
        .modal-popup .modal-close:hover {
            color: var(--accent-coral);
            transform: scale(1.2);
        }
        .modal-popup .modal-name {
            font-family: var(--font-title);
            font-size: 1.6rem;
            margin: 0.5rem 0;
        }
        .modal-popup .modal-stats {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 0.8rem 0;
        }
        .modal-popup .modal-stat {
            text-align: center;
        }
        .modal-popup .modal-stat .ms-val {
            font-family: var(--font-title);
            font-size: 1.3rem;
            color: var(--accent-coral);
        }
        .modal-popup .modal-stat .ms-label {
            font-size: 0.7rem;
            color: var(--text-light);
        }
        .modal-popup .modal-meta {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin: 0.8rem 0;
        }
        .modal-popup .modal-meta span {
            padding: 0.25rem 0.7rem;
            border-radius: 2rem;
            font-size: 0.72rem;
            font-weight: 700;
        }
        .modal-popup .modal-desc {
            color: var(--text-medium);
            font-size: 0.88rem;
            line-height: 1.5;
        }
        .modal-popup .modal-goto {
            margin-top: 1rem;
            padding: 0.6rem 1.5rem;
            border-radius: 2rem;
            background: var(--accent-skyblue);
            color: #fff;
            border: none;
            font-weight: 700;
            font-family: var(--font-body);
            cursor: pointer;
            font-size: 0.9rem;
            transition: all var(--transition-bounce);
        }
        .modal-popup .modal-goto:hover {
            transform: scale(1.06);
            box-shadow: var(--shadow-bouncy);
        }
        /* ── Empty State ── */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-light);
        }
        .empty-state .empty-emoji {
            font-size: 5rem;
            animation: bounce 1.5s ease-in-out infinite;
        }
        .empty-state h3 {
            font-family: var(--font-title);
            margin: 1rem 0 0.5rem;
            color: var(--text-medium);
        }
        .empty-state p {
            font-size: 0.9rem;
        }
        /* ── Confetti ── */
        .confetti-piece {
            position: fixed;
            z-index: 300;
            pointer-events: none;
            animation: confettiFall 1.5s ease-out forwards;
        }
        @keyframes confettiFall {
            0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg) scale(0); opacity: 0; }
        }
        /* ── Floating Emoji Particles ── */
        .emoji-particle {
            position: fixed;
            z-index: 50;
            pointer-events: none;
            animation: floatUp 3s ease-out forwards;
            font-size: 1.5rem;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) translateX(0) scale(1); opacity: 0.9; }
            50% { opacity: 1; }
            100% { transform: translateY(-300px) translateX(var(--drift)) scale(0); opacity: 0; }
        }
        /* ── Surprise Reveal Overlay ── */
        .surprise-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 250;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }
        .surprise-card {
            background: #fff;
            border-radius: var(--radius-xl);
            padding: 2.5rem 2rem;
            text-align: center;
            max-width: 380px;
            width: 90%;
            box-shadow: var(--shadow-float);
            animation: surpriseReveal 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes surpriseReveal {
            0% { transform: rotateY(180deg) scale(0.5); opacity: 0; }

            else if (currentSort === 'cuteness-desc') arr.sort((a, b) => b.cuteness - a.cuteness);
            else if (currentSort === 'cuteness-asc') arr.sort((a, b) => a.cuteness - b.cuteness);
            else if (currentSort === 'friendliness-desc') arr.sort((a, b) => b.friendliness - a.friendliness);
            else if (currentSort === 'friendliness-asc') arr.sort((a, b) => a.friendliness - b.friendliness);
            else if (currentSort === 'rarity-asc') {
                const ranks = { common: 0, rare: 1, legendary: 2 };
                arr.sort((a, b) => ranks[a.rarity] - ranks[b.rarity]);
            } else if (currentSort === 'rarity-desc') {
                const ranks = { common: 0, rare: 1, legendary: 2 };
                arr.sort((a, b) => ranks[b.rarity] - ranks[a.rarity]);
            }
            return arr;
        }

        // ── Confetti ──
        function spawnConfetti(x, y) {
            const colors = ['#ff6b6b','#ffd93d','#6bcb77','#a66cff','#4d96ff','#ffb27f','#ff85a1','#00d2ff'];
            for (let i = 0; i < 25; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.left = x + 'px';
                piece.style.top = y + 'px';
                piece.style.width = (6 + Math.random() * 8) + 'px';
                piece.style.height = (6 + Math.random() * 8) + 'px';
                piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                piece.style.animationDuration = (1 + Math.random() * 2) + 's';
                piece.style.animationDelay = Math.random() * 0.2 + 's';
                piece.style.transform = 'translateX(' + ((Math.random() - 0.5) * 200) + 'px)';
                document.body.appendChild(piece);
                setTimeout(() => piece.remove(), 2500);
            }
        }

        // ── Floating emoji particles ──
        function spawnParticles(emoji, x, y) {
            for (let i = 0; i < 6; i++) {
                const p = document.createElement('span');
                p.className = 'emoji-particle';
                p.textContent = emoji;
                p.style.left = x + 'px';
                p.style.top = y + 'px';
                p.style.setProperty('--drift', ((Math.random() - 0.5) * 160) + 'px');
                p.style.animationDuration = (2 + Math.random() * 2) + 's';
                p.style.animationDelay = Math.random() * 0.3 + 's';
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 4000);
            }
        }

        // ── Quick Preview Modal ──
        function showPreview(animal, ev) {
            ev.stopPropagation();
            const overlay = document.getElementById('previewModal');
            overlay.innerHTML = `
            <div class="modal-popup">
              <button class="modal-close" onclick="closePreview()">✕</button>
              <div class="modal-emoji">${animal.emoji}</div>
              <h2 class="modal-name">${animal.name}</h2>
              <div class="modal-stats">
                <div class="modal-stat"><div class="ms-val">${animal.cuteness}</div><div class="ms-label">可爱度</div></div>
                <div class="modal-stat"><div class="ms-val">${animal.friendliness}</div><div class="ms-label">友好度</div></div>
              </div>
              <div class="modal-meta">
                <span class="type-badge badge-${animal.type}">${animal.type==='mammal'?'哺乳':animal.type==='bird'?'鸟类':animal.type==='reptile'?'爬行':animal.type==='marine'?'海洋':'昆虫'}</span>
                <span style="background:${animal.rarity==='legendary'?'#fce4ec':animal.rarity==='rare'?'#fff8e1':'#f5f5f5'};color:${animal.rarity==='legendary'?'#c62828':animal.rarity==='rare'?'#e65100':'#6d6d6d'};">${animal.rarity==='legendary'?'💎 传说':animal.rarity==='rare'?'🌟 稀有':'⭐ 常见'}</span>
              </div>
              <p class="modal-desc">${animal.desc}</p>
              <button class="modal-goto" onclick="window.location.href='critter_detail.html?animal=${animal.id}'">🔍 查看完整详情</button>
            </div>`;
            overlay.style.display = 'flex';
            overlay.addEventListener('click', function(e) { if (e.target === overlay) closePreview(); });
        }

        window.closePreview = function() {
            document.getElementById('previewModal').style.display = 'none';
            document.getElementById('previewModal').innerHTML = '';
        };

        // ── Surprise Me ──
        function surpriseMe() {
            const arr = getFiltered();
            if (arr.length === 0) return;
            const animal = arr[Math.floor(Math.random() * arr.length)];
            const overlay = document.getElementById('surpriseOverlay');
            overlay.innerHTML = `
            <div class="surprise-card">
              <div class="surprise-emoji">${animal.emoji}</div>
              <h3>🎉 ${animal.name}</h3>
              <p style="color:var(--text-medium);">${animal.desc}</p>
              <div style="margin-top:0.5rem;">
                <span class="type-badge badge-${animal.type}">${animal.type==='mammal'?'哺乳':animal.type==='bird'?'鸟类':animal.type==='reptile'?'爬行':animal.type==='marine'?'海洋':'昆虫'}</span>
              </div>
              <div class="surprise-btns">
                <button class="btn-pill" onclick="closeSurprise();surpriseMe();">🔄 再来一次！</button>
                <button class="btn-pill btn-mint" onclick="window.location.href='critter_detail.html?animal=${animal.id}'">🔍 查看详情</button>
                <button class="btn-pill btn-lavender" onclick="closeSurprise();toggleFav('${animal.id}');">${favorites.includes(animal.id)?'💔 取消收藏':'❤️ 收藏'}</button>
              </div>
              <button class="modal-close" style="position:absolute;top:12px;right:16px;background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--text-light);" onclick="closeSurprise()">✕</button>
            </div>`;
            overlay.style.display = 'flex';
            overlay.addEventListener('click', function(e) { if (e.target === overlay) closeSurprise(); });
        }

        window.closeSurprise = function() {
            document.getElementById('surpriseOverlay').style.display = 'none';
            document.getElementById('surpriseOverlay').innerHTML = '';
            renderAnimals();
        };

        // ── Render Animals ──
        function renderAnimals() {
            const filtered = getFiltered();
            const totalPages = Math.ceil(filtered.length / itemsPerPage);
            if (currentPage > totalPages) currentPage = Math.max(1, totalPages);
            const start = (currentPage - 1) * itemsPerPage;
            const items = filtered.slice(start, start + itemsPerPage);
            const grid = document.getElementById('animalsGrid');

            // Set view mode class
            grid.className = 'animals-grid' + (currentViewMode === 'list' ? ' list-view' : '');

            if (items.length === 0) {
                if (showFavoritesOnly && favorites.length === 0) {
                    grid.innerHTML = `<div class="empty-state">
                      <div class="empty-emoji">💝</div>
                      <h3>还没有收藏任何动物呢！</h3>
                      <p>点击小动物卡片上的 <span style="font-size:1.2rem;">🤍</span> 按钮把它们加入你的收藏吧~</p>
                      <button class="btn-pill btn-mint" style="margin-top:1rem;" onclick="document.getElementById('favsToggleBtn').click();">🔙 返回全部动物</button>
                    </div>`;
                } else if (showFavoritesOnly) {
                    grid.innerHTML = `<div class="empty-state">
                      <div class="empty-emoji">🔍</div>
                      <h3>当前筛选下没有收藏的动物</h3>
                      <p>试试调整筛选条件，或去发现更多小动物吧~</p>
                    </div>`;
                } else {
                    grid.innerHTML = `<div class="empty-state">
                      <div class="empty-emoji">🔍</div>
                      <h3>没有找到匹配的动物</h3>
                      <p>试试调整筛选条件吧~</p>
                    </div>`;
                }
            } else {
                grid.innerHTML = items.map((a, i) => {
                    const isFav = favorites.includes(a.id);
                    const descPreview = a.desc.length > 30 ? a.desc.slice(0, 30) + '...' : a.desc;
                    return `
            <div class="animal-card shuffle-in" style="animation-delay:${i*0.04}s;" onclick="window.location.href='critter_detail.html?animal=${a.id}'">
              <div class="animal-img-area" style="background:${a.rarity==='legendary'?'#fce4ec':a.rarity==='rare'?'#fff8e1':'#f5f5f5'};">
                <button class="info-btn" onclick="showPreview(animalsData.find(x=>x.id==='${a.id}'), event)" title="快速预览">ℹ️</button>
                <span>${a.emoji}</span>
                <button class="fav-btn" onclick="event.stopPropagation();toggleFav('${a.id}', event)">${isFav?'❤️':'🤍'}</button>
              </div>
              <div class="animal-body">
                <h3>${a.name}</h3>
                <span class="type-badge badge-${a.type}">${a.type==='mammal'?'哺乳':a.type==='bird'?'鸟类':a.type==='reptile'?'爬行':a.type==='marine'?'海洋':'昆虫'}</span>
                <div class="stat-mini">
                  <span>可爱度 ${'⭐'.repeat(Math.round(a.cuteness/20))}</span>
                  <span>友好度 ${'💛'.repeat(Math.round(a.friendliness/20))}</span>
                </div>
                ${currentViewMode === 'list' ? '<div class="animal-desc">' + descPreview + '</div>' : ''}
              </div>
            </div>`;
                }).join('');
            }

            // Update animal count bar
            document.getElementById('animalCountBar').innerHTML = '显示 <span class="count-num">' + items.length + '</span> / <span class="count-num">' + filtered.length + '</span> 只动物';

            // Pagination
            const pagDiv = document.getElementById('pagination');
            if (totalPages <= 1) { pagDiv.innerHTML = ''; } else {
                let h = '';
                for (let p = 1; p <= totalPages; p++)
                    h +=
                    `<button class="page-btn ${p===currentPage?'active':''}" data-p="${p}">${p}</button>`;
                pagDiv.innerHTML = h;
                pagDiv.querySelectorAll('.page-btn').forEach(b => b.addEventListener('click', function() {
                    currentPage = parseInt(this.dataset.p);
                    renderAnimals();
                    window.scrollTo({ top: 250, behavior: 'smooth' });
                }));
            }

            updateStats();
        }

        window.toggleFav = function(id, event) {
            const wasFav = favorites.includes(id);
            if (wasFav) favorites = favorites.filter(f => f !== id);
            else favorites.push(id);
            localStorage.setItem('critterFavs', JSON.stringify(favorites));

            // Confetti on add
            if (!wasFav && event) {
                spawnConfetti(event.clientX, event.clientY);
                const animal = animalsData.find(a => a.id === id);
                if (animal) spawnParticles(animal.emoji, event.clientX, event.clientY);
            }

            renderAnimals();
        };

        // ── Event Listeners ──
        document.getElementById('typeFilter').addEventListener('change', () => { currentPage = 1; renderAnimals(); });
        document.getElementById('habitatFilter').addEventListener('change', () => { currentPage = 1; activeHabitat = null; document.querySelectorAll('.habitat-chip').forEach(c => c.classList.remove('active')); renderAnimals(); });

        // Rarity chips
        document.getElementById('rarityChips').addEventListener('click', function(e) {
            if (e.target.classList.contains('rarity-chip')) {
                const r = e.target.dataset.rarity;
                if (activeRarity === r) { activeRarity = null; e.target.classList.remove('active'); }
                else { document.querySelectorAll('.rarity-chip').forEach(c => c.classList.remove('active')); activeRarity = r; e.target.classList.add('active'); }
                currentPage = 1;
                renderAnimals();
            }
        });

        // Habitat chips
        document.getElementById('habitatChips').addEventListener('click', function(e) {
            const chip = e.target.closest('.habitat-chip');
            if (!chip) return;
            const h = chip.dataset.habitat;
            if (activeHabitat === h) { activeHabitat = null; chip.classList.remove('active'); }
            else { document.querySelectorAll('.habitat-chip').forEach(c => c.classList.remove('active')); activeHabitat = h; chip.classList.add('active'); }
            document.getElementById('habitatFilter').value = activeHabitat || 'all';
            currentPage = 1;
            renderAnimals();
        });

        // Reset
        document.getElementById('resetBtn').addEventListener('click', () => {
            document.getElementById('typeFilter').value = 'all';
            document.getElementById('habitatFilter').value = 'all';
            activeRarity = null;
            activeHabitat = null;
            showFavoritesOnly = false;
            currentSort = 'default';
            document.getElementById('sortSelect').value = 'default';
            document.querySelectorAll('.rarity-chip').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.habitat-chip').forEach(c => c.classList.remove('active'));
            document.getElementById('favsToggleBtn').classList.remove('active');
            document.getElementById('favsToggleBtn').textContent = '❤️ 我的收藏';
            document.getElementById('gridViewBtn').classList.add('active');
            document.getElementById('listViewBtn').classList.remove('active');
            currentViewMode = 'grid';
            currentPage = 1;
            renderAnimals();
        });

        // Sort
        document.getElementById('sortSelect').addEventListener('change', function() {
            currentSort = this.value;
            currentPage = 1;
            renderAnimals();
        });

        // View mode toggle
        document.getElementById('gridViewBtn').addEventListener('click', function() {
            currentViewMode = 'grid';
            this.classList.add('active');
            document.getElementById('listViewBtn').classList.remove('active');
            currentPage = 1;
            renderAnimals();
        });
        document.getElementById('listViewBtn').addEventListener('click', function() {
            currentViewMode = 'list';
            this.classList.add('active');
            document.getElementById('gridViewBtn').classList.remove('active');
            currentPage = 1;
            renderAnimals();
        });
        // Set default active
        document.getElementById('gridViewBtn').classList.add('active');

        // Favorites toggle
        document.getElementById('favsToggleBtn').addEventListener('click', function() {
            showFavoritesOnly = !showFavoritesOnly;
            if (showFavoritesOnly) { this.classList.add('active'); this.textContent = '❤️ 收藏中 ✓'; }
            else { this.classList.remove('active'); this.textContent = '❤️ 我的收藏'; }
            currentPage = 1;
            renderAnimals();
        });

        // Surprise Me button
        document.getElementById('surpriseBtn').addEventListener('click', surpriseMe);

        // URL params
        const urlP = new URLSearchParams(window.location.search);
        if (urlP.get('type')) document.getElementById('typeFilter').value = urlP.get('type');
        if (urlP.get('search')) {
            const q = urlP.get('search').toLowerCase();
            const filtered = animalsData.filter(a => a.name.includes(q));
            document.getElementById('animalsGrid').innerHTML = filtered.length ? '' :
                '<p style="text-align:center;">未找到匹配动物 😿</p>';
        }

        // Init
        updateFilterBadges();
        updateStats();
        renderAnimals();

        const st = document.createElement('style');
        st.textContent =
            '@keyframes cardPop{from{opacity:0;transform:scale(0.9) translateY(15px)}to{opacity:1;transform:scale(1) translateY(0)}}';
        document.head.appendChild(st);

        // ── Spawn ambient floating particles periodically ──
        setInterval(() => {
            if (Math.random() > 0.7) {
                const emojis = ['🌟','✨','💫','🦋','🌸','🍃','💖','🪷'];
                const e = emojis[Math.floor(Math.random() * emojis.length)];
                const x = Math.random() * window.innerWidth;
                const y = window.innerHeight - 20;
                const p = document.createElement('span');
                p.className = 'emoji-particle';
                p.textContent = e;
                p.style.left = x + 'px';
                p.style.top = y + 'px';
                p.style.setProperty('--drift', ((Math.random() - 0.5) * 100) + 'px');
                p.style.animationDuration = (2.5 + Math.random() * 3) + 's';
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 5000);
            }
        }, 4000);
    </script>
</body>
</html>
