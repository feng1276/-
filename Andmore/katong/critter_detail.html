<!DOCTYPE html>

    <title>动物详情 · CritterPedia</title>
    <style>
        :root {
            --bg-sky: #e8f4fd; --bg-card: #ffffff;
            --accent-coral: #ff6b6b; --accent-sunny: #ffd93d; --accent-mint: #6bcb77;
            --accent-lavender: #a66cff; --accent-skyblue: #4d96ff;
            --accent-peach: #ffb27f; --accent-bubblegum: #ff85a1;
            --text-dark: #3d2c2c; --text-medium: #5c4a4a; --text-light: #8a7a7a;
            --shadow-soft: 0 6px 20px rgba(0,0,0,0.08);
            --shadow-bouncy: 0 6px 0 rgba(0,0,0,0.12);
            --shadow-float: 0 10px 30px rgba(0,0,0,0.12);
            --radius-xl: 2rem; --radius-lg: 1.5rem; --radius-md: 1rem; --radius-sm: 0.7rem;
            --transition-bounce: 0.3s cubic-bezier(0.34,1.56,0.64,1);
            --transition-smooth: 0.3s ease;
            --font-title: 'Fredoka One','Comic Sans MS',cursive,sans-serif;
            --font-body: 'Nunito','Segoe UI',sans-serif;
            --font-fun: 'Bubblegum Sans','Comic Sans MS',cursive;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior:smooth; font-size:16px; }
        body {
            font-family:var(--font-body); background:var(--bg-sky);
            background-image:radial-gradient(ellipse at 20% 10%,rgba(255,217,61,0.12) 0%,transparent 45%),radial-gradient(ellipse at 80% 15%,rgba(166,108,255,0.08) 0%,transparent 45%),radial-gradient(ellipse at 50% 80%,rgba(77,150,255,0.06) 0%,transparent 50%),url("data:image/svg+xml,%3Csvg width='50' height='50' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='25' cy='25' r='1.5' fill='%23ffffff' opacity='0.35'/%3E%3C/svg%3E");
            color:var(--text-dark); min-height:100vh; padding-bottom:4rem;
            overflow-x:hidden; -webkit-font-smoothing:antialiased;
        }
        .navbar { position:sticky; top:10px; margin:10px 18px; padding:0.7rem 1.8rem; display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,0.85); backdrop-filter:blur(15px); -webkit-backdrop-filter:blur(15px); border:3px solid #e0e8f0; border-radius:3.5rem; z-index:100; flex-wrap:wrap; gap:1rem; box-shadow:var(--shadow-soft); }
        .logo { font-family:var(--font-title); font-size:1.4rem; color:var(--accent-coral); cursor:pointer; }
        .logo .paw { display:inline-block; animation:pawBounce 1.5s ease-in-out infinite; }
        @keyframes pawBounce { 0%,100%{transform:translateY(0)} 30%{transform:translateY(-8px)} 50%{transform:translateY(0)} 70%{transform:translateY(-4px)} }
        .nav-links { display:flex; gap:1rem; list-style:none; flex-wrap:wrap; }
        .nav-links a { color:var(--text-medium); text-decoration:none; font-weight:700; font-size:0.85rem; padding:0.35rem 0.8rem; border-radius:2rem; transition:all var(--transition-bounce); white-space:nowrap; }
        .nav-links a:hover { background:var(--accent-sunny); transform:scale(1.06); }
        .nav-links a.active { background:var(--accent-lavender); color:#fff; box-shadow:var(--shadow-bouncy); }
        .detail-hero { display:flex; flex-direction:column; align-items:center; text-align:center; padding:3rem 2rem 2rem; position:relative; }
        .detail-emoji-ring { width:180px; height:180px; border-radius:50%; background:#fff; border:5px dashed var(--accent-sunny); display:flex; align-items:center; justify-content:center; font-size:6rem; box-shadow:var(--shadow-float); animation:floatGentle 3s ease-in-out infinite,spinSlow 20s linear infinite; position:relative; z-index:1; }
        @keyframes floatGentle { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-15px)} }
        @keyframes spinSlow { 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }
        .detail-emoji-ring .inner-emoji { animation:spinSlowReverse 20s linear infinite; }
        @keyframes spinSlowReverse { 0%{transform:rotate(0)} 100%{transform:rotate(-360deg)} }
        .detail-hero h1 { font-family:var(--font-title); font-size:clamp(2rem,5vw,3.2rem); color:var(--text-dark); margin-top:1.5rem; animation:slideUp 0.6s ease-out; position:relative; z-index:1; }
        @keyframes slideUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }
        .detail-hero .detail-subtitle { font-size:1.1rem; color:var(--text-light); margin-top:0.3rem; animation:slideUp 0.6s ease-out 0.1s both; position:relative; z-index:1; }
        .detail-meta-pills { display:flex; gap:0.6rem; flex-wrap:wrap; justify-content:center; margin-top:1rem; animation:slideUp 0.6s ease-out 0.2s both; position:relative; z-index:1; }
        .meta-pill { padding:0.4rem 1rem; border-radius:2rem; font-weight:700; font-size:0.82rem; font-family:var(--font-fun); }
        .pill-category { background:#fff3e0; color:#e65100; } .pill-habitat { background:#e3f2fd; color:#1565c0; }
        .pill-conservation { background:#e8f5e9; color:#2e7d32; } .pill-conservation.at-risk { background:#fff3e0; color:#e65100; }
        .pill-conservation.endangered { background:#fce4ec; color:#c62828; } .pill-diet { background:#f3e5f5; color:#7b1fa2; }
        .fun-dots { display:flex; justify-content:center; gap:0.3rem; margin:0.8rem 0; }
        .fun-dot { width:10px; height:10px; border-radius:50%; animation:bounceDot 1.3s ease-in-out infinite; }
        @keyframes bounceDot { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
        .detail-main { max-width:900px; margin:0 auto; padding:0 2rem; }
        .tab-nav { display:flex; justify-content:center; gap:0.5rem; margin-bottom:1.8rem; flex-wrap:wrap; }
        .tab-btn { padding:0.7rem 1.5rem; border-radius:2.5rem; border:3px solid #e0e8f0; background:#fff; cursor:pointer; font-weight:700; font-family:var(--font-body); font-size:0.9rem; transition:all var(--transition-bounce); white-space:nowrap; }
        .tab-btn:hover { transform:translateY(-3px); box-shadow:var(--shadow-soft); }
        .tab-btn.active { background:var(--accent-skyblue); color:#fff; border-color:var(--accent-skyblue); box-shadow:0 6px 0 #3a7ad4; transform:translateY(-2px); }
        .tab-panel { display:none; animation:fadeSlideIn 0.4s ease-out; } .tab-panel.active { display:block; }
        @keyframes fadeSlideIn { from{opacity:0;transform:translateY(15px)} to{opacity:1;transform:translateY(0)} }
        .info-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:1rem; margin-bottom:1.5rem; }
        .info-card { background:#fff; border:3px solid #e8eef5; border-radius:var(--radius-lg); padding:1.2rem; text-align:center; box-shadow:var(--shadow-soft); transition:all var(--transition-bounce); }
        .info-card:hover { transform:translateY(-4px); box-shadow:var(--shadow-float); }
        .info-card .info-icon { font-size:2rem; display:block; margin-bottom:0.3rem; }
        .info-card .info-label { font-size:0.78rem; color:var(--text-light); font-weight:700; }
        .info-card .info-value { font-family:var(--font-title); font-size:1.15rem; color:var(--text-dark); }
        .desc-card { background:#fff; border:3px solid #e8eef5; border-radius:var(--radius-xl); padding:1.8rem 2rem; box-shadow:var(--shadow-soft); margin-bottom:1.5rem; border-left:6px solid var(--accent-coral); }
        .desc-card h3 { font-family:var(--font-title); font-size:1.3rem; color:var(--accent-coral); margin-bottom:0.8rem; }
        .desc-card p { color:var(--text-medium); line-height:1.8; font-size:1rem; }
        .funfacts-list { display:flex; flex-direction:column; gap:1rem; margin-bottom:1.5rem; }
        .funfact-card { background:#fff; border:3px solid #e8eef5; border-radius:var(--radius-lg); padding:1.3rem 1.5rem; box-shadow:var(--shadow-soft); transition:all var(--transition-bounce); display:flex; align-items:flex-start; gap:1rem; }
        .funfact-card:hover { transform:translateY(-4px) rotate(-0.5deg); box-shadow:var(--shadow-float); }
        .funfact-card:nth-child(1) { border-top:5px solid var(--accent-coral); }
        .funfact-card:nth-child(2) { border-top:5px solid var(--accent-sunny); }
        .funfact-card:nth-child(3) { border-top:5px solid var(--accent-mint); }
        .funfact-card:nth-child(4) { border-top:5px solid var(--accent-lavender); }
        .funfact-card:nth-child(5) { border-top:5px solid var(--accent-skyblue); }
        .funfact-card .ff-num { font-family:var(--font-title); font-size:1.8rem; color:var(--accent-coral); flex-shrink:0; width:45px; height:45px; display:flex; align-items:center; justify-content:center; background:#fff5f5; border-radius:50%; }
        .funfact-card .ff-text { color:var(--text-medium); line-height:1.6; font-size:0.95rem; }
        .habitat-card { background:#fff; border:3px solid #e8eef5; border-radius:var(--radius-xl); padding:1.8rem 2rem; box-shadow:var(--shadow-soft); margin-bottom:1.5rem; text-align:center; }
        .habitat-card .habitat-emoji { font-size:4rem; display:block; margin-bottom:0.8rem; animation:floatGentle 2.5s ease-in-out infinite; }
        .habitat-card h3 { font-family:var(--font-title); font-size:1.4rem; color:var(--accent-skyblue); margin-bottom:0.5rem; }
        .habitat-card p { color:var(--text-medium); line-height:1.7; max-width:600px; margin:0 auto; }
        .personality-section { background:#fff; border:3px solid #e8eef5; border-radius:var(--radius-xl); padding:1.8rem 2rem; box-shadow:var(--shadow-soft); margin-bottom:1.5rem; }
        .personality-section h3 { font-family:var(--font-title); font-size:1.3rem; color:var(--accent-peach); margin-bottom:1rem; text-align:center; }
        .personality-tag { display:inline-block; padding:0.4rem 1rem; border-radius:2rem; background:#fff8f0; color:#e65100; font-weight:700; font-size:0.9rem; margin:0.25rem; border:2px solid var(--accent-peach); }
        .baby-card { background:#fff; border:3px dashed var(--accent-bubblegum); border-radius:var(--radius-xl); padding:1.8rem 2rem; box-shadow:var(--shadow-soft); margin-bottom:1.5rem; text-align:center; }
        .baby-card h3 { font-family:var(--font-title); font-size:1.3rem; color:var(--accent-bubblegum); margin-bottom:0.6rem; }
        .baby-card .baby-emoji { font-size:3rem; display:block; margin-bottom:0.5rem; animation:floatGentle 2s ease-in-out infinite; }
        .baby-card p { color:var(--text-medium); line-height:1.6; }
        .sound-card { background:#fff; border:3px solid #e8eef5; border-radius:var(--radius-xl); padding:1.5rem 2rem; box-shadow:var(--shadow-soft); margin-bottom:1.5rem; text-align:center; }
        .sound-card h3 { font-family:var(--font-title); font-size:1.3rem; color:var(--accent-sunny); margin-bottom:0.6rem; }
        .sound-card .sound-play { font-size:3rem; cursor:pointer; transition:all var(--transition-bounce); display:inline-block; }
        .sound-card .sound-play:hover { transform:scale(1.3); }
        .sound-card .sound-play.playing { animation:wiggle 0.3s ease-in-out 3; }
        @keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-10deg)} 75%{transform:rotate(10deg)} }
        .sound-card .sound-desc { color:var(--text-medium); font-style:italic; margin-top:0.4rem; }
        .related-section { margin-top:2.5rem; }
        .related-section h2 { font-family:var(--font-title); font-size:2rem; text-align:center; color:var(--text-dark); margin-bottom:0.5rem; }
        .related-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:1.2rem; margin-top:1.5rem; }
        .related-card { background:#fff; border:3px solid #e8eef5; border-radius:var(--radius-xl); padding:1.3rem 1rem; text-align:center; cursor:pointer; transition:all var(--transition-bounce); box-shadow:var(--shadow-soft); text-decoration:none; color:inherit; display:block; }
        .related-card:hover { transform:translateY(-7px) rotate(-2deg); box-shadow:var(--shadow-float); border-color:var(--accent-coral); }
        .related-card .rel-emoji { font-size:3rem; display:block; margin-bottom:0.4rem; transition:transform var(--transition-bounce); }
        .related-card:hover .rel-emoji { transform:scale(1.2); }
        .related-card .rel-name { font-family:var(--font-title); font-size:1rem; }
        .related-card .rel-type { font-size:0.75rem; color:var(--text-light); font-weight:700; }
        .not-found { text-align:center; padding:4rem 2rem; }
        .not-found .nf-emoji { font-size:6rem; animation:floatGentle 2s ease-in-out infinite; }
        .not-found h2 { font-family:var(--font-title); font-size:1.8rem; color:var(--text-dark); margin:1rem 0; }
        .not-found p { color:var(--text-medium); margin-bottom:1.5rem; }
        .btn-primary { display:inline-block; padding:0.9rem 2rem; border-radius:3rem; font-family:var(--font-title); font-size:1rem; text-decoration:none; font-weight:700; transition:all var(--transition-bounce); cursor:pointer; border:none; background:var(--accent-coral); color:#fff; box-shadow:0 6px 0 #d94a4a,0 8px 15px rgba(255,107,107,0.3); }
        .btn-primary:hover { transform:translateY(-3px); box-shadow:0 9px 0 #d94a4a,0 12px 25px rgba(255,107,107,0.4); }
        .back-row { text-align:center; margin-top:2rem; }
        .btn-back { display:inline-block; padding:0.6rem 1.6rem; border-radius:2.5rem; border:3px solid var(--accent-mint); background:#fff; color:var(--accent-mint); font-family:var(--font-title); font-size:0.95rem; cursor:pointer; text-decoration:none; font-weight:700; transition:all var(--transition-bounce); }
        .btn-back:hover { background:var(--accent-mint); color:#fff; transform:scale(1.06); box-shadow:var(--shadow-bouncy); }
        #particleCanvas { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:50; }
        .footer { text-align:center; padding:2.5rem; background:#fff; border-top:3px solid #e8eef5; margin-top:3rem; color:var(--text-light); font-weight:600; }
        @media(max-width:768px) { .navbar{margin:8px 8px;padding:0.6rem 1.2rem;border-radius:2.5rem} .detail-emoji-ring{width:140px;height:140px;font-size:4.5rem} .info-grid{grid-template-columns:repeat(2,1fr)} .related-grid{grid-template-columns:repeat(2,1fr)} .detail-main{padding:0 1rem} }
    </style>

<script>
var detailDB={
capybara:{id:'capybara',name:'水豚',emoji:'🦫',category:'哺乳动物',habitat:'草原/湿地',habitatEmoji:'🌾',diet:'草食性（草、水生植物、树皮）',size:'体长 100-130 cm',weight:'35-65 kg',lifespan:'8-12 年',personality:'温顺、友善、社交达人',description:'水豚是世界上最大的啮齿动物，原产于南美洲。它们性格极其温顺友善，被称为"动物界的社交天花板"——无论是鸟类、猴子、乌龟还是鳄鱼，都能和水豚和平相处。水豚是半水生动物，善于游泳和潜水，脚上有部分蹼帮助它们在水中行动。它们喜欢泡在温泉或河流中，只露出鼻孔和眼睛，看起来就像一颗悠闲漂浮的"水獭土豆"。在网络上，水豚因其淡定从容的气质被大家称为"卡皮巴拉"，成为了治愈系动物的代表。',conservationStatus:'无危 (LC)',conservationClass:'',babyName:'小水豚（幼崽）',soundDescription:'发出咕噜咕噜的低沉叫声，类似猫咪的呼噜声，也会用尖锐的口哨声与同伴交流。',funFacts:['水豚是啮齿目动物中体型最大的，比普通老鼠大1000倍以上！','水豚的粪便营养丰富，很多动物会跟着水豚吃它们的便便来获取营养。','水豚可以在水下憋气长达5分钟，甚至可以只露出鼻子在水面上睡觉。','在日本，水豚因为"淡定泡温泉"的形象火遍全网，成为治愈系网红。','水豚是群居动物，通常10-20只一起生活，最多可达100只的大家族。']},
axolotl:{id:'axolotl',name:'美西螈',emoji:'🦎',category:'两栖动物',habitat:'淡水湖泊',habitatEmoji:'💧',diet:'肉食性（小鱼、蠕虫、昆虫幼虫）',size:'体长 15-30 cm',weight:'60-200 g',lifespan:'10-15 年',personality:'呆萌、安静、神秘',description:'美西螈，又名"六角恐龙"，是一种永远保持幼态的水生蝾螈。它们最神奇的能力是可以再生失去的身体部位——不仅仅是尾巴和四肢，甚至包括心脏、大脑和脊髓！这使它们成为科学家研究再生医学的重要模式生物。美西螈原产于墨西哥的霍奇米尔科湖，现在在野外已经极度濒危。它们头部两侧各有三根羽毛状的外鳃，看起来像可爱的"小角"，加上永远微笑的表情，成为最受欢迎的异宠之一。',conservationStatus:'极度濒危 (CR)',conservationClass:'endangered',babyName:'美西螈幼体',soundDescription:'美西螈几乎没有发声能力，偶尔会发出极轻微的水泡破裂声。',funFacts:['美西螈可以再生大脑、心脏、脊椎——几乎任何身体部位都能完美再生！','它们一生都保持在"幼体"阶段，不会像其他蝾螈那样变态上岸。','美西螈有四种颜色：野生型（灰褐色）、白化（白粉）、金色白化（金黄）、黑色（黑螈）。','在阿兹特克神话中，美西螈是神祇修洛特尔（Xolotl）的化身。','一只美西螈可以被反复"克隆"——移植其身体组织到其他螈类身上不会排斥。']},
quokka:{id:'quokka',name:'短尾矮袋鼠',emoji:'🦘',category:'哺乳动物',habitat:'草原/灌木丛',habitatEmoji:'🌿',diet:'草食性（草、树叶、多肉植物）',size:'体长 40-54 cm',weight:'2.5-5 kg',lifespan:'10 年',personality:'开朗、好奇、天生微笑',description:'短尾矮袋鼠被称为"世界上最快乐的动物"，因为它们圆圆的脸蛋天生就带着甜甜的微笑。这种小袋鼠主要生活在澳大利亚西南部的罗特尼斯岛及周边小岛上。它们对人类的戒心极低，甚至会主动靠近游客"自拍"，因此成为了社交媒体上最火的动物明星之一。不过短尾矮袋鼠在澳大利亚本土已经濒危，主要是由于狐狸和野猫的捕食。',conservationStatus:'易危 (VU)',conservationClass:'at-risk',babyName:'小袋鼠（乔伊 Joey）',soundDescription:'发出轻柔的咕咕声和低沉的咳嗽声来交流，幼崽会发出微弱的唧唧声呼唤母亲。',funFacts:['短尾矮袋鼠的微笑是天生的——它们的面部结构就是那样！','它们可以在没有淡水的情况下存活数月，从植物中获取所需水分。','短尾矮袋鼠是夜行性动物，白天大多躲在阴凉处休息。','它们的尾巴虽然短，但储存了大量脂肪，在食物短缺时提供能量。','母短尾矮袋鼠遇到危险时会把育儿袋中的宝宝"扔出来"分散捕食者注意力。']},
sloth:{id:'sloth',name:'树懒',emoji:'🦥',category:'哺乳动物',habitat:'热带雨林',habitatEmoji:'🌴',diet:'草食性（树叶、嫩芽、果实）',size:'体长 50-70 cm',weight:'4-8 kg',lifespan:'20-30 年',personality:'悠闲、缓慢、与世无争',description:'树懒是地球上最慢的哺乳动物，每分钟只能移动约2米。它们大部分时间倒挂在树上，以树叶为食。树懒的新陈代谢极低，消化一片叶子可能需要一个月的时间。它们每周只下树一次排便，这个行为至今仍是科学谜团。树懒的皮毛中住着一整套微型生态系统——包括绿藻、甲虫和蛾子，绿藻不仅给它提供了伪装色，还给它们提供了额外的营养来源。',conservationStatus:'无危 (LC)',conservationClass:'',babyName:'小树懒（幼崽）',soundDescription:'发出高音调的"咿咿"叫声，听起来像婴儿的啜泣声，尤其求偶时叫声更加响亮。',funFacts:['树懒的爪子是"天生握拳"状态——即使死了，它们仍然紧紧抓住树枝不放。','树懒毛发的生长方向和其他哺乳动物相反——从肚子向背部生长，因为雨水需要从倒挂的身体上流下来。','树懒可以在水下憋气长达40分钟，是陆地动物中憋气最久的之一。','三趾树懒的颈椎有9节（大多数哺乳动物只有7节），所以脖子能转270度。','树懒每周只排便一次，每次排便后会"瘦"掉身体重量的三分之一。']},
fennec:{id:'fennec',name:'耳廓狐',emoji:'🦊',category:'哺乳动物',habitat:'沙漠',habitatEmoji:'🏜️',diet:'杂食性（昆虫、小型啮齿动物、果实、鸟蛋）',size:'体长 24-41 cm',weight:'0.7-1.6 kg',lifespan:'10-14 年',personality:'机灵、活泼、好奇心强',description:'耳廓狐是世界上最小的狐狸，也是耳朵相对于身体最大的犬科动物。它们巨大的耳朵不仅是萌点，更是生存利器——帮助在炎热沙漠中散热，还能探测地下沙层中猎物的细微动静。耳廓狐脚掌上覆盖着厚厚的毛，像穿了雪地靴一样保护它们不被滚烫的沙子灼伤。它们是夜行性动物，在撒哈拉沙漠的星空下出没，用大耳朵定位猎物的行踪。',conservationStatus:'无危 (LC)',conservationClass:'',babyName:'小耳廓狐（幼崽）',soundDescription:'发出尖锐的唧唧声、吠叫声和呼噜声，声音变化丰富，能表达多种情绪。',funFacts:['耳廓狐的耳朵占身体比例是所有犬科动物中最大的——耳朵长可达15厘米！','它们可以数月不饮水，完全从食物中获取所需水分。','耳廓狐的肾脏非常高效，几乎不浪费一滴水——尿液高度浓缩。','它们是唯一一种被驯化后能作为宠物的狐狸品种。','耳廓狐能听到地下昆虫走路的脚步声，听觉灵敏度是人类的20倍。']},
penguin:{id:'penguin',name:'帝企鹅',emoji:'🐧',category:'鸟类',habitat:'南极冰原',habitatEmoji:'❄️',diet:'肉食性（鱼类、磷虾、鱿鱼）',size:'体高 100-130 cm',weight:'22-45 kg',lifespan:'15-20 年',personality:'坚韧、忠诚、团结',description:'帝企鹅是世界上最大的企鹅物种，也是唯一在南极冬季繁殖的企鹅。它们能在零下60度的极寒中生存，依靠层层羽毛、厚厚的脂肪和紧密的群体协作抵御严寒。帝企鹅是一夫一妻制，雄企鹅负责在极夜中孵化企鹅蛋——将蛋放在脚背上用腹部皮褶覆盖保暖，连续站立65天不吃不喝，直到雌企鹅带着食物回来。这种超越极限的"父爱"令人深深感动。',conservationStatus:'近危 (NT)',conservationClass:'at-risk',babyName:'小帝企鹅（雏鸟）',soundDescription:'发出响亮的小号般鸣叫声，每只企鹅有独特的叫声频率，用于在成千上万只同伴中识别自己的伴侣和幼崽。',funFacts:['帝企鹅是潜水最深的鸟类——可以潜入水下500多米，憋气超过20分钟！','雄企鹅孵蛋时掉体重可达一半（约20公斤），是全动物界最"伟大的父亲"。','帝企鹅雏鸟第一次看到自己在水中的倒影会吓一跳。','帝企鹅群体取暖时，核心温度可达37度，外围的企鹅会轮流"换岗"到中间。','企鹅的羽毛密度是所有鸟类中最高的——每平方厘米有11-12根羽毛。']},
owl:{id:'owl',name:'雪鸮',emoji:'🦉',category:'鸟类',habitat:'北极苔原',habitatEmoji:'❄️',diet:'肉食性（旅鼠、野兔、小型鸟类）',size:'体长 52-71 cm，翼展 125-150 cm',weight:'1.6-3 kg',lifespan:'9-10 年（野生）',personality:'冷静、独立、高贵',description:'雪鸮是北极地区最壮观的猛禽之一，全身洁白如雪，黄色的眼睛明亮而锐利。它们是昼行性的猫头鹰——在北极极昼的夏天，它们需要在白天捕猎。雪鸮的羽毛覆盖了全身包括脚爪，使其在零下50度的严寒中也能保持温暖。因为《哈利·波特》中海德薇的形象，雪鸮成为全球最受喜爱的猫头鹰。它们的食物主要以旅鼠为主，一只雪鸮一年能吃掉超过1600只旅鼠。',conservationStatus:'易危 (VU)',conservationClass:'at-risk',babyName:'小雪鸮（雏鸟）',soundDescription:'发出低沉有力的"呼呼"声和刺耳的嘎嘎警戒声，与常见的"咕咕"猫头鹰叫声很不同。',funFacts:['雪鸮是少数在白天活动的猫头鹰——因为北极夏天太阳24小时不落。','雪鸮的羽毛是猫头鹰中最厚的，全身羽毛重达700克，相当于穿了一件羽绒大衣。','雪鸮的视力极其锐利，能在500米外发现一只旅鼠。','雄性雪鸮随着年龄增长越来越白；雌性身上有更多黑褐色斑点。','雪鸮雏鸟孵化时间差可达两周——先孵出的大哥大姐比最小的弟妹大很多。']},
octopus:{id:'octopus',name:'章鱼',emoji:'🐙',category:'海洋生物',habitat:'海洋珊瑚礁',habitatEmoji:'🌊',diet:'肉食性（螃蟹、虾、贝类、小鱼）',size:'臂展 1-4 m（普通章鱼）',weight:'3-50 kg',lifespan:'1-5 年',personality:'聪明、好奇、独行侠',description:'章鱼是地球上最聪明的无脊椎动物之一，拥有九个"大脑"——一个中央脑和八个触手各自拥有的独立神经节。它们能打开瓶盖、走迷宫、使用工具、识别人类面孔，甚至有个体性格差异。章鱼有三颗心脏，血液是蓝色的（含血蓝蛋白），皮肤中有数百万个色素细胞使其能瞬间变色伪装。它们是伪装大师，不仅能改变颜色，还能改变皮肤质地模仿岩石、珊瑚甚至其他动物。',conservationStatus:'无危 (LC)',conservationClass:'',babyName:'章鱼幼体（浮游期）',soundDescription:'章鱼不会发出声音，但它们通过变换体色和身体姿态进行复杂的视觉交流。',funFacts:['章鱼的血是蓝色的！因为它们的血液中含有血蓝蛋白（含铜）而非血红蛋白（含铁）。','章鱼的触手中有2/3的神经元——每根触手可以"独立思考"并自主行动。','章鱼能穿过任何比它的喙（唯一硬的部分）大的缝隙——一只30公斤章鱼能穿过硬币大小的洞。','章鱼在实验室中会玩玩具、喷射水花关灯、甚至故意搞破坏来抗议。','章鱼一生只繁殖一次——母章鱼守护卵期间不进食，孵出幼体后便会死去。']},
koala:{id:'koala',name:'考拉',emoji:'🐨',category:'哺乳动物',habitat:'桉树林',habitatEmoji:'🌳',diet:'专食性（仅吃桉树叶）',size:'体长 60-85 cm',weight:'4-15 kg',lifespan:'13-18 年',personality:'慵懒、温和、嗜睡',description:'考拉是澳大利亚的标志性动物，以每天睡18-22小时闻名。它们的主食——桉树叶——营养极低且含有毒素，需要消耗大量能量来消化和解毒，所以考拉选择了"能睡就睡"的节能策略。考拉不是熊，而是有袋动物，母考拉有育儿袋（袋口朝下，与袋鼠相反）。考拉的指纹与人类极为相似，甚至在显微镜下都难以区分。',conservationStatus:'易危 (VU)',conservationClass:'at-risk',babyName:'小考拉 joey（乔伊）',soundDescription:'发出低沉的咕噜声和打鼾般的声响，雄性求偶时能发出极其响亮的"猪哼"声——像一台小型摩托车发动机。',funFacts:['考拉宝宝断奶后会吃妈妈的"特殊粪便"（pap）来补充消化桉树叶所需的肠道细菌。','考拉的指纹和人类指纹在电子显微镜下几乎一模一样！','考拉的大脑相对于身体极小——只占颅腔的约60%，剩余空间充满了脑脊液。','考拉的育儿袋口朝下——方便树上的宝宝够到妈妈的粪便获取益生菌。','一只考拉每天只活动约4小时，其余时间都在睡觉或发呆。']},
seahorse:{id:'seahorse',name:'海马',emoji:'🐴',category:'海洋生物',habitat:'浅海海草床',habitatEmoji:'🌊',diet:'肉食性（浮游生物、小型甲壳类）',size:'体长 1.5-35 cm',weight:'0.5-50 g',lifespan:'1-5 年',personality:'优雅、专一、温柔',description:'海马是海洋中最独特的鱼类之一——它们直立游泳（而非水平），有马头般的外形，尾巴可以卷住海草锚定身体。海马最著名的是它们"性别反转"的繁殖方式：雄性海马有一个育儿袋，雌海马将卵产入其中，由雄性完成孵化和"分娩"。海马是一夫一妻制的典范，许多物种的伴侣会每天进行"早安舞"——在晨光中对舞以巩固彼此的感情。',conservationStatus:'易危 (VU)',conservationClass:'at-risk',babyName:'小海马（幼体）',soundDescription:'海马几乎无声，但会通过摩擦头骨和脊椎发出极细微的咔哒声。',funFacts:['海马是地球上唯一由雄性"怀孕"分娩的动物——雄海马能一次"生"出上千只小海马。','海马没有牙齿和胃——食物直接穿过消化系统，所以需要不停进食。','海马的眼睛可以各自独立转动——像变色龙一样同时看两个方向。','海马情侣每天早晨会跳"早安舞"来巩固感情——有时长达数十分钟。','海马尾巴的横截面是方形的（不是圆形），这给了它更好的抓握力。']},
chameleon:{id:'chameleon',name:'变色龙',emoji:'🦎',category:'爬行动物',habitat:'热带雨林/森林',habitatEmoji:'🌴',diet:'肉食性（昆虫为主）',size:'体长 1.5-68 cm（因物种而异）',weight:'2-500 g',lifespan:'2-10 年',personality:'谨慎、独立、精准',description:'变色龙是大自然最迷人的爬行动物之一，以变换体色闻名遐迩。但很多人以为变色龙变色是为了"伪装"——实际上，变色主要用于表达情绪、调节体温和与同类交流。变色龙的眼睛是独立转动的"炮塔"，可以同时看两个完全不同的方向，一旦锁定猎物，两只眼睛会聚焦在一起形成立体视觉。它们的舌头比身体还长，弹射速度可达每秒6米，全程只需0.07秒——快到肉眼无法看清。',conservationStatus:'因物种而异',conservationClass:'',babyName:'小变色龙（幼体）',soundDescription:'变色龙几乎不发出声音，只偶尔发出极其微弱的嘶嘶声作为警戒。',funFacts:['变色龙变色不仅仅为了伪装——更多是为了调节体温和表达情绪。','变色龙的舌头比整个身体还长——弹射时速度可达20公里/小时。','变色龙眼睛各自独立、可以360度旋转——同时看前面和后面没问题。','变色龙脚掌像钳子一样分为两组（2趾+3趾），完美适应抓握树枝。','最小的变色龙（Brookesia nana）体长不到3厘米，可以站在火柴头上。']},
giant_panda:{id:'giant_panda',name:'大熊猫',emoji:'🐼',category:'哺乳动物',habitat:'竹林/山地森林',habitatEmoji:'🎋',diet:'专食性（99%为竹子）',size:'体长 1.2-1.9 m',weight:'70-160 kg',lifespan:'20-30 年（野生）',personality:'温和、憨厚、慵懒',description:'大熊猫是中国的国宝和全球野生动物保护的象征。虽然它们属于食肉目（熊科），但99%的食物是竹子——一只成年大熊猫每天要吃掉12-38公斤竹子。大熊猫黑白分明的外表加上圆滚滚的身材和标志性的"黑眼圈"，成为全球最受喜爱动物之一。经过几十年的努力，中国的大熊猫保护取得了显著成效，从"濒危"降级为"易危"。大熊猫的"拇指"其实是一块特化的腕骨，帮助它们牢牢握住竹子。',conservationStatus:'易危 (VU)',conservationClass:'at-risk',babyName:'熊猫宝宝（幼崽）',soundDescription:'发出咩咩的羊叫声和咕噜声，幼崽会发出尖锐的唧唧声，受惊时会发出类似狗叫的吠声。',funFacts:['大熊猫新生幼崽体重仅100-200克——是母亲体重的1/900。','大熊猫的"黑眼圈"不仅仅可爱——更像是一个"面部标志"，帮助它们互相识别。','大熊猫一天要花10-16小时进食，吃掉体重15-40%的竹子。','大熊猫的肠道仍然是食肉动物的构造（短而直），所以消化竹子的效率只有约17%。','熊猫粪便其实不臭——因为吃竹子，有时还带有淡淡的茶叶香味。']},
polar_bear:{id:'polar_bear',name:'北极熊',emoji:'🐻‍❄️',category:'哺乳动物',habitat:'北极冰原',habitatEmoji:'❄️',diet:'肉食性（海豹为主）',size:'体长 2-3 m',weight:'350-700 kg',lifespan:'20-30 年',personality:'威武、孤傲、坚韧',description:'北极熊是地球上最大的陆地食肉动物，是北极的"王者"。它们看似白色的皮毛其实由透明的中空毛发组成——这能让阳光直接照射到黑色皮肤上帮助吸收热量（像天然太阳能收集器）。北极熊是游泳健将，能以每小时10公里的速度在冰海中连续游数天。然而气候变化正使北极海冰迅速消融，严重威胁着它们的生存——没有海冰作为平台，它们无法捕猎海豹。',conservationStatus:'易危 (VU)',conservationClass:'at-risk',babyName:'小北极熊（幼崽）',soundDescription:'发出低沉的吼声和粗重的哼哼声，母熊与幼崽之间用轻柔的咕噜声交流。',funFacts:['北极熊的皮肤是黑色的！白色"皮毛"其实是透明中空的——看起来白色是光线散射造成的。','北极熊是唯一会主动攻击并猎杀人类的熊类——在它们眼中人类也是"猎物"。','北极熊可以连续游泳超过9天——曾记录到一只母熊游了687公里。','北极熊的嗅觉极其灵敏——能在1.6公里外闻到海豹的呼吸孔。','北极熊的肝脏含有致命的维生素A浓度——因纽特人从不吃北极熊肝脏以免中毒。']},
sea_otter:{id:'sea_otter',name:'海獭',emoji:'🦦',category:'海洋生物（哺乳动物）',habitat:'北太平洋海岸',habitatEmoji:'🌊',diet:'肉食性（海胆、贝类、螃蟹、鱼）',size:'体长 1-1.5 m',weight:'14-45 kg',lifespan:'15-20 年',personality:'聪明、社交、爱玩',description:'海獭是动物界的"工具使用大师"——它们会用石头敲开贝壳和螃蟹，是少有的会使用工具的海洋哺乳动物。海獭睡觉时有个超级可爱的习惯：它们会手拉手漂在水上，防止睡着后被洋流冲散。海獭拥有动物界最浓密的毛发——每平方厘米多达15万根毛发（人类整个头上才10万根），这使它们成为唯一不依赖脂肪层保暖的海洋哺乳动物。作为"关键物种"，海獭以海胆为食，保护了海藻林的生态平衡。',conservationStatus:'濒危 (EN)',conservationClass:'endangered',babyName:'小海獭（幼崽）',soundDescription:'发出尖锐的叫声、咕噜声和"咻咻"声，幼崽呼唤妈妈时发出高亢的哨声。',funFacts:['海獭会用石头敲贝壳——是少有的会使用工具的海洋哺乳动物。','海獭睡觉时会手拉手形成"海獭筏"（raft），防止漂走分散。','海獭每天要吃自身体重25-30%的食物来维持体温——相当于一个60公斤的人每天吃15公斤。','海獭的腋下有一个松垮的皮袋——用来存放食物和它们最喜欢的"敲壳专用石"。','海獭妈妈会把宝宝放在肚皮上仰泳——世界上最萌的"水上摇篮"。']},
meerkat:{id:'meerkat',name:'狐獴',emoji:'🦝',category:'哺乳动物',habitat:'沙漠/草原',habitatEmoji:'🏜️',diet:'杂食性（昆虫、蜥蜴、蝎子、果实）',size:'体长 25-35 cm',weight:'0.6-1 kg',lifespan:'12-15 年',personality:'警觉、团结、好奇',description:'狐獴是非洲沙漠中最著名的"哨兵"。它们群居生活，每天清晨从洞穴中出来时做的第一件事就是站立起来面向太阳——不是在"做瑜伽"，而是在用腹部的黑色皮肤吸收阳光暖身。狐獴群体中总有成员轮班充当"哨兵"，站在最高处用后腿直立观察天空和地面的威胁，一旦发现老鹰或蛇，就会发出不同的警报声。狐獴对多种毒液（包括蝎子毒）有天然抗性。',conservationStatus:'无危 (LC)',conservationClass:'',babyName:'小狐獴（幼崽）',soundDescription:'发出各种叫声——警觉时会发出尖锐的吠声，有"天空警报"（鸟类威胁）和"地面警报"（蛇类威胁）的区分。',funFacts:['狐獴腹部的黑色皮肤像"太阳能板"——早上站着晒太阳就是为了快速暖和起来。','狐獴群中有严格的"排班表"——每个成员轮流当哨兵，从不偷懒。','狐獴对蝎子毒液有天然抗性——被蝎子蛰了只是疼一下，不会致命。','狐獴"幼儿园"制度——群体中有专门的"保姆"留下照看所有幼崽。','狐獴的警报系统非常复杂——能区分老鹰、蛇、胡狼等不同类型的威胁。']},
hummingbird:{id:'hummingbird',name:'蜂鸟',emoji:'🐦',category:'鸟类',habitat:'热带雨林/花园',habitatEmoji:'🌺',diet:'蜜食性（花蜜为主，辅以昆虫）',size:'体长 5-20 cm',weight:'1.6-20 g',lifespan:'3-12 年',personality:'灵动、勇敢、精力充沛',description:'蜂鸟是大自然最精妙的奇迹之一——它们是地球上最小的鸟，却是唯一能倒飞的鸟类。蜂鸟的翅膀每秒拍打50-80次（某些物种甚至超过100次），快到肉眼只能看到一团模糊。它们的心跳每分钟可达1200次（安静时也有250次）。为维持这惊人的新陈代谢，蜂鸟每天需要消费自身体重两倍的花蜜——访问数百甚至上千朵花。蜂鸟拥有鸟类中相对于身体最大的大脑（占体重4.2%），记忆力惊人——能记住哪朵花在什么时候产过花蜜。',conservationStatus:'因物种而异',conservationClass:'',babyName:'小蜂鸟（雏鸟）',soundDescription:'翅膀高速振动发出嗡嗡声（蜂鸟由此得名），也会发出尖锐的啾啾声和吱吱声进行社交。',funFacts:['蜂鸟是地球上唯一能倒飞的鸟类——还能悬停、侧飞甚至翻跟斗。','蜂鸟心跳每分钟可达1200次——是人类心跳最快速度的6倍。','蜂鸟的蛋是世界上最小的鸟蛋——大小约等于一颗豌豆。','蜂鸟每天要喝掉自身体重2倍的花蜜——约等于人类每天喝掉300罐可乐。','蜂鸟晚上会进入"休眠模式"——新陈代谢和心跳降至极低以节省能量。']},
dolphin:{id:'dolphin',name:'宽吻海豚',emoji:'🐬',category:'海洋生物（哺乳动物）',habitat:'温带和热带海洋',habitatEmoji:'🌊',diet:'肉食性（鱼类、鱿鱼、虾）',size:'体长 2-4 m',weight:'150-650 kg',lifespan:'40-60 年',personality:'聪明、活泼、友善',description:'宽吻海豚是地球上最聪明的动物之一，智商在动物界排名前三。每只海豚都有独特的"签名哨声"——就像人类的名字，用于在群体中识别彼此。海豚睡觉时只让一半大脑休息，另一半保持清醒以浮出水面换气——这种方式叫"半球睡眠"。海豚是高度社会化的动物，它们会合作捕猎、互相帮助照顾幼崽，甚至有记录显示海豚会救助溺水的人类。',conservationStatus:'无危 (LC)',conservationClass:'',babyName:'小海豚 calf（幼豚）',soundDescription:'发出各种哨声、咔哒声和脉冲声——用回声定位"看见"水中的物体，用哨声进行社交交流。',funFacts:['每只海豚都有独特的"签名哨声"——相当于人类的名字，用于识别彼此。','海豚只让一半大脑睡觉——另一半保持清醒，以便浮出水面呼吸。','海豚的回声定位系统比任何人造声纳都精确——能探测到2公里外的小鱼。','海豚妈妈怀孕长达12个月，宝宝出生后跟随母亲长达6年。','野生海豚会使用工具——在鼻子上套海绵来保护自己在海底觅食时不被划伤。']},
blue_whale:{id:'blue_whale',name:'蓝鲸',emoji:'🐋',category:'海洋生物（哺乳动物）',habitat:'全球各大洋',habitatEmoji:'🌊',diet:'滤食性（磷虾为主）',size:'体长 24-30 m',weight:'100-200 吨',lifespan:'80-110 年',personality:'宏大、宁静、孤独',description:'蓝鲸是地球上有史以来最大的动物——比任何恐龙都大。它的舌头就有大象那么重，心脏有一辆小轿车那么大，主动脉粗到可以容一个成年人爬进去。蓝鲸每天消耗约4000万只磷虾——约3.6吨。蓝鲸的叫声是动物界最响亮的声音之一——可达188分贝，能在海洋中传播超过1600公里。虽然在20世纪因捕鲸几乎灭绝，但全球禁捕令实施后，蓝鲸种群正在缓慢恢复。',conservationStatus:'濒危 (EN)',conservationClass:'endangered',babyName:'小蓝鲸 calf',soundDescription:'发出超低频（低于人耳可听范围）的巨大鸣声，音量最高188分贝——比喷气式飞机引擎还响，可在海洋中传播数千公里。',funFacts:['蓝鲸是地球有史以来最大的动物——比任何已知恐龙都大。','蓝鲸宝宝每天喝500升母乳——增重约90公斤，相当于每秒都在长大。','蓝鲸的心脏重约400公斤——和小轿车差不多大。','蓝鲸一次喷气能喷出9米高的水柱——相当于三层楼。','蓝鲸的叫声是地球上最响亮的动物声音之一，但频率太低人类无法直接听到。']},
sea_turtle:{id:'sea_turtle',name:'海龟',emoji:'🐢',category:'爬行动物',habitat:'热带和亚热带海洋',habitatEmoji:'🌊',diet:'因物种而异（海草、海蜇、海绵、螃蟹）',size:'甲长 60-180 cm',weight:'30-700 kg',lifespan:'50-100+ 年',personality:'坚韧、温顺、远古旅者',description:'海龟是与恐龙同时代的"活化石"——它们已在地球上生活超过1.1亿年。海龟最神奇的特征之一是"温度决定性别"——海龟蛋在较温暖的沙子中孵出雌性，在较凉沙子中孵出雄性。海龟是海洋中的远洋旅行者，一些物种（如棱皮龟）会在太平洋迁徙超过12000公里。雌海龟有一个"惊人记忆"——它们会回到自己出生的那片海滩产卵，不管相隔多远。',conservationStatus:'濒危/易危',conservationClass:'endangered',babyName:'小海龟（雏龟）',soundDescription:'海龟很少发声，但在筑巢时会发出低沉的咕噜声和"嗯嗯"声。',funFacts:['海龟蛋的孵化温度决定性别——温暖产雌性、凉爽产雄性（全球变暖导致雌性比例过高）。','海龟是1.1亿年的活化石——它们和恐龙同时代生存至今。','海龟会回到自己出生的那片海滩产卵——无论它已经游了多远。','小海龟破壳后奔向大海的那一分钟是它们一生中最危险的时刻。','海龟的寿命可达100年以上——加拉帕戈斯巨龟甚至能活超过150年。']},
flamingo:{id:'flamingo',name:'火烈鸟',emoji:'🦩',category:'鸟类',habitat:'盐碱湖/泻湖/湿地',habitatEmoji:'🏞️',diet:'滤食性（藻类、小型甲壳类）',size:'体高 80-145 cm',weight:'2-4 kg',lifespan:'20-30 年（野生）',personality:'优雅、群居、高冷',description:'火烈鸟以其惊艳的粉红色羽毛和优雅的身姿闻名于世。它们的粉色来自食物中的类胡萝卜素——火烈鸟吃的盐田虾和藻类富含这种天然色素。火烈鸟单腿站立的姿势是"节能模式"——一条腿可以完全放松，另一条腿的关节会"锁死"省力。它们常常聚集数百甚至上百万只，形成地球上最壮观的"粉色海洋"。火烈鸟的喙是倒着长的——在水中倒转头部，用舌头把水"挤"过喙边的滤食结构。',conservationStatus:'无危 (LC)',conservationClass:'',babyName:'小火烈鸟 chick',soundDescription:'发出咯咯的雁鸣般叫声和低沉哼声，群体中此起彼伏的叫声汇成独特的"合唱"。',funFacts:['火烈鸟的粉色不是天生的——吃了什么颜色的食物就变成什么颜色。','火烈鸟靠单腿站立来"节能"——一条腿完全放松，另一条腿关节锁死。','火烈鸟的喙倒着用——在水中把喙倒过来滤食，舌头就是天然的"泵"。','火烈鸟聚集时可达百万只——形成地球上最壮观的"粉红海洋"。','火烈鸟的"膝盖"其实不是膝盖——那块向后弯的关节是脚踝，真正的膝盖藏在羽毛下。']},
red_panda:{id:'red_panda',name:'小熊猫',emoji:'🦊',category:'哺乳动物',habitat:'喜马拉雅山地森林',habitatEmoji:'⛰️',diet:'杂食性（竹子为主，辅以果实、昆虫、鸟蛋）',size:'体长 50-64 cm',weight:'3-6 kg',lifespan:'8-12 年',personality:'温柔、害羞、独居',description:'小熊猫是大自然最可爱的红毛小精灵——它们才是"Panda"这个名字最初的主人（比大熊猫早50年命名）。小熊猫有一条蓬松的"浣熊尾"——尾上有12条红色和浅黄相间的环纹。它们的"伪拇指"和大熊猫一样是特化的腕骨，帮助它们抓握竹子。小熊猫主要生活在喜马拉雅山脉东部的高山竹林中，是世界自然保护联盟列为"濒危"的珍稀物种。Mozilla Firefox浏览器的名字灵感就来自小熊猫的英文昵称。',conservationStatus:'濒危 (EN)',conservationClass:'endangered',babyName:'小小熊猫（幼崽）',soundDescription:'发出唧唧的鸟叫声和尖锐的口哨声，感到威胁时会发出嘶嘶声并站起来张开双臂试图"变大"。',funFacts:['小熊猫才是"Panda"这个名字的原主——比大熊猫早50年被命名为Panda。','Firefox浏览器的名字就是小熊猫的英文昵称——Fire Fox。','小熊猫也爱吃甜食——在动物园里它们钟情于苹果和葡萄。','小熊猫的尾巴有12条环纹——展开可以当毯子盖在身上保暖。','小熊猫被吓到时不会逃跑——而是站起来张开双臂试图让自己"变大"。']},
pangolin:{id:'pangolin',name:'穿山甲',emoji:'🦔',category:'哺乳动物',habitat:'森林/草原',habitatEmoji:'🌳',diet:'专食性（蚂蚁和白蚁）',size:'体长 30-100 cm（含尾）',weight:'1.6-33 kg',lifespan:'13-20 年',personality:'害羞、温和、独居',description:'穿山甲是地球上唯一全身覆盖鳞片的哺乳动物。它们的鳞片由角蛋白组成（和人类指甲成分一样），在遇到危险时会卷成紧密的球，鳞片像盔甲一样保护全身。穿山甲是"害虫控制专家"——一只穿山甲一年能吃掉超过7000万只蚂蚁和白蚁。不幸的是，穿山甲是全球非法野生动物贸易中贩运最严重的动物——由于传统医学对鳞片的迷信需求，每年数以万计的穿山甲被非法猎杀。',conservationStatus:'极度濒危 (CR)',conservationClass:'endangered',babyName:'小穿山甲（幼崽）',soundDescription:'几乎无声，偶尔发出轻柔的哼声和咂嘴声。',funFacts:['穿山甲是唯一全身长鳞片的哺乳动物——鳞片成分和人类的指甲一样。','穿山甲没有牙齿——靠吃小石子进胃里，在砂囊中研磨蚂蚁。','穿山甲的舌头比身体还长（可达40厘米以上），能伸进蚁穴深处。','一只穿山甲一年能吃掉7000万只蚂蚁和白蚁——是天然的害虫防治专家。','穿山甲遭受全球最严重的非法贩运——传统医药驱使导致每年数十万只因迷信被杀。']},
tiger:{id:'tiger',name:'西伯利亚虎',emoji:'🐯',category:'哺乳动物',habitat:'北方森林/雪原',habitatEmoji:'🌲',diet:'肉食性（鹿、野猪、麂、鱼）',size:'体长 2.4-3.3 m（含尾）',weight:'100-320 kg',lifespan:'16-20 年',personality:'威猛、孤傲、王者之气',description:'西伯利亚虎（东北虎）是世界上最大的猫科动物，体重可达320公斤。它们的条纹就像人类的指纹——每一只老虎的条纹图案都是独一无二的。西伯利亚虎是独行侠，每只需要数百平方公里的领地来狩猎。它们会游泳、会爬树，跳跃距离可达10米。全球野生虎仅存约4500只——比100年前的10万只减少了95%以上。西伯利亚虎更是稀少，野生个体仅存约500只。',conservationStatus:'濒危 (EN)',conservationClass:'endangered',babyName:'小老虎 cub（幼虎）',soundDescription:'发出震撼森林的低沉吼声，在数公里外都能听到，也会发出"chuff"（友善的噗声）与同类打招呼。',funFacts:['老虎的条纹独一无二——就像人类指纹一样可以用于个体身份识别。','老虎是唯一拥有条纹皮肤的猫科动物——剃了毛皮下的皮肤也有条纹。','老虎一次跳跃最多可达10米——约等于一辆大巴车的长度。','西伯利亚虎是最大的猫科动物——成年雄性体重相当于4个成年男人。','老虎的夜视能力是人类的6倍。']},
elephant:{id:'elephant',name:'非洲象',emoji:'🐘',category:'哺乳动物',habitat:'草原/稀树草原',habitatEmoji:'🌾',diet:'草食性（草、树叶、树皮、果实）',size:'体高 3-4 m',weight:'4000-7000 kg',lifespan:'60-70 年',personality:'智慧、温柔、家庭至上',description:'非洲象是地球上最大的陆地动物。它们拥有极高的智慧、复杂的社会结构和深厚的情感——大象会为死去的同伴举行"哀悼仪式"，会用鼻子和脚轻轻抚摸逝者的骨头，甚至会"流泪"表达悲伤。大象的记忆力惊人，能记住数十年前的经历和远方的水源位置。象鼻是大自然最精妙的器官——包含超过4万块肌肉（人类全身才600多块），既能举起300公斤的圆木，又能捡起一粒花生。',conservationStatus:'濒危 (EN)',conservationClass:'endangered',babyName:'小象 calf（幼象）',soundDescription:'发出低沉的隆隆声（次声波，人耳部分可闻），能在草原上传到10公里外，也会发出高亢的喇叭声表达兴奋或愤怒。',funFacts:['大象是少数会在镜子中认出自己的动物——具有自我意识（通过了镜子测试）。','大象会为死去的同伴举行"葬礼"——用树枝和泥土覆盖尸体并静立哀悼。','象鼻包含超过4万块肌肉——是人类全身肌肉数量的60多倍。','大象的孕期长达22个月——是所有哺乳动物中最长的。','大象用脚"听"声音——通过脚掌感知地面的次声波震动。']},
giraffe:{id:'giraffe',name:'长颈鹿',emoji:'🦒',category:'哺乳动物',habitat:'稀树草原',habitatEmoji:'🌾',diet:'草食性（树叶，尤其金合欢树叶）',size:'体高 4.3-5.7 m',weight:'800-1900 kg',lifespan:'25-30 年',personality:'优雅、温顺、安静',description:'长颈鹿是世界最高的陆生动物——一头成年雄性长颈鹿的头顶可达5.7米。有趣的是，长颈鹿和人类的颈椎骨数量完全一样——都是7节，只是每节被拉长到了25厘米。长颈鹿的循环系统是工程学的奇迹——一颗重达11公斤的心脏要产生两倍于人类血压的压力才能把血液泵到头顶。为了不让猛低头时血液冲向大脑，长颈鹿颈静脉中有一系列单向阀门。长颈鹿的蓝紫色长舌头（45-50厘米）能灵巧地避开金合欢树的尖刺去卷嫩叶。',conservationStatus:'易危 (VU)',conservationClass:'at-risk',babyName:'小长颈鹿 calf',soundDescription:'大多数时候沉默，但幼崽会发出类似羊叫的咩咩声，成年长颈鹿偶尔发出低沉哼声，极少被人类听到。',funFacts:['长颈鹿和人类的颈椎骨都是7节——只是长颈鹿的每节约25厘米长。','长颈鹿的血压是人类的两倍——否则血液爬不到5米高的头顶。','长颈鹿出生时从2米高处"坠落"——这一掉恰好帮助它们第一次呼吸。','长颈鹿每天只睡约30分钟——通常是几分钟一次的打盹碎片。','长颈鹿的舌头是蓝紫色的——科学家认为深色可以防晒（因为每天长时间伸在外面）。']},
peacock:{id:'peacock',name:'蓝孔雀',emoji:'🦚',category:'鸟类',habitat:'森林/园林',habitatEmoji:'🌳',diet:'杂食性（种子、昆虫、果实、小型爬行动物）',size:'体长 1-1.3 m（尾屏达1.5 m）',weight:'4-6 kg',lifespan:'15-20 年',personality:'华丽、自信、警觉',description:'蓝孔雀（准确说是雄性"孔雀"）拥有动物界最壮观的"时装秀"——开屏时尾羽展开成巨大的扇形，上面布满蓝绿色"眼状斑"。这华丽尾屏的色彩并非来自色素，而是来自羽毛微结构的"结构色"——通过纳米级羽毛结构反射特定波长光线产生。雄孔雀通过展示尾屏、振动羽毛发出沙沙声来吸引雌孔雀。印度尊孔雀为国鸟。',conservationStatus:'无危 (LC)',conservationClass:'',babyName:'小孔雀 peachick（雏鸟）',soundDescription:'发出响亮尖锐的"啊咔—啊咔"叫声和"喵喵"般的声音，叫声能传到很远的地方，尤其在雨季求偶期。',funFacts:['孔雀尾屏上的颜色不是色素——而是纳米结构的物理光学"结构色"在起作用。','孔雀尾屏上约有150-200根覆羽——每根上都有"眼状斑"。','雌孔雀虽然没有华丽尾屏，但它们才是"评委"——选择尾屏最大最对称的雄性。','孔雀是会飞的——虽然尾屏看起来很重，飞起来仍然能上树躲避天敌。','在印度教中，孔雀是战神迦絺吉夜的坐骑，象征智慧与吉祥。']},
jellyfish:{id:'jellyfish',name:'水母',emoji:'🪼',category:'海洋生物',habitat:'全球海洋',habitatEmoji:'🌊',diet:'肉食性（浮游生物、小鱼、其他水母）',size:'直径 1 cm - 2 m',weight:'几克 - 200 kg',lifespan:'数天 - 理论永生',personality:'神秘、优雅、远古',description:'水母已经在地球上存在超过5亿年——比恐龙早得多。它们由95%的水组成，没有大脑、心脏和骨骼，却在海洋中以优雅的脉冲方式游动了亿万年。灯塔水母（Turritopsis dohrnii）拥有"返老还童"的神奇能力——在面临威胁时能将成熟细胞逆转为幼体状态，理论上可以实现"生物学永生"。水母的触手上布满刺细胞，是自然界最精巧的"微型注射器"——能在微秒级别将毒液注入猎物或威胁目标。',conservationStatus:'无危 (LC)',conservationClass:'',babyName:'水螅体（幼体阶段）',soundDescription:'水母没有任何发声能力，它们在海洋中无声地漂游了数亿年。',funFacts:['水母95%是水——没有大脑、心脏、血液和骨骼，却存活了5亿年以上。','灯塔水母理论上可以永生——通过细胞逆转回到幼体状态重新生长。','箱水母的毒液是地球上最致命的毒之一——可致人几分钟内心脏骤停。','某些水母直径可达2米——触手长30米，比蓝鲸还长。','水母没有肛门——食物和废物通过同一个口进出。']},
firefly:{id:'firefly',name:'萤火虫',emoji:'🪲',category:'昆虫',habitat:'森林/草地/湿地',habitatEmoji:'🌿',diet:'幼虫肉食性（蜗牛为主）；成虫食性或以花蜜为食',size:'体长 5-25 mm',weight:'约0.1 g',lifespan:'成虫期约2-4周',personality:'浪漫、闪光、夜晚精灵',description:'萤火虫是大自然最浪漫的"发光艺术家"。它们发出的生物冷光效率接近100%——几乎不产生热量（相比之下白炽灯泡只有10%效率浪费为热量）。每种萤火虫都有独特的"闪光密码"——闪光频率、持续时间和间隔都不同，用于同种求偶识别。萤火虫的光是地球上最纯粹的自然光之一。然而光污染正严重威胁着萤火虫——城市灯光干扰了它们的求偶信号，导致许多地区萤火虫数量急剧下降。',conservationStatus:'种群下降',conservationClass:'at-risk',babyName:'萤火虫幼虫（发光蠕虫 glowworm）',soundDescription:'萤火虫不发出任何声音，它们用光在夜空中"歌唱"——每一闪都是无声的诗篇。',funFacts:['萤火虫的生物冷光效率接近100%——几乎是"完美光"，完全不产生热。','每种萤火虫有独特的"闪光密码"——类似莫尔斯电码用于求偶。','萤火虫幼虫（发光蠕虫）也是发光的——在草丛中星星点点如银河落地。','雄萤火虫在空中飞着闪光，雌萤火虫停在草叶上回闪——双向"光学对话"。','光污染是萤火虫最大的威胁——城市灯光严重干扰了它们的求偶闪光信号。']},
hedgehog:{id:'hedgehog',name:'刺猬',emoji:'🦔',category:'哺乳动物',habitat:'森林/草地/城市花园',habitatEmoji:'🌳',diet:'杂食性（昆虫、蠕虫、蜗牛、果实）',size:'体长 15-30 cm',weight:'250-1500 g',lifespan:'3-7 年',personality:'害羞、温和、夜间精灵',description:'刺猬是城市花园中最受欢迎的"小居民"——全身约5000-7000根刺是它们的防御武器。遇到危险时刺猬会卷成刺球，让任何天敌难以下口。刺猬对蛇毒有天然抗性——即使被蝰蛇咬了也只是轻微不适。它们是夜行性动物，常在月光下在花园中"巡逻"捕食害虫（蛞蝓和蜗牛），是天然的"花园卫士"。当刺猬闻到陌生的或令人愉悦的气味时，会把嘴里的唾液揉遍全身——这个奇特的行为叫做"自涂"。',conservationStatus:'无危 (LC)',conservationClass:'',babyName:'小刺猬 hoglet（刺猬宝宝）',soundDescription:'发出咕噜咕噜的哼哼声和细微的咻咻声，受惊时会发出嘶嘶声和尖叫声。',funFacts:['刺猬全身约有5000-7000根刺——每根刺都是一根特化的空心毛发。','刺猬对蛇毒有天然抗性——是少数不怕毒蛇咬的小型哺乳动物。','刺猬有个奇特行为叫"自涂"——把嘴里的唾液涂遍全身，原因至今未明。','小刺猬出生时刺在皮肤下——几小时后刺才会冒出体表（像人类长牙）。','刺猬是英国最受欢迎的花园动物——比松鼠和狐狸更受欢迎。']},
komodo_dragon:{id:'komodo_dragon',name:'科莫多巨蜥',emoji:'🦎',category:'爬行动物',habitat:'热带小岛/稀树草原',habitatEmoji:'🏝️',diet:'肉食性（鹿、野猪、水牛、腐肉）',size:'体长 2-3 m',weight:'70-140 kg',lifespan:'30-50 年',personality:'霸气、孤傲、顶级掠食者',description:'科莫多巨蜥是世界上现存最大的蜥蜴，活脱脱的"现代恐龙"。它们只生活在印度尼西亚的少数岛屿上，全球仅存3000-5000只。科莫多巨蜥的唾液中含有毒腺（这是近年科学新发现，此前认为它们靠口腔细菌杀死猎物）——毒液含有抗凝血成分导致猎物缓慢出血死亡。科莫多巨蜥可以吞下自身体重80%的食物（一餐），然后靠晒太阳缓慢消化数周。它们有着惊人的嗅觉，能闻到数公里外的腐肉气味。',conservationStatus:'易危 (VU)',conservationClass:'at-risk',babyName:'小科莫多巨蜥（幼蜥）',soundDescription:'发出嘶嘶声作为威胁警告，偶尔伴随喉咙的咕噜声。',funFacts:['科莫多巨蜥成年体能吃下自身体重80%的食物——约等于人类一餐吃掉60公斤。','科莫多巨蜥有毒腺——唾液中的毒液含抗凝血成分，导致猎物缓慢死亡。','小科莫多巨蜥一生下来就往树上爬——因为成体会吃自己的幼崽。','科莫多巨蜥能闻到5公里外的腐肉——嗅觉是同体型动物中最灵敏之一。','科莫多巨蜥是孤雌生殖的——没有雄性的情况下雌性能独自产卵繁衍（全为雄性后代）。']},
macaw:{id:'macaw',name:'金刚鹦鹉',emoji:'🦜',category:'鸟类',habitat:'热带雨林',habitatEmoji:'🌴',diet:'杂食性（果实、种子、坚果、花蜜）',size:'体长 30-100 cm',weight:'0.3-1.7 kg',lifespan:'40-80 年',personality:'聪明、社交、色彩斑斓',description:'金刚鹦鹉是鹦鹉家族中体型最大的成员，以彩虹般绚烂的羽毛和超凡的智商著称。它们能活60-80年——有些甚至活过100岁。金刚鹦鹉能学习大量词汇和概念，智商相当于4-5岁的儿童。在野外，它们成对或成群生活，会食用黏土来中和食物中的毒素（称为"黏土舔食"）。不幸的是，由于森林砍伐和非法宠物贸易，多种金刚鹦鹉已在野外灭绝或极度濒危。',conservationStatus:'多种濒危/极危',conservationClass:'endangered',babyName:'小金刚鹦鹉 chick',soundDescription:'发出极其响亮的嘎嘎叫声和嘶哑的尖叫声，能穿透雨林在数公里外听到；也能模仿人类语言和各种环境声音。',funFacts:['金刚鹦鹉寿命可达60-80年——有些甚至陪主人走完一生还能活更久。','金刚鹦鹉的智商相当于4-5岁儿童——会使用工具和解决复杂问题。','金刚鹦鹉吃东西要"吃土"——每天去特定河岸舔黏土来中和食物中的天然毒素。','金刚鹦鹉一生忠诚伴侣——伴侣死后剩下的那只停止进食，日渐憔悴。','金刚鹦鹉的喙咬合力极大——足以咬开巴西坚果。']},
clownfish:{id:'clownfish',name:'小丑鱼',emoji:'🐠',category:'海洋生物',habitat:'珊瑚礁/海葵丛',habitatEmoji:'🪸',diet:'杂食性（浮游生物、藻类、小型甲壳类）',size:'体长 6-11 cm',weight:'约50 g',lifespan:'6-10 年',personality:'活泼、勇敢、家庭观强',description:'小丑鱼因《海底总动员》中尼莫的形象而全球闻名，它们与海葵之间的共生关系是大自然最精妙的合作之一。小丑鱼身上有一层特殊黏液使它们对海葵的刺细胞免疫，能安全地居住在有毒的海葵保护中。作为回报，小丑鱼会清理海葵、驱赶海葵的捕食者，并为海葵提供食物残渣。所有小丑鱼生下来都是雄性——群体中最大个体会转变为雌性成为"女王"（不可逆），这是动物界中少有的"雄性先熟雌雄同体"。',conservationStatus:'无危 (LC)',conservationClass:'',babyName:'小丑鱼幼鱼',soundDescription:'发出咔哒声和吱吱声——通过摩擦牙齿和颌骨发声，用于群体中的社交互动。',funFacts:['小丑鱼身上有特殊黏液使其对海葵刺细胞免疫——是海洋界最完美的跨界搭档。','所有小丑鱼都是"先男后女"——群体中最大的那只变成雌性当"女王"。','如果女王死亡——最大的雄性会在几天内变性为雌性接替领导位置。','小丑鱼和海葵的关系是互利共生——海葵保护小丑鱼，小丑鱼清理海葵。','电影《海底总动员》上映后小丑鱼宠物需求飙升——但95%的宠物小丑鱼来自野外捕捞。']},
lion:{id:'lion',name:'非洲狮',emoji:'🦁',category:'哺乳动物',habitat:'稀树草原',habitatEmoji:'🌾',diet:'肉食性（斑马、角马、野牛、羚羊）',size:'体长 1.4-2.5 m',weight:'120-250 kg（雄狮）',lifespan:'10-15 年',personality:'威严、家族至上、草原之王',description:'非洲狮是草原之王，也是唯一群居的猫科动物。一个狮群通常由1-3只雄狮、数只雌狮和它们的幼崽组成。有趣的是，狩猎主要由雌狮完成——雄狮则负责保卫领地。雄狮的鬃毛不仅是力量的象征，更是"健康评分卡"——颜色越深越浓密的鬃毛表明睾酮水平越高，对雌狮越有吸引力。狮子的吼声是猫科动物中最响亮的——能传到8公里外，宣示领地不可侵犯。',conservationStatus:'易危 (VU)',conservationClass:'at-risk',babyName:'小狮子 cub（幼狮）',soundDescription:'发出震撼草原的吼声——声压级达114分贝，能传到8公里外，用于标示领地。',funFacts:['狮子是唯一群居的猫科动物——其他猫科动物都是独行侠。','狩猎主要由雌狮完成（85%的食物）——雄狮的鬃毛太显眼容易暴露。','雄狮的鬃毛颜色越深、密度越大——在雌狮眼中越帅，代表更高的睾酮水平。','狮子一天睡18-20小时——和你家的猫一模一样。','狮子的吼声能传到8公里外——相当于在一座城市的这头吼，那头的都能听到。']},
zebra:{id:'zebra',name:'斑马',emoji:'🦓',category:'哺乳动物',habitat:'稀树草原',habitatEmoji:'🌾',diet:'草食性（草为主）',size:'体高 1.2-1.5 m（肩高）',weight:'200-450 kg',lifespan:'20-25 年',personality:'警觉、群居、坚韧',description:'斑马是非洲大草原上最具标志性的动物之一，每匹斑马的条纹如同指纹一样独一无二。科学家至今仍在争论斑马条纹的功能——最被认可的理论是"防蝇论"：条纹产生的微气流扰动能有效阻止采采蝇和马蝇的叮咬。斑马是马科动物中唯一从未被人类真正驯化的——它们的野性比马更强。斑马的眼睛位于头部侧面，几乎360度的视野帮助它们在草原上尽早发现狮子等捕食者。',conservationStatus:'无危 (LC)',conservationClass:'',babyName:'小斑马 foal',soundDescription:'发出类似驴叫的嘶鸣声（bray）——比马的嘶声更沙哑尖锐，声音在草原上可以传很远。',funFacts:['每匹斑马的条纹独一无二——就像人类的指纹可以用于身份识别。','斑马的黑白条纹最重要的功能可能是防蝇——条纹能扰乱吸血苍蝇的视觉判断。','斑马是唯一从未被人类真正驯化的马科动物——它们比马更"野"。','斑马眼睛几乎有360度视野——在草原上几乎能看到身后的一切。','小斑马出生后15分钟就能站起来——1小时后就能和妈妈一起奔跑。']},
arctic_fox:{id:'arctic_fox',name:'北极狐',emoji:'🦊',category:'哺乳动物',habitat:'北极苔原',habitatEmoji:'❄️',diet:'杂食性（旅鼠、鸟类、鸟蛋、腐肉、浆果）',size:'体长 46-68 cm',weight:'2.5-9 kg',lifespan:'3-6 年（野生）',personality:'机敏、适应力强、生存专家',description:'北极狐是北极最善于伪装的猎手——它们的毛色随季节变换：冬天洁白如雪融入冰原，夏天棕灰如土藏在苔原。这种"双季皮毛"是动物界最极致的季节性伪装之一。北极狐能在零下50度的严寒中生存，多亏了它们厚实的皮毛——北极狐拥有哺乳动物中最保暖的皮毛。它们的脚掌也覆盖着浓密的毛，像天然雪地靴。北极狐的耳朵比赤狐小得多——这减少了热量散失面积。',conservationStatus:'无危 (LC)',conservationClass:'',babyName:'小北极狐 kit（幼崽）',soundDescription:'发出尖锐的吠声和唧唧叫声，声音比赤狐更高频，适合在极地环境中传播。',funFacts:['北极狐毛色随季节变色——冬白夏棕，是动物界最极致的"季节性伪装"。','北极狐的皮毛是哺乳动物中最保暖的——在零下50度的暴风雪中都不会发抖。','北极狐的耳朵小巧圆润——减少热量散失面积，适应极地严寒。','北极狐脚掌覆盖厚毛——天然雪地靴，走路悄无声息。','北极狐极其耐饿——可以储存夏季剩余的食物在冻土中，冬天再挖出来吃。']},
squirrel:{id:'squirrel',name:'松鼠',emoji:'🐿️',category:'哺乳动物',habitat:'森林/城市公园',habitatEmoji:'🌳',diet:'杂食性（坚果、种子、果实、蘑菇、鸟蛋）',size:'体长 19-28 cm',weight:'250-500 g',lifespan:'5-10 年（野生）',personality:'机灵、勤劳、健忘',description:'松鼠是森林中最忙碌的小居民，每年秋天埋藏数千颗坚果为冬天做准备。但它们的记忆力并没有那么好——松鼠只记得约25%的藏匿位置，未被找回的坚果往往长成了新的树木。从某种意义上说，松鼠是大自然最重要的"植树者"。松鼠的门齿永不停止生长——必须通过不断啃咬坚果来磨牙。松鼠的后腿踝关节可以180度旋转——这使它们能头朝下从树干上敏捷地爬下。',conservationStatus:'无危 (LC)',conservationClass:'',babyName:'小松鼠 kit（幼崽）',soundDescription:'发出吱吱喳喳的叫声和快速的"chuk chuk"警告声，尾巴的摆动方向也传递不同的信息。',funFacts:['松鼠每年埋藏数千颗坚果，只记得约25%的位置——剩下的都长成了新树。','从某种意义上说，松鼠是世界最大的"义务植树者"——多亏了它们的健忘。','松鼠的后脚踝能转180度——所以能头朝下从树干上跑下来。','松鼠的牙齿永不停止生长——啃坚果这个行为不仅为吃，也为磨牙。','松鼠能"闻"出坚果有没有虫——里面被虫啃过的坚果它不会碰。']},
poison_dart_frog:{id:'poison_dart_frog',name:'箭毒蛙',emoji:'🐸',category:'两栖动物',habitat:'热带雨林',habitatEmoji:'🌴',diet:'肉食性（蚂蚁、白蚁、小昆虫）',size:'体长 1.5-6 cm',weight:'1-5 g',lifespan:'3-15 年',personality:'炫目、神秘、小身材大威力',description:'箭毒蛙是地球上色彩最鲜艳的动物之一，荧光蓝、亮橙、亮黄等"警告色"告诉所有天敌——"我不好吃，吃了会死"。其中最毒的金色箭毒蛙（Phyllobates terribilis）一只的毒液足以杀死10个成年男性——毒素通过皮肤分泌，亚马逊土著用这种毒涂抹箭头（箭毒蛙由此得名）。有趣的是，人工饲养的箭毒蛙完全没有毒性——因为它们的毒力来自野外吃的特定有毒昆虫。',conservationStatus:'多种濒危',conservationClass:'endangered',babyName:'箭毒蛙蝌蚪',soundDescription:'发出各种叫声——嗡嗡声、啾啾声、颤音——不同种类的叫声各不相同，用于求偶和领地宣示。',funFacts:['箭毒蛙是地球上色彩最鲜艳的动物——鲜艳颜色是"警告色"表示有毒。','一只金色箭毒蛙的毒素能杀死10个成年人——自然界最强毒之一。','人工饲养的箭毒蛙完全没有毒——因为毒素来自野外吃的特定毒虫。','箭毒蛙是尽职的家长——背着蝌蚪爬到树上的凤梨科植物小水池中养育。','毒蛙毒素有多强？2微克就能致人死命——大概是一粒食盐大小的毒粉。']},
camel:{id:'camel',name:'双峰驼',emoji:'🐪',category:'哺乳动物',habitat:'沙漠/戈壁',habitatEmoji:'🏜️',diet:'草食性（草、灌木、干草、甚至带刺的沙漠植物）',size:'体高 1.8-2.3 m（肩高）',weight:'300-1000 kg',lifespan:'40-50 年',personality:'坚韧、沉稳、耐劳',description:'双峰驼是沙漠中最坚韧的生存专家。很多人以为驼峰里储存的是水——其实是脂肪（最多可储存36公斤），这些脂肪被分解时可以产生代谢水。骆驼能在10分钟内喝下体重的1/3水量（约100多升水）而不发生水肿——它们的血红细胞是椭圆形的，在极度稀释环境中不会破裂。骆驼的鼻孔可以完全闭合以抵挡沙尘暴，浓密的双层睫毛和第三层眼睑是天然的"沙漠护目镜"。',conservationStatus:'极危（野生双峰驼）',conservationClass:'endangered',babyName:'小骆驼 calf',soundDescription:'发出低沉的咕噜声和哼哼声，不满时会发出类似喷嚏的喷鼻声，愤怒时张开嘴发出嘶哑的吼叫。',funFacts:['驼峰里装的是脂肪不是水——背一个驼峰是"便携午餐盒"的概念。','骆驼10分钟能喝掉100多升水——约等于人类两口气喝掉20升而不会有事。','骆驼的红细胞是椭圆形的——这使它们在极度稀释的环境中不会破裂（人类圆形红细胞会爆）。','骆驼鼻孔能完全闭合——遇到沙尘暴自动"关窗"。','骆驼能在沙漠中不吃不喝行走数周——靠驼峰脂肪分解产生能量和水。']},
beluga:{id:'beluga',name:'白鲸',emoji:'🐋',category:'海洋生物（哺乳动物）',habitat:'北极海域',habitatEmoji:'❄️',diet:'肉食性（鱼类、鱿鱼、章鱼、甲壳类）',size:'体长 3-5.5 m',weight:'700-1600 kg',lifespan:'35-50 年',personality:'好奇、社交、表情丰富',description:'白鲸被称为"海洋金丝雀"——因为它们是鲸类中发声最丰富的，能发出数百种不同声音（哨声、咔哒声、啾啾声、铃声、甚至模仿其他声音）。白鲸是唯一会"做面部表情"的鲸类——它们的颈部比其他鲸鱼灵活，头部可以向上、向下和向两侧转动，嘴唇周围肌肉能做出各种"表情"。小白鲸出生时是深灰色，随着成长逐渐变白，大约5-7岁完全变成标志性的纯白色。',conservationStatus:'近危 (NT)',conservationClass:'at-risk',babyName:'小白鲸 calf',soundDescription:'发出数百种多变声音——高音哨声像鸟鸣、低沉的咕咕声、复杂的咔哒序列——因此被称为"海洋金丝雀"。',funFacts:['白鲸是唯一会"做表情"的鲸类——颈部灵活可转头，嘴唇周围肌肉会变化表情。','白鲸被称为"海洋金丝雀"——能发出几百种不同声音进行复杂交流。','小白鲸出生时是深灰色的——随着年龄增长慢慢变白，像"褪色"一样。','白鲸可以向后游——不像大多数鲸鱼只能向前。','白鲸额头那个"包"叫额隆——可以改变形状来调整回声定位的频率聚焦。']},
ladybug:{id:'ladybug',name:'七星瓢虫',emoji:'🐞',category:'昆虫',habitat:'草地/花园/农田',habitatEmoji:'🌿',diet:'肉食性（蚜虫、介壳虫、螨虫）',size:'体长 5-8 mm',weight:'约0.02 g',lifespan:'1-2 年',personality:'小巧、勤快、幸运象征',description:'七星瓢虫是大自然中最受欢迎的甲虫——在很多文化中是"幸运"的象征。一只七星瓢虫一生能吃掉超过5000只蚜虫，是农民和菜园最忠实的朋友。瓢虫华丽的红底黑斑是"警戒色"——告诉天敌"我不好吃"。遇到危险时瓢虫会从腿部关节渗出具刺激性气味的黄色液体来"自保"。七星瓢虫在冬天会成群冬眠——数百只聚在一起在树皮下或墙缝中抱团取暖。',conservationStatus:'无危 (LC)',conservationClass:'',babyName:'瓢虫幼虫',soundDescription:'瓢虫几乎不发出能被人耳感知的声音，但它们可能在互相靠近时发出极微弱的沙沙声。',funFacts:['一只七星瓢虫一生能吃超过5000只蚜虫——是自然界最棒的"杀虫小卫士"。','瓢虫腿上能渗出难闻的黄色液体——防御天敌的"化学武器"。','七星瓢虫的颜色是警戒色——红黑配色等于说"我不好吃"。','瓢虫在全世界几乎所有文化中都是幸运的象征。','瓢虫幼虫看起来像小鳄鱼——有6条腿和刺状突起，完全不像成虫。']},
monarch_butterfly:{id:'monarch_butterfly',name:'帝王斑蝶',emoji:'🦋',category:'昆虫',habitat:'草原/花丛/越冬森林',habitatEmoji:'🌺',diet:'幼虫专食乳草；成虫吸食花蜜',size:'翼展 8.9-10.2 cm',weight:'约0.5 g',lifespan:'夏代2-6周；越冬代6-8个月',personality:'坚韧、史诗、生命接力',description:'帝王斑蝶以其史诗级的迁徙而闻名——这是自然界最令人惊叹的现象之一。每年秋天，数以百万计的帝王斑蝶从加拿大和美国北部出发，飞行超过4000公里到达墨西哥中部的山区森林中越冬。最不可思议的是，完成这段旅程的蝶并不是出发的那一代——帝王斑蝶需要3-4代完成一次完整的来回迁徙，每一代都"接力"飞一段路。它们如何知道目的地的位置依然是科学界最迷人的谜题之一。',conservationStatus:'濒危 (EN)',conservationClass:'endangered',babyName:'帝王斑蝶幼虫（毛毛虫）',soundDescription:'帝王斑蝶不发出任何声音，它们的迁徙之舞本身就是最壮美的"无声交响曲"。',funFacts:['帝王斑蝶每年迁徙超过4000公里穿越北美——需要3-4代才能完成一次完整来回。','每一代蝶都不知道"最终目的地"——它们像是内置了GPS和祖先的路书。','帝王斑蝶幼虫只吃乳草——一种有毒植物，把毒素储存在体内使天敌远离。','越冬的帝王斑蝶聚集密度极大——一棵树上能聚集数万只，树枝被压弯。','帝王斑蝶的橙黑色是"警告色"——告诉鸟类"我有毒不好吃"。']},
ant:{id:'ant',name:'蚂蚁',emoji:'🐜',category:'昆虫',habitat:'全球（除南极外）',habitatEmoji:'🌍',diet:'杂食性（植物性分泌物、昆虫、真菌、种子）',size:'体长 0.75-52 mm',weight:'1-5 mg',lifespan:'工蚁数月-数年；蚁后可活15-30年',personality:'顽强、协作、团队至上',description:'蚂蚁是地球上最成功的社会性昆虫——它们在全球的生物量总和超过了所有野生鸟类和哺乳动物之和。蚂蚁的"超级力量"是它们的社会组织：一个蚁群拥有数百万成员，分工精细到有工蚁、兵蚁、育幼蚁、蚁后等不同"职业"。蚂蚁能举起自身体重50倍以上的物体（相当于一个人举起一辆卡车）。切叶蚁甚至从事"农业"——它们将树叶带回巢穴用来"种植"真菌作为食物，这是地球上除人类外最复杂的农业系统。',conservationStatus:'无危 (LC)',conservationClass:'',babyName:'蚂蚁幼虫',soundDescription:'蚂蚁通过摩擦身体部位发出极微弱的"嘶嘶"声（蹭音），主要用于紧急警报。',funFacts:['蚂蚁能举起自身体重50倍的东西——相当于一个人扛起一辆小卡车。','全球蚂蚁总重量超过所有野生鸟类和哺乳动物的总和。','切叶蚁从事"农业"——用树叶种植真菌作为食物，比人类早数百万年就发明了农业。','蚁后可活15-30年——是一只普通工蚁寿命的几百倍。','蚂蚁靠化学信息素交流——用气味留下"路标"引导同伴找到食物。']},
honey_bee:{id:'honey_bee',name:'蜜蜂',emoji:'🐝',category:'昆虫',habitat:'蜂巢/蜜源植物丰富区',habitatEmoji:'🌸',diet:'蜜食性（花蜜和花粉）',size:'体长 10-15 mm',weight:'约0.1 g',lifespan:'工蜂4-6周；蜂王3-5年',personality:'勤劳、组织严密、地球守护者',description:'蜜蜂是地球上最重要的传粉昆虫——全球约1/3的农作物依赖蜜蜂授粉。一只工蜂一生辛勤采蜜飞行约800公里，只产出不到一茶匙（约1/12）蜂蜜。蜜蜂的"摇摆舞"是大自然最惊人的通讯行为之一——返巢的侦察蜂用复杂的八字舞蹈告诉同伴花蜜的方向、距离和质量。蜂群的决定通过"民主投票"——数百只侦察蜂通过摇摆舞的激烈程度"竞选"新巢位置，最终信息达到共识后整群飞往新家。',conservationStatus:'种群下降',conservationClass:'at-risk',babyName:'蜜蜂幼虫（蜂蛹）',soundDescription:'翅膀嗡嗡声是标志——翅膀每秒振250次产生独特嗡嗡声，频率变化表达不同信息。',funFacts:['一只工蜂一生采蜜仅约1/12茶匙——你早餐涂在面包上的蜂蜜是数百只蜜蜂一生的劳动。','蜜蜂用复杂的"摇摆舞"来传递信息——方向和距离编码在舞步中。','全球约1/3的农作物依赖蜜蜂传粉——没有蜜蜂人类面临严重的食物危机。','蜂群决定新家时通过"民主投票"——数百只侦察蜂用舞蹈"竞选"。','雄蜂的唯一职责是和蜂王交配——交配后立刻死亡（而且生殖器会爆开留在蜂王体内）。']},
cicada:{id:'cicada',name:'蝉',emoji:'🦗',category:'昆虫',habitat:'森林/城市绿化带',habitatEmoji:'🌳',diet:'幼虫吸食树根汁液；成虫吸食树汁',size:'体长 2-5 cm',weight:'约0.5-2 g',lifespan:'幼虫期2-17年；成虫期2-4周',personality:'执着、震撼、夏日诗人',description:'蝉是地球上生命周期最离奇的昆虫之一。某些"周期蝉"在地下蛰伏13年或17年之久——所有个体在同一年同步出土，以数十亿只的规模覆盖整个地区。它们为何选择质数年（13年和17年）作为周期？科学家认为这使捕食者无法"追踪"其出现规律。雄蝉的鸣声是昆虫界最响亮的——可达120分贝（相当于摇滚演唱会音量），由腹部特殊的鼓膜器官产生。在东方文化中，蝉象征复活与永生。',conservationStatus:'无危 (LC)',conservationClass:'',babyName:'蝉若虫（地下幼虫）',soundDescription:'雄蝉发出极其响亮的持续鸣声——可达120分贝，是昆虫界最响的合唱。不同种类的鸣声各有特色。',funFacts:['"周期蝉"在地下蛰伏13或17年——然后在同一天数十亿只集体出土。','为什么是13年和17年？因为这是质数——捕食者无法"跟踪"规律出现。','蝉的鸣叫声可达120分贝——几乎和摇滚演唱会一样响。','蝉在地下生活了十几年，出土后只活2-4周——一生中最灿烂的部分只有几周。','东方文化中蝉象征复活——古人将玉蝉放入逝者口中希望来世重生。']},
chinchilla:{id:'chinchilla',name:'龙猫',emoji:'🐭',category:'哺乳动物',habitat:'安第斯高山',habitatEmoji:'⛰️',diet:'草食性（干草、专用颗粒饲料、少量蔬菜和水果）',size:'体长 22-38 cm',weight:'370-850 g',lifespan:'10-20 年',personality:'柔软、安静、爱干净',description:'龙猫（毛丝鼠）拥有全世界动物中最柔软的皮毛——每个毛囊里能长出60根毛发（人类每个毛囊只长1根），毛发密度高达每平方厘米20万根。正因为如此极致柔软的皮毛，龙猫在历史上被大量猎杀用于皮草贸易——如今所有龙猫皮草用的都是养殖个体，野生种群仍处于濒危状态。龙猫每天需要"沙浴"来保持皮毛清洁干燥——不能用水洗澡，因为浓密的毛发极难晾干，容易导致真菌感染。它们的弹跳力惊人，能从地面直接跳上超过1米高的平台。',conservationStatus:'濒危 (EN)',conservationClass:'endangered',babyName:'小龙猫 kit',soundDescription:'发出轻柔的咕噜声和细微的吱吱声，开心时会发出像狗一样短促的"汪"声。',funFacts:['龙猫的毛发密度是所有陆地动物中最高的——每个毛囊60根毛（人类只有1根）。','龙猫不能用水洗澡——必须用特制的火山灰"沙浴"来清洁油脂。','龙猫因为极致柔软的皮毛几乎被猎杀到灭绝——现在所有宠物龙猫都是人工繁殖的。','龙猫弹跳力超强——能从地面一跳超过1米高的平台。','龙猫开心时会发出像小狗一样的短促"汪"声——配上柔软外表萌翻众人。']},
lemur:{id:'lemur',name:'环尾狐猴',emoji:'🐒',category:'哺乳动物（灵长类）',habitat:'马达加斯加森林',habitatEmoji:'🏝️',diet:'杂食性（果实、树叶、花、昆虫、树皮）',size:'体长 39-46 cm（尾长56-63 cm）',weight:'2.2-3.5 kg',lifespan:'16-19 年',personality:'社交、好奇心强、灵活',description:'环尾狐猴是马达加斯加最著名的动物，以长长的黑白相间环纹尾巴和张开双臂"晒太阳"的经典姿势闻名。它们早晨起床后第一件事就是面向太阳张开双臂——这个看似"冥想"或"瑜伽"的动作其实是用腹部薄薄的皮肤吸收阳光快速暖身。环尾狐猴群体是"女儿国"——雌性主导社会，雄性不受尊重。它们用尾巴分泌的刺鼻气味在空气中"打架"——雄性向对方尾巴抹气味然后甩向对方，这种"气味战"叫"stink fight"。',conservationStatus:'濒危 (EN)',conservationClass:'endangered',babyName:'小环尾狐猴（幼崽）',soundDescription:'发出多种叫声包括喵喵声、咕噜声和警报尖叫；群体中频繁用不同叫声保持联络。',funFacts:['环尾狐猴社会是"母系社会"——雌性是绝对领袖，雄性地位很低。','环尾狐猴早晨面向太阳张臂"冥想"——其实是用腹部黑色皮肤快速暖身。','环尾狐猴用尾巴的气味"打架"——雄性对着尾巴抹气味然后向对方甩。','环尾狐猴是所有灵长类中唯一会进行"气味战争"的物种。','环尾狐猴只生活在马达加斯加岛——地球上没有任何其他地方有野生狐猴。']},
otter:{id:'otter',name:'水獭',emoji:'🦦',category:'哺乳动物',habitat:'河流/湖泊/海岸',habitatEmoji:'💧',diet:'肉食性（鱼类、螃蟹、虾、青蛙）',size:'体长 60-120 cm',weight:'5-14 kg',lifespan:'8-12 年',personality:'贪玩、聪明、家庭至上',description:'水獭是动物界的"全能水上运动员"——它们是天生的游泳高手，能在水中灵活翻滚、潜水捕鱼。水獭最喜欢仰泳——把食物放在肚皮上当"餐桌"，用石头敲开贝壳的"绝活"让人叹为观止。水獭群居生活，家庭成员间感情深厚——它们会手拉手在水上漂浮避免被水流冲散。水獭是所有鼬科动物中最社会化的——一家人一起捕鱼、一起玩耍、一起晒太阳。因为毛皮极柔软温暖，水獭曾遭大规模猎杀。',conservationStatus:'近危 (NT)',conservationClass:'at-risk',babyName:'小水獭 pup（幼獭）',soundDescription:'发出尖锐的哨声、唧唧声和吱吱声——高频叫声在水边环境中传播效果极好。',funFacts:['水獭是少数会使用工具的哺乳动物——用石头敲开贝壳是它们的招牌技能。','水獭肚皮是它们的"餐桌"——仰泳时将食物放在肚皮上享用。','水獭家庭成员拉手在水上漂浮——避免睡着时被水冲散。','水獭是最爱玩的动物之一——会制作"水上滑梯"反复滑上滑下。','水獭的皮毛密度很高——每平方厘米约10万根毛，即使在冰水中也不会失温。']},
narwhal:{id:'narwhal',name:'一角鲸',emoji:'🐋',category:'海洋生物（哺乳动物）',habitat:'北极海域',habitatEmoji:'❄️',diet:'肉食性（鱼类、鱿鱼、虾）',size:'体长 4-5.5 m',weight:'800-1600 kg',lifespan:'50-60 年',personality:'神秘、优雅、北极独角兽',description:'一角鲸被称为"海洋独角兽"——因为雄鲸（偶尔雌鲸）头顶有一根突出嘴唇的螺旋长牙，长达1.5-3米。这根"角"其实是一颗特化的左上犬齿——它是自然界唯一的"直螺旋角"，曾经引发了关于独角兽神话的灵感。科学家最近发现这根长牙上布满数百万个神经末梢——它可以感知水温、盐度和水压变化，是一根活的"环境传感器"。一角鲸生活在北极寒冷水域，是全球最不易见到的鲸类之一，至今仍笼罩着许多神秘色彩。',conservationStatus:'近危 (NT)',conservationClass:'at-risk',babyName:'小一角鲸 calf',soundDescription:'发出各种哨声、咔哒声和脉冲声——会用回声定位在极夜黑暗中导航和捕猎。',funFacts:['一角鲸的"角"其实是特化牙齿——是自然界唯一的直螺旋长牙。','中世纪欧洲人相信独角兽的角是一角鲸的长牙——于是大量猎杀一角鲸。','一角鲸长牙上有数百万神经末梢——可以感知水温、盐度和水压变化。','一角鲸的"角"可达3米长，重10公斤——比整个身体还长一半。','一角鲸生活在北极深海冰层下——是最难在野外见到的鲸类之一。']},
okapi:{id:'okapi',name:'㺢㹢狓',emoji:'🦒',category:'哺乳动物',habitat:'刚果热带雨林',habitatEmoji:'🌴',diet:'草食性（树叶、蕨类、蘑菇、果实、黏土）',size:'体长 1.9-2.5 m',weight:'200-350 kg',lifespan:'20-30 年',personality:'害羞、隐秘、独行侠',description:'㺢㹢狓是地球上最"隐秘"的大型哺乳动物之一——直到1901年才被西方科学界发现（当地土著早已知道这种动物）。乍一看它像斑马的亲戚（后腿有斑马条纹），或者马的近亲——但DNA分析揭示㺢㹢狓其实是长颈鹿唯一的现存近亲。㺢㹢狓的舌头超级长（35-45厘米），能舔到自己的眼睛和耳朵。它们生活在刚果盆地的茂密热带雨林中，数量极其稀少，被誉为"非洲独角兽"。',conservationStatus:'濒危 (EN)',conservationClass:'endangered',babyName:'小㺢㹢狓 calf',soundDescription:'极其安静，偶尔发出极其微弱的低频率叫声——在雨林中几乎听不到。',funFacts:['㺢㹢狓是长颈鹿唯一的现存近亲——不是马也不是斑马的亲戚。','㺢㹢狓直到1901年才被科学界"发现"——之前只存在于刚果土著的传说中。','㺢㹢狓的舌头长达35-45厘米——能轻松舔到自己的眼睛和耳朵内部。','㺢㹢狓后腿上的条纹是"伪装"——在雨林斑驳光线中与周遭融为一体。','㺢㹢狓走路极其安静——它们的步态适应了在厚厚落叶层中悄无声息地移动。']},
kiwi:{id:'kiwi',name:'鹬鸵',emoji:'🐦',category:'鸟类',habitat:'新西兰森林',habitatEmoji:'🌿',diet:'杂食性（蠕虫、昆虫、果实、种子）',size:'体高 25-45 cm（像鸡大小）',weight:'1.2-3.8 kg',lifespan:'25-50 年',personality:'害羞、夜行、独特',description:'鹬鸵（Kiwi鸟）是新西兰的国鸟和骄傲。它有许多"反鸟类"的特征：不能飞（翅膀几乎退化）、鼻孔长在喙的最尖端（所有鸟类中唯一）、羽毛像粗毛、骨髓像哺乳动物一样实心而非空心的。鹬鸵的蛋是鸟类中相对于体型的"世界纪录"——一个鹬鸵蛋占母体体重的15%-25%（相当于人类妈妈生出一个2-3岁的孩子）。更特别的是，孵蛋和育幼工作由雄鸟承担。因为独特的习性和外形，新西兰人自豪地称自己为"Kiwi"。',conservationStatus:'易危 (VU)',conservationClass:'at-risk',babyName:'小鹬鸵 chick',soundDescription:'发出尖锐的口哨声和颤音——ki-wi～ki-wi～（这也是它的名字来源），雄鸟叫声频率低于雌鸟。',funFacts:['鹬鸵不能飞——翅膀几乎退化到看不见。','鹬鸵的鼻孔长在喙的最尖端——所有鸟类中唯一一个。','鹬鸵的蛋是鸟类中相对于身体最大的——占母体重量的15%-25%。','鹬鸵的"羽毛"更像狗的粗毛——完全没有飞行羽毛的结构。','新西兰人被称为"Kiwi"——就是来自这种可爱的国鸟。']},
armadillo:{id:'armadillo',name:'犰狳',emoji:'🦔',category:'哺乳动物',habitat:'草原/沙漠/森林',habitatEmoji:'🏜️',diet:'杂食性（昆虫、幼虫、小型脊椎动物、果实）',size:'体长 15-100 cm',weight:'0.12-60 kg',lifespan:'7-20 年',personality:'胆小、好奇、铠甲勇士',description:'犰狳是地球上唯一身披骨质铠甲的哺乳动物——它们的背部和头部覆盖着骨板，像迷你的"古代骑士"。三带犰狳是唯一能卷成完美球体的犰狳物种——一旦感觉到威胁"封球"，连狮子都咬不开。犰狳是钻洞高手，一晚能挖掘数个洞穴。犰狳有"跳跃惊吓"的行为——遇到威胁时垂直弹跳1米高，这个"弹射逃跑"策略非常有效。犰狳也是少数能与人类共患麻风病的动物之一——这使它们成为了重要的医学研究模型。',conservationStatus:'多种近危',conservationClass:'at-risk',babyName:'小犰狳 pup',soundDescription:'发出咕噜声和轻哼声，受惊时发出尖锐的叽叽声。',funFacts:['犰狳是唯一身披骨质铠甲的哺乳动物——像一只迷你铠甲龙。','三带犰狳能卷成完美球体——一旦封球连狮子都咬不开。','犰狳被吓到时垂直弹跳1米高——这种"弹射逃跑"策略非常有效。','犰狳的铠甲不是僵硬的一块——中间有活动带，不同物种活动带数量不同。','犰狳是少数能感染人类麻风病的动物——这使它们成为了关键的医学研究模型。']}

function renderDetailPage(animal){var c=getConservationEmoji(animal.conservationStatus);var h='<section class="detail-hero"><div class="detail-emoji-ring"><span class="inner-emoji">'+animal.emoji+'</span></div><h1>'+animal.name+'</h1><p class="detail-subtitle">'+animal.category+' · '+animal.habitat+'</p><div class="detail-meta-pills"><span class="meta-pill pill-category">\u{1F43E} '+animal.category+'</span><span class="meta-pill pill-habitat">'+animal.habitatEmoji+' '+animal.habitat+'</span><span class="meta-pill pill-diet">\u{1F37D}️ '+animal.diet+'</span><span class="meta-pill pill-conservation '+animal.conservationClass+'">'+c+' '+animal.conservationStatus+'</span></div></section>';h+='<div class="detail-main"><div class="tab-nav"><button class="tab-btn active" data-tab="tab-basic">\u{1F4CB} 基本信息</button><button class="tab-btn" data-tab="tab-funfacts">\u{1F4A1} 趣味知识</button><button class="tab-btn" data-tab="tab-habitat">\u{1F30D} 栖息环境</button></div>';h+='<div class="tab-panel active" id="tab-basic"><div class="info-grid"><div class="info-card"><span class="info-icon">\u{1F4CF}</span><span class="info-label">体型</span><span class="info-value">'+animal.size+'</span></div><div class="info-card"><span class="info-icon">⚖️</span><span class="info-label">体重</span><span class="info-value">'+animal.weight+'</span></div><div class="info-card"><span class="info-icon">⏳</span><span class="info-label">寿命</span><span class="info-value">'+animal.lifespan+'</span></div><div class="info-card"><span class="info-icon">\u{1F37D}️</span><span class="info-label">食性</span><span class="info-value">'+animal.diet+'</span></div></div>';h+='<div class="desc-card"><h3>\u{1F4DD} 关于'+animal.name+'</h3><p>'+animal.description+'</p></div>';h+='<div class="personality-section"><h3>\u{1F3AD} 性格特点</h3><div style="text-align:center;">'+animal.personality.split('、').map(function(t){return'<span class="personality-tag">'+t.trim()+'</span>'}).join('')+'</div></div>';h+='<div class="baby-card"><span class="baby-emoji">\u{1F476}</span><h3>\u{1F476} 宝宝叫什么？</h3><p>'+animal.babyName+' —— 刚出生的小生命是世界上最治愈的奇迹。</p></div>';h+='<div class="sound-card"><h3>\u{1F50A} '+animal.name+'的声音</h3><span class="sound-play" id="soundPlayBtn" onclick="playSoundEffect(this)" title="点击听声音">\u{1F50A}</span><p class="sound-desc">'+animal.soundDescription+'</p></div></div>';h+='<div class="tab-panel" id="tab-funfacts"><div class="funfacts-list">'+animal.funFacts.map(function(f,i){return'<div class="funfact-card"><span class="ff-num">'+(i+1)+'</span><span class="ff-text">'+f+'</span></div>'}).join('')+'</div></div>';var ct=animal.conservationStatus.indexOf('无危')>=0?animal.name+'目前种群数量稳定，但人类活动依然对它们造成潜在威胁。让我们一起保护它们的家园！':/极度|极危|濒危|CR|EN/i.test(animal.conservationStatus)?animal.name+'正面临严重的生存危机——棲息地丧失、非法盗猎和气候变化正在将这一奇妙物种推向灭绝边缘。每一次了解都是保护的第一步！':animal.name+'的种群数量正面临压力——棲息地保护和全球自然保护努力对它们的未来至关重要。关注和支持保护组织，每个人都能贡献力量。';h+='<div class="tab-panel" id="tab-habitat"><div class="habitat-card"><span class="habitat-emoji">'+animal.habitatEmoji+'</span><h3>'+animal.habitat+'</h3><p>'+animal.name+'生活在'+animal.habitat+'中。这里是它们觅食、繁殖和躲避天敌的家园。每一种动物都与棲息地密不可分——保护棲息地就是保护'+animal.name+'的未来。</p></div><div class="habitat-card" style="border-left:6px solid var(--accent-mint);"><span class="habitat-emoji">\u{1F30D}</span><h3>保护状态：'+animal.conservationStatus+'</h3><p>'+ct+'</p></div></div>';h+='</div>'+renderRelatedAnimals(animal);container.innerHTML=h;setTimeout(function(){var bs=document.querySelectorAll('.tab-btn');for(var i=0;i<bs.length;i++){bs[i].addEventListener('click',function(){var ab=document.querySelectorAll('.tab-btn');for(var j=0;j<ab.length;j++)ab[j].classList.remove('active');var ap=document.querySelectorAll('.tab-panel');for(var k=0;k<ap.length;k++)ap[k].classList.remove('active');this.classList.add('active');var t=document.getElementById(this.dataset.tab);if(t)t.classList.add('active')})}},0)}

(function(){var cv=document.getElementById('particleCanvas'),ctx=cv.getContext('2d'),ps=[],mp=22;var fe=['\u{1F31F}','✨','\u{1F4AB}','\u{1F98B}','\u{1F338}','\u{1F343}','\u{1F496}','\u{1FAB7}','\u{1F43E}','\u{1F33F}','\u{1F9E7}','\u{1F490}'];if(currentAnimal)fe.push(currentAnimal.emoji);function rs(){cv.width=window.innerWidth;cv.height=window.innerHeight}rs();window.addEventListener('resize',rs);function P(){this.reset(true)}P.prototype.reset=function(i){this.x=Math.random()*cv.width;this.y=i?Math.random()*cv.height:cv.height+40;this.emoji=fe[Math.floor(Math.random()*fe.length)];this.size=12+Math.random()*16;this.speedY=-0.3-Math.random()*0.6;this.speedX=(Math.random()-0.5)*0.4;this.rotation=Math.random()*Math.PI*2;this.rotSpeed=(Math.random()-0.5)*0.02;this.opacity=0.4+Math.random()*0.5;this.wobble=Math.random()*Math.PI*2;this.wobbleSpeed=0.01+Math.random()*0.03;this.wobbleAmp=0.3+Math.random()*0.7};P.prototype.update=function(){this.y+=this.speedY;this.wobble+=this.wobbleSpeed;this.x+=this.speedX+Math.sin(this.wobble)*this.wobbleAmp;this.rotation+=this.rotSpeed;if(this.y<cv.height*0.15)this.opacity-=0.003;if(this.y<-60||this.opacity<=0)this.reset(false)};P.prototype.draw=function(c){c.save();c.globalAlpha=this.opacity;c.translate(this.x,this.y);c.rotate(this.rotation);c.font=this.size+'px serif';c.textAlign='center';c.textBaseline='middle';c.fillText(this.emoji,0,0);c.restore()};for(var i=0;i<mp;i++)ps.push(new P());function an(){ctx.clearRect(0,0,cv.width,cv.height);for(var i=0;i<ps.length;i++){ps[i].update();ps[i].draw(ctx)}requestAnimationFrame(an)}an();setInterval(function(){for(var i=0;i<4;i++){var p=new P();p.y=cv.height-10;p.opacity=0.7;ps.push(p)}while(ps.length>mp+8)ps.shift()},8000)})();
