<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的收藏 - CityLens</title>
    <style>
        :root {
            --bg-primary:#0a0e17;--bg-secondary:#111620;--bg-tertiary:#1a1f2e;--bg-card:#151a28;
            --text-primary:#c9d1d9;--text-secondary:#8b949e;--text-highlight:#f0f6fc;
            --accent-blue:#4a9eff;--accent-cyan:#00d4ff;--accent-red:#ff4757;--accent-gold:#ffd700;
            --border-glow:#1e2d3d;--glass-bg:rgba(21,26,40,0.85);--shadow-card:0 4px 25px rgba(0,0,0,0.6);
            --shadow-hover:0 8px 40px rgba(255,71,87,0.2);--border-radius:10px;--transition-speed:0.3s;
            --nav-height:72px;--max-width:1200px;
        }
        body.light-mode{--bg-primary:#f0f2f5;--bg-secondary:#ffffff;--bg-tertiary:#e4e6eb;--bg-card:#ffffff;--text-primary:#1a1a2e;--text-secondary:#5a6c7d;--text-highlight:#0a0a0a;--border-glow:#d0d5dd;--glass-bg:rgba(255,255,255,0.85);--shadow-card:0 4px 20px rgba(0,0,0,0.08);}
        *{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}
        body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;background-color:var(--bg-primary);color:var(--text-primary);line-height:1.6;transition:background-color var(--transition-speed),color var(--transition-speed);}
        ::-webkit-scrollbar{width:8px;}::-webkit-scrollbar-track{background:var(--bg-secondary);}::-webkit-scrollbar-thumb{background:var(--border-glow);border-radius:4px;}

        /* Navbar */
        .navbar{position:fixed;top:0;left:0;width:100%;height:var(--nav-height);background:var(--glass-bg);backdrop-filter:blur(20px);border-bottom:1px solid rgba(74,158,255,0.1);z-index:1000;}.navbar.scrolled{box-shadow:0 4px 30px rgba(0,0,0,0.5);}
        .navbar .container{max-width:var(--max-width);margin:0 auto;padding:0 30px;height:100%;display:flex;align-items:center;justify-content:space-between;}
        .logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text-highlight);font-size:1.5rem;font-weight:800;}.logo-icon{width:42px;height:42px;background:linear-gradient(135deg,#ff4757,#ff6b35);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;color:#fff;}.logo-text{background:linear-gradient(135deg,#4a9eff,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .nav-links{display:flex;list-style:none;gap:2px;}.nav-links li a{display:block;padding:10px 16px;color:var(--text-secondary);text-decoration:none;border-radius:8px;transition:all var(--transition-speed);font-size:0.88rem;font-weight:500;}.nav-links li a:hover{color:var(--text-highlight);}.nav-links li a.active{color:var(--accent-red);background:rgba(255,71,87,0.08);}
        .nav-actions{display:flex;gap:8px;}.btn-icon{width:38px;height:38px;border:1px solid rgba(255,71,87,0.15);background:rgba(255,71,87,0.05);color:var(--text-secondary);border-radius:8px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all var(--transition-speed);}.btn-icon:hover{background:rgba(255,71,87,0.15);border-color:var(--accent-red);color:var(--accent-red);}
        .mobile-menu-btn{display:none;}.mobile-menu-btn span{display:block;width:24px;height:2px;background:var(--accent-red);}

        /* Page Header */
        .page-header{margin-top:var(--nav-height);background:linear-gradient(160deg,#0a0e17 0%,#1a0d0d 30%,#0a0e17 100%);padding:55px 0;text-align:center;border-bottom:1px solid var(--border-glow);}.page-header h1{font-size:2.3rem;font-weight:900;color:var(--text-highlight);}.page-header .breadcrumb{margin-top:8px;color:var(--text-secondary);font-size:0.85rem;}.page-header .breadcrumb a{color:var(--accent-cyan);text-decoration:none;}
        body.light-mode .page-header{background:linear-gradient(160deg,#f0f2f5 0%,#fde8e8 30%,#f0f2f5 100%);}

        /* Main Content */
        .main-content{padding:40px 0 70px;}.container{max-width:var(--max-width);margin:0 auto;padding:0 30px;}
        .section-title{font-size:1.3rem;font-weight:700;color:var(--text-highlight);margin-bottom:20px;display:flex;align-items:center;gap:8px;}.section-title .icon{font-size:1.5rem;}
        .section-block{margin-bottom:45px;}

        /* Toolbar */
        .toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:25px;padding:16px 20px;background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);}
        .toolbar .btn-tool{padding:8px 16px;border:1px solid var(--border-glow);background:var(--bg-secondary);color:var(--text-primary);border-radius:8px;cursor:pointer;font-size:0.82rem;font-weight:600;transition:all var(--transition-speed);display:flex;align-items:center;gap:6px;white-space:nowrap;}.toolbar .btn-tool:hover{border-color:var(--accent-red);color:var(--accent-red);box-shadow:0 0 15px rgba(255,71,87,0.08);}
        .toolbar .btn-tool.primary{background:var(--accent-red);color:#fff;border-color:var(--accent-red);}.toolbar .btn-tool.primary:hover{background:#ff5e6b;}
        .toolbar .sort-select{padding:8px 12px;border:1px solid var(--border-glow);background:var(--bg-secondary);color:var(--text-primary);border-radius:8px;font-size:0.82rem;cursor:pointer;font-family:inherit;outline:none;}.toolbar .sort-select:focus{border-color:var(--accent-red);}
        .toolbar .toolbar-divider{width:1px;height:24px;background:var(--border-glow);margin:0 4px;}
        .toolbar .fav-count{color:var(--text-secondary);font-size:0.82rem;margin-left:auto;}

        /* Batch Action Bar */
        .batch-bar{display:none;align-items:center;gap:12px;padding:12px 20px;background:rgba(255,71,87,0.08);border:1px solid rgba(255,71,87,0.3);border-radius:var(--border-radius);margin-bottom:20px;}.batch-bar.active{display:flex;}.batch-bar .batch-label{color:var(--accent-red);font-weight:700;font-size:0.85rem;}.batch-bar .btn-batch{padding:6px 14px;border:1px solid var(--accent-red);background:transparent;color:var(--accent-red);border-radius:6px;cursor:pointer;font-size:0.78rem;font-weight:600;transition:all var(--transition-speed);}.batch-bar .btn-batch:hover{background:var(--accent-red);color:#fff;}.batch-bar .btn-batch.danger{background:var(--accent-red);color:#fff;}.batch-bar .btn-batch.danger:hover{background:#ff5e6b;}
        .batch-bar .batch-select-all{color:var(--accent-cyan);font-size:0.78rem;cursor:pointer;text-decoration:underline;background:none;border:none;font-family:inherit;}

        /* Stats Dashboard */
        .stats-dashboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:20px;}
        .stat-card{background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);padding:18px 20px;text-align:center;transition:all var(--transition-speed);}.stat-card:hover{border-color:var(--accent-red);box-shadow:var(--shadow-hover);}
        .stat-card .stat-value{font-size:2rem;font-weight:900;color:var(--accent-red);}
        .stat-card .stat-label{font-size:0.78rem;color:var(--text-secondary);margin-top:4px;}
        .stat-card .stat-sub{font-size:0.72rem;color:var(--accent-gold);margin-top:2px;}

        /* Mini World Map */
        .mini-map-wrap{background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);padding:20px;position:relative;overflow:hidden;}
        .mini-map-container{position:relative;width:100%;height:260px;background:linear-gradient(180deg,var(--bg-secondary) 0%,#0d0d1a 40%,#1a1f2e 100%);border-radius:8px;overflow:hidden;}
        .map-grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px);background-size:30px 30px;}
        .map-continent-label{position:absolute;font-size:0.7rem;color:var(--text-secondary);opacity:0.5;font-weight:600;pointer-events:none;}
        .map-dot{position:absolute;width:8px;height:8px;background:var(--accent-red);border-radius:50%;transform:translate(-50%,-50%);transition:all 0.3s;cursor:pointer;box-shadow:0 0 8px rgba(255,71,87,0.6);z-index:2;}
        .map-dot.fav-dot{background:var(--accent-gold);width:10px;height:10px;box-shadow:0 0 12px rgba(255,215,0,0.7);animation:pulse-dot 2s infinite;}
        .map-dot:hover{width:14px;height:14px;z-index:5;box-shadow:0 0 16px rgba(255,71,87,0.9);}
        .map-dot-tooltip{position:absolute;font-size:0.7rem;background:var(--bg-card);color:var(--text-highlight);padding:4px 8px;border-radius:4px;white-space:nowrap;pointer-events:none;opacity:0;transform:translate(-50%,-130%);transition:opacity 0.2s;z-index:10;border:1px solid var(--border-glow);}
        .map-dot:hover .map-dot-tooltip{opacity:1;}
        @keyframes pulse-dot{0%,100%{box-shadow:0 0 8px rgba(255,215,0,0.7);}50%{box-shadow:0 0 18px rgba(255,215,0,1);}}
        .map-legend{display:flex;gap:20px;margin-top:12px;font-size:0.75rem;color:var(--text-secondary);}.map-legend span{display:flex;align-items:center;gap:6px;}.map-legend .leg-dot{width:8px;height:8px;border-radius:50%;}.map-legend .leg-dot.all{background:var(--accent-red);}.map-legend .leg-dot.fav{background:var(--accent-gold);}

        /* Collections Panel */
        .collections-panel{background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);padding:20px;margin-bottom:25px;}
        .coll-list{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px;}.coll-chip{padding:6px 14px;background:var(--bg-secondary);border:1px solid var(--border-glow);border-radius:20px;font-size:0.82rem;cursor:pointer;transition:all var(--transition-speed);display:flex;align-items:center;gap:6px;color:var(--text-primary);}.coll-chip:hover{border-color:var(--accent-red);box-shadow:0 0 12px rgba(255,71,87,0.1);}.coll-chip.active{border-color:var(--accent-red);background:rgba(255,71,87,0.08);color:var(--accent-red);}.coll-chip .coll-count{font-size:0.7rem;color:var(--text-secondary);}.coll-chip .coll-delete{font-size:0.7rem;cursor:pointer;opacity:0.5;margin-left:4px;}.coll-chip .coll-delete:hover{opacity:1;color:var(--accent-red);}
        .coll-create{display:flex;gap:8px;}.coll-create input{padding:8px 12px;border:1px solid var(--border-glow);background:var(--bg-secondary);color:var(--text-primary);border-radius:8px;font-size:0.82rem;font-family:inherit;flex:1;max-width:220px;outline:none;}.coll-create input:focus{border-color:var(--accent-red);}.coll-create button{padding:8px 16px;background:var(--accent-red);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:0.82rem;font-weight:600;transition:all var(--transition-speed);}.coll-create button:hover{background:#ff5e6b;}

        /* Fav Grid */
        .fav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;}
        .fav-card{background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);padding:20px;transition:all var(--transition-speed);position:relative;}.fav-card:hover{border-color:var(--accent-red);box-shadow:var(--shadow-hover);}
        .fav-card .card-main{display:flex;align-items:center;gap:16px;margin-bottom:12px;}
        .fav-flag{font-size:2.5rem;flex-shrink:0;}
        .fav-name{font-weight:700;color:var(--text-highlight);font-size:1.05rem;}.fav-meta{font-size:0.8rem;color:var(--text-secondary);margin-top:2px;}
        .fav-card .card-checkbox{position:absolute;top:12px;left:12px;width:20px;height:20px;accent-color:var(--accent-red);cursor:pointer;display:none;z-index:2;}
        .fav-card.select-mode .card-checkbox{display:block;}
        .fav-card .card-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.fav-card .card-tag{padding:2px 10px;background:rgba(255,71,87,0.1);border:1px solid rgba(255,71,87,0.2);border-radius:12px;font-size:0.7rem;color:var(--accent-red);cursor:pointer;transition:all var(--transition-speed);}.fav-card .card-tag:hover{background:rgba(255,71,87,0.2);}.fav-card .card-tag.add-tag{background:transparent;border-style:dashed;color:var(--text-secondary);}.fav-card .card-tag.add-tag:hover{color:var(--accent-red);border-color:var(--accent-red);}
        .fav-card .card-note{width:100%;margin-top:10px;padding:8px 10px;background:var(--bg-secondary);border:1px solid var(--border-glow);border-radius:6px;color:var(--text-primary);font-size:0.78rem;font-family:inherit;resize:vertical;min-height:32px;outline:none;transition:border-color var(--transition-speed);}.fav-card .card-note:focus{border-color:var(--accent-red);}.fav-card .card-note::placeholder{color:var(--text-secondary);font-size:0.75rem;}
        .fav-card .card-actions{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap;}
        .btn-remove{position:absolute;top:12px;right:12px;width:30px;height:30px;background:rgba(255,71,87,0.1);border:1px solid rgba(255,71,87,0.3);color:var(--accent-red);border-radius:50%;cursor:pointer;font-size:0.85rem;display:flex;align-items:center;justify-content:center;transition:all var(--transition-speed);z-index:2;}.btn-remove:hover{background:var(--accent-red);color:#fff;}
        .btn-view{padding:8px 16px;background:var(--accent-blue);color:#fff;border:none;border-radius:20px;cursor:pointer;font-size:0.8rem;font-weight:600;text-decoration:none;display:inline-block;transition:all var(--transition-speed);}.btn-view:hover{background:#5aafff;}
        .btn-clear{display:block;margin:30px auto 0;padding:10px 24px;background:transparent;border:1px solid var(--accent-red);color:var(--accent-red);border-radius:20px;cursor:pointer;font-size:0.85rem;font-weight:600;transition:all var(--transition-speed);}.btn-clear:hover{background:var(--accent-red);color:#fff;}

        .empty-state{text-align:center;padding:80px 20px;color:var(--text-secondary);}.empty-state .icon{font-size:5rem;display:block;margin-bottom:20px;}.empty-state h3{color:var(--text-highlight);font-size:1.3rem;margin-bottom:10px;}

        /* Recommended & Recent */
        .rec-grid,.recent-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;}
        .rec-card{background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);padding:16px;display:flex;align-items:center;gap:14px;transition:all var(--transition-speed);cursor:pointer;}.rec-card:hover{border-color:var(--accent-cyan);box-shadow:0 4px 20px rgba(0,212,255,0.1);}
        .rec-card .rec-flag{font-size:2rem;flex-shrink:0;}
        .rec-card .rec-info{flex:1;}.rec-card .rec-name{font-weight:700;color:var(--text-highlight);font-size:0.95rem;}.rec-card .rec-meta{font-size:0.75rem;color:var(--text-secondary);}.rec-card .rec-reason{font-size:0.7rem;color:var(--accent-cyan);margin-top:2px;}
        .rec-card .btn-add-fav{width:32px;height:32px;background:rgba(255,71,87,0.1);border:1px solid rgba(255,71,87,0.3);color:var(--accent-red);border-radius:50%;cursor:pointer;font-size:0.9rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all var(--transition-speed);}.rec-card .btn-add-fav:hover{background:var(--accent-red);color:#fff;}

        /* Tags Input Overlay */
        .tag-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:2000;display:flex;align-items:center;justify-content:center;}.tag-overlay.hidden{display:none;}
        .tag-dialog{background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);padding:24px;max-width:400px;width:90%;}
        .tag-dialog h4{color:var(--text-highlight);margin-bottom:16px;font-size:1.05rem;}
        .tag-dialog .tag-options{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}.tag-dialog .tag-opt{padding:6px 14px;background:var(--bg-secondary);border:1px solid var(--border-glow);border-radius:16px;font-size:0.82rem;cursor:pointer;color:var(--text-primary);transition:all var(--transition-speed);}.tag-dialog .tag-opt.selected{border-color:var(--accent-red);background:rgba(255,71,87,0.12);color:var(--accent-red);}.tag-dialog .tag-opt:hover{border-color:var(--accent-red);}
        .tag-dialog .tag-custom-input{display:flex;gap:8px;margin-bottom:12px;}.tag-dialog .tag-custom-input input{padding:8px 12px;border:1px solid var(--border-glow);background:var(--bg-secondary);color:var(--text-primary);border-radius:8px;font-size:0.82rem;font-family:inherit;flex:1;outline:none;}.tag-dialog .tag-custom-input input:focus{border-color:var(--accent-red);}.tag-dialog .tag-custom-input button{padding:8px 12px;background:var(--accent-blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:0.78rem;}
        .tag-dialog .tag-actions{display:flex;gap:8px;justify-content:flex-end;}.tag-dialog .tag-actions button{padding:8px 18px;border-radius:8px;cursor:pointer;font-size:0.82rem;font-weight:600;}.tag-dialog .tag-actions .btn-save{background:var(--accent-red);color:#fff;border:none;}.tag-dialog .tag-actions .btn-cancel{background:transparent;color:var(--text-secondary);border:1px solid var(--border-glow);}

        /* Modal */
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:2000;display:flex;align-items:center;justify-content:center;}.modal-overlay.hidden{display:none;}
        .modal-dialog{background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);padding:28px;max-width:520px;width:90%;max-height:80vh;overflow-y:auto;}
        .modal-dialog h3{color:var(--text-highlight);font-size:1.2rem;margin-bottom:6px;display:flex;align-items:center;gap:8px;}
        .modal-dialog .modal-subtitle{color:var(--text-secondary);font-size:0.8rem;margin-bottom:16px;}
        .modal-dialog pre{background:var(--bg-secondary);border:1px solid var(--border-glow);border-radius:8px;padding:16px;color:var(--text-primary);font-size:0.78rem;overflow-x:auto;max-height:300px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;font-family:'Consolas','Monaco',monospace;}
        .modal-dialog .modal-actions{display:flex;gap:10px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap;}
        .modal-dialog .btn-modal{padding:8px 18px;border-radius:8px;cursor:pointer;font-size:0.82rem;font-weight:600;transition:all var(--transition-speed);}
        .modal-dialog .btn-modal.primary{background:var(--accent-red);color:#fff;border:none;}.modal-dialog .btn-modal.primary:hover{background:#ff5e6b;}
        .modal-dialog .btn-modal.secondary{background:transparent;color:var(--text-secondary);border:1px solid var(--border-glow);}.modal-dialog .btn-modal.secondary:hover{border-color:var(--accent-red);color:var(--accent-red);}
        .modal-dialog .btn-modal.copy{background:var(--accent-blue);color:#fff;border:none;}.modal-dialog .btn-modal.copy:hover{background:#5aafff;}
        .modal-dialog .copied-msg{color:var(--accent-cyan);font-size:0.78rem;display:none;margin-left:8px;}.modal-dialog .copied-msg.show{display:inline;}

        /* Empty state */
        .empty-state{text-align:center;padding:80px 20px;color:var(--text-secondary);}.empty-state .icon{font-size:5rem;display:block;margin-bottom:20px;}.empty-state h3{color:var(--text-highlight);font-size:1.3rem;margin-bottom:10px;}

        /* Footer */
        .footer{background:var(--bg-secondary);border-top:1px solid var(--border-glow);padding:28px;text-align:center;color:var(--text-secondary);font-size:0.78rem;}

        /* Responsive */
        @media(max-width:768px){
            .nav-links{display:none;position:absolute;top:var(--nav-height);left:0;width:100%;background:rgba(10,14,23,0.98);flex-direction:column;padding:20px;z-index:999;}.nav-links.active{display:flex;}.mobile-menu-btn{display:flex;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;}
            .toolbar{flex-wrap:wrap;justify-content:flex-start;}.toolbar .fav-count{margin-left:0;width:100%;}
            .stats-dashboard{grid-template-columns:repeat(2,1fr);}
            .fav-grid{grid-template-columns:1fr;}
            .rec-grid,.recent-grid{grid-template-columns:1fr;}
            .page-header h1{font-size:1.6rem;}.page-header{padding:35px 0;}
            .mini-map-container{height:180px;}
            .batch-bar{flex-wrap:wrap;}
        }
        @media(max-width:480px){
            .stats-dashboard{grid-template-columns:1fr;}
            .coll-create{flex-direction:column;}.coll-create input{max-width:100%;}
        }
    </style>
</head>
<body>
    <nav class="navbar" id="navbar"><div class="container"><a href="home.html" class="logo"><div class="logo-icon">C</div><span class="logo-text">CityLens</span></a><ul class="nav-links" id="navLinks"><li><a href="home.html">首页</a></li><li><a href="cities.html">城市大全</a></li><li><a href="compare.html">对比</a></li><li><a href="ranking.html">排行榜</a></li><li><a href="favorites.html" class="active">收藏</a></li></ul><div class="nav-actions"><button class="btn-icon" id="btnThemeToggle">◐</button><button class="mobile-menu-btn" id="mobileMenuBtn"><span></span><span></span><span></span></button></div></div></nav>

    <section class="page-header"><h1>❤️ 我的收藏</h1><p class="breadcrumb"><a href="home.html">首页</a> / 我的收藏</p></section>

    <section class="main-content"><div class="container">
        <!-- Empty State -->
        <div class="empty-state" id="emptyState" style="display:none;"><span class="icon">💔</span><h3>收藏夹为空</h3><p>去<a href="cities.html" style="color:var(--accent-cyan);">城市大全</a>发现你喜欢的城市吧！</p></div>

        <!-- Statistics Dashboard -->
        <div class="section-block" id="statsSection" style="display:none;">
            <div class="section-title"><span class="icon">📊</span>收藏统计</div>
            <div class="stats-dashboard" id="statsDashboard"></div>
        </div>

        <!-- Collections Panel -->
        <div class="section-block" id="collectionsSection" style="display:none;">

    <footer class="footer"><p>&copy; 2025 CityLens | 收藏数据存储在本地浏览器 | 仅供学习使用</p></footer>

    <script>
        /* ===== Data: 28 Cities ===== */
        const cityMap={
            tokyo:{name:'东京',flag:'🇯🇵',rating:9.2,region:'亚洲'},
            nyc:{name:'纽约',flag:'🇺🇸',rating:9.0,region:'北美洲'},
            shanghai:{name:'上海',flag:'🇨🇳',rating:8.8,region:'亚洲'},
            london:{name:'伦敦',flag:'🇬🇧',rating:9.1,region:'欧洲'},
            paris:{name:'巴黎',flag:'🇫🇷',rating:8.9,region:'欧洲'},
            singapore:{name:'新加坡',flag:'🇸🇬',rating:9.3,region:'亚洲'},
            sydney:{name:'悉尼',flag:'🇦🇺',rating:8.7,region:'大洋洲'},
            berlin:{name:'柏林',flag:'🇩🇪',rating:8.4,region:'欧洲'},
            dubai:{name:'迪拜',flag:'🇦🇪',rating:8.5,region:'亚洲'},
            seoul:{name:'首尔',flag:'🇰🇷',rating:8.6,region:'亚洲'},
            toronto:{name:'多伦多',flag:'🇨🇦',rating:8.8,region:'北美洲'},
            hongkong:{name:'香港',flag:'🇭🇰',rating:9.0,region:'亚洲'},
            losangeles:{name:'洛杉矶',flag:'🇺🇸',rating:8.9,region:'北美洲'},
            barcelona:{name:'巴塞罗那',flag:'🇪🇸',rating:8.8,region:'欧洲'},
            rome:{name:'罗马',flag:'🇮🇹',rating:8.7,region:'欧洲'},
            bangkok:{name:'曼谷',flag:'🇹🇭',rating:8.3,region:'亚洲'},
            istanbul:{name:'伊斯坦布尔',flag:'🇹🇷',rating:8.5,region:'欧洲'},
            moscow:{name:'莫斯科',flag:'🇷🇺',rating:8.2,region:'欧洲'},
            chicago:{name:'芝加哥',flag:'🇺🇸',rating:8.5,region:'北美洲'},
            sanfrancisco:{name:'旧金山',flag:'🇺🇸',rating:8.7,region:'北美洲'},
            vancouver:{name:'温哥华',flag:'🇨🇦',rating:8.9,region:'北美洲'},
            amsterdam:{name:'阿姆斯特丹',flag:'🇳🇱',rating:8.7,region:'欧洲'},
            vienna:{name:'维也纳',flag:'🇦🇹',rating:8.8,region:'欧洲'},
            prague:{name:'布拉格',flag:'🇨🇿',rating:8.6,region:'欧洲'},
            mumbai:{name:'孟买',flag:'🇮🇳',rating:7.8,region:'亚洲'},
            osaka:{name:'大阪',flag:'🇯🇵',rating:8.9,region:'亚洲'},
            melbourne:{name:'墨尔本',flag:'🇦🇺',rating:8.8,region:'大洋洲'},
            capecitown:{name:'开普敦',flag:'🇿🇦',rating:8.4,region:'非洲'}
        };

        /* City coordinates for mini map (longitude mapped to x%, latitude mapped to y%) */
        const cityCoords={
            tokyo:{x:88,y:33},nyc:{x:29,y:32},shanghai:{x:84,y:35},london:{x:50,y:25},
            paris:{x:51,y:26},singapore:{x:79,y:48},sydney:{x:92,y:65},berlin:{x:54,y:24},
            dubai:{x:65,y:40},seoul:{x:85,y:32},toronto:{x:28,y:30},hongkong:{x:82,y:40},
            losangeles:{x:16,y:34},barcelona:{x:51,y:28},rome:{x:53,y:28},bangkok:{x:78,y:42},
            istanbul:{x:58,y:28},moscow:{x:60,y:22},chicago:{x:25,y:31},sanfrancisco:{x:14,y:33},
            vancouver:{x:14,y:27},amsterdam:{x:51,y:24},vienna:{x:54,y:26},prague:{x:54,y:25},
            mumbai:{x:70,y:42},osaka:{x:88,y:34},melbourne:{x:90,y:68},capecitown:{x:53,y:68}
        };

        /* Continent labels for mini map */
        const continentLabels=[
            {label:'北美洲',x:18,y:22},{label:'南美洲',x:22,y:55},{label:'欧洲',x:48,y:18},
            {label:'非洲',x:50,y:48},{label:'亚洲',x:73,y:28},{label:'大洋洲',x:88,y:58}
        ];

        /* Preset tags */
        const presetTags=['想去','去过','梦想城市','宜居候选','美食之都','文化名城','海滨城市','商务出行'];

        /* ===== State ===== */
        let multiSelectMode=false;
        let selectedCities=new Set();
        let currentSort='date-desc';
        let activeCollectionFilter=null;

        /* ===== Helpers ===== */
        function getFavs(){return JSON.parse(localStorage.getItem('citylens-favs')||'[]');}
        function saveFavs(arr){localStorage.setItem('citylens-favs',JSON.stringify(arr));}
        function getNotes(){return JSON.parse(localStorage.getItem('citylens-fav-notes')||'{}');}
        function saveNotes(obj){localStorage.setItem('citylens-fav-notes',JSON.stringify(obj));}
        function getTags(){return JSON.parse(localStorage.getItem('citylens-fav-tags')||'{}');}
        function saveTags(obj){localStorage.setItem('citylens-fav-tags',JSON.stringify(obj));}
        function getCollections(){return JSON.parse(localStorage.getItem('citylens-collections')||'[]');}
        function saveCollections(arr){localStorage.setItem('citylens-collections',JSON.stringify(arr));}
        function getRecent(){return JSON.parse(sessionStorage.getItem('citylens-recent')||'[]');}
        function getCityIdByName(name){for(const[k,v]of Object.entries(cityMap)){if(v.name===name)return k;}return null;}

        /* ===== Load Favorites ===== */
        function loadFavs(){
            var favs=getFavs(),notes=getNotes(),tags=getTags();
            var grid=document.getElementById('favGrid'),empty=document.getElementById('emptyState');
            var btnClear=document.getElementById('btnClear'),toolbar=document.getElementById('toolbar');
            var statsSection=document.getElementById('statsSection'),mapSection=document.getElementById('mapSection');
            var collectionsSection=document.getElementById('collectionsSection');

            if(favs.length===0){
                grid.innerHTML='';empty.style.display='block';btnClear.style.display='none';
                toolbar.style.display='none';statsSection.style.display='none';mapSection.style.display='none';
                collectionsSection.style.display='none';
            }else{
                empty.style.display='none';btnClear.style.display='block';
                toolbar.style.display='flex';statsSection.style.display='block';mapSection.style.display='block';
                collectionsSection.style.display='block';
                document.getElementById('favCount').textContent=favs.length+' 个城市';

                var sorted=sortFavs(favs,currentSort);
                if(activeCollectionFilter){
                    var colls=getCollections(),coll=colls.find(function(c){return c.name===activeCollectionFilter;});
                    if(coll){sorted=sorted.filter(function(n){return coll.cities.indexOf(n)!==-1;});}
                }

                grid.innerHTML=sorted.map(function(name){
                    var cityId=null;
                    for(var k in cityMap){if(cityMap[k].name===name){cityId=k;break;}}
                    var city=cityId?cityMap[cityId]:{name:name,flag:'🏙️',rating:'?',region:'未知'};
                    var note=notes[name]||'';
                    var cityTags=tags[name]||[];
                    var displayId=cityId||'tokyo';
                    return '<div class="fav-card'+(multiSelectMode?' select-mode':'')+'" data-name="'+escapeHtml(name)+'">'+
                        '<input type="checkbox" class="card-checkbox" data-name="'+escapeHtml(name)+'"'+(selectedCities.has(name)?' checked':'')+'>'+
                        '<button class="btn-remove" data-name="'+escapeHtml(name)+'" title="取消收藏">✕</button>'+
                        '<div class="card-main"><span class="fav-flag">'+city.flag+'</span><div><div class="fav-name">'+escapeHtml(city.name)+'</div><div class="fav-meta">⭐'+city.rating+' · '+city.region+'</div></div></div>'+
                        '<div class="card-tags">'+
                            cityTags.map(function(t){return '<span class="card-tag" data-tag="'+escapeHtml(t)+'">'+escapeHtml(t)+' <span class="coll-delete" data-remove-tag="'+escapeHtml(t)+'">&times;</span></span>';}).join('')+
                            '<span class="card-tag add-tag" data-edit-tags="'+escapeHtml(name)+'">+ 标签</span>'+
                        '</div>'+
                        '<textarea class="card-note" data-name="'+escapeHtml(name)+'" placeholder="📝 添加个人笔记...">'+escapeHtml(note)+'</textarea>'+
                        '<div class="card-actions"><a href="detail.html?id='+displayId+'" class="btn-view">查看详情</a></div>'+
                    '</div>';
                }).join('');

                bindCardEvents();
                loadStats();
                loadMiniMap();
                loadCollections();
            }
            loadRecommended();
            loadRecent();
            updateBatchUI();
            updateCompareBtn();
        }

        function escapeHtml(str){var d=document.createElement('div');d.textContent=str;return d.innerHTML;}

        function bindCardEvents(){
            document.querySelectorAll('.btn-remove').forEach(function(b){
                b.addEventListener('click',function(e){e.stopPropagation();
                    var n=this.dataset.name;var f=getFavs();f=f.filter(function(x){return x!==n;});
                    saveFavs(f);selectedCities.delete(n);loadFavs();
                });
            });
            document.querySelectorAll('.card-note').forEach(function(ta){
                ta.addEventListener('input',function(){
                    var notes=getNotes();notes[this.dataset.name]=this.value;saveNotes(notes);
                });
            });
            document.querySelectorAll('.card-checkbox').forEach(function(cb){
                cb.addEventListener('change',function(){
                    if(this.checked){selectedCities.add(this.dataset.name);}
                    else{selectedCities.delete(this.dataset.name);}
                    updateBatchUI();updateCompareBtn();
                });
            });
            document.querySelectorAll('[data-edit-tags]').forEach(function(el){
                el.addEventListener('click',function(e){e.stopPropagation();openTagEditor(this.dataset.editTags);});
            });
            document.querySelectorAll('[data-remove-tag]').forEach(function(el){
                el.addEventListener('click',function(e){e.stopPropagation();
                    var tagName=e.target.closest('.card-tag');if(!tagName)return;
                    var cardName=tagName.closest('.fav-card').dataset.name;
                    var tags=getTags();var t=tags[cardName]||[];
                    t=t.filter(function(x){return x!==e.target.dataset.removeTag;});
                    tags[cardName]=t;saveTags(tags);loadFavs();
                });
            });
        }

        function sortFavs(favs,sort){
            var arr=favs.slice();
            if(sort==='name-asc'){arr.sort(function(a,b){return a.localeCompare(b,'zh');});}
            else if(sort==='rating-desc'){
                arr.sort(function(a,b){
                    var ca=null,cb=null;
                    for(var k in cityMap){if(cityMap[k].name===a)ca=cityMap[k];if(cityMap[k].name===b)cb=cityMap[k];}
                    return(cb?cb.rating:0)-(ca?ca.rating:0);
                });
            }else if(sort==='region'){
                arr.sort(function(a,b){
                    var ra='',rb='';
                    for(var k in cityMap){if(cityMap[k].name===a)ra=cityMap[k].region;if(cityMap[k].name===b)rb=cityMap[k].region;}
                    return ra.localeCompare(rb,'zh')||a.localeCompare(b,'zh');
                });
            }
            return arr;
        }

        /* ===== Statistics ===== */
        function loadStats(){
            var favs=getFavs(),dash=document.getElementById('statsDashboard');
            if(favs.length===0){dash.innerHTML='';return;}
            var ratings=[],regions={},highest=null,highestR=0;
            favs.forEach(function(name){
                for(var k in cityMap){if(cityMap[k].name===name){
                    ratings.push(cityMap[k].rating);
                    regions[cityMap[k].region]=(regions[cityMap[k].region]||0)+1;
                    if(cityMap[k].rating>highestR){highestR=cityMap[k].rating;highest=cityMap[k];}
                    break;
                }}
            });
            var avgRating=(ratings.reduce(function(a,b){return a+b;},0)/ratings.length).toFixed(1);
            var topRegion='',topCount=0;
            for(var r in regions){if(regions[r]>topCount){topCount=regions[r];topRegion=r;}}
            dash.innerHTML='<div class="stat-card"><div class="stat-value">'+favs.length+'</div><div class="stat-label">📌 收藏总数</div></div>'+
                '<div class="stat-card"><div class="stat-value">⭐'+avgRating+'</div><div class="stat-label">平均评分</div></div>'+
                '<div class="stat-card"><div class="stat-value">'+topRegion+'</div><div class="stat-label">🌍 最多地区</div><div class="stat-sub">'+topCount+' 个城市</div></div>'+
                '<div class="stat-card"><div class="stat-value">'+(highest?highest.flag:'')+'</div><div class="stat-label">🏆 最高评分</div><div class="stat-sub">'+(highest?highest.name:'--')+' ⭐'+highestR+'</div></div>'+
                '<div class="stat-card"><div class="stat-value">'+Object.keys(regions).length+'</div><div class="stat-label">🗺️ 覆盖大洲</div></div>';
        }

        /* ===== Mini World Map ===== */
        function loadMiniMap(){
            var favs=getFavs(),mapEl=document.getElementById('miniMap');
            var html='<div class="map-grid-bg"></div>';
            continentLabels.forEach(function(c){html+='<span class="map-continent-label" style="left:'+c.x+'%;top:'+c.y+'%;transform:translate(-50%,-50%);">'+c.label+'</span>';});
            for(var id in cityCoords){
                var c=cityCoords[id],city=cityMap[id],isFav=favs.indexOf(city.name)!==-1;
                html+='<div class="map-dot'+(isFav?' fav-dot':'')+'" style="left:'+c.x+'%;top:'+c.y+'%;" title="'+city.flag+' '+city.name+'"><span class="map-dot-tooltip">'+city.flag+' '+city.name+'</span></div>';
            }
            mapEl.innerHTML=html;
        }

        /* ===== Collections ===== */
        function loadCollections(){
            var colls=getCollections(),list=document.getElementById('collList');
            var favs=getFavs();
            if(colls.length===0){list.innerHTML='<span style="color:var(--text-secondary);font-size:0.8rem;">暂无合集，创建一个吧</span>';return;}
            list.innerHTML=colls.map(function(c,i){
                return '<span class="coll-chip'+(activeCollectionFilter===c.name?' active':'')+'" data-coll-name="'+escapeHtml(c.name)+'">📁 '+escapeHtml(c.name)+' <span class="coll-count">('+c.cities.length+')</span><span class="coll-delete" data-del-coll="'+i+'">✕</span></span>';
            }).join('');
            document.querySelectorAll('.coll-chip').forEach(function(chip){
                chip.addEventListener('click',function(e){
                    if(e.target.classList.contains('coll-delete'))return;
                    var name=this.dataset.collName;
                    if(activeCollectionFilter===name){activeCollectionFilter=null;}
                    else{activeCollectionFilter=name;}
                    loadFavs();
                });
            });
            document.querySelectorAll('[data-del-coll]').forEach(function(el){
                el.addEventListener('click',function(e){e.stopPropagation();
                    var idx=parseInt(this.dataset.delColl),colls=getCollections();
                    if(confirm('确定删除合集 "'+colls[idx].name+'" 吗？（不会删除收藏的城市）')){
                        colls.splice(idx,1);saveCollections(colls);
                        if(activeCollectionFilter===colls[idx]&&colls[idx])activeCollectionFilter=null;
                        loadFavs();
                    }
                });
            });
        }

        document.getElementById('btnCreateColl').addEventListener('click',function(){
            var input=document.getElementById('collNameInput'),name=input.value.trim();
            if(!name){alert('请输入合集名称');return;}
            var colls=getCollections();
            if(colls.find(function(c){return c.name===name;})){alert('合集名称已存在');return;}
            colls.push({name:name,cities:[]});saveCollections(colls);input.value='';loadFavs();
        });

        /* ===== Recommended Cities ===== */
        function loadRecommended(){
            var favs=getFavs(),section=document.getElementById('recSection'),grid=document.getElementById('recGrid');
            if(favs.length===0){section.style.display='none';return;}
            section.style.display='block';
            var favRegions={};
            favs.forEach(function(name){
                for(var k in cityMap){if(cityMap[k].name===name){favRegions[cityMap[k].region]=(favRegions[cityMap[k].region]||0)+1;break;}}
            });
            var topRegion='',topCnt=0;
            for(var r in favRegions){if(favRegions[r]>topCnt){topCnt=favRegions[r];topRegion=r;}}
            var recs=[];
            for(var id in cityMap){
                if(favs.indexOf(cityMap[id].name)===-1){
                    var score=0;
                    if(cityMap[id].region===topRegion)score+=3;
                    if(cityMap[id].rating>=8.5)score+=1;
                    if(cityMap[id].rating>=9.0)score+=2;
                    recs.push({id:id,city:cityMap[id],score:score,reason:cityMap[id].region===topRegion?'同属 '+topRegion:'高评分推荐'});
                }
            }
            recs.sort(function(a,b){return b.score-a.score;});
            recs=recs.slice(0,6);
            grid.innerHTML=recs.map(function(r){
                return '<div class="rec-card"><span class="rec-flag">'+r.city.flag+'</span><div class="rec-info"><div class="rec-name">'+r.city.name+'</div><div class="rec-meta">⭐'+r.city.rating+' · '+r.city.region+'</div><div class="rec-reason">💡 '+r.reason+'</div></div><button class="btn-add-fav" data-add-name="'+escapeHtml(r.city.name)+'" title="添加收藏">❤️</button></div>';
            }).join('');
            document.querySelectorAll('.btn-add-fav').forEach(function(b){
                b.addEventListener('click',function(e){e.stopPropagation();
                    var name=this.dataset.addName,favs=getFavs();
                    if(favs.indexOf(name)===-1){favs.push(name);saveFavs(favs);loadFavs();}else{loadFavs();}
                });
            });
        }

        /* ===== Recently Viewed ===== */
        function loadRecent(){
            var recent=getRecent(),section=document.getElementById('recentSection'),grid=document.getElementById('recentGrid');
            if(recent.length===0){section.style.display='none';return;}
            section.style.display='block';
            var favs=getFavs();
            grid.innerHTML=recent.slice(0,8).map(function(name){
                var cityId=null;for(var k in cityMap){if(cityMap[k].name===name){cityId=k;break;}}
                var city=cityId?cityMap[cityId]:null;
                if(!city)return'';
                var isFav=favs.indexOf(name)!==-1;
                return '<div class="rec-card"><span class="rec-flag">'+city.flag+'</span><div class="rec-info"><div class="rec-name">'+city.name+'</div><div class="rec-meta">⭐'+city.rating+' · '+city.region+'</div></div>'+(isFav?'<span style="color:var(--accent-red);font-size:0.8rem;">已收藏</span>':'<button class="btn-add-fav" data-add-name="'+escapeHtml(name)+'" title="添加收藏">❤️</button>')+'</div>';
            }).filter(function(s){return s!=='';}).join('');
            document.querySelectorAll('#recentGrid .btn-add-fav').forEach(function(b){
                b.addEventListener('click',function(e){e.stopPropagation();
                    var name=this.dataset.addName,favs=getFavs();
                    if(favs.indexOf(name)===-1){favs.push(name);saveFavs(favs);loadFavs();}else{loadFavs();}
                });
            });
        }

        /* ===== Tags ===== */
        var tagEditTarget=null;
        function openTagEditor(cityName){
            tagEditTarget=cityName;
            document.getElementById('tagTargetName').textContent=cityName;
            document.getElementById('tagOverlay').classList.remove('hidden');
            var tags=getTags(),cityTags=tags[cityName]||[];
            var optsEl=document.getElementById('tagOptions');
            optsEl.innerHTML=presetTags.map(function(t){
                return '<span class="tag-opt'+(cityTags.indexOf(t)!==-1?' selected':'')+'" data-tag="'+t+'">'+t+'</span>';
            }).join('');
            document.querySelectorAll('.tag-opt').forEach(function(o){
                o.addEventListener('click',function(){this.classList.toggle('selected');});
            });
        }
        document.getElementById('btnTagSave').addEventListener('click',function(){
            if(!tagEditTarget)return;
            var selected=[];
            document.querySelectorAll('.tag-opt.selected').forEach(function(o){selected.push(o.dataset.tag);});
            var tags=getTags();tags[tagEditTarget]=selected;saveTags(tags);
            document.getElementById('tagOverlay').classList.add('hidden');loadFavs();
        });
        document.getElementById('btnTagCancel').addEventListener('click',function(){
            document.getElementById('tagOverlay').classList.add('hidden');tagEditTarget=null;
        });
        document.getElementById('btnAddCustomTag').addEventListener('click',function(){
            var input=document.getElementById('tagCustomInput'),val=input.value.trim();
            if(!val)return;
            var optsEl=document.getElementById('tagOptions');
            var span=document.createElement('span');span.className='tag-opt selected';span.dataset.tag=val;
            span.textContent=val;span.addEventListener('click',function(){this.classList.toggle('selected');});
            optsEl.appendChild(span);input.value='';
        });
        document.getElementById('tagOverlay').addEventListener('click',function(e){if(e.target===this){this.classList.add('hidden');}});

        /* ===== Multi-Select ===== */
        document.getElementById('btnMultiSelect').addEventListener('click',function(){
            multiSelectMode=!multiSelectMode;
            this.textContent=multiSelectMode?'☑️ 退出多选':'☑️ 多选模式';
            if(!multiSelectMode){selectedCities.clear();}
            loadFavs();
        });
        document.getElementById('btnSelectAll').addEventListener('click',function(){
            var favs=getFavs();
            if(selectedCities.size===favs.length){selectedCities.clear();}else{favs.forEach(function(n){selectedCities.add(n);});}
            loadFavs();
        });
        document.getElementById('btnBatchCancel').addEventListener('click',function(){
            multiSelectMode=false;selectedCities.clear();loadFavs();
        });
        document.getElementById('btnBatchDelete').addEventListener('click',function(){
            if(selectedCities.size===0)return;
            if(!confirm('确定删除选中的 '+selectedCities.size+' 个收藏吗？'))return;
            var favs=getFavs().filter(function(n){return !selectedCities.has(n);});
            saveFavs(favs);selectedCities.clear();loadFavs();
        });
        document.getElementById('btnBatchAddColl').addEventListener('click',function(){
            if(selectedCities.size===0)return;
            var colls=getCollections();
            if(colls.length===0){alert('请先创建一个合集！');return;}
            var names=colls.map(function(c,i){return i+': '+c.name;}).join('\n');
            var idx=prompt('选择合集序号（输入数字）:\n'+names);
            if(idx===null)return;
            var i=parseInt(idx);
            if(isNaN(i)||i<0||i>=colls.length){alert('无效的序号');return;}
            selectedCities.forEach(function(n){if(colls[i].cities.indexOf(n)===-1){colls[i].cities.push(n);}});
            saveCollections(colls);selectedCities.clear();loadFavs();
        });
        function updateBatchUI(){
            var bar=document.getElementById('batchBar'),cnt=document.getElementById('batchCount');
            if(multiSelectMode&&selectedCities.size>0){bar.classList.add('active');cnt.textContent=selectedCities.size;}
            else{bar.classList.remove('active');}
            document.getElementById('btnSelectAll').textContent=selectedCities.size===getFavs().length?'取消全选':'全选';
        }
        function updateCompareBtn(){
            var btn=document.getElementById('btnCompare');
            if(multiSelectMode&&selectedCities.size===2){
                btn.disabled=false;btn.style.opacity='1';btn.textContent='⚖️ 对比所选 (2/2)';
            }else if(multiSelectMode){
                btn.disabled=true;btn.style.opacity='0.5';btn.textContent='⚖️ 对比所选 ('+selectedCities.size+'/2)';
            }else{btn.disabled=true;btn.style.opacity='0.5';btn.textContent='⚖️ 对比所选 (0/2)';}
        }
        document.getElementById('btnCompare').addEventListener('click',function(){
            if(selectedCities.size!==2)return;
            var arr=Array.from(selectedCities),ids=[];
            for(var k in cityMap){if(arr.indexOf(cityMap[k].name)!==-1)ids.push(k);}
            if(ids.length===2){window.location.href='compare.html?cities='+ids.join(',');}
        });

        /* ===== Sort ===== */
        document.getElementById('sortSelect').addEventListener('change',function(){
            currentSort=this.value;loadFavs();
        });

        /* ===== Export ===== */
        document.getElementById('btnExport').addEventListener('click',function(){
            var favs=getFavs(),notes=getNotes(),tags=getTags();
            var data={favorites:favs,notes:notes,tags:tags,exportDate:new Date().toISOString()};
            document.getElementById('exportContent').textContent=JSON.stringify(data,null,2);
            document.getElementById('exportModal').classList.remove('hidden');
            document.getElementById('copiedMsg').classList.remove('show');
        });
        document.getElementById('btnCloseExport').addEventListener('click',function(){document.getElementById('exportModal').classList.add('hidden');});
        document.getElementById('btnCopyExport').addEventListener('click',function(){
            var text=document.getElementById('exportContent').textContent;
            navigator.clipboard.writeText(text).then(function(){document.getElementById('copiedMsg').classList.add('show');setTimeout(function(){document.getElementById('copiedMsg').classList.remove('show');},2000);}).catch(function(){alert('复制失败，请手动复制');});
        });
        document.getElementById('exportModal').addEventListener('click',function(e){if(e.target===this)this.classList.add('hidden');});

        /* ===== Share ===== */
        document.getElementById('btnShare').addEventListener('click',function(){
            var favs=getFavs(),lines=[];
            lines.push('🌆 我在 CityLens 收藏了 '+favs.length+' 个城市：');
            favs.forEach(function(name,i){
                for(var k in cityMap){if(cityMap[k].name===name){lines.push((i+1)+'. '+cityMap[k].flag+' '+cityMap[k].name+' ⭐'+cityMap[k].rating+' · '+cityMap[k].region);return;}}
                lines.push((i+1)+'. 🏙️ '+name);
            });
            document.getElementById('shareContent').textContent=lines.join('\n');
            document.getElementById('shareModal').classList.remove('hidden');
            document.getElementById('copiedShareMsg').classList.remove('show');
        });
        document.getElementById('btnCloseShare').addEventListener('click',function(){document.getElementById('shareModal').classList.add('hidden');});
        document.getElementById('btnCopyShare').addEventListener('click',function(){
            var text=document.getElementById('shareContent').textContent;
            navigator.clipboard.writeText(text).then(function(){document.getElementById('copiedShareMsg').classList.add('show');setTimeout(function(){document.getElementById('copiedShareMsg').classList.remove('show');},2000);}).catch(function(){alert('复制失败，请手动复制');});
        });
        document.getElementById('shareModal').addEventListener('click',function(e){if(e.target===this)this.classList.add('hidden');});

        /* ===== Clear All ===== */
        document.getElementById('btnClear').addEventListener('click',function(){
            if(confirm('确定要清空所有收藏吗？此操作不可恢复。')){localStorage.setItem('citylens-favs','[]');loadFavs();}
        });

        /* ===== Navbar & Theme ===== */
        (function(){
            var navbar=document.getElementById('navbar');
            window.addEventListener('scroll',function(){navbar.classList.toggle('scrolled',window.scrollY>50);});
            document.getElementById('mobileMenuBtn').addEventListener('click',function(){document.getElementById('navLinks').classList.toggle('active');});
            document.querySelectorAll('#navLinks a').forEach(function(l){l.addEventListener('click',function(){document.getElementById('navLinks').classList.remove('active');});});
            var bt=document.getElementById('btnThemeToggle'),s=localStorage.getItem('citylens-theme');
            if(s==='light'){document.body.classList.add('light-mode');bt.textContent='◑';}
            bt.addEventListener('click',function(){
                document.body.classList.toggle('light-mode');
                bt.textContent=document.body.classList.contains('light-mode')?'◑':'◐';
                localStorage.setItem('citylens-theme',document.body.classList.contains('light-mode')?'light':'dark');
            });
        })();

        /* ===== Init ===== */
        loadFavs();
        console.log('%c❤️ 收藏夹已就绪 | %c28城市 · 笔记 · 标签 · 合集 · 统计 · 地图 · 推荐 · 导出 · 分享',
            'color:#ff4757;font-size:1.1em;','color:#8b949e;');
    </script>
</body>
</html>
