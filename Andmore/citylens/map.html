<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地图探索 - CityLens</title>
    <style>
        :root {
            --bg-primary:#0a0e17;--bg-secondary:#111620;--bg-tertiary:#1a1f2e;--bg-card:#151a28;
            --text-primary:#c9d1d9;--text-secondary:#8b949e;--text-highlight:#f0f6fc;
            --accent-blue:#4a9eff;--accent-cyan:#00d4ff;--accent-green:#00ff88;--accent-gold:#ffd700;
            --accent-purple:#a855f7;--border-glow:#1e2d3d;--glass-bg:rgba(21,26,40,0.85);
            --shadow-card:0 4px 25px rgba(0,0,0,0.6);--shadow-hover:0 8px 40px rgba(74,158,255,0.2);
            --border-radius:10px;--transition-speed:0.3s;--nav-height:72px;--max-width:1400px;
            --climate-tropical:#00ff88;--climate-temperate:#4a9eff;--climate-arid:#ff8c42;--climate-cold:#00d4ff;
        }
        body.light-mode{--bg-primary:#f0f2f5;--bg-secondary:#ffffff;--bg-tertiary:#e4e6eb;--bg-card:#ffffff;--text-primary:#1a1a2e;--text-secondary:#5a6c7d;--text-highlight:#0a0a0a;--border-glow:#d0d5dd;--glass-bg:rgba(255,255,255,0.85);--shadow-card:0 4px 20px rgba(0,0,0,0.08);}
        *{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}
        body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;background-color:var(--bg-primary);color:var(--text-primary);line-height:1.6;transition:background-color var(--transition-speed),color var(--transition-speed);overflow-x:hidden;}
        ::-webkit-scrollbar{width:8px;}::-webkit-scrollbar-track{background:var(--bg-secondary);}::-webkit-scrollbar-thumb{background:var(--border-glow);border-radius:4px;}

        /* ── NAVBAR ──────────────────────────── */
        .navbar{position:fixed;top:0;left:0;width:100%;height:var(--nav-height);background:var(--glass-bg);backdrop-filter:blur(20px);border-bottom:1px solid rgba(74,158,255,0.1);z-index:1000;}.navbar.scrolled{box-shadow:0 4px 30px rgba(0,0,0,0.5);}
        .navbar .container{max-width:var(--max-width);margin:0 auto;padding:0 30px;height:100%;display:flex;align-items:center;justify-content:space-between;}
        .logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text-highlight);font-size:1.5rem;font-weight:800;}.logo-icon{width:42px;height:42px;background:linear-gradient(135deg,#4a9eff,#a855f7);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;color:#fff;}.logo-text{background:linear-gradient(135deg,#4a9eff,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .nav-links{display:flex;list-style:none;gap:2px;}.nav-links li a{display:block;padding:10px 16px;color:var(--text-secondary);text-decoration:none;border-radius:8px;transition:all var(--transition-speed);font-size:0.88rem;font-weight:500;position:relative;}.nav-links li a::after{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%) scaleX(0);width:50%;height:2px;background:var(--accent-cyan);transition:transform var(--transition-speed);}.nav-links li a:hover,.nav-links li a.active{color:var(--text-highlight);background:rgba(74,158,255,0.08);}.nav-links li a:hover::after,.nav-links li a.active::after{transform:translateX(-50%) scaleX(1);}
        .nav-actions{display:flex;gap:8px;}.btn-icon{width:38px;height:38px;border:1px solid rgba(74,158,255,0.15);background:rgba(74,158,255,0.05);color:var(--text-secondary);border-radius:8px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;}.btn-icon:hover{background:rgba(74,158,255,0.15);border-color:var(--accent-blue);color:var(--accent-cyan);}
        .mobile-menu-btn{display:none;}.mobile-menu-btn span{display:block;width:24px;height:2px;background:var(--accent-cyan);}

        /* ── PAGE HEADER ─────────────────────── */
        .page-header{margin-top:var(--nav-height);background:linear-gradient(160deg,#0a0e17 0%,#0d1525 30%,#0a0e17 100%);padding:55px 0;text-align:center;border-bottom:1px solid var(--border-glow);}.page-header h1{font-size:2.3rem;font-weight:900;color:var(--text-highlight);}
        .page-header .breadcrumb{margin-top:8px;font-size:0.82rem;color:var(--text-secondary);}.page-header .breadcrumb a{color:var(--accent-cyan);text-decoration:none;}.page-header .breadcrumb a:hover{text-decoration:underline;}

        /* ── MAIN CONTENT ────────────────────── */
        .main-content{padding:40px 0 70px;}.container{max-width:var(--max-width);margin:0 auto;padding:0 30px;}

        /* ── SECTION TITLES ──────────────────── */
        .section-title{font-size:1.35rem;font-weight:800;color:var(--text-highlight);margin-bottom:18px;display:flex;align-items:center;gap:10px;}
        .section-title .icon{font-size:1.4rem;}

        /* ── TOOLBAR ─────────────────────────── */
        .toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px;align-items:center;}
        .toolbar-btn{padding:9px 18px;border:1px solid var(--border-glow);background:var(--bg-card);color:var(--text-primary);border-radius:var(--border-radius);cursor:pointer;font-size:0.84rem;font-weight:600;transition:all var(--transition-speed);white-space:nowrap;font-family:inherit;}
        .toolbar-btn:hover{border-color:var(--accent-blue);color:var(--accent-cyan);background:rgba(74,158,255,0.06);}
        .toolbar-btn.active{border-color:var(--accent-cyan);background:rgba(0,212,255,0.10);color:var(--accent-cyan);}
        .toolbar-btn.night-active{border-color:var(--accent-purple);background:rgba(168,85,247,0.12);color:var(--accent-purple);}

        /* ── SEARCH INPUT ────────────────────── */
        .search-wrap{position:relative;flex:1;min-width:220px;max-width:380px;}
        .search-input{width:100%;padding:10px 42px 10px 15px;border:1px solid var(--border-glow);background:var(--bg-card);color:var(--text-highlight);border-radius:var(--border-radius);font-size:0.88rem;outline:none;font-family:inherit;transition:border-color var(--transition-speed);}
        .search-input:focus{border-color:var(--accent-blue);box-shadow:0 0 0 3px rgba(74,158,255,0.1);}
        .search-input::placeholder{color:var(--text-secondary);}
        .search-icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text-secondary);font-size:1rem;pointer-events:none;}

        /* ── ZOOM CONTINENT BTNS ────────────── */
        .zoom-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:25px;}
        .zoom-btn{padding:8px 20px;border:1px solid var(--border-glow);background:var(--bg-card);color:var(--text-secondary);border-radius:20px;cursor:pointer;font-size:0.82rem;font-weight:600;transition:all var(--transition-speed);font-family:inherit;}
        .zoom-btn:hover,.zoom-btn.active{border-color:var(--accent-cyan);color:var(--accent-cyan);background:rgba(0,212,255,0.08);}

        /* ── MAP SECTION ─────────────────────── */
        .map-section{background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);padding:40px;margin-bottom:30px;text-align:center;min-height:400px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;transition:background-color 0.5s;}
        .map-section.night-mode{background:#060b14;box-shadow:inset 0 0 80px rgba(0,30,80,0.4);}
        .world-map{position:relative;width:100%;max-width:900px;margin:0 auto;}
        .continent-row{display:flex;justify-content:space-around;margin-bottom:25px;flex-wrap:wrap;gap:20px;position:relative;}
        .continent-group{text-align:center;min-width:140px;position:relative;}
        .continent-title{font-size:0.9rem;font-weight:700;color:var(--accent-cyan);text-transform:uppercase;letter-spacing:2px;margin-bottom:12px;padding-bottom:6px;border-bottom:2px solid rgba(74,158,255,0.2);cursor:pointer;transition:color var(--transition-speed);}
        .continent-title:hover{color:var(--accent-gold);}

        /* ── CITY DOTS ───────────────────────── */
        .city-dot{display:inline-block;width:14px;height:14px;background:var(--accent-blue);border-radius:50%;cursor:pointer;transition:all var(--transition-speed);position:relative;margin:3px;box-shadow:0 0 10px rgba(74,158,255,0.5);animation:pulse-dot 2.5s ease-in-out infinite;}
        .city-dot.size-small{width:10px;height:10px;}
        .city-dot.size-medium{width:14px;height:14px;}
        .city-dot.size-large{width:20px;height:20px;box-shadow:0 0 16px rgba(74,158,255,0.7);}
        .city-dot.size-xlarge{width:26px;height:26px;box-shadow:0 0 22px rgba(74,158,255,0.8);}
        .city-dot.climate-tropical{background:var(--climate-tropical);box-shadow:0 0 10px rgba(0,255,136,0.5);}
        .city-dot.climate-temperate{background:var(--climate-temperate);box-shadow:0 0 10px rgba(74,158,255,0.5);}
        .city-dot.climate-arid{background:var(--climate-arid);box-shadow:0 0 10px rgba(255,140,66,0.5);}
        .city-dot.climate-cold{background:var(--climate-cold);box-shadow:0 0 10px rgba(0,212,255,0.5);}
        .city-dot:hover{transform:scale(1.8);background:var(--accent-gold) !important;box-shadow:0 0 20px rgba(255,215,0,0.6) !important;z-index:10;}
        .city-dot.active{background:var(--accent-gold) !important;box-shadow:0 0 25px rgba(255,215,0,0.7) !important;}
        .city-dot.highlight-search{background:var(--accent-gold) !important;box-shadow:0 0 30px rgba(255,215,0,0.9) !important;animation:pulse-search 0.6s ease-in-out infinite !important;transform:scale(2.2);z-index:15;}

        @keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.7;transform:scale(1.25);}}
        @keyframes pulse-search{0%,100%{box-shadow:0 0 15px rgba(255,215,0,0.5);}50%{box-shadow:0 0 40px rgba(255,215,0,1);}}

        /* ── TOOLTIP ─────────────────────────── */
        .city-tooltip{display:none;position:absolute;bottom:120%;left:50%;transform:translateX(-50%);background:var(--bg-card);border:1px solid var(--accent-gold);padding:8px 14px;border-radius:6px;white-space:nowrap;font-size:0.8rem;color:var(--text-highlight);z-index:20;pointer-events:none;box-shadow:var(--shadow-card);}
        .city-dot:hover .city-tooltip{display:block;}

        /* ── CONTINENT STATS PANEL ──────────── */
        .continent-stats-row{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:30px;}
        .continent-stat-card{flex:1;min-width:160px;background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);padding:16px 20px;text-align:center;transition:all var(--transition-speed);cursor:pointer;}
        .continent-stat-card:hover{border-color:var(--accent-blue);box-shadow:var(--shadow-hover);transform:translateY(-2px);}
        .cs-name{font-size:0.85rem;font-weight:700;color:var(--accent-cyan);margin-bottom:6px;}
        .cs-count{font-size:1.8rem;font-weight:900;color:var(--text-highlight);}
        .cs-detail{font-size:0.75rem;color:var(--text-secondary);margin-top:4px;}

        /* ── HOVER STATS PANEL ──────────────── */
        .continent-hover-panel{display:none;position:absolute;top:100%;left:50%;transform:translateX(-50%);background:var(--bg-card);border:1px solid var(--accent-blue);border-radius:var(--border-radius);padding:14px 20px;z-index:30;min-width:220px;text-align:left;box-shadow:var(--shadow-card);margin-top:8px;}
        .continent-group:hover .continent-hover-panel{display:block;}
        .hover-panel-title{font-weight:800;color:var(--accent-cyan);font-size:0.9rem;margin-bottom:8px;}
        .hover-panel-stat{display:flex;justify-content:space-between;font-size:0.78rem;color:var(--text-secondary);padding:3px 0;border-bottom:1px solid rgba(74,158,255,0.06);}
        .hover-panel-stat span:last-child{color:var(--text-highlight);font-weight:600;}

        /* ── SVG FLIGHT LINES ────────────────── */
        .flight-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:2;}
        .flight-line{stroke:rgba(0,212,255,0.18);stroke-width:1.2;stroke-dasharray:6 4;fill:none;transition:stroke 0.3s;}
        .flight-line:hover{stroke:rgba(0,212,255,0.45);}

        /* ── DISTANCE CALCULATOR ────────────── */
        .distance-calc{background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);padding:28px;margin-bottom:30px;}
        .distance-calc .row{display:flex;flex-wrap:wrap;gap:14px;align-items:end;margin-bottom:16px;}
        .distance-calc .field{flex:1;min-width:180px;}
        .distance-calc label{display:block;font-size:0.78rem;font-weight:700;color:var(--text-secondary);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px;}
        .distance-calc select{width:100%;padding:10px 14px;border:1px solid var(--border-glow);background:var(--bg-tertiary);color:var(--text-highlight);border-radius:var(--border-radius);font-size:0.88rem;outline:none;font-family:inherit;cursor:pointer;}
        .distance-calc select:focus{border-color:var(--accent-blue);}
        .distance-calc .result-box{text-align:center;padding:18px;background:var(--bg-tertiary);border-radius:var(--border-radius);margin-top:14px;}
        .distance-calc .result-box .big-distance{font-size:2.2rem;font-weight:900;color:var(--accent-gold);}
        .distance-calc .result-box .detail{font-size:0.82rem;color:var(--text-secondary);margin-top:4px;}

        /* ── LEGEND / KEY ────────────────────── */
        .legend-section{background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);padding:24px 28px;margin-bottom:30px;}
        .legend-grid{display:flex;flex-wrap:wrap;gap:22px;align-items:center;}
        .legend-item{display:flex;align-items:center;gap:8px;font-size:0.8rem;color:var(--text-secondary);}
        .legend-dot{width:13px;height:13px;border-radius:50%;display:inline-block;flex-shrink:0;}
        .legend-dot.ld-tropical{background:var(--climate-tropical);box-shadow:0 0 8px rgba(0,255,136,0.4);}
        .legend-dot.ld-temperate{background:var(--climate-temperate);box-shadow:0 0 8px rgba(74,158,255,0.4);}
        .legend-dot.ld-arid{background:var(--climate-arid);box-shadow:0 0 8px rgba(255,140,66,0.4);}
        .legend-dot.ld-cold{background:var(--climate-cold);box-shadow:0 0 8px rgba(0,212,255,0.4);}
        .legend-dot.ld-small{width:8px;height:8px;}
        .legend-dot.ld-medium{width:13px;height:13px;}
        .legend-dot.ld-large{width:20px;height:20px;}
        .legend-dot.ld-xlarge{width:26px;height:26px;}
        .legend-divider{width:1px;height:24px;background:var(--border-glow);}

        /* ── HEAT MAP ────────────────────────── */
        .heatmap-section{background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);padding:35px;margin-bottom:30px;text-align:center;position:relative;overflow:hidden;}
        .heatmap-canvas{position:relative;width:100%;max-width:800px;margin:0 auto;min-height:200px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px;padding:20px;}
        .heat-dot{width:8px;height:8px;border-radius:50%;opacity:0.65;transition:all 0.4s;}
        .heat-dot:hover{opacity:1;transform:scale(2.2);}

        /* ── CITY PREVIEW GRID ──────────────── */
        .city-preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-top:30px;}
        .city-preview-card{background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);padding:18px;display:flex;align-items:center;gap:14px;transition:all var(--transition-speed);cursor:pointer;text-decoration:none;color:inherit;}.city-preview-card:hover{border-color:var(--accent-blue);transform:translateY(-3px);box-shadow:var(--shadow-hover);}
        .cp-flag{font-size:2.5rem;}.cp-name{font-weight:700;color:var(--text-highlight);}.cp-info{font-size:0.8rem;color:var(--text-secondary);}
        .cp-meta{display:flex;gap:12px;margin-top:4px;font-size:0.72rem;color:var(--text-secondary);}
        .cp-meta span{display:flex;align-items:center;gap:3px;}

        /* ── FOOTER ──────────────────────────── */
        .footer{background:var(--bg-secondary);border-top:1px solid var(--border-glow);padding:28px;text-align:center;color:var(--text-secondary);font-size:0.78rem;}

        /* ── TOOLTIP ON STATS ────────────────── */
        .stat-tooltip-header{font-size:0.85rem;font-weight:800;color:var(--accent-cyan);margin-bottom:6px;}

        /* ── MOBILE ──────────────────────────── */
        @media(max-width:768px){
            .nav-links{display:none;position:absolute;top:var(--nav-height);left:0;width:100%;background:rgba(10,14,23,0.98);flex-direction:column;padding:20px;z-index:999;}.nav-links.active{display:flex;}
            .mobile-menu-btn{display:flex;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;}
            .map-section{padding:20px;min-height:300px;}
            .continent-row{flex-direction:column;align-items:center;gap:30px;}
            .continent-group{min-width:auto;width:100%;}
            .toolbar{flex-direction:column;align-items:stretch;}
            .search-wrap{max-width:100%;}
            .zoom-bar{justify-content:center;}
            .legend-grid{justify-content:center;gap:14px;}
            .distance-calc .row{flex-direction:column;}
            .continent-stats-row{gap:10px;}
            .continent-stat-card{min-width:130px;}
        }
    </style>
</head>
<body>
    <!-- ═══════════ NAVBAR ═══════════ -->
    <nav class="navbar" id="navbar">
        <div class="container">
            <a href="home.html" class="logo">
                <div class="logo-icon">C</div>
                <span class="logo-text">CityLens</span>
            </a>
            <ul class="nav-links" id="navLinks">
                <li><a href="home.html">首页</a></li>
                <li><a href="cities.html">城市大全</a></li>
                <li><a href="map.html" class="active">地图</a></li>
                <li><a href="compare.html">对比</a></li>
                <li><a href="ranking.html">排行榜</a></li>
                <li><a href="landmarks.html">地标</a></li>
            </ul>
            <div class="nav-actions">
                <button class="btn-icon" id="btnThemeToggle">◐</button>
                <button class="mobile-menu-btn" id="mobileMenuBtn"><span></span><span></span><span></span></button>
            </div>
        </div>
    </nav>

    <!-- ═══════════ PAGE HEADER ═══════════ -->
    <section class="page-header">
        <h1>🗺️ 地图探索</h1>
        <p class="breadcrumb"><a href="home.html">首页</a> / 地图探索</p>
    </section>

    <!-- ═══════════ MAIN CONTENT ═══════════ -->
    <section class="main-content">
    <div class="container">

        <!-- ── TOOLBAR: Search + View Toggles ── -->
        <div class="toolbar">
            <div class="search-wrap">
                <input type="text" class="search-input" id="citySearch" placeholder="🔍 搜索城市名称...">
                <span class="search-icon">🔍</span>
            </div>
            <button class="toolbar-btn active" id="btnViewContinent" title="按大洲分组">🌍 大洲视图</button>
            <button class="toolbar-btn" id="btnViewTimezone" title="按时区分组">🕐 时区视图</button>
            <button class="toolbar-btn" id="btnNightMode" title="夜间地图模式">🌙 夜间地图</button>
        </div>

        <!-- ── ZOOM TO CONTINENT ── -->
        <div class="zoom-bar">
            <button class="zoom-btn active" data-zoom="all">🌐 全部</button>
            <button class="zoom-btn" data-zoom="asia">🗾 亚洲</button>
            <button class="zoom-btn" data-zoom="europe">🏰 欧洲</button>
            <button class="zoom-btn" data-zoom="americas">🗽 美洲</button>
            <button class="zoom-btn" data-zoom="africa">🦁 非洲</button>
            <button class="zoom-btn" data-zoom="oceania">🏄 大洋洲</button>
        </div>

        <!-- ── CONTINENT STATS BAR ── -->
        <div class="continent-stats-row" id="continentStatsRow"></div>

        <!-- ── WORLD MAP ── -->
        <div class="map-section" id="mapSection">
            <h2 style="color:var(--accent-cyan);margin-bottom:30px;">🌍 世界城市分布</h2>
            <div class="world-map" id="worldMap">
                <!-- SVG flight overlay injected by JS -->
            </div>
        </div>

        <!-- ── LEGEND ── -->
        <div class="legend-section">
            <div class="section-title"><span class="icon">📖</span> 图例说明</div>
            <div class="legend-grid">
                <span style="font-size:0.78rem;font-weight:700;color:var(--text-highlight);">气候带：</span>
                <span class="legend-item"><span class="legend-dot ld-tropical"></span> 热带</span>
                <span class="legend-item"><span class="legend-dot ld-temperate"></span> 温带</span>
                <span class="legend-item"><span class="legend-dot ld-arid"></span> 干旱</span>
                <span class="legend-item"><span class="legend-dot ld-cold"></span> 寒带</span>
                <span class="legend-divider"></span>
                <span style="font-size:0.78rem;font-weight:700;color:var(--text-highlight);">人口规模：</span>
                <span class="legend-item"><span class="legend-dot ld-small"></span> &lt;5M</span>
                <span class="legend-item"><span class="legend-dot ld-medium"></span> 5-15M</span>
                <span class="legend-item"><span class="legend-dot ld-large"></span> 15-30M</span>
                <span class="legend-item"><span class="legend-dot ld-xlarge"></span> &gt;30M</span>
                <span class="legend-divider"></span>
                <span class="legend-item"><span class="legend-dot" style="background:var(--accent-gold);box-shadow:0 0 8px rgba(255,215,0,0.5);width:13px;height:13px;"></span> 搜索匹配</span>
            </div>
        </div>

        <!-- ── DISTANCE CALCULATOR ── -->
        <div class="distance-calc">
            <div class="section-title"><span class="icon">📏</span> 城市距离计算器</div>

    /* ═══════════════════════════════════════════
       GROUP BY CONTINENT
       ═══════════════════════════════════════════ */
    function groupByContinent() {
        const map = {};
        continents.forEach(c => map[c] = []);
        cities.forEach(city => map[city.continent].push(city));
        return map;
    }
    const regions = groupByContinent();

    /* ═══════════════════════════════════════════
       SIZE CLASS based on population
       ═══════════════════════════════════════════ */
    function getSizeClass(pop) {
        if (pop < 5000000) return 'size-small';
        if (pop < 15000000) return 'size-medium';
        if (pop < 30000000) return 'size-large';
        return 'size-xlarge';
    }

    /* ═══════════════════════════════════════════
       DOT COLOR based on climate
       ═══════════════════════════════════════════ */
    function getClimateClass(climate) {
        return 'climate-' + climate;
    }

    /* ═══════════════════════════════════════════
       FORMAT number
       ═══════════════════════════════════════════ */
    function fmtPop(n) {
        if (n >= 10000000) return (n / 1000000).toFixed(0) + 'M';
        if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
        if (n >= 1000) return (n / 1000).toFixed(0) + 'K';
        return n;
    }

    /* ═══════════════════════════════════════════
       RENDER WORLD MAP
       ═══════════════════════════════════════════ */
    function renderWorldMap(filterContinent) {
        const container = document.getElementById('worldMap');
        let html = '';
        const _continents = filterContinent ? [filterContinent] : continents;
        _continents.forEach(cont => {
            const cityList = regions[cont];
            if (!cityList || cityList.length === 0) return;
            const totalPop = cityList.reduce((s,c) => s + c.population, 0);
            const avgRating = (cityList.reduce((s,c) => s + c.rating, 0) / cityList.length).toFixed(1);
            html += `<div class="continent-row" data-continent="${cont}">`;
            html += `<div class="continent-group">`;
            html += `<div class="continent-title">${cont} <span style="font-size:0.7rem;color:var(--text-secondary);">(${cityList.length}城)</span></div>`;
            html += `<div>`;
            cityList.forEach(c => {
                const sz = getSizeClass(c.population);
                const cl = getClimateClass(c.climate);
                html += `<span class="city-dot ${sz} ${cl}" data-id="${c.id}" data-continent="${cont}" title="${c.flag} ${c.name} ⭐${c.rating}">`;
                html += `<span class="city-tooltip">${c.flag} ${c.name}<br>⭐${c.rating} | 👥${fmtPop(c.population)} | ${c.tz}<br>🌡️ ${c.climate==='tropical'?'热带':c.climate==='temperate'?'温带':c.climate==='arid'?'干旱':'寒带'}</span>`;
                html += `</span>`;
            });
            html += `</div>`;
            // Hover stats panel
            html += `<div class="continent-hover-panel">`;
            html += `<div class="hover-panel-title">${cont} 统计</div>`;
            html += `<div class="hover-panel-stat"><span>城市数量</span><span>${cityList.length}</span></div>`;
            html += `<div class="hover-panel-stat"><span>总人口</span><span>${fmtPop(totalPop)}</span></div>`;
            html += `<div class="hover-panel-stat"><span>平均评分</span><span>⭐${avgRating}</span></div>`;
            const climates = [...new Set(cityList.map(c=>c.climate))].map(cl=>cl==='tropical'?'热带':cl==='temperate'?'温带':cl==='arid'?'干旱':'寒带').join('、');
            html += `<div class="hover-panel-stat"><span>气候类型</span><span>${climates}</span></div>`;
            html += `</div>`;
            html += `</div>`;
            html += `</div>`;
        });
        container.innerHTML = html;

        // Re-bind dot click events
        document.querySelectorAll('.city-dot').forEach(dot => {
            dot.addEventListener('click', () => {
                const id = dot.dataset.id;
                document.querySelectorAll('.city-dot').forEach(d => d.classList.remove('active'));
                dot.classList.add('active');
                setTimeout(() => { window.location.href = `detail.html?id=${id}`; }, 400);
            });

        drawFlights();

       RENDER CITY PREVIEW CARDS
       ═══════════════════════════════════════════ */
    function renderCityPreview(filterContinent) {
        const container = document.getElementById('cityPreview');
        let list = cities;
        if (filterContinent) list = list.filter(c => c.continent === filterContinent);
        container.innerHTML = list.map(c => {
            const cl = getClimateClass(c.climate);
            const climateLabel = c.climate==='tropical'?'热带':c.climate==='temperate'?'温带':c.climate==='arid'?'干旱':'寒带';

       RENDER CONTINENT STATS BAR
       ═══════════════════════════════════════════ */
    function renderContinentStats() {
        const row = document.getElementById('continentStatsRow');
        row.innerHTML = continents.map(cont => {
            const cityList = regions[cont] || [];
            const totalPop = cityList.reduce((s,c) => s + c.population, 0);
            const avgRating = cityList.length > 0 ? (cityList.reduce((s,c) => s + c.rating, 0) / cityList.length).toFixed(1) : '-';
            return `<div class="continent-stat-card" data-continent="${cont}">
                <div class="cs-name">${cont}</div>
                <div class="cs-count">${cityList.length}</div>
                <div class="cs-detail">👥 ${fmtPop(totalPop)} | ⭐${avgRating}</div>
            </div>`;
        }).join('');

        // Click continent stat card -> zoom
        row.querySelectorAll('.continent-stat-card').forEach(card => {
            card.addEventListener('click', () => {
                const cont = card.dataset.continent;
                zoomToContinent(cont);
            });
        });

    /* ═══════════════════════════════════════════
       ZOOM TO CONTINENT
       ═══════════════════════════════════════════ */
    function zoomToContinent(cont) {
        // Update zoom buttons
        document.querySelectorAll('.zoom-btn').forEach(b => {
            b.classList.toggle('active', b.dataset.zoom === cont || (cont === 'all' && b.dataset.zoom === 'all'));
        });
        if (cont === 'all') {
            renderWorldMap(null);
            renderCityPreview(null);
        } else {
            renderWorldMap(cont);
            renderCityPreview(cont);
        }
        // Highlight matching continent groups
        document.querySelectorAll('.continent-group').forEach(g => {
            const title = g.querySelector('.continent-title');
            if (title && title.textContent.includes(cont)) {
                g.scrollIntoView({ behavior: 'smooth', block: 'center' });
                g.style.outline = '2px solid var(--accent-gold)';
                g.style.outlineOffset = '6px';
                setTimeout(() => { g.style.outline = ''; g.style.outlineOffset = ''; }, 2000);
            }
        });
    }

    /* ═══════════════════════════════════════════
       SVG FLIGHT ROUTES
       ═══════════════════════════════════════════ */
    function drawFlights() {
        const mapSection = document.getElementById('mapSection');
        // Remove old SVG if any
        const oldSvg = mapSection.querySelector('.flight-svg');
        if (oldSvg) oldSvg.remove();

        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.classList.add('flight-svg');
        svg.style.position = 'absolute';
        svg.style.top = '0';
        svg.style.left = '0';
        svg.style.width = '100%';
        svg.style.height = '100%';
        svg.style.pointerEvents = 'none';
        svg.style.zIndex = '2';

        // Major hub pairs for flight routes
        const hubPairs = [
            ['tokyo','seoul'],['tokyo','shanghai'],['tokyo','singapore'],['shanghai','hongkong'],
            ['beijing','tokyo'],['beijing','shanghai'],['beijing','moscow'],['shanghai','singapore'],
            ['hongkong','singapore'],['hongkong','bangkok'],['bangkok','singapore'],['singapore','jakarta'],
            ['dubai','mumbai'],['dubai','london'],['dubai','singapore'],['mumbai','singapore'],
            ['london','paris'],['london','nyc'],['paris','berlin'],['paris','rome'],['berlin','moscow'],
            ['rome','barcelona'],['madrid','barcelona'],['amsterdam','london'],['vienna','prague'],
            ['nyc','london'],['nyc','losangeles'],['nyc','chicago'],['nyc','toronto'],
            ['losangeles','vancouver'],['losangeles','mexicocity'],['losangeles','tokyo'],
            ['chicago','toronto'],['mexicocity','saopaulo'],['saopaulo','buenosaires'],
            ['cairo','dubai'],['cairo','london'],['cairo','nairobi'],['nairobi','lagos'],
            ['capetown','lagos'],['capetown','nairobi'],
            ['sydney','melbourne'],['sydney','auckland'],['melbourne','auckland'],['sydney','singapore'],
            ['sydney','losangeles'],['melbourne','hongkong']
        ];

        // Get dots in map, find center of each dot for line endpoints
        const dotElements = document.querySelectorAll('.city-dot');
        const dotMap = {};
        dotElements.forEach(d => {
            const rect = d.getBoundingClientRect();
            const mapRect = document.getElementById('mapSection').getBoundingClientRect();
            dotMap[d.dataset.id] = {
                x: rect.left + rect.width/2 - mapRect.left,
                y: rect.top + rect.height/2 - mapRect.top
            };
        });

        let svgContent = '';
        hubPairs.forEach(([a, b]) => {
            const ptA = dotMap[a];
            const ptB = dotMap[b];
            if (ptA && ptB) {
                svgContent += `<line x1="${ptA.x}" y1="${ptA.y}" x2="${ptB.x}" y2="${ptB.y}" class="flight-line"/>`;
            }
        });

        svg.innerHTML = svgContent;
        mapSection.appendChild(svg);
    }

    /* ═══════════════════════════════════════════
       RENDER HEAT MAP
       ═══════════════════════════════════════════ */
    function renderHeatmap() {
        const canvas = document.getElementById('heatmapCanvas');
        canvas.innerHTML = cities.map(c => {
            const popRatio = Math.min(c.population / 37300000, 1); // normalized to Tokyo
            const r = Math.floor(255 * popRatio);
            const g = Math.floor(100 + 80 * (1 - popRatio));
            const b = Math.floor(255 * (1 - popRatio));
            const size = 6 + 14 * popRatio;
            const opacity = 0.3 + 0.5 * popRatio;
            return `<span class="heat-dot" title="${c.flag} ${c.name} 👥${fmtPop(c.population)}"
                style="width:${size}px;height:${size}px;background:rgba(${r},${g},${b},${opacity});box-shadow:0 0 ${size}px rgba(${r},${g},${b},${opacity + 0.2});"
            ></span>`;
        }).join('');
    }

    /* ═══════════════════════════════════════════
       DISTANCE CALCULATOR
       ═══════════════════════════════════════════ */
    function populateDistanceDropdowns() {
        const s1 = document.getElementById('distCity1');
        const s2 = document.getElementById('distCity2');
        const opts = cities.map(c => `<option value="${c.id}">${c.flag} ${c.name} (${c.continent})</option>`).join('');
        s1.innerHTML = opts;
        s2.innerHTML = opts;
        // Default picks
        s1.value = 'beijing';
        s2.value = 'nyc';
    }

    function haversine(lat1, lon1, lat2, lon2) {
        const R = 6371; // Earth radius in km
        const toRad = x => x * Math.PI / 180;
        const dLat = toRad(lat2 - lat1);
        const dLon = toRad(lon2 - lon1);
        const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c;
    }

    function calcDistance() {
        const id1 = document.getElementById('distCity1').value;
        const id2 = document.getElementById('distCity2').value;
        const city1 = cities.find(c => c.id === id1);
        const city2 = cities.find(c => c.id === id2);
        const resultDiv = document.getElementById('distanceResult');

        if (!city1 || !city2) {
            resultDiv.innerHTML = '<div style="color:var(--text-secondary);">请选择两座城市</div>';
            return;
        }
        if (city1.id === city2.id) {
            resultDiv.innerHTML = '<div style="color:var(--text-secondary);">请选择两座不同的城市</div>';
            return;
        }

        const km = haversine(city1.lat, city1.lng, city2.lat, city2.lng);
        const mi = km * 0.621371;
        resultDiv.innerHTML = `
            <div style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:8px;">${city1.flag} ${city1.name} → ${city2.flag} ${city2.name}</div>
            <div class="big-distance">${Math.round(km).toLocaleString()} km</div>
            <div class="detail">≈ ${Math.round(mi).toLocaleString()} 英里 | 大圆航线</div>
        `;
    }

    /* ═══════════════════════════════════════════
       TIMEZONE VIEW
       ═══════════════════════════════════════════ */
    function renderTimezoneView() {
        // Group cities by timezone offset
        const tzMap = {};
        cities.forEach(c => {
            const tzKey = c.tz;
            if (!tzMap[tzKey]) tzMap[tzKey] = [];
            tzMap[tzKey].push(c);
        });

        const sortedTzs = Object.keys(tzMap).sort((a,b) => {
            const offA = cities.find(c => c.tz === a)?.tzOffset || 0;
            const offB = cities.find(c => c.tz === b)?.tzOffset || 0;
            return offA - offB;
        });

        const container = document.getElementById('worldMap');
        let html = '<div style="max-width:900px;margin:0 auto;">';
        sortedTzs.forEach(tz => {
            const cityList = tzMap[tz];
            html += `<div class="continent-row" style="justify-content:flex-start;">`;
            html += `<div class="continent-group" style="text-align:left;width:100%;">`;
            html += `<div class="continent-title">🕐 ${tz} <span style="font-size:0.7rem;color:var(--text-secondary);">(${cityList.length}城)</span></div>`;
            html += `<div>`;
            cityList.forEach(c => {
                const sz = getSizeClass(c.population);
                const cl = getClimateClass(c.climate);
                html += `<span class="city-dot ${sz} ${cl}" data-id="${c.id}" data-continent="${c.continent}" title="${c.flag} ${c.name} ⭐${c.rating}"><span class="city-tooltip">${c.flag} ${c.name}<br>⭐${c.rating} | 👥${fmtPop(c.population)} | ${c.continent}<br>🌡️ ${c.climate==='tropical'?'热带':c.climate==='temperate'?'温带':c.climate==='arid'?'干旱':'寒带'}</span></span>`;
            });
            html += `</div></div></div>`;
        });
        html += '</div>';
        container.innerHTML = html;

        // Re-bind clicks
        document.querySelectorAll('.city-dot').forEach(dot => {
            dot.addEventListener('click', () => {
                const id = dot.dataset.id;
                document.querySelectorAll('.city-dot').forEach(d => d.classList.remove('active'));
                dot.classList.add('active');
                setTimeout(() => { window.location.href = `detail.html?id=${id}`; }, 400);
            });
        });
    }

    /* ═══════════════════════════════════════════
       CITY SEARCH WITH HIGHLIGHT
       ═══════════════════════════════════════════ */
    function searchCity(query) {
        // Remove previous highlights
        document.querySelectorAll('.city-dot.highlight-search').forEach(d => d.classList.remove('highlight-search'));
        if (!query || query.trim().length < 1) return;

        const q = query.trim().toLowerCase();
        let found = null;

        document.querySelectorAll('.city-dot').forEach(dot => {
            const id = dot.dataset.id;
            const city = cities.find(c => c.id === id);
            if (city && (city.name.includes(q) || city.name.toLowerCase().includes(q) || city.id.includes(q))) {
                dot.classList.add('highlight-search');
                if (!found) found = dot;
            }
        });

        // Scroll first match into view
        if (found) {
            found.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }

    /* ═══════════════════════════════════════════
       NIGHT MODE
       ═══════════════════════════════════════════ */
    let nightModeActive = false;
    function toggleNightMode() {
        nightModeActive = !nightModeActive;
        const mapSection = document.getElementById('mapSection');
        const btn = document.getElementById('btnNightMode');
        if (nightModeActive) {
            mapSection.classList.add('night-mode');
            btn.classList.add('night-active');
            btn.textContent = '🌙 夜间模式 (开)';
        } else {
            mapSection.classList.remove('night-mode');
            btn.classList.remove('night-active');
            btn.textContent = '🌙 夜间地图';
        }
    }

    /* ═══════════════════════════════════════════
       INIT and EVENT BINDINGS
       ═══════════════════════════════════════════ */
    function init() {
        renderContinentStats();
        renderWorldMap(null);
        renderCityPreview(null);
        renderHeatmap();
        populateDistanceDropdowns();

        // Zoom buttons
        document.querySelectorAll('.zoom-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const cont = btn.dataset.zoom;
                document.querySelectorAll('.zoom-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                if (cont === 'all') {
                    renderWorldMap(null);
                    renderCityPreview(null);
                } else {
                    renderWorldMap(cont);
                    renderCityPreview(cont);
                }
            });
        });

        // Toolbar view buttons
        const btnContinent = document.getElementById('btnViewContinent');
        const btnTimezone = document.getElementById('btnViewTimezone');
        btnContinent.addEventListener('click', () => {
            btnContinent.classList.add('active');
            btnTimezone.classList.remove('active');
            renderWorldMap(null);
            // Reset zoom buttons
            document.querySelectorAll('.zoom-btn').forEach(b => b.classList.toggle('active', b.dataset.zoom === 'all'));
        });
        btnTimezone.addEventListener('click', () => {
            btnTimezone.classList.add('active');
            btnContinent.classList.remove('active');
            renderTimezoneView();
        });

        // Night mode
        document.getElementById('btnNightMode').addEventListener('click', toggleNightMode);

        // Distance calculator
        document.getElementById('btnCalcDist').addEventListener('click', calcDistance);
        // Auto-calculate on dropdown change
        document.getElementById('distCity1').addEventListener('change', calcDistance);
        document.getElementById('distCity2').addEventListener('change', calcDistance);

        // Search
        const searchInput = document.getElementById('citySearch');
        searchInput.addEventListener('input', () => {
            searchCity(searchInput.value);
        });
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                searchInput.value = '';
                searchCity('');
            }
        });

        // Redraw flights on resize (debounced)
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => drawFlights(), 300);
        });
    }

    /* ═══════════════════════════════════════════
       NAVBAR: scroll effect
       ═══════════════════════════════════════════ */
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => navbar.classList.toggle('scrolled', window.scrollY > 50));

    /* ═══════════════════════════════════════════
       MOBILE MENU
       ═══════════════════════════════════════════ */
    document.getElementById('mobileMenuBtn').addEventListener('click', () => {
        document.getElementById('navLinks').classList.toggle('active');
    });
    document.querySelectorAll('#navLinks a').forEach(l => {
        l.addEventListener('click', () => document.getElementById('navLinks').classList.remove('active'));
    });

    /* ═══════════════════════════════════════════
       THEME TOGGLE
       ═══════════════════════════════════════════ */
    const bt = document.getElementById('btnThemeToggle');
    const s = localStorage.getItem('citylens-theme');
    if (s === 'light') {
        document.body.classList.add('light-mode');
        bt.textContent = '◑';
    }
    bt.addEventListener('click', () => {
        document.body.classList.toggle('light-mode');
        bt.textContent = document.body.classList.contains('light-mode') ? '◑' : '◐';
        localStorage.setItem('citylens-theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
    });

    /* ═══════════════════════════════════════════
       STARTUP
       ═══════════════════════════════════════════ */
    document.addEventListener('DOMContentLoaded', init);
    console.log('%c🗺️ 地图探索已就绪 %c| %c40+ 城市 %c| %c5 大洲 %c| %c夜间地图 %c| %c距离计算器 %c| %c时区视图',
        'color:#4a9eff;font-weight:bold;',
        '', 'color:#00d4ff;', '', 'color:#00ff88;', '', 'color:#a855f7;', '', 'color:#ffd700;', '', 'color:#ff8c42;');
    </script>
</body>
