<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城市详情 - CityLens</title>
    <style>
        :root {
            --bg-primary:#0a0e17;--bg-secondary:#111620;--bg-tertiary:#1a1f2e;--bg-card:#151a28;
            --text-primary:#c9d1d9;--text-secondary:#8b949e;--text-highlight:#f0f6fc;
            --accent-blue:#4a9eff;--accent-cyan:#00d4ff;--accent-green:#00ff88;--accent-gold:#ffd700;
            --accent-purple:#a855f7;--accent-red:#ff4757;--border-glow:#1e2d3d;
            --glass-bg:rgba(21,26,40,0.85);--shadow-card:0 4px 25px rgba(0,0,0,0.6);
            --shadow-hover:0 8px 40px rgba(74,158,255,0.2);--border-radius:10px;--transition-speed:0.3s;
            --nav-height:72px;--max-width:1200px;
        }
        body.light-mode{--bg-primary:#f0f2f5;--bg-secondary:#ffffff;--bg-tertiary:#e4e6eb;--bg-card:#ffffff;--text-primary:#1a1a2e;--text-secondary:#5a6c7d;--text-highlight:#0a0a0a;--border-glow:#d0d5dd;--glass-bg:rgba(255,255,255,0.85);--shadow-card:0 4px 20px rgba(0,0,0,0.08);}
        *{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}
        body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;background-color:var(--bg-primary);color:var(--text-primary);line-height:1.6;transition:background-color var(--transition-speed),color var(--transition-speed);}
        ::-webkit-scrollbar{width:8px;}::-webkit-scrollbar-track{background:var(--bg-secondary);}::-webkit-scrollbar-thumb{background:var(--border-glow);border-radius:4px;}
        .navbar{position:fixed;top:0;left:0;width:100%;height:var(--nav-height);background:var(--glass-bg);backdrop-filter:blur(20px);border-bottom:1px solid rgba(74,158,255,0.1);z-index:1000;}.navbar.scrolled{box-shadow:0 4px 30px rgba(0,0,0,0.5);}
        .navbar .container{max-width:var(--max-width);margin:0 auto;padding:0 30px;height:100%;display:flex;align-items:center;justify-content:space-between;}
        .logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text-highlight);font-size:1.5rem;font-weight:800;}.logo-icon{width:42px;height:42px;background:linear-gradient(135deg,#4a9eff,#a855f7);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;color:#fff;}.logo-text{background:linear-gradient(135deg,#4a9eff,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .nav-links{display:flex;list-style:none;gap:2px;}.nav-links li a{display:block;padding:10px 16px;color:var(--text-secondary);text-decoration:none;border-radius:8px;transition:all var(--transition-speed);font-size:0.88rem;font-weight:500;}.nav-links li a:hover{color:var(--text-highlight);}
        .nav-actions{display:flex;gap:8px;}.btn-icon{width:38px;height:38px;border:1px solid rgba(74,158,255,0.15);background:rgba(74,158,255,0.05);color:var(--text-secondary);border-radius:8px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;}.btn-icon:hover{background:rgba(74,158,255,0.15);border-color:var(--accent-blue);color:var(--accent-cyan);}
        .mobile-menu-btn{display:none;}.mobile-menu-btn span{display:block;width:24px;height:2px;background:var(--accent-cyan);}
        .detail-hero{margin-top:var(--nav-height);height:400px;display:flex;align-items:flex-end;padding:40px;position:relative;overflow:hidden;}
        .detail-hero-bg{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(160deg,#0a0e17 0%,#0d1525 40%,#100d1a 100%);z-index:0;}
        .detail-hero-glow{position:absolute;width:350px;height:350px;border-radius:50%;filter:blur(100px);z-index:0;}
        .detail-hero-glow:nth-child(2){top:20%;left:30%;background:rgba(74,158,255,0.12);}
        .detail-hero-glow:nth-child(3){bottom:10%;right:20%;background:rgba(168,85,247,0.08);}
        .detail-hero-content{position:relative;z-index:2;max-width:var(--max-width);width:100%;margin:0 auto;display:flex;align-items:flex-end;gap:25px;}
        .detail-hero-icon{font-size:6rem;}
        .detail-hero-info h1{font-size:2.8rem;font-weight:900;color:var(--text-highlight);}
        .detail-hero-meta{color:var(--text-secondary);font-size:0.95rem;margin-top:5px;}
        .detail-content{max-width:var(--max-width);margin:0 auto;padding:40px 30px 70px;display:grid;grid-template-columns:1fr 340px;gap:30px;}
        .detail-main h2{font-size:1.3rem;color:var(--accent-cyan);margin-bottom:15px;padding-bottom:8px;border-bottom:2px solid rgba(74,158,255,0.2);display:flex;align-items:center;gap:8px;}
        .info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:25px;}
        .info-card{background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);padding:16px;text-align:center;transition:all var(--transition-speed);}
        .info-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:var(--accent-cyan);}
        .info-value{font-size:1.4rem;font-weight:900;color:var(--accent-cyan);}
        .info-label{font-size:0.75rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:1px;margin-top:4px;}
        .index-section{margin-bottom:25px;}.index-section h3{color:var(--text-highlight);margin-bottom:12px;font-size:1rem;}
        .index-bars{display:flex;flex-direction:column;gap:10px;}.index-bar{margin-bottom:5px;}
        .index-bar-label{display:flex;justify-content:space-between;font-size:0.82rem;color:var(--text-secondary);margin-bottom:3px;}
        .index-bar-track{height:6px;background:var(--bg-tertiary);border-radius:3px;overflow:hidden;}
        .index-bar-fill{height:100%;border-radius:3px;transition:width 1.2s ease;background:linear-gradient(90deg,var(--accent-blue),var(--accent-cyan));}
        .detail-sidebar{display:flex;flex-direction:column;gap:20px;}
        .sidebar-card{background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);padding:20px;}
        .sidebar-card h3{color:var(--accent-cyan);font-size:0.9rem;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border-glow);}
        .landmark-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.03);font-size:0.85rem;}.landmark-item span{font-size:1.5rem;}
        .btn-fav{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;background:rgba(255,71,87,0.1);border:1px solid var(--accent-red);color:var(--accent-red);border-radius:20px;cursor:pointer;font-size:0.85rem;font-weight:600;transition:all var(--transition-speed);}
        .btn-fav.favorited{background:rgba(255,71,87,0.2);}.btn-fav:hover{background:var(--accent-red);color:#fff;}
        /* NEW: Photo Gallery */
        .photo-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-bottom:25px;}
        .photo-card{border-radius:var(--border-radius);overflow:hidden;background:var(--bg-card);border:1px solid var(--border-glow);transition:all var(--transition-speed);}
        .photo-card:hover{transform:scale(1.03);box-shadow:var(--shadow-hover);}
        .photo-card img{width:100%;height:180px;object-fit:cover;display:block;}
        .photo-card .photo-label{padding:0.6rem 1rem;font-size:0.8rem;color:var(--text-secondary);text-align:center;}
        /* NEW: Tabs */
        .tabs{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap;}
        .tab-btn{padding:8px 18px;border:1px solid var(--border-glow);background:var(--bg-card);color:var(--text-secondary);border-radius:20px;cursor:pointer;font-size:0.82rem;font-weight:600;transition:all var(--transition-speed);}
        .tab-btn.active,.tab-btn:hover{background:var(--accent-blue);border-color:var(--accent-blue);color:#fff;}
        .tab-content{display:none;}.tab-content.active{display:block;animation:fadeIn 0.4s ease;}
        /* NEW: Reviews */
        .review-card{background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);padding:16px;margin-bottom:12px;}
        .review-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
        .review-stars{color:var(--accent-gold);font-size:0.9rem;}
        .review-text{color:var(--text-secondary);font-size:0.85rem;line-height:1.6;}
        .review-author{font-size:0.75rem;color:var(--text-secondary);margin-top:6px;}
        /* NEW: Stats Dashboard */
        .stats-dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:25px;}
        .stat-mini{background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);padding:14px;text-align:center;transition:all var(--transition-speed);}
        .stat-mini:hover{transform:translateY(-2px);border-color:var(--accent-purple);}
        .stat-mini .sm-value{font-size:1.5rem;font-weight:900;color:var(--accent-green);}
        .stat-mini .sm-label{font-size:0.7rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
        /* NEW: Timeline */
        .mini-timeline{position:relative;padding-left:20px;border-left:2px solid var(--accent-purple);margin:15px 0;}
        .mini-timeline .mt-item{position:relative;margin-bottom:12px;padding-left:16px;font-size:0.82rem;color:var(--text-secondary);}
        .mini-timeline .mt-item::before{content:'';position:absolute;left:-27px;top:5px;width:10px;height:10px;background:var(--accent-purple);border-radius:50%;}
        .mini-timeline .mt-year{font-weight:700;color:var(--accent-cyan);font-size:0.75rem;}
        /* NEW: Cuisine tags */
        .cuisine-tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;}
        .cuisine-tag{padding:4px 12px;background:rgba(0,212,255,0.08);border:1px solid rgba(0,212,255,0.2);border-radius:15px;font-size:0.78rem;color:var(--accent-cyan);}
        /* Animations */
        @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        @keyframes pulseGlow{0%,100%{box-shadow:0 0 5px rgba(74,158,255,0.2)}50%{box-shadow:0 0 20px rgba(74,158,255,0.5)}}
        @keyframes slideIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
        .pulse-glow{animation:pulseGlow 2.5s infinite;}
        .animate-in{animation:fadeIn 0.5s ease both;}
        /* NEW: Cost Calculator */
        .cost-calc{background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);padding:20px;margin-bottom:25px;}
        .cost-calc h3{color:var(--accent-cyan);font-size:1rem;margin-bottom:15px;}
        .cost-input-group{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
        .cost-input-group input{padding:10px;border:1px solid var(--border-glow);border-radius:8px;background:var(--bg-tertiary);color:var(--text-primary);font-size:0.9rem;width:120px;}
        .cost-input-group select{padding:10px;border:1px solid var(--border-glow);border-radius:8px;background:var(--bg-tertiary);color:var(--text-primary);font-size:0.9rem;}
        .cost-result{font-size:1.2rem;font-weight:800;color:var(--accent-green);margin-top:10px;padding:10px;background:rgba(0,255,136,0.05);border-radius:8px;text-align:center;}
        .cost-breakdown{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;font-size:0.8rem;color:var(--text-secondary);}
        /* Neighborhood tags */
        .neighbor-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;}
        .neighbor-card{background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);padding:14px;transition:all var(--transition-speed);}
        .neighbor-card:hover{border-color:var(--accent-purple);transform:translateY(-2px);}
        .neighbor-card h4{color:var(--accent-cyan);font-size:0.9rem;margin-bottom:4px;}
        .neighbor-card p{font-size:0.75rem;color:var(--text-secondary);line-height:1.4;}
        .footer{background:var(--bg-secondary);border-top:1px solid var(--border-glow);padding:28px;text-align:center;color:var(--text-secondary);font-size:0.78rem;}
        @media(max-width:768px){.detail-content{grid-template-columns:1fr;}.detail-hero{height:280px;}.detail-hero-info h1{font-size:1.8rem;}.nav-links{display:none;}.mobile-menu-btn{display:flex;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;}}
    </style>
</head>
<body>
    <nav class="navbar" id="navbar"><div class="container"><a href="home.html" class="logo"><div class="logo-icon">C</div><span class="logo-text">CityLens</span></a><ul class="nav-links" id="navLinks"><li><a href="home.html">首页</a></li><li><a href="cities.html">城市大全</a></li><li><a href="compare.html">对比</a></li><li><a href="ranking.html">排行榜</a></li></ul><div class="nav-actions"><button class="btn-icon" id="btnThemeToggle">◐</button><button class="mobile-menu-btn" id="mobileMenuBtn"><span></span><span></span><span></span></button></div></div></nav>

    <section class="detail-hero" id="detailHero"><div class="detail-hero-bg"></div><div class="detail-hero-glow"></div><div class="detail-hero-glow"></div><div class="detail-hero-content"><span class="detail-hero-icon" id="cityIcon">🗼</span><div class="detail-hero-info"><h1 id="cityName">东京</h1><div class="detail-hero-meta" id="cityMeta">🇯🇵 日本 · 亚洲</div></div></div></section>

    <div class="detail-content">
        <div class="detail-main">
            <!-- Stats Dashboard -->
            <h2>📊 城市概览</h2>

            <!-- Tabs -->
            <div class="tabs" id="detailTabs">
                <button class="tab-btn active" data-tab="overview">📝 简介</button>
                <button class="tab-btn" data-tab="gallery">📸 图集</button>
                <button class="tab-btn" data-tab="transport">🚇 交通</button>
                <button class="tab-btn" data-tab="cuisine">🍽️ 美食</button>

            <div class="tab-content active" id="tab-overview">

                <div class="cuisine-tags" id="cuisineTags"></div>
            </div>

            <div class="tab-content" id="tab-gallery">
                <h2>📸 城市图集</h2>
                <div class="photo-gallery" id="photoGallery"></div>
            </div>

            <div class="tab-content" id="tab-transport">
                <h2>🚇 交通系统</h2>
                <p id="transportDesc" style="color:var(--text-secondary);line-height:1.8;"></p>
            </div>

            <div class="tab-content" id="tab-cuisine">
                <h2>🍽️ 特色美食</h2>
                <div id="cuisineList" style="display:flex;flex-wrap:wrap;gap:10px;"></div>
            </div>

            <div class="tab-content" id="tab-history">
                <h2>📜 历史沿革</h2>
                <div class="mini-timeline" id="historyTimeline"></div>
            </div>

            <div class="tab-content" id="tab-reviews">
                <h2>⭐ 游客点评</h2>
                <div id="reviewList"></div>
            </div>

            <!-- Life Index -->
            <h2>📈 生活指数</h2>
            <div class="index-bars" id="indexBars"></div>

            <!-- Cost Calculator -->
            <h2>💰 旅行成本估算</h2>
            <div class="cost-calc">
                <h3>计算你的旅行预算</h3>
                <div class="cost-input-group">
                    <input type="number" id="costDays" value="5" min="1" max="30" placeholder="天数">
                    <select id="costStyle">
                        <option value="budget">背包客</option>
                        <option value="mid" selected>中等舒适</option>
                        <option value="luxury">奢华体验</option>
                    </select>
                    <button onclick="calculateCost()" style="padding:10px 20px;background:var(--accent-cyan);color:#000;border:none;border-radius:8px;cursor:pointer;font-weight:700;">计算</button>
                </div>
                <div class="cost-result" id="costResult">点击"计算"按钮查看估算</div>
                <div class="cost-breakdown" id="costBreakdown"></div>
            </div>

            <!-- Landmarks -->
            <h2>🏛️ 地标建筑</h2>
            <div id="cityLandmarks" style="display:flex;gap:10px;flex-wrap:wrap;"></div>

            <!-- Neighborhoods -->
            <h2>🏘️ 热门街区</h2>
            <div class="neighbor-grid" id="neighborhoodGrid"></div>

            <!-- Travel Tips -->
            <h2>💡 旅行贴士</h2>
            <div id="travelTips" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;"></div>
        </div>

        <div class="detail-sidebar">
            <div class="sidebar-card"><h3>❤️ 收藏</h3><button class="btn-fav" id="btnFavorite">🤍 收藏城市</button></div>
            <div class="sidebar-card"><h3>📍 热门地标</h3><div id="sidebarLandmarks"></div></div>
            <div class="sidebar-card"><h3>🌤️ 气候信息</h3><div id="climateInfo" style="color:var(--text-secondary);font-size:0.85rem;"></div></div>
            <div class="sidebar-card"><h3>🕐 时区 & 货币</h3><div id="timezoneInfo" style="color:var(--text-secondary);font-size:0.85rem;"></div></div>
            <div class="sidebar-card"><h3>🎯 适合人群</h3><div id="suitableFor" style="color:var(--text-secondary);font-size:0.82rem;"></div></div>
        </div>
    </div>

    <footer class="footer"><p>© 2025 CityLens | 城市数据来源公开资料 | 仅供学习使用</p></footer>
