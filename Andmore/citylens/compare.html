<!DOCTYPE html>

    <style>
        :root {

        body.light-mode{--bg-primary:#f0f2f5;--bg-secondary:#ffffff;--bg-tertiary:#e4e6eb;--bg-card:#ffffff;--text-primary:#1a1a2e;--text-secondary:#5a6c7d;--text-highlight:#0a0a0a;--border-glow:#d0d5dd;--glass-bg:rgba(255,255,255,0.85);--shadow-card:0 4px 20px rgba(0,0,0,0.08);}
        *{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}
        body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;background-color:var(--bg-primary);color:var(--text-primary);line-height:1.6;transition:background-color var(--transition-speed),color var(--transition-speed);overflow-x:hidden;}

        .navbar .container{max-width:var(--max-width);margin:0 auto;padding:0 30px;height:100%;display:flex;align-items:center;justify-content:space-between;}
        .logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text-highlight);font-size:1.5rem;font-weight:800;}.logo-icon{width:42px;height:42px;background:linear-gradient(135deg,#a855f7,#4a9eff);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;color:#fff;}.logo-text{background:linear-gradient(135deg,#4a9eff,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .nav-links{display:flex;list-style:none;gap:2px;}.nav-links li a{display:block;padding:10px 16px;color:var(--text-secondary);text-decoration:none;border-radius:8px;transition:all var(--transition-speed);font-size:0.88rem;font-weight:500;position:relative;}.nav-links li a::after{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%) scaleX(0);width:50%;height:2px;background:var(--accent-purple);transition:transform var(--transition-speed);}.nav-links li a:hover,.nav-links li a.active{color:var(--text-highlight);background:rgba(168,85,247,0.08);}.nav-links li a:hover::after,.nav-links li a.active::after{transform:translateX(-50%) scaleX(1);}
        .nav-actions{display:flex;gap:8px;}.btn-icon{width:38px;height:38px;border:1px solid rgba(168,85,247,0.15);background:rgba(168,85,247,0.05);color:var(--text-secondary);border-radius:8px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;}.btn-icon:hover{background:rgba(168,85,247,0.15);border-color:var(--accent-purple);color:var(--accent-purple);}
        .mobile-menu-btn{display:none;}.mobile-menu-btn span{display:block;width:24px;height:2px;background:var(--accent-purple);}
        .page-header{margin-top:var(--nav-height);background:linear-gradient(160deg,#0a0e17 0%,#140d1a 30%,#0a0e17 100%);padding:55px 0;text-align:center;border-bottom:1px solid var(--border-glow);}
        .page-header h1{font-size:2.3rem;font-weight:900;color:var(--text-highlight);}
        .page-header .breadcrumb{margin-top:8px;color:var(--text-secondary);font-size:0.82rem;}
        .page-header .breadcrumb a{color:var(--accent-purple);text-decoration:none;}
        .main-content{padding:40px 0 70px;}.container{max-width:var(--max-width);margin:0 auto;padding:0 30px;}
        .setup-card{background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);padding:35px;margin-bottom:30px;text-align:center;}.setup-card h2{color:var(--accent-purple);margin-bottom:25px;}
        .presets-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:20px;}
        .btn-preset{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;background:var(--bg-tertiary);border:1px solid var(--border-glow);color:var(--text-primary);border-radius:25px;font-size:0.82rem;cursor:pointer;transition:all var(--transition-speed);font-weight:500;}
        .btn-preset:hover{background:rgba(168,85,247,0.12);border-color:var(--accent-purple);color:var(--accent-purple);}
        .compare-selectors{display:flex;gap:20px;align-items:center;justify-content:center;flex-wrap:wrap;}.compare-sel{flex:1;min-width:220px;text-align:left;}.compare-sel label{display:block;color:var(--text-secondary);font-size:0.78rem;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}.compare-sel select{width:100%;padding:13px;background:var(--bg-tertiary);border:1px solid var(--border-glow);color:var(--text-primary);border-radius:20px;font-size:0.9rem;cursor:pointer;outline:none;}.compare-sel select:focus{border-color:var(--accent-purple);}
        .compare-vs{font-size:2.5rem;color:var(--accent-red);font-weight:900;}
        .btn{display:inline-flex;align-items:center;gap:8px;padding:14px 30px;border-radius:25px;font-size:0.9rem;font-weight:700;cursor:pointer;border:none;transition:all var(--transition-speed);text-transform:uppercase;letter-spacing:1px;margin-top:20px;}
        .btn-compare{background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff;}.btn-compare:hover{box-shadow:0 6px 25px rgba(168,85,247,0.4);transform:translateY(-2px);}
        .result-area{display:none;}.result-area.active{display:block;animation:fadeInUp 0.4s ease;}
        .cost-diff-banner{background:var(--bg-card);border:1px solid var(--accent-gold);border-left:4px solid var(--accent-gold);border-radius:var(--border-radius);padding:18px 22px;margin-bottom:25px;text-align:center;font-size:1rem;font-weight:600;color:var(--accent-gold);}
        .cost-diff-banner .cost-emoji{font-size:1.5rem;margin:0 6px;}
        .summary-card{background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);padding:22px;margin-bottom:25px;line-height:1.8;color:var(--text-secondary);font-size:0.9rem;text-align:justify;}
        .summary-card strong{color:var(--text-highlight);}
        .summary-card .city-a-color{color:var(--accent-blue);font-weight:700;}
        .summary-card .city-b-color{color:var(--accent-red);font-weight:700;}
        .result-header{display:flex;gap:20px;margin-bottom:25px;}.result-col{flex:1;background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);padding:25px;text-align:center;}.result-col.winner{border-color:var(--accent-gold);box-shadow:0 0 25px rgba(255,215,0,0.2);}.result-col-icon{font-size:3.5rem;}.result-col-name{font-size:1.15rem;font-weight:800;color:var(--text-highlight);}.result-col .win-count{color:var(--accent-green);margin-top:6px;font-weight:600;font-size:0.9rem;}.result-divider{display:flex;align-items:center;font-size:2rem;color:var(--accent-red);font-weight:900;}
        .section-title{color:var(--accent-purple);text-align:center;margin:30px 0 18px;font-size:1.2rem;}
        .compare-table{width:100%;border-collapse:collapse;background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);overflow:hidden;margin-bottom:20px;}
        .compare-table th,.compare-table td{padding:12px 16px;text-align:center;border:1px solid rgba(30,45,61,0.6);font-size:0.85rem;}
        .compare-table thead th{background:var(--bg-tertiary);color:var(--accent-gold);font-weight:700;padding:14px 16px;font-size:0.88rem;}
        .compare-table tbody td{color:var(--text-primary);}
        .compare-table td.better{color:var(--accent-green);font-weight:700;}.compare-table td.better::after{content:' ◀';}
        .compare-table tr:nth-child(even){background:rgba(255,255,255,0.015);}
        .radar-section{background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);padding:25px;margin-bottom:25px;text-align:center;}
        .radar-section h3{color:var(--accent-purple);margin-bottom:15px;}
        .radar-legend{display:flex;gap:30px;justify-content:center;margin-top:8px;font-size:0.85rem;}
        .radar-legend span{display:flex;align-items:center;gap:6px;}
        .radar-legend .legend-dot{width:12px;height:12px;border-radius:50%;display:inline-block;}
        .best-badges-section{background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);padding:25px;margin-bottom:25px;}
        .best-badges-section h3{color:var(--accent-purple);text-align:center;margin-bottom:18px;}
        .badges-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;}
        .badge-item{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg-tertiary);border-radius:20px;font-size:0.8rem;color:var(--text-primary);border:1px solid var(--border-glow);}
        .badge-item .badge-emoji{font-size:1.2rem;}
        .badge-item .badge-city{font-weight:700;color:var(--text-highlight);}
        .badge-item .badge-val{color:var(--text-secondary);font-size:0.72rem;margin-left:auto;}
        .cost-bar-section{background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);padding:25px;margin-bottom:25px;}
        .cost-bar-section h3{color:var(--accent-purple);text-align:center;margin-bottom:18px;}
        .cost-bar-row{display:flex;align-items:center;gap:16px;margin-bottom:12px;}
        .cost-bar-label{width:80px;font-size:0.8rem;color:var(--text-secondary);text-align:right;flex-shrink:0;}
        .cost-bar-track{flex:1;height:22px;background:var(--bg-tertiary);border-radius:11px;overflow:hidden;position:relative;display:flex;}
        .cost-bar-fill-a{height:100%;background:var(--accent-blue);border-radius:11px 0 0 11px;transition:width 1s ease;display:flex;align-items:center;justify-content:center;font-size:0.7rem;color:#fff;font-weight:600;min-width:0;overflow:hidden;white-space:nowrap;}
        .cost-bar-fill-b{height:100%;background:var(--accent-red);border-radius:0 11px 11px 0;transition:width 1s ease;display:flex;align-items:center;justify-content:center;font-size:0.7rem;color:#fff;font-weight:600;min-width:0;overflow:hidden;white-space:nowrap;}
        .bars-section{margin-top:25px;background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);padding:30px;}
        .bars-section h3{color:var(--accent-purple);margin-bottom:20px;text-align:center;}
        .bar-group{display:flex;gap:30px;flex-wrap:wrap;}.bar-col{flex:1;min-width:250px;}.bar-col h5{margin-bottom:12px;font-size:0.95rem;}
        .bar-item{margin-bottom:8px;}.bar-label{display:flex;justify-content:space-between;font-size:0.75rem;color:var(--text-secondary);margin-bottom:3px;}.bar-label .bar-label-val{font-weight:600;color:var(--text-primary);}
        .bar-track{height:6px;background:var(--bg-tertiary);border-radius:3px;overflow:hidden;}.bar-fill{height:100%;border-radius:3px;transition:width 1s ease;}.bar-fill.a{background:var(--accent-blue);}.bar-fill.b{background:var(--accent-red);}
        .save-section{margin-top:25px;text-align:center;}
        .btn-save{display:inline-flex;align-items:center;gap:6px;padding:12px 26px;background:rgba(168,85,247,0.1);border:1px solid rgba(168,85,247,0.3);color:var(--accent-purple);border-radius:25px;font-size:0.85rem;font-weight:600;cursor:pointer;transition:all var(--transition-speed);}
        .btn-save:hover{background:rgba(168,85,247,0.2);box-shadow:0 4px 20px rgba(168,85,247,0.2);}
        .saved-list-section{margin-top:25px;background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);padding:25px;}
        .saved-list-section h3{color:var(--accent-purple);text-align:center;margin-bottom:16px;}
        .saved-list-empty{text-align:center;color:var(--text-secondary);font-size:0.85rem;padding:20px;}
        .saved-item{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--bg-tertiary);border-radius:8px;margin-bottom:8px;gap:12px;flex-wrap:wrap;}

        .saved-item .si-vs{color:var(--accent-red);font-weight:900;margin:0 4px;}
        .saved-item .si-date{font-size:0.72rem;color:var(--text-secondary);}
        .btn-saved-action{padding:6px 14px;border-radius:15px;font-size:0.75rem;cursor:pointer;border:1px solid var(--border-glow);background:var(--bg-card);color:var(--text-primary);font-weight:500;transition:all var(--transition-speed);}
        .btn-saved-action:hover{border-color:var(--accent-purple);color:var(--accent-purple);}
        .btn-saved-action.delete:hover{border-color:var(--accent-red);color:var(--accent-red);}
        .recommend-section{margin-top:25px;background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);padding:25px;}
        .recommend-section h3{color:var(--accent-purple);text-align:center;margin-bottom:16px;}
        .recommend-cols{display:flex;gap:25px;flex-wrap:wrap;}
        .recommend-col{flex:1;min-width:250px;background:var(--bg-tertiary);border-radius:var(--border-radius);padding:20px;text-align:center;border:1px solid var(--border-glow);}
        .recommend-col .rec-label{font-size:0.82rem;color:var(--text-secondary);margin-bottom:4px;}
        .recommend-col .rec-city{font-size:1.2rem;font-weight:800;color:var(--text-highlight);}
        .recommend-col .rec-reason{font-size:0.78rem;color:var(--text-secondary);margin-top:6px;line-height:1.5;}
        .footer{background:var(--bg-secondary);border-top:1px solid var(--border-glow);padding:28px;text-align:center;color:var(--text-secondary);font-size:0.78rem;}
        @keyframes fadeInUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
        @keyframes pulseGold{0%,100%{box-shadow:0 0 15px rgba(255,215,0,0.3);}50%{box-shadow:0 0 35px rgba(255,215,0,0.6);}}
        .result-col.winner{animation:pulseGold 2s ease-in-out infinite;}
        @media(max-width:768px){
            .nav-links{display:none;position:absolute;top:var(--nav-height);left:0;width:100%;background:rgba(10,14,23,0.98);flex-direction:column;padding:20px;z-index:999;}.nav-links.active{display:flex;}
            .mobile-menu-btn{display:flex;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;}
            .result-header{flex-direction:column;}.result-divider{justify-content:center;}
            .compare-selectors{flex-direction:column;}
            .page-header h1{font-size:1.6rem;}.page-header{padding:35px 0;}
            .setup-card{padding:20px;}
            .cost-bar-label{width:55px;font-size:0.7rem;}
            .badges-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));}
            .recommend-cols{flex-direction:column;}
        }
    </style>
</head>

        function populate(){
            const opts='<option value="">-- 选择城市 --</option>'+cities.map(c=>`<option value="${c.id}">${c.flag} ${c.name}</option>`).join('');
            document.getElementById('cityA').innerHTML=opts;
            document.getElementById('cityB').innerHTML=opts;
        }

        function getNumericVal(v){return typeof v==='number'?v:parseFloat(v)||0;}

        const radarDims=['livable','safety','transport','env','edu','medical'];
        const radarLabels={livable:'宜居',safety:'安全',transport:'交通',env:'环境',edu:'教育',medical:'医疗'};

        function buildRadarSVG(a,b){
            const cx=200,cy=200,R=140,levels=5;
            let svg=`<svg viewBox="0 0 400 400" width="380" height="380" xmlns="http://www.w3.org/2000/svg">`;
            // grid
            for(let lv=1;lv<=levels;lv++){
                const r=R*lv/levels;
                let pts=[];
                for(let i=0;i<6;i++){
                    const angle=(i*60-90)*Math.PI/180;
                    pts.push(`${(cx+r*Math.cos(angle)).toFixed(1)},${(cy+r*Math.sin(angle)).toFixed(1)}`);
                }
                svg+=`<polygon points="${pts.join(' ')}" fill="none" stroke="var(--border-glow)" stroke-width="0.8" opacity="0.6"/>`;
            }
            // axes
            for(let i=0;i<6;i++){
                const angle=(i*60-90)*Math.PI/180;
                svg+=`<line x1="${cx}" y1="${cy}" x2="${(cx+R*Math.cos(angle)).toFixed(1)}" y2="${(cy+R*Math.sin(angle)).toFixed(1)}" stroke="var(--border-glow)" stroke-width="0.8" opacity="0.4"/>`;
            }
            // labels
            for(let i=0;i<6;i++){
                const angle=(i*60-90)*Math.PI/180;
                const lx=cx+(R+22)*Math.cos(angle),ly=cy+(R+22)*Math.sin(angle);
                svg+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="central" fill="var(--text-secondary)" font-size="11">${radarLabels[radarDims[i]]}</text>`;
            }
            // data polygon A
            let ptsA=[];
            for(let i=0;i<6;i++){
                const v=Math.max(0,Math.min(100,getNumericVal(a[radarDims[i]])));
                const angle=(i*60-90)*Math.PI/180;
                ptsA.push(`${(cx+R*v/100*Math.cos(angle)).toFixed(1)},${(cy+R*v/100*Math.sin(angle)).toFixed(1)}`);
            }
            svg+=`<polygon points="${ptsA.join(' ')}" fill="var(--accent-blue)" fill-opacity="0.2" stroke="var(--accent-blue)" stroke-width="2.5"/>`;
            for(let i=0;i<6;i++){
                svg+=`<circle cx="${ptsA[i].split(',')[0]}" cy="${ptsA[i].split(',')[1]}" r="4" fill="var(--accent-blue)"/>`;
            }
            // data polygon B
            let ptsB=[];
            for(let i=0;i<6;i++){
                const v=Math.max(0,Math.min(100,getNumericVal(b[radarDims[i]])));
                const angle=(i*60-90)*Math.PI/180;
                ptsB.push(`${(cx+R*v/100*Math.cos(angle)).toFixed(1)},${(cy+R*v/100*Math.sin(angle)).toFixed(1)}`);
            }
            svg+=`<polygon points="${ptsB.join(' ')}" fill="var(--accent-red)" fill-opacity="0.15" stroke="var(--accent-red)" stroke-width="2.5"/>`;
            for(let i=0;i<6;i++){
                svg+=`<circle cx="${ptsB[i].split(',')[0]}" cy="${ptsB[i].split(',')[1]}" r="4" fill="var(--accent-red)"/>`;
            }
            svg+=`</svg>`;
            return svg;
        }

        function buildCostBars(a,b){
            const items=[
                {k:'rentCity',l:'市中心租金(月)',fmt:v=>'$'+v},
                {k:'mealInexpensive',l:'简餐',fmt:v=>'$'+v},
                {k:'coffee',l:'咖啡',fmt:v=>'$'+v},
                {k:'beer',l:'啤酒',fmt:v=>'$'+v}
            ];
            const maxVals={};
            items.forEach(it=>{maxVals[it.k]=Math.max(getNumericVal(a[it.k]),getNumericVal(b[it.k]),1);});
            let html='';
            items.forEach(it=>{
                const va=getNumericVal(a[it.k]),vb=getNumericVal(b[it.k]);
                const total=va+vb||1;
                const pctA=Math.round(va/total*100),pctB=Math.round(vb/total*100);
                html+=`<div class="cost-bar-row"><div class="cost-bar-label">${it.l}</div><div class="cost-bar-track"><div class="cost-bar-fill-a" style="width:${pctA}%;">${it.fmt(va)}</div><div class="cost-bar-fill-b" style="width:${pctB}%;">${it.fmt(vb)}</div></div></div>`;
            });
            return html;
        }

        function findSimilar(me,excludeIds){
            const features=['rating','livable','safety','transport','env','edu','medical','happinessScore','walkability','bikeFriendly','healthcareIndex'];
            const vec=cities.map(c=>features.map(f=>getNumericVal(c[f])/100));
            const meIdx=cities.findIndex(c=>c.id===me.id);
            const meVec=vec[meIdx];
            let bestDist=Infinity,bestIdx=-1;
            for(let i=0;i<cities.length;i++){
                if(i===meIdx||excludeIds.includes(cities[i].id))continue;
                let dist=0;
                for(let j=0;j<features.length;j++)dist+=Math.pow(meVec[j]-vec[i][j],2);
                dist=Math.sqrt(dist);
                if(dist<bestDist){bestDist=dist;bestIdx=i;}
            }
            return bestIdx>=0?cities[bestIdx]:null;
        }

        function buildSummaryText(a,b,aw,bw,totalW){
            const betterA=[],betterB=[];
            const allKeys=[
                {k:'livable',l:'宜居指数',h:true},{k:'safety',l:'安全指数',h:true},
                {k:'transport',l:'交通指数',h:true},{k:'env',l:'环境指数',h:true},
                {k:'edu',l:'教育指数',h:true},{k:'medical',l:'医疗指数',h:true},
                {k:'happinessScore',l:'幸福指数',h:true},{k:'walkability',l:'步行友好度',h:true},
                {k:'healthcareIndex',l:'医疗水平',h:true},{k:'rating',l:'综合评分',h:true}
            ];
            allKeys.forEach(k=>{
                const va=getNumericVal(a[k.k]),vb=getNumericVal(b[k.k]);
                if(k.h){if(va>vb)betterA.push(k.l);else if(vb>va)betterB.push(k.l);}
            });
            const winnerName=aw>bw?a.name:b.name;
            const topA=betterA.slice(0,4).join('、'),topB=betterB.slice(0,4).join('、');
            let txt=`<strong>${a.flag} <span class="city-a-color">${a.name}</span></strong> 在 <strong>${topA||'整体均衡性'}</strong> 方面表现突出，`;
            txt+=`而 <strong>${b.flag} <span class="city-b-color">${b.name}</span></strong> 在 <strong>${topB||'综合体验'}</strong> 方面更占优势。`;
            txt+=`在 ${totalW} 项核心指标中，<strong>${winnerName}</strong> 以 ${Math.max(aw,bw)} 项领先，`;
            txt+=`${aw===bw?'两座城市旗鼓相当，各有千秋。':(aw>bw?'展现出更全面的城市竞争力。':'在多项关键指标上表现更佳。')}`;
            txt+=` ${a.name}综合评分 ${a.rating}，${b.name}综合评分 ${b.rating}。`;
            if(a.costOfLiving&&b.costOfLiving){
                const diff=Math.round((a.costOfLiving/b.costOfLiving-1)*100);
                txt+=`生活成本方面，${a.name}比${b.name}${diff>0?`高出约${Math.abs(diff)}%`:`低约${Math.abs(diff)}%`}。`;
            }
            return txt;
        }

        function buildBadges(a,b,allKeys){
            let html='';
            allKeys.forEach(k=>{
                const va=getNumericVal(a[k.k]),vb=getNumericVal(b[k.k]);
                let winner=null,wval=null;
                if(k.h){if(va>vb){winner=a;wval=va;}else if(vb>va){winner=b;wval=vb;}}
                else{if(va<vb){winner=a;wval=va;}else if(vb<va){winner=b;wval=vb;}}
                if(!winner)return;
                html+=`<div class="badge-item"><span class="badge-emoji">${k.emoji||'⭐'}</span><span class="badge-city">${winner.flag} ${winner.name}</span><span class="badge-val">${k.l} ${wval}</span></div>`;
            });
            return html;
        }

        function compare(){
            const ia=document.getElementById('cityA').value,ib=document.getElementById('cityB').value;
            if(!ia||!ib){alert('请选择两座城市');return;}
            if(ia===ib){alert('请选择不同的城市进行对比');return;}
            const a=cities.find(c=>c.id===ia),b=cities.find(c=>c.id===ib);

            const keysUpper=[
                {k:'rating',l:'综合评分',h:true,emoji:'⭐'},{k:'livable',l:'宜居指数',h:true,emoji:'🏡'},
                {k:'safety',l:'安全指数',h:true,emoji:'🛡️'},{k:'costOfLiving',l:'生活成本',h:false,emoji:'💰'},
                {k:'transport',l:'交通指数',h:true,emoji:'🚇'},{k:'env',l:'环境指数',h:true,emoji:'🌿'},
                {k:'edu',l:'教育指数',h:true,emoji:'📚'},{k:'medical',l:'医疗指数',h:true,emoji:'🏥'},
                {k:'happinessScore',l:'幸福指数',h:true,emoji:'😊'},{k:'walkability',l:'步行友好',h:true,emoji:'🚶'},
                {k:'bikeFriendly',l:'自行车友好',h:true,emoji:'🚲'},{k:'internetSpeed',l:'网速(Mbps)',h:true,emoji:'📶'},
                {k:'healthcareIndex',l:'医疗水平',h:true,emoji:'💊'},{k:'unemployment',l:'失业率(%)',h:false,emoji:'📉'},
                {k:'crimeIndex',l:'犯罪指数',h:false,emoji:'🚨'},{k:'pollutionIndex',l:'污染指数',h:false,emoji:'🏭'},
                {k:'greenSpace',l:'绿地占比(%)',h:true,emoji:'🌳'},{k:'annualTourists',l:'年游客(百万)',h:true,emoji:'📸'}
            ];
            const displayKeys=[
                {k:'population',l:'人口'},{k:'gdp',l:'GDP'},{k:'metro',l:'地铁线路'},{k:'area',l:'面积'}
            ];

            let aw=0,bw=0;
            const rows=keysUpper.map(k=>{
                const va=getNumericVal(a[k.k]),vb=getNumericVal(b[k.k]);
                let ab=false,bb=false;
                if(k.h){if(va>vb){aw++;ab=true;}else if(vb>va){bw++;bb=true;}}
                else{if(va<vb){aw++;ab=true;}else if(vb<va){bw++;bb=true;}}
                return `<tr><th>${k.l}</th><td class="${ab?'better':''}">${va}</td><td class="${bb?'better':''}">${vb}</td></tr>`;
            }).join('');

            const displayRows=displayKeys.map(k=>{
                return `<tr><th>${k.l}</th><td>${a[k.k]||'-'}</td><td>${b[k.k]||'-'}</td></tr>`;
            }).join('');

            const totalW=aw+bw;

            // cost difference
            let costDiffHTML='';
            if(a.costOfLiving&&b.costOfLiving){
                const diff=Math.round((a.costOfLiving/b.costOfLiving-1)*100);
                if(diff!==0){
                    const moreExpensive=diff>0?a:b;
                    const lessExpensive=diff>0?b:a;
                    costDiffHTML=`<div class="cost-diff-banner"><span class="cost-emoji">💸</span><strong>${moreExpensive.flag} ${moreExpensive.name}</strong> 的生活成本比 <strong>${lessExpensive.flag} ${lessExpensive.name}</strong> 高约 <strong>${Math.abs(diff)}%</strong><span class="cost-emoji">💸</span></div>`;
                }else{
                    costDiffHTML=`<div class="cost-diff-banner"><span class="cost-emoji">⚖️</span>两座城市的生活成本大致相当<span class="cost-emoji">⚖️</span></div>`;
                }
            }

            // summary text
            const summaryHTML=`<div class="summary-card">${buildSummaryText(a,b,aw,bw,totalW)}</div>`;

            // radar
            const radarHTML=`<div class="radar-section"><h3>📡 六维雷达对比</h3>${buildRadarSVG(a,b)}<div class="radar-legend"><span><span class="legend-dot" style="background:var(--accent-blue);"></span> ${a.flag} ${a.name}</span><span><span class="legend-dot" style="background:var(--accent-red);"></span> ${b.flag} ${b.name}</span></div></div>`;

            // badges
            const badgesHTML=`<div class="best-badges-section"><h3>🏆 各指标最佳</h3><div class="badges-grid">${buildBadges(a,b,keysUpper)}</div></div>`;

            // cost bars
            const costBarsHTML=`<div class="cost-bar-section"><h3>💵 生活成本细分对比</h3>${buildCostBars(a,b)}<div style="text-align:center;margin-top:10px;font-size:0.75rem;color:var(--text-secondary);"><span style="color:var(--accent-blue);">■</span> ${a.name} &nbsp;&nbsp; <span style="color:var(--accent-red);">■</span> ${b.name}</div></div>`;

            // bars section (expanded)
            const barKeys=[{k:'rating',l:'综合评分'},{k:'livable',l:'宜居指数'},{k:'safety',l:'安全指数'},{k:'transport',l:'交通指数'},{k:'env',l:'环境指数'},{k:'edu',l:'教育指数'},{k:'medical',l:'医疗指数'},{k:'walkability',l:'步行友好'},{k:'bikeFriendly',l:'自行车友好'},{k:'healthcareIndex',l:'医疗水平'},{k:'happinessScore',l:'幸福指数'},{k:'internetSpeed',l:'网速(Mbps)'}];
            const barsA=barKeys.map(k=>`<div class="bar-item"><div class="bar-label"><span>${k.l}</span><span class="bar-label-val">${getNumericVal(a[k.k])}</span></div><div class="bar-track"><div class="bar-fill a" style="width:${Math.min(100,getNumericVal(a[k.k])||0)}%;"></div></div></div>`).join('');
            const barsB=barKeys.map(k=>`<div class="bar-item"><div class="bar-label"><span>${k.l}</span><span class="bar-label-val">${getNumericVal(b[k.k])}</span></div><div class="bar-track"><div class="bar-fill b" style="width:${Math.min(100,getNumericVal(b[k.k])||0)}%;"></div></div></div>`).join('');
            const barsHTML=`<div class="bars-section"><h3>📊 可视化对比</h3><div class="bar-group"><div class="bar-col"><h5 style="color:var(--accent-blue);">${a.flag} ${a.name}</h5>${barsA}</div><div class="bar-col"><h5 style="color:var(--accent-red);">${b.flag} ${b.name}</h5>${barsB}</div></div></div>`;

            // recommendations
            const simA=findSimilar(a,[a.id,b.id]);
            const simB=findSimilar(b,[a.id,b.id]);
            let recHTML='';
            if(simA||simB){
                recHTML=`<div class="recommend-section"><h3>💡 如果你喜欢...</h3><div class="recommend-cols">`;
                if(simA)recHTML+=`<div class="recommend-col"><div class="rec-label">如果你喜欢 ${a.flag} ${a.name}</div><div class="rec-city">${simA.flag} ${simA.icon} ${simA.name}</div><div class="rec-reason">${simA.name} 在宜居(${simA.livable})、安全(${simA.safety})等维度与 ${a.name} 高度相似，可能也会是你的理想之城。</div></div>`;
                if(simB)recHTML+=`<div class="recommend-col"><div class="rec-label">如果你喜欢 ${b.flag} ${b.name}</div><div class="rec-city">${simB.flag} ${simB.icon} ${simB.name}</div><div class="rec-reason">${simB.name} 在综合评分(${simB.rating})、交通(${simB.transport})等方面与 ${b.name} 相近，值得探索。</div></div>`;
                recHTML+=`</div></div>`;
            }

            // save button
            const saveHTML=`<div class="save-section"><button class="btn-save" onclick="saveComparison('${a.id}','${b.id}',${aw},${bw})">💾 保存此次对比</button></div>`;

            document.getElementById('resultArea').innerHTML=
                `<!-- COST DIFF -->${costDiffHTML}
                <!-- SUMMARY -->${summaryHTML}
                <!-- HEADER --><div class="result-header">
                    <div class="result-col ${aw>bw?'winner':''}"><span class="result-col-icon">${a.icon}</span><div class="result-col-name">${a.flag} ${a.name}</div><div class="win-count">优势: ${aw}项</div></div>
                    <div class="result-divider">⚡</div>
                    <div class="result-col ${bw>aw?'winner':''}"><span class="result-col-icon">${b.icon}</span><div class="result-col-name">${b.flag} ${b.name}</div><div class="win-count">优势: ${bw}项</div></div>
                </div>
                <!-- RADAR -->${radarHTML}
                <!-- TABLE --><h3 class="section-title">📋 详细指标对比</h3>
                <table class="compare-table"><thead><tr><th>指标</th><th>${a.name}</th><th>${b.name}</th></tr></thead><tbody>${rows}${displayRows}</tbody></table>
                <!-- BADGES -->${badgesHTML}
                <!-- COST BARS -->${costBarsHTML}
                <!-- BARS -->${barsHTML}
                <!-- RECOMMEND -->${recHTML}
                <!-- SAVE -->${saveHTML}`;
            document.getElementById('resultArea').classList.add('active');
            document.getElementById('resultArea').scrollIntoView({behavior:'smooth'});
        }

        function saveComparison(idA,idB,aw,bw){
            const a=cities.find(c=>c.id===idA),b=cities.find(c=>c.id===idB);
            if(!a||!b)return;
            let saved=JSON.parse(localStorage.getItem('citylens-compares')||'[]');
            saved.unshift({
                idA:a.id,idB:b.id,nameA:a.name,nameB:b.name,flagA:a.flag,flagB:b.flag,
                aw,bw,date:new Date().toLocaleString('zh-CN')
            });
            if(saved.length>20)saved=saved.slice(0,20);
            localStorage.setItem('citylens-compares',JSON.stringify(saved));
            renderSaved();
            alert('对比已保存！');
        }

        function deleteSaved(idx){
            let saved=JSON.parse(localStorage.getItem('citylens-compares')||'[]');
            saved.splice(idx,1);
            localStorage.setItem('citylens-compares',JSON.stringify(saved));
            renderSaved();
        }

        function loadSaved(idA,idB){
            document.getElementById('cityA').value=idA;
            document.getElementById('cityB').value=idB;
            compare();
            window.scrollTo({top:0,behavior:'smooth'});
        }

        function renderSaved(){
            const saved=JSON.parse(localStorage.getItem('citylens-compares')||'[]');
            const el=document.getElementById('savedList');
            if(!saved.length){
                el.innerHTML='<div class="saved-list-empty">暂无保存的对比记录，进行一次对比后可以保存到这里 📋</div>';
                return;
            }
            el.innerHTML=saved.map((s,i)=>`
                <div class="saved-item">
                    <div class="si-cities"><span>${s.flagA} ${s.nameA}</span><span class="si-vs">VS</span><span>${s.flagB} ${s.nameB}</span></div>
                    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                        <span class="si-date">${s.date}</span>
                        <button class="btn-saved-action" onclick="loadSaved('${s.idA}','${s.idB}')">🔍 重新对比</button>
                        <button class="btn-saved-action delete" onclick="deleteSaved(${i})">🗑️ 删除</button>
                    </div>
                </div>
            `).join('');
        }

        // Event listeners
        document.getElementById('btnCompare').addEventListener('click',compare);

        document.querySelectorAll('.btn-preset').forEach(btn=>{
            btn.addEventListener('click',function(){
                document.getElementById('cityA').value=this.dataset.a;
                document.getElementById('cityB').value=this.dataset.b;
                compare();
            });
        });

        const navbar=document.getElementById('navbar');
        window.addEventListener('scroll',()=>navbar.classList.toggle('scrolled',window.scrollY>50));
        document.getElementById('mobileMenuBtn').addEventListener('click',()=>document.getElementById('navLinks').classList.toggle('active'));
        document.querySelectorAll('#navLinks a').forEach(l=>l.addEventListener('click',()=>document.getElementById('navLinks').classList.remove('active')));

        const bt=document.getElementById('btnThemeToggle'),s=localStorage.getItem('citylens-theme');
        if(s==='light'){document.body.classList.add('light-mode');bt.textContent='◑';}
        bt.addEventListener('click',()=>{
            document.body.classList.toggle('light-mode');
            bt.textContent=document.body.classList.contains('light-mode')?'◑':'◐';
            localStorage.setItem('citylens-theme',document.body.classList.contains('light-mode')?'light':'dark');
        });

        populate();
        renderSaved();
        console.log('%c⚖️ 城市对比已就绪','color:#a855f7;');
        console.log('%c32城市 | 18+指标 | 雷达图 | 成本对比 | 智能推荐','color:#00d4ff;');
        /* ===== CityLens Compare Page v2.0 | 32 cities | Radar + Cost + Badges + Save + Recommend ===== */
    </script>

</body>
</html>
