<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>性能对比 - AutoHub</title>
    <style>
        :root {
            --bg-primary:#0a0e14;--bg-secondary:#11161d;--bg-tertiary:#1a1f2b;--bg-card:#141a23;
            --text-primary:#c9d1d9;--text-secondary:#8b949e;--text-highlight:#f0f6fc;
            --accent-blue:#4a9eff;--accent-cyan:#00d4ff;--accent-green:#00ff88;--accent-red:#ff4757;
            --accent-gold:#ffd700;--accent-purple:#a855f7;--border-glow:#1e2d3d;
            --shadow-card:0 4px 25px rgba(0,0,0,0.6);--shadow-hover:0 8px 40px rgba(168,85,247,0.2);
            --border-radius:8px;--transition-speed:0.3s;--nav-height:72px;--max-width:1400px;
        }
        body.light-mode{--bg-primary:#f0f2f5;--bg-secondary:#ffffff;--bg-tertiary:#e4e6eb;--bg-card:#ffffff;--text-primary:#1a1a2e;--text-secondary:#5a6c7d;--text-highlight:#0a0a0a;--border-glow:#d0d5dd;--shadow-card:0 4px 20px rgba(0,0,0,0.08);}
        *{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;font-size:16px;}
        body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;background-color:var(--bg-primary);color:var(--text-primary);line-height:1.6;transition:background-color var(--transition-speed),color var(--transition-speed);overflow-x:hidden;}
        ::-webkit-scrollbar{width:8px;}::-webkit-scrollbar-track{background:var(--bg-secondary);}::-webkit-scrollbar-thumb{background:var(--border-glow);border-radius:4px;}
        .navbar{position:fixed;top:0;left:0;width:100%;height:var(--nav-height);background:rgba(10,14,20,0.88);backdrop-filter:blur(20px);border-bottom:1px solid rgba(74,158,255,0.1);z-index:1000;}.navbar.scrolled{box-shadow:0 4px 30px rgba(0,0,0,0.7);}
        .navbar .container{max-width:var(--max-width);margin:0 auto;padding:0 30px;height:100%;display:flex;align-items:center;justify-content:space-between;}
        .logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text-highlight);font-size:1.5rem;font-weight:800;}.logo-icon{width:42px;height:42px;background:linear-gradient(135deg,#a855f7,#4a9eff);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;color:#fff;}.logo-text{background:linear-gradient(135deg,#4a9eff,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .nav-links{display:flex;list-style:none;gap:2px;}.nav-links li a{display:block;padding:10px 16px;color:var(--text-secondary);text-decoration:none;border-radius:6px;transition:all var(--transition-speed);font-size:0.88rem;font-weight:500;position:relative;}.nav-links li a::after{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%) scaleX(0);width:50%;height:2px;background:var(--accent-purple);transition:transform var(--transition-speed);}.nav-links li a:hover,.nav-links li a.active{color:var(--text-highlight);background:rgba(168,85,247,0.06);}.nav-links li a:hover::after,.nav-links li a.active::after{transform:translateX(-50%) scaleX(1);}
        .nav-actions{display:flex;gap:8px;}.btn-icon{width:38px;height:38px;border:1px solid rgba(168,85,247,0.15);background:rgba(168,85,247,0.03);color:var(--text-secondary);border-radius:8px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;}.btn-icon:hover{background:rgba(168,85,247,0.1);border-color:var(--accent-purple);color:var(--accent-purple);}
        .mobile-menu-btn{display:none;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;}.mobile-menu-btn span{display:block;width:24px;height:2px;background:var(--accent-purple);}
        .page-header{margin-top:var(--nav-height);background:linear-gradient(160deg,#0a0e14 0%,#140d1a 30%,#0a0e14 100%);padding:55px 0;text-align:center;border-bottom:1px solid var(--border-glow);}.page-header h1{font-size:2.3rem;font-weight:900;color:var(--text-highlight);}.page-header .breadcrumb{color:var(--text-secondary);}.page-header .breadcrumb a{color:var(--accent-purple);text-decoration:none;}
        .main-content{padding:40px 0 70px;}.container{max-width:var(--max-width);margin:0 auto;padding:0 30px;}
        .setup-card{background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);padding:35px;margin-bottom:30px;text-align:center;}.setup-card h2{color:var(--accent-purple);margin-bottom:25px;}
        .compare-selectors{display:flex;gap:20px;align-items:center;justify-content:center;flex-wrap:wrap;}.compare-select{flex:1;min-width:220px;text-align:left;}.compare-select label{display:block;color:var(--text-secondary);font-size:0.78rem;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
        .compare-select select{width:100%;padding:13px;background:var(--bg-tertiary);border:1px solid var(--border-glow);color:var(--text-primary);border-radius:6px;font-size:0.9rem;cursor:pointer;outline:none;}.compare-select select:focus{border-color:var(--accent-purple);}
        .compare-vs{font-size:2.5rem;color:var(--accent-red);font-weight:900;}.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 30px;border-radius:6px;font-size:0.9rem;font-weight:700;cursor:pointer;border:none;transition:all var(--transition-speed);text-transform:uppercase;letter-spacing:1px;margin-top:20px;}
        .btn-compare{background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff;}.btn-compare:hover{box-shadow:0 6px 25px rgba(168,85,247,0.4);transform:translateY(-2px);}
        .result-area{display:none;}.result-area.active{display:block;animation:fadeInUp 0.4s ease;}
        .result-header{display:flex;gap:20px;margin-bottom:25px;}.result-col{flex:1;background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);padding:25px;text-align:center;}.result-col.winner{border-color:var(--accent-gold);box-shadow:0 0 25px rgba(255,215,0,0.2);}.result-col-icon{font-size:3.5rem;}.result-col-name{font-size:1.15rem;font-weight:800;color:var(--text-highlight);}.result-col-brand{color:var(--accent-purple);font-size:0.82rem;}.result-divider{display:flex;align-items:center;font-size:2rem;color:var(--accent-red);font-weight:900;}
        .compare-table{width:100%;border-collapse:collapse;background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);overflow:hidden;}.compare-table th,.compare-table td{padding:14px 18px;text-align:center;border:1px solid var(--border-glow);font-size:0.88rem;}.compare-table th{background:var(--bg-tertiary);color:var(--accent-gold);text-transform:uppercase;letter-spacing:1px;}.compare-table td{color:var(--text-primary);}.compare-table td.better{color:var(--accent-green);font-weight:700;}.compare-table td.better::after{content:' ◀';}
        .radar-section{margin-top:30px;background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);padding:30px;text-align:center;}.radar-section h3{color:var(--accent-purple);margin-bottom:20px;}
        .radar-visual{display:flex;justify-content:center;gap:40px;flex-wrap:wrap;}.radar-bar-group{width:300px;}.radar-bar{margin-bottom:10px;}.radar-bar-label{display:flex;justify-content:space-between;font-size:0.78rem;color:var(--text-secondary);margin-bottom:3px;}.radar-bar-track{height:6px;background:var(--bg-tertiary);border-radius:3px;overflow:hidden;}.radar-bar-fill{height:100%;border-radius:3px;transition:width 1s ease;}.radar-bar-fill.a{background:var(--accent-blue);}.radar-bar-fill.b{background:var(--accent-red);}
        .footer{background:var(--bg-secondary);border-top:1px solid var(--border-glow);padding:28px;text-align:center;color:var(--text-secondary);font-size:0.78rem;}
        .back-to-top{position:fixed;bottom:28px;right:28px;width:44px;height:44px;background:rgba(168,85,247,0.1);border:1.5px solid rgba(168,85,247,0.3);color:var(--accent-purple);border-radius:10px;cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all var(--transition-speed);z-index:999;}.back-to-top.visible{opacity:1;visibility:visible;}.back-to-top:hover{background:var(--accent-purple);color:#fff;}
        @keyframes fadeInUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
        /* === Spec Highlight Cards === */
        .spec-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:30px;}
        .spec-card{background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);padding:22px 18px;text-align:center;transition:all var(--transition-speed);cursor:default;position:relative;overflow:hidden;}
        .spec-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--spec-color,var(--accent-purple));opacity:0.7;}
        .spec-card:hover{border-color:var(--spec-color,var(--accent-purple));box-shadow:var(--shadow-hover);transform:translateY(-2px);}
        .spec-card-icon{font-size:2rem;margin-bottom:6px;}
        .spec-card-value{font-size:1.8rem;font-weight:900;color:var(--text-highlight);line-height:1.2;}
        .spec-card-label{font-size:0.75rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;}
        .spec-card-car{font-size:0.78rem;color:var(--spec-color,var(--accent-purple));font-weight:600;margin-top:4px;}
        /* === SVG Radar Chart === */
        .radar-svg-wrap{display:flex;justify-content:center;align-items:center;gap:30px;flex-wrap:wrap;margin-top:10px;}
        .radar-svg-wrap svg{max-width:340px;width:100%;}
        .radar-legend{display:flex;flex-direction:column;gap:10px;font-size:0.82rem;color:var(--text-secondary);}
        .radar-legend-item{display:flex;align-items:center;gap:8px;}
        .radar-legend-dot{width:12px;height:12px;border-radius:50%;}
        /* === Best in Class Badge === */
        .badge-best{display:inline-block;margin-left:6px;padding:2px 8px;background:rgba(255,215,0,0.18);color:var(--accent-gold);font-size:0.65rem;font-weight:700;border-radius:10px;border:1px solid rgba(255,215,0,0.3);vertical-align:middle;line-height:1.4;}
        /* === Share Area === */
        .share-area{margin-top:20px;display:none;flex-direction:column;align-items:center;gap:10px;padding:16px;background:var(--bg-tertiary);border-radius:var(--border-radius);}
        .share-area.active{display:flex;}
        .share-url{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;}
        .share-url input{flex:1;min-width:260px;padding:10px 14px;background:var(--bg-secondary);border:1px solid var(--border-glow);color:var(--text-primary);border-radius:6px;font-size:0.78rem;outline:none;font-family:monospace;}
        .share-url input:focus{border-color:var(--accent-purple);}
        .btn-sm{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;border-radius:6px;font-size:0.75rem;font-weight:600;cursor:pointer;border:none;transition:all var(--transition-speed);text-transform:uppercase;letter-spacing:0.5px;}
        .btn-sm.copy{background:var(--accent-cyan);color:#000;}
        .btn-sm.copy:hover{box-shadow:0 4px 15px rgba(0,212,255,0.35);}
        .btn-sm.save{background:var(--accent-green);color:#000;}
        .btn-sm.save:hover{box-shadow:0 4px 15px rgba(0,255,136,0.35);}
        .btn-sm.clear{background:var(--accent-red);color:#fff;}
        .btn-sm.clear:hover{box-shadow:0 4px 15px rgba(255,71,87,0.35);}
        /* === History Section === */
        .history-section{margin-top:35px;background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);padding:28px;}
        .history-section h3{color:var(--accent-purple);margin-bottom:18px;display:flex;align-items:center;gap:8px;}
        .history-list{display:flex;flex-direction:column;gap:10px;}
        .history-item{display:flex;align-items:center;gap:14px;padding:12px 16px;background:var(--bg-tertiary);border-radius:6px;border:1px solid transparent;transition:all var(--transition-speed);flex-wrap:wrap;}
        .history-item:hover{border-color:var(--accent-purple);}
        .history-item-date{font-size:0.72rem;color:var(--text-secondary);white-space:nowrap;}
        .history-item-cars{flex:1;font-size:0.85rem;color:var(--text-primary);font-weight:600;min-width:180px;}
        .history-item-cars span{color:var(--accent-red);margin:0 6px;}
        .history-item-winner{font-size:0.75rem;color:var(--accent-gold);white-space:nowrap;font-weight:700;}
        .history-item-del{width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,71,87,0.25);background:transparent;color:var(--accent-red);cursor:pointer;font-size:0.7rem;display:flex;align-items:center;justify-content:center;transition:all var(--transition-speed);}
        .history-item-del:hover{background:var(--accent-red);color:#fff;border-color:var(--accent-red);}
        .history-empty{text-align:center;color:var(--text-secondary);font-size:0.82rem;padding:16px;}
        /* === Expanded Table Wrapper === */
        .table-wrap{overflow-x:auto;margin-top:20px;border-radius:var(--border-radius);}
        .table-wrap .compare-table{min-width:700px;}
        .compare-table th.cat-header{background:var(--bg-secondary);color:var(--accent-purple);font-size:0.72rem;letter-spacing:2px;text-align:left;padding:10px 18px;}
        /* === Setup Actions Row === */
        .setup-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
        /* === Responsive === */
        @media(max-width:768px){
            .nav-links{display:none;position:absolute;top:var(--nav-height);left:0;width:100%;background:rgba(10,14,20,0.98);flex-direction:column;padding:20px;z-index:999;}.nav-links.active{display:flex;}.mobile-menu-btn{display:flex;}
            .result-header{flex-direction:column;}.result-divider{justify-content:center;}
            .compare-selectors{flex-direction:column;}.compare-vs{text-align:center;}
            .spec-cards{grid-template-columns:repeat(2,1fr);}
            .radar-legend{flex-direction:row;flex-wrap:wrap;justify-content:center;}
            .share-url{flex-direction:column;}
            .share-url input{min-width:100%;}
            .history-item{flex-direction:column;align-items:flex-start;gap:6px;}
        }
        @media(max-width:480px){.spec-cards{grid-template-columns:1fr;}}
    </style>
</head>

        // === Spec Highlight Cards ===
        function renderSpecCards(){
            var bestAccel=allCars.reduce(function(a,b){return a.accel<b.accel?a:b;});

            var lightest=allCars.reduce(function(a,b){return a.weight<b.weight?a:b;});
            var mostHP=allCars.reduce(function(a,b){return a.hp>b.hp?a:b;});
            var bestValue=allCars.filter(function(c){return c.price;}).reduce(function(a,b){return (a.hp/a.price)>(b.hp/b.price)?a:b;});
            var cards=[

                {icon:'💪',label:'最强马力',value:mostHP.hp+'hp',car:mostHP.name+' '+mostHP.brand,color:'var(--accent-gold)'},
                {icon:'💰',label:'最佳性价比',value:(bestValue.hp/bestValue.price).toFixed(2)+' hp/$',car:bestValue.name+' '+bestValue.brand,color:'var(--accent-purple)'}
            ];

                return '<div class="spec-card" style="--spec-color:'+c.color+'"><div class="spec-card-icon">'+c.icon+'</div><div class="spec-card-label">'+c.label+'</div><div class="spec-card-value">'+c.value+'</div><div class="spec-card-car">'+c.car+'</div></div>';
            }).join('');
        }

        // === Global min/max for normalization ===
        function getMetricRange(key){
            var vals=allCars.map(function(c){return c[key]||0;});
            return {min:Math.min.apply(null,vals),max:Math.max.apply(null,vals)};
        }

        // === SVG Radar Chart ===
        function drawRadarSVG(carA,carB){
            var metrics=[
                {key:'hp',label:'马力',higher:true},
                {key:'accel',label:'加速',higher:false},
                {key:'topSpeed',label:'极速',higher:true},
                {key:'range',label:'续航',higher:true},
                {key:'weight',label:'轻量',higher:false},
                {key:'price',label:'价值',higher:false}
            ];
            var ranges={};
            metrics.forEach(function(m){
                var vals=allCars.map(function(c){return c[m.key]||0;});
                ranges[m.key]={min:Math.min.apply(null,vals),max:Math.max.apply(null,vals)};
            });
            var cx=150,cy=150,r=120,n=metrics.length;
            var grid='';
            for(var lvl=1;lvl<=5;lvl++){
                var pts='';
                for(var i=0;i<n;i++){
                    var ang=-Math.PI/2+(2*Math.PI/n)*i;
                    var d=r*lvl/5;
                    pts+=(cx+d*Math.cos(ang)).toFixed(1)+','+(cy+d*Math.sin(ang)).toFixed(1)+' ';
                }
                grid+='<polygon points="'+pts.trim()+'" fill="none" stroke="var(--border-glow)" stroke-width="0.6" opacity="0.5"/>';
            }
            var axes='',labels='';
            for(var i=0;i<n;i++){
                var ang=-Math.PI/2+(2*Math.PI/n)*i;
                var ex=cx+r*Math.cos(ang),ey=cy+r*Math.sin(ang);
                axes+='<line x1="'+cx+'" y1="'+cy+'" x2="'+ex.toFixed(1)+'" y2="'+ey.toFixed(1)+'" stroke="var(--border-glow)" stroke-width="0.8"/>';
                var lx=cx+(r+22)*Math.cos(ang),ly=cy+(r+22)*Math.sin(ang);
                labels+='<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="middle" dominant-baseline="middle" fill="var(--text-secondary)" font-size="10" font-weight="600">'+metrics[i].label+'</text>';
            }
            function getPts(car){
                var pts='';
                for(var i=0;i<n;i++){
                    var m=metrics[i];
                    var val=car[m.key]||0;
                    var rg=ranges[m.key];
                    var norm=0;
                    if(rg.max>rg.min){
                        if(m.higher){norm=(val-rg.min)/(rg.max-rg.min)*100;}
                        else{norm=(1-(val-rg.min)/(rg.max-rg.min))*100;}
                    }
                    norm=Math.max(0,Math.min(100,norm));
                    var ang=-Math.PI/2+(2*Math.PI/n)*i;
                    var dist=r*norm/100;
                    pts+=(cx+dist*Math.cos(ang)).toFixed(1)+','+(cy+dist*Math.sin(ang)).toFixed(1)+' ';
                }
                return pts.trim();
            }
            var ptsA=getPts(carA),ptsB=getPts(carB);
            return '<svg viewBox="0 0 300 300" style="max-width:340px;width:100%;">'+grid+axes+labels+'<polygon points="'+ptsA+'" fill="rgba(74,158,255,0.22)" stroke="var(--accent-blue)" stroke-width="2"/><polygon points="'+ptsB+'" fill="rgba(255,71,87,0.22)" stroke="var(--accent-red)" stroke-width="2"/></svg>';
        }

        // === All comparison fields (expanded) ===
        function getAllCompareFields(a,b){
            var fields=[
                {key:'hp',label:'马力',unit:'hp',higher:true,cat:'性能参数'},
                {key:'torque',label:'扭矩',unit:'',higher:true,cat:'性能参数'},
                {key:'accel',label:'0-100km/h',unit:'s',higher:false,cat:'性能参数'},
                {key:'topSpeed',label:'最高速度',unit:'km/h',higher:true,cat:'性能参数'},
                {key:'engine',label:'发动机',unit:'',higher:null,cat:'动力系统'},
                {key:'displacement',label:'排量',unit:'',higher:null,cat:'动力系统'},
                {key:'cylinders',label:'气缸数',unit:'',higher:true,cat:'动力系统'},
                {key:'drivetrain',label:'驱动方式',unit:'',higher:null,cat:'动力系统'},
                {key:'transmission',label:'变速箱',unit:'',higher:null,cat:'动力系统'},
                {key:'fuelEconomy',label:'油耗',unit:'',higher:true,cat:'能耗环保'},
                {key:'co2',label:'CO2排放',unit:'',higher:false,cat:'能耗环保'},
                {key:'weight',label:'车重',unit:'kg',higher:false,cat:'尺寸重量'},
                {key:'length',label:'车身长度',unit:'',higher:null,cat:'尺寸重量'},
                {key:'width',label:'车身宽度',unit:'',higher:null,cat:'尺寸重量'},
                {key:'height',label:'车身高度',unit:'',higher:null,cat:'尺寸重量'},
                {key:'groundClearance',label:'离地间隙',unit:'',higher:null,cat:'尺寸重量'},
                {key:'cargoVolume',label:'后备箱容积',unit:'',higher:true,cat:'实用信息'},
                {key:'seating',label:'座位数',unit:'座',higher:true,cat:'实用信息'},
                {key:'warranty',label:'质保',unit:'',higher:null,cat:'实用信息'},
                {key:'price',label:'价格',unit:'USD',higher:false,cat:'价格'}
            ];
            return fields.filter(function(f){
                var va=a[f.key],vb=b[f.key];
                return !(va===undefined||va===null)||!(vb===undefined||vb===null);
            });
        }

        // === Format value for display ===
        function fmtVal(val,unit){
            if(val===null||val===undefined)return 'N/A';
            if(unit==='USD')return '$'+val.toLocaleString();
            return val+(unit?(' '+unit):'');
        }

        // === Run Comparison ===
        function runCompare(){
            var idA=document.getElementById('carA').value;
            var idB=document.getElementById('carB').value;
            if(!idA||!idB){alert('请选择两款车型');return;}
            if(idA===idB){alert('请选择不同的车型');return;}
            var a=allCars.find(function(c){return c.id===idA;});
            var b=allCars.find(function(c){return c.id===idB;});
            if(!a||!b)return;

            var fields=getAllCompareFields(a,b);
            var aWins=0,bWins=0;

            // Count wins on numeric comparable fields
            fields.forEach(function(f){
                if(f.higher===null)return;
                var va=a[f.key],vb=b[f.key];
                if(va===null||va===undefined||vb===null||vb===undefined)return;
                if(typeof va==='string'||typeof vb==='string')return;
                if(f.higher){if(va>vb)aWins++;else if(vb>va)bWins++;}
                else{if(va<vb)aWins++;else if(vb<va)bWins++;}
            });

            var lastCat='';
            var rows=fields.map(function(f){
                var va=a[f.key],vb=b[f.key];
                var aBetter=false,bBetter=false;
                var catRow='';
                if(f.cat!==lastCat){
                    catRow='<tr><th class="cat-header" colspan="3">'+f.cat+'</th></tr>';
                    lastCat=f.cat;
                }
                if(f.higher!==null&&va!==null&&va!==undefined&&vb!==null&&vb!==undefined&&typeof va!=='string'&&typeof vb!=='string'){
                    if(f.higher){aBetter=va>vb;bBetter=vb>va;}
                    else{aBetter=va<vb;bBetter=vb<va;}
                }
                var badgeA=aBetter?'<span class="badge-best">最佳</span>':'';
                var badgeB=bBetter?'<span class="badge-best">最佳</span>':'';
                return catRow+'<tr><th>'+f.label+'</th><td class="'+(aBetter?'better':'')+'">'+fmtVal(va,f.unit)+badgeA+'</td><td class="'+(bBetter?'better':'')+'">'+fmtVal(vb,f.unit)+badgeB+'</td></tr>';
            }).join('');

            var aClass=aWins>bWins?'winner':'';
            var bClass=bWins>aWins?'winner':'';
            var winnerName=(aWins>bWins)?a.name:((bWins>aWins)?b.name:'平局');
            var winnerId=(aWins>bWins)?a.id:((bWins>aWins)?b.id:null);

            var html='<div class="result-header">';
            html+='<div class="result-col '+aClass+'"><span class="result-col-icon">'+a.icon+'</span><div class="result-col-name">'+a.name+'</div><div class="result-col-brand">'+a.brand+' &middot; $'+(a.price/1000).toFixed(0)+'K</div><div style="color:var(--accent-green);margin-top:6px;">优势: '+aWins+'项</div></div>';
            html+='<div class="result-divider">⚡</div>';
            html+='<div class="result-col '+bClass+'"><span class="result-col-icon">'+b.icon+'</span><div class="result-col-name">'+b.name+'</div><div class="result-col-brand">'+b.brand+' &middot; $'+(b.price/1000).toFixed(0)+'K</div><div style="color:var(--accent-green);margin-top:6px;">优势: '+bWins+'项</div></div>';
            html+='</div>';

            html+='<div class="table-wrap"><table class="compare-table"><thead><tr><th>参数</th><th>'+a.name+'</th><th>'+b.name+'</th></tr></thead><tbody>'+rows+'</tbody></table></div>';

            // Radar
            html+='<div class="radar-section"><h3>📊 雷达对比图</h3><div class="radar-visual">'+drawRadarSVG(a,b)+'<div class="radar-legend"><div class="radar-legend-item"><span class="radar-legend-dot" style="background:var(--accent-blue);"></span>'+a.name+'</div><div class="radar-legend-item"><span class="radar-legend-dot" style="background:var(--accent-red);"></span>'+b.name+'</div></div></div></div>';

            document.getElementById('resultArea').innerHTML=html;
            document.getElementById('resultArea').classList.add('active');
            document.getElementById('resultArea').scrollIntoView({behavior:'smooth'});

            // Update share URL
            var url=new URL(window.location.href);
            url.searchParams.set('a',a.id);
            url.searchParams.set('b',b.id);
            var shareUrl=url.toString();
            document.getElementById('shareUrl').value=shareUrl;
            document.getElementById('shareArea').classList.add('active');

            // Store current comparison data for save
            document.getElementById('shareArea').dataset.carA=JSON.stringify({id:a.id,name:a.name,brand:a.brand,icon:a.icon});
            document.getElementById('shareArea').dataset.carB=JSON.stringify({id:b.id,name:b.name,brand:b.brand,icon:b.icon});
            document.getElementById('shareArea').dataset.winnerId=winnerId||'';
            document.getElementById('shareArea').dataset.winnerName=winnerName;
        }

        // === Save Comparison to History ===
        function saveComparison(){
            var area=document.getElementById('shareArea');
            var carA=JSON.parse(area.dataset.carA||'{}');
            var carB=JSON.parse(area.dataset.carB||'{}');
            var winnerName=area.dataset.winnerName||'平局';
            if(!carA.id||!carB.id){alert('请先进行对比');return;}
            var entry={
                date:new Date().toISOString(),
                carA:{id:carA.id,name:carA.name,brand:carA.brand},
                carB:{id:carB.id,name:carB.name,brand:carB.brand},
                winnerName:winnerName
            };
            var history=JSON.parse(localStorage.getItem('autohub-compare-history')||'[]');
            history.unshift(entry);
            if(history.length>10)history=history.slice(0,10);
            localStorage.setItem('autohub-compare-history',JSON.stringify(history));
            renderHistory();
        }

        // === Render History List ===
        function renderHistory(){
            var history=JSON.parse(localStorage.getItem('autohub-compare-history')||'[]');
            var list=document.getElementById('historyList');
            var btnClear=document.getElementById('btnClearHistory');
            if(history.length===0){
                list.innerHTML='<div class="history-empty">暂无保存的对比记录</div>';
                btnClear.style.display='none';
            }else{
                list.innerHTML=history.map(function(h,i){
                    var d=new Date(h.date);
                    var ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
                    return '<div class="history-item"><span class="history-item-date">'+ds+'</span><span class="history-item-cars">'+h.carA.name+' <span>VS</span> '+h.carB.name+'</span><span class="history-item-winner">🏆 '+h.winnerName+'</span><button class="history-item-del" data-idx="'+i+'" title="删除">&times;</button></div>';
                }).join('');
                btnClear.style.display='inline-flex';
            }
        }

        // === Clear History ===
        function clearHistory(){
            if(confirm('确定清空所有历史对比记录？')){
                localStorage.removeItem('autohub-compare-history');
                renderHistory();
            }
        }

        // === Delete single history entry ===
        function deleteHistoryEntry(idx){
            var history=JSON.parse(localStorage.getItem('autohub-compare-history')||'[]');
            history.splice(idx,1);
            localStorage.setItem('autohub-compare-history',JSON.stringify(history));
            renderHistory();
        }

        // === Copy Share Link ===
        function copyShareLink(){
            var input=document.getElementById('shareUrl');
            input.select();
            input.setSelectionRange(0,99999);
            try{
                navigator.clipboard.writeText(input.value).then(function(){
                    var btn=document.getElementById('btnCopyLink');
                    btn.textContent='已复制!';
                    btn.style.background='var(--accent-green)';
                    setTimeout(function(){btn.textContent='复制链接';btn.style.background='var(--accent-cyan)';},2000);
                });
            }catch(e){
                document.execCommand('copy');
                alert('链接已复制！');
            }
        }

        // === Check URL params on load for share links ===
        function checkShareParams(){
            var params=new URLSearchParams(window.location.search);
            var aId=params.get('a');
            var bId=params.get('b');
            if(aId&&bId){
                var selA=document.getElementById('carA');
                var selB=document.getElementById('carB');
                if(selA.querySelector('option[value="'+aId+'"]')){
                    selA.value=aId;
                }
                if(selB.querySelector('option[value="'+bId+'"]')){
                    selB.value=bId;
                }
                if(selA.value===aId&&selB.value===bId){
                    setTimeout(runCompare,300);
                }
            }
        }

        // === Event Binding ===
        document.getElementById('btnCompare').addEventListener('click',runCompare);
        document.getElementById('btnCopyLink').addEventListener('click',copyShareLink);
        document.getElementById('btnSaveCompare').addEventListener('click',saveComparison);
        document.getElementById('btnClearHistory').addEventListener('click',clearHistory);

        // History item delete - delegate
        document.getElementById('historyList').addEventListener('click',function(e){
            var btn=e.target.closest('.history-item-del');
            if(btn){
                var idx=parseInt(btn.getAttribute('data-idx'));
                if(!isNaN(idx))deleteHistoryEntry(idx);
            }
        });

        // Navbar, BTT, Mobile menu, Theme toggle
        (function(){
            var navbar=document.getElementById('navbar'),btt=document.getElementById('backToTop');
            window.addEventListener('scroll',function(){
                navbar.classList.toggle('scrolled',window.scrollY>50);
                btt.classList.toggle('visible',window.scrollY>400);
            });
            btt.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'});});
            document.getElementById('mobileMenuBtn').addEventListener('click',function(){
                document.getElementById('navLinks').classList.toggle('active');
            });
            document.querySelectorAll('#navLinks a').forEach(function(l){
                l.addEventListener('click',function(){document.getElementById('navLinks').classList.remove('active');});
            });
            var btnTheme=document.getElementById('btnThemeToggle');
            var saved=localStorage.getItem('autohub-theme');
            if(saved==='light'){document.body.classList.add('light-mode');btnTheme.textContent='◑';}
            btnTheme.addEventListener('click',function(){
                document.body.classList.toggle('light-mode');
                var isL=document.body.classList.contains('light-mode');
                btnTheme.textContent=isL?'◑':'◐';
                localStorage.setItem('autohub-theme',isL?'light':'dark');
            });
        })();

        // === Init ===
        populateSelects();
        renderSpecCards();
        renderHistory();
        checkShareParams();
        console.log('%c⚖️ 性能对比已就绪 | 共 %d 款车型可对比 | 支持保存/分享/雷达图','color:#a855f7;',allCars.length);
    </script>
</body>
</html>
