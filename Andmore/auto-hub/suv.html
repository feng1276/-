        body.light-mode{--bg-primary:#f0f2f5;--bg-secondary:#ffffff;--bg-tertiary:#e4e6eb;--bg-card:#ffffff;--text-primary:#1a1a2e;--text-secondary:#5a6c7d;--text-highlight:#0a0a0a;--border-glow:#d0d5dd;--shadow-card:0 4px 20px rgba(0,0,0,0.08);--shadow-hover:0 8px 35px rgba(255,107,53,0.12);}

        .nav-links{display:flex;list-style:none;gap:2px;}.nav-links li a{display:block;padding:10px 16px;color:var(--text-secondary);text-decoration:none;border-radius:6px;transition:all var(--transition-speed);font-size:0.88rem;font-weight:500;position:relative;}.nav-links li a::after{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%) scaleX(0);width:50%;height:2px;background:var(--accent-orange);transition:transform var(--transition-speed);}.nav-links li a:hover,.nav-links li a.active{color:var(--text-highlight);background:rgba(255,107,53,0.08);}.nav-links li a:hover::after,.nav-links li a.active::after{transform:translateX(-50%) scaleX(1);}
        .nav-actions{display:flex;gap:8px;}.btn-icon{width:38px;height:38px;border:1px solid rgba(255,107,53,0.15);background:rgba(255,107,53,0.05);color:var(--text-secondary);border-radius:8px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;}.btn-icon:hover{background:rgba(255,107,53,0.15);border-color:var(--accent-orange);color:var(--accent-orange);}
        .mobile-menu-btn{display:none;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;}.mobile-menu-btn span{display:block;width:24px;height:2px;background:var(--accent-orange);}
        .page-header{margin-top:var(--nav-height);background:linear-gradient(160deg,#0a0e14 0%,#1a120d 30%,#0a0e14 100%);padding:55px 0;text-align:center;border-bottom:1px solid var(--border-glow);}.page-header h1{font-size:2.3rem;font-weight:900;color:var(--text-highlight);}.page-header .breadcrumb{color:var(--text-secondary);font-size:0.85rem;}.page-header .breadcrumb a{color:var(--accent-orange);text-decoration:none;}

        .suv-hero{background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);padding:30px;margin-bottom:30px;display:flex;align-items:center;gap:25px;flex-wrap:wrap;}.suv-hero-icon{font-size:5rem;}.suv-hero-text h2{color:var(--text-highlight);font-size:1.4rem;}.suv-hero-text p{color:var(--text-secondary);font-size:0.9rem;line-height:1.6;margin-top:8px;}

        .filter-bar .filter-label{font-size:0.82rem;color:var(--text-secondary);margin-right:4px;font-weight:600;}
        .filter-btn{padding:7px 14px;border:1px solid var(--border-glow);background:var(--bg-card);color:var(--text-secondary);border-radius:20px;cursor:pointer;font-size:0.78rem;font-weight:500;transition:all var(--transition-speed);white-space:nowrap;}
        .filter-btn:hover{border-color:var(--accent-orange);color:var(--accent-orange);}
        .filter-btn.active{background:rgba(255,107,53,0.15);border-color:var(--accent-orange);color:var(--accent-orange);}
        .filter-btn-group{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
        .filter-divider{width:1px;height:20px;background:var(--border-glow);margin:0 6px;}
        .filter-sort{display:flex;align-items:center;gap:8px;margin-left:auto;}
        .filter-sort select{padding:6px 12px;background:var(--bg-card);color:var(--text-primary);border:1px solid var(--border-glow);border-radius:var(--border-radius);font-size:0.78rem;cursor:pointer;outline:none;}
        .filter-sort select:focus{border-color:var(--accent-orange);}
        .result-count{font-size:0.82rem;color:var(--text-secondary);margin-bottom:12px;}
        .result-count span{color:var(--accent-orange);font-weight:700;}
        .suv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:22px;}
        .suv-card{background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);overflow:hidden;transition:all var(--transition-speed);cursor:pointer;}.suv-card:hover{transform:translateY(-4px);border-color:var(--accent-orange);box-shadow:var(--shadow-hover);}
        .suv-card-img{width:100%;aspect-ratio:16/10;background:var(--bg-tertiary);display:flex;align-items:center;justify-content:center;font-size:4rem;color:var(--text-secondary);position:relative;}.suv-card-badge{position:absolute;top:10px;right:10px;padding:4px 12px;background:rgba(255,107,53,0.2);border:1px solid var(--accent-orange);color:var(--accent-orange);font-size:0.7rem;font-weight:700;border-radius:10px;}
        .suv-card-type{position:absolute;top:10px;left:10px;padding:3px 10px;background:rgba(0,0,0,0.7);color:var(--text-secondary);font-size:0.65rem;font-weight:600;border-radius:10px;}
        .suv-card-info{padding:18px;}.suv-card-name{font-size:1.05rem;font-weight:700;color:var(--text-highlight);}.suv-card-brand{font-size:0.8rem;color:var(--accent-orange);margin-bottom:8px;}
        .suv-card-desc{font-size:0.82rem;color:var(--text-secondary);line-height:1.5;margin-bottom:10px;}
        .suv-specs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}.suv-spec{padding:4px 10px;background:rgba(255,107,53,0.06);color:var(--accent-orange);border-radius:10px;font-size:0.72rem;font-weight:500;}

        .suv-mini-specs div{display:flex;justify-content:space-between;}
        .suv-mini-specs div span:last-child{color:var(--text-highlight);font-weight:500;}
        .terrain-bars{display:flex;gap:3px;margin-top:4px;}.terrain-bar{height:4px;border-radius:2px;flex:1;min-width:0;}.terrain-bar.on{background:var(--accent-orange);}.terrain-bar.off{background:var(--border-glow);}
        .terrain-labels{display:flex;gap:3px;font-size:0.58rem;color:var(--text-secondary);margin-top:2px;}.terrain-labels span{flex:1;text-align:center;}
        .card-bottom-row{display:flex;align-items:center;justify-content:space-between;margin-top:6px;}

        .card-compare-btn:hover{background:rgba(255,107,53,0.15);}
        .card-compare-btn.selected{background:rgba(255,107,53,0.25);border-color:var(--accent-orange);}
        .compare-bar{position:fixed;bottom:0;left:0;width:100%;background:rgba(10,14,20,0.95);backdrop-filter:blur(20px);border-top:2px solid var(--accent-orange);z-index:1000;padding:16px 0;transform:translateY(100%);transition:transform var(--transition-speed);}
        .compare-bar.active{transform:translateY(0);}
        .compare-bar .container{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;}
        .compare-slot{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--bg-tertiary);border:1px solid var(--border-glow);border-radius:var(--border-radius);font-size:0.82rem;color:var(--text-primary);min-width:140px;justify-content:center;}
        .compare-slot.filled{border-color:var(--accent-orange);color:var(--accent-orange);}
        .compare-slot .remove-compare{cursor:pointer;font-size:0.7rem;margin-left:4px;opacity:0.6;}.compare-slot .remove-compare:hover{opacity:1;}
        .btn-compare-go{padding:10px 22px;background:var(--accent-orange);color:#fff;border:none;border-radius:var(--border-radius);font-size:0.85rem;font-weight:600;cursor:pointer;transition:all var(--transition-speed);white-space:nowrap;}
        .btn-compare-go:hover{filter:brightness(1.15);transform:translateY(-1px);}
        .btn-compare-go:disabled{opacity:0.4;cursor:not-allowed;transform:none;filter:none;}
        .btn-compare-clear{padding:8px 14px;background:transparent;border:1px solid var(--border-glow);color:var(--text-secondary);border-radius:var(--border-radius);font-size:0.78rem;cursor:pointer;}
        .btn-compare-clear:hover{color:var(--accent-orange);border-color:var(--accent-orange);}
        .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:2000;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all var(--transition-speed);}
        .modal-overlay.active{opacity:1;visibility:visible;}
        .modal{background:var(--bg-card);border:1px solid var(--border-glow);border-radius:12px;max-width:700px;width:95%;max-height:85vh;overflow-y:auto;padding:0;position:relative;}
        .modal-header{padding:18px 24px;border-bottom:1px solid var(--border-glow);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg-card);border-radius:12px 12px 0 0;z-index:1;}
        .modal-header h3{color:var(--text-highlight);font-size:1.2rem;}
        .modal-close{width:32px;height:32px;background:transparent;border:1px solid var(--border-glow);color:var(--text-secondary);border-radius:50%;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all var(--transition-speed);}
        .modal-close:hover{border-color:var(--accent-orange);color:var(--accent-orange);}
        .modal-body{padding:20px 24px 24px;}
        .modal-icon{font-size:5rem;text-align:center;margin-bottom:12px;}
        .modal-spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin:16px 0;}
        .modal-spec-item{display:flex;justify-content:space-between;padding:7px 12px;background:var(--bg-tertiary);border-radius:6px;font-size:0.82rem;}
        .modal-spec-label{color:var(--text-secondary);}.modal-spec-value{color:var(--text-highlight);font-weight:600;}
        .modal-terrain{margin:16px 0;}
        .modal-terrain h4{color:var(--text-highlight);font-size:0.9rem;margin-bottom:8px;}
        .modal-terrain-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:0.8rem;}
        .modal-terrain-row .label{width:60px;color:var(--text-secondary);}
        .modal-terrain-row .bar-track{flex:1;height:12px;background:var(--bg-tertiary);border-radius:6px;overflow:hidden;display:flex;}
        .modal-terrain-row .bar-fill{height:100%;background:linear-gradient(90deg,var(--accent-orange),#ff4757);border-radius:6px;transition:width 0.5s ease;}
        .modal-terrain-row .score{width:30px;text-align:right;color:var(--accent-orange);font-weight:700;}
        .modal-family-features{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}.modal-family-features span{padding:5px 12px;background:rgba(255,107,53,0.08);border:1px solid rgba(255,107,53,0.2);border-radius:14px;font-size:0.74rem;color:var(--text-primary);}
        .comparison-table{width:100%;border-collapse:collapse;margin:16px 0;font-size:0.82rem;}
        .comparison-table th,.comparison-table td{padding:10px 14px;text-align:center;border-bottom:1px solid var(--border-glow);}
        .comparison-table th:first-child,.comparison-table td:first-child{text-align:left;color:var(--text-secondary);font-weight:500;}
        .comparison-table th{color:var(--accent-orange);font-weight:700;font-size:0.9rem;}
        .comparison-table td{color:var(--text-highlight);}
        .comparison-table tr:hover td{background:rgba(255,107,53,0.03);}
        .footer{background:var(--bg-secondary);border-top:1px solid var(--border-glow);padding:28px;text-align:center;color:var(--text-secondary);font-size:0.78rem;}
        .back-to-top{position:fixed;bottom:28px;right:28px;width:44px;height:44px;background:rgba(255,107,53,0.15);border:1.5px solid rgba(255,107,53,0.4);color:var(--accent-orange);border-radius:10px;cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all var(--transition-speed);z-index:999;}.back-to-top.visible{opacity:1;visibility:visible;}.back-to-top:hover{background:var(--accent-orange);color:#fff;}
        @keyframes fadeInUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}.suv-card{animation:fadeInUp 0.35s ease forwards;}
        @media(max-width:768px){.nav-links{display:none;position:absolute;top:var(--nav-height);left:0;width:100%;background:rgba(10,14,20,0.98);flex-direction:column;padding:20px;z-index:999;}.nav-links.active{display:flex;}.mobile-menu-btn{display:flex;}.suv-grid{grid-template-columns:1fr;}.filter-bar{flex-direction:column;align-items:stretch;}.filter-sort{margin-left:0;}.modal-spec-grid{grid-template-columns:1fr;}.comparison-table{font-size:0.7rem;}.comparison-table th,.comparison-table td{padding:6px 8px;}.suv-hero{flex-direction:column;text-align:center;}}
    </style>
</head>

        },{

            badge:'家庭之选',type:'家用',engineType:'3.8L V6',torque:355,drivetrain:'AWD',transmission:'8速自动',
            seats:8,cargoSpace:453,towingCapacity:2268,fuelEconomy:10.7,fuelType:'汽油',groundClearance:203,
            approachAngle:18,departureAngle:21,terrainRating:{onRoad:7,offRoad:4,snow:6,sand:3},
            familyFeatures:['三排八座','后排对话','UVO互联','多USB-C'],length:4996,weight:1940
        },{
            name:'Outback',brand:'Subaru',icon:'🌲',hp:260,accel:6.8,topSpeed:200,price:'¥32万',priceNum:320000,
            desc:'斯巴鲁傲虎凭借对称全时四驱和水平对置引擎，在ADV跨界旅行车中独树一帜。220mm离地间隙兼顾公路操控与轻度越野。',
            badge:'跨界全能',type:'家用',engineType:'2.4T Flat-4',torque:376,drivetrain:'AWD',transmission:'CVT',
            seats:5,cargoSpace:920,towingCapacity:1588,fuelEconomy:8.9,fuelType:'汽油',groundClearance:220,
            approachAngle:19,departureAngle:23,terrainRating:{onRoad:7,offRoad:6,snow:10,sand:5},
            familyFeatures:['EyeSight安全','防水内饰','行李架','X-MODE'],length:4870,weight:1710
        }];

        let compareList=[];
        let currentFilter={type:'all',seat:'all',sort:'default'};

        function renderTerrainBars(rating){
            const labels=['铺装','越野','雪地','沙地'];
            const keys=['onRoad','offRoad','snow','sand'];
            let bars='<div class="terrain-bars">';
            keys.forEach(k=>{for(let i=1;i<=10;i++)bars+=`<div class="terrain-bar ${i<=rating[k]?'on':'off'}" title="${labels[keys.indexOf(k)]}:${rating[k]}/10"></div>`;});
            bars+='</div><div class="terrain-labels">';
            labels.forEach(l=>bars+=`<span>${l}</span>`);
            bars+='</div>';
            return bars;
        }

        function renderTerrainRow(label,score){
            let fill='<div class="bar-track">';
            for(let i=1;i<=10;i++)fill+=`<div class="bar-fill" style="flex:1;opacity:${i<=score?1:0.15};border-radius:${i===1?'6px 0 0 6px':i===10?'0 6px 6px 0':'0'};margin-right:2px;"></div>`;
            fill+='</div>';
            return `<div class="modal-terrain-row"><span class="label">${label}</span>${fill}<span class="score">${score}/10</span></div>`;
        }

        function getFilteredAndSorted(){
            let filtered=[...suvs];
            if(currentFilter.type!=='all')filtered=filtered.filter(s=>s.type===currentFilter.type);
            if(currentFilter.seat==='5座')filtered=filtered.filter(s=>s.seats===5);
            if(currentFilter.seat==='6座')filtered=filtered.filter(s=>s.seats===6);
            if(currentFilter.seat==='7座')filtered=filtered.filter(s=>s.seats>=7&&s.seats<=7);
            if(currentFilter.sort==='hp-desc')filtered.sort((a,b)=>b.hp-a.hp);
            if(currentFilter.sort==='hp-asc')filtered.sort((a,b)=>a.hp-b.hp);
            if(currentFilter.sort==='accel-asc')filtered.sort((a,b)=>a.accel-b.accel);
            if(currentFilter.sort==='price-asc')filtered.sort((a,b)=>a.priceNum-b.priceNum);
            if(currentFilter.sort==='price-desc')filtered.sort((a,b)=>b.priceNum-a.priceNum);
            if(currentFilter.sort==='fuel-asc'){
                filtered.sort((a,b)=>{
                    const fa=a.fuelType==='电动'||a.fuelType==='插电混动'?a.fuelEconomy:a.fuelEconomy;
                    const fb=b.fuelType==='电动'||b.fuelType==='插电混动'?b.fuelEconomy:b.fuelEconomy;
                    return fa-fb;
                });
            }
            return filtered;
        }

        function render(){
            const filtered=getFilteredAndSorted();
            document.getElementById('resultCount').innerHTML=`共 <span>${filtered.length}</span> 款SUV符合条件`;
            document.getElementById('suvGrid').innerHTML=filtered.map((s,i)=>{
                const inCompare=compareList.includes(s);
                return `<div class="suv-card" style="animation-delay:${i*0.03}s" onclick="openDetail(${suvs.indexOf(s)})">
                    <div class="suv-card-img">${s.icon}<span class="suv-card-badge">${s.badge}</span><span class="suv-card-type">${s.type}</span></div>
                    <div class="suv-card-info">
                        <div class="suv-card-name">${s.name}</div>
                        <div class="suv-card-brand">${s.brand} · ${s.price}</div>
                        <div class="suv-card-desc">${s.desc}</div>
                        <div class="suv-specs"><span class="suv-spec">⚡${s.hp}hp</span><span class="suv-spec">⏱${s.accel}s</span><span class="suv-spec">🏁${s.topSpeed}km/h</span><span class="suv-spec">🔧${s.torque}Nm</span></div>
                        <div class="suv-mini-specs">
                            <div>🪑 座位 <span>${s.seats}座</span></div><div>📦 货箱 <span>${s.cargoSpace}L</span></div>
                            <div>🪝 拖拽 <span>${s.towingCapacity}kg</span></div><div>⛽ 油耗 <span>${s.fuelType==='电动'?'0电耗':s.fuelEconomy+'L/100km'}</span></div>
                        </div>
                        ${renderTerrainBars(s.terrainRating)}
                        <div class="card-bottom-row">
                            <span style="font-size:0.65rem;color:var(--text-secondary);">点击查看详情</span>
                            <button class="card-compare-btn ${inCompare?'selected':''}" onclick="event.stopPropagation();toggleCompare(${suvs.indexOf(s)})">${inCompare?'已选 ✓':'+ 对比'}</button>
                        </div>
                    </div>
                </div>`;
            }).join('');
            updateCompareBar();
        }

        function openDetail(idx){
            const s=suvs[idx];
            const t=s.terrainRating;
            const modal=document.getElementById('modal');
            modal.innerHTML=`
                <div class="modal-header"><h3>${s.icon} ${s.name}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
                <div class="modal-body">
                    <div style="text-align:center;"><span style="font-size:5rem;">${s.icon}</span></div>
                    <div style="text-align:center;margin:8px 0;"><span style="color:var(--accent-orange);font-weight:700;font-size:1.1rem;">${s.brand}</span> · <span style="color:var(--text-highlight);font-weight:700;">${s.badge}</span> · <span style="background:rgba(255,107,53,0.12);padding:2px 10px;border-radius:10px;font-size:0.78rem;color:var(--accent-orange);">${s.type}</span></div>
                    <p style="color:var(--text-secondary);font-size:0.85rem;line-height:1.6;margin:10px 0;">${s.desc}</p>
                    <div class="modal-spec-grid">
                        <div class="modal-spec-item"><span class="modal-spec-label">马力</span><span class="modal-spec-value">${s.hp} hp</span></div>
                        <div class="modal-spec-item"><span class="modal-spec-label">0-100km/h</span><span class="modal-spec-value">${s.accel} s</span></div>
                        <div class="modal-spec-item"><span class="modal-spec-label">极速</span><span class="modal-spec-value">${s.topSpeed} km/h</span></div>
                        <div class="modal-spec-item"><span class="modal-spec-label">价格</span><span class="modal-spec-value">${s.price}</span></div>
                        <div class="modal-spec-item"><span class="modal-spec-label">发动机</span><span class="modal-spec-value">${s.engineType}</span></div>
                        <div class="modal-spec-item"><span class="modal-spec-label">扭矩</span><span class="modal-spec-value">${s.torque} Nm</span></div>
                        <div class="modal-spec-item"><span class="modal-spec-label">驱动方式</span><span class="modal-spec-value">${s.drivetrain}</span></div>
                        <div class="modal-spec-item"><span class="modal-spec-label">变速箱</span><span class="modal-spec-value">${s.transmission}</span></div>
                        <div class="modal-spec-item"><span class="modal-spec-label">座位数</span><span class="modal-spec-value">${s.seats} 座</span></div>
                        <div class="modal-spec-item"><span class="modal-spec-label">货箱容积</span><span class="modal-spec-value">${s.cargoSpace} L</span></div>
                        <div class="modal-spec-item"><span class="modal-spec-label">拖拽能力</span><span class="modal-spec-value">${s.towingCapacity} kg</span></div>
                        <div class="modal-spec-item"><span class="modal-spec-label">油耗</span><span class="modal-spec-value">${s.fuelType==='电动'?'纯电':s.fuelEconomy+' L/100km'}</span></div>
                        <div class="modal-spec-item"><span class="modal-spec-label">燃油类型</span><span class="modal-spec-value">${s.fuelType}</span></div>
                        <div class="modal-spec-item"><span class="modal-spec-label">离地间隙</span><span class="modal-spec-value">${s.groundClearance} mm</span></div>
                        <div class="modal-spec-item"><span class="modal-spec-label">接近角/离去角</span><span class="modal-spec-value">${s.approachAngle}°/${s.departureAngle}°</span></div>
                        <div class="modal-spec-item"><span class="modal-spec-label">车长</span><span class="modal-spec-value">${s.length} mm</span></div>
                        <div class="modal-spec-item"><span class="modal-spec-label">车重</span><span class="modal-spec-value">${s.weight} kg</span></div>
                    </div>
                    <div class="modal-terrain"><h4>🌍 地形通过能力评级</h4>
                        ${renderTerrainRow('铺装路面',t.onRoad)}
                        ${renderTerrainRow('越野路况',t.offRoad)}
                        ${renderTerrainRow('雪地冰面',t.snow)}
                        ${renderTerrainRow('沙漠沙地',t.sand)}
                    </div>
                    <div class="modal-family-features"><strong style="font-size:0.82rem;color:var(--text-highlight);display:block;margin-bottom:6px;">👨‍👩‍👧‍👦 家用/舒适配置:</strong>
                        ${s.familyFeatures.map(f=>`<span>${f}</span>`).join('')}
                    </div>
                </div>`;
            document.getElementById('modalOverlay').classList.add('active');
            document.body.style.overflow='hidden';
        }

        function closeModal(){
            document.getElementById('modalOverlay').classList.remove('active');
            document.body.style.overflow='';
        }

        function toggleCompare(idx){
            const s=suvs[idx];
            const existing=compareList.indexOf(s);
            if(existing>-1){compareList.splice(existing,1);}else{if(compareList.length>=2){compareList.shift();}compareList.push(s);}
            updateCompareBar();
            render();
        }

        function updateCompareBar(){
            const bar=document.getElementById('compareBar');
            const s1=document.getElementById('compareSlot1');
            const s2=document.getElementById('compareSlot2');
            const btn=document.getElementById('btnCompareGo');
            if(compareList.length>0){bar.classList.add('active');}else{bar.classList.remove('active');}
            if(compareList.length>=1){s1.innerHTML=`${compareList[0].icon} ${compareList[0].name} <span class="remove-compare" onclick="event.stopPropagation();toggleCompare(${suvs.indexOf(compareList[0])})">✕</span>`;s1.classList.add('filled');}else{s1.innerHTML='请选择第1辆车';s1.classList.remove('filled');}
            if(compareList.length>=2){s2.innerHTML=`${compareList[1].icon} ${compareList[1].name} <span class="remove-compare" onclick="event.stopPropagation();toggleCompare(${suvs.indexOf(compareList[1])})">✕</span>`;s2.classList.add('filled');}else{s2.innerHTML='请选择第2辆车';s2.classList.remove('filled');}
            btn.disabled=compareList.length<2;
        }

        function doCompare(){
            if(compareList.length<2)return;
            const a=compareList[0],b=compareList[1];
            const ta=a.terrainRating,tb=b.terrainRating;
            const modal=document.getElementById('modal');
            modal.innerHTML=`
                <div class="modal-header"><h3>📊 ${a.name} VS ${b.name}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
                <div class="modal-body">
                    <table class="comparison-table">
                        <tr><th>对比项</th><th>${a.icon} ${a.name}</th><th>${b.icon} ${b.name}</th></tr>
                        <tr><td>马力</td><td>${a.hp} hp</td><td>${b.hp} hp</td></tr>
                        <tr><td>0-100km/h</td><td>${a.accel} s</td><td>${b.accel} s</td></tr>
                        <tr><td>价格</td><td>${a.price}</td><td>${b.price}</td></tr>
                        <tr><td>座位数</td><td>${a.seats} 座</td><td>${b.seats} 座</td></tr>
                        <tr><td>货箱容积</td><td>${a.cargoSpace} L</td><td>${b.cargoSpace} L</td></tr>
                        <tr><td>拖拽能力</td><td>${a.towingCapacity} kg</td><td>${b.towingCapacity} kg</td></tr>
                        <tr><td>油耗</td><td>${a.fuelType==='电动'?'纯电':a.fuelEconomy+'L'}</td><td>${b.fuelType==='电动'?'纯电':b.fuelEconomy+'L'}</td></tr>
                        <tr><td>发动机</td><td>${a.engineType}</td><td>${b.engineType}</td></tr>
                        <tr><td>扭矩</td><td>${a.torque} Nm</td><td>${b.torque} Nm</td></tr>
                        <tr><td>驱动方式</td><td>${a.drivetrain}</td><td>${b.drivetrain}</td></tr>
                        <tr><td>铺装路面</td><td>${ta.onRoad}/10</td><td>${tb.onRoad}/10</td></tr>
                        <tr><td>越野路况</td><td>${ta.offRoad}/10</td><td>${tb.offRoad}/10</td></tr>
                        <tr><td>雪地冰面</td><td>${ta.snow}/10</td><td>${tb.snow}/10</td></tr>
                        <tr><td>沙漠沙地</td><td>${ta.sand}/10</td><td>${tb.sand}/10</td></tr>
                    </table>
                </div>`;
            document.getElementById('modalOverlay').classList.add('active');
            document.body.style.overflow='hidden';
        }

        function clearCompare(){
            compareList=[];
            updateCompareBar();
            render();
        }

        document.getElementById('filterTypeGroup').addEventListener('click',e=>{
            if(e.target.classList.contains('filter-btn')){
                document.querySelectorAll('#filterTypeGroup .filter-btn').forEach(b=>b.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter.type=e.target.dataset.filter;
                render();
            }
        });

        document.getElementById('filterSeatGroup').addEventListener('click',e=>{
            if(e.target.classList.contains('filter-btn')){
                document.querySelectorAll('#filterSeatGroup .filter-btn').forEach(b=>b.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter.seat=e.target.dataset.filter;
                render();
            }
        });

        document.getElementById('sortSelect').addEventListener('change',e=>{
            currentFilter.sort=e.target.value;
            render();
        });

        document.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target===document.getElementById('modalOverlay'))closeModal();});

        document.getElementById('btnCompareGo').addEventListener('click',doCompare);
        document.getElementById('btnCompareClear').addEventListener('click',clearCompare);

        document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

        const navbar=document.getElementById('navbar'),btt=document.getElementById('backToTop');
        window.addEventListener('scroll',()=>{const s=window.scrollY;navbar.classList.toggle('scrolled',s>50);btt.classList.toggle('visible',s>400);});
        btt.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
        document.getElementById('mobileMenuBtn').addEventListener('click',()=>document.getElementById('navLinks').classList.toggle('active'));
        document.querySelectorAll('#navLinks a').forEach(l=>l.addEventListener('click',()=>document.getElementById('navLinks').classList.remove('active')));

        const btnTheme=document.getElementById('btnThemeToggle'),saved=localStorage.getItem('autohub-theme');
        if(saved==='light'){document.body.classList.add('light-mode');btnTheme.textContent='◑';}
        btnTheme.addEventListener('click',()=>{document.body.classList.toggle('light-mode');const isL=document.body.classList.contains('light-mode');btnTheme.textContent=isL?'◑':'◐';localStorage.setItem('autohub-theme',isL?'light':'dark');});

        render();
        console.log('%c🚙 SUV专区已就绪 | 共 %d 款SUV','color:#ff6b35;',suvs.length);
    </script>
</body>
</html>
