<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排行榜 - AutoHub</title>
    <style>
        :root {
            --bg-primary:#0a0e14;--bg-secondary:#11161d;--bg-tertiary:#1a1f2b;--bg-card:#141a23;
            --text-primary:#c9d1d9;--text-secondary:#8b949e;--text-highlight:#f0f6fc;
            --accent-blue:#4a9eff;--accent-cyan:#00d4ff;--accent-gold:#ffd700;--accent-red:#ff4757;
            --accent-silver:#c0c0c0;--accent-bronze:#cd7f32;--border-glow:#1e2d3d;
            --shadow-card:0 4px 25px rgba(0,0,0,0.6);--shadow-hover:0 8px 40px rgba(255,215,0,0.2);
            --border-radius:8px;--transition-speed:0.3s;--nav-height:72px;--max-width:1400px;
        }
        body.light-mode{--bg-primary:#f0f2f5;--bg-secondary:#ffffff;--bg-tertiary:#e4e6eb;--bg-card:#ffffff;--text-primary:#1a1a2e;--text-secondary:#5a6c7d;--text-highlight:#0a0a0a;--border-glow:#d0d5dd;--shadow-card:0 4px 20px rgba(0,0,0,0.08);}
        *{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;font-size:16px;}
        body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;background-color:var(--bg-primary);color:var(--text-primary);line-height:1.6;transition:background-color var(--transition-speed),color var(--transition-speed);overflow-x:hidden;}
        ::-webkit-scrollbar{width:8px;}::-webkit-scrollbar-track{background:var(--bg-secondary);}::-webkit-scrollbar-thumb{background:var(--border-glow);border-radius:4px;}
        .navbar{position:fixed;top:0;left:0;width:100%;height:var(--nav-height);background:rgba(10,14,20,0.88);backdrop-filter:blur(20px);border-bottom:1px solid rgba(74,158,255,0.1);z-index:1000;}.navbar.scrolled{box-shadow:0 4px 30px rgba(0,0,0,0.7);}
        .navbar .container{max-width:var(--max-width);margin:0 auto;padding:0 30px;height:100%;display:flex;align-items:center;justify-content:space-between;}
        .logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text-highlight);font-size:1.5rem;font-weight:800;}.logo-icon{width:42px;height:42px;background:linear-gradient(135deg,#ffd700,#ff6b35);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;color:#0a0e14;}.logo-text{background:linear-gradient(135deg,#4a9eff,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .nav-links{display:flex;list-style:none;gap:2px;}.nav-links li a{display:block;padding:10px 16px;color:var(--text-secondary);text-decoration:none;border-radius:6px;transition:all var(--transition-speed);font-size:0.88rem;font-weight:500;position:relative;}.nav-links li a::after{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%) scaleX(0);width:50%;height:2px;background:var(--accent-gold);transition:transform var(--transition-speed);}.nav-links li a:hover,.nav-links li a.active{color:var(--text-highlight);background:rgba(255,215,0,0.06);}.nav-links li a:hover::after,.nav-links li a.active::after{transform:translateX(-50%) scaleX(1);}
        .nav-actions{display:flex;gap:8px;}.btn-icon{width:38px;height:38px;border:1px solid rgba(255,215,0,0.15);background:rgba(255,215,0,0.03);color:var(--text-secondary);border-radius:8px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;}.btn-icon:hover{background:rgba(255,215,0,0.1);border-color:var(--accent-gold);color:var(--accent-gold);}
        .mobile-menu-btn{display:none;}.mobile-menu-btn span{display:block;width:24px;height:2px;background:var(--accent-gold);}
        .page-header{margin-top:var(--nav-height);background:linear-gradient(160deg,#0a0e14 0%,#1a150d 30%,#0a0e14 100%);padding:55px 0;text-align:center;border-bottom:1px solid var(--border-glow);}.page-header h1{font-size:2.3rem;font-weight:900;color:var(--text-highlight);}
        .page-header .breadcrumb{margin-top:8px;font-size:0.85rem;color:var(--text-secondary);}.page-header .breadcrumb a{color:var(--accent-gold);text-decoration:none;}
        .main-content{padding:40px 0 70px;}.container{max-width:var(--max-width);margin:0 auto;padding:0 30px;}

        /* Filter Bar */
        .filter-bar{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center;margin-bottom:18px;}
        .filter-bar select,.filter-bar .filter-label{padding:9px 16px;background:var(--bg-card);border:1px solid var(--border-glow);color:var(--text-primary);border-radius:20px;font-size:0.82rem;font-weight:600;cursor:pointer;outline:none;transition:all var(--transition-speed);}
        .filter-bar select:hover,.filter-bar select:focus{border-color:var(--accent-gold);}
        .filter-bar .filter-label{display:flex;align-items:center;gap:6px;color:var(--text-secondary);}

        /* Rank Tabs */
        .rank-tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:35px;}.rank-tab{padding:11px 24px;background:var(--bg-card);border:1px solid var(--border-glow);color:var(--text-secondary);border-radius:20px;cursor:pointer;transition:all var(--transition-speed);font-size:0.85rem;font-weight:600;}.rank-tab:hover,.rank-tab.active{background:rgba(255,215,0,0.1);border-color:var(--accent-gold);color:var(--accent-gold);}

        /* Medal Shine Animation */
        @keyframes medalShine{0%{filter:drop-shadow(0 0 2px currentColor);}50%{filter:drop-shadow(0 0 14px currentColor) drop-shadow(0 0 6px currentColor);}100%{filter:drop-shadow(0 0 2px currentColor);}}
        @keyframes medalPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}
        .medal-animated{animation:medalShine 2.5s ease-in-out infinite;}
        .podium-medal.gold-medal{animation:medalShine 2.2s ease-in-out infinite;color:var(--accent-gold);}
        .podium-medal.silver-medal{animation:medalShine 2.8s ease-in-out infinite;color:var(--accent-silver);}
        .podium-medal.bronze-medal{animation:medalShine 3.2s ease-in-out infinite;color:var(--accent-bronze);}
        .rank-num.gold-num{animation:medalPulse 2.2s ease-in-out infinite;}
        .rank-num.silver-num{animation:medalPulse 2.8s ease-in-out infinite;}
        .rank-num.bronze-num{animation:medalPulse 3.2s ease-in-out infinite;}

        /* Podium */
        .podium{display:flex;justify-content:center;align-items:flex-end;gap:20px;margin-bottom:45px;flex-wrap:wrap;}.podium-item{background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);padding:22px;text-align:center;width:220px;transition:all var(--transition-speed);position:relative;overflow:hidden;}
        .podium-item.gold{order:2;width:260px;border-color:var(--accent-gold);box-shadow:0 0 35px rgba(255,215,0,0.25);background:linear-gradient(180deg,rgba(255,215,0,0.06) 0%,var(--bg-card) 30%);}
        .podium-item.gold::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:conic-gradient(from 0deg,transparent,rgba(255,215,0,0.05),transparent 60deg);animation:shineRotate 4s linear infinite;}
        .podium-item.silver{order:1;border-color:var(--accent-silver);background:linear-gradient(180deg,rgba(192,192,192,0.05) 0%,var(--bg-card) 30%);}.podium-item.bronze{order:3;border-color:var(--accent-bronze);background:linear-gradient(180deg,rgba(205,127,50,0.05) 0%,var(--bg-card) 30%);}
        @keyframes shineRotate{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
        .podium-medal{font-size:2.8rem;display:block;margin-bottom:4px;}.podium-icon{font-size:3.2rem;display:block;margin:8px 0;}.podium-name{font-weight:800;color:var(--text-highlight);font-size:1.05rem;}.podium-brand{font-size:0.78rem;color:var(--text-secondary);margin-bottom:6px;}.podium-value{color:var(--accent-gold);font-size:1.15rem;font-weight:800;}.podium-detail{font-size:0.72rem;color:var(--text-secondary);margin-top:3px;}.podium-year{display:inline-block;padding:2px 8px;background:rgba(255,215,0,0.1);border-radius:10px;font-size:0.7rem;color:var(--accent-gold);margin-top:6px;}

        /* Section Title */
        .section-title{text-align:center;color:var(--accent-gold);margin-bottom:8px;font-size:1.6rem;font-weight:900;}
        .section-subtitle{text-align:center;color:var(--text-secondary);font-size:0.82rem;margin-bottom:25px;}

        /* Rank List */
        .rank-list{display:flex;flex-direction:column;gap:6px;}.rank-item{display:flex;align-items:center;gap:12px;background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);padding:14px 18px;transition:all var(--transition-speed);}.rank-item:hover{border-color:var(--accent-gold);transform:translateX(4px);}.rank-num{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:0.9rem;background:var(--bg-tertiary);color:var(--text-secondary);flex-shrink:0;}
        .rank-item:nth-child(1) .rank-num{background:var(--accent-gold);color:#0a0e14;}.rank-item:nth-child(2) .rank-num{background:var(--accent-silver);color:#0a0e14;}.rank-item:nth-child(3) .rank-num{background:var(--accent-bronze);color:#0a0e14;}.rank-icon{font-size:2rem;flex-shrink:0;width:40px;text-align:center;}.rank-info{flex:1;min-width:0;}.rank-name{font-weight:700;color:var(--text-highlight);}.rank-detail{font-size:0.78rem;color:var(--text-secondary);}.rank-value{font-weight:700;color:var(--accent-cyan);white-space:nowrap;}

        /* Trending indicator */
        .rank-trend{font-size:1rem;flex-shrink:0;width:28px;text-align:center;}
        .trend-up{color:#00e676;}.trend-down{color:var(--accent-red);}.trend-flat{color:var(--text-secondary);}

        /* Comparison indicator */
        .rank-compare{font-size:0.72rem;padding:3px 10px;border-radius:12px;white-space:nowrap;font-weight:600;flex-shrink:0;}
        .compare-better{background:rgba(0,230,118,0.12);color:#00e676;}
        .compare-worse{background:rgba(255,71,87,0.12);color:var(--accent-red);}
        .compare-neutral{background:rgba(139,148,158,0.12);color:var(--text-secondary);}

        /* Historical Section */
        .history-section{margin-top:55px;padding-top:40px;border-top:1px solid var(--border-glow);}
        .history-section h2{text-align:center;color:var(--accent-gold);font-size:1.5rem;margin-bottom:25px;}
        .history-timeline{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}
        .history-card{background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);padding:18px 22px;text-align:center;width:200px;transition:all var(--transition-speed);}
        .history-card:hover{border-color:var(--accent-gold);box-shadow:var(--shadow-hover);}
        .history-year{font-size:1.4rem;font-weight:900;color:var(--accent-gold);}
        .history-car{font-weight:700;color:var(--text-highlight);margin-top:6px;}
        .history-value{font-size:0.82rem;color:var(--accent-cyan);margin-top:4px;}
        .history-icon{font-size:2.5rem;display:block;margin-bottom:4px;}

        /* No results */
        .no-results{text-align:center;padding:50px 20px;color:var(--text-secondary);font-size:1.1rem;}

        /* Stats summary */
        .stats-row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-bottom:30px;}
        .stat-card{background:var(--bg-card);border:1px solid var(--border-glow);border-radius:var(--border-radius);padding:16px 22px;text-align:center;min-width:130px;transition:all var(--transition-speed);}
        .stat-card:hover{border-color:var(--accent-gold);}
        .stat-value{font-size:1.6rem;font-weight:900;color:var(--accent-gold);}
        .stat-label{font-size:0.75rem;color:var(--text-secondary);margin-top:2px;}

        /* Pagination note */
        .list-footer-note{text-align:center;margin-top:20px;color:var(--text-secondary);font-size:0.78rem;}

        /* Footer */
        .footer{background:var(--bg-secondary);border-top:1px solid var(--border-glow);padding:28px;text-align:center;color:var(--text-secondary);font-size:0.78rem;}
        .back-to-top{position:fixed;bottom:28px;right:28px;width:44px;height:44px;background:rgba(255,215,0,0.1);border:1.5px solid rgba(255,215,0,0.3);color:var(--accent-gold);border-radius:10px;cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all var(--transition-speed);z-index:999;}.back-to-top.visible{opacity:1;visibility:visible;}

        @media(max-width:768px){
            .nav-links{display:none;position:absolute;top:var(--nav-height);left:0;width:100%;background:rgba(10,14,20,0.98);flex-direction:column;padding:20px;z-index:999;}.nav-links.active{display:flex;}
            .mobile-menu-btn{display:flex;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;}
            .podium{flex-direction:column;align-items:center;}
            .podium-item{width:100%;max-width:280px;}.podium-item.gold,.podium-item.silver,.podium-item.bronze{order:0;width:100%;max-width:280px;}
            .rank-item{flex-wrap:wrap;gap:8px;}
            .rank-compare{width:100%;text-align:center;}
            .filter-bar{flex-direction:column;align-items:stretch;}
            .filter-bar select{width:100%;}
            .rank-tabs{gap:6px;}.rank-tab{padding:8px 14px;font-size:0.78rem;}
            .history-card{width:140px;padding:12px;}
        }
    </style>
</head>

        // ============ RANKING CATEGORY DEFINITIONS ============

        // ============ COMPUTE AVERAGES ============
        function computeAverages(cars){
            const avgs={};
            const keys=['accel','topSpeed','range','price','powerWeightRatio','engineSize','fuelEconomyNum','ncapRating'];
            keys.forEach(k=>{
                const vals=cars.map(c=>k==='fuelEconomyNum'?parseFuelEcon(c.fuelEconomy):(c[k]!=null?c[k]:NaN)).filter(v=>!isNaN(v));
                avgs[k]=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;
            });
            return avgs;
        }
        function parseFuelEcon(s){if(!s)return NaN;const n=parseFloat(s);return isNaN(n)?NaN:n;}

        // ============ FILTER FUNCTION ============
        function applyFilters(cars){
            const brandF=document.getElementById('brandFilter').value;
            const priceF=document.getElementById('priceFilter').value;
            let filtered=[...cars];
            if(brandF!=='all')filtered=filtered.filter(c=>c.brand===brandF);
            if(priceF!=='all'){
                if(priceF==='under50k')filtered=filtered.filter(c=>c.price<50000);
                else if(priceF==='50k-100k')filtered=filtered.filter(c=>c.price>=50000&&c.price<100000);
                else if(priceF==='100k-200k')filtered=filtered.filter(c=>c.price>=100000&&c.price<200000);
                else if(priceF==='200k+')filtered=filtered.filter(c=>c.price>=200000);
            }
            return filtered;
        }

        // ============ BUILD BRAND FILTER OPTIONS ============
        function buildBrandOptions(){
            const brands=[...new Set(allCars.map(c=>c.brand))].sort();
            const sel=document.getElementById('brandFilter');
            brands.forEach(b=>{const o=document.createElement('option');o.value=b;o.textContent=b;sel.appendChild(o);});
        }

        // ============ MAIN RENDER ============
        function render(){
            const r=rankings[currentCat];
            let pool=[...allCars];
            // Apply EV-only or ICE-only filters
            if(r.evOnly)pool=pool.filter(c=>c.range!=null);
            if(r.iceOnly)pool=pool.filter(c=>c.engineSize!=null);
            // Apply user filters
            pool=applyFilters(pool);
            // Sort
            const sorted=[...pool].sort((a,b)=>{
                const va=a[r.key],vb=b[r.key];
                if(va==null&&vb==null)return 0;if(va==null)return 1;if(vb==null)return -1;
                if(r.key==='fuelEconomy'){
                    return r.asc?parseFuelEcon(va)-parseFuelEcon(vb):parseFuelEcon(vb)-parseFuelEcon(va);
                }
                if(r.key==='ncapRating'&&va===vb)return b.price-a.price;
                return r.asc?va-vb:vb-va;
            });
            const top20=sorted.slice(0,20);
            const avgs=computeAverages(pool);

            // Stats
            document.getElementById('statsRow').innerHTML=`
                <div class="stat-card"><div class="stat-value">${pool.length}</div><div class="stat-label">符合条件的车型</div></div>
                <div class="stat-card"><div class="stat-value">${sorted.length>0?sorted[0].brand:'-'}</div><div class="stat-label">冠军品牌</div></div>
                <div class="stat-card"><div class="stat-value">${top20.length}</div><div class="stat-label">TOP 榜单</div></div>
            `;

            // Build HTML
            let html=`<h2 class="section-title">${r.title}</h2><p class="section-subtitle">${r.desc}</p>`;

            // No results
            if(top20.length===0){
                html+=`<div class="no-results">😕 没有符合条件的车型,请尝试调整筛选条件</div>`;
            }else{
                // Podium (top 3)
                const podiumItems=top20.slice(0,3);
                const medals=['🥇','🥈','🥉'];
                const medalClasses=['gold-medal','silver-medal','bronze-medal'];
                const podiumClasses=['gold','silver','bronze'];
                html+=`<div class="podium">`;
                podiumItems.forEach((c,i)=>{
                    const val=r.key==='fuelEconomy'?c.fuelEconomy:(r.key==='ncapRating'?'★'.repeat(c.ncapRating):(c[r.key]+' '+r.unit));
                    html+=`<div class="podium-item ${podiumClasses[i]}">
                        <span class="podium-medal ${medalClasses[i]}">${medals[i]}</span>
                        <span class="podium-icon">${c.icon}</span>
                        <div class="podium-name">${c.name}</div>
                        <div class="podium-brand">${c.brand}</div>
                        <div class="podium-value">${val}</div>
                        <div class="podium-detail">${c.power} hp | ${c.price.toLocaleString()} USD</div>
                        <div class="podium-year">${c.year}</div>
                    </div>`;
                });
                html+=`</div>`;

                // List (4-20)
                html+=`<div class="rank-list">`;
                top20.slice(3).forEach((c,i)=>{
                    const rank=i+4;
                    const val=r.key==='fuelEconomy'?c.fuelEconomy:(r.key==='ncapRating'?'★'.repeat(c.ncapRating):(c[r.key]+' '+r.unit));
                    // Trending
                    const trend=trendingData[c.name]||{change:0};
                    let trendIcon='➖',trendClass='trend-flat';
                    if(trend.change>0){trendIcon='📈';trendClass='trend-up';}
                    else if(trend.change<0){trendIcon='📉';trendClass='trend-down';}
                    // Compare vs average
                    let compareHtml='';
                    if(avgs[r.key]!=null&&c[r.key]!=null){
                        const diff=r.asc?avgs[r.key]-c[r.key]:c[r.key]-avgs[r.key];
                        if(Math.abs(diff)>0.001){
                            if(diff>0){compareHtml=`<span class="rank-compare compare-better">👍 优于平均 ${diff.toFixed(1)} ${r.unit}</span>`;}
                            else{compareHtml=`<span class="rank-compare compare-worse">👎 低于平均 ${Math.abs(diff).toFixed(1)} ${r.unit}</span>`;}
                        }
                    }
                    html+=`<div class="rank-item">
                        <span class="rank-num">${rank}</span>
                        <span class="rank-icon">${c.icon}</span>
                        <span class="rank-info"><div class="rank-name">${c.name}</div><div class="rank-detail">${c.brand} | ${c.year} | ${c.power} hp</div></span>
                        <span class="rank-trend ${trendClass}">${trendIcon}</span>
                        ${compareHtml}
                        <span class="rank-value">${val}</span>
                    </div>`;
                });
                html+=`</div>`;
                if(sorted.length>20){html+=`<div class="list-footer-note">仅显示前 20 名,共 ${sorted.length} 款车型符合条件</div>`;}
            }

            document.getElementById('rankContent').innerHTML=html;

            // Render historical timeline
            renderHistory();
        }

            const h=historyData[currentCat]||historyData['accel'];
            document.getElementById('historyTimeline').innerHTML=h.map(d=>`

            document.querySelectorAll('.rank-tab').forEach(x=>x.classList.remove('active'));
            b.classList.add('active');
            currentCat=b.dataset.cat;

        document.getElementById('brandFilter').addEventListener('change',render);
        document.getElementById('priceFilter').addEventListener('change',render);

        const navbar=document.getElementById('navbar'),btt=document.getElementById('backToTop');
        window.addEventListener('scroll',()=>{navbar.classList.toggle('scrolled',window.scrollY>50);btt.classList.toggle('visible',window.scrollY>400);});
        btt.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
        document.getElementById('mobileMenuBtn').addEventListener('click',()=>document.getElementById('navLinks').classList.toggle('active'));
        document.querySelectorAll('#navLinks a').forEach(l=>l.addEventListener('click',()=>document.getElementById('navLinks').classList.remove('active')));
        const btnTheme=document.getElementById('btnThemeToggle'),saved=localStorage.getItem('autohub-theme');
        if(saved==='light'){document.body.classList.add('light-mode');btnTheme.textContent='◑';}
        btnTheme.addEventListener('click',()=>{document.body.classList.toggle('light-mode');const isL=document.body.classList.contains('light-mode');btnTheme.textContent=isL?'◑':'◐';localStorage.setItem('autohub-theme',isL?'light':'dark');});

        // ============ INIT ============
        buildBrandOptions();
        render();
        console.log('%c🏆 排行榜已就绪 | 50+ 车型 | 8 个排行分类 | 品牌筛选 | 价格筛选 | 历史数据 | 趋势指示','color:#ffd700;font-size:1.1em;');
    </script>
</body>
</html>
