            '合欢':{
                name:'合欢',scientific:'Albizia julibrissin',family:'豆科 Fabaceae',genus:'合欢属 Albizia',type:'落叶乔木',
                height:'5-16米',lifespan:'30-100年',region:'亚洲(伊朗至日本)',habitat:'温带至亚热带',
                img:'https://images.unsplash.com/photo-1486912500284-6f2462f4a8e6?w=600&h=600&fit=crop',
                season:'花期6-7月，果期8-10月',conservation:'LC (无危)',etymology:'"合欢"因小叶昼开夜合(睡眠运动)象征夫妻和睦得名。属名Albizia纪念意大利贵族植物学家Albizzi。种加词julibrissin源自波斯语"gul-i abrisham"(丝绸之花)。英文名silk tree(丝绸树)指其花丝如丝。',
                cultural:'合欢在中国文化中象征夫妻和睦、爱情忠贞。"合欢被"、"合欢扇"等词汇反映其美好寓意。杜甫"合欢尚知时，鸳鸯不独宿"以合欢起兴。合欢树在《聊斋志异》中有浪漫传说。',
                description:'合欢是最优美的庭园树木之一，夏季开放粉红色丝绒般的花朵，如满树飘浮的粉红羽毛。合欢的花没有花瓣——吸引人的是其雄蕊(花丝)，众多粉红色花丝细长伸出，组成直径可达5厘米的球形花序。合欢叶片具有"睡眠运动"：白天小叶展开进行光合作用，夜晚小叶成对闭合"睡眠"(由叶枕细胞膨压变化驱动)。这种运动在含羞草中最为著名，但合欢的敏感度较弱(需碰触不会闭合)。合欢木材致密带美丽纹理，是制作家具和乐器的好材料。合欢根部的根瘤菌能固定大气氮素，具有改善土壤肥力的作用。',
                morphology:'落叶乔木，树冠伞形扁平。二回羽状复叶，总叶柄有腺体；羽片4-12对；小叶10-30对镰刀形昼开夜合。头状花序多数排成伞房状圆锥花序；花萼管状5齿；花冠漏斗状5裂，花冠小；雄蕊多数，花丝细长粉红色，伸出花冠外3-4厘米。荚果扁平带状，成熟时褐色，种子间隔排列。',
                growth:'合欢喜光，不耐庇荫。喜温暖气候，较耐寒。对土壤要求不严，耐干旱瘠薄，但以排水良好的沙质壤土最佳。生长速度极快(速生树种)。浅根性。不耐水湿。萌芽力强，耐修剪。',
                value:'合欢是优美的夏季观花庭园树种。合欢皮(树皮)是传统中药，用于安神解郁。合欢树冠扁平伞形，提供夏季遮荫的同时不影响冬季采光。合欢根瘤菌固氮改良土壤。合欢花是优良蜜源。',
                care:'选择阳光充足、排水良好处栽植。保持土壤湿润但忌积水。春季施肥促进枝叶和花。冬季修剪维持树冠伞形。防治合欢枯萎病(萎蔫病)和天牛。繁殖以播种为主。',
                category:'tree',flowerColor:'pink',heightClass:'tall',regionClass:'east_asia'

            '木棉':{
                name:'木棉',scientific:'Bombax ceiba',family:'锦葵科 Malvaceae',genus:'木棉属 Bombax',type:'落叶大乔木',
                height:'10-25米',lifespan:'50-200年',region:'亚洲热带、亚热带',habitat:'低海拔热带季雨林',
                img:'https://images.unsplash.com/photo-1502082553048-f009c37129b9?w=600&h=600&fit=crop',
                season:'花期2-4月(先叶开放)，果期4-6月',conservation:'LC (无危)',etymology:'"木棉"因其果实产棉絮得名(棉来自木而非草)。属名Bombax源自希腊语"bombyx"(丝绸)，指种子纤维。种加词ceiba为南美土著语。英文名red silk-cotton tree(红色丝棉树)。',
                cultural:'木棉被称为"英雄树"(红色花朵如英雄鲜血)，是广州市花和攀枝花市的标志。木棉在中国南方象征豪迈和热情。清代诗人陈恭尹《木棉花歌》"浓须大面好英雄，壮气高冠何落落"为千古名句。',
                description:'木棉是亚洲热带最具标志性的开花大树之一。每年冬末春初，木棉在落尽叶片的秃枝上绽放出大量鲜红色硕大的花朵(直径可达12厘米)，如火如荼，极为壮观，因此得名"英雄树"和"烽火树"。花后结果，蒴果开裂后露出大量白色棉絮状纤维包裹的种子，随风飘散，形成"棉絮纷飞"的独特景象。木棉纤维(木棉絮)是最轻的天然纤维之一(比重仅0.05)，浮力极好，传统用于填充枕头、救生圈和浮具。木棉花(攀枝花)在华南被用作祛湿利尿的药材和靓汤材料。',
                morphology:'落叶大乔木。树干通直，幼树干和枝条上密生圆锥状硬刺(防动物攀爬)。掌状复叶互生，小叶5-7枚长圆形至长圆状披针形。花单生或簇生枝顶叶腋，先叶开放，直径10-12厘米；花瓣5枚肉质鲜红色(稀橙黄色)；雄蕊多数合生成5束。蒴果长椭圆形木质，成熟5裂，内壁有白色棉状纤维包裹种子。种子多数黑色光滑。',
                growth:'木棉喜高温多湿的热带、亚热带气候。喜光不耐阴。对土壤要求不严，但以深厚肥沃的冲积土为佳。耐旱不耐涝。生长速度中等偏快。深根性，抗风力较强。不耐寒(低于5℃受害)。',
                value:'木棉是热带和亚热带地区最壮观的观花大乔木之一。木棉絮是天然浮力材料(制作救生圈和浮标)。木棉花入药可清热祛湿。木棉树干可用于制作独木舟。木棉是重要的生态园林树种。',
                care:'适合热带和亚热带地栽。需充足空间保证树冠发展。幼龄期保持土壤湿润。注意避开人行道(硬刺和落花)。热带以外地区不适合栽培。',
                category:'tree',flowerColor:'pink',heightClass:'tall',regionClass:'east_asia'

            '龙舌兰':{

                height:'花葶可达8米(叶丛1-2米)',lifespan:'10-30年(一次开花后死亡)',region:'墨西哥',habitat:'干旱半干旱高原',
                img:'https://images.unsplash.com/photo-1627483165650-20b8423e5b3b?w=600&h=600&fit=crop',
                season:'花期限于生命末期(10-30年一次)',conservation:'LC (无危)',etymology:'"龙舌兰"因其叶片似龙舌而得名。属名Agave源自希腊语"agavos"(高贵的)。英文名century plant(世纪植物)因误以为100年才开花。种加词americana意为"美洲的"。',
                cultural:'龙舌兰在墨西哥文化中神圣崇高——龙舌兰女神Mayahuel是阿兹特克神话中的生育之神。龙舌兰酒(特基拉Tequila和梅斯卡尔Mezcal)是世界六大烈酒之一，是墨西哥的国家象征。龙舌兰纤维(剑麻)是传统制绳材料。',
                description:'龙舌兰是美洲大陆最具代表性的多肉植物之一。其最传奇的特性是"一次性生殖"(单稔植物semelparous)：植株经过10-30年的营养生长后，在生命的最后一年，仅用数周时间抽出高达6-8米的巨大花葶(世界最高的花序之一)开花结实，然后母株耗尽营养枯死。龙舌兰的心(piña)经蒸煮、发酵和蒸馏制成龙舌兰酒(Tequila使用的蓝色龙舌兰A. tequilana是另一种)。龙舌兰采用CAM光合途径，极端耐旱。剑麻(A. sisalana)是重要的纤维作物。龙舌兰叶片边缘有钩刺，叶尖有坚硬的针刺。',
                morphology:'大型肉质草本。叶丛生成莲座状，叶剑形肥厚，长1-2.5米，灰绿色被白粉，边缘有钩刺或锯齿，叶尖有暗褐色长针刺。花葶(花序轴)高6-8米，从叶丛中心抽出；大型圆锥花序；花漏斗状黄绿色；雄蕊6枚。蒴果。花后母株枯死，但可产生大量珠芽和分株延续后代。',
                growth:'龙舌兰喜炎热干燥、阳光极充足的环境。极耐旱，数月不浇水可存活。怕积水和寒冷。要求排水极佳的沙质或砾质土壤。生长速度慢。经10-30年累积足够营养后才开花。CAM光合途径使其极端节水。',
                value:'蓝色龙舌兰是特基拉酒的原料(墨西哥国家文化遗产)。剑麻是世界重要的硬质纤维。龙舌兰糖浆是天然甜味剂。龙舌兰提取物具有抗炎作用。龙舌兰是干旱地区优良的园林植物。某些种类作为生物燃料原料。',
                care:'选择全日照、排水极佳处栽培。使用沙质多肉介质。浇水遵循干透浇透原则。大型植株容器栽培需选择大而重的盆。注意防刺伤(叶片边缘和尖端极锋利)。耐轻霜但不耐严寒。',

            '铁线蕨':{
                name:'铁线蕨',scientific:'Adiantum capillus-veneris',family:'凤尾蕨科 Pteridaceae',genus:'铁线蕨属 Adiantum',type:'多年生草本蕨类',
                height:'15-40厘米',lifespan:'多年生',region:'全球温带至热带',habitat:'阴湿石灰岩岩缝、水边',
                img:'https://images.unsplash.com/photo-1485968579580-6e15f1f001bd?w=600&h=600&fit=crop',
                season:'孢子成熟期5-8月',conservation:'LC (无危)',etymology:'"铁线蕨"因其叶柄细长黑色如铁丝而得名。属名Adiantum源自希腊语"adiantos"(不被沾湿的)——指其叶片拒水特性。种加词capillus-veneris意为"维纳斯之发"。英文名maidenhair fern(少女发蕨)。',
                cultural:'铁线蕨在古希腊时期就被用作治疗呼吸系统疾病的草药。维多利亚时代英国掀起"蕨类狂热"(pteridomania)，铁线蕨是最受追捧的室内蕨类之一。在中国，铁线蕨常作为假山和盆景的配景植物。',
                description:'铁线蕨是被子植物之外最优雅的绿色植物之一——作为蕨类植物，它没有花和种子，以孢子繁殖，其生活史包括绿色自养配子体(原叶体)和孢子体两个独立阶段。铁线蕨的叶片具有神奇的拒水特性：水滴落在叶片上，水珠圆滚而不沾湿叶面(与荷叶效应类似但机制不同)。铁线蕨喜钙质环境(石灰岩岩缝)，是钙质土的指示植物。叶片(复叶)薄而翠绿，小叶扇状边缘反卷形成假囊群盖，孢子囊着生其下。铁线蕨在室内可增加空气湿度并吸附微粒。铁线蕨不耐干旱，对水分变化极为敏感，是养护最具挑战性的室内蕨类之一。',
                morphology:'多年生草本蕨类，根状茎细长横走被鳞片。叶远生；叶柄长，细瘦黑色光亮，基部有鳞片。叶片卵状三角形薄膜质，二至三回羽状复叶，末回小羽片扇形至斜方形，边缘浅裂至深裂，叶脉扇状二分叉。孢子囊群生于反卷的叶缘(假囊群盖)下，假囊群盖长圆形或肾形。孢子四面体型。',
                growth:'铁线蕨喜阴湿温暖环境，忌强光直射和干燥。喜富含有机质、排水良好但保持湿润的石灰性(pH7-8)基质。空气湿度要求高(>70%)。生长适温18-25℃，不耐寒。对水分极度敏感，稍有干旱即叶片褐枯，但水分恢复后能重新萌发新叶。',
                value:'铁线蕨是世界最受欢迎的室内蕨类植物之一。在传统医学中用于治疗咳嗽和呼吸道疾病。铁线蕨是假山和盆景的重要配景。其优美的叶形在花艺和植物艺术中备受青睐。科研上用于研究叶片拒水机制。',
                care:'保持高湿度(频繁喷雾或使用加湿器)。基质保持湿润但不可积水。使用明亮散射光(勿直射)。喜钙性——可在基质中添加石灰石粉末。冬季保持温暖(>12℃)。修剪枯叶促进新叶萌发。',
                category:'herb',flowerColor:'green',heightClass:'low',regionClass:'global'
            },
            '石斛':{
                name:'铁皮石斛',scientific:'Dendrobium officinale',family:'兰科 Orchidaceae',genus:'石斛属 Dendrobium',type:'多年生附生草本',
                height:'10-50厘米',lifespan:'多年生',region:'中国南方',habitat:'亚热带山地岩石或树干上',
                img:'https://images.unsplash.com/photo-1524594152209-ecf01afdc411?w=600&h=600&fit=crop',
                season:'花期4-6月',conservation:'CR (极危，野生)',etymology:'"石斛"因其生于石上、古时作量器"斛"使用得名。属名Dendrobium源自希腊语"dendron"(树)和"bios"(生命)，指其附生树上。种加词officinale意为"药用的"。英文名同用Dendrobium。',
                cultural:'铁皮石斛在中医药中被誉为"九大仙草之首"(唐《道藏》)。历代视为延年益寿的珍品。因过度采集，"野石斛如金贵"。铁皮石斛文化是中医养生文化的重要组成，近年来大规模人工栽培使其重获普及。',
                description:'铁皮石斛是兰科植物中最著名的药用种类之一，也是中国九大仙草之首。它是一种附生兰(非寄生)，在自然条件下生长在湿润的岩石表面或树干上，通过气生根从大气中吸收水分和养分。铁皮石斛的主要活性成分是石斛多糖(含量高达30-40%)和石斛碱，具有增强免疫、生津养胃、滋阴清热的作用。由于大量采集，野生铁皮石斛已极度濒危。近20年来，人工组织培养和设施栽培技术的突破使铁皮石斛实现了规模化生产，价格从"千金难求"降至大众可及。石斛属是兰科最大的属之一，全球约1500种，多数具有观赏价值。',
                morphology:'附生草本。茎丛生圆柱形肉质，多节。叶互生2列，长圆状披针形，叶鞘抱茎。总状花序生于落叶茎节上，2-5朵花；花被片黄绿色，唇瓣白色有紫色斑，唇盘有胼胝体；合蕊柱短。蒴果。茎干可加工为"铁皮枫斗"(螺旋状加工品)。气生根发达从茎节长出。',
                growth:'石斛喜温暖湿润、半阴环境。适宜附生于树皮粗糙的乔木或湿润岩石上。要求高空气湿度(>70%)。生长适温20-30℃。冬季需8-12℃的温度刺激促进花芽分化。忌积水和强光直射。组织培养苗移栽成活率是技术关键。',
                value:'铁皮石斛是最名贵的中药材之一，用于增强免疫、抗疲劳。石斛多糖是重要的保健食品原料。石斛属植物具有重要的观赏价值(蝴蝶石斛是世界切花)。石斛的附生特性为植物学和生态学研究提供素材。',
                care:'附生栽培于树皮或石板，用苔藓和水苔包裹根部。保持高湿度(每日喷雾)。用极淡的兰花专用肥。冬季控水控温(8-12℃)。家庭推荐用多孔盆+碎树皮+水苔基质。防治蜗牛和介壳虫。',
                category:'herb',flowerColor:'green',heightClass:'medium',regionClass:'china'
            },
            '牵牛花':{
                name:'牵牛花',scientific:'Ipomoea nil',family:'旋花科 Convolvulaceae',genus:'番薯属 Ipomoea',type:'一年生缠绕草本',
                height:'藤蔓可达3米',lifespan:'一年生',region:'热带美洲',habitat:'开阔地、灌丛',
                img:'https://images.unsplash.com/photo-1518707399472-6f1e1e0e6b0a?w=600&h=600&fit=crop',
                season:'花期6-10月(每日清晨开放)',conservation:'LC (无危)',etymology:'"牵牛花"因其花开时正值牵牛星(牛郎星)升起的黎明时分而得名。属名Ipomoea源自希腊语"ips"(蠕虫)和"homoios"(相似)，指其藤蔓如虫爬行。英文名morning glory(早晨的荣耀)描述其清晨开花。',
                cultural:'牵牛花在日本文化中地位崇高，江户时代形成了"朝颜"(牵牛花)的观赏热潮，培育出众多珍奇品种。牵牛花在中国文学中象征勤劳和早晨。日本七夕节(7月7日)前后正是牵牛花盛开期，与牛郎织女传说暗合。',
                description:'牵牛花是夏季最令人愉悦的草花之一。其最迷人的特性是花期极其规律：每朵花在凌晨开放，花瓣展开仅需约30分钟，在上午阳光强烈前盛开，午后即闭合并凋萎，寿命仅一天。这种"朝开午谢"的习性是由于花朵开放后强烈的蒸腾作用导致花瓣迅速失水枯萎。但植株每天能连续产生新花蕾，整个夏季维持不断开花。牵牛花花色极为丰富：蓝色、紫色、粉色、红色、白色及各种条纹、镶边复色。日本培育的牵牛花品种形态极为多样——有轮型、切瓣型、狮子型、桔梗型等变化。番薯(红薯)与牵牛花为同属植物，番薯的花也是典型的喇叭形，但极少开花。',
                morphology:'一年生缠绕草本，全株被硬毛。茎细长左旋缠绕。叶互生宽卵形至近圆形，常3裂。花1-3朵腋生；花萼5深裂；花冠漏斗状(喇叭形)大型，蓝色至紫红色；雄蕊5枚不等长；子房3室。蒴果球形3裂。种子卵状三棱形黑色(中药"牵牛子"/"黑丑""白丑")。',
                growth:'牵牛花喜阳光充足、温暖环境。对土壤要求不严。怕霜冻(一年生夏秋季开花植物)。生长极为迅速，播种后约8-10周开花。每日新花开放在凌晨到清晨。花后结籽数量多，自播能力强。',
                value:'牵牛花是世界最受欢迎的夏季藤本花卉。牵牛花种子(牵牛子)是传统泻下逐水中药(含牵牛子苷，有毒)。牵牛花是阳台和围栏绿化的理想快生植物。日本牵牛花品种是园艺育种的瑰宝。',
                care:'春季直播或育苗移栽。搭建支架供藤蔓攀爬。充足光照促进开花。保持土壤湿润。花后收集种子或任其自播(明年自生)。盆栽注意支架高度。注意种子有毒。',
                category:'vine',flowerColor:'purple',heightClass:'tall',regionClass:'americas'
            },
            '丁香':{
                name:'丁香',scientific:'Syringa vulgaris',family:'木犀科 Oleaceae',genus:'丁香属 Syringa',type:'落叶灌木或小乔木',
                height:'2-7米',lifespan:'20-100年',region:'欧洲东南部(巴尔干)',habitat:'温带丘陵',
                img:'https://images.unsplash.com/photo-1490750967868-88aa4a5ed8db?w=600&h=600&fit=crop',
                season:'花期4-5月',conservation:'LC (无危)',etymology:'"丁香"因花蕾干后形似钉子且有香气得名(与香料丁香/鸡舌香是不同的植物)。属名Syringa源自希腊语"syrinx"(空管)，指其茎中空可做笛。英文名lilac源自波斯语"nilak"(蓝色的)。',
                cultural:'丁香是春末夏初的象征之花。惠特曼在《当紫丁香最近在庭院中开放时》中以丁香悼念林肯。在中国文学中，丁香象征细腻的哀愁——戴望舒《雨巷》描写"丁香一样的结着愁怨的姑娘"。丁香是哈尔滨的市花。',
                description:'丁香是世界最芬芳的春季花木之一，其甜香浓郁的花簇是五月花园的标志性香气。丁香的"花"实际上由数百朵小管状花组成的大型圆锥花序(长可达20厘米)，每朵小花花冠4裂。丁香花以紫色调最为经典，也有白、粉、蓝紫乃至深紫红色品种。丁香花蕾蒸馏可得丁香花精油(与香料丁香油不同)。普通丁香(S. vulgaris)是欧洲东南部原产，传入欧洲其他地区和北美后成为最受欢迎的庭园花木。中国的紫丁香(Syringa oblata)同样美丽，花更密集。丁香耐寒性极强(可耐-35℃)，是北方寒冷地区不可或缺的春花树种。',
                morphology:'落叶灌木或小乔木。叶对生卵形至宽卵形，全缘，叶面光滑。花两性，大型圆锥花序顶生或腋生；花萼小钟形4齿；花冠高脚碟状，花冠管细长，檐部4裂，紫色至白色，芳香；雄蕊2枚。蒴果长椭圆形2裂。茎干中空。',
                growth:'丁香喜阳光充足、冷凉气候(需冬季低温满足休眠需求)。极耐寒。对土壤要求不严，但以排水良好的中性至微碱性壤土最佳。忌积水。生长速度中等。花芽在前一年夏季形成，冬季低温(约7℃以下)积累足够冷量后方可春季正常开花(华南低海拔因冷量不足难开花)。',
                value:'丁香是北方温带最重要的春季花木之一。丁香花可提取香精。丁香蜜是优质花蜜(紫丁香蜜)。丁香木材坚硬细致可制工艺品。丁香是重要的城市绿化树种(耐寒、抗污染)。哈尔滨丁香节是重要城市文化活动。',
                care:'选择阳光充足处栽培。花后及时剪除残花穗(促进次年开花)。冬季休眠期修剪去除病弱枝和萌蘖。每2-3年施一次有机肥。盆栽需冬季室外低温处理(万不可入暖室)。防治白粉病和丁香叶枯病。',
                category:'shrub',flowerColor:'purple',heightClass:'tall',regionClass:'europe'
            },
            '桃树':{
                name:'桃',scientific:'Prunus persica',family:'蔷薇科 Rosaceae',genus:'樱属 Prunus',type:'落叶小乔木',
                height:'3-8米',lifespan:'15-50年',region:'中国',habitat:'温带地区',
                img:'https://images.unsplash.com/photo-1522383225653-ed111a181951?w=600&h=600&fit=crop',
                season:'花期3-4月，果期6-9月',conservation:'LC (无危)',etymology:'"桃"字古老象形，最早的栽培果树之一。《诗经》"桃之夭夭，灼灼其华"为最早的文学描述。属名Prunus为李属拉丁名。种加词persica意为"波斯的"(因桃经波斯传入西方)。英文名peach源自拉丁语persica。',
                cultural:'桃花在中国文化中象征春天、爱情和长寿。陶渊明的《桃花源记》描绘了理想世界(世外桃源)。王安石的"千门万户曈曈日，总把新桃换旧符"描述春节贴桃符的习俗，桃木被视为辟邪之物。桃花运喻指爱情运势。',
                description:'桃是世界上最重要的温带果树之一，原产于中国，已有4000多年的栽培历史，驯化始于中国黄河流域。现代蜜桃品种的糖度可达15-20度。桃与梅、李、杏、樱桃同为蔷薇科樱属植物，可互相嫁接。桃花通常先叶开放(或与叶同放)，花色以粉色最为经典，也有白、红和深红色品种。碧桃是观赏桃花品种，花瓣重瓣多达数十枚，不结实。桃树寿命比一些长寿树较短(一般15-50年)，但"桃李满天下"的比喻说明其繁殖容易。桃木质地细密，传统用于制作桃符和法器辟邪。桃胶(树干分泌物)在中医和中国烹饪中使用。',
                morphology:'落叶小乔木，树冠开张。树皮灰褐色横裂。叶互生披针形至椭圆状披针形，边缘有锯齿。花通常单生，先叶开放，直径3-4厘米；花瓣5枚(或重瓣)，粉红色；雄蕊多数，子房被柔毛。核果(桃子)近球形，被绒毛，果肉多汁；核坚硬有沟纹，含种子1枚(苦杏仁苷，有毒)。',
                growth:'桃喜光，极不耐阴。喜温暖气候，耐寒。要求排水良好、肥沃的沙质壤土。怕涝(积水24小时可导致死树)。生长旺盛(速生)，但寿命较短。核果类连作障碍严重(老桃园重植幼树生长不良——"再植病")。实生苗3-4年结果，嫁接苗次年可结果。',
                value:'桃是世界最重要的温带水果之一。桃花观赏价值高——碧桃是春季重要观花树种。桃仁可榨油和药用(含苦杏仁苷)。桃胶用于食品和中药。桃木用于工艺品。桃花蜜是优质春蜜。',
                care:'选择阳光充足、排水良好处栽培。冬季修剪(桃树需重度修剪维持树形和结果)。开花前后施追肥。疏果(过密影响品质)。防治桃穿孔病、桃缩叶病和桃蛀螟。注意防治流胶病。',
                category:'tree',flowerColor:'pink',heightClass:'tall',regionClass:'china'
            },
            '石榴':{
                name:'石榴',scientific:'Punica granatum',family:'千屈菜科 Lythraceae',genus:'石榴属 Punica',type:'落叶灌木或小乔木',
                height:'2-6米',lifespan:'50-200年',region:'中亚至地中海',habitat:'干燥亚热带',
                img:'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600&h=600&fit=crop',
                season:'花期5-7月，果期8-10月',conservation:'LC (无危)',etymology:'"石榴"一名源自其原产地古代安石国(今伊朗地区)，"榴"为音译。属名Punica源自拉丁语"Punicus"(迦太基的)。种加词granatum意为"多粒的"。英文名pomegranate源自拉丁语"pomum granatum"(多粒苹果)。',
                cultural:'石榴在世界多种文化中象征生命、丰饶和多子多福。在希腊神话中，石榴是冥后珀耳塞福涅的食物(因此每年一半时间留在冥界)。在中国民俗中，石榴、桃子、佛手并称"三多"(多子、多寿、多福)。石榴是西班牙国花(石榴花)。',
                description:'石榴是世界上栽培历史最悠久的果树之一，可追溯至5000多年前的中东和地中海地区。石榴果实独特——外部是一层坚硬的果皮(果皮厚约4-6毫米)，内部被白色海绵质隔膜分为数室，每室密布晶莹剔透的红宝石状假种皮(种子外被肉质多汁的外种皮)，这就是可食用的"石榴籽"。一个石榴通常含有200-1400颗籽粒。石榴汁富含多酚类抗氧化物质(主要是石榴苷和鞣花酸)，其抗氧化能力是红葡萄酒和绿茶的两倍以上。石榴花鲜红如火，重瓣石榴花(牡丹石榴)是不结果实的观赏品种。石榴耐旱、耐盐碱、耐修剪，是温带至亚热带地区理想的果树和观赏树。',
                morphology:'落叶灌木或小乔木。枝常有刺。叶对生或簇生，倒卵形至长圆形，全缘光滑。花单生或数朵簇生枝顶或叶腋；花萼钟形肉质5-7裂宿存；花瓣5-7枚，鲜红色(或白色、杂色)皱褶状；雄蕊多数。浆果球形(石榴)，果皮革质，宿存花萼。种子多数，外包肉质多汁外种皮。',
                growth:'石榴喜炎热干燥、阳光充足气候。耐旱性极强，耐轻寒(-15℃)。对土壤要求不严，耐盐碱、耐贫瘠，但以排水良好的石灰性沙壤土果实品质最佳。生长速度快(速生)。结果早，扦插苗2-3年结果。极耐修剪，可造型为单干树或灌木丛。',
                value:'石榴是重要的温带至亚热带水果。石榴汁是国际超级食品饮料。石榴皮含大量鞣质用于鞣革和染料。石榴花是优良观赏花木。石榴提取物在护肤品中有抗氧化应用。石榴是盆景和园林造型的优良材料。',
                care:'选择阳光充足、排水良好处栽培。冬季轻剪维持树形。春季施有机肥促进开花结果。耐旱不用频繁浇水。果实套袋防虫。北方寒冷地区(低于-15℃)需冬季防寒。防治石榴蚜虫和干腐病。',
                category:'shrub',flowerColor:'pink',heightClass:'tall',regionClass:'europe'
            },
            '紫薇':{
                name:'紫薇',scientific:'Lagerstroemia indica',family:'千屈菜科 Lythraceae',genus:'紫薇属 Lagerstroemia',type:'落叶灌木或小乔木',
                height:'3-7米',lifespan:'20-100年',region:'东亚至东南亚',habitat:'亚热带至温带',
                img:'https://images.unsplash.com/photo-1558618666-fcd25c85f82e?w=600&h=600&fit=crop',
                season:'花期6-9月(夏秋百日红)',conservation:'LC (无危)',etymology:'"紫薇"因其花色紫红、"薇"为美花之意得名。又称"百日红"(花期长达百日)。属名Lagerstroemia纪念瑞典商人植物学家Lagerström。英文名crape myrtle(绉纱桃金娘)指花瓣如绉纱。',
                cultural:'紫薇在中国文化中象征官运亨通(紫薇星为帝星，唐代中书省因植紫薇称"紫薇省")。杜牧曾任中书舍人，世称"杜紫薇"。紫薇是"盛夏之花"，在百花凋零的盛夏绽放百日。紫薇是安阳、徐州等城市的市花。',
                description:'紫薇是夏季和初秋最可靠的观花树木之一，在盛夏高温少花的季节，紫薇绽放出大量粉色至紫色的花朵，花期持续60-100天——因此得名"百日红"。紫薇花瓣极其独特：花瓣6枚，形如绉纱(皱缩卷曲)，触感丝滑，不像花瓣更像纸花。紫薇树干光滑如镜，树皮片状剥落后露出光滑的灰白色或淡褐色新树皮，触摸凉爽——因此也称"无皮树"、"痒痒树"(据说搔树干植株会"发痒"摇动，实为风吹所致)。紫薇花色有紫红、粉、白及各种中间色。紫薇木材坚硬耐腐，传统用于制秤杆。紫薇对大气污染抗性强，是城市绿化的优良树种。',
                morphology:'落叶灌木或小乔木。树皮灰白色光滑片状剥落。叶对生或近对生，椭圆形至倒卵形，全缘。圆锥花序顶生大型；花密集；花萼陀螺形6裂；花瓣6枚具长爪，瓣片皱缩波状，紫红色至白色；雄蕊多数(约36-42枚)。蒴果近球形，室背开裂，花柱和花萼宿存。种子有翅。',
                growth:'紫薇喜光，极喜阳光(光照不足花少)。喜温暖气候，耐轻寒。对土壤要求不严，耐旱、耐瘠薄。生长速度中等偏快。花期长(夏至秋)。耐修剪，冬季可重剪(促进次年新枝萌发和新枝开花)。抗污染能力强。',
                value:'紫薇是夏季最重要的观花树木之一。紫薇古桩盆景造型奇特(可嫁接多色)。紫薇木材可制秤杆和工艺品。紫薇在城市绿化中抗污应用广泛。紫薇花是夏秋季蜜源。紫薇提取物有降血糖研究。',
                care:'冬季重度修剪(紫薇在新枝上开花)。春季施肥促进新枝萌发。花后剪残花穗可促进二次开花。保持充足光照。防治紫薇蚜虫和白粉病。紫薇蚜虫分泌蜜露诱发煤污病。',
                category:'tree',flowerColor:'pink',heightClass:'tall',regionClass:'east_asia'
            },
            '黄芪':{
                name:'黄芪',scientific:'Astragalus mongholicus',family:'豆科 Fabaceae',genus:'黄芪属 Astragalus',type:'多年生草本',
                height:'30-80厘米',lifespan:'多年生',region:'中国北方、蒙古',habitat:'干旱草原、沙地',
                img:'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600&h=600&fit=crop',
                season:'花期6-8月，果期7-9月',conservation:'NT (近危，野生)',etymology:'"黄"指根色黄，"芪"为"耆"的简化，意为"长、老"，指其药为补药之长。属名Astragalus源自希腊语"astragalos"(骰子)，形容种子形状。英文名milkvetch(奶野豌豆)。',
                cultural:'黄芪在中医药中与人参齐名，《神农本草经》列为上品。李时珍赞其"补药之长"，善补一身之气。黄芪是中医扶正固本的核心药材。在西北地区，黄芪炖鸡是传统滋补膳食。',
                description:'黄芪是世界最重要的补气药之一，与人参、当归并称三大补药。黄芪的主要活性成分包括黄芪多糖(免疫调节)、黄芪甲苷(抗炎、保护心肾)和异黄酮类(抗氧化)。黄芪多糖能够激活巨噬细胞和T细胞，增强机体免疫力，在抗肿瘤和抗HIV研究中显示出辅助治疗潜力。中国黄芪以山西浑源的"北芪"和甘肃的"红芪"品质最佳(道地药材)。野生黄芪因过度采挖已近危，种植黄芪需2-4年才能采收。黄芪属植物种类极多(全球约3000种)，是豆科植物中最大的属，但药用种类仅限少数几种。',
                morphology:'多年生草本，主根粗壮长圆柱形，外表黄棕色断面黄白色具粉性。茎直立多分枝被白色柔毛。奇数羽状复叶互生，小叶15-31枚椭圆形至卵状长圆形。总状花序腋生；花淡黄色；蝶形花冠，旗瓣较大。荚果膜质膨胀，被短毛，成熟时黑色。种子肾形。',
                growth:'黄芪喜阳光充足、凉爽干燥的大陆性气候。极耐旱、耐寒。要求排水良好的沙质或沙壤质钙质土壤。深根性主根入土可达1米以上。生长较缓慢，栽培品需2-4年才能采收(年限越长品质越好)。忌连作。',
                value:'黄芪是中药最重要的补气药之一。黄芪多糖用于免疫调节保健品。黄芪提取物在护肤品中有抗衰老应用。黄芪是草原生态修复和固沙植物。黄芪在兽医中广泛使用。国际保健品市场对黄芪提取物需求逐年增长。',
                care:'选择沙质疏松、排水良好土壤。播种前种子需处理(砂磨打破硬实)。生长期间控制杂草。栽培2-4年后秋季采收根部。采收后洗净切片晒干。注意防治白粉病和蚜虫。',
                category:'herb',flowerColor:'purple',heightClass:'medium',regionClass:'china'
            },
            '雪松':{
                name:'雪松',scientific:'Cedrus deodara',family:'松科 Pinaceae',genus:'雪松属 Cedrus',type:'常绿大乔木',
                height:'20-50米',lifespan:'100-1000年',region:'喜马拉雅山脉',habitat:'山地(海拔1500-3200米)',
                img:'https://images.unsplash.com/photo-1502082553048-f009c37129b9?w=600&h=600&fit=crop',
                season:'花期10-11月(秋季)，球果次年成熟',conservation:'LC (无危)',etymology:'"雪松"因其耐寒、松针在雪中仍苍翠得名。属名Cedrus源自拉丁语"cedrus"(雪松)。种加词deodara源自梵语"deva-daru"(神之木)。英文名Himalayan cedar/deodar。',
                cultural:'雪松在印度被视为神树，"deodar"在梵语中意为"神的木材"，喜马拉雅山麓的印度教寺庙常用雪松木建造。雪松是黎巴嫩的国树，黎巴嫩国旗中央为雪松图案(圣经中雪松象征力量和永恒)。雪松木材在古埃及用于建造神庙和制作棺椁。',
                description:'雪松是世界最美丽的高山针叶树之一，原产于喜马拉雅山脉西段(阿富汗至印度北部)的雪松(Cedrus deodara)，与黎巴嫩雪松(C. libani)、阿特拉斯雪松(C. atlantica)和塞浦路斯雪松(C. brevifolia)共同组成雪松属的四个物种。雪松的树冠是辨识的关键特征：幼树为金字塔形(塔形/尖塔形)，随年龄增加顶端逐渐变平(平顶形)。雪松的枝条优雅平展，大枝呈"台级"状分层，末端细枝柔软下垂。雪松的针叶三棱形坚硬锐尖，生于短枝上成簇。其球果直立枝顶，成熟时种鳞从顶部向下逐片脱落(与松属球果不同)，球形果轴宿存枝上。雪松木材富含芳香树脂(雪松醇)，天然防虫防腐，是古印度和古埃及的建筑和造船材料。雪松还是重要的园林观赏树，世界温带地区广泛栽培。',
                morphology:'常绿大乔木，树冠幼时尖塔形、老时平顶。树皮深灰色鳞片状。枝分长短枝，长枝上叶螺旋排列，短枝上叶簇生。针叶三棱形刚硬，长2.5-5厘米。球果直立卵球形长7-12厘米，种鳞宽扇形木质，苞鳞短小不露。种子有宽大的膜质翅。雌雄同株，雄球花圆柱形黄色。球果两年成熟。',
                growth:'雪松喜阳光充足、凉爽湿润气候。喜深厚肥沃、排水良好的微酸性至中性土壤。耐寒(可耐-20℃)。不耐空气污染(SO2敏感)。生长速度中等(年均生长量30-50厘米)。寿命可达千年。幼苗期需适当遮荫，成年树需全光照。',
                value:'雪松木材芳香耐腐，是优质建材和家具用材。雪松精油(雪松醇)广泛用于香水和芳香疗法。雪松是世界最重要的园林观赏针叶树之一。雪松树脂在古埃及用于木乃伊防腐。雪松林是喜马拉雅山区重要的生态系统。',
                care:'选择阳光充足、空间开阔处栽培(需大空间)。保持土壤排水良好但不干旱。幼苗期需防风。春季施肥促进生长。夏季干旱时适量浇水。防治雪松叶枯病和松毛虫。不宜在城市污染严重区域种植。',
                category:'tree',flowerColor:'green',heightClass:'tall',regionClass:'east_asia'
            },
            '腊梅':{
                name:'腊梅',scientific:'Chimonanthus praecox',family:'蜡梅科 Calycanthaceae',genus:'蜡梅属 Chimonanthus',type:'落叶灌木',
                height:'2-5米',lifespan:'30-100年',region:'中国',habitat:'温带山地灌丛',
                img:'https://images.unsplash.com/photo-1547519969-0b7a5e18e9b1?w=600&h=600&fit=crop',
                season:'花期12月-次年3月(腊月寒冬)，果期6-8月',conservation:'LC (无危)',etymology:'"腊梅"因其在腊月(农历十二月)开花而得名(非"蜡"梅，花非蜡质)。属名Chimonanthus源自希腊语"cheimon"(冬季)和"anthos"(花)。种加词praecox意为"早的"(早花)。英文名wintersweet(冬之甜)。',
                cultural:'腊梅是中国唯一在寒冬蜡月开花的香花，与梅花并称"寒香二友"。腊梅香气甜沁，是冬末最珍贵的户外香花来源。中国古人以"踏雪寻梅"为雅事(所说之"梅"常实指腊梅)。腊梅是传统插花和年宵花的重要材料。',
                description:'腊梅是寒冬和早春最珍贵的香花灌木之一，在大多数植物休眠的严寒中，腊梅的黄色蜡质小花在光秃的枝条上开放，散发出清甜可人的香气——这是冬季最令人惊喜的自然馈赠。腊梅与梅花虽有"梅"字的联系，但两者亲缘关系很远：梅花是蔷薇科植物，腊梅则为蜡梅科(Calycanthaceae)的成员。腊梅花的外轮花被片(12-16枚)黄色蜡质透明，内轮花被片较小深紫红色，这种独特的黄紫对比使得腊梅花极具辨识度。腊梅的花期可持续1-2个月，单朵花可维持10-15天，香气在温暖的中午最浓。腊梅不仅供观赏，其花蕾在中药中用于治疗咳嗽和咽喉不适。腊梅品种有素心腊梅(内轮花被片全黄)、磬口腊梅(花较大)和狗牙腊梅(较小)等。',
                morphology:'落叶灌木，多分枝丛生。树皮灰褐色。叶对生，椭圆形至卵状披针形，全缘，表面粗糙。花单生叶腋，先叶开放于前年枝上(腊月至次年早春)；花被片多数螺旋排列，外轮黄色蜡质12-16枚，内轮较短深紫红色；雄蕊5-6枚短；心皮多数离生着生于壶状花托内。聚合瘦果包于坛状花托内，成熟时褐色。',
                growth:'腊梅喜阳光充足，也耐半阴。喜温暖湿润气候，较耐寒(可耐-15℃)。对土壤要求不严，但以排水良好的微酸性至中性壤土最佳。忌水湿。生长速度中等偏慢。花芽在前一年夏季形成，冬季低温后开放。实生苗需3-5年开花，嫁接苗次年可开花。',
                value:'腊梅是冬季最重要的香花灌木。腊梅花可窨制腊梅花茶和提取腊梅香精。腊梅花蕾在中医中用于治疗咳嗽和咽喉炎。腊梅是传统年宵切花。腊梅盆景是中国传统艺术。腊梅花是冬季罕见的花蜜来源。',
                care:'选择阳光充足或半阴避风处栽培。花后(早春)修剪，去除病弱枝和过密枝。夏末施磷钾肥促进花芽形成。秋季保持稍干燥促进花芽成熟。防治叶斑病和介壳虫。嫁接苗的花更大更香。',
                category:'shrub',flowerColor:'yellow',heightClass:'medium',regionClass:'china'
            },
            '鹅掌楸':{
                name:'鹅掌楸',scientific:'Liriodendron chinense',family:'木兰科 Magnoliaceae',genus:'鹅掌楸属 Liriodendron',type:'落叶大乔木',
                height:'20-40米',lifespan:'50-300年',region:'中国(长江以南)、越南',habitat:'山地常绿落叶阔叶混交林',
                img:'https://images.unsplash.com/photo-1486912500284-6f2462f4a8e6?w=600&h=600&fit=crop',
                season:'花期5-6月，果期9-10月',conservation:'NT (近危)',etymology:'"鹅掌楸"因其叶形如鹅掌、树似楸树而得名。又称"马褂木"(叶形似马褂)。属名Liriodendron源自希腊语"leirion"(百合)和"dendron"(树)——指其花似百合。英文名Chinese tulip tree(中国郁金香树)。',
                cultural:'鹅掌楸是第三纪孑遗植物，与北美鹅掌楸(L. tulipifera)构成东亚-北美间断分布的经典例证。鹅掌楸在西方园林中极为珍视(郁金香形的花和独特的叶形)。其"活化石"身份使得鹅掌楸在植物地理学和进化研究中占有重要地位。',
                description:'鹅掌楸是木兰科植物中最独特、最美丽的种类之一，与北美鹅掌楸(Liriodendron tulipifera)是世界仅有的两种鹅掌楸属植物——这是东亚-北美洲际间断分布的经典范例。鹅掌楸的叶片形状独一无二：叶片4-6裂，先端平截或微凹，形如中国旧式马褂，因此得名"马褂木"。北美鹅掌楸是美国的东部森林重要用材树种(Tulip poplar/yellow poplar，虽然与杨树无关)，也是田纳西和印第安纳等州的州树。鹅掌楸的花呈杯状如郁金香：花被9枚，外3枚绿色萼片状反卷，内6枚黄绿色直立，基部有橙色蜜腺带。杂交鹅掌楸(L. chinense x L. tulipifera)兼具双亲的优势，在园林中广泛栽培。',
                morphology:'落叶大乔木，树干通直，树皮灰白色纵裂。叶互生，叶片4-6裂，先端平截或微凹，叶片长宽近等，形如马褂。花单生枝顶，直径5-6厘米；花被9枚，外3枚绿色反卷，内6枚黄绿色直立，基部有橙色带；雄蕊多数；雌蕊群有柄。聚合翅果纺锤形，小坚果有狭长翅，成熟时从果轴脱落。与北美鹅掌楸的区别在于中国种的花被片绿色，北美种花被片橙黄色。',
                growth:'鹅掌楸喜温暖湿润气候。喜光，幼苗稍耐阴。要求深厚肥沃、排水良好的酸性至中性土壤。生长速度中等偏快(速生)。不耐干旱和水涝。对SO2敏感。寿命长。种子发芽率因授粉不良偏低(自然结实率仅约10-15%)。',
                value:'鹅掌楸是世界著名的园林观赏树木(叶形奇特、花如郁金香)。鹅掌楸木材(美国鹅掌楸)是重要的细工用材和黄杨木替代品。鹅掌楸是研究植物地理学(东亚-北美间断分布)的模式物种。鹅掌楸花是重要的蜜源。杂交鹅掌楸在园林绿化中应用广泛。',
                care:'选择阳光充足、土壤深厚肥沃处栽培。幼苗期保持土壤湿润。移植需带土球。春季施有机肥。花后修剪去除枯枝。防治鹅掌楸褐斑病和天牛。杂交鹅掌楸适应性更广，是城市绿化的优良选择。',
                category:'tree',flowerColor:'multi',heightClass:'tall',regionClass:'china'
            }
        };

        // ==================== MAIN RENDER ====================
        const urlP = new URLSearchParams(window.location.search);
        const plantName = urlP.get('plant') || '银杏';
        const data = detailDB[plantName] || detailDB['银杏'];
        document.getElementById('breadcrumbPlant').textContent = data.name;
        document.title = data.name + ' · FloraMundi';

        // Related plants (same category, random shuffle)
        function getRelatedPlants(data, count) {
            const sameCategory = Object.entries(detailDB)
                .filter(([name, d]) => d.category === data.category && name !== data.name);
            for (let i = sameCategory.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [sameCategory[i], sameCategory[j]] = [sameCategory[j], sameCategory[i]];
            }
            return sameCategory.slice(0, count);
        }
        const relatedPlants = getRelatedPlants(data, 6);

        function buildRelatedHTML(plants) {
            if (plants.length === 0) return '';
            let html = '<div class="related-grid">';
            plants.forEach(([name, d]) => {
                html += `
                <a class="related-card" href="flora_detail.html?plant=${encodeURIComponent(name)}" title="${d.scientific}">
                  <div class="related-img" style="background-image:url('${d.img}');background-color:#e8f5e9;"></div>
                  <div class="related-name">${d.name}</div>
                  <div class="related-sci">${d.scientific}</div>
                </a>`;
            });
            html += '</div>';
            return html;
        }

        function buildAnchorNav() {
            return `
            <div class="anchor-nav">
              <a href="#section-overview">📖 概述</a>
              <a href="#section-morphology">🔬 形态</a>
              <a href="#section-season">🌸 物候</a>
              <a href="#section-etymology">📚 语源</a>
              <a href="#section-cultural">🎭 文化</a>
              <a href="#section-growth">🌱 习性</a>
              <a href="#section-value">💎 价值</a>
              <a href="#section-conservation">🛡️ 保护</a>
              <a href="#section-care">🪴 栽培</a>
              <a href="#section-related">🔗 相关</a>
            </div>`;
        }

        function getConservationBadge(status) {
            if (!status) return '<span class="tag">未评估</span>';
            const code = status.split(' ')[0].toLowerCase();
            const cls = ['lc','nt','vu','en','cr','dd'].includes(code) ? code : 'dd';
            const labels = {lc:'无危',nt:'近危',vu:'易危',en:'濒危',cr:'极危',dd:'数据缺乏'};
            return `<span class="conservation-badge ${cls}">${labels[cls]||status}</span>`;
        }

        document.getElementById('detailContent').innerHTML = `
        ${buildAnchorNav()}
        <div class="detail-hero" id="section-overview">
          <div class="detail-img" style="background-image:url('${data.img}');background-color:#e8f5e9;"></div>
          <div class="detail-info">
            <h1>${data.name}</h1>
            <span class="sci-name">${data.scientific}</span>
            <div class="info-grid">
              <div class="info-item"><span class="info-label">科</span><div class="info-value">${data.family}</div></div>
              <div class="info-item"><span class="info-label">属</span><div class="info-value">${data.genus}</div></div>
              <div class="info-item"><span class="info-label">类型</span><div class="info-value">${data.type}</div></div>
              <div class="info-item"><span class="info-label">高度</span><div class="info-value">${data.height}</div></div>
              <div class="info-item"><span class="info-label">寿命</span><div class="info-value">${data.lifespan}</div></div>
              <div class="info-item"><span class="info-label">分布</span><div class="info-value">${data.region}</div></div>
            </div>
            <div class="tag-row">
              ${data.conservation ? getConservationBadge(data.conservation) : ''}
              ${data.habitat ? '<span class="tag">'+data.habitat+'</span>' : ''}
            </div>
          </div>
        </div>
        <div class="section-card" id="section-overview-text"><h2>📖 植物概述</h2><p>${data.description}</p></div>
        <div class="section-card" id="section-morphology"><h2>🔬 形态特征</h2><p>${data.morphology}</p></div>
        ${data.season ? `<div class="section-card" id="section-season"><h2>🌸 物候与季节</h2><p>${data.season}</p></div>` : ''}
        ${data.etymology ? `<div class="section-card" id="section-etymology"><h2>📚 名称语源</h2><p>${data.etymology}</p></div>` : ''}
        ${data.cultural ? `<div class="section-card" id="section-cultural"><h2>🎭 文化意义</h2><p>${data.cultural}</p></div>` : ''}
        <div class="section-card" id="section-growth"><h2>🌱 生长习性</h2><p>${data.growth}</p></div>
        <div class="section-card" id="section-value"><h2>💎 价值与用途</h2><p>${data.value}</p></div>
        ${data.conservation ? `<div class="section-card" id="section-conservation"><h2>🛡️ 保护状况</h2><p>IUCN保护等级：<strong>${data.conservation}</strong></p><p>保护植物就是保护地球的生命多样性。请勿采集野生植株，支持人工种植的可持续利用方式。</p></div>` : ''}
        <div class="section-card" id="section-care"><h2>🪴 栽培要点</h2><p>${data.care}</p></div>
        <div class="section-card" id="section-related"><h2>🔗 相关植物</h2>${buildRelatedHTML(relatedPlants)}</div>
      `;

        // ==================== CANVAS ANIMATION ====================
        const canvas = document.getElementById('heroCanvas');
        if (canvas) {
            const ctx = canvas.getContext('2d');
            canvas.width = Math.min(1000, window.innerWidth - 30);
            canvas.height = 300;
            const particles = [];
            const maxParticles = 35;

            function createParticle() {
                return {
                    x: Math.random() * canvas.width,
                    y: canvas.height + 10,
                    r: Math.random() * 3 + 1.5,
                    vx: (Math.random() - 0.5) * 0.8,
                    vy: -(Math.random() * 1.5 + 0.8),
                    life: 1,
                    decay: Math.random() * 0.003 + 0.002,
                    color: `rgba(${45+Math.random()*40},${106+Math.random()*50},${79+Math.random()*40},`,
                };
            }

            function drawPollen(p) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = p.color + (p.life * 0.5) + ')';
                ctx.fill();
                // Glow effect
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r * 2.5, 0, Math.PI * 2);
                ctx.fillStyle = p.color + (p.life * 0.1) + ')';
                ctx.fill();
            }

            function drawStem() {
                const cx = canvas.width / 2;
                const baseY = canvas.height;
                const stemHeight = 180 + Math.sin(Date.now() / 3000) * 15;
                const topY = baseY - stemHeight;

                // Main stem
                ctx.strokeStyle = '#2d6a4f';
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(cx, baseY);
                ctx.quadraticCurveTo(cx - 10, baseY - stemHeight * 0.6, cx, topY);
                ctx.stroke();

                // Leaves
                const leaves = [
                    { y: baseY - 40, dx: -60, angle: -0.4 },
                    { y: baseY - 80, dx: 55, angle: 0.5 },
                    { y: baseY - 120, dx: -50, angle: -0.35 },
                    { y: baseY - 150, dx: 40, angle: 0.45 },
                ];
                leaves.forEach(leaf => {
                    const sway = Math.sin(Date.now() / 2000 + leaf.y) * 3;
                    const lx = cx + sway;
                    const ly = leaf.y;
                    ctx.save();
                    ctx.translate(lx, ly);
                    ctx.rotate(leaf.angle);
                    ctx.fillStyle = '#40916c';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 22, 8, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#52b788';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 16, 5, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });

                // Bud at top
                const budY = topY;
                ctx.fillStyle = '#52b788';
                ctx.beginPath();
                ctx.arc(cx, budY, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#d8f3dc';
                ctx.beginPath();
                ctx.arc(cx - 2, budY - 2, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                drawStem();

                // Update and draw particles
                if (particles.length < maxParticles && Math.random() < 0.4) {
                    particles.push(createParticle());
                }
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx + Math.sin(Date.now() / 3000 + i) * 0.3;
                    p.y += p.vy;
                    p.life -= p.decay;
                    if (p.life <= 0 || p.y < -20) {
                        particles.splice(i, 1);
                    } else {
                        drawPollen(p);
                    }
                }
                requestAnimationFrame(animate);
            }
            animate();
        }

        // ==================== PLANT IDENTIFICATION KEY ====================
        function identifyPlant() {
            const type = document.getElementById('idType').value;
            const flowerColor = document.getElementById('idFlowerColor').value;
            const height = document.getElementById('idHeight').value;
            const region = document.getElementById('idRegion').value;

            let candidates = Object.entries(detailDB);

            if (type) candidates = candidates.filter(([n, d]) => d.category === type);
            if (flowerColor) candidates = candidates.filter(([n, d]) => d.flowerColor === flowerColor);
            if (height) candidates = candidates.filter(([n, d]) => d.heightClass === height);
            if (region) candidates = candidates.filter(([n, d]) => d.regionClass === region);

            const resultDiv = document.getElementById('idResult');
            if (candidates.length === 0) {
                resultDiv.className = 'id-result show';
                resultDiv.innerHTML = '<h3>未找到匹配的植物</h3><p>请尝试减少筛选条件或更换特征组合。</p>';
            } else {
                resultDiv.className = 'id-result show';
                let html = `<h3>找到 ${candidates.length} 种可能的植物</h3><div style="display:flex;flex-wrap:wrap;gap:0.5rem;margin-top:0.5rem;">`;
                candidates.slice(0, 12).forEach(([name, d]) => {
                    html += `<span class="result-link" onclick="window.location.href='flora_detail.html?plant=${encodeURIComponent(name)}'" title="${d.scientific}">${d.name}</span>`;
                });
                if (candidates.length > 12) html += `<span style="font-size:0.8rem;color:var(--text-muted);">...及其他 ${candidates.length - 12} 种</span>`;
                html += '</div>';
                resultDiv.innerHTML = html;
            }
        }

        function resetIdKey() {
            document.getElementById('idType').value = '';
            document.getElementById('idFlowerColor').value = '';
            document.getElementById('idHeight').value = '';
            document.getElementById('idRegion').value = '';
            document.getElementById('idResult').className = 'id-result';
        }
    </script>
</body>
</html>
