<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国家文化库 · 文化寰宇</title>
    <style>
        :root {
            --bg-cream: #fdf6ee;
            --bg-card: #ffffff;
            --text-primary: #3d3226;
            --text-secondary: #6b5d4f;
            --text-muted: #9b8b7a;
            --accent-terracotta: #c67b5c;
            --accent-sage: #8b9d83;
            --accent-ochre: #d4a853;
            --border-warm: #e8dccf;
            --shadow-soft: 0 4px 20px rgba(61,50,38,0.06);
            --shadow-medium: 0 8px 30px rgba(61,50,38,0.1);
            --radius-xl: 1.5rem;
            --radius-md: 0.75rem;
            --transition-gentle: 0.3s cubic-bezier(0.4,0,0.2,1);
            --font-body: 'Georgia','Noto Serif SC',serif;
            --font-heading: 'Palatino','Noto Serif SC',serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:var(--font-body); background:var(--bg-cream); color:var(--text-primary); min-height:100vh; padding-bottom:4rem; }
        .navbar { position:sticky; top:0; z-index:100; background:rgba(253,246,238,0.88); backdrop-filter:blur(16px); border-bottom:1px solid var(--border-warm); padding:0.8rem 2rem; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1rem; }
        .logo { font-family:var(--font-heading); font-size:1.5rem; font-weight:700; color:var(--accent-terracotta); cursor:pointer; }
        .nav-links { display:flex; gap:1.3rem; list-style:none; flex-wrap:wrap; }
        .nav-links a { color:var(--text-secondary); text-decoration:none; font-size:0.88rem; transition:0.2s; }
        .nav-links a:hover, .nav-links a.active { color:var(--accent-terracotta); }

        .page-header { text-align:center; padding:3rem 1rem 1.5rem; }
        .page-header h1 { font-family:var(--font-heading); font-size:2.5rem; margin-bottom:0.5rem; }
        .page-header .divider { width:40px; height:3px; background:var(--accent-terracotta); margin:0.8rem auto; border-radius:2px; }

        /* Search bar */
        .search-bar { max-width:550px; margin:0 auto 2rem; }
        .search-bar input { width:100%; padding:0.9rem 1.5rem; border-radius:3rem; border:1px solid var(--border-warm); background:var(--bg-card); font-family:var(--font-body); font-size:1rem; color:var(--text-primary); outline:none; box-shadow:var(--shadow-soft); transition:border-color var(--transition-gentle); }
        .search-bar input:focus { border-color:var(--accent-terracotta); box-shadow:var(--shadow-medium); }

        .main-layout { display:flex; gap:2rem; padding:1rem 2rem; max-width:1300px; margin:0 auto; }
        .filter-sidebar { width:240px; flex-shrink:0; background:var(--bg-card); border:1px solid var(--border-warm); border-radius:var(--radius-xl); padding:1.5rem; position:sticky; top:100px; height:fit-content; box-shadow:var(--shadow-soft); }
        .filter-sidebar h3 { font-family:var(--font-heading); color:var(--accent-sage); margin-bottom:1rem; font-size:1.1rem; }
        .filter-group { margin-bottom:1.3rem; }
        .filter-group label { display:block; font-weight:600; font-size:0.85rem; margin-bottom:0.4rem; color:var(--text-secondary); }
        .filter-group select { width:100%; padding:0.6rem; border:1px solid var(--border-warm); border-radius:var(--radius-md); font-family:var(--font-body); background:var(--bg-cream); color:var(--text-primary); cursor:pointer; }
        .filter-group .chip-row { display:flex; flex-wrap:wrap; gap:0.4rem; }
        .filter-chip { padding:0.35rem 0.8rem; border-radius:2rem; font-size:0.75rem; border:1px solid var(--border-warm); background:var(--bg-cream); cursor:pointer; transition:all var(--transition-gentle); color:var(--text-secondary); }
        .filter-chip.active { background:var(--accent-sage); color:#fff; border-color:var(--accent-sage); }
        .reset-btn { width:100%; padding:0.6rem; border:1px solid var(--border-warm); border-radius:2rem; background:var(--bg-card); color:var(--text-secondary); cursor:pointer; font-family:var(--font-body); margin-top:0.5rem; transition:all var(--transition-gentle); }
        .reset-btn:hover { background:var(--accent-terracotta); color:#fff; border-color:var(--accent-terracotta); }

        /* Stats bar */
        .stats-mini { display:flex; gap:1.5rem; margin-bottom:1rem; flex-wrap:wrap; }
        .stat-mini { font-size:0.8rem; color:var(--text-muted); }
        .stat-mini strong { color:var(--accent-sage); }

        .country-grid { flex:1; display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:1.5rem; align-content:start; }
        .country-card { background:var(--bg-card); border:1px solid var(--border-warm); border-radius:var(--radius-xl); overflow:hidden; cursor:pointer; transition:all var(--transition-gentle); box-shadow:var(--shadow-soft); }
        .country-card:hover { transform:translateY(-5px); box-shadow:var(--shadow-medium); }
        .country-card-img { height:150px; display:flex; align-items:center; justify-content:center; font-size:4rem; position:relative; }
        .country-card-img .region-badge { position:absolute; bottom:0.5rem; right:0.8rem; padding:0.2rem 0.6rem; border-radius:2rem; font-size:0.7rem; background:rgba(255,255,255,0.85); color:var(--accent-terracotta); font-weight:600; }
        .country-card-body { padding:1.3rem; }
        .country-card-body h3 { font-family:var(--font-heading); font-size:1.2rem; margin-bottom:0.3rem; }
        .country-card-body .capital { color:var(--text-muted); font-size:0.85rem; }
        .country-card-body .desc { color:var(--text-secondary); font-size:0.9rem; margin-top:0.3rem; line-height:1.4; }
        .country-tags { display:flex; flex-wrap:wrap; gap:0.4rem; margin-top:0.6rem; }
        .country-tag { padding:0.2rem 0.7rem; border-radius:2rem; font-size:0.72rem; background:rgba(139,157,131,0.1); border:1px solid rgba(139,157,131,0.3); color:var(--accent-sage); }

        /* No results */
        .no-results { text-align:center; padding:3rem; color:var(--text-muted); }
        .no-results .big-icon { font-size:4rem; }

        @keyframes fadeIn { from{opacity:0;transform:translateY(15px);} to{opacity:1;transform:translateY(0);} }
        @media (max-width:768px) { .main-layout{flex-direction:column;padding:1rem;} .filter-sidebar{width:100%;position:static;} }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo" onclick="window.location.href='culture_home.html'">文化寰宇✦</div>
        <ul class="nav-links">
            <li><a href="culture_home.html">首页</a></li>
            <li><a href="countries.html" class="active">国家文化库</a></li>
            <li><a href="festivals.html">节日大全</a></li>
            <li><a href="etiquette.html">礼仪指南</a></li>
            <li><a href="clothing.html">服饰文化</a></li>
            <li><a href="food_culture.html">饮食文化</a></li>
            <li><a href="world_map.html">地图探索</a></li>
            <li><a href="culture_compare.html">文化对比</a></li>
            <li><a href="about.html">关于</a></li>
        </ul>
    </nav>

    <div class="page-header">
        <h1>📖 国家文化库</h1>
        <div class="divider"></div>
        <p style="color:var(--text-muted);">浏览各国独特文化习俗 — 收录30+国家和地区</p>
    </div>

    <div class="search-bar">
        <input type="text" id="countrySearch" placeholder="🔍 搜索国家名称、首都、文化特色...">
    </div>

    <div class="main-layout">
        <aside class="filter-sidebar">
            <h3>筛选条件</h3>
            <div class="filter-group">
                <label>地区</label>
                <select id="regionFilter">
                    <option value="all">全部地区</option>
                    <option value="asia">🏯 亚洲</option>
                    <option value="europe">🏰 欧洲</option>
                    <option value="americas">💃 美洲</option>
                    <option value="africa">🌍 非洲</option>
                    <option value="oceania">🏝️ 大洋洲</option>
                    <option value="middle-east">🕌 中东</option>
                </select>
            </div>
            <div class="filter-group">
                <label>文化标签</label>
                <select id="tagFilter">
                    <option value="all">全部标签</option>
                    <option value="礼仪">礼仪之邦</option>
                    <option value="节日">节庆丰富</option>
                    <option value="服饰">服饰独特</option>
                    <option value="饮食">美食文化</option>
                    <option value="音乐">音乐传统</option>
                </select>
            </div>
            <div class="filter-group">
                <label>排序方式</label>
                <select id="sortFilter">
                    <option value="default">默认</option>
                    <option value="name">按名称 A-Z</option>
                </select>
            </div>
            <div class="stats-mini" id="statsMini"></div>
            <button class="reset-btn" id="resetFilter">重置所有筛选</button>
        </aside>
        <div class="country-grid" id="countryGrid"></div>
    </div>

    <script>
        const countriesData = [
            { id:'japan', name:'日本', region:'asia', capital:'东京', flag:'🇯🇵', tags:['礼仪','节日','服饰','饮食'], desc:'茶道、花道、和服、鞠躬礼', imgColor:'#f5e6d3' },
            { id:'china', name:'中国', region:'asia', capital:'北京', flag:'🇨🇳', tags:['礼仪','节日','服饰','饮食','音乐'], desc:'春节、汉服、茶文化、筷子礼仪', imgColor:'#fdf2e0' },
            { id:'south-korea', name:'韩国', region:'asia', capital:'首尔', flag:'🇰🇷', tags:['礼仪','节日','服饰','饮食'], desc:'韩服、泡菜文化、韩流音乐、数字礼仪', imgColor:'#faf5f0' },
            { id:'vietnam', name:'越南', region:'asia', capital:'河内', flag:'🇻🇳', tags:['节日','服饰','饮食'], desc:'奥黛、春节、河粉文化、水上木偶', imgColor:'#fcf5ea' },
            { id:'thailand', name:'泰国', region:'asia', capital:'曼谷', flag:'🇹🇭', tags:['礼仪','节日','饮食'], desc:'合十礼、泼水节、冬阴功、佛教文化', imgColor:'#fef7e8' },
            { id:'india', name:'印度', region:'asia', capital:'新德里', flag:'🇮🇳', tags:['节日','服饰','饮食','音乐'], desc:'排灯节、纱丽、手抓饭、瑜伽', imgColor:'#fef3e4' },
            { id:'indonesia', name:'印尼', region:'asia', capital:'雅加达', flag:'🇮🇩', tags:['节日','服饰','饮食'], desc:'蜡染、皮影戏、清真文化、千岛之国', imgColor:'#fdf7ef' },
            { id:'italy', name:'意大利', region:'europe', capital:'罗马', flag:'🇮🇹', tags:['饮食','节日','服饰'], desc:'意面文化、狂欢节、时尚之都', imgColor:'#faf0e6' },
            { id:'france', name:'法国', region:'europe', capital:'巴黎', flag:'🇫🇷', tags:['礼仪','饮食','服饰'], desc:'法餐礼仪、吻面礼、时尚', imgColor:'#f8f0e8' },
            { id:'germany', name:'德国', region:'europe', capital:'柏林', flag:'🇩🇪', tags:['节日','饮食'], desc:'啤酒节、圣诞市场、准时文化', imgColor:'#faf3eb' },
            { id:'uk', name:'英国', region:'europe', capital:'伦敦', flag:'🇬🇧', tags:['礼仪','节日'], desc:'下午茶、皇室礼仪、排队文化', imgColor:'#f9f2ea' },
            { id:'spain', name:'西班牙', region:'europe', capital:'马德里', flag:'🇪🇸', tags:['节日','饮食','音乐'], desc:'斗牛、火腿、弗拉门戈、午睡文化', imgColor:'#fef5e8' },
            { id:'russia', name:'俄罗斯', region:'europe', capital:'莫斯科', flag:'🇷🇺', tags:['节日','服饰','饮食'], desc:'东正教、套娃、萨拉凡、芭蕾舞', imgColor:'#fdf3ea' },
            { id:'greece', name:'希腊', region:'europe', capital:'雅典', flag:'🇬🇷', tags:['礼仪','节日','饮食'], desc:'希腊神话、地中海饮食、传统舞蹈', imgColor:'#fef8f2' },
            { id:'brazil', name:'巴西', region:'americas', capital:'巴西利亚', flag:'🇧🇷', tags:['节日','饮食','音乐'], desc:'狂欢节、桑巴舞、烤肉文化', imgColor:'#fdf5e8' },
            { id:'mexico', name:'墨西哥', region:'americas', capital:'墨西哥城', flag:'🇲🇽', tags:['节日','服饰','饮食'], desc:'亡灵节、玛雅文化、塔可、龙舌兰', imgColor:'#fef5ec' },
            { id:'usa', name:'美国', region:'americas', capital:'华盛顿', flag:'🇺🇸', tags:['节日','饮食'], desc:'感恩节、独立日、多元文化熔炉', imgColor:'#f8f3ec' },
            { id:'canada', name:'加拿大', region:'americas', capital:'渥太华', flag:'🇨🇦', tags:['礼仪','节日'], desc:'多元文化、枫糖节、原住民传统', imgColor:'#faf5f0' },
            { id:'peru', name:'秘鲁', region:'americas', capital:'利马', flag:'🇵🇪', tags:['节日','服饰','饮食'], desc:'印加文明、羊驼织物、酸橘汁腌鱼', imgColor:'#fdf7ee' },
            { id:'argentina', name:'阿根廷', region:'americas', capital:'布宜诺斯艾利斯', flag:'🇦🇷', tags:['饮食','音乐'], desc:'探戈、烤肉、马黛茶、高乔文化', imgColor:'#faf4eb' },
            { id:'morocco', name:'摩洛哥', region:'africa', capital:'拉巴特', flag:'🇲🇦', tags:['服饰','饮食','礼仪'], desc:'薄荷茶礼仪、传统长袍、阿拉伯-柏柏尔文化', imgColor:'#fef6ec' },
            { id:'egypt', name:'埃及', region:'africa', capital:'开罗', flag:'🇪🇬', tags:['节日','饮食'], desc:'古埃及文明、集市文化、阿拉伯风情', imgColor:'#fdf5e6' },
            { id:'nigeria', name:'尼日利亚', region:'africa', capital:'阿布贾', flag:'🇳🇬', tags:['节日','服饰','音乐'], desc:'诺莱坞、色彩节、部落面具文化', imgColor:'#fcf4e5' },
            { id:'south-africa', name:'南非', region:'africa', capital:'比勒陀利亚', flag:'🇿🇦', tags:['节日','饮食'], desc:'彩虹之国、传统烤肉、多种族文化', imgColor:'#fdf7ed' },
            { id:'kenya', name:'肯尼亚', region:'africa', capital:'内罗毕', flag:'🇰🇪', tags:['节日','服饰'], desc:'马赛族传统、野生动物、坎加织物', imgColor:'#fcf6ea' },
            { id:'australia', name:'澳大利亚', region:'oceania', capital:'堪培拉', flag:'🇦🇺', tags:['节日'], desc:'澳新军团日、原住民文化、多元移民', imgColor:'#faf5ee' },
            { id:'new-zealand', name:'新西兰', region:'oceania', capital:'惠灵顿', flag:'🇳🇿', tags:['礼仪','节日','服饰'], desc:'毛利文化、哈卡战舞、极限运动', imgColor:'#f8f2e8' },
            { id:'saudi-arabia', name:'沙特阿拉伯', region:'middle-east', capital:'利雅得', flag:'🇸🇦', tags:['礼仪','节日','饮食'], desc:'麦加朝圣、伊斯兰文化、椰枣咖啡', imgColor:'#fef8f0' },
            { id:'turkey', name:'土耳其', region:'middle-east', capital:'安卡拉', flag:'🇹🇷', tags:['节日','服饰','饮食'], desc:'土耳其咖啡、旋转舞、巴扎文化', imgColor:'#fdf6ea' },
            { id:'iran', name:'伊朗', region:'middle-east', capital:'德黑兰', flag:'🇮🇷', tags:['礼仪','节日','服饰'], desc:'波斯地毯、诺鲁孜新年、诗歌传统', imgColor:'#fef7ed' },
        ];

        const regionNames = { asia:'亚洲', europe:'欧洲', americas:'美洲', africa:'非洲', oceania:'大洋洲', 'middle-east':'中东' };

        function renderCountries(filtered) {
            const grid = document.getElementById('countryGrid');
            document.getElementById('statsMini').innerHTML = `<span class="stat-mini">共 <strong>${filtered.length}</strong> 个国家</span>`;
            if (filtered.length === 0) {
                grid.innerHTML = '<div class="no-results"><span class="big-icon">🔍</span><p>未找到匹配的国家。请尝试调整筛选条件。</p></div>';
                return;
            }
            grid.innerHTML = filtered.map((c,i) => `
            <div class="country-card" onclick="window.location.href='culture_detail.html?country=${c.id}'" style="animation:fadeIn 0.5s ease-out ${i*0.04}s both;">
              <div class="country-card-img" style="background-color:${c.imgColor};">
                <span>${c.flag}</span>
                <span class="region-badge">${regionNames[c.region] || c.region}</span>
              </div>
              <div class="country-card-body">
                <h3>${c.name}</h3>
                <p class="capital">首都：${c.capital}</p>
                <p class="desc">${c.desc}</p>
                <div class="country-tags">${c.tags.map(t=>`<span class="country-tag">${t}</span>`).join('')}</div>
              </div>
            </div>
          `).join('');
        }

        function applyFilters() {
            const region = document.getElementById('regionFilter').value;
            const tag = document.getElementById('tagFilter').value;
            const sort = document.getElementById('sortFilter').value;
            const search = document.getElementById('countrySearch').value.trim().toLowerCase();
            let filtered = countriesData;
            if (region !== 'all') filtered = filtered.filter(c => c.region === region);
            if (tag !== 'all') filtered = filtered.filter(c => c.tags.includes(tag));
            if (search) filtered = filtered.filter(c => c.name.includes(search) || c.desc.includes(search) || c.capital.includes(search) || c.tags.some(t=>t.includes(search)));
            if (sort === 'name') filtered = [...filtered].sort((a,b) => a.name.localeCompare(b.name));
            renderCountries(filtered);
        }

        document.getElementById('regionFilter').addEventListener('change', applyFilters);
        document.getElementById('tagFilter').addEventListener('change', applyFilters);
        document.getElementById('sortFilter').addEventListener('change', applyFilters);
        document.getElementById('countrySearch').addEventListener('input', applyFilters);
        document.getElementById('resetFilter').addEventListener('click', () => {
            document.getElementById('regionFilter').value = 'all';
            document.getElementById('tagFilter').value = 'all';
            document.getElementById('sortFilter').value = 'default';
            document.getElementById('countrySearch').value = '';
            applyFilters();
        });

        // URL search param
        const urlParams = new URLSearchParams(window.location.search);
        const searchQ = urlParams.get('search');
        if (searchQ) {
            document.getElementById('countrySearch').value = searchQ;
            applyFilters();
        } else {
            applyFilters();
        }

        console.log('📖 国家文化库已加载 — ' + countriesData.length + ' 个国家');
    </script>
</body>
</html>
