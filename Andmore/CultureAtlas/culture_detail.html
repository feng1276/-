    <style>
        :root {
            --bg-cream: #fdf6ee;
            --bg-card: #ffffff;
            --text-primary: #3d3226;
            --text-secondary: #6b5d4f;
            --text-muted: #9b8b7a;
            --accent-terracotta: #c67b5c;
            --accent-sage: #8b9d83;
            --accent-ochre: #d4a853;
            --border-warm: #e8dccf;
            --shadow-soft: 0 4px 20px rgba(61,50,38,0.06);
            --shadow-medium: 0 8px 30px rgba(61,50,38,0.1);
            --radius-xl: 1.5rem;
            --radius-md: 0.75rem;
            --transition-gentle: 0.3s ease;
            --font-body: 'Georgia','Noto Serif SC',serif;
            --font-heading: 'Palatino','Noto Serif SC',serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:var(--font-body); background:var(--bg-cream); color:var(--text-primary); min-height:100vh; padding-bottom:4rem; }
        .navbar { position:sticky; top:0; z-index:100; background:rgba(253,246,238,0.88); backdrop-filter:blur(16px); border-bottom:1px solid var(--border-warm); padding:0.8rem 2rem; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1rem; }
        .logo { font-family:var(--font-heading); font-size:1.5rem; font-weight:700; color:var(--accent-terracotta); cursor:pointer; }
        .nav-links { display:flex; gap:1.3rem; list-style:none; flex-wrap:wrap; }
        .nav-links a { color:var(--text-secondary); text-decoration:none; font-size:0.88rem; transition:0.2s; }
        .nav-links a:hover { color:var(--accent-terracotta); }

        .detail-container { max-width:900px; margin:2rem auto; padding:0 1.5rem; }

        /* Hero */
        .hero-card { background:var(--bg-card); border:1px solid var(--border-warm); border-radius:var(--radius-xl); padding:2.5rem; margin-bottom:2rem; display:flex; gap:2rem; flex-wrap:wrap; align-items:center; box-shadow:var(--shadow-soft); }
        .flag-display { font-size:5rem; }
        .hero-info h1 { font-family:var(--font-heading); font-size:2.2rem; margin-bottom:0.5rem; }
        .hero-info .sub-info { color:var(--text-secondary); margin-bottom:0.8rem; line-height:1.6; }
        .meta-tags { display:flex; gap:0.8rem; flex-wrap:wrap; margin-top:0.5rem; }
        .meta-tag { padding:0.3rem 1rem; border-radius:2rem; font-size:0.8rem; background:rgba(198,123,92,0.08); border:1px solid rgba(198,123,92,0.25); color:var(--accent-terracotta); }

        /* Tab nav */
        .tab-nav { display:flex; justify-content:center; gap:0.6rem; margin:2rem 0 1rem; flex-wrap:wrap; }
        .tab-btn { padding:0.6rem 1.3rem; border-radius:3rem; background:var(--bg-card); border:1px solid var(--border-warm); color:var(--text-secondary); cursor:pointer; font-family:var(--font-body); font-weight:600; font-size:0.85rem; transition:all var(--transition-gentle); }
        .tab-btn.active { background:var(--accent-sage); color:#fff; border-color:var(--accent-sage); }
        .tab-btn:hover:not(.active) { border-color:var(--accent-sage); color:var(--accent-sage); }

        /* Section card */
        .section-card { background:var(--bg-card); border:1px solid var(--border-warm); border-radius:var(--radius-xl); padding:2rem; margin-bottom:1.5rem; box-shadow:var(--shadow-soft); }
        .section-card h2 { font-family:var(--font-heading); color:var(--accent-sage); margin-bottom:1rem; font-size:1.4rem; border-bottom:2px solid var(--border-warm); padding-bottom:0.5rem; }
        .section-card ul { list-style:none; padding:0; }
        .section-card li { padding:0.6rem 0; border-bottom:1px solid rgba(232,220,207,0.5); color:var(--text-secondary); font-size:0.95rem; }
        .section-card li::before { content:'✦ '; color:var(--accent-ochre); }

        /* Timeline */
        .timeline-mini { display:flex; gap:0; margin:1.5rem 0; flex-wrap:wrap; justify-content:center; }
        .timeline-dot { text-align:center; padding:0.5rem 0.8rem; position:relative; font-size:0.85rem; color:var(--text-secondary); }
        .timeline-dot::after { content:'→'; margin-left:0.5rem; color:var(--accent-terracotta); }
        .timeline-dot:last-child::after { content:''; }

        /* Image gallery */
        .image-gallery { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:1rem; margin:1rem 0; }
        .gallery-img { height:130px; border-radius:var(--radius-md); background-size:cover; background-position:center; cursor:pointer; transition:all var(--transition-gentle); border:1px solid var(--border-warm); }
        .gallery-img:hover { transform:scale(1.03); box-shadow:var(--shadow-medium); }

        /* Fun facts */
        .facts-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:1rem; margin:1rem 0; }
        .fact-card { background:rgba(212,168,83,0.06); border:1px solid rgba(212,168,83,0.2); border-radius:var(--radius-md); padding:1.2rem; text-align:center; }
        .fact-card .fact-icon { font-size:2rem; }
        .fact-card .fact-text { color:var(--text-secondary); font-size:0.85rem; margin-top:0.5rem; }

        /* Weather / time info */
        .info-bar { display:flex; gap:1.5rem; flex-wrap:wrap; margin:1rem 0; }
        .info-chip { padding:0.5rem 1.2rem; border-radius:3rem; background:rgba(139,157,131,0.08); border:1px solid rgba(139,157,131,0.2); font-size:0.85rem; color:var(--accent-sage); }

        /* Quick nav */
        .quick-nav { position:fixed; bottom:1.5rem; right:1.5rem; display:flex; flex-direction:column; gap:0.5rem; z-index:50; }
        .quick-nav a { width:40px; height:40px; border-radius:50%; background:var(--bg-card); border:1px solid var(--border-warm); display:flex; align-items:center; justify-content:center; text-decoration:none; color:var(--accent-sage); font-size:1.2rem; box-shadow:var(--shadow-soft); transition:all var(--transition-gentle); }
        .quick-nav a:hover { background:var(--accent-terracotta); color:#fff; border-color:var(--accent-terracotta); }

        @keyframes fadeIn { from{opacity:0;transform:translateY(15px);} to{opacity:1;transform:translateY(0);} }
        @media (max-width:600px) { .hero-card{flex-direction:column;text-align:center;} .tab-nav{gap:0.3rem;} .tab-btn{padding:0.4rem 0.8rem;font-size:0.75rem;} }
    </style>
