<!DOCTYPE html>

    <style>
        :root {
            --bg-cream: #fdf6ee;
            --bg-card: #ffffff;
            --text-primary: #3d3226;
            --text-secondary: #6b5d4f;
            --text-muted: #9b8b7a;

            --accent-sage: #8b9d83;
            --accent-ochre: #d4a853;
            --border-warm: #e8dccf;
            --shadow-soft: 0 4px 20px rgba(61,50,38,0.06);
            --shadow-medium: 0 8px 30px rgba(61,50,38,0.1);
            --radius-xl: 1.5rem;
            --radius-md: 0.75rem;
            --transition-gentle: 0.3s ease;
            --font-body: 'Georgia','Noto Serif SC',serif;
            --font-heading: 'Palatino','Noto Serif SC',serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:var(--font-body); background:var(--bg-cream); color:var(--text-primary); min-height:100vh; padding-bottom:4rem; }
        .navbar { position:sticky; top:0; z-index:100; background:rgba(253,246,238,0.88); backdrop-filter:blur(16px); border-bottom:1px solid var(--border-warm); padding:0.8rem 2rem; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1rem; }
        .logo { font-family:var(--font-heading); font-size:1.5rem; font-weight:700; color:var(--accent-terracotta); cursor:pointer; }
        .nav-links { display:flex; gap:1.3rem; list-style:none; flex-wrap:wrap; }
        .nav-links a { color:var(--text-secondary); text-decoration:none; font-size:0.88rem; transition:0.2s; }
        .nav-links a:hover, .nav-links a.active { color:var(--accent-terracotta); }

        .page-header { text-align:center; padding:3rem 1rem 1.5rem; }
        .page-header h1 { font-family:var(--font-heading); font-size:2.5rem; }
        .container { max-width:1000px; margin:0 auto; padding:0 1.5rem; }

        /* Selector */
        .selector-row { display:flex; justify-content:center; align-items:center; gap:1.5rem; margin:2rem 0; flex-wrap:wrap; }
        .selector-group { text-align:center; }
        .selector-group label { display:block; font-size:0.8rem; color:var(--text-muted); margin-bottom:0.3rem; }
        select { padding:0.8rem 1.5rem; border-radius:3rem; background:var(--bg-card); border:1px solid var(--border-warm); font-family:var(--font-body); font-size:1rem; color:var(--text-primary); cursor:pointer; box-shadow:var(--shadow-soft); transition:all var(--transition-gentle); }
        select:focus { border-color:var(--accent-terracotta); outline:none; }
        .vs-badge { font-family:var(--font-heading); font-size:1.5rem; font-weight:700; color:var(--accent-terracotta); }
        .btn-compare { padding:0.8rem 2rem; border-radius:3rem; background:var(--accent-terracotta); color:#fff; border:none; font-family:var(--font-body); font-weight:600; cursor:pointer; font-size:0.9rem; transition:all var(--transition-gentle); box-shadow:0 4px 15px rgba(198,123,92,0.3); }
        .btn-compare:hover { background:#b85042; transform:translateY(-2px); }

        /* Comparison table */
        .compare-table { width:100%; border-collapse:collapse; background:var(--bg-card); border-radius:var(--radius-xl); overflow:hidden; box-shadow:var(--shadow-soft); border:1px solid var(--border-warm); margin-bottom:2rem; }
        .compare-table th, .compare-table td { padding:1rem 1.5rem; text-align:center; border-bottom:1px solid var(--border-warm); }
        .compare-table th { background:rgba(139,157,131,0.1); color:var(--accent-sage); font-family:var(--font-heading); font-size:0.9rem; }
        .compare-table td:first-child { text-align:left; font-weight:600; color:var(--text-primary); width:25%; }
        .compare-table td:nth-child(2) { background:rgba(198,123,92,0.02); }
        .highlight-diff { background:rgba(212,168,83,0.08); }

        /* Summary card */
        .summary-card { background:var(--bg-card); border:1px solid var(--border-warm); border-radius:var(--radius-xl); padding:2rem; margin-bottom:2rem; box-shadow:var(--shadow-soft); }
        .summary-card h3 { font-family:var(--font-heading); color:var(--accent-sage); margin-bottom:1rem; }
        .summary-card .similarity-bar { height:8px; border-radius:4px; background:var(--border-warm); margin:0.8rem 0; overflow:hidden; }
        .summary-card .similarity-fill { height:100%; border-radius:4px; background:linear-gradient(90deg, var(--accent-sage), var(--accent-terracotta)); transition:width 0.8s ease; }

        /* Detail cards */
        .detail-row { display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; margin:2rem 0; }
        .country-detail { background:var(--bg-card); border:1px solid var(--border-warm); border-radius:var(--radius-xl); padding:2rem; box-shadow:var(--shadow-soft); text-align:center; }
        .country-detail h3 { font-family:var(--font-heading); font-size:1.5rem; margin-bottom:1rem; }
        .country-detail .flag-lg { font-size:4rem; display:block; margin-bottom:0.5rem; }
        .country-detail ul { list-style:none; padding:0; text-align:left; }
        .country-detail li { padding:0.5rem 0; border-bottom:1px dotted var(--border-warm); color:var(--text-secondary); font-size:0.9rem; }
        .country-detail li::before { content:'✦ '; color:var(--accent-ochre); }

        /* Tips section */
        .tips-card { background:rgba(212,168,83,0.06); border-left:3px solid var(--accent-ochre); padding:1.5rem 2rem; border-radius:0 var(--radius-xl) var(--radius-xl) 0; margin:2rem 0; }
        .tips-card h3 { color:var(--accent-ochre); font-family:var(--font-heading); margin-bottom:0.8rem; }
        .tips-card p { color:var(--text-secondary); font-size:0.92rem; line-height:1.7; }

        /* SVG decoration */
        .deco-line { display:flex; justify-content:center; margin:2rem 0; }
        .deco-line svg { width:120px; height:12px; }

        @keyframes fadeIn { from{opacity:0;transform:translateY(15px);} to{opacity:1;transform:translateY(0);} }
        @media (max-width:768px) { .detail-row{grid-template-columns:1fr;} .selector-row{flex-direction:column;} }
    </style>
</head>

    <script>
        const compareDB = {

            'south-korea': { name:'韩国', flag:'🇰🇷', greeting:'鞠躬', dining:'长辈先动筷，不用手端碗', gift:'忌送手帕', punctuality:'较为准时', personalSpace:'保持适度距离', colors:'白色象征纯洁', taboos:'忌用红笔写名字', clothing:'韩服(Hanbok)', food:'泡菜、拌饭、韩牛烤肉', religion:'基督教、佛教' },
            vietnam: { name:'越南', flag:'🇻🇳', greeting:'微笑点头', dining:'用筷子，共享菜肴', gift:'忌送手帕', punctuality:'较为灵活', personalSpace:'较近', colors:'红色吉祥', taboos:'忌摸头部', clothing:'奥黛(Ao Dai)', food:'河粉、春卷、法式面包', religion:'佛教、民间信仰' },
            thailand: { name:'泰国', flag:'🇹🇭', greeting:'合十礼(Wai)', dining:'用勺子和叉子，不用筷子', gift:'忌送茉莉花环', punctuality:'时间灵活', personalSpace:'适中', colors:'黄色(皇室象征)', taboos:'忌触碰头部、忌脚指人', clothing:'传统泰装', food:'冬阴功、芒果糯米饭、泰式炒河粉', religion:'佛教(国教)' },
            india: { name:'印度', flag:'🇮🇳', greeting:'合十礼(Namaste)', dining:'右手吃饭，左手不洁', gift:'忌送皮革制品', punctuality:'时间观念灵活', personalSpace:'较近', colors:'红黄绿吉祥', taboos:'忌食牛肉、禁用左手递物', clothing:'纱丽、旁遮普套装', food:'咖喱、香饭、馕饼、坦都里烤鸡', religion:'印度教、伊斯兰教' },
            italy: { name:'意大利', flag:'🇮🇹', greeting:'贴面礼(左右各一次)', dining:'意面不切断，面包蘸酱汁', gift:'忌送菊花(丧事用)', punctuality:'南部较灵活', personalSpace:'较近，肢体接触多', colors:'无特殊禁忌', taboos:'忌数字17', clothing:'时尚设计服装', food:'意面、披萨、意式冰淇淋', religion:'天主教' },
            france: { name:'法国', flag:'🇫🇷', greeting:'贴面礼(2-4次)', dining:'法餐礼仪严格，手放桌上', gift:'带酒或鲜花', punctuality:'较为准时', personalSpace:'适中', colors:'忌送菊花', taboos:'忌送菊花、忌13号星期五', clothing:'高级时尚', food:'可颂、鹅肝、红酒炖牛肉', religion:'天主教(传统)' },
            germany: { name:'德国', flag:'🇩🇪', greeting:'握手(有力)', dining:'使用餐具，左手叉右手刀', gift:'带小礼物，忌送刀具', punctuality:'极其守时', personalSpace:'保持距离', colors:'无特殊禁忌', taboos:'忌行纳粹礼', clothing:'Tracht(巴伐利亚)', food:'香肠、猪肘、黑森林蛋糕', religion:'基督教' },

            spain: { name:'西班牙', flag:'🇪🇸', greeting:'贴面礼(两次)', dining:'晚餐很晚(21:00后)', gift:'鲜花受欢迎', punctuality:'南部较灵活', personalSpace:'很近', colors:'无特殊禁忌', taboos:'忌在公共场合打哈欠不捂嘴', clothing:'传统弗拉门戈礼服', food:'海鲜饭、火腿、塔帕斯', religion:'天主教' },
            russia: { name:'俄罗斯', flag:'🇷🇺', greeting:'握手(男性)', dining:'伏特加仪式重要，不说拒绝', gift:'忌送偶数朵花', punctuality:'较为准时', personalSpace:'适中(站姿较近)', colors:'忌送黄色花', taboos:'忌送空钱包、忌门槛握手', clothing:'萨拉凡、鲁巴什卡', food:'罗宋汤、鱼子酱、布利尼', religion:'东正教' },
            brazil: { name:'巴西', flag:'🇧🇷', greeting:'拥抱贴面', dining:'烤肉社交，用餐时间长', gift:'忌紫色(哀悼色)', punctuality:'时间灵活(社交)', personalSpace:'很近，热情', colors:'忌紫色', taboos:'忌OK手势(冒犯)', clothing:'狂欢节盛装', food:'烤肉、黑豆饭、阿萨伊', religion:'天主教' },

            morocco: { name:'摩洛哥', flag:'🇲🇦', greeting:'握手+心口', dining:'右手吃饭，薄荷茶礼仪', gift:'忌送酒类', punctuality:'较灵活', personalSpace:'适中(同性较近)', colors:'绿色(伊斯兰色)', taboos:'忌左手递物', clothing:'杰拉巴、卡夫坦', food:'塔吉锅、库斯库斯、薄荷茶', religion:'伊斯兰教' },
            'saudi-arabia': { name:'沙特阿拉伯', flag:'🇸🇦', greeting:'握手+问候语', dining:'右手吃饭，共享大盘', gift:'忌送酒类', punctuality:'时间较灵活', personalSpace:'同性较近，异性远', colors:'绿色(伊斯兰色)', taboos:'忌异性握手、忌酒类', clothing:'长袍(Thobe)、黑袍(Abaya)', food:'卡布萨、烤羊肉、椰枣', religion:'伊斯兰教' },
        };

        function calculateSimilarity(a, b) {
            let score = 0, total = 7;
            if (a.greeting.includes(b.greeting.split('(')[0]) || b.greeting.includes(a.greeting.split('(')[0])) score++;
            if (a.dining.includes('筷子') && b.dining.includes('筷子')) score++;
            if (a.religion === b.religion) score++;
            if (a.personalSpace === b.personalSpace) score++;
            if (a.punctuality === b.punctuality) score++;
            if (a.colors.includes('红') && b.colors.includes('红')) score++;
            if (a.gift.includes(b.gift.split('忌')[1]?.split('和')[0]?.trim() || '')) score++;
            return Math.round((score / total) * 100);
        }

        function updateComparison() {
            const aKey = document.getElementById('countryA').value;
            const bKey = document.getElementById('countryB').value;
            const a = compareDB[aKey];
            const b = compareDB[bKey];
            document.getElementById('headerA').textContent = a.name;
            document.getElementById('headerB').textContent = b.name;

            const rows = [
                ['问候方式', a.greeting, b.greeting],
                ['餐桌礼仪', a.dining, b.dining],
                ['送礼禁忌', a.gift, b.gift],
                ['时间观念', a.punctuality, b.punctuality],
                ['个人空间', a.personalSpace, b.personalSpace],
                ['颜色偏好', a.colors, b.colors],
                ['宗教背景', a.religion, b.religion],
                ['文化禁忌', a.taboos, b.taboos],
            ];
            document.getElementById('tableBody').innerHTML = rows.map((r,i) => `
            <tr class="${r[1] !== r[2] ? 'highlight-diff' : ''}">
              <td>${r[0]}</td>
              <td>${r[1]}</td>
              <td>${r[2]}</td>
            </tr>`).join('');

            // Detail cards
            document.getElementById('detailRow').innerHTML = `
            <div class="country-detail" style="animation:fadeIn 0.4s ease-out both;">
              <span class="flag-lg">${a.flag}</span>
              <h3>${a.name}</h3>
              <ul>
                <li><strong>问候：</strong>${a.greeting}</li>
                <li><strong>服饰：</strong>${a.clothing}</li>
                <li><strong>饮食：</strong>${a.food}</li>
                <li><strong>宗教：</strong>${a.religion}</li>
              </ul>
            </div>
            <div class="country-detail" style="animation:fadeIn 0.5s ease-out both;">
              <span class="flag-lg">${b.flag}</span>
              <h3>${b.name}</h3>
              <ul>
                <li><strong>问候：</strong>${b.greeting}</li>
                <li><strong>服饰：</strong>${b.clothing}</li>
                <li><strong>饮食：</strong>${b.food}</li>
                <li><strong>宗教：</strong>${b.religion}</li>
              </ul>
            </div>`;

            // Summary
            const similarity = calculateSimilarity(a, b);
            document.getElementById('summaryCard').innerHTML = `
            <h3>📊 文化相似度分析</h3>
            <p style="color:var(--text-secondary);margin-bottom:1rem;">${a.name} 与 ${b.name} 的文化相似度评估（基于问候方式、餐桌礼仪、宗教背景等7个维度）</p>
            <div class="similarity-bar"><div class="similarity-fill" style="width:${similarity}%; transition:width 1s ease;"></div></div>
            <p style="text-align:center;font-weight:700;font-size:1.2rem;color:var(--accent-terracotta);">${similarity}% 相似</p>
            <p style="color:var(--text-muted);font-size:0.85rem;text-align:center;">${similarity >= 60 ? '两国文化有诸多相似之处，交流更容易顺畅。' : similarity >= 30 ? '两国文化各具特色，交流时需注意差异。' : '两国文化差异显著，跨文化交流需谨慎准备。'}</p>`;
        }

        document.getElementById('countryA').addEventListener('change', updateComparison);
        document.getElementById('countryB').addEventListener('change', updateComparison);
        updateComparison();
        console.log('⚖️ 文化对比系统已加载');
    </script>
</body>
</html>
