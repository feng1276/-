<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>节日大全 · 文化寰宇</title>
    <style>
        :root {
            --bg-cream: #fdf6ee;
            --bg-card: #ffffff;
            --text-primary: #3d3226;
            --text-secondary: #6b5d4f;
            --text-muted: #9b8b7a;
            --accent-terracotta: #c67b5c;
            --accent-sage: #8b9d83;
            --accent-ochre: #d4a853;
            --accent-rust: #b85042;
            --border-warm: #e8dccf;
            --shadow-soft: 0 4px 20px rgba(61,50,38,0.06);
            --shadow-medium: 0 8px 30px rgba(61,50,38,0.1);
            --shadow-strong: 0 16px 40px rgba(61,50,38,0.15);
            --radius-xl: 1.5rem;
            --radius-md: 0.75rem;
            --radius-sm: 0.5rem;
            --transition-gentle: 0.3s cubic-bezier(0.4,0,0.2,1);
            --font-body: 'Georgia','Noto Serif SC',serif;
            --font-heading: 'Palatino','Noto Serif SC',serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:var(--font-body); background:var(--bg-cream); color:var(--text-primary); min-height:100vh; padding-bottom:2rem; }

        /* ── Navbar ── */
        .navbar { position:sticky; top:0; z-index:100; background:rgba(253,246,238,0.88); backdrop-filter:blur(16px); border-bottom:1px solid var(--border-warm); padding:0.8rem 2rem; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1rem; }
        .logo { font-family:var(--font-heading); font-size:1.5rem; font-weight:700; color:var(--accent-terracotta); cursor:pointer; }
        .nav-links { display:flex; gap:1.3rem; list-style:none; flex-wrap:wrap; }
        .nav-links a { color:var(--text-secondary); text-decoration:none; font-size:0.88rem; transition:0.2s; }
        .nav-links a:hover, .nav-links a.active { color:var(--accent-terracotta); }

        /* ── Page Header ── */
        .page-header { text-align:center; padding:3rem 1rem 1.5rem; }
        .page-header h1 { font-family:var(--font-heading); font-size:2.5rem; margin-bottom:0.5rem; }
        .page-header .divider { width:40px; height:3px; background:var(--accent-ochre); margin:0.8rem auto; border-radius:2px; }
        .page-header .subtitle { color:var(--text-muted); font-size:0.95rem; line-height:1.6; }
        .container { max-width:1200px; margin:0 auto; padding:0 1.5rem; }

        /* ── Festival Spotlight Hero ── */
        .spotlight-section { margin:0 auto 2.5rem; max-width:920px; padding:0 1rem; }
        .spotlight-card { background:var(--bg-card); border:1px solid var(--border-warm); border-radius:var(--radius-xl); overflow:hidden; box-shadow:var(--shadow-strong); display:flex; flex-direction:row; min-height:260px; transition:all var(--transition-gentle); animation:scaleIn 0.6s cubic-bezier(0.4,0,0.2,1); cursor:pointer; }
        .spotlight-card:hover { transform:translateY(-4px); box-shadow:0 20px 50px rgba(61,50,38,0.18); }
        .spotlight-img { flex:1 1 42%; min-height:260px; background-size:cover; background-position:center; position:relative; }
        .spotlight-img::after { content:'✦ 今日聚焦'; position:absolute; top:0.8rem; left:0.8rem; background:rgba(198,123,92,0.92); color:#fff; padding:0.3rem 1rem; border-radius:2rem; font-size:0.75rem; font-weight:700; letter-spacing:0.05em; }
        .spotlight-body { flex:1 1 58%; padding:1.8rem 2rem; display:flex; flex-direction:column; justify-content:center; }
        .spotlight-body h2 { font-family:var(--font-heading); font-size:1.8rem; margin-bottom:0.3rem; }
        .spotlight-body .spotlight-sub { color:var(--accent-terracotta); font-weight:600; font-size:0.9rem; margin-bottom:0.7rem; }
        .spotlight-body .spotlight-meta-row { display:flex; gap:0.7rem; flex-wrap:wrap; margin-bottom:0.8rem; align-items:center; }
        .spotlight-body .spotlight-story { color:var(--text-muted); font-size:0.85rem; line-height:1.7; font-style:italic; border-left:3px solid var(--accent-ochre); padding-left:1rem; margin:0.5rem 0; }
        .spotlight-body .spotlight-btn { display:inline-block; margin-top:0.5rem; padding:0.5rem 1.4rem; background:var(--accent-terracotta); color:#fff; border-radius:3rem; text-decoration:none; font-size:0.85rem; font-weight:600; align-self:flex-start; transition:all var(--transition-gentle); cursor:pointer; border:none; font-family:var(--font-body); }
        .spotlight-body .spotlight-btn:hover { background:var(--accent-rust); transform:translateY(-2px); }

        /* ── Stats Row ── */
        .stats-row { display:flex; justify-content:center; gap:3rem; flex-wrap:wrap; margin:2rem 0 1.5rem; }
        .stat-item { text-align:center; }
        .stat-num { font-family:var(--font-heading); font-size:2rem; font-weight:700; color:var(--accent-sage); }
        .stat-label { font-size:0.85rem; color:var(--text-muted); }

        /* ── Search ── */
        .search-bar { text-align:center; margin:1rem 0 1.5rem; }
        .search-bar input { padding:0.8rem 1.6rem; border-radius:3rem; border:1px solid var(--border-warm); background:var(--bg-card); font-family:var(--font-body); font-size:0.95rem; min-width:320px; max-width:460px; width:100%; color:var(--text-primary); outline:none; transition:border-color var(--transition-gentle); box-shadow:var(--shadow-soft); }
        .search-bar input:focus { border-color:var(--accent-terracotta); box-shadow:0 0 0 3px rgba(198,123,92,0.1); }

        /* ── Tab Nav ── */
        .tab-nav { display:flex; justify-content:center; gap:0.8rem; margin:2rem 0; flex-wrap:wrap; }
        .tab-btn { padding:0.65rem 1.5rem; border-radius:3rem; background:var(--bg-card); border:1px solid var(--border-warm); color:var(--text-secondary); cursor:pointer; font-family:var(--font-body); font-weight:600; font-size:0.9rem; transition:all var(--transition-gentle); white-space:nowrap; }
        .tab-btn.active { background:var(--accent-terracotta); color:#fff; border-color:var(--accent-terracotta); }
        .tab-btn:hover:not(.active) { border-color:var(--accent-terracotta); color:var(--accent-terracotta); }

        /* ── Did You Know Banner ── */
        .did-you-know { max-width:900px; margin:0 auto 2rem; padding:0.9rem 1.8rem; background:linear-gradient(135deg, rgba(212,168,83,0.15), rgba(198,123,92,0.1)); border:1px solid var(--border-warm); border-radius:var(--radius-xl); text-align:center; transition:all 0.5s ease; min-height:52px; display:flex; align-items:center; justify-content:center; gap:0.7rem; animation:shimmerText 4s ease-in-out infinite; }
        .did-you-know .fact-icon { font-size:1.4rem; flex-shrink:0; }
        .did-you-know .fact-text { font-size:0.95rem; color:var(--text-secondary); line-height:1.6; }

        /* ── Count Badge ── */
        .count-badge { text-align:center; color:var(--text-muted); font-size:0.85rem; margin:0.5rem 0 1.5rem; }

        /* ── Calendar Strip ── */
        .calendar-strip { display:flex; gap:0.8rem; overflow-x:auto; padding:1.5rem 0; margin-bottom:2rem; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; }
        .calendar-strip::-webkit-scrollbar { height:4px; }
        .calendar-strip::-webkit-scrollbar-thumb { background:var(--border-warm); border-radius:4px; }
        .calendar-month { min-width:130px; text-align:center; padding:1rem; background:var(--bg-card); border:1px solid var(--border-warm); border-radius:var(--radius-md); scroll-snap-align:start; cursor:pointer; transition:all var(--transition-gentle); flex-shrink:0; }
        .calendar-month:hover, .calendar-month.active { border-color:var(--accent-terracotta); background:rgba(198,123,92,0.04); }
        .calendar-month .month-name { font-weight:700; color:var(--accent-terracotta); }
        .calendar-month .fest-count { font-size:0.8rem; color:var(--text-muted); margin-top:0.2rem; }

        /* ── Festival Grid ── */
        .festival-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(340px,1fr)); gap:1.8rem; }
        .festival-card { background:var(--bg-card); border:1px solid var(--border-warm); border-radius:var(--radius-xl); overflow:hidden; box-shadow:var(--shadow-soft); transition:all var(--transition-gentle); display:flex; flex-direction:column; cursor:pointer; }
        .festival-card:hover { transform:translateY(-5px); box-shadow:var(--shadow-medium); }
        .festival-img { width:100%; height:150px; background-size:cover; background-position:center; position:relative; }
        .festival-img .img-gradient { position:absolute; inset:0; background:linear-gradient(to bottom, transparent 55%, rgba(255,255,255,0.55) 100%); }
        .festival-header { padding:1.2rem 1.5rem 0.3rem; display:flex; align-items:center; gap:1rem; }
        .festival-icon { font-size:2.8rem; animation:floatIcon 3s ease-in-out infinite; animation-delay:calc(var(--i, 0) * 0.15s); }
        .festival-header h3 { font-family:var(--font-heading); font-size:1.3rem; }
        .festival-header .region-label { color:var(--text-muted); font-size:0.85rem; }
        .festival-body { padding:0.5rem 1.5rem 1.5rem; flex:1; display:flex; flex-direction:column; }
        .festival-meta { display:flex; gap:0.7rem; flex-wrap:wrap; margin:0.8rem 0; font-size:0.82rem; color:var(--text-muted); align-items:center; }
        .festival-desc { color:var(--text-secondary); font-size:0.9rem; line-height:1.6; flex:1; }
        .festival-extra { display:flex; gap:0.7rem; flex-wrap:wrap; margin:0.4rem 0 0.6rem; font-size:0.78rem; color:var(--text-muted); }
        .festival-extra span { background:rgba(139,157,131,0.06); padding:0.2rem 0.6rem; border-radius:2rem; border:1px solid rgba(139,157,131,0.12); }
        .festival-long-desc { display:none; color:var(--text-secondary); font-size:0.88rem; line-height:1.6; margin-top:0.8rem; padding-top:0.8rem; border-top:1px dotted var(--border-warm); }
        .festival-history-block { color:var(--text-muted); font-size:0.8rem; line-height:1.6; font-style:italic; margin-top:0.5rem; padding-top:0.5rem; border-top:1px dashed var(--border-warm); }
        .festival-card.expanded .festival-long-desc { display:block; }

        /* ── Season Tags ── */
        .season-tag { display:inline-block; padding:0.25rem 0.7rem; border-radius:2rem; font-size:0.75rem; font-weight:600; }
        .spring { background:rgba(139,157,131,0.2); color:#6b8a6b; }
        .summer { background:rgba(212,168,83,0.2); color:#b8953a; }
        .autumn { background:rgba(198,123,92,0.2); color:#b06040; }
        .winter { background:rgba(139,157,171,0.2); color:#5a7a8a; }

        /* ── Seasons Quadrant ── */
        .seasons-section { margin:3rem 0 2rem; }
        .seasons-section h2 { text-align:center; font-family:var(--font-heading); font-size:1.6rem; margin-bottom:1.5rem; color:var(--text-primary); }
        .seasons-quadrant { display:grid; grid-template-columns:1fr 1fr; grid-template-rows:auto auto; gap:1.2rem; max-width:1000px; margin:0 auto; }
        .season-box { border:1px solid var(--border-warm); border-radius:var(--radius-xl); padding:1.5rem; background:var(--bg-card); box-shadow:var(--shadow-soft); transition:all var(--transition-gentle); }
        .season-box:hover { transform:translateY(-3px); box-shadow:var(--shadow-medium); }
        .season-box .box-title { font-family:var(--font-heading); font-size:1.15rem; font-weight:700; margin-bottom:0.8rem; display:flex; align-items:center; gap:0.5rem; }
        .season-box.q-spring .box-title { color:#6b8a6b; }
        .season-box.q-summer .box-title { color:#b8953a; }
        .season-box.q-autumn .box-title { color:#b06040; }
        .season-box.q-winter .box-title { color:#5a7a8a; }
        .season-box ul { list-style:none; display:flex; flex-wrap:wrap; gap:0.4rem; }
        .season-box ul li { font-size:0.82rem; padding:0.25rem 0.7rem; border-radius:2rem; cursor:pointer; transition:all var(--transition-gentle); background:rgba(139,157,131,0.06); border:1px solid transparent; }
        .season-box ul li:hover { border-color:var(--accent-terracotta); color:var(--accent-terracotta); }
        .season-box ul li .li-icon { margin-right:0.2rem; }

        /* ── Festival Comparison Tool ── */
        .compare-section { margin:3rem 0; }
        .compare-section h2 { text-align:center; font-family:var(--font-heading); font-size:1.6rem; margin-bottom:0.3rem; color:var(--text-primary); }
        .compare-subtitle { text-align:center; color:var(--text-muted); font-size:0.85rem; margin-bottom:1.2rem; }
        .compare-controls { display:flex; justify-content:center; gap:1.2rem; flex-wrap:wrap; margin-bottom:1.5rem; align-items:center; }
        .compare-select { padding:0.7rem 1.2rem; border:1px solid var(--border-warm); border-radius:var(--radius-md); font-family:var(--font-body); font-size:0.9rem; color:var(--text-primary); background:var(--bg-card); cursor:pointer; min-width:220px; transition:all var(--transition-gentle); }
        .compare-select:focus { outline:none; border-color:var(--accent-terracotta); }
        .compare-vs { font-family:var(--font-heading); font-size:1.3rem; font-weight:700; color:var(--accent-terracotta); }
        .compare-result { display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; max-width:920px; margin:0 auto; }
        .compare-card { background:var(--bg-card); border:1px solid var(--border-warm); border-radius:var(--radius-xl); padding:1.5rem; box-shadow:var(--shadow-soft); animation:scaleIn 0.4s ease-out; }
        .compare-card h3 { font-family:var(--font-heading); font-size:1.25rem; margin-bottom:0.3rem; }
        .compare-card .compare-sub { color:var(--accent-terracotta); font-weight:600; margin-bottom:0.8rem; font-size:0.88rem; }
        .compare-card .compare-row { display:flex; justify-content:space-between; padding:0.5rem 0; border-bottom:1px solid rgba(232,220,207,0.5); font-size:0.85rem; }
        .compare-card .compare-row .clabel { color:var(--text-muted); font-weight:600; min-width:50px; }
        .compare-card .compare-row .cvalue { color:var(--text-primary); text-align:right; }

        /* ── Countdown ── */
        .countdown-section { max-width:680px; margin:3rem auto; text-align:center; padding:2rem 1.5rem; background:var(--bg-card); border:1px solid var(--border-warm); border-radius:var(--radius-xl); box-shadow:var(--shadow-soft); animation:festivalGlow 3s ease-in-out infinite; }
        .countdown-section h2 { font-family:var(--font-heading); font-size:1.35rem; margin-bottom:0.4rem; }
        .countdown-section .countdown-target { color:var(--accent-terracotta); font-size:1.05rem; font-weight:600; margin-bottom:1.2rem; }
        .countdown-timer { display:flex; justify-content:center; gap:1.5rem; }
        .countdown-unit { text-align:center; min-width:60px; }
        .countdown-unit .number { font-family:var(--font-heading); font-size:2.4rem; font-weight:700; color:var(--accent-terracotta); }
        .countdown-unit .label { font-size:0.78rem; color:var(--text-muted); letter-spacing:0.04em; }

        /* ── Footer ── */
        .footer-section { text-align:center; padding:2.5rem 1rem; margin-top:3rem; border-top:1px solid var(--border-warm); }
        .footer-section .footer-quote { font-family:var(--font-heading); font-size:1.1rem; color:var(--text-secondary); font-style:italic; max-width:620px; margin:0 auto 0.6rem; line-height:1.7; }
        .footer-section .footer-attr { font-size:0.85rem; color:var(--text-muted); }

        /* ── Animations ── */
        @keyframes fadeIn { from{opacity:0;transform:translateY(15px);} to{opacity:1;transform:translateY(0);} }
        @keyframes scaleIn { from{opacity:0;transform:scale(0.92);} to{opacity:1;transform:scale(1);} }
        @keyframes festivalGlow { 0%,100%{box-shadow:0 4px 20px rgba(198,123,92,0.06);} 50%{box-shadow:0 4px 30px rgba(198,123,92,0.2);} }
        @keyframes floatIcon { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }
        @keyframes shimmerText { 0%,100%{opacity:1;} 50%{opacity:0.72;} }
        @keyframes slideDown { from{opacity:0;transform:translateY(-20px);} to{opacity:1;transform:translateY(0);} }

        @media (max-width:768px) {
            .festival-grid{grid-template-columns:1fr;}
            .spotlight-card{flex-direction:column;}
            .spotlight-img{min-height:180px;flex:none;}
            .seasons-quadrant{grid-template-columns:1fr;}
            .compare-result{grid-template-columns:1fr;}
            .countdown-timer{gap:0.8rem;}
            .countdown-unit .number{font-size:1.8rem;}
            .page-header h1{font-size:1.8rem;}
            .nav-links{gap:0.7rem;}
            .stats-row{gap:1.5rem;}
            .stat-num{font-size:1.5rem;}
            .search-bar input{min-width:240px;}
        }
    </style>
</head>
<body>
    <!-- ═══════════════ NAVBAR ═══════════════ -->
    <nav class="navbar">
        <div class="logo" onclick="window.location.href='culture_home.html'">文化寰宇✦</div>
        <ul class="nav-links">
            <li><a href="culture_home.html">首页</a></li>
            <li><a href="countries.html">国家文化库</a></li>
            <li><a href="festivals.html" class="active">节日大全</a></li>
            <li><a href="etiquette.html">礼仪指南</a></li>
            <li><a href="clothing.html">服饰文化</a></li>
            <li><a href="food_culture.html">饮食文化</a></li>
            <li><a href="world_map.html">地图探索</a></li>
            <li><a href="culture_compare.html">文化对比</a></li>
            <li><a href="about.html">关于</a></li>
        </ul>
    </nav>

    <!-- ═══════════════ FESTIVAL SPOTLIGHT HERO ═══════════════ -->
    <section class="spotlight-section" id="spotlightSection">
        <div class="spotlight-card" id="spotlightCard" onclick="refreshSpotlight()">
            <div class="spotlight-img" id="spotlightImg"></div>
            <div class="spotlight-body" id="spotlightBody"></div>
        </div>
    </section>

    <!-- ═══════════════ PAGE HEADER ═══════════════ -->
    <div class="page-header">
        <h1>🎉 世界节日大全</h1>
        <div class="divider"></div>
        <p class="subtitle">探索全球传统节日与庆典 — 感受人类文明的节庆之美</p>
    </div>

    <div class="container">
        <!-- ═══════════════ STATS ROW ═══════════════ -->
        <div class="stats-row">
            <div class="stat-item"><div class="stat-num" id="totalCount">0</div><div class="stat-label">收录节日</div></div>
            <div class="stat-item"><div class="stat-num" id="countryCount">0</div><div class="stat-label">覆盖国家/地区</div></div>
            <div class="stat-item"><div class="stat-num">4</div><div class="stat-label">季节分类</div></div>
            <div class="stat-item"><div class="stat-num">7</div><div class="stat-label">节日类型</div></div>
        </div>

        <!-- ═══════════════ TAB NAV ═══════════════ -->
        <div class="tab-nav">
            <button class="tab-btn active" data-cat="all">全部节日</button>
            <button class="tab-btn" data-cat="宗教">🙏 宗教节日</button>
            <button class="tab-btn" data-cat="传统">🏮 传统节日</button>
            <button class="tab-btn" data-cat="国家">🇺🇳 国家庆典</button>
            <button class="tab-btn" data-cat="季节">🌸 季节庆典</button>
            <button class="tab-btn" data-cat="民俗">🎪 民俗节庆</button>
            <button class="tab-btn" data-cat="音乐">🎵 音乐盛典</button>
        </div>

        <!-- ═══════════════ SEARCH ═══════════════ -->
        <div class="search-bar"><input type="text" id="festivalSearch" placeholder="🔍 搜索节日名称或国家……"></div>

        <!-- ═══════════════ DID YOU KNOW BANNER ═══════════════ -->
        <div class="did-you-know" id="didYouKnow">
            <span class="fact-icon">💡</span>
            <span class="fact-text" id="factText"></span>
        </div>

        <!-- ═══════════════ CALENDAR STRIP ═══════════════ -->
        <div class="calendar-strip" id="calendarStrip"></div>

        <!-- ═══════════════ COUNT BADGE + GRID ═══════════════ -->
        <div class="count-badge" id="countBadge"></div>
        <div class="festival-grid" id="festivalGrid"></div>
    </div>

    <!-- ═══════════════ SEASONS QUADRANT ═══════════════ -->
    <div class="container">
        <section class="seasons-section">
            <h2>🌿 四季节庆象限</h2>
            <div class="seasons-quadrant" id="seasonsQuadrant"></div>
        </section>
    </div>

    <!-- ═══════════════ FESTIVAL COMPARISON ═══════════════ -->
    <div class="container">
        <section class="compare-section">
            <h2>⚖️ 节日对比工具</h2>
            <p class="compare-subtitle">选择两个节日，比较它们的文化内涵与庆典规模</p>
            <div class="compare-controls">
                <select class="compare-select" id="compareLeft" onchange="runComparison()">
                    <option value="">— 选择第一个节日 —</option>
                </select>
                <span class="compare-vs">VS</span>
                <select class="compare-select" id="compareRight" onchange="runComparison()">
                    <option value="">— 选择第二个节日 —</option>
                </select>
            </div>
            <div class="compare-result" id="compareResult"></div>
        </section>
    </div>

    <!-- ═══════════════ COUNTDOWN ═══════════════ -->
    <section class="countdown-section" id="countdownSection">
        <h2>⏳ 下一个值得期待的节日</h2>
        <p class="countdown-target" id="countdownTarget"></p>
        <div class="countdown-timer" id="countdownTimer"></div>
    </section>

    <!-- ═══════════════ FOOTER ═══════════════ -->

              longDesc:'西红柿节(La Tomatina)是西班牙最疯狂的美食节。上午人们争相攀爬涂满油脂的高杆抢火腿，中午卡车卸下约150吨熟透的西红柿，接下来一小时全城陷入"红色战争"。番茄汁没过脚踝，墙壁和街道被染成红色。',
              duration:'1天(大战1小时)', participants:'约2万人', history:'始于1945年，起源于一次街头青年冲突，后演变为合法化狂欢。2013年起需购票入场限流。', image:'photo-1598650060797-2a3f95daa08c' },
            { name:'奔牛节', country:'西班牙', icon:'🐂', month:7, season:'summer', category:'民俗', date:'7月6-14日',
              desc:'潘普洛纳的圣费尔明节，勇敢者在狭窄街道上与公牛赛跑，融合惊险、勇气和西班牙传统。',
              longDesc:'奔牛节(San Fermin)因海明威《太阳照常升起》而全球闻名。每天早上8点，六头公牛被放出在850米长的老城街道上狂奔，数百名白衣红巾的参与者在前奔跑。除奔牛外还有游行、斗牛、音乐和烟花。',
              duration:'9天', participants:'约100万游客', history:'中世纪起便有纪念圣费尔明的活动，奔牛原是前往斗牛场的实用手段，后演变为独立挑战。', image:'photo-1579606031-755c58732367' },
            { name:'仲夏节', country:'瑞典', icon:'🌿', month:6, season:'summer', category:'季节', date:'6月19-25日之间的周五',
              desc:'庆祝白昼最长的夏至，围绕五月柱跳舞，戴花冠、唱祝歌、享用鲱鱼和新土豆。',
              longDesc:'仲夏节(Midsommar)是瑞典最重要的传统节日，重要性可与圣诞节相提并论。人们用鲜花和绿叶装饰五月柱，男女老少手拉手围着柱子跳舞。传统食物有腌鲱鱼、新土豆配莳萝、草莓蛋糕。传说少女采七种花放在枕下可梦见未来丈夫。',
              duration:'2-3天', participants:'瑞典全国', history:'源自前基督教时代的夏至庆典，后与施洗约翰日融合，如今是瑞典最具民族特色的传统节日。', image:'photo-1498162607933-1b0505f0c3a2' },
            { name:'圣帕特里克节', country:'爱尔兰', icon:'☘️', month:3, season:'spring', category:'国家', date:'3月17日',
              desc:'爱尔兰国庆日，全球各地穿绿色服饰、佩戴三叶草，盛大游行庆祝爱尔兰文化。',
              longDesc:'圣帕特里克节纪念爱尔兰的守护圣人。芝加哥甚至把河水染成绿色庆祝。传统食物包括爱尔兰炖菜和苏打面包。都柏林的节日游行长达数公里，而纽约的游行规模甚至超过爱尔兰本土。',
              duration:'1天(节期多日)', participants:'全球爱尔兰裔约7000万人', history:'公元5世纪圣帕特里克将基督教传入爱尔兰，三叶草被用于讲解三位一体教义。', image:'photo-1572123765535-9ec4ddb46df3' },
            { name:'巴士底日', country:'法国', icon:'🎆', month:7, season:'summer', category:'国家', date:'7月14日',
              desc:'法国国庆日，纪念1789年攻占巴士底狱。香榭丽舍大街阅兵和埃菲尔铁塔烟花最为壮观。',
              longDesc:'巴士底日是法国最重要的国家节日。上午香榭丽舍大街举行欧洲最大规模的阅兵式，喷气机编队飞越凯旋门。晚上埃菲尔铁塔上空燃放壮观烟花。全法各地消防站举办传统舞会(Bal des Pompiers)。',
              duration:'1天', participants:'法国全国', history:'1789年7月14日巴黎人民攻占巴士底狱标志着法国大革命开端，1880年正式定为国庆日。', image:'photo-1508394524-26513aa2b2c5' },
            { name:'独立日', country:'美国', icon:'🇺🇸', month:7, season:'summer', category:'国家', date:'7月4日',
              desc:'美国国庆日，烟花表演、后院烧烤聚会和爱国游行。纪念1776年《独立宣言》签署。',
              longDesc:'美国独立日庆祝活动包括烟花表演、游行、烧烤、音乐会和棒球比赛。华盛顿特区的国家广场举办大型烟花和音乐会。人们穿红白蓝三色服装。热狗和苹果派是节日标志性美食。',
              duration:'1天', participants:'全美约3.3亿人', history:'1776年7月4日大陆会议通过《独立宣言》，宣告美国脱离英国独立。', image:'photo-1563841935106-67e16d5ef5f8' },
            { name:'诺鲁孜节', country:'伊朗/中亚', icon:'🌱', month:3, season:'spring', category:'传统', date:'3月20日或21日(春分)',
              desc:'波斯新年，春分之日庆祝万物复苏。设七鲜桌(Haft-Seen)，跳火堆祈福，已3000余年历史。',
              longDesc:'诺鲁孜节(Nowruz)是波斯文明的标志性文化遗产。人们在节前大扫除、购置新衣。Haft-Seen桌上摆放七样以波斯字母S开头的物品，分别象征重生、健康、美丽、爱等。第13天全家外出野餐，将绿色麦苗投入流水。',
              duration:'13天', participants:'约3亿人(从巴尔干到中亚)', history:'起源于琐罗亚斯德教，是波斯文明最古老的节日，UNESCO人类非物质文化遗产。', image:'photo-1558599611-8bdef670f6c8' },
            { name:'大壶节', country:'印度', icon:'🛕', month:1, season:'winter', category:'宗教', date:'1-3月(每12年大祭)',
              desc:'人类最大规模的宗教集会，数百万信徒在恒河等圣河中沐浴洗去罪孽。每12年一次的大祭最为盛大。',
              longDesc:'大壶节(Kumbh Mela)是人类历史上规模最大的和平集会，2013年参与人次超1.2亿。圣地包括安拉阿巴德、哈里德瓦尔、纳西克和乌贾因。圣人们(Naga Sadhus)率先进入圣河沐浴，然后是普通信徒。从太空中可见这一壮观集会。',
              duration:'约55天', participants:'可达1亿人以上', history:'源于印度教神话中天神与阿修罗争夺甘露壶(Kumbh)的故事，最古老持续的朝圣传统。', image:'photo-1548013146-724797668af9' },
            { name:'太阳祭', country:'秘鲁', icon:'☀️', month:6, season:'winter', category:'民俗', date:'6月24日(南半球冬至)',
              desc:'印加帝国最重要节日，在库斯科重现古印加太阳神(Inti)祭祀仪式，色彩缤纷的游行和传统舞蹈。',
              longDesc:'太阳祭(Inti Raymi)每年在库斯科的萨克萨瓦曼城堡举行，海拔3700米。数百名演员身穿印加时代服饰，重现古印加王向太阳神献祭骆马的仪式。是南美洲第二大节日，仅次于里约狂欢节。被称为"离太阳最近的节日"。',
              duration:'1天(庆典数日)', participants:'库斯科约10万人', history:'由第九代印加王帕查库特克创立，1944年恢复，是安第斯文化复兴的重要象征。', image:'photo-1526392063837-20e1a79ed82a' },
            { name:'班什狂欢节', country:'比利时', icon:'🤡', month:2, season:'winter', category:'民俗', date:'2月(四旬斋前)',
              desc:'欧洲最古老的中世纪狂欢节。吉勒(Gille)小丑戴蜡质面具穿木屐游行，向人群抛掷血橙。',
              longDesc:'班什狂欢节是欧洲中世纪狂欢传统最纯正的延续。主角吉勒小丑身穿红黄色服饰，腰间挂满铃铛，头戴鸵鸟羽毛大帽，脚踩沉重木屐。他们向人群抛掷血橙（象征好运），接过的人将获得祝福。UNESCO人类非物质文化遗产。',
              duration:'3天', participants:'班什镇及游客数万人', history:'可追溯至14世纪，是中世纪欧洲狂欢节保留最完整的活化石。', image:'photo-1551710029-2e7a6e1b61a1' },
            { name:'圣火节', country:'苏格兰', icon:'🔥', month:1, season:'winter', category:'民俗', date:'1月最后一个星期二',
              desc:'设得兰群岛的维京火把节，近千名"维京战士"高举火炬游行，最后将燃烧火把投向维京长船。',
              longDesc:'圣火节(Up Helly Aa)是欧洲最壮观的火焰节日。参与者花整年时间制作维京服饰和长船。游行队伍高举上千支火炬穿城而过，最后将所有火把掷入维京长船，烈焰冲天照亮夜空。之后是整夜的歌舞狂欢。',
              duration:'1天', participants:'勒威克约5000人参与', history:'源自19世纪70年代，纪念设得兰群岛的维京文化遗产。', image:'photo-1580655653885-65763b2597d0' },
            { name:'普什卡骆驼节', country:'印度', icon:'🐪', month:11, season:'autumn', category:'民俗', date:'11月(印历8月月圆)',
              desc:'拉贾斯坦沙漠中的奇妙集市，数万头骆驼盛装打扮进行交易，赛骆驼、胡子比赛和民间歌舞。',
              longDesc:'普什卡骆驼节是印度最色彩斑斓的民俗文化盛典。骆驼被精心剃毛、穿鼻环、染色和装饰，甚至有骆驼选美大赛。集市还包括胡子比赛、新娘比赛、杂技表演和热气球飞行。游客可体验沙漠篝火晚会和骑骆驼。',
              duration:'14天', participants:'约20万商贩和游客', history:'数百年历史，最初是塔尔沙漠中的牲畜交易集市，现已成为世界闻名的民俗文化节。', image:'photo-1547482525-1d1a18b1a0e2' },
            { name:'主显节', country:'埃塞俄比亚', icon:'💧', month:1, season:'winter', category:'宗教', date:'1月19日(闰年20日)',
              desc:'埃塞俄比亚正教最盛大的节日，纪念耶稣受洗。祭司取出约柜复制品(Tabot)游行，信徒重宣洗礼。',
              longDesc:'主显节(Timkat)是埃塞俄比亚最壮观的宗教节日。装饰华丽的约柜复制品被郑重地从教堂取出，由身穿白袍的祭司队伍抬着游行至水边。第二天凌晨信徒在水中重宣洗礼誓约。节日融合了深沉的虔诚与欢快的歌舞。',
              duration:'3天', participants:'埃塞俄比亚数百万人', history:'与埃塞俄比亚正教的古老传统和约柜传说紧密相连，最古老基督教国家的重要庆典。', image:'photo-1516026672322-bc52d61a55d5' },
            { name:'复活节', country:'全球基督教国家', icon:'🐣', month:4, season:'spring', category:'宗教', date:'春分月圆后第一个周日',
              desc:'纪念耶稣复活，滚彩蛋、兔子送巧克力、教堂弥撒。象征新生与希望，是基督教最重要的节日。',
              longDesc:'复活节(Easter)前有40天四旬斋期，圣周是高潮。传统包括装饰复活节彩蛋、寻找彩蛋游戏、教堂弥撒和丰盛的复活节午餐。在美国，白宫每年举办复活节滚彩蛋活动。热十字面包和巧克力蛋是节日标志食品。',
              duration:'1天(圣周约7天)', participants:'全球约25亿基督徒', history:'公元2世纪起纪念，325年尼西亚公会议确定日期计算法，融合了春分异教传统。', image:'photo-1477951578702-482e16bb58ca' },
            { name:'新年', country:'全球', icon:'🎆', month:1, season:'winter', category:'国家', date:'1月1日',
              desc:'公历新年第一天，全球以烟花倒数庆祝新岁到来。不同文化有各自的新年传统。',
              longDesc:'公历新年(New Year)是全球最广泛庆祝的世俗节日。悉尼、香港、迪拜、伦敦、纽约各有世界级的跨年烟花秀。元旦也是立新年决心的日子。不少文化还有自己的新年日期，如中国春节、犹太新年(Rosh Hashanah)等。',
              duration:'1天', participants:'全球约80亿人', history:'公元前46年凯撒制定儒略历确立1月1日为新年，1582年格里高利历沿袭此制。', image:'photo-1467810563316-b5476525c0f9' },
            { name:'火人节', country:'美国', icon:'🔥', month:8, season:'summer', category:'民俗', date:'8月最后一个周一前',
              desc:'内华达黑石沙漠中的大型艺术实验聚会。参与者共建临时城市黑石城，高潮是焚烧巨型木人。',
              longDesc:'火人节(Burning Man)遵循十大原则，包括激进的自我表达、不留痕迹和赠与经济。在寸草不生的盐湖沙漠中，参与者用一周时间搭建艺术装置、主题营地和巨型庙宇。最后焚烧木人和寺庙象征释放与重生。',
              duration:'8天', participants:'约7万人', history:'1986年始于旧金山海滩的小型篝火聚会，后发展为全球最著名的反主流文化盛典。', image:'photo-1517565363298-0df5b4e48cc3' },
            { name:'那达慕大会', country:'蒙古', icon:'🏇', month:7, season:'summer', category:'民俗', date:'7月11-15日',

              longDesc:'那达慕(Naadam)意为"游戏"或"娱乐"。512名摔跤手参加传统博克比赛，赛马骑手多为5-12岁儿童，赛程长达30公里。开幕仪式上骑士高举九斿白纛，传统长调歌声回荡草原。UNESCO人类非物质文化遗产。',
              duration:'5天', participants:'蒙古各地数十万人', history:'起源于成吉思汗时期的军事训练和部族大会，已有800余年历史。', image:'photo-1568722806-0a3cd7bcb26d' },
            { name:'格拉斯顿伯里音乐节', country:'英国', icon:'🎸', month:6, season:'summer', category:'音乐', date:'6月下旬',
              desc:'世界最大露天音乐节之一，萨默塞特沃西农场变身为音乐圣地，汇聚顶尖乐队与20万乐迷。',
              longDesc:'格拉斯顿伯里(Glastonbury)是全球最具影响力的音乐艺术节。除音乐舞台外还有马戏、戏剧、诗歌和绿色环保活动。标志性的金字塔舞台是传奇演出圣地。门票通常在开售后几分钟内售罄。泥泞的场地反而成了节日的另类象征。',
              duration:'5天', participants:'约21万观众', history:'1970年由农场主迈克尔·艾维斯创办，深受嬉皮文化和平与爱精神影响。', image:'photo-1470229722913-7c0e2dbbafd3' },
            { name:'科切拉音乐节', country:'美国', icon:'🎤', month:4, season:'spring', category:'音乐', date:'4月连续两个周末',
              desc:'加州沙漠中的音乐艺术盛宴，巨星云集，大型艺术装置和波西米亚风尚成为全球文化潮流。',
              longDesc:'科切拉(Coachella)是北美最受欢迎的音乐节。巨型艺术装置散布在沙漠绿洲般的场地中，日落时分的摩天轮是标志景观。波西米亚风格的穿搭引发全球模仿。除音乐外还有雕塑、装置艺术和美食体验。',
              duration:'6天(分两周)', participants:'每周末约12.5万人', history:'1999年由保罗·托莱特创办，场地曾用于1993年珍珠酱乐队的演出。', image:'photo-1533176951-f56f791f21f2' },
            { name:'明日世界电子音乐节', country:'比利时', icon:'🎧', month:7, season:'summer', category:'音乐', date:'7月下旬连续两个周末',
              desc:'全球最大电子舞曲音乐节，童话般的舞台设计和顶级DJ阵容，门票几分钟售罄的梦幻电音之旅。',
              longDesc:'Tomorrowland是电子音乐爱好者的朝圣地。每年设定奇幻主题，舞台宛如童话城堡。全球百大DJ齐聚。来自200多个国家的乐迷在比利时博姆小镇共舞。主办方甚至与航空公司合作开辟主题航班。',
              duration:'6天(分两周)', participants:'共约40万观众', history:'2005年创立于比利时博姆镇，以梦幻舞台和超强阵容迅速崛起为全球EDM第一品牌。', image:'photo-1492684223066-81342ee5ff30' },
            { name:'收获节', country:'加纳/非洲多国', icon:'🌽', month:8, season:'summer', category:'民俗', date:'8-9月(各地不同)',
              desc:'非洲农业社区的丰收庆典，以传统歌舞、鼓乐、祭祀和共享新收成的方式感谢大地。',
              longDesc:'非洲各地有不同版本的丰收节。加纳的Homowo意为"嘲笑饥饿"，人们用玉米粉和棕榈油制作传统食物Kpekple。尼日利亚的新薯节标志着新收获薯蓣可以食用。这些节日是维系社区纽带和传承文化的重要载体。',
              duration:'1-7天', participants:'西非各国数百万农民', history:'非洲最古老的农耕传统之一，数千年来一直是非洲农业社会最重要的时间节点。', image:'photo-1504870712357-65ea720d6078' },
            { name:'樱花前线', country:'日本/韩国/欧美', icon:'🌸', month:4, season:'spring', category:'季节', date:'3-5月(全球各地)',

        /* ═══════════════ STATE ═══════════════ */
        let activeCategory = 'all';
        let activeMonth = 0;

        /* ═══════════════ RENDER FUNCTIONS ═══════════════ */
        function seasonLabel(season) {
            return season === 'spring' ? '🌸 春' : season === 'summer' ? '☀️ 夏' :
                   season === 'autumn' ? '🍂 秋' : '❄️ 冬';
        }

        function unsplashUrl(photoId, w, h) {
            return photoId ? `https://images.unsplash.com/${photoId}?w=${w}&h=${h}&fit=crop&q=75` : '';
        }

        function renderFestivals(data) {
            const grid = document.getElementById('festivalGrid');
            document.getElementById('countBadge').textContent = `当前显示 ${data.length} 个节日`;
            document.getElementById('totalCount').textContent = festivals.length;
            const countries = new Set(festivals.map(f => f.country));
            document.getElementById('countryCount').textContent = countries.size;
            if (data.length === 0) {
                grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--text-muted);">
                  <p style="font-size:1.2rem;">🔍 未找到匹配的节日</p>
                  <p style="font-size:0.9rem;margin-top:0.5rem;">试试调整搜索条件或切换分类标签</p>
                </div>`;
                return;
            }
            grid.innerHTML = data.map((f, i) => {
                const img = unsplashUrl(f.image, 400, 200);
                return `<div class="festival-card" style="animation:fadeIn 0.5s ease-out ${i*0.04}s both; --i:${i};" onclick="this.classList.toggle('expanded')">
                  ${img ? `<div class="festival-img" style="background-image:url('${img}');"><div class="img-gradient"></div></div>` : ''}
                  <div class="festival-header">
                    <span class="festival-icon">${f.icon}</span>
                    <div>
                      <h3>${f.name}</h3>
                      <span class="region-label">${f.country}</span>
                    </div>
                  </div>
                  <div class="festival-body">
                    <div class="festival-meta">
                      <span>📅 ${f.date}</span>
                      <span class="season-tag ${f.season}">${seasonLabel(f.season)}</span>
                      <span style="background:rgba(139,157,131,0.1);padding:0.2rem 0.6rem;border-radius:2rem;font-size:0.75rem;">${f.category}</span>
                    </div>
                    <div class="festival-extra">
                      ${f.duration ? `<span>⏱️ ${f.duration}</span>` : ''}
                      ${f.participants ? `<span>👥 ${f.participants}</span>` : ''}
                    </div>
                    <p class="festival-desc">${f.desc}</p>
                    ${f.history ? `<p class="festival-history-block">📖 ${f.history}</p>` : ''}
                    ${f.longDesc ? `<p class="festival-long-desc">${f.longDesc}</p>` : ''}
                  </div>
                </div>`;
            }).join('');
        }

        /* ═══════════════ CALENDAR STRIP ═══════════════ */
        const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
        const calendarStrip = document.getElementById('calendarStrip');
        function buildCalendar() {
            calendarStrip.innerHTML = monthNames.map((m, i) => {
                const count = festivals.filter(f => f.month === i + 1).length;
                const activeCls = activeMonth === i + 1 ? ' active' : '';
                return `<div class="calendar-month${activeCls}" data-month="${i+1}"><div class="month-name">${m}</div><div class="fest-count">${count}个节日</div></div>`;
            }).join('');
            calendarStrip.querySelectorAll('.calendar-month').forEach(el => {
                el.addEventListener('click', function() {
                    const m = parseInt(this.dataset.month);
                    activeMonth = activeMonth === m ? 0 : m;
                    applyFilters();
                    buildCalendar();
                });
            });
        }
        buildCalendar();

        /* ═══════════════ FILTERS ═══════════════ */
        function applyFilters() {
            let data = festivals;
            if (activeCategory !== 'all') data = data.filter(f => f.category === activeCategory);
            if (activeMonth > 0) data = data.filter(f => f.month === activeMonth);
            const s = document.getElementById('festivalSearch').value.trim().toLowerCase();
            if (s) data = data.filter(f => f.name.toLowerCase().includes(s) || f.country.includes(s) || f.desc.includes(s));
            renderFestivals(data);
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    activeCategory = this.dataset.cat;
                    activeMonth = 0;
                    applyFilters();
                    buildCalendar();
                });
            });
            document.getElementById('festivalSearch').addEventListener('input', applyFilters);
        });

        /* ═══════════════ SPOTLIGHT ═══════════════ */
        function pickSpotlight() {
            return festivals[Math.floor(Math.random() * festivals.length)];
        }
        function renderSpotlight() {
            const f = pickSpotlight();

            document.getElementById('spotlightBody').innerHTML = `

                </div>

                ${f.history ? `<p class="spotlight-story">${f.history}</p>` : ''}
                <button class="spotlight-btn" onclick="refreshSpotlight();event.stopPropagation();">🔄 换一个节日</button>
            `;
        }
        function refreshSpotlight() {

        }

            { icon:'🌙', text:'开斋节的具体日期由伊斯兰教法学家在斋月第29天日落后观察新月来确定——如果阴天看不到月亮，斋月则自动延长至30天。' },
            { icon:'🧧', text:'春节的红包(压岁钱)传统源于古代"压祟"驱邪——长辈给晚辈铜钱以镇压名为"祟"的小妖，保护孩子平安过年。' },
            { icon:'🎆', text:'全球最大的新年倒计时派对在纽约时代广场，午夜降临时标志性的水晶球从高空缓缓降落，这一传统始于1907年。' },
            { icon:'🕊️', text:'巴厘岛安宁日前的Ogoh-Ogoh恶魔雕像由青年组织制作，最高可达6米。节日当晚抬着雕像绕村三圈后焚烧，象征驱逐邪灵。' },
            { icon:'🎪', text:'比利时班什狂欢节的吉勒服饰极为讲究：填充稻草的驼背、腰间挂满铃铛的腰带、以及重达3公斤的鸵鸟羽毛帽子，整套行头传世数代。' },
            { icon:'💧', text:'埃塞俄比亚主显节(Timkat)的约柜复制品(Tabot)被视为极为神圣——游行中始终用华盖伞遮蔽，女性信徒沿路铺洒草叶和鲜花。' },
            { icon:'🍀', text:'圣帕特里克节最初在爱尔兰是严肃的宗教节日，酒吧甚至要关门。直到20世纪70年代才转变为今天全球性的绿色狂欢派对。' },
            { icon:'🎨', text:'排灯节的Rangoli彩粉画是印度的传统地板艺术——女性清晨用彩色米粉或花瓣在门口绘制精美几何图案，迎接财富女神拉克什米。' },
            { icon:'☀️', text:'秘鲁太阳祭典礼全程使用克丘亚语（印加帝国官方语言），是世界上唯一以古印加语举行的国家级庆典仪式。' },
            { icon:'🤫', text:'巴厘岛安宁日不仅是人类的沉默——连岛上的狗也被要求保持安静。传统巡夜人(Pecalang)在街道上巡逻，确保没有任何人违规出门。' },
            { icon:'🎪', text:'巴西狂欢节的经济规模令人咋舌——每年为里约热内卢带来超过10亿美元收入，创造约25万个临时工作岗位。' },
            { icon:'🎃', text:'墨西哥亡灵节并非墨西哥版的万圣节——它根植于阿兹特克文明，核心信念是逝者在这一天被允许返回人间与亲人团聚。' }
        ];
        let factIndex = 0;
        function rotateFact() {
            const f = funFacts[factIndex % funFacts.length];
            document.getElementById('factText').textContent = f.text;
            document.querySelector('.did-you-know .fact-icon').textContent = f.icon;
            factIndex++;
        }
        rotateFact();
        setInterval(rotateFact, 5000);

        /* ═══════════════ SEASONS QUADRANT ═══════════════ */
        function renderSeasonsQuadrant() {
            const seasons = { spring:[], summer:[], autumn:[], winter:[] };
            festivals.forEach(f => { if (seasons[f.season]) seasons[f.season].push(f); });
            const labels = {
                spring:{ title:'🌸 春季 · 新生庆典', cls:'q-spring', emoji:'🌱' },
                summer:{ title:'☀️ 夏季 · 火热狂欢', cls:'q-summer', emoji:'🌻' },
                autumn:{ title:'🍂 秋季 · 丰收感恩', cls:'q-autumn', emoji:'🍁' },
                winter:{ title:'❄️ 冬季 · 祈福团圆', cls:'q-winter', emoji:'🕯️' }
            };
            document.getElementById('seasonsQuadrant').innerHTML = Object.entries(seasons).map(([key, fests]) => {
                const info = labels[key];
                const items = fests.slice(0, 10).map(f =>
                    `<li onclick="quickSearch('${f.name.replace(/'/g,"&#39;")}')"><span class="li-icon">${f.icon}</span>${f.name}</li>`
                ).join('');
                return `<div class="season-box ${info.cls}">
                  <div class="box-title">${info.emoji} ${info.title}<span style="font-size:0.7rem;color:var(--text-muted);margin-left:0.3rem;">(${fests.length}个)</span></div>
                  <ul>${items}</ul>
                </div>`;
            }).join('');
        }
        function quickSearch(name) {
            document.getElementById('festivalSearch').value = name;
            activeCategory = 'all';
            activeMonth = 0;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('.tab-btn[data-cat="all"]').classList.add('active');
            applyFilters();
            buildCalendar();
            window.scrollTo({ top:400, behavior:'smooth' });
        }
        renderSeasonsQuadrant();

        /* ═══════════════ FESTIVAL COMPARISON ═══════════════ */
        function populateCompareSelects() {
            const opts = festivals.map(f => `<option value="${f.name}|||${f.country}">${f.icon} ${f.name} (${f.country})</option>`).join('');
            document.getElementById('compareLeft').innerHTML  = '<option value="">— 选择第一个节日 —</option>' + opts;
            document.getElementById('compareRight').innerHTML = '<option value="">— 选择第二个节日 —</option>' + opts;
        }
        function runComparison() {
            const lv = document.getElementById('compareLeft').value;
            const rv = document.getElementById('compareRight').value;
            const resultDiv = document.getElementById('compareResult');
            if (!lv || !rv) { resultDiv.innerHTML = ''; return; }
            const [ln, lc] = lv.split('|||');
            const [rn, rc] = rv.split('|||');
            const left  = festivals.find(f => f.name === ln && f.country === lc);
            const right = festivals.find(f => f.name === rn && f.country === rc);
            if (!left || !right) return;
            const buildCard = (f) => {
                const img = unsplashUrl(f.image, 400, 180);
                return `<div class="compare-card">
                  ${img ? `<div style="width:100%;height:130px;background:url('${img}') center/cover;border-radius:var(--radius-md);margin-bottom:1rem;"></div>` : ''}
                  <h3>${f.icon} ${f.name}</h3>
                  <p class="compare-sub">${f.country}</p>
                  <div class="compare-row"><span class="clabel">日期</span><span class="cvalue">${f.date}</span></div>
                  <div class="compare-row"><span class="clabel">季节</span><span class="cvalue">${seasonLabel(f.season)}</span></div>
                  <div class="compare-row"><span class="clabel">类别</span><span class="cvalue">${f.category}</span></div>
                  ${f.duration ? `<div class="compare-row"><span class="clabel">时长</span><span class="cvalue">${f.duration}</span></div>` : ''}
                  ${f.participants ? `<div class="compare-row"><span class="clabel">规模</span><span class="cvalue">${f.participants}</span></div>` : ''}
                  <p style="color:var(--text-secondary);font-size:0.85rem;line-height:1.6;margin-top:0.8rem;">${f.desc}</p>
                  ${f.history ? `<p style="color:var(--text-muted);font-size:0.78rem;line-height:1.5;margin-top:0.5rem;font-style:italic;">📖 ${f.history}</p>` : ''}
                </div>`;
            };
            resultDiv.innerHTML = buildCard(left) + buildCard(right);
            resultDiv.scrollIntoView({ behavior:'smooth', block:'center' });
        }
        populateCompareSelects();

        /* ═══════════════ COUNTDOWN TIMER ═══════════════ */
        function initCountdown() {
            const target = new Date('2026-09-19T10:00:00+02:00');
            document.getElementById('countdownTarget').textContent = '🍺 慕尼黑啤酒节 2026 · 2026年9月19日 (德国慕尼黑)';
            function update() {
                const now = new Date();
                const diff = target - now;
                if (diff <= 0) {
                    document.getElementById('countdownTimer').innerHTML =
                        '<p style="font-size:1.3rem;color:var(--accent-terracotta);">🎉 节日正在进行中！</p>';
                    return;
                }
                const days    = Math.floor(diff / 86400000);
                const hours   = Math.floor((diff % 86400000) / 3600000);
                const minutes = Math.floor((diff % 3600000) / 60000);
                const seconds = Math.floor((diff % 60000) / 1000);
                document.getElementById('countdownTimer').innerHTML = `
                  <div class="countdown-unit"><div class="number">${days}</div><div class="label">天</div></div>
                  <div class="countdown-unit"><div class="number">${String(hours).padStart(2,'0')}</div><div class="label">时</div></div>
                  <div class="countdown-unit"><div class="number">${String(minutes).padStart(2,'0')}</div><div class="label">分</div></div>
                  <div class="countdown-unit"><div class="number">${String(seconds).padStart(2,'0')}</div><div class="label">秒</div></div>`;
            }
            update();
            setInterval(update, 1000);
        }
        initCountdown();

        /* ═══════════════ INIT ═══════════════ */
        renderFestivals(festivals);
    </script>
</body>
</html>
