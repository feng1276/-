    <div class="container">
        <div class="tcm-intro">
            <p><strong>关于中成药：</strong>中成药是以中药材为原料，按中医药理论组方，采用现代制剂技术制成的药品。与西药不同，中成药强调"辨证论治"——同一种病，不同证型需用不同药物。使用中成药前应了解自己的体质和证型，必要时咨询中医师。中成药并非"无害"，错误使用同样可能导致不良反应。</p>

                indications:'用于肾阳虚衰，腰膝酸软，畏寒肢冷，小便不利或反多，痰饮喘咳。',

                usage:'口服，一次9g，一日2次。',
                syndrome:'适用于肾阳虚证（畏寒肢冷、腰膝酸软、夜尿多）。阴虚火旺者禁用。',

            {name:'补中益气丸',type:'补益类',herbs:'炙黄芪、党参、炙甘草、白术、当归、升麻、柴胡、陈皮',
                indications:'用于脾胃虚弱，中气下陷，体倦乏力，食少腹胀，久泻，脱肛，子宫脱垂。',
                pharmacology:'补中益气，升阳举陷。具有增强免疫、抗疲劳、抗菌作用。',
                usage:'口服，一次9g，一日2-3次。',
                syndrome:'适用于脾胃气虚证（乏力、食少、腹胀）。阴虚火旺者慎用。',
                caution:'忌不易消化食物。感冒发热期间暂停服用。'},
            {name:'桂枝茯苓丸',type:'活血化瘀类',herbs:'桂枝、茯苓、牡丹皮、桃仁、白芍',
                indications:'用于妇人宿有癥块，或血瘀经闭，行经腹痛，产后恶露不尽。',
                pharmacology:'活血化瘀，缓消癥块。具有改善血液流变性、抗炎、镇痛作用。',
                usage:'口服，一次1丸，一日2次。',
                syndrome:'适用于血瘀证（痛经、癥瘕）。孕妇禁用。',
                caution:'孕妇及哺乳期妇女禁用。月经量多者慎用。'},
            {name:'银翘解毒片',type:'清热解毒类',herbs:'金银花、连翘、薄荷、荆芥、淡豆豉、牛蒡子、桔梗、淡竹叶、甘草',
                indications:'用于风热感冒，发热头痛，咳嗽口干，咽喉疼痛。',
                pharmacology:'辛凉透表，清热解毒。具有抗病毒、抗菌、解热、镇痛作用。',
                usage:'口服，一次4片，一日2-3次。',
                syndrome:'适用于风热感冒（发热重、微恶风、咽喉肿痛）。风寒感冒不宜使用。',
                caution:'忌辛辣、油腻食物。不宜在服药期间同时服用滋补性中成药。'},
            {name:'三黄片',type:'清热解毒类',herbs:'大黄、盐酸小檗碱、黄芩浸膏',
                indications:'用于三焦热盛，目赤肿痛，口鼻生疮，咽喉肿痛，牙龈出血，心烦口渴，尿赤便秘。',
                pharmacology:'清热解毒，泻火通便。具有泻下、抗菌、抗炎作用。',
                usage:'口服，一次4片，一日2次。',
                syndrome:'适用于实热证。阴虚火旺者慎用。',
                caution:'孕妇禁用。脾胃虚寒者慎用。不宜久服。'},
            {name:'香砂养胃丸',type:'理气和中类',herbs:'木香、砂仁，白术、陈皮、茯苓、半夏、香附、枳实、豆蔻、厚朴、广藿香、甘草',
                indications:'用于胃阳不足、湿阻气滞所致的胃痛、痞满，症见胃脘隐痛、脘闷不舒、呕吐酸水、嘈杂不适。',
                pharmacology:'温中和胃，理气化湿。具有调节胃肠运动、抗溃疡、抗菌作用。',
                usage:'口服，一次9g，一日2次。',
                syndrome:'适用于胃阳不足、湿阻气滞证（胃脘隐痛、脘闷不舒）。胃热证不宜使用。',
                caution:'忌生冷、油腻食物。糖尿病患者慎用。'},
            {name:'保和丸',type:'消食导滞类',herbs:'山楂、六神曲、半夏、茯苓、陈皮、连翘、莱菔子、麦芽',
                indications:'用于食积停滞，脘腹胀满，嗳腐吞酸，不欲饮食。',
                pharmacology:'消食导滞，和胃清热。具有促进消化、调节胃肠运动作用。',
                usage:'口服，一次8丸，一日3次。',
                syndrome:'适用于食积证（脘腹胀满、嗳腐吞酸）。脾胃虚寒者慎用。',
                caution:'忌油腻、生冷食物。孕妇慎用。'},
            {name:'麻杏止咳片',type:'止咳平喘类',herbs:'麻黄、苦杏仁、石膏、甘草',
                indications:'用于支气管炎、喘息性支气管炎引起的咳嗽、喘息。',
                pharmacology:'镇咳、祛痰、平喘。具有抗炎、抗菌、解热作用。',
                usage:'口服，一次3片，一日3次。',
                syndrome:'适用于肺热咳嗽（咳嗽、喘息、痰黄）。风寒咳嗽不宜使用。',
                caution:'高血压、心脏病患者慎用。孕妇慎用。运动员慎用。'},
            {name:'川贝枇杷膏',type:'润肺止咳类',herbs:'川贝母、枇杷叶、薄荷脑',
                indications:'用于风热感冒引起的燥咳，症见咳嗽痰多、痰粘不易咳出、胸闷咽干。',
                pharmacology:'清热宣肺，化痰止咳。具有镇咳、祛痰、解热作用。',
                usage:'口服，一次10-20ml，一日3次。',
                syndrome:'适用于风热燥咳（干咳、痰少、咽干）。风寒咳嗽不宜使用。',
                caution:'糖尿病患者忌用。忌辛辣、油腻食物。'},
            {name:'健脾丸',type:'补益类',herbs:'白术、木香、黄连、甘草、茯苓、人参、神曲、陈皮、砂仁、麦芽、山楂、山药、肉豆蔻',
                indications:'用于脾胃虚弱，脘腹胀满，食少便溏。',
                pharmacology:'健脾和胃，消食止泻。具有增强免疫、促进消化作用。',
                usage:'口服，一次9g，一日2次。',
                syndrome:'适用于脾胃虚弱证（食少便溏、脘腹胀满）。实热证不宜使用。',
                caution:'忌油腻、不易消化食物。感冒发热期间暂停服用。'},
            {name:'朱砂安神丸',type:'安神类',herbs:'朱砂、黄连、炙甘草、生地黄、当归',
                indications:'用于心火亢盛，阴血不足所致的心烦神乱，失眠多梦，惊悸怔忡，胸中烦热。',
                pharmacology:'清心养血，镇惊安神。具有镇静、抗惊厥作用。',
                usage:'口服，一次6-9g，一日2次。',
                syndrome:'适用于心火亢盛、阴血不足证（心烦失眠）。脾胃虚寒者不宜使用。',
                caution:'本品含朱砂，不宜长期服用。孕妇禁用。肝肾功能不全者慎用。'},
            {name:'左归丸',type:'滋补肾阴类',herbs:'熟地黄、菟丝子、牛膝、龟板胶、鹿角胶、山药、山茱萸、枸杞子',
                indications:'用于肾阴不足，头晕目眩，腰酸腿软，遗精滑泄，自汗盗汗，口燥咽干。',
                pharmacology:'滋肾补阴，填精益髓。具有增强免疫、抗疲劳、降血脂作用。',
                usage:'口服，一次9g，一日2次。',
                syndrome:'适用于肾阴虚证。肾阳虚者不宜使用。',
                caution:'感冒发热期间暂停服用。忌油腻食物。'},
            {name:'右归丸',type:'温补肾阳类',herbs:'熟地黄、附子、肉桂、山药、山茱萸、菟丝子、鹿角胶、枸杞子、当归、杜仲',
                indications:'用于肾阳不足，命门火衰，腰膝酸冷，精神不振，怯寒畏冷，阳痿遗精，大便溏薄，尿频而清。',
                pharmacology:'温补肾阳，填精止遗。具有增强免疫、抗衰老、性激素样作用。',
                usage:'口服，一次9g，一日2-3次。',
                syndrome:'适用于肾阳虚证（畏寒肢冷、阳痿遗精）。阴虚火旺者禁用。',
                caution:'孕妇禁用。忌生冷食物。'},
            {name:'四妙丸',type:'清热利湿类',herbs:'苍术、牛膝、黄柏、薏苡仁',
                indications:'用于湿热下注，筋骨疼痛，或足膝红肿热痛，或下肢痿软无力，或带下白浊。',
                pharmacology:'清热利湿，舒筋壮骨。具有抗炎、镇痛、利尿作用。',
                usage:'口服，一次6-9g，一日2-3次。',
                syndrome:'适用于湿热下注证（关节红肿疼痛、下肢痿软）。寒湿证不宜使用。',
                caution:'孕妇慎用。忌食辛辣、油腻食物。'},
        ];
        // 添加分类属性到中成药数据
        const tcmTypes = {
            '连花清瘟胶囊': 'clear_heat',
            '板蓝根颗粒': 'clear_heat',
            '牛黄解毒片': 'clear_heat',
            '双黄连口服液': 'clear_heat',
            '银翘解毒片': 'clear_heat',
            '三黄片': 'clear_heat',
            '感冒清热颗粒': 'release_ext',
            '藿香正气水': 'release_ext',
            '小柴胡颗粒': 'release_ext',
            '六味地黄丸': 'tonify',
            '杞菊地黄丸': 'tonify',
            '知柏地黄丸': 'tonify',
            '金匮肾气丸': 'tonify',
            '左归丸': 'tonify',
            '右归丸': 'tonify',
            '补中益气丸': 'tonify',
            '归脾丸': 'tonify',
            '健脾丸': 'tonify',
            '云南白药胶囊': 'activate',
            '复方丹参滴丸': 'activate',
            '血府逐瘀胶囊': 'activate',
            '桂枝茯苓丸': 'activate',
            '天王补心丹': 'calm',
            '朱砂安神丸': 'calm',
            '逍遥丸': 'tonify',
            '香砂养胃丸': 'tonify',
            '保和丸': 'tonify',
            '麻杏止咳片': 'release_ext',
            '川贝枇杷膏': 'release_ext',
            '四妙丸': 'clear_heat',
        };

        // 添加类型属性到每个中成药
        tcmData.forEach(item => {
            item.typeClass = tcmTypes[item.name] || 'other';
        });

        let activeType = 'all';

        // 渲染中成药列表
        function renderTCM() {
            const filtered = activeType === 'all' 
                ? tcmData 
                : tcmData.filter(d => d.typeClass === activeType || (activeType === 'other' && !Object.values(tcmTypes).includes(d.typeClass)));

            document.getElementById('tcmGrid').innerHTML = filtered.map((d, i) => `
            <div class="tcm-card" style="animation:fadeIn 0.4s ease ${i*0.04}s both;">
              <h3>${d.name}</h3>
              <span class="tcm-type">${d.type}</span>
              <div class="herbs">🌿 主要成分：${d.herbs}</div>
              <p><strong>功能主治：</strong>${d.indications}</p>
              <p><strong>药理作用：</strong>${d.pharmacology}</p>
              <p><strong>用法用量：</strong>${d.usage}</p>
              <p class="syndrome"><strong>辨证要点：</strong>${d.syndrome}</p>
              <p style="color:#b91c1c;font-size:0.8rem;"><strong>⚠️ 注意事项：</strong>${d.caution}</p>
            </div>`).join('');
        }

        // 添加筛选器事件监听
        document.getElementById('tcmFilterBar').addEventListener('click', function(e) {
            if (e.target.classList.contains('filter-chip')) {
                document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
                e.target.classList.add('active');
                activeType = e.target.dataset.type;
                renderTCM();
            }
        });

        // 初始渲染
        renderTCM();

        const st = document.createElement('style');
        st.textContent = '@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}';
        document.head.appendChild(st);
    </script>
</body>
</html>
