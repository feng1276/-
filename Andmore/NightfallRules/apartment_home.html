<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>夜色公寓 — 欢迎入住</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #060606;
  --surface: #0f0f0f;
  --surface2: #1a1a1a;
  --text: #c8c0b8;
  --text-dim: #706860;
  --text-bright: #e8e0d8;
  --red: #7a0a0a;
  --red-bright: #b01010;
  --red-glow: #ff2020;
  --amber: #b8701a;
  --amber-glow: #e0902a;
  --gold: #aa8820;
  --white: #e0dcd6;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Serif SC', serif;
  min-height: 100vh;
  overflow-x: hidden;
  cursor: default;
  user-select: none;
}

/* ===== SCANLINE OVERLAY ===== */
.scanlines {
  position: fixed; inset: 0; z-index: 9999; pointer-events: none;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
}
.scanlines::after {
  content: ''; position: fixed; inset: 0;
  background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.5) 100%);
  pointer-events: none;
}

/* ===== GRAIN OVERLAY ===== */
.grain {
  position: fixed; inset: 0; z-index: 9998; pointer-events: none; opacity: 0.04;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 256px 256px;
}

/* ===== RAIN CANVAS ===== */
#rain-canvas {
  position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.6;
}

/* ===== MAIN CONTAINER ===== */
.main-container {
  position: relative; z-index: 2;
  display: flex; flex-direction: column; align-items: center;
  min-height: 100vh; padding: 40px 20px;
}

/* ===== BUILDING SILHOUETTE ===== */
.building-scene {
  position: relative; width: 100%; max-width: 700px; height: 420px;
  margin: 0 auto 20px;
}
.building {
  position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 340px; height: 380px;
  background: linear-gradient(180deg, #1a1410 0%, #0d0a08 30%, #080605 100%);
  clip-path: polygon(
    30% 0%, 70% 0%,
    75% 8%, 72% 18%, 78% 25%, 71% 35%, 76% 45%, 70% 55%, 77% 65%, 69% 75%, 76% 85%, 68% 95%,
    100% 100%, 0% 100%,
    32% 95%, 24% 85%, 31% 75%, 23% 65%, 30% 55%, 24% 45%, 29% 35%, 22% 25%, 28% 18%, 25% 8%
  );
  border: 1px solid rgba(120,100,80,0.15);
}
.building::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent, rgba(10,5,0,0.8));
}

/* Windows */
.window {
  position: absolute; width: 18px; height: 22px;
  background: rgba(180,150,80,0.08);
  border: 1px solid rgba(120,100,60,0.2);
  border-radius: 1px;
}
.window.lit { background: rgba(220,180,80,0.15); border-color: rgba(180,140,60,0.3); }
.window.lit-warm { background: rgba(240,160,40,0.2); border-color: rgba(200,120,20,0.35); }
.window.lit-dim { background: rgba(180,120,40,0.1); border-color: rgba(140,100,40,0.25); }
.window.flicker { animation: windowFlicker 4s infinite; }
.window.flicker2 { animation: windowFlicker 5.3s infinite 1s; }
.window.flicker3 { animation: windowFlicker 3.7s infinite 2s; }
.window.dark-red { background: rgba(180,20,20,0.12); border-color: rgba(160,20,20,0.25); animation: redPulse 3s infinite; }

@keyframes windowFlicker {
  0%,94%,96%,98%,100% { opacity: 1; }
  95%,97%,99% { opacity: 0.15; }
}
@keyframes redPulse {
  0%,100% { background: rgba(180,20,20,0.08); }
  50% { background: rgba(200,30,30,0.2); }
}

/* ===== NEON SIGN ===== */
.neon-sign {
  position: absolute; top: 25px; left: 50%; transform: translateX(-50%);
  z-index: 3;
}
.neon-text {
  font-family: 'Orbitron', sans-serif;
  font-size: 42px; font-weight: 900; letter-spacing: 8px;
  color: #ff3030;
  text-shadow:
    0 0 7px #ff0000,
    0 0 10px #ff0000,
    0 0 21px #ff0000,
    0 0 42px #cc0000,
    0 0 82px #cc0000,
    0 0 92px #cc0000,
    0 0 102px #990000,
    0 0 151px #990000;
  animation: neonFlicker 1.8s infinite;
}
@keyframes neonFlicker {
  0%,19%,21%,23%,25%,54%,56%,100% {
    text-shadow:
      0 0 7px #ff0000, 0 0 10px #ff0000, 0 0 21px #ff0000,
      0 0 42px #cc0000, 0 0 82px #cc0000, 0 0 92px #cc0000,
      0 0 102px #990000, 0 0 151px #990000;
  }
  20%,24%,55% {
    text-shadow:
      0 0 4px #ff0000, 0 0 7px #ff0000, 0 0 13px #ff0000,
      0 0 28px #cc0000, 0 0 55px #cc0000;
  }
}
.neon-sub {
  font-family: 'Noto Serif SC', serif;
  font-size: 13px; text-align: center; color: #ff6040; letter-spacing: 4px;
  margin-top: 6px;
  text-shadow: 0 0 5px rgba(255,60,40,0.5);
}

/* ===== ENTRANCE AREA ===== */
.entrance {
  position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 80px; height: 100px; z-index: 2;
}
.entrance-door {
  width: 54px; height: 80px; margin: 0 auto;
  background: linear-gradient(180deg, #1a1008, #0c0804);
  border: 2px solid rgba(140,100,40,0.3);
  border-bottom: none;
  position: relative;
}
.entrance-door::after {
  content: ''; position: absolute; top: 5px; right: 6px;
  width: 4px; height: 4px; border-radius: 50%; background: rgba(200,150,40,0.5);
}
.entrance-light {
  width: 30px; height: 8px; margin: 0 auto;
  background: rgba(255,160,40,0.4);
  box-shadow: 0 0 15px rgba(255,160,40,0.3);
}

/* ===== TEXT CONTENT ===== */
.content-section {
  position: relative; z-index: 3; max-width: 700px; width: 100%;
  text-align: center; margin-top: 10px;
}
.title-chinese {
  font-size: 18px; color: var(--text-dim); letter-spacing: 6px; margin-bottom: 20px;
  font-weight: 400;
}
.intro-text {
  font-size: 15px; line-height: 2.2; color: var(--text);
  max-width: 550px; margin: 0 auto 30px;
  text-align: justify; text-indent: 2em;
}
.intro-text em { color: var(--red-bright); font-style: normal; }

/* ===== WARNING BOX ===== */
.warning-box {
  max-width: 550px; margin: 0 auto 35px;
  padding: 24px 28px;
  border: 1px solid rgba(180,20,20,0.25);
  background: rgba(120,10,10,0.05);
  border-radius: 2px;
  position: relative;
}
.warning-box::before {
  content: '⚠'; position: absolute; top: -13px; left: 20px;
  font-size: 20px; color: var(--red-bright);
  background: var(--bg); padding: 0 8px;
}
.warning-title {
  font-size: 14px; color: var(--red-bright); font-weight: 600; letter-spacing: 3px;
  margin-bottom: 12px;
}
.warning-text {
  font-size: 13px; line-height: 2; color: #b09080; text-align: left;
}

/* ===== BUTTONS ===== */
.btn-group {
  display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;
}
.btn {
  display: inline-block; padding: 14px 40px;
  font-family: 'Noto Serif SC', serif; font-size: 15px; letter-spacing: 4px;
  text-decoration: none; cursor: pointer; transition: all 0.4s;
  position: relative; overflow: hidden;
}
.btn-primary {
  background: transparent; color: #d4c0a0;
  border: 1px solid rgba(180,130,60,0.4);
}
.btn-primary:hover {
  background: rgba(180,130,60,0.08);
  border-color: rgba(220,170,80,0.7);
  box-shadow: 0 0 30px rgba(180,130,60,0.12);
  color: #f0e0c0;
  letter-spacing: 6px;
}
.btn-danger {
  background: transparent; color: #d08080;
  border: 1px solid rgba(160,30,30,0.3);
}
.btn-danger:hover {
  background: rgba(160,30,30,0.06);
  border-color: rgba(200,40,40,0.6);
  box-shadow: 0 0 30px rgba(180,20,20,0.1);
  color: #f0a0a0;
}

/* ===== FIRST RULE TEASER ===== */
.rule-teaser {
  max-width: 550px; margin: 30px auto 0; padding: 20px 24px;
  border-left: 3px solid rgba(180,20,20,0.3);
  text-align: left;
  opacity: 0; animation: fadeInRule 3s forwards 5s;
}
@keyframes fadeInRule {
  to { opacity: 1; }
}
.rule-teaser .rule-num {
  font-family: 'Share Tech Mono', monospace;
  font-size: 12px; color: var(--red-bright); letter-spacing: 2px;
}
.rule-teaser .rule-text {
  font-size: 14px; color: #a09080; line-height: 2; margin-top: 6px;
}

/* ===== BOTTOM INFO ===== */
.bottom-info {
  margin-top: 40px; font-size: 11px; color: var(--text-dim); letter-spacing: 3px;
}

/* ===== OCCASIONAL GLITCH ===== */
.glitch-flash {
  position: fixed; inset: 0; z-index: 10000; pointer-events: none;
  background: rgba(255,255,255,0.02);
  opacity: 0; animation: glitchFlash 8s infinite 3s;
}
@keyframes glitchFlash {
  0%,99.5%,100% { opacity: 0; }
  99.6% { opacity: 1; }
}

/* ===== RESPONSIVE ===== */
@media (max-width: 600px) {
  .neon-text { font-size: 28px; letter-spacing: 4px; }
  .building-scene { height: 300px; }
  .building { width: 240px; height: 270px; }
  .btn { padding: 12px 28px; font-size: 13px; }
  .intro-text { font-size: 13px; text-align: left; text-indent: 1.5em; }
}
</style>
</head>
<body>

<div class="scanlines"></div>
<div class="grain"></div>
<div class="glitch-flash"></div>
<canvas id="rain-canvas"></canvas>

<div class="main-container">

  <!-- 建筑场景 -->
  <div class="building-scene">
    <div class="neon-sign">
      <div class="neon-text">夜色公寓</div>
      <div class="neon-sub">N I G H T F A L L · A P A R T M E N T S</div>
    </div>
    <div class="building" id="building"></div>
    <div class="entrance">
      <div class="entrance-door"></div>
      <div class="entrance-light"></div>
    </div>
  </div>

  <!-- 文本内容 -->
  <div class="content-section">
    <div class="title-chinese">—— 欢迎入住 ——</div>
    <p class="intro-text">
      夜色公寓建于<em>1973年</em>，坐落于城市边缘。这里的房租低廉，交通便利，是许多人的理想居所。
      但我们有一些<em>小小的规矩</em>需要您遵守。
      请放心，只要您按照规矩行事，这里就是您<em>温暖的家</em>。
    </p>

    <div class="warning-box">
      <div class="warning-title">新住户须知</div>
      <div class="warning-text">
        所有新住户在领取钥匙前，必须仔细阅读《住户守则》。<br>
        未经阅读擅自入住者，本公寓不对其安全负责。<br>
        请记住：<strong style="color:#c04040;">规矩是为了保护您。</strong>
      </div>
    </div>

    <div class="btn-group">
      <a href="rules_main.html" class="btn btn-primary">阅读住户守则</a>
      <a href="elevator_rules.html" class="btn btn-danger">直接进入电梯</a>
    </div>

    <div class="rule-teaser">
      <div class="rule-num">规则 #001</div>
      <div class="rule-text">午夜十二点后，请勿直视走廊尽头的镜子超过三秒。</div>
    </div>

    <div class="bottom-info">
      夜色公寓管理委员会 · 敬上 · 1973—
    </div>
  </div>

</div>

<script>
// ===== 生成建筑窗户 =====
(function() {
  const b = document.getElementById('building');
  if (!b) return;
  const cols = [0.12,0.22,0.32,0.42,0.52,0.62,0.72,0.82];
  const rows = [0.06,0.14,0.22,0.30,0.38,0.46,0.54,0.62,0.70,0.78,0.86];
  const litClasses = ['lit','lit','lit-warm','lit-warm','lit-dim','lit-dim','',''];
  const flickerClasses = ['flicker','flicker2','flicker3'];
  for (let r = 0; r < rows.length; r++) {
    for (let c = 0; c < cols.length; c++) {
      if (Math.random() < 0.25) continue;
      const w = document.createElement('div');
      w.className = 'window';
      w.style.left = (cols[c] * 100) + '%';
      w.style.top = (rows[r] * 100) + '%';
      // Random lit class
      const lc = litClasses[Math.floor(Math.random() * litClasses.length)];
      if (lc) w.classList.add(lc);
      // Random flicker for lit windows
      if (lc && Math.random() < 0.12) {
        w.classList.add(flickerClasses[Math.floor(Math.random() * flickerClasses.length)]);
      }
      // Top floor red window (room 404 hint)
      if (r === 0 && (c === 3 || c === 4)) {
        w.className = 'window dark-red';
      }
      b.appendChild(w);
    }
  }
})();

// ===== 雨滴Canvas =====
(function() {
  const canvas = document.getElementById('rain-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let W, H, drops;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  function createDrops(count) {
    drops = [];
    for (let i = 0; i < count; i++) {
      drops.push({
        x: Math.random() * W,
        y: Math.random() * H,
        len: 8 + Math.random() * 20,
        speed: 6 + Math.random() * 14,
        opacity: 0.02 + Math.random() * 0.08,
        wind: -0.3 + Math.random() * 0.6
      });
    }
  }
  createDrops(220);

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = '#8090a0';
    for (let i = 0; i < drops.length; i++) {
      const d = drops[i];
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x + d.wind * 3, d.y + d.len);
      ctx.strokeStyle = `rgba(140,160,180,${d.opacity})`;
      ctx.lineWidth = 0.5 + Math.random() * 0.5;
      ctx.stroke();
      d.y += d.speed;
      d.x += d.wind;
      if (d.y > H + 20) { d.y = -20; d.x = Math.random() * W; }
      if (d.x > W + 10) d.x = -10;
      if (d.x < -10) d.x = W + 10;
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

// ===== 随机细微屏幕抖动 =====
(function() {
  function shake() {
    const intensity = 0.3;
    document.body.style.transform = `translate(${(Math.random()-0.5)*intensity}px, ${(Math.random()-0.5)*intensity}px)`;
    setTimeout(() => { document.body.style.transform = ''; }, 50 + Math.random() * 30);
    setTimeout(shake, 8000 + Math.random() * 20000);
  }
  setTimeout(shake, 12000);
})();

console.log('%c夜色公寓 %c— %c欢迎。请遵守规则。',
  'color:#c04040;font-size:20px;',
  'color:#888;',
  'color:#aaa;font-size:12px;');
</script>
</body>
</html>
