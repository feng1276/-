<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon 分类浏览</title>
    <link rel="icon" href="https://www.amazon.com/favicon.ico">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Amazon Ember',Arial,sans-serif;background:#E3E6E6;color:#0F1111;min-width:1000px;line-height:1.4}

        /* Header */
        #header{background:#131921;color:#fff;padding:10px 15px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
        .header-logo{flex-shrink:0;padding:5px 8px;border:1px solid transparent;border-radius:3px;cursor:pointer;display:flex;align-items:center}
        .header-logo:hover{border-color:#fff}
        .header-search{flex:1;min-width:300px;display:flex;height:42px;border-radius:6px;overflow:hidden}
        .search-input{flex:1;border:none;padding:0 12px;font-size:15px;outline:none}
        .search-btn{background:#FEBD69;border:none;width:45px;cursor:pointer;border-radius:0 6px 6px 0;display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .search-btn:hover{background:#F3A847}
        .header-cart{flex-shrink:0;padding:6px 10px;border:1px solid transparent;border-radius:3px;cursor:pointer;display:flex;align-items:flex-end;gap:4px;color:#fff;text-decoration:none}
        .header-cart:hover{border-color:#fff}
        .cart-count{color:#F90;font-size:16px;font-weight:700;min-width:19px;text-align:center}
        .cart-text{font-size:14px;font-weight:700;margin-bottom:4px;color:#fff}

        /* Subnav */
        #subnav{background:#232F3E;color:#fff;padding:0 15px;display:flex;align-items:center;font-size:14px;height:39px}
        .subnav-links{display:flex;align-items:center;gap:4px;overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none}
        .subnav-links::-webkit-scrollbar{display:none}
        .subnav-links a{color:#fff;padding:8px 10px;border:1px solid transparent;border-radius:3px;white-space:nowrap;font-size:14px;text-decoration:none}
        .subnav-links a:hover,.subnav-links a.active{text-decoration:none;border-color:#fff}
        .subnav-links a.active{color:#FEBD69;border-color:#FEBD69}
        .back-link{color:#ccc;padding:8px 10px;text-decoration:none;font-size:13px;margin-right:8px;border:1px solid transparent;border-radius:3px}
        .back-link:hover{color:#fff;border-color:#fff}

        /* Breadcrumb */
        .breadcrumb{max-width:1500px;margin:0 auto;padding:12px 20px;font-size:13px;color:#565959}
        .breadcrumb a{color:#007185;text-decoration:none}
        .breadcrumb a:hover{color:#C7511F;text-decoration:underline}
        .breadcrumb span{color:#0F1111;font-weight:700}

        /* Main */
        #main-content{max-width:1500px;margin:0 auto;padding:0 10px}
        .category-header{background:#fff;padding:20px 20px 16px;margin-bottom:16px;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
        .category-header h1{font-size:28px;font-weight:700;margin-bottom:4px}
        .category-header .result-count{font-size:14px;color:#565959}

        /* Filters bar */
        .filter-bar{display:flex;align-items:center;gap:12px;padding:10px 0;font-size:14px;flex-wrap:wrap}
        .filter-chip{background:#fff;border:1px solid #D5D9D9;border-radius:16px;padding:6px 14px;cursor:pointer;font-size:13px;white-space:nowrap;transition:all .15s}
        .filter-chip:hover{background:#F7FAFA;border-color:#999}
        .filter-chip.active{background:#232F3E;color:#fff;border-color:#232F3E}
        .sort-dropdown{background:#fff;border:1px solid #D5D9D9;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;outline:none;margin-left:auto}
        .sort-dropdown:hover{border-color:#999}

        /* Product Grid */
        .product-grid-cat{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:30px}
        .product-item{background:#fff;border-radius:4px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer;transition:box-shadow .2s,transform .2s;text-decoration:none;color:inherit;display:block}
        .product-item:hover{box-shadow:0 4px 16px rgba(0,0,0,.12);transform:translateY(-3px)}
        .product-item img{width:100%;height:200px;object-fit:cover}
        .prod-info{padding:14px}
        .prod-name{font-size:14px;line-height:1.4;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .prod-rating{color:#DD8C2F;font-size:13px;margin-bottom:4px}
        .prod-rating .rating-num{color:#007185;margin-left:4px}
        .prod-deal{font-size:11px;color:#C7511F;margin-bottom:4px;font-weight:700}
        .prod-price{font-size:20px;font-weight:700}
        .prod-price .currency{font-size:13px;vertical-align:super}
        .prod-price .cents{font-size:13px;vertical-align:super}
        .prod-list-price{font-size:12px;color:#565959;text-decoration:line-through;margin-left:4px}
        .prod-shipping{font-size:12px;color:#565959;margin-top:4px}
        .prime-badge{display:inline-flex;align-items:center;gap:2px;font-size:11px;color:#fff;background:#232F3E;padding:2px 6px;border-radius:3px;margin-top:4px}
        .badge-best-seller{display:inline-block;background:#C7511F;color:#fff;font-size:11px;padding:2px 6px;border-radius:2px;font-weight:600;margin-bottom:4px}
        .badge-limited{display:inline-block;background:#CC0C39;color:#fff;font-size:10px;padding:2px 6px;border-radius:2px;font-weight:600;margin-bottom:4px}
        .badge-amazon-choice{display:inline-flex;align-items:center;gap:4px;background:#232F3E;color:#fff;font-size:11px;padding:2px 6px;border-radius:2px;font-weight:600;margin-bottom:4px}

        /* Pagination */
        .pagination{display:flex;justify-content:center;align-items:center;gap:8px;padding:20px 0 40px}
        .page-btn{background:#fff;border:1px solid #D5D9D9;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:14px;text-decoration:none;color:#0F1111;transition:all .15s}
        .page-btn:hover{background:#F7FAFA;border-color:#999}
        .page-btn.active{background:#232F3E;color:#fff;border-color:#232F3E;cursor:default}
        .page-btn.disabled{color:#CCC;cursor:default;pointer-events:none}

        /* Footer */
        .back-to-top{background:#37475A;color:#fff;text-align:center;padding:15px;font-size:13px;cursor:pointer;text-decoration:none;display:block}
        .back-to-top:hover{background:#485769}
        footer{background:#232F3E;color:#fff;margin-top:20px}
        .footer-links{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;max-width:1200px;margin:0 auto;padding:40px 20px}
        .footer-col h4{font-size:16px;font-weight:700;margin-bottom:12px}
        .footer-col a{display:block;font-size:14px;color:#DDD;padding:3px 0;text-decoration:none}
        .footer-col a:hover{color:#fff;text-decoration:underline}
        .footer-legal{background:#131A22;padding:30px 20px;text-align:center}
        .footer-legal p{font-size:12px;color:#999;margin-top:6px}

        /* Toast */
        .toast-container{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
        .toast{background:#232F3E;color:#fff;padding:10px 24px;border-radius:8px;font-size:14px;font-weight:500;box-shadow:0 4px 20px rgba(0,0,0,.25);pointer-events:auto;animation:toast-in .35s ease-out,toast-out .3s ease-in forwards;animation-delay:0s,1.8s;opacity:0}
        @keyframes toast-in{0%{opacity:0;transform:translateY(20px)}100%{opacity:1;transform:translateY(0)}}
        @keyframes toast-out{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-12px)}}

        @media (max-width:1200px){.product-grid-cat{grid-template-columns:repeat(3,1fr)}}
        @media (max-width:900px){body{min-width:320px}.product-grid-cat{grid-template-columns:repeat(2,1fr)}.footer-links{grid-template-columns:repeat(2,1fr)}}
        @media (max-width:600px){.product-grid-cat{grid-template-columns:1fr}}
    </style>
</head>

        // ===== Filter & render =====
        let currentFilter = 'all';
        let currentSort = 'featured';
        let currentPage = 1;
        const perPage = 12;

        // Filter products by category
        function getFilteredProducts() {
            let prods = cat === 'all'
                ? allProducts
                : allProducts.filter(p => p.cats.includes(cat));
            if (prods.length === 0) prods = allProducts; // fallback

            // Apply chip filter
            if (currentFilter === 'prime') prods = prods.filter(p => p.prime);
            if (currentFilter === 'deal') prods = prods.filter(p => p.deal > 0);
            if (currentFilter === 'bestseller') prods = prods.filter(p => p.bestseller);

            // Apply sort
            if (currentSort === 'price-low') prods.sort((a,b) => a.price - b.price);
            if (currentSort === 'price-high') prods.sort((a,b) => b.price - a.price);
            if (currentSort === 'rating') prods.sort((a,b) => b.ratingNum - a.ratingNum);

            return prods;
        }

        function renderProducts() {
            const prods = getFilteredProducts();
            document.getElementById('resultCount').textContent = '共 ' + prods.length + ' 件商品';

            const totalPages = Math.ceil(prods.length / perPage);
            if (currentPage > totalPages) currentPage = totalPages || 1;

            const start = (currentPage - 1) * perPage;
            const pageProds = prods.slice(start, start + perPage);

            const grid = document.getElementById('productGrid');
            grid.innerHTML = pageProds.map(p => {
                const dealHtml = p.deal > 0 ? '<div class="prod-deal">优惠 ' + p.deal + '%</div>' : '';
                const listPriceHtml = p.listPrice ? '<span class="prod-list-price">$' + p.listPrice.toFixed(2) + '</span>' : '';
                const primeHtml = p.prime ? '<div class="prime-badge"><span style="color:#00A8E1">◈</span> Prime</div>' : '';
                const badgeHtml = p.bestseller
                    ? '<div class="badge-best-seller">🔥 Best Seller</div>'
                    : (p.deal > 30 ? '<div class="badge-limited">⏱ 限时特惠</div>' : '');
                return `
                <a href="yamax-product.html?id=${allProducts.indexOf(p)}&cat=${cat}" class="product-item">
                    <img src="${p.img}" alt="${p.name}" loading="lazy">
                    <div class="prod-info">
                        ${badgeHtml}
                        <div class="prod-name">${p.name}</div>
                        <div class="prod-rating">${p.rating} <span class="rating-num">${p.ratingNum.toLocaleString()}</span></div>
                        ${dealHtml}
                        <span class="prod-price"><span class="currency">$</span>${Math.floor(p.price)}<span class="cents">.${String(p.price.toFixed(2)).split('.')[1]}</span></span>${listPriceHtml}
                        <div class="prod-shipping">${p.prime ? '✓ Prime 免费配送' : '免费配送'}</div>
                        ${primeHtml}
                    </div>
                </a>`;
            }).join('');

            // Pagination
            const pag = document.getElementById('pagination');
            let pagHtml = '';
            pagHtml += currentPage <= 1
                ? '<span class="page-btn disabled">← 上一页</span>'
                : '<a href="#" class="page-btn" data-page="' + (currentPage - 1) + '">← 上一页</a>';
            for (let i = 1; i <= totalPages; i++) {
                pagHtml += i === currentPage
                    ? '<span class="page-btn active">' + i + '</span>'
                    : '<a href="#" class="page-btn" data-page="' + i + '">' + i + '</a>';
            }
            pagHtml += currentPage >= totalPages
                ? '<span class="page-btn disabled">下一页 →</span>'
                : '<a href="#" class="page-btn" data-page="' + (currentPage + 1) + '">下一页 →</a>';
            pag.innerHTML = pagHtml;

            // Wire pagination clicks
            pag.querySelectorAll('.page-btn[data-page]').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    currentPage = parseInt(this.dataset.page);
                    renderProducts();
                    window.scrollTo({top: 250, behavior: 'smooth'});
                });
            });
        }

        renderProducts();

        // ===== Filter chips =====
        document.querySelectorAll('.filter-chip').forEach(chip => {
            chip.addEventListener('click', function() {
                document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                currentPage = 1;
                renderProducts();
            });
        });

        // ===== Sort =====
        document.getElementById('sortSelect').addEventListener('change', function() {
            currentSort = this.value;
            currentPage = 1;
            renderProducts();
        });

        // ===== Subnav active =====
        document.querySelectorAll('#subnav .subnav-links a').forEach(link => {
            if (link.href.includes('cat=' + cat)) link.classList.add('active');
        });

        // ===== Search =====
        function doSearch() {
            const q = document.getElementById('searchInput').value.trim();
            if (q) {
                showToast('🔍 搜索: ' + q + ' — 演示页面，仅供展示');
            }
        }
        document.getElementById('searchBtn').addEventListener('click', doSearch);
        document.getElementById('searchInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') doSearch();
        });

        // ===== Cart from localStorage =====
        const savedCart = localStorage.getItem('yamaxCart');
        const cartItems = savedCart ? JSON.parse(savedCart) : [];
        document.getElementById('cartCount').textContent = cartItems.length;

        // ===== Toast =====
        function showToast(msg) {
            const t = document.createElement('div');
            t.className = 'toast';
            t.textContent = msg;
            document.getElementById('toastContainer').appendChild(t);
            setTimeout(() => { if (t.parentNode) t.parentNode.removeChild(t); }, 2200);
        }

        console.log('📂 分类页就绪: ' + info.name);
    })();
    </script>
