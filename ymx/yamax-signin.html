<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon 登录</title>
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Amazon Ember',Arial,sans-serif;background:#fff;color:#0F1111;min-width:320px;line-height:1.4;display:flex;flex-direction:column;min-height:100vh}
        .logo-bar{text-align:center;padding:20px}
        .logo-bar a{display:inline-block}
        .signin-box{max-width:350px;margin:0 auto;padding:20px 26px;border:1px solid #DDD;border-radius:4px;width:100%}
        .signin-box h1{font-size:28px;font-weight:400;margin-bottom:12px}
        .form-group{margin-bottom:14px}
        .form-group label{display:block;font-size:13px;font-weight:700;margin-bottom:4px}
        .form-group input{width:100%;padding:8px 10px;border:1px solid #A6A6A6;border-radius:3px;font-size:14px;outline:none;transition:border-color .15s}
        .form-group input:focus{border-color:#F90;box-shadow:0 0 0 2px rgba(249,123,11,.2)}
        .btn-signin{width:100%;padding:8px;background:#FFD814;border:1px solid #FCD200;border-radius:8px;font-size:14px;cursor:pointer;font-weight:500;margin:10px 0;transition:background .2s}
        .btn-signin:hover{background:#F7CA00}
        .btn-create{width:100%;padding:8px;background:#fff;border:1px solid #DDD;border-radius:8px;font-size:14px;cursor:pointer;margin:6px 0;transition:background .2s}
        .btn-create:hover{background:#F7FAFA}
        .signin-box .legal{font-size:12px;color:#565959;margin:12px 0;line-height:1.5}
        .signin-box .legal a{color:#007185;text-decoration:none}
        .signin-box .legal a:hover{color:#C7511F;text-decoration:underline}
        .signin-box .help-link{font-size:13px;color:#007185;text-decoration:none;display:flex;align-items:center;gap:4px;margin:8px 0}
        .signin-box .help-link:hover{color:#C7511F;text-decoration:underline}
        .divider-row{display:flex;align-items:center;gap:10px;margin:16px 0;color:#999;font-size:12px}
        .divider-row::before,.divider-row::after{content:'';flex:1;height:1px;background:#DDD}
        .new-section{text-align:center;max-width:350px;margin:0 auto;padding:10px 26px}
        .new-section h5{font-size:12px;color:#999;font-weight:400;margin-bottom:6px}
        .new-section .btn-create{width:100%}
        .divider-full{height:1px;background:#DDD;margin:20px auto;max-width:350px}
        .footer{text-align:center;padding:20px;margin-top:auto;background:linear-gradient(to bottom,#fff,#F0F0F0)}
        .footer-links{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-bottom:10px}
        .footer-links a{font-size:12px;color:#007185;text-decoration:none}
        .footer-links a:hover{color:#C7511F;text-decoration:underline}
        .footer p{font-size:11px;color:#999}

        .toast-container{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
        .toast{background:#232F3E;color:#fff;padding:10px 24px;border-radius:8px;font-size:14px;font-weight:500;box-shadow:0 4px 20px rgba(0,0,0,.25);pointer-events:auto;animation:toast-in .35s ease-out,toast-out .3s ease-in forwards;animation-delay:0s,1.8s;opacity:0}
        @keyframes toast-in{0%{opacity:0;transform:translateY(20px)}100%{opacity:1;transform:translateY(0)}}
        @keyframes toast-out{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-12px)}}

        .success-box{display:none;max-width:350px;margin:0 auto;padding:20px 26px;text-align:center}
        .success-box .success-icon{font-size:56px;margin-bottom:12px}
        .success-box h2{font-size:22px;margin-bottom:8px;font-weight:400}
        .success-box p{font-size:14px;color:#565959;margin-bottom:16px}
        .btn-back{display:inline-block;padding:10px 32px;background:#FFD814;border:1px solid #FCD200;border-radius:20px;font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;color:#111;transition:background .2s}
        .btn-back:hover{background:#F7CA00}
    </style>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
</head>
<body>

    <div class="logo-bar">
        <a href="yamax.html">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 97 30" fill="none" width="110" height="35">
                <path d="M71.5 19.8c-.8 0-1.4-.2-1.9-.6-.5-.4-.8-1-.8-1.7 0-.8.3-1.4.8-1.8.5-.4 1.2-.6 2-.6.6 0 1.1.1 1.5.3.4.2.6.4.6.6 0 .2-.1.4-.3.5-.2.1-.4.2-.7.2-.2 0-.3-.1-.5-.2-.1-.1-.3-.1-.5-.1-.4 0-.7.1-.9.3-.2.2-.3.5-.3.9 0 .4.1.7.3.9.2.2.5.3.9.3.3 0 .5 0 .7-.1.2-.1.3-.1.3-.2v-.6h-.9c-.2 0-.4-.1-.5-.2-.1-.1-.2-.3-.2-.5 0-.2.1-.4.2-.5.2-.1.4-.2.6-.2h1.3c.3 0 .5.1.6.2.1.1.2.3.2.5v1.2c0 .5-.1.8-.4 1-.2.3-.9.5-1.8.5zM76.3 19.7h-.7l-2-5.8c0-.1-.1-.2-.1-.4 0-.2 0-.3.1-.4.1-.1.3-.2.5-.2.2 0 .4.1.5.2.1.1.2.3.3.5l1.5 4.6h.1l1.5-4.6c.1-.2.2-.4.3-.5.1-.1.3-.2.5-.2.2 0 .4.1.5.2.1.1.1.3.1.5 0 .1 0 .3-.1.4l-2.1 5.7zM79.6 17c0-1 .3-1.8.8-2.3.5-.5 1.2-.8 2-.8.8 0 1.5.3 1.9.8.4.5.7 1.3.7 2.3 0 1-.3 1.8-.8 2.3-.5.5-1.1.7-1.9.7-.8 0-1.4-.2-1.9-.7-.5-.5-.8-1.3-.8-2.3zm1.4 0c0 .6.1 1.1.4 1.5.2.3.6.5 1 .5.4 0 .7-.2.9-.5.3-.4.4-.9.4-1.5 0-.6-.1-1.1-.4-1.5-.2-.3-.6-.5-.9-.5-.4 0-.7.2-.9.5-.3.4-.5.9-.5 1.5zM86.2 17c0-1 .3-1.8.8-2.3.5-.5 1.2-.8 2-.8.8 0 1.5.3 1.9.8.4.5.7 1.3.7 2.3 0 1-.3 1.8-.8 2.3-.5.5-1.1.7-1.9.7-.8 0-1.4-.2-1.9-.7-.5-.5-.8-1.3-.8-2.3zm1.4 0c0 .6.1 1.1.4 1.5.2.3.6.5 1 .5.4 0 .7-.2.9-.5.3-.4.4-.9.4-1.5 0-.6-.1-1.1-.4-1.5-.2-.3-.6-.5-.9-.5-.4 0-.7.2-.9.5-.3.4-.5.9-.5 1.5z" fill="#111"/>
                <path d="M2.4 24V6.2h3.7l4.9 7.6c.4.7.8 1.5 1.1 2.3h.1c-.1-.9-.2-1.8-.2-2.8V6.2h3.5V24h-3.4L7.1 16.2c-.5-.8-.9-1.6-1.2-2.4h-.1c.1.9.2 1.8.2 2.8V24H2.4zM21.1 24V6.2h9v2.8h-5.4v4.8h4.8v2.8h-4.8v4.6h5.5V24h-9.1zM32.3 24V6.2h9.1v2.8h-5.5v4.8h4.8v2.8H36v4.6h5.5V24h-9.1zM49.7 24l-1.3-3.5h-5.1L42 24h-3.8l5.7-17.8h2.7L52.5 24h-2.8zm-2.5-6.2l-1.5-4.2c-.2-.6-.4-1.3-.5-2h-.1c-.1.7-.3 1.4-.5 2l-1.5 4.2h4.1zM57.3 24V9h-3.3V6.2h10.2V9h-3.3v15h-3.6zM65.1 24V6.2h3.6V24h-3.6z" fill="#111"/>
                <path d="M84.5 29.3c-4.8 3.5-11.7 5.4-17.6 5.4-8.3 0-15.8-3.1-21.5-8.2-.4-.4 0-1 .5-.7 6.1 3.6 13.7 5.7 21.5 5.7 5.3 0 11.1-1.1 16.4-3.4.8-.3 1.5.5.7 1.2z" fill="#F90"/>
                <path d="M86.1 27.5c-.6-.8-4-0.4-5.5-.2-.5.1-.5-.3-.1-.6 2.7-1.9 7.1-1.4 7.6-.7.5.6-.1 5.2-2.7 7.4-.4.3-.8.2-.6-.3.6-1.5 1.9-4.9 1.3-5.6z" fill="#F90"/>
            </svg>
        </a>
    </div>

    <!-- Sign In Form -->
    <div class="signin-box" id="signinForm">
        <h1>登录</h1>
        <form id="loginForm" onsubmit="return handleSignin(event)">
            <div class="form-group">
                <label for="email">邮箱或手机号码</label>
                <input type="text" id="email" placeholder="" value="demo@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="" value="" required>
            </div>
            <button type="submit" class="btn-signin">登录</button>
        </form>
        <p class="legal">登录即表示您同意 Amazon 的<a href="#">使用条款</a>和<a href="#">隐私声明</a>。</p>
        <a href="#" class="help-link">▶ 需要帮助？</a>
    </div>

    <!-- Success -->
    <div class="success-box" id="successBox">
        <div class="success-icon">👤</div>
        <h2>登录成功！</h2>
        <p id="successMsg">欢迎回来，Demo User<br>这是仿制页面，登录仅供展示。</p>
        <a href="yamax.html" class="btn-back">← 返回首页继续购物</a>
    </div>

    <div class="divider-full"></div>

    <div class="new-section">
        <h5>新用户？</h5>
        <button class="btn-create" id="btnCreateAccount">创建您的 Amazon 账户</button>
    </div>

    <div class="footer">
        <div class="footer-links">
            <a href="#">使用条款</a>
            <a href="#">隐私声明</a>
            <a href="#">帮助</a>
        </div>
        <p>© 1996-2026, Amazon.com, Inc. — 仿制网页，仅供学习参考</p>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
    function handleSignin(e) {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        if (!email) {
            showToast('⚠️ 请输入邮箱地址');
            return false;
        }
        // Show success
        document.getElementById('signinForm').style.display = 'none';
        document.querySelector('.new-section').style.display = 'none';
        document.querySelector('.divider-full').style.display = 'none';
        document.getElementById('successBox').style.display = 'block';
        document.getElementById('successMsg').innerHTML = '欢迎回来，' + email.split('@')[0] + '！<br>这是仿制页面，登录仅供展示。';
        showToast('✅ 登录成功！正在跳转到首页…');
        // Auto redirect
        setTimeout(function() {
            window.location.href = 'yamax.html';
        }, 2500);
        return false;
    }

    document.getElementById('btnCreateAccount').addEventListener('click', function() {
        showToast('📝 创建账户 — 演示页面，仅供展示');
    });

    document.querySelector('.help-link').addEventListener('click', function(e) {
        e.preventDefault();
        showToast('🆘 帮助中心 — 演示页面，仅供展示');
    });

    function showToast(msg) {
        var t = document.createElement('div');
        t.className = 'toast';
        t.textContent = msg;
        document.getElementById('toastContainer').appendChild(t);
        setTimeout(function() { if (t.parentNode) t.parentNode.removeChild(t); }, 2200);
    }
    </script>
</body>
</html>
