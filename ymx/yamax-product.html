<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品详情 — Amazon 仿制</title>
    <link rel="icon" href="https://www.amazon.com/favicon.ico">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Amazon Ember',Arial,sans-serif;background:#E3E6E6;color:#0F1111;min-width:1000px;line-height:1.4}

        /* Header */
        #header{background:#131921;color:#fff;padding:10px 15px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
        .header-logo{flex-shrink:0;padding:5px 8px;border:1px solid transparent;border-radius:3px;cursor:pointer;display:flex;align-items:center}
        .header-logo:hover{border-color:#fff}
        .header-search{flex:1;min-width:300px;display:flex;height:42px;border-radius:6px;overflow:hidden}
        .search-input{flex:1;border:none;padding:0 12px;font-size:15px;outline:none}
        .search-btn{background:#FEBD69;border:none;width:45px;cursor:pointer;border-radius:0 6px 6px 0;display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .search-btn:hover{background:#F3A847}
        .header-cart{flex-shrink:0;padding:6px 10px;border:1px solid transparent;border-radius:3px;cursor:pointer;display:flex;align-items:flex-end;gap:4px;color:#fff;text-decoration:none}
        .header-cart:hover{border-color:#fff}
        .cart-count{color:#F90;font-size:16px;font-weight:700;min-width:19px;text-align:center}
        .cart-text{font-size:14px;font-weight:700;margin-bottom:4px;color:#fff}

        /* Subnav */
        #subnav{background:#232F3E;color:#fff;padding:0 15px;display:flex;align-items:center;font-size:14px;height:39px}
        .back-link{color:#ccc;padding:8px 10px;text-decoration:none;font-size:13px;border:1px solid transparent;border-radius:3px}
        .back-link:hover{color:#fff;border-color:#fff}

        /* Breadcrumb */
        .breadcrumb{max-width:1500px;margin:0 auto;padding:12px 20px;font-size:13px;color:#565959}
        .breadcrumb a{color:#007185;text-decoration:none}
        .breadcrumb a:hover{color:#C7511F;text-decoration:underline}

        /* Main */
        #main-content{max-width:1500px;margin:0 auto;padding:20px 10px}
        .product-detail{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-bottom:30px}
        .product-gallery{position:sticky;top:80px;align-self:start}
        .product-gallery .main-img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08)}
        .product-info{background:#fff;padding:28px;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
        .product-info h1{font-size:26px;font-weight:700;line-height:1.3;margin-bottom:8px}
        .product-info .brand{font-size:14px;color:#007185;margin-bottom:8px}
        .product-info .brand a{color:#007185;text-decoration:none}
        .product-info .brand a:hover{color:#C7511F;text-decoration:underline}
        .product-info .rating-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:14px}
        .product-info .stars{color:#DD8C2F;font-size:18px}
        .product-info .rating-link{color:#007185;text-decoration:none;font-size:14px}
        .product-info .rating-link:hover{color:#C7511F}
        .product-info .divider{height:1px;background:#DDD;margin:16px 0}
        .product-info .price-block{margin-bottom:16px}
        .product-info .deal-badge{display:inline-block;background:#CC0C39;color:#fff;font-size:12px;padding:3px 8px;border-radius:3px;font-weight:700;margin-bottom:6px}
        .product-info .list-price{font-size:14px;color:#565959;text-decoration:line-through}
        .product-info .current-price{font-size:32px;font-weight:700;color:#B12704}
        .product-info .current-price .currency{font-size:18px;vertical-align:super}
        .product-info .current-price .cents{font-size:18px;vertical-align:super}
        .product-info .savings{font-size:14px;color:#0F1111;margin-top:4px}
        .product-info .prime-badge{display:inline-flex;align-items:center;gap:4px;background:#232F3E;color:#fff;font-size:12px;padding:4px 10px;border-radius:3px;margin:8px 0}
        .product-info .stock-status{color:#007600;font-size:16px;font-weight:500;margin:8px 0}
        .product-info .stock-status.out{color:#CC0C39}
        .product-info .qty-row{display:flex;align-items:center;gap:10px;margin:16px 0}
        .product-info .qty-row label{font-size:14px;font-weight:700}
        .product-info .qty-row select{padding:6px 12px;border:1px solid #DDD;border-radius:8px;font-size:14px;outline:none;background:#F0F2F2;cursor:pointer}
        .btn-add-cart{display:block;width:100%;padding:12px;background:#FFD814;border:1px solid #FCD200;border-radius:20px;font-size:15px;font-weight:500;cursor:pointer;margin-bottom:8px;transition:background .2s}
        .btn-add-cart:hover{background:#F7CA00}
        .btn-add-cart:active{background:#F0B800;transform:scale(.98)}
        .btn-buy-now{display:block;width:100%;padding:12px;background:#FFA41C;border:1px solid #FF8F00;border-radius:20px;font-size:15px;font-weight:500;cursor:pointer;margin-bottom:8px;transition:background .2s}
        .btn-buy-now:hover{background:#FA8900}
        .btn-buy-now:active{background:#F08800;transform:scale(.98)}
        .btn-wishlist{display:block;width:100%;padding:10px;background:#fff;border:1px solid #DDD;border-radius:20px;font-size:14px;cursor:pointer;transition:background .2s}
        .btn-wishlist:hover{background:#F7FAFA}
        .secure-note{font-size:12px;color:#565959;margin-top:12px;display:flex;align-items:center;gap:4px}

        /* Description */
        .product-description{background:#fff;padding:24px;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:20px}
        .product-description h3{font-size:18px;font-weight:700;margin-bottom:12px}
        .product-description p{font-size:14px;line-height:1.7;color:#333;margin-bottom:8px}
        .product-description ul{padding-left:20px;margin:8px 0}
        .product-description li{font-size:14px;line-height:1.8;color:#333}

        /* Related */
        .related-section{margin:20px 0}
        .related-section h3{font-size:21px;margin-bottom:14px}
        .related-row{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;-ms-overflow-style:none;scrollbar-width:none}
        .related-row::-webkit-scrollbar{display:none}
        .related-item{flex-shrink:0;width:180px;background:#fff;border-radius:4px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer;transition:box-shadow .2s,transform .2s;text-decoration:none;color:inherit;display:block}
        .related-item:hover{box-shadow:0 4px 12px rgba(0,0,0,.12);transform:translateY(-2px)}
        .related-item img{width:100%;height:160px;object-fit:cover}
        .related-item .rel-info{padding:10px}
        .related-item .rel-name{font-size:13px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical}
        .related-item .rel-price{font-size:16px;font-weight:700;margin-top:4px}

        /* Toast */
        .toast-container{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
        .toast{background:#232F3E;color:#fff;padding:10px 24px;border-radius:8px;font-size:14px;font-weight:500;box-shadow:0 4px 20px rgba(0,0,0,.25);pointer-events:auto;animation:toast-in .35s ease-out,toast-out .3s ease-in forwards;animation-delay:0s,1.8s;opacity:0}
        @keyframes toast-in{0%{opacity:0;transform:translateY(20px)}100%{opacity:1;transform:translateY(0)}}
        @keyframes toast-out{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-12px)}}

        /* Added to cart animation */
        .cart-pop{animation:cart-pop .4s ease-out}
        @keyframes cart-pop{0%{transform:scale(1)}40%{transform:scale(1.35);color:#F90}100%{transform:scale(1)}}

        /* Success modal */
        .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
        .modal-overlay.show{opacity:1;visibility:visible}
        .modal-box{background:#fff;border-radius:8px;padding:28px;max-width:420px;width:90%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.3)}
        .modal-box .check-icon{font-size:48px;margin-bottom:12px}
        .modal-box h4{font-size:18px;margin-bottom:8px}
        .modal-box p{font-size:14px;color:#565959;margin-bottom:16px}
        .modal-box .btn-go-cart{display:inline-block;padding:10px 32px;background:#FFD814;border:1px solid #FCD200;border-radius:20px;font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;color:#111;margin:4px;transition:background .2s}
        .modal-box .btn-go-cart:hover{background:#F7CA00}
        .modal-box .btn-continue{display:inline-block;padding:10px 32px;background:#fff;border:1px solid #DDD;border-radius:20px;font-size:14px;cursor:pointer;text-decoration:none;color:#111;margin:4px;transition:background .2s}
        .modal-box .btn-continue:hover{background:#F7FAFA}

        /* Footer */
        footer{background:#232F3E;color:#fff;margin-top:40px}
        .footer-legal{background:#131A22;padding:30px 20px;text-align:center}
        .footer-legal p{font-size:12px;color:#999}

        @media (max-width:900px){
            body{min-width:320px}
            .product-detail{grid-template-columns:1fr;gap:20px}
            .product-gallery{position:static}
        }
    </style>
</head>

            {name:'真无线降噪耳机 蓝牙5.3',price:49.99,listPrice:null,rating:'★★★★★',ratingNum:7891,deal:0,prime:true,img:'https://images.unsplash.com/photo-1583394838336-acd977736f90?w=600&h=600&fit=crop',bestseller:false,cats:['electronics','all'],brand:'AudioPro',desc:'真无线降噪耳机，蓝牙5.3稳定连接。混合降噪技术，三档模式切换。8小时单次续航，充电盒额外32小时。IPX5防水防汗，适合运动。触控操作，支持语音助手。',features:['蓝牙 5.3','混合降噪','8+32小时续航','IPX5 防水','触控操作','语音助手']}
        ];

        // ===== Parse URL =====
        const params = new URLSearchParams(window.location.search);
        const productId = parseInt(params.get('id')) || 0;
        const cat = params.get('cat') || 'all';
        const product = allProducts[productId] || allProducts[0];

        // ===== Category names =====
        const catNames = {electronics:'电子设备',computers:'电脑及配件',home:'家居与厨房',books:'书籍',toys:'玩具与游戏',fashion:'时尚服饰',beauty:'美妆护肤',sports:'运动与户外',all:'全部商品'};
        const catName = catNames[cat] || '分类';

        // ===== Render product =====
        document.title = product.name + ' — Amazon';
        document.getElementById('mainImg').src = product.img;
        document.getElementById('mainImg').alt = product.name;
        document.getElementById('prodTitle').textContent = product.name;
        document.getElementById('prodStars').textContent = product.rating;
        document.getElementById('ratingLink').textContent = product.ratingNum.toLocaleString() + ' 条评价';
        document.getElementById('brandLink').textContent = product.brand;
        document.getElementById('breadCatLink').textContent = catName;
        document.getElementById('breadCatLink').href = 'yamax-category.html?cat=' + cat;
        document.getElementById('breadProduct').textContent = product.name;

        // Price
        const priceWhole = Math.floor(product.price);
        const priceCents = String(product.price.toFixed(2)).split('.')[1];
        document.getElementById('currentPrice').innerHTML = '<span class="currency">$</span>' + priceWhole + '<span class="cents">.' + priceCents + '</span>';

        if (product.listPrice) {
            document.getElementById('listPrice').style.display = 'block';
            document.getElementById('listPrice').textContent = '$' + product.listPrice.toFixed(2);
            document.getElementById('savings').style.display = 'block';
            document.getElementById('savings').textContent = '节省 $' + (product.listPrice - product.price).toFixed(2) + ' (' + product.deal + '%)';
        }

        if (product.deal > 0) {
            document.getElementById('dealBadge').style.display = 'inline-block';
            document.getElementById('dealBadge').textContent = '优惠 ' + product.deal + '%';
        }

        // Status
        if (Math.random() > 0.9) {
            document.getElementById('stockStatus').textContent = '✗ 暂时缺货';
            document.getElementById('stockStatus').classList.add('out');
        }

        // Description
        let descHtml = '<h3>商品描述</h3><p>' + product.desc + '</p>';
        descHtml += '<h3 style="margin-top:16px">产品特点</h3><ul>';
        product.features.forEach(f => { descHtml += '<li>' + f + '</li>'; });
        descHtml += '</ul>';
        document.getElementById('productDesc').innerHTML = descHtml;

        // Related products
        const related = allProducts.filter((_, i) => i !== productId).slice(0, 6);
        document.getElementById('relatedRow').innerHTML = related.map((p, i) => {
            const realIndex = allProducts.indexOf(p);
            return `
            <a href="yamax-product.html?id=${realIndex}&cat=${cat}" class="related-item">
                <img src="${p.img.replace('600','400')}" alt="${p.name}" loading="lazy">
                <div class="rel-info">
                    <div class="rel-name">${p.name}</div>
                    <div class="rel-price">$${p.price.toFixed(2)}</div>
                </div>
            </a>`;
        }).join('');

        // ===== Cart functionality =====
        const savedCart = localStorage.getItem('yamaxCart');
        let cartItems = savedCart ? JSON.parse(savedCart) : [];
        updateCartCount();

        function updateCartCount() {
            document.getElementById('cartCount').textContent = cartItems.length;
        }

        function saveCart() {
            localStorage.setItem('yamaxCart', JSON.stringify(cartItems));
            updateCartCount();
        }

        function addToCart() {
            const qty = parseInt(document.getElementById('qtySelect').value);
            const existing = cartItems.find(item => item.productId === productId);
            if (existing) {
                existing.qty += qty;
            } else {
                cartItems.push({
                    productId: productId,
                    name: product.name,
                    price: product.price,
                    img: product.img,
                    qty: qty,
                    prime: product.prime
                });
            }
            saveCart();

            // Animate cart icon
            const countEl = document.getElementById('cartCount');
            countEl.classList.add('cart-pop');
            setTimeout(() => countEl.classList.remove('cart-pop'), 400);

            // Show modal
            const total = (product.price * qty).toFixed(2);
            document.getElementById('modalCartInfo').textContent = qty + ' 件商品，小计 $' + total;
            document.getElementById('modalOverlay').classList.add('show');
        }

        document.getElementById('btnAddCart').addEventListener('click', addToCart);
        document.getElementById('btnBuyNow').addEventListener('click', function() {
            addToCart();
            showToast('⚡ 正在跳转到结算页面…');
            setTimeout(() => { window.location.href = 'yamax-cart.html'; }, 1500);
        });
        document.getElementById('btnWishlist').addEventListener('click', function() {
            this.textContent = '❤ 已添加到心愿单！';
            this.style.color = '#CC0C39';
            showToast('❤ 已添加到心愿单！');
            setTimeout(() => { this.textContent = '♡ 添加到心愿单'; this.style.color = ''; }, 2500);
        });

        // Modal
        document.getElementById('btnContinue').addEventListener('click', function() {
            document.getElementById('modalOverlay').classList.remove('show');
        });
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) this.classList.remove('show');
        });

        // ===== Search =====
        function doSearch() {
            const q = document.getElementById('searchInput').value.trim();
            if (q) showToast('🔍 搜索: ' + q + ' — 演示页面，仅供展示');
        }
        document.getElementById('searchBtn').addEventListener('click', doSearch);
        document.getElementById('searchInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') doSearch();
        });

        // ===== Toast =====
        function showToast(msg) {
            const t = document.createElement('div');
            t.className = 'toast';
            t.textContent = msg;
            document.getElementById('toastContainer').appendChild(t);
            setTimeout(() => { if (t.parentNode) t.parentNode.removeChild(t); }, 2200);
        }

        console.log('🛍️ 商品详情页就绪: ' + product.name);
    })();
    </script>
</body>
</html>
