<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>记忆翻牌</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --surface: #16213e;
            --text: #e2e8f0;
            --text-secondary: #94a3b8;
            --accent: #f59e0b;
            --success: #10b981;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        header {
            text-align: center;
            padding: 1.5rem;
            width: 100%;
            background: var(--surface);
        }
        header h1 { font-size: 1.8rem; margin-bottom: 0.25rem; }
        header p { color: var(--text-secondary); font-size: 0.9rem; }
        .stats {
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin: 1rem 0;
        }
        .stat {
            text-align: center;
            background: var(--surface);
            padding: 0.5rem 1.2rem;
            border-radius: 12px;
            min-width: 70px;
        }
        .stat-label { font-size: 0.75rem; color: var(--text-secondary); }
        .stat-value { font-size: 1.4rem; font-weight: 700; color: var(--accent); }
        .board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            max-width: 420px;
            width: 90%;
            padding: 1rem;
            margin: 0 auto;
        }
        .card {
            aspect-ratio: 1;
            perspective: 600px;
            cursor: pointer;
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }
        .card-front {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: transparent;
        }
        .card-front::after {
            content: '?';
            color: #fff;
            font-size: 2rem;
            font-weight: 700;
        }
        .card-back {
            background: var(--surface);
            border: 2px solid var(--accent);
            transform: rotateY(180deg);
        }
        .card.matched .card-inner {
            transform: rotateY(180deg);
            animation: matchPulse 0.5s ease;
        }
        @keyframes matchPulse {
            0%, 100% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.1); }
        }
        .card.matched .card-back {
            background: rgba(16, 185, 129, 0.2);
            border-color: var(--success);
        }
        .controls {
            display: flex;
            gap: 1rem;
            margin: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 0.7rem 1.5rem;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-restart { background: var(--accent); color: #1a1a2e; }
        .btn-restart:hover { transform: scale(1.05); box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4); }
        .btn-difficulty { background: var(--surface); color: var(--text); }
        .btn-difficulty:hover { background: #1e3a5f; }
        .btn-difficulty.active { background: var(--accent); color: #1a1a2e; }
        .win-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .win-overlay.show { display: flex; }
        .win-box {
            background: var(--surface);
            padding: 2rem;
            border-radius: 20px;
            text-align: center;
            animation: popIn 0.4s ease;
        }
        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .win-box h2 { font-size: 2rem; color: var(--accent); margin-bottom: 0.5rem; }
        .win-box p { color: var(--text-secondary); margin-bottom: 1.5rem; }
    </style>
</head>
<body>
    <header>
        <h1>🧠 记忆翻牌</h1>
        <p>找出所有相同的配对，考验你的记忆力</p>
        <a href="../游戏页面.html" style="display:inline-block;margin-top:0.5rem;color:var(--accent);text-decoration:none;font-size:0.9rem;">← 返回游戏中心</a>
    </header>
    <div class="stats">
        <div class="stat"><div class="stat-label">步数</div><div class="stat-value" id="moves">0</div></div>
        <div class="stat"><div class="stat-label">配对</div><div class="stat-value" id="pairs">0/8</div></div>
        <div class="stat"><div class="stat-label">时间</div><div class="stat-value" id="timer">0s</div></div>
    </div>
    <div class="controls">
        <button class="btn-difficulty active" data-pairs="8">简单 4×4</button>
        <button class="btn-difficulty" data-pairs="15">中等 5×6</button>
        <button class="btn-difficulty" data-pairs="18">困难 6×6</button>
        <button class="btn-restart" onclick="restartGame()">🔄 重新开始</button>
    </div>
    <div class="board" id="board"></div>
    <div class="win-overlay" id="winOverlay">
        <div class="win-box">
            <h2>🎉 恭喜通关！</h2>
            <p>你用了 <strong id="winMoves">0</strong> 步，耗时 <strong id="winTime">0s</strong></p>
            <button class="btn-restart" onclick="restartGame()">再来一局</button>
        </div>
    </div>
    <script>
        const emojis = ['🍎','🍋','🍇','🍒','🌻','🌸','🌺','🌷','🐶','🐱','🐰','🐼','⭐','🌈','🎵','🎸','🚀','🪐','⚡','🔥'];
        let cards = [], flippedCards = [], moves = 0, matchedPairs = 0, totalPairs = 8;
        let timerInterval, seconds = 0, lockBoard = false;
        let gridCols = 4;

        function initGame(pairs) {
            totalPairs = pairs;
            matchedPairs = 0; moves = 0; seconds = 0; flippedCards = []; lockBoard = false;
            document.getElementById('moves').textContent = '0';
            document.getElementById('pairs').textContent = `0/${totalPairs}`;
            document.getElementById('timer').textContent = '0s';
            document.getElementById('winOverlay').classList.remove('show');
            clearInterval(timerInterval); timerInterval = null;

            const selected = emojis.slice(0, totalPairs);
            cards = [...selected, ...selected];
            for (let i = cards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cards[i], cards[j]] = [cards[j], cards[i]];
            }

            if (totalPairs === 8) gridCols = 4;
            else if (totalPairs === 15) gridCols = 6;
            else gridCols = 6;

            const board = document.getElementById('board');
            board.style.gridTemplateColumns = `repeat(${gridCols}, 1fr)`;
            board.innerHTML = cards.map((emoji, i) => `
                <div class="card" data-index="${i}" onclick="flipCard(this, '${emoji}')">
                    <div class="card-inner">
                        <div class="card-front"></div>
                        <div class="card-back">${emoji}</div>
                    </div>
                </div>
            `).join('');

            // 开局展示所有牌 2 秒
            lockBoard = true;
            const allCards = board.querySelectorAll('.card');
            allCards.forEach(c => c.classList.add('flipped'));
            setTimeout(() => {
                allCards.forEach(c => c.classList.remove('flipped'));
                lockBoard = false;
            }, pairs <= 8 ? 2000 : pairs <= 15 ? 3000 : 4000);
        }

        function flipCard(el, emoji) {
            if (lockBoard) return;
            if (el.classList.contains('flipped') || el.classList.contains('matched')) return;
            if (flippedCards.length >= 2) return;

            if (!timerInterval) {
                timerInterval = setInterval(() => {
                    seconds++;
                    document.getElementById('timer').textContent = seconds + 's';
                }, 1000);
            }

            el.classList.add('flipped');
            flippedCards.push({ el, emoji });

            if (flippedCards.length === 2) {
                moves++;
                document.getElementById('moves').textContent = moves;
                if (flippedCards[0].emoji === flippedCards[1].emoji) {
                    flippedCards.forEach(f => f.el.classList.add('matched'));
                    matchedPairs++;
                    document.getElementById('pairs').textContent = `${matchedPairs}/${totalPairs}`;
                    flippedCards = [];
                    if (matchedPairs === totalPairs) {
                        clearInterval(timerInterval);
                        document.getElementById('winMoves').textContent = moves;
                        document.getElementById('winTime').textContent = seconds + 's';
                        setTimeout(() => document.getElementById('winOverlay').classList.add('show'), 600);
                    }
                } else {
                    lockBoard = true;
                    setTimeout(() => {
                        flippedCards.forEach(f => f.el.classList.remove('flipped'));
                        flippedCards = [];
                        lockBoard = false;
                    }, 800);
                }
            }
        }

        function restartGame() { initGame(totalPairs); }

        document.querySelectorAll('.btn-difficulty').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.btn-difficulty').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                initGame(parseInt(btn.dataset.pairs));
            });
        });

        initGame(8);
    </script>
</body>
</html>
