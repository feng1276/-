<html lang="zh-cn">

<style>
:root {
  --bg: #0a0a0f;
  --panel: #12121a;
  --card: #1a1a28;
  --border: #2a2a3a;
  --text: #d0d0e0;
  --dim: #6a6a80;
  --accent: #c9a96e;
  --accent2: #7eb8da;
  --red: #e0556a;
  --green: #5dbe8b;
  --blue: #5b9bd5;
  --purple: #9b7ec4;
  --orange: #e8985e;
  --pink: #e07ba0;
  --health: #e0556a;
  --intel: #5b9bd5;
  --wealth: #e8985e;
  --mood: #e07ba0;
  --social: #5dbe8b;
  --stress: #c9a96e;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  background-image:
    radial-gradient(ellipse at 20% 20%, rgba(201,169,110,0.04) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, rgba(91,155,213,0.04) 0%, transparent 50%);
}

/* ===== SCREENS ===== */
.screen { display: none; }
.screen.active { display: flex; }

/* ===== START SCREEN ===== */
#start-screen {
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 2rem;
  text-align: center;
}

.start-logo {
  font-size: 4.5rem;
  font-weight: 200;
  letter-spacing: 0.15em;
  color: var(--accent);
  margin-bottom: 0.5rem;
  text-shadow: 0 0 60px rgba(201,169,110,0.3);
  animation: fadeInUp 1.2s ease;
}

.start-logo .dot {
  color: var(--accent2);
  display: inline-block;
  animation: pulse 2s infinite;
}

.start-subtitle {
  font-size: 1.2rem;
  color: var(--dim);
  margin-bottom: 3rem;
  letter-spacing: 0.3em;
  animation: fadeInUp 1.2s ease 0.15s both;
}

.start-buttons {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  animation: fadeInUp 1.2s ease 0.3s both;
}

.btn {
  padding: 1rem 3rem;
  font-size: 1.1rem;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  cursor: pointer;
  letter-spacing: 0.1em;
  transition: all 0.3s ease;
  font-family: inherit;
  position: relative;
  overflow: hidden;
}

.btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(201,169,110,0.15);
}

.btn.primary {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(201,169,110,0.08);
}

.btn.primary:hover {
  background: rgba(201,169,110,0.15);
  box-shadow: 0 8px 40px rgba(201,169,110,0.25);
}

.start-version {
  margin-top: 3rem;
  color: var(--dim);
  font-size: 0.75rem;
  letter-spacing: 0.2em;
  animation: fadeInUp 1.2s ease 0.45s both;
}

/* ===== GAME SCREEN ===== */
#game-screen {
  min-height: 100vh;
  display: none;
  gap: 0;
}
#game-screen.active { display: flex; }

/* Sidebar */
.sidebar {
  width: 300px;
  min-width: 300px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  padding: 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 1.2rem;
  overflow-y: auto;
  max-height: 100vh;
  position: sticky;
  top: 0;
}

.sidebar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  padding-bottom: 1rem;
}

.sidebar-title {
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  color: var(--accent);
}

.age-badge {
  font-size: 1.8rem;
  font-weight: 200;
  color: var(--accent2);
}

.stage-label {
  font-size: 0.7rem;
  color: var(--dim);
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

.stat-group { display: flex; flex-direction: column; gap: 0.6rem; }

.stat-row {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  font-size: 0.8rem;
}

.stat-icon { width: 20px; text-align: center; font-size: 0.85rem; }
.stat-name { width: 40px; color: var(--dim); font-size: 0.7rem; }
.stat-value { width: 32px; text-align: right; font-weight: 600; font-size: 0.8rem; }

.stat-bar-wrap {
  flex: 1;
  height: 6px;
  background: rgba(255,255,255,0.05);
  border-radius: 3px;
  overflow: hidden;
}

.stat-bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
}

.stat-bar-fill.health { background: var(--health); }
.stat-bar-fill.intelligence { background: var(--intel); }
.stat-bar-fill.wealth { background: var(--wealth); }
.stat-bar-fill.mood { background: var(--mood); }
.stat-bar-fill.social { background: var(--social); }
.stat-bar-fill.stress { background: var(--stress); }

.money-display {
  font-size: 1.4rem;
  font-weight: 300;
  color: var(--orange);
  letter-spacing: 0.05em;
  text-align: center;
  padding: 0.5rem;
  border: 1px solid var(--border);
  background: rgba(232,152,94,0.05);
}

.career-display {
  font-size: 0.75rem;
  color: var(--dim);
  text-align: center;
  letter-spacing: 0.1em;
}

.sidebar-actions {
  margin-top: auto;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.btn-sm {
  padding: 0.6rem 1rem;
  font-size: 0.75rem;
  letter-spacing: 0.1em;
}

/* Rel UI */
.rel-group { display: flex; flex-direction: column; gap: 0.4rem; }
.rel-row {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.7rem;
}
.rel-name { width: 36px; color: var(--dim); }
.rel-bar-wrap { flex: 1; height: 4px; background: rgba(255,255,255,0.05); border-radius: 2px; overflow: hidden; }
.rel-bar-fill { height: 100%; background: var(--pink); border-radius: 2px; transition: width 0.5s ease; }
.rel-val { width: 24px; text-align: right; color: var(--dim); font-size: 0.65rem; }

/* Main area */
.main-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 2rem;
  overflow-y: auto;
  max-height: 100vh;
}

.main-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.5rem;
}

.turn-counter {
  font-size: 0.7rem;
  color: var(--dim);
  letter-spacing: 0.15em;
}

/* Event card */
.event-card {
  background: var(--card);
  border: 1px solid var(--border);
  padding: 2rem;
  max-width: 650px;
  width: 100%;
  margin: 0 auto;
  animation: fadeInUp 0.5s ease;
}

.event-stage-tag {
  display: inline-block;
  padding: 0.25rem 0.75rem;
  font-size: 0.65rem;
  letter-spacing: 0.15em;
  color: var(--accent);
  border: 1px solid var(--accent);
  margin-bottom: 1.5rem;
  opacity: 0.7;
}

.event-title {
  font-size: 1.3rem;
  font-weight: 500;
  margin-bottom: 0.8rem;
  line-height: 1.6;
  color: #e8e8f0;
}

.event-desc {
  font-size: 0.9rem;
  color: var(--dim);
  margin-bottom: 1.5rem;
  line-height: 1.8;
}

.event-choices { display: flex; flex-direction: column; gap: 0.7rem; }

.choice-btn {
  padding: 1rem 1.5rem;
  text-align: left;
  background: rgba(255,255,255,0.02);
  border: 1px solid var(--border);
  color: var(--text);
  cursor: pointer;
  font-family: inherit;
  font-size: 0.9rem;
  transition: all 0.3s ease;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.choice-btn:hover {
  border-color: var(--accent2);
  background: rgba(126,184,218,0.06);
  transform: translateX(4px);
}

.choice-btn .choice-label { font-weight: 500; }
.choice-btn .choice-hint {
  font-size: 0.7rem;
  color: var(--dim);
  opacity: 0.7;
}

/* Effect toast */
.effect-toast {
  position: fixed;
  top: 2rem;
  left: 50%;
  transform: translateX(-50%);
  background: var(--panel);
  border: 1px solid var(--border);
  padding: 0.75rem 1.5rem;
  font-size: 0.85rem;
  color: var(--text);
  z-index: 100;
  pointer-events: none;
  animation: toastIn 2s ease forwards;
  display: flex;
  gap: 1rem;
  letter-spacing: 0.05em;
}

.effect-toast .pos { color: var(--green); }
.effect-toast .neg { color: var(--red); }

@keyframes toastIn {
  0% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
  15% { opacity: 1; transform: translateX(-50%) translateY(0); }
  75% { opacity: 1; }
  100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
}

/* Stage transition overlay */
.stage-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 200;
  animation: fadeIn 0.3s ease;
}

.stage-overlay .stage-icon { font-size: 4rem; margin-bottom: 1rem; animation: pulse 1.5s infinite; }
.stage-overlay .stage-title { font-size: 2rem; color: var(--accent); letter-spacing: 0.1em; font-weight: 200; }
.stage-overlay .stage-desc { font-size: 0.9rem; color: var(--dim); margin-top: 0.5rem; margin-bottom: 2rem; }
.stage-overlay .btn { animation: fadeInUp 0.5s ease 0.3s both; }

/* ===== ENDING SCREEN ===== */
#ending-screen {
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 2rem;
  text-align: center;
}

.ending-icon { font-size: 5rem; margin-bottom: 1rem; animation: float 3s ease-in-out infinite; }
.ending-title { font-size: 2.5rem; font-weight: 200; color: var(--accent); letter-spacing: 0.1em; margin-bottom: 0.5rem; }
.ending-subtitle { font-size: 1rem; color: var(--dim); margin-bottom: 2rem; max-width: 500px; line-height: 1.8; }
.ending-stats { display: flex; gap: 2rem; flex-wrap: wrap; justify-content: center; margin-bottom: 2.5rem; }
.ending-stat { text-align: center; }
.ending-stat-val { font-size: 2rem; font-weight: 200; color: var(--accent2); }
.ending-stat-label { font-size: 0.7rem; color: var(--dim); letter-spacing: 0.1em; margin-top: 0.2rem; }

.ending-events-log {
  max-width: 500px;
  width: 100%;
  text-align: left;
  margin-bottom: 2.5rem;
}

.ending-events-log h3 {
  font-size: 0.8rem;
  letter-spacing: 0.15em;
  color: var(--dim);
  margin-bottom: 0.8rem;
  text-align: center;
}

.log-entry {
  font-size: 0.75rem;
  color: var(--dim);
  padding: 0.3rem 0;
  border-bottom: 1px solid rgba(255,255,255,0.03);
  display: flex;
  gap: 0.5rem;
}

.log-entry .log-age { color: var(--accent2); min-width: 40px; }

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 300;
  animation: fadeIn 0.2s ease;
}

.modal {
  background: var(--panel);
  border: 1px solid var(--border);
  padding: 2rem;
  max-width: 420px;
  width: 90%;
  text-align: center;
}

.modal h3 {
  font-size: 1.2rem;
  font-weight: 400;
  color: var(--accent);
  margin-bottom: 1rem;
  letter-spacing: 0.05em;
}

.modal input {
  width: 100%;
  padding: 0.8rem;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: inherit;
  font-size: 1rem;
  text-align: center;
  margin-bottom: 1.5rem;
  letter-spacing: 0.1em;
}

.modal input:focus {
  outline: none;
  border-color: var(--accent);
}

/* ===== ANIMATIONS ===== */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes pulse {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  #game-screen { flex-direction: column; }
  .sidebar {
    width: 100%; min-width: 100%; max-height: none;
    position: static; flex-direction: row; flex-wrap: wrap;
    padding: 1rem; gap: 0.5rem; font-size: 0.7rem;
    border-right: none; border-bottom: 1px solid var(--border);
  }
  .sidebar > * { flex: 1; min-width: 120px; }
  .stat-row { font-size: 0.65rem; }
  .main-area { padding: 1rem; max-height: none; }
  .event-card { padding: 1.5rem; }
  .start-logo { font-size: 2.5rem; }
}

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<!-- ==================== START SCREEN ==================== -->
<div id="start-screen" class="screen active">
  <div class="start-logo">
    人生模拟器<span class="dot">·</span>
  </div>
  <div class="start-subtitle">你将如何度过这一生？</div>
  <div class="start-buttons">
    <button class="btn primary" onclick="startNewGame()">✦ &nbsp;开始人生</button>

  <div class="start-version">Life Simulator v1.0 · 选择塑造人生</div>
</div>

<!-- ==================== GAME SCREEN ==================== -->
<div id="game-screen" class="screen">
  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div>
        <div class="sidebar-title">人生状态</div>
        <div class="stage-label" id="stage-label">童年</div>
      </div>
      <div class="age-badge" id="age-badge">6</div>
    </div>

    <div class="stat-group">
      <div class="stat-row">
        <span class="stat-icon">❤️</span><span class="stat-name">健康</span>
        <div class="stat-bar-wrap"><div class="stat-bar-fill health" id="bar-health" style="width:80%"></div></div>
        <span class="stat-value" id="val-health">80</span>
      </div>
      <div class="stat-row">
        <span class="stat-icon">🧠</span><span class="stat-name">智力</span>
        <div class="stat-bar-wrap"><div class="stat-bar-fill intelligence" id="bar-int" style="width:50%"></div></div>
        <span class="stat-value" id="val-int">50</span>
      </div>

        <span class="stat-icon">😊</span><span class="stat-name">情绪</span>
        <div class="stat-bar-wrap"><div class="stat-bar-fill mood" id="bar-mood" style="width:70%"></div></div>
        <span class="stat-value" id="val-mood">70</span>
      </div>
      <div class="stat-row">
        <span class="stat-icon">🤝</span><span class="stat-name">社交</span>

        <span class="stat-value" id="val-social">50</span>

      <div class="stat-row">

      </div>

      </div>

    <div class="money-display" id="money-display">¥0</div>

        <div class="rel-row"><span class="rel-name">朋友</span><div class="rel-bar-wrap"><div class="rel-bar-fill" id="bar-friend" style="width:40%"></div></div><span class="rel-val" id="val-friend">40</span></div>
        <div class="rel-row"><span class="rel-name">爱人</span><div class="rel-bar-wrap"><div class="rel-bar-fill" id="bar-lover" style="width:0%"></div></div><span class="rel-val" id="val-lover">0</span></div>
      </div>

    <div class="sidebar-actions">

  <!-- MAIN -->
  <div class="main-area">

</div>

<!-- ==================== ENDING SCREEN ==================== -->
<div id="ending-screen" class="screen">
  <div class="ending-icon" id="ending-icon">🏆</div>
  <div class="ending-title" id="ending-title">人生落幕</div>
  <div class="ending-subtitle" id="ending-subtitle"></div>
  <div class="ending-stats" id="ending-stats"></div>
  <div class="ending-events-log" id="ending-log"></div>
  <div class="start-buttons">
    <button class="btn primary" onclick="startNewGame()">🔄 &nbsp;重新开始</button>
    <button class="btn" onclick="showScreen('start-screen')">🏠 &nbsp;返回首页</button>
  </div>
</div>

<!-- ==================== SCRIPTS ==================== -->
<script>
// ===========================
// CORE STATE
// ===========================
const DEFAULT_STATE = {
  name: '你',
  age: 6,
  turn: 1,
  stage: 'child',       // child | teen | adult | elder
  health: 80,
  intelligence: 50,
  wealth: 10,
  money: 0,
  mood: 70,
  social: 50,
  stress: 20,
  career: '学生',
  family: 80,
  friend: 40,
  lover: 0,
  hasLover: false,
  eventLog: [],
  flags: {}             // for persistent choices
};

let S = { ...DEFAULT_STATE, eventLog: [] };

// ===========================
// SCREEN MANAGEMENT
// ===========================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ===========================
// NAME INPUT MODAL
// ===========================
function askName(callback) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>👤 你的名字是？</h3>
      <input type="text" id="name-input" placeholder="输入你的名字…" maxlength="12" autofocus>
      <div>
        <button class="btn primary" id="btn-confirm-name">确认</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const input = overlay.querySelector('#name-input');
  const btn = overlay.querySelector('#btn-confirm-name');

  function confirm() {
    const name = input.value.trim() || '无名者';
    document.body.removeChild(overlay);
    callback(name);
  }

  btn.addEventListener('click', confirm);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') confirm(); });
  setTimeout(() => input.focus(), 100);
}

// ===========================
// START / LOAD
// ===========================
function startNewGame() {
  askName(name => {
    S = { ...DEFAULT_STATE, eventLog: [] };
    S.name = name;
    initGame();
  });
}

function startRandomLife() {
  const names = ['阿星','小月','林风','雨晴','山海','云逸','星辰','若水','天行','明月'];
  S = { ...DEFAULT_STATE, eventLog: [] };
  S.name = names[Math.floor(Math.random() * names.length)];
  // Randomize starting stats a bit
  S.health += rand(-10, 10);
  S.intelligence += rand(-10, 10);
  S.mood += rand(-10, 10);
  S.social += rand(-10, 10);
  S.family += rand(-10, 10);
  S.friend += rand(-10, 10);
  initGame();
}

function loadGame() {
  const raw = localStorage.getItem('life_sim_save');
  if (!raw) {
    showToast('没有找到存档', true);
    return;
  }
  try {
    S = JSON.parse(raw);
    initGame(false);
    showToast('📂 存档已加载');
  } catch (e) {
    showToast('存档损坏，无法读取', true);

// ===========================
// UTILS
// ===========================
function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function clampStats() {
  S.health = clamp(S.health, 0, 100);
  S.intelligence = clamp(S.intelligence, 0, 100);
  S.wealth = clamp(S.wealth, 0, 100);
  S.mood = clamp(S.mood, 0, 100);
  S.social = clamp(S.social, 0, 100);
  S.stress = clamp(S.stress, 0, 100);
  S.family = clamp(S.family, 0, 100);
  S.friend = clamp(S.friend, 0, 100);
  S.lover = clamp(S.lover, 0, 100);
}

function applyEffects(effects) {
  const changes = [];
  for (let [key, val] of Object.entries(effects)) {
    if (key === 'money') { S.money += val; changes.push([key, val]); continue; }
    if (key === 'career') { S.career = val; changes.push([key, val]); continue; }
    if (key === 'flag') { S.flags[val] = true; continue; }
    if (key === 'hasLover') { S.hasLover = val; continue; }
    if (S.hasOwnProperty(key)) {
      S[key] = clamp(S[key] + val, 0, 100);
      changes.push([key, val]);
    }
  }
  clampStats();
  return changes;
}

function formatChanges(changes) {
  const labels = {
    health: ['健康','❤️'], intelligence: ['智力','🧠'], wealth: ['财富','💰'],
    mood: ['情绪','😊'], social: ['社交','🤝'], stress: ['压力','⚠️'],
    family: ['家人','👪'], friend: ['朋友','👥'], lover: ['爱人','💕'],
    money: ['金钱','💵']
  };
  return changes.map(([k, v]) => {
    const [label, icon] = labels[k] || [k, ''];
    const cls = v > 0 ? 'pos' : 'neg';
    const sign = v > 0 ? '+' : '';
    return `<span class="${cls}">${icon} ${label} ${sign}${v}</span>`;
  }).join(' ');
}

function showToast(msg, isWarning = false) {
  const toast = document.createElement('div');
  toast.className = 'effect-toast';
  toast.style.cssText = isWarning ? 'border-color: var(--red);' : '';
  toast.innerHTML = msg;
  document.body.appendChild(toast);
  setTimeout(() => { if (toast.parentNode) document.body.removeChild(toast); }, 2200);
}

function transitionStage(newStage, title, desc, icon) {
  const overlay = document.createElement('div');
  overlay.className = 'stage-overlay';
  overlay.innerHTML = `
    <div class="stage-icon">${icon}</div>
    <div class="stage-title">${title}</div>

// ===========================
// EVENT SYSTEM
// ===========================
// Track recently seen events to avoid repeats
if (!S._seenEvents) S._seenEvents = [];

function nextEvent() {
  // Check death conditions
  if (S.health <= 0) { endGame('health_death'); return; }
  if (S.stress >= 100) { endGame('stress_death'); return; }

  // Age progression & stage check
  const oldStage = S.stage;
  if (S.age < 12) S.stage = 'child';
  else if (S.age < 18) S.stage = 'teen';
  else if (S.age < 55) S.stage = 'adult';
  else S.stage = 'elder';

  // Check end of life
  if (S.age >= 75) { endGame('old_age'); return; }
  // Random chance of death in elder stage
  if (S.stage === 'elder' && S.age >= 65 && Math.random() < 0.08) { endGame('old_age'); return; }

  // Stage transition
  if (oldStage !== S.stage) {
    // Clear seen events on stage transition so new stage events are all fresh
    S._seenEvents = [];
    const transitions = {
      teen: ['青少年时期', '你进入了青春期，开始形成自己的世界观。人生的重要选择即将到来。', '🧑'],
      adult: ['成年时代', '你正式步入社会。职业、感情、人生方向——一切由你决定。', '🧔'],
      elder: ['人生暮年', '岁月如歌，你开始回顾这一生的得失。珍惜剩下的时光吧。', '👴']
    };
    if (transitions[S.stage]) {
      transitionStage(S.stage, ...transitions[S.stage]).then(() => {
        updateAllUI();
        pickAndShowEvent();
      });
      return;
    }
  }

  pickAndShowEvent();
}

function pickAndShowEvent() {
  const pool = getEventPool();

  // 10% chance of random event instead (reduced from 15%)
  if (Math.random() < 0.10 && RANDOM_EVENTS.length > 0 && S.stage !== 'elder') {
    const fresh = RANDOM_EVENTS.filter(e => !S._seenEvents.includes(e.id));
    const randPool = fresh.length >= 2 ? fresh : RANDOM_EVENTS;
    const event = randPool[Math.floor(Math.random() * randPool.length)];
    S._seenEvents.push(event.id);
    if (S._seenEvents.length > 20) S._seenEvents = S._seenEvents.slice(-20);
    renderEvent(event);
    return;
  }

  // Pick a FRESH event - try to avoid recently seen ones
  const fresh = pool.filter(e => !S._seenEvents.includes(e.id));
  const pickPool = fresh.length >= 2 ? fresh : pool;
  const event = pickPool[Math.floor(Math.random() * pickPool.length)];

  S._seenEvents.push(event.id);
  if (S._seenEvents.length > 20) S._seenEvents = S._seenEvents.slice(-20);

  renderEvent(event);
}

function renderEvent(event) {
  const container = document.getElementById('event-container');
  // Store current event globally so makeChoice can use it directly
  window._currentEvent = event;

  const choicesHTML = event.choices.map((c, i) => `
    <button class="choice-btn" onclick="makeChoice(${i}, this)" data-label="${String.fromCharCode(65 + i)}">
      <span class="choice-label">${String.fromCharCode(65 + i)}. ${c.text}</span>
      <span class="choice-hint">${c.hint || ''}</span>
    </button>
  `).join('');

  container.innerHTML = `
    <div class="event-card">
      <div class="event-stage-tag">📌 ${event.category || '人生事件'}</div>
      <div class="event-title">${event.title}</div>
      <div class="event-desc">${event.desc}</div>
      <div class="event-choices">${choicesHTML}</div>
    </div>
  `;

  // Scroll to top of event card
  container.scrollIntoView({ behavior: 'smooth' });
}

function makeChoice(index, btnEl) {
  const event = window._currentEvent;
  if (!event) { advanceTime(); return; }

  const card = btnEl.closest('.event-card');
  const allBtns = card.querySelectorAll('.choice-btn');
  allBtns.forEach(b => { b.disabled = true; b.style.pointerEvents = 'none'; });

  // Highlight chosen
  btnEl.style.borderColor = 'var(--accent)';
  btnEl.style.background = 'rgba(201,169,110,0.1)';

  const choice = event.choices[index];
  if (!choice) { advanceTime(); return; }

  const effects = choice.effects || {};

  // Apply effects
  const changes = applyEffects(effects);

  // Log event
  S.eventLog.push({
    age: S.age,
    title: event.title,
    choice: choice.text,
    effects
  });

  // Show effect toast
  if (changes.length > 0) {
    showToast(formatChanges(changes));
  }

  // Check for forced endings
  if (effects._end) {
    setTimeout(() => endGame(effects._end), 1500);
    return;
  }

  // Advance
  setTimeout(() => advanceTime(), changes.length > 0 ? 800 : 300);
}

function advanceTime() {
  S.turn++;
  // Age advances: each turn = 1-3 years depending on stage
  const yearStep = S.stage === 'child' ? 1 : S.stage === 'teen' ? 1 : S.stage === 'adult' ? 2 : 1;
  S.age += yearStep;

  // Passive stat drift
  S.stress = clamp(S.stress + rand(-2, 3), 0, 100);
  if (S.stage === 'elder') S.health = clamp(S.health - rand(1, 3), 0, 100);

  // Career income
  if (S.career && S.career !== '学生' && S.career !== '失业') {
    const incomes = { '程序员': 8000, '医生': 10000, '教师': 5000, '设计师': 6000, '企业家': 15000, '自由职业者': 4000, '作家': 4500, '厨师': 5000, '科学家': 9000, '音乐家': 5500 };
    S.money += (incomes[S.career] || 3000) * yearStep;
    S.wealth = clamp(Math.floor(S.money / 5000), 0, 100);
  }

  clampStats();
  updateAllUI();
  nextEvent();
}

// ===========================
// EVENT POOLS
// ===========================
function getEventPool() {
  const pools = {
    child: CHILD_EVENTS,
    teen: TEEN_EVENTS,
    adult: ADULT_EVENTS,
    elder: ELDER_EVENTS
  };
  let pool = [...(pools[S.stage] || ADULT_EVENTS)];

  // Only filter out one-time / conditional events that don't apply
  if (S.career && S.career !== '学生' && S.career !== '失业') {
    pool = pool.filter(e => e.id !== 'career_choice');
  }
  if (S.flags['went_to_college']) {
    pool = pool.filter(e => e.id !== 'college_choice');
  }
  if (S.hasLover) {
    pool = pool.filter(e => e.id !== 'find_love');
  }
  if (!S.hasLover) {
    pool = pool.filter(e => e.id !== 'marriage_proposal' && e.id !== 'spouse_conflict' && e.id !== 'having_kids' && e.id !== 'parenting');
  }
  if (S.money < 30000) {
    pool = pool.filter(e => e.id !== 'buy_house');
  }
  // Keep retirement events only in elder stage
  if (S.stage !== 'elder') {
    pool = pool.filter(e => e.id !== 'retirement_planning');
  }

  return pool.length > 0 ? pool : [...(pools[S.stage] || ADULT_EVENTS)];
}

// ===========================
// ENDING SYSTEM
// ===========================
function endGame(reason) {
  const endings = [];

  // Determine ending based on stats
  if (S.wealth >= 80 && S.money >= 200000) {
    endings.push({ icon: '💰', title: '富豪人生', desc: '你积累了惊人的财富，成为了一方富豪。物质生活极其丰富，但钱真的买到了一切吗？' });
  }
  if (S.intelligence >= 80) {
    endings.push({ icon: '🧠', title: '学术大师', desc: '你的学识渊博，在专业领域做出了重要贡献。智慧的光芒照亮了你的一生。' });
  }
  if (S.social >= 80 && S.family >= 70 && S.friend >= 70) {
    endings.push({ icon: '💕', title: '温暖人生', desc: '亲人、朋友、爱人——你被爱包围着。这是一段充满温情的人生旅程。' });
  }
  if (S.health <= 20 || reason === 'health_death') {
    endings.push({ icon: '💔', title: '英年早逝', desc: '健康是人生的基石，可惜你没能好好照顾自己。生命短暂，却也精彩。' });
  }
  if (S.stress >= 90 || reason === 'stress_death') {
    endings.push({ icon: '😵', title: '压力崩溃', desc: '你被生活的重担压垮了。也许有时候，放慢脚步才是最好的选择。' });
  }
  if (S.mood >= 80 && S.stress <= 30) {
    endings.push({ icon: '☀️', title: '快乐人生', desc: '你懂得享受生活的乐趣，内心始终保持着阳光。快乐，就是最大的成功。' });
  }

  // Fallback endings
  if (endings.length === 0) {
    const avgStat = (S.health + S.intelligence + S.wealth + S.mood + S.social + (100-S.stress)) / 6;
    if (avgStat >= 60) {
      endings.push({ icon: '⚖️', title: '平衡人生', desc: '你的人生不算完美，但足够充实。平凡中的幸福，也许就是最好的结局。' });
    } else if (avgStat >= 40) {
      endings.push({ icon: '🌤️', title: '普通人生', desc: '像大多数人一样，你经历了起起落落。平凡而真实，这或许就是人生本来的样子。' });
    } else {
      endings.push({ icon: '🌧️', title: '坎坷人生', desc: '这一路走来充满艰辛。但每个选择都是成长的一部分，没有白走的路。' });
    }
  }

  // Pick the best ending (first one)
  const ending = endings[0];

  // Render ending screen
  document.getElementById('ending-icon').textContent = ending.icon;
  document.getElementById('ending-title').textContent = ending.title;
  document.getElementById('ending-subtitle').textContent = ending.desc;

  // Stats
  document.getElementById('ending-stats').innerHTML = `
    <div class="ending-stat"><div class="ending-stat-val">${S.age}</div><div class="ending-stat-label">享年</div></div>
    <div class="ending-stat"><div class="ending-stat-val">¥${(S.money / 10000).toFixed(1)}万</div><div class="ending-stat-label">积累财富</div></div>
    <div class="ending-stat"><div class="ending-stat-val">${S.career}</div><div class="ending-stat-label">职业</div></div>
    <div class="ending-stat"><div class="ending-stat-val">${S.eventLog.length}</div><div class="ending-stat-label">人生事件</div></div>
  `;

  // Event log
  const logHTML = S.eventLog.slice(-15).map(e => `
    <div class="log-entry">
      <span class="log-age">${e.age}岁</span>
      <span>${e.title} → <strong style="color:var(--accent)">${e.choice}</strong></span>
    </div>
  `).join('');
  document.getElementById('ending-log').innerHTML = `
    <h3>📜 人生回顾</h3>
    ${logHTML}
    ${S.eventLog.length > 15 ? `<p style="text-align:center;font-size:0.7rem;color:var(--dim);margin-top:0.5rem;">… 还有 ${S.eventLog.length - 15} 个事件</p>` : ''}
  `;

  showScreen('ending-screen');

  // Clear save
  localStorage.removeItem('life_sim_save');
}

// ===========================
// INIT
// ===========================
updateLoadBtn();
</script>
</body>
