    <!-- 引入 FontAwesome 图标库，用于控制按钮的图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #3b82f6;
            --bg-gradient: linear-gradient(135deg, #0f172a, #1e293b);
            --panel-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            color: var(--text-main);
            padding: 20px;
            padding-bottom: 120px;
            position: relative;
            overflow: hidden;
        }

        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            pointer-events: none;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0);
            z-index: -1;
        }

        /* 背景加载动画 */
        .bg-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.5);
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .bg-loader.active {
            opacity: 1;
            pointer-events: auto;
        }

        .pl {
            width: 6em;
            height: 6em;
        }

        .pl__ring {
            animation: ringA 2s linear infinite;
        }

        .pl__ring--a { stroke: #f42f25; }
        .pl__ring--b { animation-name: ringB; stroke: #f49725; }
        .pl__ring--c { animation-name: ringC; stroke: #255ff4; }
        .pl__ring--d { animation-name: ringD; stroke: #f42582; }

        @keyframes ringA {
            from, 4% { stroke-dasharray: 0 660; stroke-width: 20; stroke-dashoffset: -330; }
            12% { stroke-dasharray: 60 600; stroke-width: 30; stroke-dashoffset: -335; }
            32% { stroke-dasharray: 60 600; stroke-width: 30; stroke-dashoffset: -595; }
            40%, 54% { stroke-dasharray: 0 660; stroke-width: 20; stroke-dashoffset: -660; }
            62% { stroke-dasharray: 60 600; stroke-width: 30; stroke-dashoffset: -665; }
            82% { stroke-dasharray: 60 600; stroke-width: 30; stroke-dashoffset: -925; }
            90%, to { stroke-dasharray: 0 660; stroke-width: 20; stroke-dashoffset: -990; }
        }

        @keyframes ringB {
            from, 12% { stroke-dasharray: 0 220; stroke-width: 20; stroke-dashoffset: -110; }
            20% { stroke-dasharray: 20 200; stroke-width: 30; stroke-dashoffset: -115; }
            40% { stroke-dasharray: 20 200; stroke-width: 30; stroke-dashoffset: -195; }
            48%, 62% { stroke-dasharray: 0 220; stroke-width: 20; stroke-dashoffset: -220; }
            70% { stroke-dasharray: 20 200; stroke-width: 30; stroke-dashoffset: -225; }
            90% { stroke-dasharray: 20 200; stroke-width: 30; stroke-dashoffset: -305; }
            98%, to { stroke-dasharray: 0 220; stroke-width: 20; stroke-dashoffset: -330; }
        }

        @keyframes ringC {
            from { stroke-dasharray: 0 440; stroke-width: 20; stroke-dashoffset: 0; }
            8% { stroke-dasharray: 40 400; stroke-width: 30; stroke-dashoffset: -5; }
            28% { stroke-dasharray: 40 400; stroke-width: 30; stroke-dashoffset: -175; }
            36%, 58% { stroke-dasharray: 0 440; stroke-width: 20; stroke-dashoffset: -220; }
            66% { stroke-dasharray: 40 400; stroke-width: 30; stroke-dashoffset: -225; }
            86% { stroke-dasharray: 40 400; stroke-width: 30; stroke-dashoffset: -395; }
            94%, to { stroke-dasharray: 0 440; stroke-width: 20; stroke-dashoffset: -440; }
        }

        @keyframes ringD {
            from, 8% { stroke-dasharray: 0 440; stroke-width: 20; stroke-dashoffset: 0; }
            16% { stroke-dasharray: 40 400; stroke-width: 30; stroke-dashoffset: -5; }
            36% { stroke-dasharray: 40 400; stroke-width: 30; stroke-dashoffset: -175; }
            44%, 50% { stroke-dasharray: 0 440; stroke-width: 20; stroke-dashoffset: -220; }
            58% { stroke-dasharray: 40 400; stroke-width: 30; stroke-dashoffset: -225; }
            78% { stroke-dasharray: 40 400; stroke-width: 30; stroke-dashoffset: -395; }
            86%, to { stroke-dasharray: 0 440; stroke-width: 20; stroke-dashoffset: -440; }
        }

        /* 主布局容器 */
        .main-wrapper {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
        }

        /* 播放器主容器 */
        .player-container {
            width: 480px;
            height: 480px;
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border: none;
            border-radius: 24px;
            padding: 24px;
            box-shadow: none;
            margin-left: auto;
        }

        /* 歌曲封面区 */
        .cover-area {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 16px auto 24px;
        }

        .music-type {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.1rem;
            margin-top: -10px;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .cover-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            animation: rotate 20s linear infinite;
            animation-play-state: running;
        }

        /* 播放时封面旋转 */
        .playing .cover-img {
            animation-play-state: running;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 歌曲信息 */
        .track-info {
            text-align: center;
            margin-bottom: 24px;
            margin-top: 40px;
        }

        .track-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 0.9rem;
            color: #fbbf24;
        }

        /* 进度条样式 */
        .progress-wrapper {
            margin-bottom: 12px;
        }

        .progress-slider {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            height: 6px;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
            margin-bottom: 8px;
            position: relative;
        }

        .progress-slider::-webkit-slider-runnable-track {
            background: rgba(150, 150, 150, 0.4);
            height: 6px;
            border-radius: 3px;
            position: relative;
            overflow: hidden;
        }

        .progress-slider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: var(--progress-width, 0%);
            background: var(--progress-gradient, linear-gradient(to right, #ffffff 0%, #48dbfb 25%, #2ecc71 50%, #feca57 75%, #ff6b6b 100%));
            border-radius: 3px;
            pointer-events: none;
            z-index: 5;
            transition: width 0.2s ease;
        }

        .progress-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 0;
            height: 0;
            cursor: pointer;
        }

        .progress-slider::-webkit-slider-thumb:hover {
            width: 0;
            height: 0;
        }

        .time-stamps {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #ffffff;
        }

        /* 底部控制栏 */
        .bottom-controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            padding: 16px 40px 24px;
            z-index: 100;
        }

        /* 控制按钮区 */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
        }

        .btn {
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            font-size: 1.5rem;
            transition: all 0.2s ease;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn:hover {
            background: transparent;
            color: inherit;
            transform: scale(1.1);
        }

        /* 点击时的动态缩放反馈 */
        .btn:active {
            transform: scale(0.9);
        }

        .btn-play-pause {
            font-size: 2rem;
            background: transparent;
            width: 70px;
            height: 70px;
            box-shadow: none;
        }

        .btn-play-pause:hover {
            background: transparent;
            color: #fff;
            transform: scale(1.05);
        }

        .btn-play-pause:active {
            transform: scale(0.95);
        }

        .btn.active {
            color: #ffffff;
        }

        /* 音量调节区 */
        .volume-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 4px;
        }

        .volume-slider {
            width: 80px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.1);
            height: 4px;
            border-radius: 2px;
            outline: none;
        }

        .volume-slider::-webkit-slider-runnable-track {
            background: linear-gradient(to right, #ffffff var(--volume-progress, 70%), rgba(255, 255, 255, 0.1) var(--volume-progress, 70%));
            height: 4px;
            border-radius: 2px;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            transition: transform 0.1s;
            margin-top: -4px;
        }

        .volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* 倍速按钮容器 */
        .speed-btn-wrapper {
            position: relative;
        }

        /* 倍速菜单样式 */
        .speed-menu {
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 8px;
            display: none;
            flex-direction: column;
            gap: 4px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.2s ease;
            min-width: 80px;
            white-space: nowrap;
        }

        .speed-menu.show {
            display: flex;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .speed-option {
            padding: 8px 16px;
            color: var(--text-main);
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
            text-align: center;
            font-size: 0.9rem;
        }

        .speed-option:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .speed-option.active {
            background: var(--primary-color);
            color: white;
        }

        /* 播放列表区 */
        .playlist-container {
            width: 640px;
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border: none;
            border-radius: 24px;
            padding: 24px;
            padding-top: 60px;
            box-shadow: none;
            display: flex;
            flex-direction: column;
        }

        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            font-size: 0.8rem;
            color: #ffffff;
            font-weight: 500;
            letter-spacing: 0.5px;
            margin-top: 8px;
            gap: 100px;
        }

        .playlist-wrapper {
            flex: 1;
            overflow-y: auto;
            margin-top: 8px;
            max-height: calc(9 * 48px);
        }

        .playlist-wrapper::-webkit-scrollbar {
            width: 0;
            display: none;
        }

        .playlist-wrapper::-webkit-scrollbar-thumb {
            display: none;
        }



        .playlist-title {
            font-size: 1rem;
            color: var(--text-main);
            margin-bottom: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .playlist-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.95rem;
            margin-bottom: 8px;
            transition: all 0.2s;
            gap: 100px;
            white-space: nowrap;
            background: transparent;
        }

        .playlist-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(4px);
        }

        .playlist-item.current-track {
            background: rgba(255, 215, 0, 0.15);
            color: #ffd700;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(255, 215, 0, 0.2);
        }

        .playlist-item .item-artist {
            font-size: 0.85rem;
            color: var(--text-main);
            flex-shrink: 0;
            margin-left: auto;
        }

        .playlist-item .item-index + span {
            flex: 1;
            text-align: left;
        }

        .playlist-item.current-track .item-artist {
            color: rgba(255, 215, 0, 0.7);
        }

        .playlist-item .item-index {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 1);
            flex-shrink: 0;
            width: 24px;
            text-align: center;
            margin-right: 4px;
        }

        .playlist-item.current-track .item-index {
            color: rgba(255, 215, 0, 0.6);
        }

        /* 左上角背景切换按钮 */
        .bg-toggle-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .bg-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        /* 左上角注意按钮 */
        .notice-btn {
            position: fixed;
            top: 20px;
            left: 74px;
            z-index: 997;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .notice-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        /* 注意弹窗遮罩 */
        .notice-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .notice-modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        /* 注意弹窗 */
        .notice-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 32px 36px;
            z-index: 2001;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.4);
            min-width: 300px;
            text-align: center;
        }

        .notice-modal.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .notice-modal-icon {
            font-size: 2rem;
            color: #fbbf24;
            margin-bottom: 16px;
        }

        .notice-modal-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        .notice-modal-content {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
            align-items: flex-start;
            padding: 0 12px;
        }

        .notice-modal-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.5;
            text-align: left;
        }

        .notice-modal-item i {
            color: #fbbf24;
            font-size: 0.8rem;
            flex-shrink: 0;
            width: 16px;
            text-align: center;
        }

        .notice-modal-close {
            padding: 10px 36px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.5px;
        }

        .notice-modal-close:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* 侧栏 */
        .bg-sidebar {
            position: fixed;
            top: 0;
            left: -320px;
            width: 300px;
            height: 100vh;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 999;
            transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 30px 24px;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        .bg-sidebar.open {
            left: 0;
        }

        .bg-sidebar-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }

        .bg-sidebar-close {
            position: absolute;
            top: 24px;
            right: 20px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .bg-sidebar-close:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .bg-btn {
            display: block;
            width: 100%;
            padding: 14px 18px;
            margin-bottom: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.06);
            color: #ffffff;
            font-size: 0.95rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.25s;
            letter-spacing: 0.3px;
        }

        .bg-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateX(4px);
        }

        .bg-btn.active {
            background: rgba(59, 130, 246, 0.25);
            border-color: rgba(59, 130, 246, 0.5);
            font-weight: 600;
        }

        /* 侧栏遮罩 */
        .bg-sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 998;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s;
        }

        .bg-sidebar-overlay.show {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body>

    <!-- 左上角背景切换按钮 -->
    <button class="bg-toggle-btn" id="bg-toggle-btn" title="更换背景">
        <i class="fas fa-image"></i>
    </button>

    <!-- 左上角注意按钮 -->
    <button class="notice-btn" id="notice-btn" title="注意事项">
        <i class="fas fa-exclamation-circle"></i>
    </button>

    <!-- 注意弹窗遮罩 -->
    <div class="notice-modal-overlay" id="notice-modal-overlay"></div>

    <!-- 注意弹窗 -->
    <div class="notice-modal" id="notice-modal">
        <div class="notice-modal-icon">
            <i class="fas fa-bell"></i>
        </div>
        <div class="notice-modal-title">温馨提示</div>
        <div class="notice-modal-content">
            <div class="notice-modal-item">
                <i class="fas fa-headphones"></i>
                <span>佩戴耳机效果更佳</span>
            </div>
            <div class="notice-modal-item">
                <i class="fas fa-wifi"></i>
                <span>请确保网络状况良好</span>
            </div>
            <div class="notice-modal-item">
                <i class="fas fa-hourglass-half"></i>
                <span>若遇到卡顿，请耐心等待片刻</span>
            </div>
        </div>
        <button class="notice-modal-close" id="notice-modal-close">我知道了</button>

        // 2. 核心状态管理
        let currentTrackIndex = 0;
        let isPlaying = false;
        let playMode = 'all'; // all: 列表循环, one: 单曲循环, shuffle: 随机播放
        let previousVolume = 0.7; 

        // 创建音频核心对象
        const audio = new Audio();
        audio.volume = 0.7;

        // 3. 获取 DOM 元素
        const playerContainer = document.getElementById('player-container');
        const coverImg = document.getElementById('cover-img');
        const trackTitle = document.getElementById('track-title');
        const trackArtist = document.getElementById('track-artist');
        const progressSlider = document.getElementById('progress-slider');
        const currentTimeEl = document.getElementById('current-time');
        const totalDurationEl = document.getElementById('total-duration');
        
        const btnPlayPause = document.getElementById('btn-play-pause');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const btnMode = document.getElementById('btn-mode');
        const btnMute = document.getElementById('btn-mute');
        const volumeSlider = document.getElementById('volume-slider');
        const playlistContainer = document.getElementById('playlist-container');

        // 4. 初始化应用
        function initPlayer() {
            renderPlaylist();
            loadTrack(currentTrackIndex);
            setupEventListeners();
            updateVolumeProgress(audio.volume);
        }

        // 渲染播放列表UI
        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            trackList.forEach((track, index) => {
                const item = document.createElement('div');
                item.classList.add('playlist-item');
                if(index === currentTrackIndex) item.classList.add('current-track');
                
                item.innerHTML = `
                    <span class="item-index">${String(index + 1).padStart(2, '0')}</span>
                    <span>${track.title}</span>
                    <span class="item-artist">${track.artist}</span>
                `;
                
                item.addEventListener('click', () => {
                    currentTrackIndex = index;
                    loadTrack(currentTrackIndex);
                    playTrack();
                });
                playlistContainer.appendChild(item);
            });
        }

        // 加载歌曲信息
        function loadTrack(index) {
            const track = trackList[index];
            audio.src = track.url;
            trackTitle.textContent = "《" + track.title + "》";
            trackArtist.textContent = track.artist;
            coverImg.src = track.cover;
            
            // 重置进度条
            progressSlider.value = 0;
            progressSlider.style.setProperty('--progress-width', '0%');
            progressSlider.style.setProperty('--progress-gradient', 'none');
            currentTimeEl.textContent = '00:00';
            totalDurationEl.textContent = '00:00';

            // 更新列表高亮
            document.querySelectorAll('.playlist-item').forEach((item, i) => {
                if(i === index) {
                    item.classList.add('current-track');
                } else {
                    item.classList.remove('current-track');
                }
            });
        }

        // 播放与暂停控制
        function playTrack() {
            isPlaying = true;
            playerContainer.classList.add('playing');
            btnPlayPause.innerHTML = `<i class="fas fa-pause"></i>`;
            
            // 现代浏览器策略：处理潜在的用户未交互就播放的警告
            audio.play().catch(err => {
                console.log("自动播放被阻拦，等待用户点击交互:", err);
                pauseTrack();
            });
        }

        function pauseTrack() {
            isPlaying = false;
            playerContainer.classList.remove('playing');
            btnPlayPause.innerHTML = `<i class="fas fa-play"></i>`;
            audio.pause();
        }

        function togglePlay() {
            if (isPlaying) {
                pauseTrack();
            } else {
                playTrack();
            }
        }

        // 切歌逻辑
        function nextTrack() {
            if (playMode === 'shuffle') {
                currentTrackIndex = Math.floor(Math.random() * trackList.length);
            } else {
                currentTrackIndex = (currentTrackIndex + 1) % trackList.length;
            }
            loadTrack(currentTrackIndex);
            playTrack();
        }

        function prevTrack() {
            if (playMode === 'shuffle') {
                currentTrackIndex = Math.floor(Math.random() * trackList.length);
            } else {
                currentTrackIndex = (currentTrackIndex - 1 + trackList.length) % trackList.length;
            }
            loadTrack(currentTrackIndex);
            playTrack();
        }

        // 格式化时间显示 (秒 -> mm:ss)
        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // ===== 进度条动态渐变逻辑 =====
        // 定义全局色彩映射 (基于整体进度条0~100%)
        // 色标点: [位置百分比, 颜色值]
        const COLOR_STOPS = [
            { pos: 0,   color: '#ffffff' },  // 0% 白色
            { pos: 25,  color: '#3b82f6' },  // 25% 明亮蓝
            { pos: 50,  color: '#10b981' },  // 50% 翠绿
            { pos: 75,  color: '#facc15' },  // 75% 金黄色
            { pos: 100, color: '#ef4444' }   // 100% 红色
        ];

        // 根据给定的当前进度百分比 (0-100) 生成一个从0% 到 currentPercent% 的渐变字符串
        function getGradientByProgress(currentPercent) {
            if (currentPercent <= 0) {
                return 'linear-gradient(90deg, #ffffff 0%, #ffffff 0%)';
            }
            if (currentPercent >= 100) {
                return 'linear-gradient(90deg, #ffffff 0%, #3b82f6 25%, #10b981 50%, #facc15 75%, #ef4444 100%)';
            }

            // 1. 收集所有位置小于等于 currentPercent 的固定色标
            let includedStops = COLOR_STOPS.filter(stop => stop.pos <= currentPercent);

            // 2. 需要计算终点 currentPercent 处的精确颜色 (根据全局原始映射插值)
            let endColor = getColorAtPosition(currentPercent);

            // 构建新渐变字符串，起始点一定是0%位置颜色 (0% 白色)
            // 色标需要映射到相对于渐变总长 [0, currentPercent] 的比例
            let gradientStops = [];

            // 添加所有已包含色标的相对位置转换
            for (let stop of includedStops) {
                let relativePos = (stop.pos / currentPercent) * 100;
                // 避免边界过近出现精度问题，且相对位置必须在0~100之间
                let safePos = Math.min(100, Math.max(0, relativePos));
                gradientStops.push(`${stop.color} ${safePos}%`);
            }

            // 添加终点 (必须让终点颜色精确为插值颜色)
            gradientStops.push(`${endColor} 100%`);

            // 确保渐变方向从左至右
            return `linear-gradient(90deg, ${gradientStops.join(', ')})`;
        }

        // 根据全局位置(0-100)获取精确插值颜色（基于COLOR_STOPS分段线性插值）
        function getColorAtPosition(pos) {
            if (pos <= 0) return COLOR_STOPS[0].color;
            if (pos >= 100) return COLOR_STOPS[COLOR_STOPS.length-1].color;

            // 找到前后区间
            let lower = null, upper = null;
            for (let i = 0; i < COLOR_STOPS.length - 1; i++) {
                const p1 = COLOR_STOPS[i].pos;
                const p2 = COLOR_STOPS[i+1].pos;
                if (pos >= p1 && pos <= p2) {
                    lower = COLOR_STOPS[i];
                    upper = COLOR_STOPS[i+1];
                    break;
                }
            }
            if (!lower) return '#cccccc';

            // 线性插值 RGB
            const t = (pos - lower.pos) / (upper.pos - lower.pos);
            const color1 = hexToRgb(lower.color);
            const color2 = hexToRgb(upper.color);
            if (!color1 || !color2) return lower.color;

            const r = Math.round(color1.r + (color2.r - color1.r) * t);
            const g = Math.round(color1.g + (color2.g - color1.g) * t);
            const b = Math.round(color1.b + (color2.b - color1.b) * t);
            return `rgb(${r}, ${g}, ${b})`;
        }

        // 辅助: 十六进制颜色转RGB对象 (支持简写#fff)
        function hexToRgb(hex) {
            let h = hex.trim();
            if (h.startsWith('#')) {
                h = h.slice(1);
            }
            if (h.length === 3) {
                h = h.split('').map(c => c + c).join('');
            }
            if (h.length !== 6) return null;
            const r = parseInt(h.substring(0, 2), 16);
            const g = parseInt(h.substring(2, 4), 16);
            const b = parseInt(h.substring(4, 6), 16);
            if (isNaN(r) || isNaN(g) || isNaN(b)) return null;
            return { r, g, b };
        }

        // 更新进度条与时间文本
        function updateProgress(e) {
            const { duration, currentTime } = e.target;
            if(!duration) return;
            const progressPercent = (currentTime / duration) * 100;
            progressSlider.value = progressPercent;
            progressSlider.style.setProperty('--progress-width', `${progressPercent}%`);

            // 应用动态渐变到::before伪元素
            if (progressPercent === 0) {
                progressSlider.style.setProperty('--progress-gradient', 'none');
            } else {
                const dynamicGradient = getGradientByProgress(progressPercent);
                progressSlider.style.setProperty('--progress-gradient', dynamicGradient);
            }

            currentTimeEl.textContent = formatTime(currentTime);
            totalDurationEl.textContent = formatTime(duration);
        }

        // 手动点击/拖动修改进度
        function setProgress(e) {
            const progressPercent = parseFloat(e.target.value);
            const duration = audio.duration;
            if(!duration) return;
            audio.currentTime = (progressPercent / 100) * duration;

            // 应用动态渐变到::before伪元素
            if (progressPercent === 0) {
                progressSlider.style.setProperty('--progress-gradient', 'none');
            } else {
                const dynamicGradient = getGradientByProgress(progressPercent);
                progressSlider.style.setProperty('--progress-gradient', dynamicGradient);
            }
        }

        // 切换播放模式
        function toggleMode() {
            const modeIcon = btnMode.querySelector('i');
            if (playMode === 'all') {
                playMode = 'one';
                btnMode.title = "单曲循环";
                modeIcon.className = "fas fa-redo-alt"; // 改变图标
            } else if (playMode === 'one') {
                playMode = 'shuffle';
                btnMode.title = "随机播放";
                modeIcon.className = "fas fa-random";
            } else {
                playMode = 'all';
                btnMode.title = "列表循环";
                modeIcon.className = "fas fa-retweet";
            }
        }

        // 歌曲播放结束后的处理
        function onTrackEnd() {
            if (playMode === 'one') {
                audio.currentTime = 0;
                playTrack();
            } else {
                nextTrack();
            }
        }

        // 音量调节
        function updateVolumeProgress(vol) {
            const progress = (vol / 1) * 100;
            volumeSlider.style.setProperty('--volume-progress', progress + '%');
        }

        function handleVolumeChange(e) {
            const vol = e.target.value;
            audio.volume = vol;
            updateMuteIcon(vol);
            updateVolumeProgress(vol);
            if(vol > 0) previousVolume = vol;
        }

        // 一键静音控制
        function toggleMute() {
            if(audio.volume > 0) {
                previousVolume = audio.volume;
                audio.volume = 0;
                volumeSlider.value = 0;
            } else {
                audio.volume = previousVolume;
                volumeSlider.value = previousVolume;
            }
            updateMuteIcon(audio.volume);
            updateVolumeProgress(audio.volume);
        }

        function updateMuteIcon(vol) {
            const muteIcon = btnMute.querySelector('i');
            if (vol == 0) {
                muteIcon.className = "fas fa-volume-mute";
            } else if (vol < 0.5) {
                muteIcon.className = "fas fa-volume-down";
            } else {
                muteIcon.className = "fas fa-volume-up";
            }
        }

        // 倍速播放控制
        const btnSpeed = document.getElementById('btn-speed');
        const speedMenu = document.getElementById('speed-menu');
        const speedOptions = document.querySelectorAll('.speed-option');
        let currentSpeed = 1.0;

        // 切换倍速菜单显示
        btnSpeed.addEventListener('click', (e) => {
            e.stopPropagation();
            speedMenu.classList.toggle('show');
        });

        // 点击其他地方关闭倍速菜单
        document.addEventListener('click', (e) => {
            if (!speedMenu.contains(e.target) && !btnSpeed.contains(e.target)) {
                speedMenu.classList.remove('show');
            }
        });

        // 选择倍速
        speedOptions.forEach(option => {
            option.addEventListener('click', () => {
                const speed = parseFloat(option.dataset.speed);
                audio.playbackRate = speed;
                currentSpeed = speed;
                const speedDisplay = document.getElementById('speed-display');
                speedDisplay.textContent = speed + 'x';
                
                // 更新选中状态
                speedOptions.forEach(opt => opt.classList.remove('active'));
                option.classList.add('active');
                
                // 关闭菜单
                speedMenu.classList.remove('show');
            });
        });

        // 5. 事件监听器绑定
        function setupEventListeners() {
            btnPlayPause.addEventListener('click', togglePlay);
            btnPrev.addEventListener('click', prevTrack);
            btnNext.addEventListener('click', nextTrack);
            btnMode.addEventListener('click', toggleMode);
            btnMute.addEventListener('click', toggleMute);
            
            // 音频基础事件
            audio.addEventListener('timeupdate', updateProgress);
            audio.addEventListener('ended', onTrackEnd);
            // 当音频加载好元数据时，顺手刷新总时长
            audio.addEventListener('loadedmetadata', () => {
                totalDurationEl.textContent = formatTime(audio.duration);
            });

            // 进度条拖动控制
            progressSlider.addEventListener('input', setProgress);

            // 音量滑动调节
            volumeSlider.addEventListener('input', handleVolumeChange);
        }

        // 启动播放器
        window.addEventListener('DOMContentLoaded', initPlayer);

        // ========== 注意弹窗功能 ==========
        const noticeBtn = document.getElementById('notice-btn');
        const noticeModal = document.getElementById('notice-modal');
        const noticeModalOverlay = document.getElementById('notice-modal-overlay');
        const noticeModalClose = document.getElementById('notice-modal-close');

        noticeBtn.addEventListener('click', () => {
            noticeModal.classList.add('show');
            noticeModalOverlay.classList.add('show');
        });

        function closeNoticeModal() {
            noticeModal.classList.remove('show');
            noticeModalOverlay.classList.remove('show');
        }

        noticeModalClose.addEventListener('click', closeNoticeModal);
        noticeModalOverlay.addEventListener('click', closeNoticeModal);

        // ========== 背景切换功能 ==========
        const bgMap = {
            default: 'https://cropgif.net/videos/1779636693484-76721327-0d04-49bb-8434-1575055c7270.mp4',
            forest: 'https://cropgif.net/videos/1779634874485-e935f579-00dd-45d1-9fca-a53b6bc3cf64.mp4',
            city: 'https://cropgif.net/videos/1779636232052-348a5e63-287e-4f96-bc99-1f44341850f5.mp4',
            beach: 'https://cropgif.net/videos/1779634083695-530b9ec2-2081-4018-8c1d-4c83ae68fd86.mp4',
            irena: 'https://cropgif.net/videos/1779633568063-b9e688df-f229-4025-ac6d-c5074ce8ab44.mp4',
            xiadie: 'https://cropgif.net/videos/1779638331486-3105829a-b6fe-483c-8cfb-e44971c47843.mp4',
            colombia: 'https://cropgif.net/videos/1779676693981-e129d92b-fbd3-4864-b1bf-be97830c2888.mp4'
        };

        const bgToggleBtn = document.getElementById('bg-toggle-btn');
        const bgSidebar = document.getElementById('bg-sidebar');
        const bgSidebarOverlay = document.getElementById('bg-sidebar-overlay');
        const bgSidebarClose = document.getElementById('bg-sidebar-close');
        const bgLoader = document.getElementById('bg-loader');

        bgToggleBtn.addEventListener('click', () => {
            bgSidebar.classList.add('open');
            bgSidebarOverlay.classList.add('show');
            bgToggleBtn.style.opacity = '0';
            bgToggleBtn.style.pointerEvents = 'none';
        });

        function closeBgSidebar() {
            bgSidebar.classList.remove('open');
            bgSidebarOverlay.classList.remove('show');
            bgToggleBtn.style.opacity = '1';
            bgToggleBtn.style.pointerEvents = 'auto';
        }

        bgSidebarClose.addEventListener('click', closeBgSidebar);
        bgSidebarOverlay.addEventListener('click', closeBgSidebar);

        let currentBgKey = 'default';

        function switchBackground(key, btn) {
            if (key === currentBgKey) { closeBgSidebar(); return; }

            // 更新按钮激活状态
            document.querySelectorAll('.bg-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const video = document.getElementById('video-bg');
            const source = document.getElementById('video-source');

            // 显示加载动画（当前背景继续播放）
            bgLoader.classList.add('active');

            // 用临时视频预加载新背景，不影响当前播放
            const tempVideo = document.createElement('video');
            tempVideo.muted = true;
            tempVideo.loop = true;
            tempVideo.preload = 'auto';
            tempVideo.src = bgMap[key];

            tempVideo.oncanplay = function() {
                tempVideo.oncanplay = null;
                // 新视频加载完成，替换主视频
                source.src = bgMap[key];
                video.load();
                video.play().catch(() => {});
                // 隐藏加载动画
                bgLoader.classList.remove('active');
                currentBgKey = key;
            };

            tempVideo.onerror = function() {
                tempVideo.onerror = null;
                // 加载失败，隐藏加载动画，恢复按钮状态
                bgLoader.classList.remove('active');
                document.querySelectorAll('.bg-btn').forEach(b => b.classList.remove('active'));
                document.querySelector('.bg-btn[data-bg="' + currentBgKey + '"]').classList.add('active');
            };

            closeBgSidebar();
        }
    </script>
</body>
</html>
