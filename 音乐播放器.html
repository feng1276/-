    <!-- 引入 FontAwesome 图标库，用于控制按钮的图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #3b82f6;
            --bg-gradient: linear-gradient(135deg, #0f172a, #1e293b);
            --panel-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            color: var(--text-main);
            padding: 20px;
            padding-bottom: 120px;
            position: relative;
            overflow: hidden;
        }

        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0);
            z-index: -1;
        }

        /* 背景加载动画 */
        .bg-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.5);
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .bg-loader.active {
            opacity: 1;
            pointer-events: auto;
        }

        .pl {
            width: 6em;
            height: 6em;
        }

        .pl__ring {
            animation: ringA 2s linear infinite;
        }

        .pl__ring--a { stroke: #f42f25; }
        .pl__ring--b { animation-name: ringB; stroke: #f49725; }
        .pl__ring--c { animation-name: ringC; stroke: #255ff4; }
        .pl__ring--d { animation-name: ringD; stroke: #f42582; }

        @keyframes ringA {
            from, 4% { stroke-dasharray: 0 660; stroke-width: 20; stroke-dashoffset: -330; }
            12% { stroke-dasharray: 60 600; stroke-width: 30; stroke-dashoffset: -335; }
            32% { stroke-dasharray: 60 600; stroke-width: 30; stroke-dashoffset: -595; }
            40%, 54% { stroke-dasharray: 0 660; stroke-width: 20; stroke-dashoffset: -660; }
            62% { stroke-dasharray: 60 600; stroke-width: 30; stroke-dashoffset: -665; }
            82% { stroke-dasharray: 60 600; stroke-width: 30; stroke-dashoffset: -925; }
            90%, to { stroke-dasharray: 0 660; stroke-width: 20; stroke-dashoffset: -990; }
        }

        @keyframes ringB {
            from, 12% { stroke-dasharray: 0 220; stroke-width: 20; stroke-dashoffset: -110; }
            20% { stroke-dasharray: 20 200; stroke-width: 30; stroke-dashoffset: -115; }
            40% { stroke-dasharray: 20 200; stroke-width: 30; stroke-dashoffset: -195; }
            48%, 62% { stroke-dasharray: 0 220; stroke-width: 20; stroke-dashoffset: -220; }
            70% { stroke-dasharray: 20 200; stroke-width: 30; stroke-dashoffset: -225; }
            90% { stroke-dasharray: 20 200; stroke-width: 30; stroke-dashoffset: -305; }
            98%, to { stroke-dasharray: 0 220; stroke-width: 20; stroke-dashoffset: -330; }
        }

        @keyframes ringC {
            from { stroke-dasharray: 0 440; stroke-width: 20; stroke-dashoffset: 0; }
            8% { stroke-dasharray: 40 400; stroke-width: 30; stroke-dashoffset: -5; }
            28% { stroke-dasharray: 40 400; stroke-width: 30; stroke-dashoffset: -175; }
            36%, 58% { stroke-dasharray: 0 440; stroke-width: 20; stroke-dashoffset: -220; }
            66% { stroke-dasharray: 40 400; stroke-width: 30; stroke-dashoffset: -225; }
            86% { stroke-dasharray: 40 400; stroke-width: 30; stroke-dashoffset: -395; }
            94%, to { stroke-dasharray: 0 440; stroke-width: 20; stroke-dashoffset: -440; }
        }

        @keyframes ringD {
            from, 8% { stroke-dasharray: 0 440; stroke-width: 20; stroke-dashoffset: 0; }
            16% { stroke-dasharray: 40 400; stroke-width: 30; stroke-dashoffset: -5; }
            36% { stroke-dasharray: 40 400; stroke-width: 30; stroke-dashoffset: -175; }
            44%, 50% { stroke-dasharray: 0 440; stroke-width: 20; stroke-dashoffset: -220; }
            58% { stroke-dasharray: 40 400; stroke-width: 30; stroke-dashoffset: -225; }
            78% { stroke-dasharray: 40 400; stroke-width: 30; stroke-dashoffset: -395; }
            86%, to { stroke-dasharray: 0 440; stroke-width: 20; stroke-dashoffset: -440; }
        }

        /* 主布局容器 */
        .main-wrapper {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
        }

        /* 播放器主容器 */
        .player-container {
            width: 480px;
            height: 480px;
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border: none;
            border-radius: 24px;
            padding: 24px;
            box-shadow: none;
            margin-left: auto;
        }

        /* 歌曲封面区 */
        .cover-area {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto 24px;
        }

        .cover-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            animation: rotate 20s linear infinite;
            animation-play-state: running;
        }

        /* 播放时封面旋转 */
        .playing .cover-img {
            animation-play-state: running;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 歌曲信息 */
        .track-info {
            text-align: center;
            margin-bottom: 24px;
        }

        .track-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* 进度条样式 */
        .progress-wrapper {
            margin-bottom: 12px;
        }

        .progress-container {
            background: rgba(150, 150, 150, 0.4);
            height: 6px;
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            margin-bottom: 8px;
        }

        .progress-bar {
            background: #ffffff;
            height: 100%;
            width: 0%;
            border-radius: 3px;
            position: relative;
            transition: width 0.1s linear;
        }

        .time-stamps {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #ffffff;
        }

        /* 底部控制栏 */
        .bottom-controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            padding: 16px 40px 24px;
            z-index: 100;
        }

        /* 控制按钮区 */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
        }

        .btn {
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.2s ease;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn:hover {
            background: transparent;
            color: inherit;
            transform: scale(1.1);
        }

        /* 点击时的动态缩放反馈 */
        .btn:active {
            transform: scale(0.9);
        }

        .btn-play-pause {
            font-size: 1.6rem;
            background: transparent;
            width: 56px;
            height: 56px;
            box-shadow: none;
        }

        .btn-play-pause:hover {
            background: transparent;
            color: #fff;
            transform: scale(1.05);
        }

        .btn-play-pause:active {
            transform: scale(0.95);
        }

        .btn.active {
            color: #ffffff;
        }

        /* 音量调节区 */
        .volume-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 4px;
        }

        .volume-slider {
            width: 80px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.1);
            height: 4px;
            border-radius: 2px;
            outline: none;
        }

        .volume-slider::-webkit-slider-runnable-track {
            background: linear-gradient(to right, #ffffff var(--volume-progress, 70%), rgba(255, 255, 255, 0.1) var(--volume-progress, 70%));
            height: 4px;
            border-radius: 2px;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            transition: transform 0.1s;
            margin-top: -4px;
        }

        .volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* 播放列表区 */
        .playlist-container {
            width: 640px;
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border: none;
            border-radius: 24px;
            padding: 24px;
            padding-top: 60px;
            box-shadow: none;
            display: flex;
            flex-direction: column;
        }

        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            font-size: 0.8rem;
            color: #ffffff;
            font-weight: 500;
            letter-spacing: 0.5px;
            margin-top: 8px;
            gap: 100px;
        }

        .playlist-wrapper {
            flex: 1;
            overflow-y: auto;
            margin-top: 8px;
        }

        .playlist-wrapper::-webkit-scrollbar {
            width: 0;
            display: none;
        }

        .playlist-wrapper::-webkit-scrollbar-thumb {
            display: none;
        }



        .playlist-title {
            font-size: 1rem;
            color: var(--text-main);
            margin-bottom: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .playlist-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.95rem;
            margin-bottom: 8px;
            transition: all 0.2s;
            gap: 100px;
            white-space: nowrap;
            background: transparent;
        }

        .playlist-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(4px);
        }

        .playlist-item.current-track {
            background: rgba(255, 215, 0, 0.15);
            color: #ffd700;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(255, 215, 0, 0.2);
        }

        .playlist-item .item-artist {
            font-size: 0.85rem;
            color: var(--text-main);
            flex-shrink: 0;
        }

        .playlist-item.current-track .item-artist {
            color: rgba(255, 215, 0, 0.7);
        }

        /* 左上角背景切换按钮 */
        .bg-toggle-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .bg-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        /* 侧栏 */
        .bg-sidebar {
            position: fixed;
            top: 0;
            left: -320px;
            width: 300px;
            height: 100vh;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 999;
            transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 30px 24px;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        .bg-sidebar.open {
            left: 0;
        }

        .bg-sidebar-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }

        .bg-sidebar-close {
            position: absolute;
            top: 24px;
            right: 20px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .bg-sidebar-close:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .bg-btn {
            display: block;
            width: 100%;
            padding: 14px 18px;
            margin-bottom: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.06);
            color: #ffffff;
            font-size: 0.95rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.25s;
            letter-spacing: 0.3px;
        }

        .bg-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateX(4px);
        }

        .bg-btn.active {
            background: rgba(59, 130, 246, 0.25);
            border-color: rgba(59, 130, 246, 0.5);
            font-weight: 600;
        }

        /* 侧栏遮罩 */
        .bg-sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 998;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s;
        }

        .bg-sidebar-overlay.show {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>

                url: "https://m801.music.126.net/20260523213245/be5f7ee09f298d4db6fa773a1bb6317a/jdymusic/obj/wo3DlMOGwrbDjj7DisKw/28481696159/351a/b0dd/3cf9/b1fa238132a0f066d66b093117017019.mp3?vuutv=aJIykE5dbS0MC8X3GnyEdVxIrY6PGr6K1CWyu6Kx6/HUyGtLkgHuxBZLtsPRL1bth+bsjLk5L7fSCEqVdzbXuqnPpic2KWs6ZLYJQfKJUrtwWEVOBshbIInsFNDyCUgiVO41FO+sz1XH+OjDQDh4AwvnbzcpFNVBCN+FRxGr+Ay6JK5LHX7MQKUD1li06v29uVI8ewJwOJ4/cVH7n1D26zL1qr7+0W4TwudKE1hOJbFXNtNhwMrDNPF8+9NhxVwMvQAN3/dB2DrKy93/mf6IgnHy1PDOMBnWEupUPk4b1NX9IQVrtWEvB/wzHZh6TZSmBXFtoPZcsB7y8Ofalw6agIFmpp+LsNAsX1751ffspYfEzBTb9FKF+KIxvMBbk84P&cdntag=bWFyaz1vc193ZWIscXVhbGl0eV9leGhpZ2g",
                cover: "https://p3.music.126.net/i-7ktILRPImJ0NwiH8DABg==/109951162885959979.jpg?param=300y300"
            },
            {
                title: "His Theme",
                artist: "SToby Fox",
                url: "https://m701.music.126.net/20260523214249/77b6a2529ec3fe0b1e78a8ab126a92e1/jdymusic/obj/wo3DlMOGwrbDjj7DisKw/21437164258/d355/6a28/12af/e83069d0e0486c9928d9309b0c2f3d38.mp3?vuutv=1TFfR94LzuQItmEYVIFVnfGjZbdDwLOgQeUsCwolIuOnB1A7w7x3vY0e/cIOgtHQ3eQ8dPata/BJDjAEnvBe1J3BMJjPRU/Pcbho+5xpeWYNJLZxrwHGgRyZxelCtHeiVPoZ2O8+hSziKRo2PVoOMp/EPTSlX/GwzIBFWe5p478P62JTbsPJLOPpCU2cGXsRr6OUTV1CmB74z1UkyW34L6NL/fX0e5w8Gp1DyDwNlORO2qAfjpU1zq1gT5UYNYX3Rlgx/ew/TsOoiJsxjF0ZhDaXozrh2ZP40/LcybpH5bVTKfUFdMVFK23Vc7BRbC2t+ue9TuOKFkxq8pnXSOY78fp175nFWPYTDskUkouKly5aLYeB+fdD5I9pMasyKdbP&cdntag=bWFyaz1vc193ZWIscXVhbGl0eV9leGhpZ2g",
                cover: "https://p3.music.126.net/mQcab-6L7D-w1lRxmYB7MQ==/109951168015051713.jpg?param=300y300"
            }
        ];

        // 2. 核心状态管理
        let currentTrackIndex = 0;
        let isPlaying = false;
        let playMode = 'all'; // all: 列表循环, one: 单曲循环, shuffle: 随机播放
        let previousVolume = 0.7;

        // 创建音频核心对象
        const audio = new Audio();
        audio.volume = 0.7;

        // 3. 获取 DOM 元素
        const playerContainer = document.getElementById('player-container');
        const coverImg = document.getElementById('cover-img');
        const trackTitle = document.getElementById('track-title');
        const trackArtist = document.getElementById('track-artist');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');
        const currentTimeEl = document.getElementById('current-time');
        const totalDurationEl = document.getElementById('total-duration');
        
        const btnPlayPause = document.getElementById('btn-play-pause');
        const btnPrev = document.getElementById('btn-prev');
        const documentNext = document.getElementById('btn-next');
        const btnMode = document.getElementById('btn-mode');
        const btnMute = document.getElementById('btn-mute');
        const volumeSlider = document.getElementById('volume-slider');
        const playlistContainer = document.getElementById('playlist-container');

        // 4. 初始化应用
        function initPlayer() {
            renderPlaylist();
            loadTrack(currentTrackIndex);
            setupEventListeners();
            updateVolumeProgress(audio.volume);
        }

        // 渲染播放列表UI
        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            trackList.forEach((track, index) => {
                const item = document.createElement('div');
                item.classList.add('playlist-item');
                if(index === currentTrackIndex) item.classList.add('current-track');
                
                item.innerHTML = `
                    <span>${track.title}</span>
                    <span class="item-artist">${track.artist}</span>
                `;
                
                item.addEventListener('click', () => {
                    currentTrackIndex = index;
                    loadTrack(currentTrackIndex);
                    playTrack();
                });
                playlistContainer.appendChild(item);
            });
        }

        // 加载歌曲信息
        function loadTrack(index) {
            const track = trackList[index];
            audio.src = track.url;
            trackTitle.textContent = track.title;
            trackArtist.textContent = track.artist;
            coverImg.src = track.cover;
            
            // 重置进度条
            progressBar.style.width = '0%';
            currentTimeEl.textContent = '00:00';
            totalDurationEl.textContent = '00:00';

            // 更新列表高亮
            document.querySelectorAll('.playlist-item').forEach((item, i) => {
                if(i === index) {
                    item.classList.add('current-track');
                } else {
                    item.classList.remove('current-track');
                }
            });
        }

        // 播放与暂停控制
        function playTrack() {
            isPlaying = true;
            playerContainer.classList.add('playing');
            btnPlayPause.innerHTML = `<i class="fas fa-pause"></i>`;
            
            // 现代浏览器策略：处理潜在的用户未交互就播放的警告
            audio.play().catch(err => {
                console.log("自动播放被阻拦，等待用户点击交互:", err);
                pauseTrack();
            });
        }

        function pauseTrack() {
            isPlaying = false;
            playerContainer.classList.remove('playing');
            btnPlayPause.innerHTML = `<i class="fas fa-play"></i>`;
            audio.pause();
        }

        function togglePlay() {
            if (isPlaying) {
                pauseTrack();
            } else {
                playTrack();
            }
        }

        // 切歌逻辑
        function nextTrack() {
            if (playMode === 'shuffle') {
                currentTrackIndex = Math.floor(Math.random() * trackList.length);
            } else {
                currentTrackIndex = (currentTrackIndex + 1) % trackList.length;
            }
            loadTrack(currentTrackIndex);
            playTrack();
        }

        function prevTrack() {
            if (playMode === 'shuffle') {
                currentTrackIndex = Math.floor(Math.random() * trackList.length);
            } else {
                currentTrackIndex = (currentTrackIndex - 1 + trackList.length) % trackList.length;
            }
            loadTrack(currentTrackIndex);
            playTrack();
        }

        // 格式化时间显示 (秒 -> mm:ss)
        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // 更新进度条与时间文本
        function updateProgress(e) {
            const { duration, currentTime } = e.srcElement;
            if(!duration) return;
            const progressPercent = (currentTime / duration) * 100;
            progressBar.style.width = `${progressPercent}%`;
            currentTimeEl.textContent = formatTime(currentTime);
            totalDurationEl.textContent = formatTime(duration);
        }

        // 手动点击/拖动修改进度
        function setProgress(e) {
            const width = this.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            if(!duration) return;
            audio.currentTime = (clickX / width) * duration;
        }

        // 切换播放模式
        function toggleMode() {
            const modeIcon = btnMode.querySelector('i');
            if (playMode === 'all') {
                playMode = 'one';
                btnMode.title = "单曲循环";
                modeIcon.className = "fas fa-redo-alt"; // 改变图标
            } else if (playMode === 'one') {
                playMode = 'shuffle';
                btnMode.title = "随机播放";
                modeIcon.className = "fas fa-random";
            } else {
                playMode = 'all';
                btnMode.title = "列表循环";
                modeIcon.className = "fas fa-retweet";
            }
        }

        // 歌曲播放结束后的处理
        function onTrackEnd() {
            if (playMode === 'one') {
                audio.currentTime = 0;
                playTrack();
            } else {
                nextTrack();
            }
        }

        // 音量调节
        function updateVolumeProgress(vol) {
            const progress = (vol / 1) * 100;
            volumeSlider.style.setProperty('--volume-progress', progress + '%');
        }

        function handleVolumeChange(e) {
            const vol = e.target.value;
            audio.volume = vol;
            updateMuteIcon(vol);
            updateVolumeProgress(vol);
            if(vol > 0) previousVolume = vol;
        }

        // 一键静音控制
        function toggleMute() {
            if(audio.volume > 0) {
                previousVolume = audio.volume;
                audio.volume = 0;
                volumeSlider.value = 0;
            } else {
                audio.volume = previousVolume;
                volumeSlider.value = previousVolume;
            }
            updateMuteIcon(audio.volume);
            updateVolumeProgress(audio.volume);
        }

        function updateMuteIcon(vol) {
            const muteIcon = btnMute.querySelector('i');
            if (vol == 0) {
                muteIcon.className = "fas fa-volume-mute";
            } else if (vol < 0.5) {
                muteIcon.className = "fas fa-volume-down";
            } else {
                muteIcon.className = "fas fa-volume-up";
            }
        }

        // 5. 事件监听器绑定
        function setupEventListeners() {
            btnPlayPause.addEventListener('click', togglePlay);
            btnPrev.addEventListener('click', prevTrack);
            documentNext.addEventListener('click', nextTrack);
            btnMode.addEventListener('click', toggleMode);
            btnMute.addEventListener('click', toggleMute);
            
            // 音频基础事件
            audio.addEventListener('timeupdate', updateProgress);
            audio.addEventListener('ended', onTrackEnd);
            // 当音频加载好元数据时，顺手刷新总时长
            audio.addEventListener('loadedmetadata', () => {
                totalDurationEl.textContent = formatTime(audio.duration);
            });

            // 进度条点击控制
            progressContainer.addEventListener('click', setProgress);

            // 音量滑动调节
            volumeSlider.addEventListener('input', handleVolumeChange);
        }

        // 启动播放器
        window.addEventListener('DOMContentLoaded', initPlayer);

        // ========== 背景切换功能 ==========
        const bgMap = {
            default: 'https://www.pexels.com/zh-cn/download/video/6345294/',
            forest: 'https://videos.pexels.com/video-files/30226045/12959126_1920_1080_30fps.mp4',
            city: 'https://videos.pexels.com/video-files/35226367/14924164_2560_1440_30fps.mp4',
            beach: 'https://videos.pexels.com/video-files/35630988/15100303_2560_1440_60fps.mp4'
        };

        const bgToggleBtn = document.getElementById('bg-toggle-btn');
        const bgSidebar = document.getElementById('bg-sidebar');
        const bgSidebarOverlay = document.getElementById('bg-sidebar-overlay');
        const bgSidebarClose = document.getElementById('bg-sidebar-close');
        const bgLoader = document.getElementById('bg-loader');

        bgToggleBtn.addEventListener('click', () => {
            bgSidebar.classList.add('open');
            bgSidebarOverlay.classList.add('show');
            bgToggleBtn.style.opacity = '0';
            bgToggleBtn.style.pointerEvents = 'none';
        });

        function closeBgSidebar() {
            bgSidebar.classList.remove('open');
            bgSidebarOverlay.classList.remove('show');
            bgToggleBtn.style.opacity = '1';
            bgToggleBtn.style.pointerEvents = 'auto';
        }

        bgSidebarClose.addEventListener('click', closeBgSidebar);
        bgSidebarOverlay.addEventListener('click', closeBgSidebar);

        let currentBgKey = 'default';

        function switchBackground(key, btn) {
            if (key === currentBgKey) { closeBgSidebar(); return; }

            // 更新按钮激活状态
            document.querySelectorAll('.bg-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const video = document.getElementById('video-bg');
            const source = document.getElementById('video-source');

            // 显示加载动画（当前背景继续播放）
            bgLoader.classList.add('active');

            // 用临时视频预加载新背景，不影响当前播放
            const tempVideo = document.createElement('video');
            tempVideo.muted = true;
            tempVideo.loop = true;
            tempVideo.preload = 'auto';
            tempVideo.src = bgMap[key];

            tempVideo.oncanplay = function() {
                tempVideo.oncanplay = null;
                // 新视频加载完成，替换主视频
                source.src = bgMap[key];
                video.load();
                video.play().catch(() => {});
                // 隐藏加载动画
                bgLoader.classList.remove('active');
                currentBgKey = key;
            };

            tempVideo.onerror = function() {
                tempVideo.onerror = null;
                // 加载失败，隐藏加载动画，恢复按钮状态
                bgLoader.classList.remove('active');
                document.querySelectorAll('.bg-btn').forEach(b => b.classList.remove('active'));
                document.querySelector('.bg-btn[data-bg="' + currentBgKey + '"]').classList.add('active');
            };

            closeBgSidebar();
        }
    </script>
</body>
</html>
